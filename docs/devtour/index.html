plied by\n   `export-graph-bundle`). The old bare fallback silently emitted an\n   ambiguous ref that re-import either rejected\n   (`:packages/ambiguous-ref`) or mis-resolved to a same-named\n   neighbour in the referencing module's own namespace.\"\n  [id ctx]\n  (let [f (get-in ctx [:fns id])\n        n (:name f)]\n    (when n\n      (if (contains? (:dup-names ctx) n)\n        (keyword (or (:namespace-id f) \"\") n)\n        (keyword n)))))","gi":101},{"say":"The EDN-TEXT boundary is the one place those unspellable keywords\n           break, so exactly there they become `#graphden/ref \"lib@…/n\"`\n           tagged literals before `pr-str`; `wire-readers` decodes them back\n           at the package loader and the remote bundle reader. In-memory and\n           JSONB paths keep raw keywords — the storage codec round-trips\n           them.","defn":"encode-unreadable-kws","ns":"graphden.packages.records.wire","n":16,"file":"src/graphden/packages/records/wire.clj","lang":"clj","line":70,"code":"(defn encode-unreadable-kws\n  \"Walk `form` and replace every unreadable qualified keyword with its\n   `#graphden/ref` tagged literal, leaving everything else untouched.\n   Applied to the whole-graph bundle right before `pr-str`; the JSONB\n   publish path keeps raw keywords (its codec round-trips them).\"\n  [form]\n  (walk/postwalk\n    (fn [x]\n      (if (unreadable-kw? x)\n        (tagged-literal 'graphden/ref (subs (str x) 1))\n        x))\n    form))","gi":102},{"say":"Scoped export: a namespace SUBTREE becomes a publishable bundle —\n           fns under the root are the package's content, and this analysis\n           pass turns refs pointing OUT of the subtree into its declared\n           `:dependencies` (what install must already have) plus the\n           `:package-dependencies` those refs' `@`-versioned namespaces map\n           to. The bundle ASSEMBLY around it is graph composition — the\n           `:export-namespace` fn-def in registry/registry/fns.edn. This is\n           the unit the in-graph registry versions.","defn":"external-deps","ns":"graphden.packages.export","n":17,"file":"src/graphden/packages/export.clj","lang":"clj","line":821,"code":"(defn external-deps\n  \"Dependency analysis for the namespace subtree rooted at `root`:\n\n     {:dependencies         [fn-name-kw …]        ; sorted\n      :package-dependencies [{:name :version} …]} ; registry-resolved\n\n   `:dependencies` — fn NAMES referenced from inside the subtree but\n   DEFINED outside it (excluding primitives): structural fn-id refs\n   (parents, slot types, bindings, list items) plus constraint\n   type-name keywords (union / variant / map / tuple / fn-type) that\n   resolve outside the root. `:package-dependencies` — the published\n   packages whose version-qualified namespaces (`X@V`) those external\n   fns live under (drives recursive install).\n\n   ONE records read + index shared by the ref closure and the\n   constraint scan — a cohesive single-pass analysis; the bundle\n   assembly around it is graph composition.\"\n  [storage root]\n  (let [ctx (index-records (graph->records storage))\n        owned-fn-ids (into #{}\n                           (comp (filter #(under-ns? (:namespace-id %) root))\n                                 (map :id))\n                           (vals (:fns ctx)))\n        ;; name index for resolving constraint type-name keywords → ns(s).\n        ;; A name can be defined in SEVERAL namespaces (ADR-identity-model\n        ;; stage 5: names are per-namespace), so key to the SET of defining\n        ;; namespaces — a plain `{name → ns}` map is last-write-wins and would\n        ;; misclassify a duplicated type-name by whichever ns happened to win.\n        name->nss (reduce (fn [m f]\n                            (if (:name f)\n                              (update m (keyword (:name f)) (fnil conj #{}) (:namespace-id f))\n                              m))\n                          {}\n                          (vals (:fns ctx)))\n        ;; External structural fn-id refs reachable from every owned fn —\n        ;; named, defined OUTSIDE the subtree, not a primitive. Collected once\n        ;; so we can derive both the fn-NAME deps and the package deps.\n        external-ref-fn-ids (into #{}\n                                  (comp (mapcat #(fn-ref-fn-ids % ctx))\n                                        (filter (fn [id]\n                                                  (let [f (get-in ctx [:fns id])]\n                                                    (and (:name f)\n                                                         (not (under-ns? (:namespace-id f) root))\n                                                         (not (contains? prim-id->kw id)))))))\n                                  owned-fn-ids)\n        ref-deps (into #{}\n                       (map #(keyword (:name (get-in ctx [:fns %]))))\n                       external-ref-fn-ids)\n        ;; The namespaces those external fns live in — the versioned ones\n        ;; (`X@V`) reverse-map to the packages this bundle depends on.\n        dep-namespaces (into #{}\n                             (keep #(:namespace-id (get-in ctx [:fns %])))\n                             external-ref-fn-ids)\n        ;; constraint type-name keywords (union / variant / map / tuple /\n        ;; fn-type) on owned fn rows whose target is defined outside.\n        ;; Resolve each name against its OWNING fn's namespace (kept alongside\n        ;; via the per-fn scan) so a duplicated type-name isn't misclassified.\n        constraint-deps (into #{}\n                              (mapcat (fn [id]\n                                        (let [f (get-in ctx [:fns id])\n                                              owner-ns (:namespace-id f)]\n                                          (for [nm (constraint-type-names (:constraint f))\n                                                :let [rns (constraint-type-ns name->nss root nm owner-ns)]\n                                                :when (and rns (not (under-ns? rns root)))]\n                                            nm))))\n                              owned-fn-ids)]\n    {:dependencies (vec (sort (into ref-deps constraint-deps)))\n     :package-dependencies (package-deps-from-namespaces storage dep-namespaces)}))","gi":103},{"say":"The share-safety policy: vault paths are STRIPPED from bundles by\n           default (the slot stays a free `[:secret :text]` arg) and the\n           `:secrets` manifest lists what was affected — the publisher sees\n           the warning, the installer gets a `:needs-definition` todo. A\n           bundle is deliberately not a full copy of your secrets.","defn":"strip-secret-paths","ns":"graphden.packages.export","n":18,"file":"src/graphden/packages/export.clj","lang":"clj","line":683,"code":"(defn strip-secret-paths\n  \"Remove vault paths from exported fn-defs. A `{:secret-path …}`\n   arg-value loses its `:secret-path` key; when nothing else remains the\n   arg entry is dropped entirely, so the slot reverts to a FREE arg of\n   its (secret-typed) slot — the type system then surfaces 'needs a\n   secret defined' at the importer's side instead of silently carrying\n   the exporter's vault topology.\"\n  [fn-defs]\n  (mapv (fn [fd]\n          (if-let [args (:args fd)]\n            (let [args' (into {}\n                              (keep (fn [[k v]]\n                                      (if (and (map? v) (contains? v :secret-path))\n                                        (when-let [rest-v (not-empty (dissoc v :secret-path))]\n                                          [k rest-v])\n                                        [k v])))\n                              args)]\n              (if (seq args') (assoc fd :args args') (dissoc fd :args)))\n            fd))\n        fn-defs))","gi":104},{"say":"Publish lands the bundle IN the graph: an immutable, content-hashed\n           `:package-version` row (name + semver + fns + declared deps).\n           Install is its mirror — `materialize-package-fns` syncs the pinned\n           version's fns into a version-qualified `@`-namespace and writes a\n           `:package-install` pin; update/rollback rewrites refs between\n           versions; fork copies copy-on-write with no pin.","defn":"publish-package-apply","ns":"resources/packages/registry/registry/impls.clj","n":19,"file":"resources/packages/registry/registry/impls.clj","lang":"clj","line":111,"code":"(defbase publish-package-apply\n  [pkg-name pkg-version bundle pkg-public]\n  ;; Authz chokepoint: publishing to an ORG's registry requires the\n  ;; `:publish-packages` org capability. Guard the deepest effectful core so\n  ;; NO route (JSON or panel) can bypass it. Single-tenant-safe via the\n  ;; platform-tier short-circuit — mirrors the `:view-all-stats` precedent in\n  ;; app/execution/impls.clj; the org-cap seam is default-deny without the\n  ;; tenancy addon, so the short-circuit keeps self-hosted/operator publishing\n  ;; open. `:authz/forbidden` → 403 in the tenancy request-scope wrapper.\n  (when-not (or (tc/current-platform-tier?)\n                (tc/current-has-org-cap? :publish-packages))\n    (throw (ex-info \"Publishing requires the publish-packages capability.\"\n                    {:type :authz/forbidden :capability :publish-packages})))\n  (cr/record-effect! :db)\n  (cr/record-effect! :time)\n  (let [storage (request/require-storage ctx)\n        fns (:fns bundle)]\n    (when-not (seq (sp/query-entities storage :package-version\n                                      {:name pkg-name :version pkg-version}))\n      ;; Public = the explicit opt-in OR a platform-tier publish\n      ;; (single-tenant / operator — the shared registry). Normalised\n      ;; AT WRITE time so readers never re-derive tier from org-id:\n      ;; a row is platform-visible iff `:public?` is true. A tenant\n      ;; publish without the opt-in stays private to its org\n      ;; (`:org-id` stamped by the tenancy decorator, spec §5).\n      (sp/create-entity storage :package-version\n                        {:name pkg-name\n                         :version pkg-version\n                         :ns-root (:namespace bundle)\n                         :fns fns\n                         :dependencies (:dependencies bundle)\n                         :package-dependencies (:package-dependencies bundle)\n                         :secrets (vec (:secrets bundle))\n                         :content-hash (ids/digest-hex \"SHA-256\" (json/generate-string fns))\n                         ;; Same value the tenancy decorator stamps when\n                         ;; scoped (it overwrites with `(tc/current-org)`\n                         ;; too) — set here as well so SINGLE-TENANT rows\n                         ;; carry the public org instead of NULL and the\n                         ;; governance catalog's org-equality filter works\n                         ;; identically with and without the addon.\n                         :org-id (tc/current-org)\n                         :public? (boolean (or pkg-public (tc/current-platform-tier?)))\n                         :published-at (java.time.Instant/now)}))))","gi":105}]},{"id":":boot","title":"Boot & lifecycle","status":"toured","summary":"How the process starts: the Integrant component graph, the Aero\n             config + addon manifest, and the router seams installed at boot.","paths":["src/graphden/executor_runtime/","src/graphden/system/"],"after":[":storage",":packages"],"steps":[{"say":"**Where the JVM starts.** Four lines that say what a graphden\n           process IS: boot the Integrant system, install a shutdown hook,\n           optionally open an nREPL (`GRAPHDEN_NREPL_PORT` — the door the\n           `clojure` MCP tools come through), then park forever. Nothing\n           here serves HTTP; the web server is a `:service` row the\n           reconciler starts, several components down.","defn":"-main","ns":"graphden.executor-runtime.core","n":1,"file":"src/graphden/executor_runtime/core.clj","lang":"clj","line":187,"code":"(defn -main\n  \"Main entry point for the executor runtime.\"\n  [& _args]\n  (boot!)\n  (install-shutdown-hook!)\n  (maybe-start-nrepl!)\n  (log/info \"Server running. Press Ctrl+C to stop.\")\n  (block-forever!))","gi":106,"see":[{"gi":107,"label":"boot!"},{"gi":151,"label":"reconcile-once!"}]},{"say":"Start, or HALT the partial system and exit non-zero. Integrant does\n           NOT auto-halt when an init-key throws, and several components have\n           already spawned non-daemon threads by then — without this the JVM\n           stays half-alive with no shutdown hook and `/health` can pass on a\n           boot that actually failed. The partial system rides in the ex-info's\n           `:system` key. Read the docstring: it is the incident this function\n           exists for.","defn":"boot!","ns":"graphden.executor-runtime.core","n":2,"file":"src/graphden/executor_runtime/core.clj","lang":"clj","line":167,"code":"(defn boot!\n  \"Start the system, or HALT the partial system and exit non-zero on a\n   boot failure. Integrant does NOT auto-halt when an init-key throws —\n   without this, already-started non-daemon threads (the httpkit\n   web-server via the reconciler, the ticker / cleanup / alerter /\n   fleet schedulers) keep the JVM half-alive with NO shutdown hook\n   installed, and `/health` can pass (registry warm) while boot\n   actually failed. The partial system rides in the ex-info's\n   `:system` key.\"\n  []\n  (try\n    (start! :prod)\n    (catch clojure.lang.ExceptionInfo e\n      (log/error e \"boot failed — halting the partial system and exiting\")\n      (when-let [partial (:system (ex-data e))]\n        (try (ig/halt! partial)\n             (catch Exception t (log/warn t \"partial-system halt failed\"))))\n      (exit! 1))))","gi":107},{"say":"Configuration is data: Aero reads `system-<profile>.edn`\n           (`:dev` / `:test` / `:prod`) with `#ig/ref` and `#var` reader tags\n           registered above, then deep-merges any ADDON config fragments named\n           in `GRAPHDEN_ADDON_CONFIGS`. That merge is the open-core seam\n           (docs/TENANCY_SEAM.md § Addon config manifest) — the private tenancy\n           addon REDEFINES core keys and ADDS its own without a single edit to\n           this repo. With no addons the merge is a no-op.","defn":"read-config","ns":"graphden.system.config","n":3,"file":"src/graphden/system/config.clj","lang":"clj","line":83,"code":"(defn read-config\n  \"Reads system configuration for the given profile (`:dev` / `:test` /\n   `:prod`), then deep-merges any addon config fragments (default: from\n   `GRAPHDEN_ADDON_CONFIGS`; pass `addon-resources` explicitly in tests).\n   Returns an Integrant configuration map.\"\n  ([profile]\n   (read-config profile (addon-config-resources)))\n  ([profile addon-resources]\n   (let [filename (str \"system-\" (name profile) \".edn\")\n         resource (io/resource filename)]\n     (when-not resource\n       (throw (ex-info (str \"Config file not found: \" filename)\n                       {:profile profile\n                        :filename filename})))\n     (reduce (fn [cfg res] (merge-addon cfg profile res))\n             (aero/read-config resource {:profile profile})\n             addon-resources))))","gi":108,"see":[{"gi":161,"label":"platform-tier?"}]},{"say":"`(ig/init (read-config profile))` — that is the whole system\n           lifecycle. The component graph and its dependency edges are\n           documented in `graphden.system.core`'s docstring, which exists\n           only to `:require` the seven `init.*` namespaces for their\n           `defmethod` side effects, so every `ig/init-key` is registered\n           before this call. The next four steps walk that graph in\n           dependency order.","defn":"start!","ns":"graphden.system.interface","n":4,"file":"src/graphden/system/interface.clj","lang":"clj","line":38,"code":"(defn start!\n  \"Starts the system with given profile. Returns running system map.\n\n   Optionally accepts component-keys to start only subset of components:\n   (start! :prod [:db/age :db/versioned])\"\n  ([profile]\n   (ig/init (read-config profile)))\n  ([profile component-keys]\n   (ig/init (read-config profile) component-keys)))","gi":109},{"say":"The first component with a socket (`:db/schema` before it is pure —\n           it is the `create-builder` + `extend-builder` chain from the\n           storage block): open the Postgres pool, run\n           `initialize-with-cleanup!` against that schema, seed traits. Note\n           `:datasource-wrap` — a `DataSource → DataSource` fn the tenancy\n           addon supplies so every connection carries `graphden.current_org`\n           for row-level security. Absent in core: a plain pool. `:db/versioned`\n           wraps this one in the versioning decorator.","defn":"postgres","ns":"graphden.system.init.storage","n":5,"file":"src/graphden/system/init/storage.clj","lang":"clj","line":98,"code":"(defmethod ig/init-key :db/postgres [_ {:keys [datasource-wrap] :as opts}]\n  ;; `:datasource-wrap` (a fn DataSource→DataSource) is the tenancy addon's\n  ;; RLS seam (§3.0 B5 ops wiring) — it wraps the pool so every connection\n  ;; carries `graphden.current_org`. Absent in core → plain pool.\n  (let [storage (init-storage! \"PostgreSQL\" postgres/create-storage\n                               (dissoc opts :datasource-wrap))]\n    (cond-> storage\n      datasource-wrap (assoc :pool (datasource-wrap (:pool storage))))))","gi":110,"see":[{"gi":32,"label":"wrap-with-versioning"}]},{"say":"Load the package set — core + web + app, plus the addon's\n           `:extra-package-names` (the fns-channel seam) and any external\n           Type-2 packages from the operator manifest. Its two siblings just\n           below, `:exec/base-fns` and `:exec/fn-entities`, are thin shells\n           over `graphden.packages.sync` — this is where **the graph gets its\n           content** on every boot.","defn":"packages","ns":"graphden.system.init.packages","n":6,"file":"src/graphden/system/init/packages.clj","lang":"clj","line":17,"code":"(defmethod ig/init-key :app/packages [_ {:keys [package-names extra-package-names]}]\n  ;; `:extra-package-names` is the addon fns-channel seam (docs/TENANCY_SEAM.md\n  ;; § Packages channel): the tenancy addon appends its own fns-package(s) — e.g.\n  ;; the org-admin UI — via the manifest WITHOUT restating the core list,\n  ;; so they load only when the addon is active.\n  (let [names (vec (concat package-names extra-package-names\n                           (manifest/package-names (manifest/read-manifest))))]\n    (log/info \"Loading packages:\" names)\n    (let [packages (pkg/load-packages names)]\n      (log/info \"Packages loaded:\" (count (:packages packages)) \"packages,\"\n                (count (:base-fn-defs packages)) \"base-fns,\"\n                (count (:fn-defs packages)) \"fn-defs\")\n      packages)))","gi":111,"see":[{"gi":88,"label":"load-packages"},{"gi":99,"label":"sync-fn-entities-from-packages!"}]},{"say":"Assembles the one `ExecutionContext` the whole process runs\n           against, and it reads as a list of the seams core exposes:\n           auth-provider, request-scope, execute-guard, vault client,\n           notify-emitter, fleet forward-hop, and `:compile-storage` — the\n           privileged org-agnostic handle `rebuild!` reads the graph\n           STRUCTURE through, while data reads stay org-scoped. In\n           single-tenant every one of these is the default and the `cond->`\n           tail is a no-op.","defn":"context","ns":"graphden.system.init.exec","n":7,"file":"src/graphden/system/init/exec.clj","lang":"clj","line":106,"code":"(defmethod ig/init-key :exec/context\n  [_ {:keys [storage vault-client pg-storage base-fns auth-provider request-scope\n             execute-guard app-router verify-domain user-ops\n             my-tokens executor-orgs byo-executor? executor-id notify-listener]}]\n  (log/info \"Creating executor context...\")\n  ;; `assoc` (not the constructor's named opts) — the ExecutionContext\n  ;; record stays narrow; vault rides on the extra-key surface\n  ;; alongside `:compiled-templates`. Impls grab it via `(:vault ctx)`.\n  ;;\n  ;; `:notify-emitter` is built from the raw PG pool — short-lived\n  ;; `SELECT pg_notify(...)` runs through the main pool just like\n  ;; any other one-shot query. CRUD writers call\n  ;; `((:notify-emitter ctx) event)` after a successful `:service`\n  ;; row mutation. Falls back to a no-op when pg-storage is absent\n  ;; (tests that don't wire PG).\n  ;;\n  ;; `:base-fns` comes via integrant ref from `:exec/base-fns` —\n  ;; ctx-scoped (no global registry read). When the ref isn't wired\n  ;; (older config files or tests that skip `:exec/base-fns`),\n  ;; `create-context` falls back to the global registry snapshot.\n  (let [emitter (if pg-storage\n                  (pg-notify/make-emitter (:pool pg-storage))\n                  pg-notify/noop-emitter)\n        ;; Fleet forward-hop seam (T2.6): only wired when this pod has a fleet\n        ;; identity (`GRAPHDEN_EXECUTOR_ID`). Forwards a misdirected request to\n        ;; the executor holding the org's cell (per `:placement`) instead of\n        ;; 421. All executors listen on the same port (`GRAPHDEN_PORT`).\n        fleet-forward (when (seq executor-id)\n                        (let [port (fleet-command/fleet-port)]\n                          (fn [request org entry-fn-id]\n                            (fleet-router/forward-or-nil storage executor-id port\n                                                         org entry-fn-id request))))\n        ;; Fleet control-plane command seam (docs/FLEET_RFC.md §6.3): the\n        ;; internal cell load/evict endpoint a move (or an ops call) drives.\n        ;; Wired on the same condition as the forward-hop (this pod is a fleet\n        ;; member). Gated by the shared internal token, NOT the tenant auth-\n        ;; provider — a cell command is cross-org platform authority.\n        fleet-cmd (when (seq executor-id)\n                    (fleet-command/make-command-handler (fleet-command/internal-token)))\n        ctx-opts (cond-> {:storage storage}\n                   (and base-fns (:base-fns base-fns))\n                   (assoc :base-fns (:base-fns base-fns))\n                   ;; The auth seam — read by `:authenticate-request` via\n                   ;; `(:auth-provider ctx)`. Branch contexts inherit it\n                   ;; (build-branch-ctx).\n                   auth-provider (assoc :auth-provider auth-provider)\n                   ;; Request-scope seam (§3.0 B4) — wrapped around each\n                   ;; handler by the branch-router. Only the tenancy addon\n                   ;; wires it; absent in core (single-tenant).\n                   request-scope (assoc :request-scope request-scope)\n                   ;; Per-namespace execute guard (§4.2). Addon-only.\n                   execute-guard (assoc :execute-guard execute-guard)\n                   ;; App-router seam (§3.4 FaaS) — serves a tenant's subdomain\n                   ;; via that org's handler fn. Addon-only.\n                   app-router (assoc :app-router app-router)\n                   ;; Self-serve DNS-verify seam (§3.4 #2) — addon-only.\n                   verify-domain (assoc :verify-domain verify-domain)\n                   ;; User-model seam — create-user / login. Addon-only.\n                   user-ops (assoc :user-ops user-ops)\n                   ;; Self-serve API-token seam — mint/list/revoke a tenant's\n                   ;; own long-lived bearers. Addon-only.\n                   my-tokens (assoc :my-tokens my-tokens)\n                   ;; Executor shard — the orgs whose fns THIS pod compiles.\n                   ;; Absent ⇒ the whole graph (self-hosted / single-tenant).\n                   ;; A collection or predicate from an addon passes through;\n                   ;; a comma-separated env string is parsed here.\n                   executor-orgs\n                   (assoc :executor-orgs (if (string? executor-orgs)\n                                           (parse-executor-orgs executor-orgs)\n                                           executor-orgs))\n                   ;; Pod role — a BYO executor serves the `:byo` orgs in its\n                   ;; shard; a hosted pod 421s them. From `GRAPHDEN_BYO_EXECUTOR`\n                   ;; (parsed to bool) or an addon override.\n                   byo-executor?\n                   (assoc :byo-executor? (if (string? byo-executor?)\n                                           (contains? #{\"true\" \"1\" \"yes\"} byo-executor?)\n                                           (boolean byo-executor?)))\n                   ;; Fleet forward-hop seam — only present when this pod has a\n                   ;; fleet identity (see the let above).\n                   fleet-forward (assoc :fleet-forward fleet-forward)\n                   ;; Fleet control-plane command seam — same condition.\n                   fleet-cmd (assoc :fleet-command fleet-cmd))]\n    (cond-> (-> (exec/create-context ctx-opts)\n                (assoc :notify-emitter emitter))\n      vault-client (assoc :vault vault-client)\n      ;; The LISTEN side of the NOTIFY pair — event-driven SSE\n      ;; (`:sse-stream` :wake-on-writes) registers per-stream\n      ;; callbacks here. Absent in tests without PG wiring.\n      notify-listener (assoc :notify-listener notify-listener)\n      ;; Privileged structural-read storage (§4 org-agnostic compile): the raw\n      ;; PG beneath OrgScoped, re-wrapped for this branch. `rebuild!` reads the\n      ;; fn-graph STRUCTURE through it so the compiled registry contains every\n      ;; org's fns (isolation stays at runtime: org-scoped data reads via\n      ;; `:storage` + the `resolve-fn` / execute-guard gates). `:pg-storage`\n      ;; rides too so `build-branch-ctx` can build a per-branch compile storage.\n      ;; In single-tenant this equals `:storage` (no OrgScoped) → a no-op.\n      pg-storage (assoc :pg-storage pg-storage\n                        :compile-storage (vs/->VersionedStorage\n                                           pg-storage (vs/current-branch-id storage))))))","gi":112,"see":[{"gi":2,"label":"create-context"}]},{"say":"Two lines with a ~50s cost: compile every fn in the graph into a\n           closure BEFORE the first request. This is the eager half of the\n           executor's compile-once story — after this key, `registry` in the\n           hot path is a warm holder read, never a cold compile.","defn":"compiled-registry","ns":"graphden.system.init.exec","n":8,"file":"src/graphden/system/init/exec.clj","lang":"clj","line":215,"code":"(defmethod ig/init-key :exec/compiled-registry [_ {:keys [context]}]\n  (log/info \"Building compiled registry...\")\n  (let [registry (cr/rebuild! context)]\n    (log/info \"Compiled registry built:\" (count registry) \"fns\")\n    registry))","gi":113,"see":[{"gi":4,"label":"rebuild!"},{"gi":3,"label":"registry"}]},{"say":"The last boot-time seam. Optional subsystems (the `registry`\n           package, `/mcp`) and the tenancy addon each install a\n           `:router-or-nil` Ring callable here under a distinct key; the core\n           handler chain tries them in turn and falls through to the app\n           router on `nil`. With nothing installed the collection is `{}`,\n           this short-circuits, and single-tenant behaviour is byte-for-byte\n           unchanged — the shape every seam in this codebase aims for.","defn":"dispatch-first","ns":"graphden.system.route-collection","n":9,"file":"src/graphden/system/route_collection.clj","lang":"clj","line":89,"code":"(defn dispatch-first\n  \"Invoke each installed router on `request` in turn, returning the first\n   non-nil response, or `nil` when none match (or the collection is\n   empty). Nil-safe: an empty collection returns `nil` directly, so the\n   caller falls through without touching any subsystem.\"\n  [request]\n  (some (fn [router] (router request)) (vals (current-collection))))","gi":114}]},{"id":":web","title":"Web — routing & the page runtime","status":"toured","summary":"HTTP from socket to response body: routing, middleware as graph\n             fns, the hiccup page runtime, and the APIs the editor reads.","paths":["resources/packages/web/","resources/packages/mcp/","src/graphden/crud/types_api.clj"],"after":[":packages",":boot"],"steps":[{"say":"The http-kit wrapper base-fn: `run-server` spins the listener thread\n           and binds the composed Ring handler to a port, recording `:network` /\n           `:process` effects. Where a request first enters the web layer, so the\n           natural first stop. Note it is a tiny primitive — everything else is\n           composed from small base-fns in `web/http/fns.edn`.","defn":"http-server","ns":"resources/packages/web/http/impls.clj","n":1,"file":"resources/packages/web/http/impls.clj","lang":"clj","line":238,"code":"(defbase http-server\n  [handler port]\n  (cr/record-effect! :network)\n  ;; :process — http-kit spawns a listener thread that lives past\n  ;; this call. The returned stopper kills it; service registry's\n  ;; validate-create requires :process for service-eligibility.\n  (cr/record-effect! :process)\n  ;; Request-scoped graph-epoch bump log (library-adapter boundary\n  ;; plumbing, not composition): every write inside this request logs\n  ;; its bump; the eager-invalidation tail drains + notes it. An\n  ;; aborted request unwinds the binding, its bumps age un-noted, and\n  ;; the router's grace-expiry heal covers them — a reused pool thread\n  ;; can never note a dead request's bumps.\n  (http-kit/run-server\n    (fn [req]\n      ;; Each request is a NEW logical execution: run the build-captured\n      ;; handler under a fresh per-request call-cache. Without this every\n      ;; concurrent request reuses the ONE HashMap the handler captured at\n      ;; build time — a ConcurrentModificationException under load (eviction\n      ;; racing a concurrent put) plus a cross-request memo leak. See\n      ;; compile-eager/*request-call-cache*.\n      (cr/with-fresh-call-cache\n        (fn []\n          (binding [epoch/*request-bump-log* (atom [])]\n            (handler req)))))\n    (assoc (http-server-tuning) :port port)))","gi":115},{"say":"Fully realizes the incoming request body so downstream graph handlers\n           see plain data instead of a one-shot stream — the very next thing that\n           happens to a raw request after it lands.","defn":"realize-request-body","ns":"resources/packages/web/http/impls.clj","n":2,"file":"resources/packages/web/http/impls.clj","lang":"clj","line":136,"code":"(defbase realize-request-body\n  [request]\n  (realize-body request))","gi":116},{"say":"Composes the compiled reitit router with the default handler into the\n           single Ring callable http-kit actually invokes per request. The seam\n           between the server socket and routing.","defn":"ring-handler-fn","ns":"resources/packages/web/reitit/impls.clj","n":3,"file":"resources/packages/web/reitit/impls.clj","lang":"clj","line":46,"code":"(defbase ring-handler-fn\n  \"Compose a compiled reitit router and a default handler into the\n   final Ring-handler callable that http-kit invokes per request.\"\n  [router default-handler]\n  (ring/ring-handler router default-handler))","gi":117},{"say":"Builds the bare `reitit.ring/router` from route data — which is itself\n           graph-composed vectors and keywords. This is the routing table the\n           handler consults to match a path to a handler.","defn":"ring-router-fn","ns":"resources/packages/web/reitit/impls.clj","n":4,"file":"resources/packages/web/reitit/impls.clj","lang":"clj","line":22,"code":"(defbase ring-router-fn\n  \"Bare `(reitit.ring/router routes)`. The caller is expected to hand\n   in reitit-shaped data (vectors + keyword keys). Graph-side coercion\n   (vec'ing lazy `:seq` bindings, keywordizing string map-keys) is now\n   a separate fn-def `:_router-coerced-routes` in fns.edn — sites that\n   compose routes via graph primitives route their data through that\n   coercer before binding it here.\"\n  [routes]\n  (ring/router routes))","gi":118},{"say":"Constructs the fallback handler reitit uses when nothing matches,\n           wrapping the graph-composed 404 / 405 / 406 response maps. The `no\n           route` branch.","defn":"ring-create-default-handler-fn","ns":"resources/packages/web/reitit/impls.clj","n":5,"file":"resources/packages/web/reitit/impls.clj","lang":"clj","line":33,"code":"(defbase ring-create-default-handler-fn\n  \"Build a Ring handler that reitit falls back to when no route matches.\n   Takes the three slot-specific Ring RESPONSE maps directly — wraps\n   each in `constantly` to satisfy reitit's `(handler request)`\n   contract here at the adapter, so the fn-graph composes responses\n   (pure data) without having to thread `:make-handler` per slot.\"\n  [not-found-response method-not-allowed-response not-acceptable-response]\n  (ring/create-default-handler\n    {:not-found          (constantly not-found-response)\n     :method-not-allowed (constantly method-not-allowed-response)\n     :not-acceptable     (constantly not-acceptable-response)}))","gi":119},{"say":"The middleware factory: turn a graph `body` (with `:request` and\n           `:next-handler` free args) into a reitit `{:name :wrap}` spec folded\n           around each route handler. How cross-cutting logic — like the\n           branch-routing wrap next — is expressed as a graph fn.","defn":"middleware","ns":"resources/packages/web/reitit/impls.clj","n":6,"file":"resources/packages/web/reitit/impls.clj","lang":"clj","line":64,"code":"(defbase middleware\n  \"Produces a reitit-compatible middleware spec. `body` is a fn-graph\n   with TWO leftover free args (`:request` and `:next-handler`) — the\n   compiler builds a map-callable for it. We populate both keys per\n   request: `:request` is reitit's request, `:next-handler` is the\n   next link in the chain. `body` is responsible for routing them via\n   `:proceed` (a fn-def, not an impl).\"\n  [name body]\n  {:name name\n   :wrap (fn [handler]\n           (fn [request]\n             (body {:request request, :next-handler handler})))})","gi":120},{"say":"Reads the currently-installed per-branch router from a global atom\n           (nil before boot installs it). The branch-routing wrap needs this\n           router first.","defn":"current-branch-router","ns":"resources/packages/web/branch-router/impls.clj","n":7,"file":"resources/packages/web/branch-router/impls.clj","lang":"clj","line":10,"code":"(defbase current-branch-router\n  \"Read the currently-installed branch router (nil when no router has\n   been installed yet — test paths, or the brief window before\n   `:exec/branch-router` fires). Single global-atom deref.\"\n  []\n  (br/current-router))","gi":121},{"say":"The branch-routing wrap: delegate the Ring request to the correct\n           per-branch handler resolved from the router above. This is how ONE\n           server multiplexes requests across branch-scoped graphs — the package\n           side of the versioning block's `dispatch*`.","defn":"dispatch-to-branch","ns":"resources/packages/web/branch-router/impls.clj","n":8,"file":"resources/packages/web/branch-router/impls.clj","lang":"clj","line":18,"code":"(defbase dispatch-to-branch\n  \"Delegate a Ring request to the appropriate per-branch handler\n   resolved by the supplied router. Single library call.\"\n  [router request]\n  ;; Tagged `:network` in fns.edn — the dispatched handler runs HTTP\n  ;; processing. Record explicitly so the audit-trail at this layer\n  ;; doesn't depend on what the downstream handler happens to record\n  ;; (effect-sets are idempotent over union, so double-recording is\n  ;; harmless if the handler also tags :network).\n  (cr/record-effect! :network)\n  (br/dispatch router request))","gi":122,"see":[{"gi":50,"label":"dispatch*"}]},{"say":"The auth gate applied to a request inside the handler chain before a\n           page or action runs. Sits between routing/dispatch and the handler\n           body that will build a response.","defn":"authenticate-request","ns":"resources/packages/web/ring-adapter/impls.clj","n":9,"file":"resources/packages/web/ring-adapter/impls.clj","lang":"clj","line":12,"code":"(defbase authenticate-request\n  [request]\n  ;; Delegate to the injected provider. Defensive: a context with no\n  ;; provider wired authenticates NOTHING (secure default) rather than\n  ;; throwing — so any half-configured ctx fails closed.\n  (if-let [provider (:auth-provider ctx)]\n    (auth/authenticate provider request)\n    {:authenticated? false}))","gi":123},{"say":"The generic `[tag attrs children]` constructor behind the graph-native\n           page runtime. User-composed pages are fn-defs (`:html-page`,\n           components) that emit hiccup through this primitive — including the\n           `data-action` attrs that the editor's JavaScript runtime\n           (`resources/packages/app/editor/*.js`) binds on click — alongside the `hx-*`\n           attrs whose server-rendered `/partials/*` fragments now carry\n           logic that once lived in that JS. Where a user's\n           page becomes a concrete hiccup tree.","defn":"hiccup-element","ns":"resources/packages/web/html/impls.clj","n":10,"file":"resources/packages/web/html/impls.clj","lang":"clj","line":26,"code":"(defbase hiccup-element\n  [tag attrs children]\n  (let [tag-kw (if (keyword? tag) tag (keyword tag))]\n    (into (if attrs [tag-kw attrs] [tag-kw]) children)))","gi":124,"see":[{"gi":142,"label":"bindActionDispatch"},{"gi":143,"label":"loadPartial"}]},{"say":"Wraps a string in a hiccup `RawString` so inline script / style bodies\n           (like the editor's bundled JS / CSS) render verbatim instead of being\n           HTML-escaped. The escape hatch that lets a composed page embed the JS\n           frontend without mangling it.","defn":"h-raw","ns":"resources/packages/web/html/impls.clj","n":11,"file":"resources/packages/web/html/impls.clj","lang":"clj","line":18,"code":"(defbase h-raw\n  \"Wrap `:string` in a hiccup `RawString` so `:render-hiccup` emits it\n   verbatim — no HTML entity escaping. Used inside `<script>` / `<style>`\n   bodies where escaping would mangle the content. Single library call.\"\n  [string]\n  (h/raw string))","gi":125},{"say":"Serializes the assembled hiccup tree into an HTML string, with a\n           taint-propagation rule so rendered secrets stay redacted. The point\n           where a graph-composed page turns into the response body.","defn":"render-hiccup","ns":"resources/packages/web/html/impls.clj","n":12,"file":"resources/packages/web/html/impls.clj","lang":"clj","line":13,"code":"(defbase render-hiccup\n  [hiccup]\n  (str (h/html hiccup)))","gi":126},{"say":"The outbound finalizer is a graph composition now — `:process-response`\n           in web/http/fns.edn stringifies headers, applies the `Connection: close`\n           policy, and encodes the body, all as fn-defs over single-call\n           primitives. This RFC 7231 Accept-Encoding negotiation is the one\n           self-contained parse the pipeline keeps in Clojure; the DECISION to\n           encode (thresholds, compressible pattern) lives in the graph. The last\n           stop as the rendered page leaves the web layer back through http-kit.","defn":"pick-encoding-fn","ns":"resources/packages/web/http/impls.clj","n":13,"file":"resources/packages/web/http/impls.clj","lang":"clj","line":158,"code":"(defbase pick-encoding-fn\n  \"Content negotiation over `Accept-Encoding` (RFC 7231 §5.3) —\n   returns \\\"br\\\" when brotli is acceptable, else \\\"gzip\\\" when gzip\n   is, else \\\"identity\\\". q=0 forbids a coding; tokens are\n   case-insensitive. Single self-contained parse — the DECISION to\n   encode (and with what thresholds) lives in the graph.\"\n  [headers]\n  (let [h (header-ci headers \"Accept-Encoding\")]\n    (cond\n      (encoding-acceptable? h \"br\")   \"br\"\n      (encoding-acceptable? h \"gzip\") \"gzip\"\n      :else                           \"identity\")))","gi":127},{"say":"The server-side type-picker sweep behind\n           `/partials/compatible-type-options`. It filters the\n           `type-name-kinds` roster to the names that can legally narrow\n           `expected` in ONE alias-aware `subtype?` pass — replacing the\n           editor's former per-name fan-out of ~50 parallel\n           `POST /api/types/compatible` requests per picker open. The\n           graph-first migration's clearest case: a client loop collapses\n           into one server render.","defn":"compatible-type-names","ns":"graphden.crud.types-api","n":14,"file":"src/graphden/crud/types_api.clj","lang":"clj","line":157,"code":"(defn compatible-type-names\n  \"`type-name-kinds` rows filtered to the names that can legally\n   narrow `expected` — `(subtype? (keyword name) expected)`, the same\n   alias-aware predicate `/api/types/compatible` answers per pair.\n   One call replaces the editor's former per-name fan-out (~50\n   parallel POSTs per type-picker open).\"\n  [ctx expected]\n  (filterv #(types/subtype? (keyword (:name %)) expected)\n           (type-name-kinds ctx)))","gi":128},{"say":"The `/api/types` wire-shaping layer the editor loads at boot and\n           after every mutation: the augmented rich-type snapshot with\n           `bulk-omitted-fields` stripped from each entry. The old\n           `?fn=<name>` per-fn full-entry backfill is gone with its only\n           client consumer — the return-type-rule popover is a server\n           partial now, and the layout strip facts read the raw registry\n           directly. How the type-checker's registry reaches the browser as\n           a lean payload.","defn":"api-rich-types","ns":"graphden.crud.types-api","n":15,"file":"src/graphden/crud/types_api.clj","lang":"clj","line":722,"code":"(defn api-rich-types\n  \"Body of the `api-rich-types` base-fn — the wire-shaping layer over\n   the augmented snapshot: the lean BULK payload the editor loads at\n   boot + after each mutation, with `bulk-omitted-fields` stripped\n   from every entry. The former `?fn=<name>` per-fn FULL-entry branch\n   is gone with its one consumer (the deleted `ensureRichTypeFullEntry`\n   backfill — the return-type-rule popover is a server partial now).\"\n  [ctx]\n  (update-vals (rich-types-with-type-rows ctx)\n               #(apply dissoc % bulk-omitted-fields)))","gi":129},{"say":"The web layer has a second client: an AI. The optional `mcp`\n           package serves `/mcp` (JSON-RPC) through the same per-branch\n           router, and this is its only write primitive — sync fn-defs into a\n           branch, then delta-invalidate THAT branch's registry, not the\n           request's own (the AI writes to `ai/…` while its POST rides main).\n           The key design point is in the docstring: writes go through the\n           very `sync-fns-to-storage!` the package loader uses, so a\n           proposal from an AI meets the same cycle / collision / type\n           constraints as a human's `fns.edn`.","defn":"sync-fn-defs-branch!","ns":"resources/packages/mcp/mcp/impls.clj","n":16,"file":"resources/packages/mcp/mcp/impls.clj","lang":"clj","line":34,"code":"(defbase sync-fn-defs-branch!\n  \"Sync `fn-defs` into the branch `branch-id` and delta-invalidate that\n   branch's compiled registry. Returns the synced fn-ids.\n\n   Atomic by construction: the namespace upsert, the fn sync and the\n   invalidation must all land or none — a half-synced proposal leaves a\n   branch whose registry disagrees with its rows. Writes go through the\n   SAME `sync-fns-to-storage!` the package loader uses, so an AI's\n   proposal meets the same constraints (cycles, name collisions,\n   type-check) as a human's fns.edn.\"\n  [branch-id fn-defs]\n  (cr/record-effect! :db)\n  (let [storage (vs/switch-branch (request/require-storage ctx) branch-id)\n        fn-ids (pkg-sync/sync-bundle! storage fn-defs)]\n    ;; Invalidate the TARGET branch's ctx, not the request's own: the AI\n    ;; writes to `ai/…` while its POST /mcp rides main. Same shape as\n    ;; merge-branch!'s post-merge delta.\n    (exec-ctx/invalidate-graph-cache!\n      (if-let [router (br/current-router)]\n        (br/ctx-for router branch-id)\n        ctx)\n      fn-ids)\n    (mapv str fn-ids)))","gi":130,"see":[{"gi":5,"label":"sync-fns-to-storage!"},{"gi":114,"label":"dispatch-first"}]}]},{"id":":layout","title":"Layout — the editor's graph view","status":"toured","summary":"Turn raw fn/slot/binding rows into the placed cards, edges and\n             server-computed facts the editor renders.","paths":["src/graphden/layout/"],"after":[":web"],"steps":[{"say":"Stage 1's data pull — every fn / slot / fn-slot / binding /\n           list-item row in one branch-cached batch (versioned) or five\n           vanilla queries. The whole pipeline is a pure transform over this\n           snapshot; a per-context graph cache keeps hover-frequency layout\n           requests from re-reading storage.","defn":"load-graph-entities-uncached","ns":"graphden.layout.data","n":1,"file":"src/graphden/layout/data.clj","lang":"clj","line":324,"code":"(defn load-graph-entities-uncached\n  \"Pure storage read — fetch every fn/slot/fn-slot/binding/list-item\n   row and attach the derived `:args` slot views. Takes a plain\n   storage; the `ctx`-aware cache wrapper lives in the defbase shim.\"\n  [storage]\n  (let [graph (if (instance? VersionedStorage storage)\n                (vs/query-all-graph-entities storage)\n                {:fns        (vec (sp/query-entities storage :fn {}))\n                 :slots      (vec (sp/query-entities storage :slot {}))\n                 :fn-slots   (vec (sp/query-entities storage :fn-slot {}))\n                 :bindings   (vec (sp/query-entities storage :binding {}))\n                 :list-items (vec (sp/query-entities storage :binding-list-item {}))})]\n    (assoc graph :args (derive-fn-slot-views graph))))","gi":131},{"say":"Synthesizes the per-fn 'arg view' rows the walkers consume: for\n           each fn, its inherited slot surface with bindings overlaid\n           closer-fn-wins, plus the `:source-id` chains that let an edge\n           attribute an inherited slot to the ancestor that declared it.\n           The slot/binding model's read-side counterpart.","defn":"derive-fn-slot-views","ns":"graphden.layout.data","n":2,"file":"src/graphden/layout/data.clj","lang":"clj","line":264,"code":"(defn derive-fn-slot-views\n  \"Flatten {fns slots fn-slots bindings list-items} into the row shape\n   layout's helpers walk. Each `(fn, slot)` pair contributes one anchor\n   row; each binding-list-item contributes one item row.\n\n   Anchor row keys: :id :fn-id :slot-id :binding-id :name :type\n                    :required :source-id :value :ref-id\n   Item row keys add: :item-id :prev-arg-id :next-arg-id\n\n   `:source-id` on an anchor row points at the same slot's anchor one\n   parent hop up the chain (nil for the slot's defining fn), so the\n   pipeline's source-chain walks model inheritance the same way the\n   legacy primary/inherited arg pair did. `:source-id` on an item row\n   points at the binding's anchor — items never inherit beyond their\n   own binding.\n\n   Top-level assembler: builds the indexes once, then delegates per-fn\n   anchor construction to `anchor-rows-for-fn` and per-binding item\n   construction to `item-rows-for-binding`.\"\n  [{:keys [fns slots fn-slots bindings list-items]}]\n  (let [fn-by-id (into {} (map (juxt :id identity)) fns)\n        slot-by-id (into {} (map (juxt :id identity)) slots)\n        ;; Single pass over fn-slots populates both indexes via\n        ;; transients — the previous code walked the vector twice\n        ;; (group-by + into-map).\n        [own-fn-slots slot-owner-by-id]\n        (let [own (volatile! (transient {}))\n              owners (volatile! (transient {}))]\n          (run! (fn [fs]\n                  (let [fid (:fn-id fs)\n                        sid (:slot-id fs)]\n                    (vswap! own (fn [m]\n                                  (assoc! m fid\n                                          (conj (or (get m fid) []) fs))))\n                    (vswap! owners assoc! sid fid)))\n                fn-slots)\n          ;; Sort each fn's slots by declared :position (F2). `fn-slots`\n          ;; arrives in storage-hash order (resolve-all-entities iterates\n          ;; a hash map), so without this a collapsed level-0 card ordered\n          ;; its args arbitrarily — and expanding the card reordered them.\n          [(update-vals (persistent! @own) #(vec (sort-by :position %)))\n           (persistent! @owners)])\n        binding-by (into {} (map (juxt (juxt :fn-id :slot-id) identity)) bindings)\n        items-by-binding (->> list-items\n                              (sort-by :position)\n                              (reduce (fn [acc i]\n                                        (update acc (:binding-id i) (fnil conj []) i))\n                                      {}))\n        binding-extra-by-fn (substitution-context-bindings-by-fn\n                              fn-by-id slot-owner-by-id bindings)\n        anchor-ctx {:fn-by-id fn-by-id :slot-by-id slot-by-id\n                    :binding-by binding-by :items-by-binding items-by-binding}\n        anchor-rows (vec (mapcat #(anchor-rows-for-fn (:id %) anchor-ctx\n                                                      own-fn-slots binding-extra-by-fn)\n                                 fns))\n        item-rows (vec (mapcat #(item-rows-for-binding % items-by-binding)\n                               bindings))]\n    (into anchor-rows item-rows)))","gi":132},{"say":"Stage 2's orchestrator — dispatches the cycle-guarded `process-*`\n           walkers over the expansion spec, then pipes the accumulated state\n           through the post-processing transforms (optional/HOF badges,\n           captured-edge migration, overlay dedup, strip facts). Produces\n           the node/edge element lists the client draws verbatim.","defn":"build-graph-elements","ns":"graphden.layout.graph","n":3,"file":"src/graphden/layout/graph.clj","lang":"clj","line":828,"code":"(defn build-graph-elements\n  \"Build graph elements (nodes, edges) from selected function.\n   Returns {:nodes [...] :edges [...]}\"\n  [root-fn-id expansions lookups]\n  (let [{:keys [fn-map arg-map args-by-fn fn-slots-by-fn]} lookups\n        ;; Mutable state collected during traversal lives in ONE atom keyed\n        ;; by purpose. Helpers receive `state` via lexical closure and use\n        ;; `(swap! state update :nodes conj …)` / `(:nodes @state)` to read.\n        ;;\n        ;; Keys:\n        ;;   :nodes / :edges                  — accumulated graph elements\n        ;;   :added-node-ids                  — set of emitted node-ids (dedup)\n        ;;   :processed-arg-targets           — arg-target keys already wired\n        ;;   :processed-fn-nodes              — fn-process keys already done\n        ;;                                       (cycle guard for shared-fn graphs)\n        ;;   :in-progress-expansions          — expansion keys currently active\n        ;;                                       (cycle guard for self-referential refs)\n        ;;   :optional-unsets-by-node         — node-id → [arg-name …] for the\n        ;;                                       compact `+default, +else` badge\n        ;;   :hof-captured-by-node            — node-id → [arg-name …] for the\n        ;;                                       λname HOF capture badge\n        ;;   :captured-edge-migrations        — caller arg-id → inside consumer\n        ;;                                       node-id, post-process rewrite of\n        ;;                                       cross-HOF edges\n        state (atom {:nodes []\n                     :edges []\n                     :added-node-ids #{}\n                     :processed-arg-targets #{}\n                     :processed-fn-nodes #{}\n                     :in-progress-expansions #{}\n                     :optional-unsets-by-node {}\n                     :hof-captured-by-node {}\n                     :captured-edge-migrations {}})\n\n        inverse-source-map (bh/build-inverse-source-map arg-map)\n        parent-bound-terminals (bh/make-parent-bound-terminals lookups)]\n\n    ;; Track bindings for EACH expanded function\n    ;; Key: expanded-fn-id, Value: {:refs #{ref-ids}, :values #{arg-ids}}\n    ;; When processing refs from ancestors of an expanded fn, skip bindings that\n    ;; were already shown at the expanded fn itself\n    (let [expansion-bindings (atom {})\n          ;; The four `process-*` walkers (process-fn / process-expanded-fn /\n          ;; process-expanded-fn-impl / process-any-fn) live as top-level\n          ;; defns above this fn. All four take `ctx` as first arg and\n          ;; recurse through each other.\n          ctx {:state state\n               :lookups lookups\n               :fn-map fn-map\n               :arg-map arg-map\n               :args-by-fn args-by-fn\n               :fn-slots-by-fn fn-slots-by-fn\n               :inverse-source-map inverse-source-map\n               :parent-bound-terminals parent-bound-terminals\n               :expansion-bindings expansion-bindings\n               :expansions expansions}]\n\n      ;; Start processing from root - no expansion-root initially, not HOF.\n      (process-any-fn ctx root-fn-id nil nil true nil nil nil #{} false)\n\n      ;; Type-row roots (refinement / list / union / variant) have no\n      ;; slots and no parents, so the standard pipeline produces only\n      ;; an empty card. Surface their referenced types as synthetic\n      ;; outgoing edges so the user sees the type's composition in\n      ;; the canvas instead of buried inside a chip's title.\n      (bh/emit-type-row-internals! state lookups root-fn-id (str \"fn-\" root-fn-id)))\n\n    ;; Post-process: annotate optional/HOF metadata, migrate captured\n    ;; HOF edges to their inside-consumer source, dedup duplicate\n    ;; value-overlays. Each transform is a top-level defn — see the\n    ;; section header above for the role split.\n    (let [final-nodes (annotate-optionals (:nodes @state) state)\n          final-edges (migrate-captured-edges\n                        (:edges @state)\n                        (:captured-edge-migrations @state))]\n      (dedup-overlays final-nodes final-edges (:arg-map lookups)))))","gi":133},{"say":"Stages 3+ — grid placement: roots at column zero, dependents\n           right of their sources, rows packed to avoid overlap, plus the\n           validation summary. Pixel geometry stays client-side (measured\n           reflow off the real DOM); the server owns the grid topology.","defn":"compute-layout-matrix","ns":"graphden.layout.core","n":4,"file":"src/graphden/layout/core.clj","lang":"clj","line":288,"code":"(defn compute-layout-matrix\n  \"Compute grid-based layout from elements (for testing).\n   Input: {:elements {:nodes [...], :edges [...]}}\n   Output: {:grid-pos {node-id {:row r :col c}}, :validation {...}}\"\n  [{:keys [elements]}]\n  (let [nodes (mapv (fn [n] {:data n}) (or (:nodes elements) []))\n        edges (mapv (fn [e] {:data e}) (or (:edges elements) []))\n        node-ids (map #(get-in % [:data :id]) nodes)]\n    (if (empty? nodes)\n      {:grid-pos {}\n       :validation {:valid true :issues [] :warnings []}}\n      (let [graph-info (build-graph-info nodes edges)\n            root (find-root-node nodes edges)\n            matrix (if root\n                     (layout-graph (get-in root [:data :id]) graph-info)\n                     (empty-matrix))\n            validation (validate-layout matrix node-ids (some? root))]\n        {:grid-pos (:positions matrix)\n         :validation validation}))))","gi":134},{"say":"The editor-facing tail: attach server-computed FACTS to each\n           fn-node — the inherited return-type alias, the rule-owning\n           base-fn (`registry/rule-owner-of`), and the transitive\n           branch-local seed (`branch-local/branch-local-seed`). These\n           replaced three hand-written client mirrors of the same walks;\n           the client renders facts, it doesn't re-derive them.","defn":"annotate","ns":"graphden.layout.strip-facts","n":5,"file":"src/graphden/layout/strip_facts.clj","lang":"clj","line":60,"code":"(defn annotate\n  \"Attach strip facts to every fn-node's `:data` in a built\n   `{:nodes :edges}` element map. `graph` is the layout entity\n   snapshot (`:fns` et al). Non-fn nodes and unknown ids pass\n   through untouched.\"\n  [elements graph]\n  (let [fns-by-id (into {} (map (juxt :id identity)) (:fns graph))]\n    (update elements :nodes\n            (fn [nodes]\n              (mapv (fn [n]\n                      (let [fn-id (some-> (get-in n [:data :originalFnId])\n                                          parse-uuid)\n                            row (get fns-by-id fn-id)]\n                        (if-not row\n                          n\n                          (let [owner (registry/rule-owner-of (:name row))\n                                alias (inherited-return-type-alias fns-by-id fn-id)\n                                seed (branch-local/branch-local-seed fns-by-id fn-id)]\n                            (cond-> n\n                              alias (assoc-in [:data :returnTypeAlias] alias)\n                              owner (assoc-in [:data :ruleOwner] owner)\n                              seed (assoc-in [:data :branchLocal]\n                                             {:own (= (:id seed) fn-id)\n                                              :seed (:name seed)}))))))\n                    nodes)))))","gi":135,"see":[{"gi":40,"label":"effective-branch-local?"}]}]},{"id":":editor","title":"Editor frontend — the browser half","status":"toured","summary":"The ~25k lines of plain ES that draw the graph, bind the edits\n             and mount the server's partials. No build step, no framework.","paths":["resources/packages/app/editor/","resources/packages/web/runtime/"],"after":[":web",":layout"],"steps":[{"say":"**Start here for anything you can click.** The editor is ~75 plain\n           `.js` files concatenated into one bundle in a fixed order (no\n           imports, no build step — the per-module map is in\n           [docs/EDITOR_MODULES.md](../EDITOR_MODULES.md)), and this is the\n           boot. Note the shape of the fetches: the namespace TREE goes out\n           alone first, because its status answers the auth question for\n           everyone — only a non-401 fires the three secondary loads. Fn\n           leaves and per-fn slots/bindings arrive lazily; a 401 sends the\n           user to sign in rather than into a red fatal banner.","defn":"initGraph","ns":"resources/packages/app/editor/editor-main.js","n":1,"file":"resources/packages/app/editor/editor-main.js","lang":"js","line":223,"code":"async function initGraph() {\n  // Load the namespace tree + the rich-type registry in parallel. Types feed\n  // the in-place edit popovers' \"Expected: <type>\" hints, so they need to be\n  // ready before the user opens any editor.\n  //\n  // /api/services is loaded eagerly too — auth-required, so anonymous\n  // visitors see no service badges (loadServicesEager swallows the 401\n  // silently). Cheap and primed before the first overlay render.\n  //\n  // `?scope=tree` — namespaces + counts only. Fn leaves load lazily per\n  // expanded namespace; per-fn slots/bindings load via ensureSubtreeFor().\n  _subtreeRootId = null;\n  _subtreeFetchInFlight.clear();\n  _knownFns = new Map();\n  _loadedNamespaceIds = new Set();\n  // Tree first, alone: on an auth-gated deployment an anonymous boot\n  // used to fire all four fetches and paint FOUR red 401s into the\n  // console before the sign-in prompt. The tree's status answers the\n  // auth question for everyone — only when it isn't 401 do the three\n  // secondary fetches go out (in parallel; they start on the tree's\n  // response headers, so the authed path pays ~one RTT).\n  const entResp = await fetch(API.api_graph_entities + '?scope=tree');\n  const [typeResp, vkResp] = (entResp.status === 401)\n    ? [null, null]\n    : await Promise.all([\n        fetch(API.api_types).catch(() => null),\n        fetch(API.api_value_kinds).catch(() => null),\n        (typeof loadServicesEager === 'function')\n          ? loadServicesEager().catch(() => null)\n          : null,\n      ]);\n  // Auth wall (B3): the graph view is login-gated when auth is active, so an\n  // unauthenticated (or stale-token) boot gets 401 here — send the user to\n  // sign in instead of dying into the red fatal banner. Tenancy deployments\n  // (the capability header on this very 401 set `gd-tenancy` via the fetch\n  // wrap) have the full /login page; single-tenant has no such page, so open\n  // the lock popover instead.\n  if (entResp.status === 401) {\n    clearAuthPassword(); // whatever we sent (or didn't) doesn't authenticate\n    if (document.body.classList.contains('gd-tenancy')) {\n      const next = location.pathname + location.search + location.hash;\n      location.href = '/login?next=' + encodeURIComponent(next);\n    } else if (typeof openAuthPopover === 'function') {\n      void openAuthPopover('Sign in to use the editor'); // fire-and-forget; fields mount async\n    }\n    return;\n  }\n  graphData = graphShellFromTree(await entResp.json());\n  lookups = buildLookups(graphData);\n  if (typeResp?.ok) {\n    try { richTypes = await typeResp.json(); } catch (err) {\n      // eslint-disable-next-line no-console\n      console.error(API.api_types + ' JSON parse failed — type tooltips will be empty', err);\n      richTypes = {};\n    }\n    // Server-partial popovers key rich args by binding-id in\n    // `_rowActionsUseSiteArgs`; entries staled by this refresh would\n    // otherwise accumulate for the whole session.\n    if (typeof _rowActionsUseSiteArgs !== 'undefined') _rowActionsUseSiteArgs.clear();\n    // The type registry just (re)loaded, so any cached\n    // `/api/types/compatible` verdicts may now be stale. `initGraph` is\n    // also the fn-rename refresh path, where a retype changes the answers.\n  }\n  if (vkResp?.ok) {\n    try { VALUE_KINDS = await vkResp.json(); } catch (err) {\n      // eslint-disable-next-line no-console\n      console.error(API.api_value_kinds + ' JSON parse failed — type-picker may be incomplete', err);\n      VALUE_KINDS = [];\n    }\n  }\n  // Resolve the secret-leaf base-fn id once so isSecretFn() stays\n  // synchronous without a full-fns mirror to scan.\n  if (typeof primeSecretLeafId === 'function') primeSecretLeafId();\n  updateEntityList(graphData);\n  // Proactive plan-usage badge — the fn count just (re)loaded, so refresh it\n  // after every graph mutation (create / delete / rename all call initGraph).\n  if (typeof refreshQuotaBadge === 'function') refreshQuotaBadge();\n  // First-load hash navigation: `#fn-name` in the URL (bookmark,\n  // shared link, page reload) must select the fn — `hashchange` /\n  // `popstate` only fire on AFTER-load changes, not the initial\n  // load. Without this, opening /#app.server.web-server (or any\n  // hashed URL) leaves the canvas blank until the user clicks the\n  // sidebar. Awaited so `await initGraph()` returns with the hashed\n  // fn's subtree loaded (its slots/bindings/closure), not still in\n  // flight — callers read `lookups.fnMap` right after.\n  const hash = window.location.hash.slice(1);\n  if (typeof gdRouteSurfaceHash === 'function' && gdRouteSurfaceHash(decodeURIComponent(hash))) {\n    // `#@settings` / `#@organization` / … — a surface deep link, no fn to select.\n  } else if (hash) {\n    await selectFnByName(decodeURIComponent(hash), false);\n  }\n}","gi":136,"see":[{"gi":146,"label":"authFetch"}]},{"say":"The client mirror of the compile layer's `build-lookups`: the same\n           raw fn / slot / fn-slot / binding / list-item rows, indexed into\n           the O(1) Maps every render path reads (`fnMap`, `slotByFnAndName`,\n           `bindingByFnSlot`, `itemsByBinding`, the namespace-path map). Every\n           comment here is a fixed O(N×M) scan — this function runs on every\n           mutation, so it is where client-side graph work gets slow.","defn":"buildLookups","ns":"resources/packages/app/editor/editor-data.js","n":2,"file":"resources/packages/app/editor/editor-data.js","lang":"js","line":114,"code":"function buildLookups(data) {\n  const fnMap = new Map();\n  const slotMap = new Map();\n  const fnSlotsByFn = new Map();\n  const slotByFnAndName = new Map();\n  const bindingMap = new Map();\n  const bindingsByFn = new Map();\n  const bindingByFnSlot = new Map();\n  const itemsByBinding = new Map();\n  const nsMap = new Map();\n  const nsPathMap = new Map();\n\n  (data.fns || []).forEach(f => fnMap.set(f.id, f));\n\n  // --- new model ---\n  (data.slots || []).forEach(s => slotMap.set(s.id, s));\n  const sortedFnSlots = (data['fn-slots'] || []).slice()\n    .sort((a, b) => (a.position || 0) - (b.position || 0));\n  // Phase 6c — index renamed-view slots by (fn-id, source-slot-id)\n  // so getEffectiveSlotName can answer in O(1) without scanning\n  // fn-slots. A renamed slot is an own slot (fn-slot row on F)\n  // whose `:source-slot-id` FK points back at the slot it renames.\n  const slotByFnSourceSlot = new Map();\n  sortedFnSlots.forEach(fs => {\n    const fnId = fs['fn-id'];\n    if (!fnSlotsByFn.has(fnId)) fnSlotsByFn.set(fnId, []);\n    fnSlotsByFn.get(fnId).push(fs);\n    const slot = slotMap.get(fs['slot-id']);\n    if (slot?.name) {\n      slotByFnAndName.set(fnId + '|' + slot.name, slot);\n    }\n    if (slot?.['source-slot-id']) {\n      slotByFnSourceSlot.set(fnId + '|' + slot['source-slot-id'], slot);\n    }\n  });\n  (data.bindings || []).forEach(b => {\n    bindingMap.set(b.id, b);\n    const fnId = b['fn-id'];\n    if (fnId) {\n      if (!bindingsByFn.has(fnId)) bindingsByFn.set(fnId, []);\n      bindingsByFn.get(fnId).push(b);\n    }\n    if (fnId && b['slot-id']) {\n      bindingByFnSlot.set(fnId + '|' + b['slot-id'], b);\n    }\n  });\n  // Flat {item-id -> item-row} index sits next to itemsByBinding so\n  // argRowFromNode can resolve an arg by `itemId` in O(1) — the\n  // previous code looped EVERY bindings' item array (O(N×M) per\n  // arg-overlay render).\n  const itemByItemId = new Map();\n  const sortedItems = (data['list-items'] || []).slice()\n    .sort((a, b) => (a.position || 0) - (b.position || 0));\n  sortedItems.forEach(it => {\n    const bid = it['binding-id'];\n    if (!bid) return;\n    if (!itemsByBinding.has(bid)) itemsByBinding.set(bid, []);\n    itemsByBinding.get(bid).push(it);\n    if (it.id) itemByItemId.set(it.id, it);\n  });\n\n  // Build namespace maps\n  (data.namespaces || []).forEach(ns => nsMap.set(ns.id, ns));\n  // Compute full paths for each ns (walk parent chain)\n  nsMap.forEach((ns, id) => {\n    const parts = [];\n    let cur = ns;\n    for (let i = 0; i < 20 && cur; i++) {\n      parts.unshift(cur.name);\n      cur = cur['parent-id'] ? nsMap.get(cur['parent-id']) : null;\n    }\n    nsPathMap.set(id, parts.join('.'));\n  });\n\n  // Deletability sets. The sidebar holds no full-fns mirror to count\n  // against, so the whole-graph reverse-ref tallies come from the\n  // SERVER instead of a client scan:\n  //   - fnUsedAsParent / fnUsedAsRef: read off each fn row's\n  //     `:used-as-parent-count` / `:used-as-ref-count`, which the\n  //     `:namespace` / `:search` / `:subtree` payloads compute over the\n  //     whole graph (see crud/entities `reverse-ref-index`). Keyed by the\n  //     REFERENCED fn's id — exactly what `fnDeleteBlockReason` looks up.\n  //   - nsHasChildFn: from the `:tree` `:counts` payload (named fns per\n  //     namespace), authoritative even though the leaves load lazily.\n  //   - nsHasChildNs: still derived from the (complete) namespace list.\n  const fnUsedAsParent = new Map();\n  const fnUsedAsRef    = new Map();\n  const nsHasChildNs   = new Map();\n  const nsHasChildFn   = new Map();\n  // Per-namespace recorded-type-diagnostic counts (Phase 3) — from the\n  // `:tree` counts payload's additive `:type-error-count`; feeds the\n  // sidebar's ⚠ chip on namespace rows.\n  const nsTypeErrors   = new Map();\n  const bump = (m, k) => { if (k) m.set(k, (m.get(k) || 0) + 1); };\n\n  (data.fns || []).forEach(f => {\n    const ap = f['used-as-parent-count'];\n    const ar = f['used-as-ref-count'];\n    if (ap) fnUsedAsParent.set(f.id, ap);\n    if (ar) fnUsedAsRef.set(f.id, ar);\n  });\n  (data.counts || []).forEach(c => {\n    if (c.count) nsHasChildFn.set(c['namespace-id'], c.count);\n    if (c['type-error-count']) nsTypeErrors.set(c['namespace-id'], c['type-error-count']);\n  });\n  (data.namespaces || []).forEach(ns => bump(nsHasChildNs, ns['parent-id']));\n\n  // Per-lookups cache for getInheritanceLevels — auto-invalidated\n  // whenever buildLookups runs again (graph mutation refresh).\n  const inheritanceLevelsCache = new Map();\n\n  return { fnMap,\n           slotMap, fnSlotsByFn, slotByFnAndName, slotByFnSourceSlot,\n           bindingMap, bindingsByFn, bindingByFnSlot, itemsByBinding, itemByItemId,\n           nsMap, nsPathMap,\n           fnUsedAsParent, fnUsedAsRef, nsHasChildNs, nsHasChildFn,\n           nsTypeErrors,\n           inheritanceLevelsCache };\n}","gi":137,"see":[{"gi":6,"label":"build-lookups"}]},{"say":"The graph itself: two Maps plus two adjacency indexes and an\n           `animating` flag. This is *all* that remained of cytoscape when it\n           was removed — the

onst requestBody = {\n      'root-id': selectedFnId,\n      expansions: expansions\n    };\n\n    const response = await fetch(API.api_graph_layout, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify(requestBody)\n    });\n\n    if (!response.ok) {\n      console.error('Backend layout API failed:', response.status);\n      return null;\n    }\n\n    const data = await response.json();\n\n    // Handle different naming conventions: 'grid-pos' (Clojure kebab-case)\n    const gridPos = data['grid-pos'] || data.gridPos || {};\n    const nodes = data.nodes || [];\n    const edges = data.edges || [];\n\n    if (nodes.length === 0) {\n      return { nodes: [], edges: [], layout: new Map() };\n    }\n\n    // Calculate sizes for all nodes\n    const sizes = new Map();\n    nodes.forEach(n => {\n      sizes.set(n.data.id, calculateNodeSize(n.data));\n    });\n\n    // Calculate column widths\n    const colWidths = new Map();\n    Object.entries(gridPos).forEach(([nodeId, pos]) => {\n      const size = sizes.get(nodeId);\n      if (size) {\n        const currentMax = colWidths.get(pos.col) || 0;\n        colWidths.set(pos.col, Math.max(currentMax, size.width));\n      }\n    });\n\n    // Calculate min node width per column (for width spread compensation)\n    const colMinWidths = new Map();\n    Object.entries(gridPos).forEach(([nodeId, pos]) => {\n      const size = sizes.get(nodeId);\n      if (size) {\n        const currentMin = colMinWidths.get(pos.col);\n        colMinWidths.set(pos.col, currentMin === undefined ? size.width : Math.min(currentMin, size.width));\n      }\n    });\n\n    // Calculate per-column gap based on:\n    // 1. Longest edge label crossing each column boundary, INCLUDING the\n    //    type-chip / sequence buttons / description badge that the\n    //    overlays render alongside the label text. Without this the\n    //    column gap is sized for the bare argName and the chips spill\n    //    into the next column.\n    // 2. Width spread in the column (max - min): wide nodes extend past\n    //    narrow ones, so edges from narrow nodes start further left,\n    //    needing more gap for labels.\n    const colGaps = new Map();\n    const CHAR_WIDTH = 9;\n    const LABEL_PADDING = 30;\n    // Chip widths stay in lock-step with editor-styles.css. The chip\n    // itself is always rendered (read-only or editable); its visible\n    // text depends on the resolved type — short for primitives\n    // (`int`, `text`), long for fn-types (`(request)→ring-res…`).\n    // We compute the actual chip text via `compactTypeChipText` per\n    // edge so columns hosting fn-typed args reserve enough room for\n    // the chip to fit between source-card and target-card without\n    // crossing either.\n    const CHIP_CHAR_PX     = 6;   // SF Mono 9px ≈ 5.5–6 px per char\n    const CHIP_CHROME_PX   = 25;  // padding 8 + border 2 + margin 4 + slack\n    const TRIGGER_WIDTH    = 16;  // `▸ / ▾` inline-expand trigger\n    const SEQ_BTN_WIDTH    = 18;  // × or +\n    const DESC_BADGE_WIDTH = 19;  // 15 + 4 margin\n    edges.forEach(e => {\n      const srcPos = gridPos[e.data.source];\n      const tgtPos = gridPos[e.data.target];\n      if (srcPos && tgtPos && e.data.argName) {\n        const labelCol = Math.min(srcPos.col, tgtPos.col);\n        const widestLine = e.data.argName.split('\\n').reduce(\n          (max, line) => Math.max(max, line.length), 0);\n        const editArg = (typeof argRowFromNode === 'function')\n                        ? argRowFromNode(e.data) : null;\n        const editable = editArg\n                      && typeof implementationFnIds !== 'undefined'\n                      && implementationFnIds.has(editArg['fn-id'])\n                      && (typeof isAuthenticated === 'function'\n                          ? isAuthenticated() : true);\n        // Estimate the chip's visible text width — the chip's text is\n        // produced by `compactTypeChipText(rich, flat)`, so reserve\n        // the same width here. Fall back to a short default when the\n        // helpers aren't loaded yet (e.g. first paint before\n        // editor-overlay-arg.js is fully wired).\n        const rich = (editArg && typeof expectedSlotType === 'function')\n                     ? expectedSlotType(editArg) : null;\n        const flat = editArg?.type\n                     ? String(editArg.type).replace(/^:/, '')\n                     : 'any';\n        const chipText = (typeof compactTypeChipText === 'function')\n                         ? compactTypeChipText(rich, flat)\n                         : flat;\n        const chipChars = (chipText || '').length;\n        let chipOverhead = DESC_BADGE_WIDTH\n                         + (chipChars * CHIP_CHAR_PX + CHIP_CHROME_PX);\n        if (editable) {\n          chipOverhead += TRIGGER_WIDTH;\n          if (e.data.sourcePrevArgId) {\n            chipOverhead += SEQ_BTN_WIDTH;                              // ×\n            if (!e.data.sourceNextArgId) chipOverhead += SEQ_BTN_WIDTH; // tail +\n          }\n        }\n        const labelWidth = widestLine * CHAR_WIDTH + LABEL_PADDING + chipOverhead;\n        const currentGap = colGaps.get(labelCol) || GRID_GAP_X;\n        colGaps.set(labelCol, Math.max(currentGap, labelWidth));\n      }\n    });\n\n    // Calculate X positions with per-column gaps + width spread compensation.\n    // Skip empty columns entirely — the backend reserves some cells for edge\n    // routing but those produce no nodes, so padding them with a default width\n    // wastes horizontal space.\n    const colLeftX = new Map();\n    const usedCols = Array.from(colWidths.keys()).sort((a, b) => a - b);\n    let currentX = 0;\n    usedCols.forEach(c => {\n      colLeftX.set(c, currentX);\n      const maxWidth = colWidths.get(c);\n      const minWidth = colMinWidths.get(c) || maxWidth;\n      const widthSpread = Math.max(0, (maxWidth - minWidth) / 2);\n      const gap = colGaps.get(c) || GRID_GAP_X;\n      currentX += maxWidth + Math.max(gap, gap + widthSpread);\n    });\n\n    // Calculate Y positions from the ESTIMATED card heights. The estimate is\n    // only good enough to avoid a flash: a card's real height is content-driven\n    // (the effects strip wraps to as many chip rows as it needs), so the layout\n    // is corrected against measured heights as soon as the overlays exist —\n    // `reflowFromMeasuredHeights`, which reuses `computeRowCenters`.\n    _lastGridPos = gridPos;\n    const rowCenterY = computeRowCenters(gridPos, (id) => sizes.get(id)?.height);\n\n    // Build final layout\n    // Left-align all nodes: x = leftX + nodeWidth/2\n    // Overlay positions as: left = x*zoom + pan.x - nodeWidth/2*zoom = leftX*zoom + pan.x\n    // This gives same left edge for all nodes in column regardless of width\n    const layout = new Map();\n    Object.entries(gridPos).forEach(([nodeId, pos]) => {\n      const size = sizes.get(nodeId);\n      if (size) {\n        const leftX = colLeftX.get(pos.col);\n        layout.set(nodeId, {\n          x: leftX + size.width / 2,\n          y: rowCenterY.get(pos.row),\n          width: size.width,\n          height: size.height,\n          row: pos.row,\n          col: pos.col\n        });\n      }\n    });\n\n    // Augment node data with colRightX (right edge of node's column).\n    // Used by edge taxi-turn so the bend lands in the inter-column gap,\n    // never inside a wider sibling node sharing the same column.\n    // Also store computed layoutWidth/layoutHeight so graph node sizing matches\n    // the actual overlay rendering (avoids overlay overflow into next row).\n    nodes.forEach(n => {\n      const pos = gridPos[n.data.id];\n      if (pos) {\n        n.data.colRightX = colLeftX.get(pos.col) + (colWidths.get(pos.col) || 0);\n      }\n      const size = sizes.get(n.data.id);\n      if (size) {\n        n.data.layoutWidth = size.width;\n        n.data.layoutHeight = size.height;\n      }\n    });\n\n    return { nodes, edges, layout };\n  } catch (error) {\n    console.error('Backend layout fetch error:', error);\n    return null;\n  }\n}","gi":139,"see":[{"gi":133,"label":"build-graph-elements"},{"gi":134,"label":"compute-layout-matrix"}]},{"say":"One render cycle, and the reason it is not a one-liner: prime the\n           selected fn's subtree, capture an ANCHOR node before the await so\n           the canvas doesn't jump under the cursor, fetch the layout, diff it\n           against the live graph, then re-measure — card heights are only\n           known after the overlays exist, so the server's grid is corrected\n           against measured DOM and the nodes settle onto the result.","defn":"renderGraph","ns":"resources/packages/app/editor/editor-render.js","n":5,"file":"resources/packages/app/editor/editor-render.js","lang":"js","line":98,"code":"async function renderGraph(shouldFit = true) {\n  // `initGraph` only loaded the scope=tree sidebar payload (namespaces +\n  // counts, no fn detail). Fetch the subtree for the selected fn so overlays /\n  // edges read real slots / bindings / items out of `lookups`. ensureSubtreeFor\n  // short-circuits when the cache already matches selectedFnId.\n  if (selectedFnId && typeof ensureSubtreeFor === 'function') {\n    try { await ensureSubtreeFor(selectedFnId); }\n    catch (err) {\n      // eslint-disable-next-line no-console\n      console.error('renderGraph: subtree fetch failed', err);\n      return;\n    }\n  }\n  // `selectFn` called rebuildImplementationFnIds before this point, but on the\n  // FIRST render after initGraph / a navigation switch lookups were partial\n  // (pre-ensureSubtreeFor), so impl-fn-ids came back as ∅ and overlays would\n  // gate as non-editable. Redo it now with the populated bindings/items index —\n  // idempotent on subsequent renders of the same fn.\n  if (selectedFnId && typeof rebuildImplementationFnIds === 'function') {\n    rebuildImplementationFnIds();\n  }\n\n  // Capture the anchor BEFORE the await — `anchorNodeId` may be cleared by the\n  // caller after an async yield. It holds the FULL node id (including the\n  // `fn-{root}_{fn-id}` scoping prefix where applicable) so scoped leaves stay\n  // stationary too.\n  let capturedAnchorNodeId = anchorNodeId;\n  let anchorOldPos = null;\n\n  if (graph.nodes.size > 0) {\n    // Fallback: if no explicit anchor was set (e.g. a render path that didn't go\n    // through applyClickSpec/applyHoverSpec), anchor to a preview key so hover\n    // re-renders don't drift the graph.\n    if (!capturedAnchorNodeId && previewState.size > 0) {\n      capturedAnchorNodeId = previewState.keys().next().value;\n    }\n    if (capturedAnchorNodeId) {\n      const anchorNode = graph.nodes.get(capturedAnchorNodeId);\n      if (anchorNode) anchorOldPos = {x: anchorNode.x, y: anchorNode.y};\n    }\n  }\n\n  const result = await fetchBackendLayout();\n  if (!result) {\n    console.error('Failed to fetch layout from backend');\n    return;\n  }\n  const {nodes, edges, layout} = result;\n\n  // First render.\n  if (graph.nodes.size === 0) {\n    if (nodes.length > 0) createGraph(nodes, edges, layout, shouldFit);\n    return;\n  }\n\n  graphStopAnimation();\n\n  // Save positions of user-moved nodes BEFORE the render. During preview, nodes\n  // may be removed and re-added; we restore their positions afterwards.\n  for (const [nodeId, node] of graph.nodes) {\n    if (userMovedNodes.has(nodeId)) {\n      savedUserPositions.set(nodeId, {x: node.x, y: node.y});\n    }\n  }\n\n  // Keep the anchor node stationary. SKIP when the anchor was user-moved —\n  // otherwise the offset shifts every node to match the drag, visually undoing\n  // it.\n  if (capturedAnchorNodeId && anchorOldPos && !userMovedNodes.has(capturedAnchorNodeId)) {\n    const anchorNewPos = layout.get(capturedAnchorNodeId);\n    if (anchorNewPos) {\n      const offsetX = anchorOldPos.x - anchorNewPos.x;\n      const offsetY = anchorOldPos.y - anchorNewPos.y;\n      if (offsetX !== 0 || offsetY !== 0) {\n        layout.forEach((pos) => {\n          pos.x += offsetX;\n          pos.y += offsetY;\n        });\n      }\n    }\n  }\n\n  const newNodeIds = new Set(nodes.map((n) => n.data.id));\n  const newEdgeIds = new Set(edges.map((e) => e.data.id));\n  const nodeIdsToRemove = graphNodeIds().filter((id) => !newNodeIds.has(id));\n  const edgeIdsToRemove = [...graph.edges.keys()].filter((id) => !newEdgeIds.has(id));\n  const nodesToAdd = nodes.filter((n) => !graph.nodes.has(n.data.id));\n  const edgesToAdd = edges.filter((e) => !graph.edges.has(e.data.id));\n\n  // Refresh the data of everything that survived. O(N) via pre-indexed maps —\n  // a `.find()` per node was O(N²), visible as jitter on ~200-node graphs every\n  // time the user expanded or collapsed.\n  const nodesById = new Map(nodes.map((n) => [n.data.id, n]));\n  const edgesById = new Map(edges.map((e) => [e.data.id, e]));\n  for (const id of graph.nodes.keys()) {\n    const fresh = nodesById.get(id);\n    if (fresh) graphSetNodeData(id, fresh.data);\n  }\n  for (const id of graph.edges.keys()) {\n    const fresh = edgesById.get(id);\n    if (fresh) graphSetEdgeData(id, fresh.data);\n  }\n\n  function completeUpdate() {\n    // During preview, keep userMovedNodes entries (positions are saved). On\n    // commit, entries are cleared via savedUserPositions.clear().\n    const isPreview = previewState.size > 0;\n    for (const id of nodeIdsToRemove) {\n      // Registry-backed lookup: the overlay's nodeId IS the node id, so look it\n      // up directly rather than matching on data-original-fn-id, which is\n      // ambiguous when several copies share an originalFnId.\n      unregisterNodeOverlay(id);\n      if (!isPreview) {\n        userMovedNodes.delete(id);\n        savedUserPositions.delete(id);\n      }\n      graphRemoveNode(id);\n    }\n    for (const id of edgeIdsToRemove) graphRemoveEdge(id);\n\n    // Add new nodes at their layout position — ..(graph.incoming.get(id) || [])][0];\n      const parentId = parentEdgeId && graph.edges.get(parentEdgeId)?.sourceId;\n      const parent = parentId && graph.nodes.get(parentId);\n      if (parent) targets.set(id, {x: parent.x, y: parent.y});\n      fadeOutOverlay(getNodeOverlay(id), ANIM_DURATION);\n    }\n    if (targets.size > 0) {\n      graphAnimateNodes(targets, ANIM_DURATION, updateOverlayPositions, easeInCubic)\n        .then(completeUpdate);\n      return;\n    }\n  }\n  completeUpdate();\n}","gi":140},{"say":"A node is not drawn — it is an absolutely-positioned HTML card\n           riding the layer transform (edges are SVG; everything else is\n           DOM). This builds one fn card: the inheritance levels from\n           `parent-ids`, the use-site header when the card is an expanded\n           child rather than the navigation root, and a row per slot. The\n           slot/binding model of the very first block, made clickable.","defn":"createFnOverlay","ns":"resources/packages/app/editor/editor-overlay-fn.js","n":6,"file":"resources/packages/app/editor/editor-overlay-fn.js","lang":"js","line":215,"code":"function createFnOverlay(node, container) {\n  const originalFnId = node.data('originalFnId');\n  if (!originalFnId) return;\n\n  const nodeId = node.id();  // Full node ID including expansion context\n  // Navigation root vs expanded child: the root's nodeId is just `fn-{uuid}`\n  // (single fn-id segment); expanded children carry the full ancestry path\n  // (`fn-{root}-{intermediate}…-{leaf}`). Used below to decide whether to\n  // prepend the \"use-site\" header row.\n  const isNavRoot = nodeId === 'fn-' + originalFnId;\n  const ownFn = lookups.fnMap.get(originalFnId);\n  const isLocalFn = !(ownFn?.name);\n\n  const levels = getInheritanceLevels(originalFnId);\n  const ancestorLevels = buildAncestorLevels(levels);\n  // When a use-site row will be prepended (named non-root), it takes over\n  // the role of \"root header\". The ancestor levels then start outside the\n  // root-block — a clickable depth-0 like `all-routes` reads as a normal\n  // expandable row (white) rather than a passive black header. Non-clickable\n  // depths still propagate the root-block treatment (so `list` below\n  // `all-routes` stays black until a clickable level breaks the chain).\n  const willPrependUseSite = !isNavRoot && !isLocalFn;\n  if (willPrependUseSite) {\n    let currentBlockIsRoot = true;\n    ancestorLevels.forEach((lv) => {\n      if (lv.anyClickable) currentBlockIsRoot = false;\n      lv.blockIsRoot = currentBlockIsRoot;\n    });\n  }\n  const spec = expansionState.get(nodeId) || { fullDepth: 0, partialFns: new Set() };\n  const fullDepth = spec.fullDepth;\n  const partialFns = spec.partialFns;\n  const visibleLevels = ancestorLevels.slice(0, MAX_VISIBLE_ANCESTORS + 1);\n\n  // Black container bg so adjacent black rows tile perfectly at sub-pixel\n  // boundaries — any rounding slack shows the same colour, no white seam.\n  // Non-black rows set their own bg explicitly (paintWithSpec / row\n  // creation paths) so they don't bleed black through.\n  const overlay = createOverlay(nodeId, { background: 'var(--card-header-bg)' });\n  overlay.dataset.originalFnId = originalFnId;\n  overlay.dataset.nodeId = nodeId;\n  overlay.style.cursor = 'default';\n\n  // Click the card BODY (not a button / inline editor) to inspect THIS node's\n  // fn in the right panel — the standard \"select a node → see its details\"\n  // loop, so you can read any node you see on the graph, not just the one you\n  // opened. Buttons, links and inline editors inside the card own their clicks.\n  overlay.addEventListener('click', (e) => {\n    if (e.target.closest(\n      'button, a, input, select, textarea, label, [contenteditable=\"true\"], .placeholder-binder',\n    )) return;\n    if (typeof window.gdInspectorRender !== 'function') return;\n    document.querySelectorAll('.node-overlay.gd-node-active')\n      .forEach((n) => n.classList.remove('gd-node-active'));\n    overlay.classList.add('gd-node-active');\n    window.gdInspectorRender(originalFnId);\n  });\n\n  // Paint state lives in buildFnPaintState() above; helpers receive it\n  // via rowCtx. The body of this function only ever needs `restoreStyles`\n  // for the final paint after the dispatch loop.\n  const linesByDepth = new Map();   // depth -> { line, spansByFnId, levelInfo }\n  const paint = buildFnPaintState({ linesByDepth, visibleLevels, fullDepth, partialFns });\n  const { restoreStyles } = paint;\n  // Bundle threaded into the per-row render helpers below so they don't\n  // each take a 12-arg signature.\n  const rowCtx = { nodeId, originalFnId, isNavRoot, isLocalFn,\n                   fullDepth, partialFns, visibleLevels, linesByDepth, paint };\n\n  const useSiteHeader = appendUseSiteHeader(overlay, rowCtx);\n\n  visibleLevels.forEach((levelInfo, idx) => {\n    const line = document.createElement('div');\n    line.className = 'ancestor-line';\n    line.dataset.level = levelInfo.depth;\n    line.dataset.groupId = levelInfo.groupId;\n\n    // No separator if next level is in the same group, OR if the next level\n    // is a column-below-MI (the vertical borders continue, horizontal removed)\n    const nextLevel = visibleLevels[idx + 1];\n    const isLastInGroup = !nextLevel || nextLevel.groupId !== levelInfo.groupId;\n    const isLast = idx === visibleLevels.length - 1;\n    const nextIsColumnBelow = nextLevel && nextLevel.followsMI >= 0;\n    const lineBorderBottom = (isLast || !isLastInGroup || nextIsColumnBelow)\n      ? 'none' : '1px solid var(--light-border)';\n    line.classList.add('fn-ancestor-line');   // static looks in editor-styles.css\n    line.style.borderBottom = lineBorderBottom;\n\n    let spansByFnId = null;\n    const miLevelAbove = levelInfo.followsMI >= 0 ? visibleLevels[levelInfo.followsMI] : null;\n\n    if (miLevelAbove && !levelInfo.isMI) {\n      renderColumnBelowMiRow(line, levelInfo, miLevelAbove, rowCtx);\n    } else if (levelInfo.isMI) {\n      spansByFnId = renderMiRow(line, levelInfo, idx, rowCtx);\n    } else {\n      renderSingleFnRow(line, levelInfo, rowCtx);\n    }\n\n    if (!linesByDepth.has(levelInfo.depth)) {\n      linesByDepth.set(levelInfo.depth, { line, spansByFnId, levelInfo });\n    }\n    overlay.appendChild(line);\n  });\n\n  // Paint all lines/columns with the committed state. This is needed\n  // because column-below-MI divs don't set their initial bg in the\n  // constructor — it's computed dynamically from the MI parents' state.\n  restoreStyles();\n\n  // Merge the use-site header with the depth-0 ancestor row when both\n  // share the same root-block bg AND the header has no expansion of its\n  // own to collapse. The two divs already paint continuously (same bg,\n  // no separator); forwarding mouse events makes them act as one — a\n  // single multi-line click target / hover region. Matches the\n  // \"merge non-clickable rows\" UI rule.\n  if (useSiteHeader && !expansionState.has(nodeId)) {\n    const depth0 = linesByDepth.get(0);\n    if (depth0?.levelInfo.blockIsRoot && depth0.line) {\n      const target = depth0.line;\n      ['mousedown', 'touchend', 'mouseenter', 'mousemove', 'mouseleave'].forEach(type => {\n        useSiteHeader.addEventListener(type, (e) => {\n          // The original handler on useSiteHeader bails out early when\n          // there is no expansion (that's exactly the case we're in),\n          // so reusing the event on the depth-0 row never double-fires.\n          target.dispatchEvent(new MouseEvent(type, {\n            bubbles: false, cancelable: true,\n            clientX: e.clientX, clientY: e.clientY,\n            button: e.button\n          }));\n        });\n      });\n      useSiteHeader.style.cursor = target.style.cursor || 'pointer';\n    }\n  }\n\n  if (ancestorLevels.length > MAX_VISIBLE_ANCESTORS + 1) {\n    const more = document.createElement('div');\n    more.classList.add('fn-ancestor-more');   // static looks in editor-styles.css\n    more.textContent = '...';\n    overlay.appendChild(more);\n  }\n\n  appendOptionalArgsStrip(overlay, node.data('optionalArgs'), originalFnId);\n\n  appendFnMetadataStrips(overlay, originalFnId, isNavRoot, {\n    returnTypeAlias: node.data('returnTypeAlias') || null,\n    ruleOwner: node.data('ruleOwner') || null,\n    branchLocal: node.data('branchLocal') || null,\n  });\n\n  appendHofCapturedArgsStrip(overlay, node.data('hofCapturedArgs'));\n\n  appendDeepFreeArgsStrip(overlay, node.data('deepFreeArgs'));\n\n  appendFnActionToolbar(overlay, originalFnId, isNavRoot);\n\n  createDragHandle(overlay, node);\n\n  attachFnOverlayHoverHandlers(overlay, nodeId);\n\n  container.appendChild(overlay);\n}","gi":141,"see":[{"gi":132,"label":"derive-fn-slot-views"}]},{"say":"The pivot from client logic to server-rendered HTML. ONE delegated\n           listener per host resolves `data-action=\"…\"` against a registry\n           filled by `registerActionHandler`, so a fragment the server just\n           rendered becomes interactive with no per-fragment wiring. This file\n           is platform-shared: it is bundled into the editor AND served\n           standalone at `/assets/graphden-runtime.js`, so user-composed pages\n           get the same dispatch. Read the bind-once comment — without it a\n           reused singleton popover fires `delete-fn` N times on the Nth open.","defn":"bindActionDispatch","ns":"resources/packages/web/runtime/graphden-runtime.js","n":7,"file":"resources/packages/web/runtime/graphden-runtime.js","lang":"js","line":78,"code":"function bindActionDispatch(host) {\n  if (!host) return;\n  // Bind ONCE per host. `loadPartial` calls this after every swap, and\n  // many hosts (the row-actions / execute popovers) are process-lifetime\n  // SINGLETONS reused across opens — without this guard each open stacks\n  // another delegated listener, so one click on a `data-action` button\n  // fires the handler N times (N = opens). Destructive actions\n  // (delete-fn / extend-fn / namespace-move) would execute repeatedly.\n  // Binding once is safe: the dispatcher reads the CURRENT button off the\n  // event and looks the handler up dynamically in `_actionHandlers`, so a\n  // single listener serves all future swapped content.\n  if (host.dataset.gdDispatchBound) return;\n  host.dataset.gdDispatchBound = '1';\n  host.addEventListener('click', (e) => {\n    const btn = e.target.closest('[data-action]');\n    if (!btn || !host.contains(btn)) return;\n    if (btn.getAttribute('aria-disabled') === 'true') {\n      e.preventDefault();\n      e.stopPropagation();\n      if (typeof showIconReasonPopover === 'function' && btn.title) {\n        showIconReasonPopover(btn, btn.title);\n      }\n      return;\n    }\n    const action = btn.dataset.action;\n    const handler = _actionHandlers.get(action);\n    if (handler) handler(btn, e, host);\n  });\n}","gi":142,"see":[{"gi":124,"label":"hiccup-element"}]},{"say":"Fetch an HTML partial, swap it into a host, re-bind the dispatcher.\n           That is the whole `/partials/*` client contract\n           ([docs/PARTIALS.md](../PARTIALS.md)) — the migration path by which\n           popovers that used to be hand-built DOM became graph-native\n           fn-defs. The supersession token is the subtle part: two concurrent\n           loads into one host must let the LATEST call win, not the fastest\n           response.","defn":"loadPartial","ns":"resources/packages/web/runtime/graphden-runtime.js","n":8,"file":"resources/packages/web/runtime/graphden-runtime.js","lang":"js","line":123,"code":"async function loadPartial(host, url, opts) {\n  opts = opts || {};\n  if (!host || !url) return;\n  // Supersession guard: two concurrent loadPartial calls into the SAME host\n  // must not let the slower response win. Without a token, whichever fetch\n  // RESOLVES last writes host.innerHTML — not whichever was CALLED last — so a\n  // stale fragment can clobber the fresh one (e.g. fast re-open of a shared\n  // popover host). Each call bumps a per-host generation token; after every\n  // await we bail if this call is no longer the current generation, leaving the\n  // newer call's content untouched. Mirrors the fn-versions supersession check.\n  const gen = (Number(host.dataset.gdPartialGen) || 0) + 1;\n  host.dataset.gdPartialGen = String(gen);\n  const superseded = () => String(host.dataset.gdPartialGen) !== String(gen);\n  host.textContent = '';\n  const loading = document.createElement('span');\n  loading.className = opts.loadingClass || 'partial-loading';\n  loading.style.opacity = '0.55';\n  loading.style.fontSize = '11px';\n  loading.textContent = opts.loadingText || '…';\n  host.appendChild(loading);\n  try {\n    const r = await fetch(url, opts.fetchOpts || {});\n    if (superseded()) return;\n    if (!r.ok) {\n      _renderPartialError(host, opts, 'Failed');\n      return;\n    }\n    const text = await r.text();\n    if (superseded()) return;\n    host.innerHTML = text;\n    if (typeof opts.onSwap === 'function') opts.onSwap(host);\n    bindActionDispatch(host);\n  } catch (_) {\n    if (superseded()) return;\n    _renderPartialError(host, opts, 'Network');\n  }\n}","gi":143},{"say":"The migration in the concrete: the `⋯` row menu is a server partial\n           in four contexts, and the client only builds the query string,\n           caches the returned HTML per URL, and recomputes the one state that\n           MUST be fresh (add-MI compatibility, against current `lookups`) —\n           see [docs/EDITOR_ROW_ACTIONS.md](../EDITOR_ROW_ACTIONS.md) for why\n           this popover moved and the others stayed JS.","defn":"loadRowActionsContent","ns":"resources/packages/app/editor/editor-row-actions.js","n":9,"file":"resources/packages/app/editor/editor-row-actions.js","lang":"js","line":399,"code":"async function loadRowActionsContent(host, fnId, context, opts) {\n  opts = opts || {};\n  if (!host || !fnId) return;\n  // Register the rich arg before fetch — the dispatcher binds\n  // post-swap and reads by binding-id then.\n  if (opts.useSiteArg?.['binding-id']) {\n    _rowActionsUseSiteArgs.set(opts.useSiteArg['binding-id'], opts.useSiteArg);\n  }\n  // `/partials/*` paths are out of scope for `window.API` (only\n  // `/api/*` flows through the validator + boot-cached constants);\n  // the literal stays explicit — drift validator doesn't touch it.\n  const useSiteBindingId = opts.useSiteArg\n                         ? opts.useSiteArg['binding-id'] : null;\n  const url = '/partials/row-actions'\n            + '?fn-id=' + encodeURIComponent(fnId)\n            + '&context=' + encodeURIComponent(context)\n            + (opts.showOpen === false ? '&show-open=false' : '')\n            + (opts.editable ? '&editable=true' : '')\n            + (opts.owned === false ? '&owned=false' : '')\n            + (opts.cardFnId\n                ? '&card-fn-id=' + encodeURIComponent(opts.cardFnId)\n                : '')\n            + (useSiteBindingId\n                ? '&binding-id=' + encodeURIComponent(useSiteBindingId)\n                : '')\n            + (opts.useSiteArg?.['item-id']\n                ? '&seq-item=true' + _seqEdgeParams(opts.useSiteArg)\n                : '')\n            + (opts.editBlockReason\n                ? '&edit-block-reason='\n                  + encodeURIComponent(opts.editBlockReason)\n                : '');\n  // Cache hit → render synchronously, no fetch, no \"…\" flash. The add-MI\n  // disabled-state is recomputed against the CURRENT lookups (not cached), so a\n  // stale-graph case can't wrongly enable it.\n  const cached = _rowActionsHtmlCache.get(url);\n  if (cached != null) {\n    host.innerHTML = cached;\n    _applyAddMICompatibilityState(host);\n    if (typeof bindActionDispatch === 'function') bindActionDispatch(host);\n    return Promise.resolve();\n  }\n  return loadPartial(host, url, {\n    loadingClass: 'row-actions-loading',\n    // No visible loading text — the popover stays hidden until this resolves\n    // (see showRowActionsPopover), so an intermediate \"…\" would only ever flash.\n    loadingText: '',\n    errorClass: 'row-actions-error',\n    onSwap: (h) => {\n      _rowActionsHtmlCache.set(url, h.innerHTML);\n      if (_rowActionsHtmlCache.size > _ROW_ACTIONS_CACHE_MAX) {\n        _rowActionsHtmlCache.delete(_rowActionsHtmlCache.keys().next().value);\n      }\n      _applyAddMICompatibilityState(h);\n    }\n  });\n}","gi":144},{"say":"How an edit actually happens. The control is not chosen here: the\n           client POSTs the slot to `/api/value-form` and the graph's\n           value-form registry answers with hiccup naming a widget — the\n           editor routes on `data-form-widget` and knows no type tags at all.\n           Note `onSaved`: a value change alters binding rows, so `lookups` is\n           stale and the handler re-fetches rather than re-rendering.","defn":"enterArgValueEditMode","ns":"resources/packages/app/editor/editor-edit-modes.js","n":10,"file":"resources/packages/app/editor/editor-edit-modes.js","lang":"js","line":163,"code":"function enterArgValueEditMode(arg, anchorEl) {\n  if (!arg) return;\n  const expected = (typeof expectedSlotType === 'function')\n                   ? expectedSlotType(arg) : null;\n  openInlineEditPopover({\n    anchorEl,\n    ariaLabel: 'Edit arg value',\n    makeControl(root) {\n      // Hint line above the form — shown when the slot's expected\n      // type is known.\n      if (expected && typeof formatTypeHint === 'function') {\n        const hint = document.createElement('div');\n        hint.className = 'arg-value-edit-hint';\n        hint.textContent = 'Expected: ' + formatTypeHint(expected);\n        root.appendChild(hint);\n      }\n      // The form is fetched async, but `makeControl` must return a\n      // control synchronously — so it returns a host div (with a\n      // spinner) and fills it once /api/value-form responds.\n      const host = document.createElement('div');\n      host.className = 'value-form-host';\n      host.tabIndex = -1;\n      const loading = document.createElement('div');\n      loading.className = 'value-form-loading';\n      loading.textContent = 'Loading…';\n      host.appendChild(loading);\n      root.appendChild(host);\n\n      const status = document.createElement('div');\n      status.className = 'arg-value-edit-status';\n      root.appendChild(status);\n\n      // The backend resolves the slot type and serves the matching\n      // control as hiccup. If the endpoint is unreachable, fall back\n      // to a legacy single-line input so value-editing never breaks.\n      fetchValueForm(arg).then((payload) => {\n        // The user may have dismissed the popover mid-fetch — `root`\n        // is then detached from the document.\n        if (!root.isConnected) return;\n        if (!payload) {\n          makeLegacyControl(host, arg, expected, status);\n          return;\n        }\n        // Marker-typed slot (server-dispatched — the graph's\n        // value-form registry mapped the slot's marker type to the\n        // `secret-binding` widget; the editor knows no tag names):\n        // creating a NEW binding routes to the path+value popover\n        // that writes a resolver binding via POST /api/secrets/binding.\n        // An EXISTING binding keeps the legacy control (same UX as\n        // before server dispatch — inspect/replace the raw value).\n        if (formWidgetName(payload.form) === 'secret-binding') {\n          if (!arg['binding-id']) {\n            enterSecretBindingEditMode(arg, anchorEl);\n            return;\n          }\n          makeLegacyControl(host, arg, expected, status);\n          return;\n        }\n        renderValueForm(host, payload, { expected, statusEl: status });\n      });\n      return host;\n    },\n    async doSave(control) {\n      return saveFormValue(arg, control);\n    },\n    // Full refresh, not `renderGraph` — a value change alters binding/\n    // item rows, leaving `lookups` stale. `loadGraphData` re-fetches the\n    // index + subtree + rich-types (enough to reflect the value + any\n    // inferred-type shift) WITHOUT `initGraph`'s value-kinds/services\n    // re-fetch + graph re-render.\n    onSaved() { if (typeof loadGraphData === 'function') loadGraphData(); },\n    // Delete drops the binding so the slot reverts to a free-arg\n    // placeholder — the single inline path for switching a bound\n    // literal to anything else.\n    onDelete: arg['binding-id']\n              ? () => { if (typeof deleteUseSiteBinding === 'function') deleteUseSiteBinding(arg); }\n              : null\n  });\n}","gi":145,"see":[{"gi":82,"label":"render-repr"}]},{"say":"Every mutating call in the editor goes through this. It is 12 lines\n           and worth all of them: a 401 clears the stored credential and\n           re-opens the sign-in popover in place. The trap to internalize\n           before you write editor code — `authFetch` and `authMutate`\n           **resolve** on 4xx, they do not throw. A caller that only wraps\n           them in `try/catch` counts a rejected write as a success.","defn":"authFetch","ns":"resources/packages/app/editor/editor-auth.js","n":11,"file":"resources/packages/app/editor/editor-auth.js","lang":"js","line":137,"code":"async function authFetch(url, opts = {}) {\n  const pw = getAuthPassword();\n  const headers = Object.assign({}, opts.headers || {});\n  if (pw) headers.Authorization = 'Bearer ' + pw;\n  const merged = Object.assign({}, opts, { headers });\n  const response = await fetch(url, merged);\n  if (response.status === 401 && pw) {\n    clearAuthPassword();\n    void openAuthPopover('Password rejected — please re-enter.'); // fire-and-forget; fields mount async\n  }\n  return response;\n}","gi":146},{"say":"Closing the loop back to the user tutorial: the in-editor guided\n           lessons are graph content (`app.tour/_tour-lessons`, served at\n           `GET /api/tour`) and this file is only the engine that interprets\n           them. Each tick clears the reader-state traps that make a lesson\n           unfinishable — a collapsed Explorer, a kind lens hiding the very fn\n           the step names, a target scrolled out of view — then polls the\n           step's declarative check and advances. A tour that can dead-end is\n           worse than no tour, which is what every guard here is paying for.","defn":"_tourTick","ns":"resources/packages/app/editor/editor-tour.js","n":12,"file":"resources/packages/app/editor/editor-tour.js","lang":"js","line":276,"code":"function _tourTick() {\n  if (!_tourState) return;\n  const step = _tourStep();\n  if (!step) { _tourTeardown(); return; }\n  // A sidebar-anchored step is unreachable while the Explorer is\n  // collapsed (narrow viewports default to collapsed) — expand it once\n  // per step so the spotlight has something to point at. \"Unreachable\"\n  // is not only ABSENT: a collapsed Explorer can keep its input in the\n  // DOM at zero size, which left the step centered with no spotlight\n  // while the text said \"click in the Explorer\".\n  if (step.target && _tourState._expandedFor !== _tourState.step\n      && document.body.classList.contains('sidebar-collapsed')\n      && !_tourTargetVisible(step.target)\n      && typeof toggleCollapsed === 'function') {\n    _tourState._expandedFor = _tourState.step;\n    try { toggleCollapsed(false); } catch (_) { /* stay collapsed */ }\n  }\n  // A LENS the reader left on can hide the very fn the step names. The row\n  // is in the DOM, `hidden`, and the step's check will never pass — the\n  // popover just says \"advances automatically when done\" forever. Same dead\n  // end as a collapsed Explorer, same treatment: clear the lens once per\n  // step, and only when the fn this step is waiting for is the one hidden.\n  // (Lessons 22 / 23, where the lens IS the subject, name no fn in their\n  // checks, so they are untouched.)\n  if (_tourState._lensClearedFor !== _tourState.step) {\n    const wanted = step.check?.name;\n    if (wanted && typeof toggleKindLens === 'function' && _tourFnRowHidden(wanted)) {\n      _tourState._lensClearedFor = _tourState.step;\n      try { toggleKindLens('all'); } catch (_) { /* leave the lens alone */ }\n    }\n  }\n  // Still out of view (a long namespace list, a short window, or — on a\n  // phone — under the sheet)? Bring it in: a spotlight the reader cannot\n  // reach is the same dead end whichever edge hides it.\n  if (step.target && _tourState._scrolledFor !== _tourState.step) {\n    const el = document.querySelector(step.target);\n    if (el && (!_tourTargetVisible(step.target) || _tourUnderSheet(step.target))) {\n      _tourState._scrolledFor = _tourState.step;\n      try { el.scrollIntoView({block: 'center', inline: 'nearest'}); } catch (_) { /* ignore */ }\n    }\n  }\n  _tourPosition();\n  if (step.check && step.check.kind !== 'manual' && _tourCheckPasses(step.check)) {\n    if (typeof gdToast === 'function') gdToast('Step complete ✓');\n    _tourAdvance(false);\n  }\n}","gi":147}]},{"id":":services","title":"Services & the fleet","status":"toured","summary":"Desired-state service registry, the reconciler/supervisor, and the\n             dynamic multi-executor fleet controller.","paths":["src/graphden/services/","src/graphden/fleet/"],"after":[":executor"],"steps":[{"say":"Start with what a service ROW is: this registers the `:service`\n           entity plus the `:restart-policy` / `:cardinality` enums. A service is\n           a desired-state `keep this fn-id running` declaration — not versioned,\n           no args table — the thing everything downstream reconciles toward.","defn":"extend-builder","ns":"graphden.schema.services.schema","n":1,"file":"src/graphden/schema/services/schema.clj","lang":"clj","line":247,"code":"(defn extend-builder\n  \"Extend a schema builder with the :service entity + the\n   :restart-policy / :cardinality enums. Chain after\n   `versioned.schema/extend-builder` (refs `:fn` which the graph schema\n   registers; non-versioned so the versioned-storage decorator passes\n   writes straight through to the base storage, same as\n   `:fn-execution`).\"\n  [builder]\n  (-> builder\n      (ds/add-enum :restart-policy\n                   restart-policy-enum-uuid\n                   (restart-policy-enum-values))\n\n      (ds/add-enum :cardinality\n                   cardinality-enum-uuid\n                   (cardinality-enum-values))\n\n      (ds/add-entity :service service-entity-uuid\n                     {:fn-id {:uuid service-fn-id-field-uuid\n                              :type :ref\n                              :ref-entity :fn}\n                      :enabled? {:uuid service-enabled-field-uuid\n                                 :type :bool}\n                      :restart-policy {:uuid service-restart-policy-field-uuid\n                                       :type :enum\n                                       :enum-name :restart-policy}\n                      :cardinality {:uuid service-cardinality-field-uuid\n                                    :type :enum\n                                    :enum-name :cardinality\n                                    :nullable? true}\n                      :pool-size {:uuid service-pool-size-field-uuid\n                                  :type :int\n                                  :nullable? true}\n                      :branch-id {:uuid service-branch-id-field-uuid\n                                  :type :ref\n                                  :ref-entity :branch\n                                  :nullable? true}\n                      ;; Tenant owner; NULL ≡ platform. Stamped by the tenant\n                      ;; service-create endpoint (task #6), NOT OrgScopedStorage\n                      ;; — `:service` is tenant-forbidden (Option B, see the\n                      ;; field-uuid comment above).\n                      :org-id {:uuid service-org-id-field-uuid\n                               :type :text\n                               :nullable? true}})))","gi":148},{"say":"Resolves a row's cardinality into an advisory-lock slot count:\n           `:per-pod` → no lock, `:singleton` → 1, `:pool` → N. You need this\n           singleton-vs-per-pod-vs-pool model before the reconciler's lock gating\n           makes sense.","defn":"effective-pool-size","ns":"graphden.schema.services.schema","n":2,"file":"src/graphden/schema/services/schema.clj","lang":"clj","line":153,"code":"(defn effective-pool-size\n  \"How many pods may run this service at once — the advisory-lock SLOT\n   count. `:per-pod` → nil (unbounded, no lock). `:singleton` → 1.\n   `:pool` → its `:pool-size`, degrading a nil / non-positive size to 1\n   (safe: behaves as a singleton rather than fanning out). This is the\n   ONE place that resolves the cardinality → slot count, so the reconciler\n   never re-derives it.\"\n  [svc]\n  (case (service-cardinality svc)\n    :per-pod nil\n    :singleton 1\n    :pool (let [n (:pool-size svc)]\n            (if (and (integer? n) (pos? n)) n 1))\n    ;; unknown cardinality — treat conservatively as a singleton\n    1))","gi":149},{"say":"The pure policy core: given the enabled DB rows (desired) and the\n           in-process `running` set (actual), return `{:to-start :to-stop}`. It\n           isolates the reconcile DECISION from side effects — the cleanest first\n           look at the loop.","defn":"diff-desired","ns":"graphden.services.reconciler","n":3,"file":"src/graphden/services/reconciler.clj","lang":"clj","line":76,"code":"(defn diff-desired\n  \"Pure: return `{:to-start [service-id …] :to-stop [service-id …]}`\n   given the set of enabled service IDs (from DB) and the set of\n   currently-running service IDs (from the in-process atom).\n\n   `to-start` = enabled ∖ running (rows that exist + enabled but\n   we haven't started yet).\n   `to-stop` = running ∖ enabled (rows we're running that have been\n   disabled, deleted, or never existed). Disabled rows are stopped\n   alongside deletions — uniform shutdown path.\"\n  [enabled-ids running-ids]\n  (let [enabled-set (set enabled-ids)\n        running-set (set running-ids)]\n    {:to-start (vec (clojure.set/difference enabled-set running-set))\n     :to-stop  (vec (clojure.set/difference running-set enabled-set))}))","gi":150},{"say":"One reconcile pass: read enabled rows, apply `diff-desired`, detect\n           config drift, and race advisory-lock slots. This is BOTH the\n           edge-triggered handler (fired by `:service` CRUD / NOTIFY) and the\n           level-triggered periodic tick — the placeholder it recomputes each\n           pass is exactly what heals a crashed lock-owner on the next tick.","defn":"reconcile-once!","ns":"graphden.services.reconciler","n":4,"file":"src/graphden/services/reconciler.clj","lang":"clj","line":397,"code":"(defn reconcile-once!\n  \"One pass: read enabled `:service` rows, compute diff vs\n   `running-atom`'s contents, start missing + stop removed. Mutates\n   `running-atom` in place.\n\n   A lock-gated service's start is gated on `pg_try_advisory_lock`\n   on the pod's dedicated lock connection (via `:service-locks-holder`\n   on ctx): a `:singleton` races for slot 0, a `:pool` races for the\n   first free of its N slots. When every slot is held by siblings we\n   record a `::not-our-lock` placeholder. That placeholder is TRANSIENT\n   — the top of each pass drops it, so the service is re-attempted every\n   reconcile; a sibling whose owner crashed (auto-releasing the slot,\n   with no NOTIFY) re-acquires it on the next periodic tick. A `:per-pod`\n   service skips the lock and always starts here.\n\n   Before the diff, `pg-lock/ensure-live!` heals a dropped lock\n   connection. A drop released every advisory lock the pod held, so a\n   reconnect triggers `reassert-lock-ownership!` — each `:singleton`\n   we were running re-takes its lock, and any a sibling stole during the\n   outage stops locally. Without this a `:per-pod`-vs-`:singleton` pair\n   could double-run one service until a `:service` edit happened by.\n\n   `start-opts` (optional) is passed straight to `start-service!`,\n   e.g. `{:max-retries 0 :backoff-ms 0}` keeps tests responsive when\n   they intentionally cause start failures.\n\n   Per-branch services: each row carries `:branch-id`. The service\n   is started against THAT branch's ExecutionContext (looked up via\n   `branch-router/ctx-for`), so the same fn-id can run with branch-\n   specific bindings (dev port, prod port). Nil `:branch-id` falls\n   back to the reconciler's base ctx — matches pre-Phase-2 rows.\n\n   Returns `{:started [service-id …] :stopped [service-id …]\n              :not-our-lock [service-id …]}` for logging / tests.\"\n  ([ctx running-atom]\n   (reconcile-once! ctx running-atom {}))\n  ([ctx running-atom start-opts]\n   ;; The reconciler is a PLATFORM actor — pin the pass to the platform\n   ;; org regardless of the CALLER's thread bindings. The edge-triggered\n   ;; pass fires from CRUD writes on an abort-shield thread that CONVEYS\n   ;; the requester's `*current-org*`; under a TENANT binding the\n   ;; `:service` read below returns [] (`:service` is tenant-forbidden in\n   ;; OrgScopedStorage), so desired = ∅ and the pass STOPPED every\n   ;; running service — on prod (2026-08-05) a demo org's fn create shut\n   ;; down the platform web-server until the next periodic tick (which\n   ;; runs unbound = platform) restarted it: a ~15 s total outage any\n   ;; tenant write could trigger. Binding here makes every trigger path\n   ;; (edge, NOTIFY, tick, CRaC resume) behave like the tick.\n   (tctx/with-org tctx/public-org\n                  (reconcile-once!* ctx running-atom start-opts))))","gi":151},{"say":"The supervisor that actually keeps a fn running: invoke the target fn\n           via the executor and, on a startup failure, sleep + retry up to N\n           times per the row's `:restart-policy`, stamping `:start-failed-at` when\n           exhausted so reconcile will not busy-loop. The `how a service stays up`\n           answer that closes out the services half.","defn":"start-service!","ns":"graphden.services.reconciler","n":5,"file":"src/graphden/services/reconciler.clj","lang":"clj","line":159,"code":"(defn start-service!\n  \"Run the service's fn through the supervisor: try `start-service-once!`,\n   on nil-stopper (start failure) sleep + retry up to N times per the\n   row's `:restart-policy`. Returns the `running`-atom entry shape:\n   `{:fn-id :restart-policy :stopper :started-at :start-attempts}`.\n\n   `:start-attempts` records how many tries it took (1 = success on\n   first attempt). When all retries are exhausted, `:stopper` is nil\n   and `:start-failed-at` is set — reconcile keeps the entry so we\n   don't busy-loop trying to start again on every reconcile pass.\n\n   The fn is invoked with an empty args map — services require the\n   target fn to have no free args (enforced at service-create time).\"\n  ([ctx svc] (start-service! ctx svc {}))\n  ([ctx svc {:keys [max-retries backoff-ms]\n             :or {max-retries default-max-retries\n                  backoff-ms default-backoff-ms}}]\n   (let [fn-id (:fn-id svc)\n         args {}\n         policy (:restart-policy svc)\n         max-attempts (if (should-retry? policy) (inc max-retries) 1)]\n     (loop [attempt 1]\n       (let [stopper (start-service-once! ctx svc args)]\n         (cond\n           ;; Success — the fn ran without throwing. Its return is the stopper,\n           ;; which may legitimately be nil (fire-and-forget); `stop-service!`\n           ;; tolerates a nil stopper, so only a THROWN start (the sentinel)\n           ;; counts as failure.\n           (not= stopper start-error)\n           {:fn-id fn-id\n            :restart-policy policy\n            :stopper stopper\n            :started-at (java.time.Instant/now)\n            :start-attempts attempt}\n\n           ;; Exhausted retries — give up, record the give-up time so\n           ;; admin can tell from the running map that we're stuck.\n           (>= attempt max-attempts)\n           (do (when (> attempt 1)\n                 (log/error \"service start exhausted retries\"\n                            {:service-id (:id svc) :attempts attempt}))\n               {:fn-id fn-id\n                :restart-policy policy\n                :stopper nil\n                :started-at (java.time.Instant/now)\n                :start-attempts attempt\n                :start-failed-at (java.time.Instant/now)})\n\n           ;; Retry — exponential backoff (1s, 2s, 4s, …).\n           :else\n           (let [delay-ms (* (long backoff-ms) (long (clojure.math/pow 2 (dec attempt))))]\n             (log/warn \"service start failed, retrying\"\n                       {:service-id (:id svc)\n                        :attempt attempt\n                        :next-delay-ms delay-ms\n                        :policy policy})\n             (Thread/sleep delay-ms)\n             (recur (inc attempt)))))))))","gi":152},{"say":"Opens the fleet half with its shared source of truth: the\n           `:placement` row mapping `(org, entry-fn-id)` → the executor holding\n           that cell, highest-epoch wins. Every fleet component reads or writes\n           this map, so it is the right foundation before routing and packing.","defn":"placement-for","ns":"graphden.fleet.placement","n":6,"file":"src/graphden/fleet/placement.clj","lang":"clj","line":11,"code":"(defn placement-for\n  \"The current `:placement` row for `(org, entry-fn-id)`, or nil if unplaced.\n   Highest `:epoch` wins — defensive against a stale duplicate a partial move\n   might leave behind.\"\n  [storage org entry-fn-id]\n  (->> (sp/query-entities storage :placement {:org org :entry-fn-id entry-fn-id})\n       (sort-by :epoch >)\n       first))","gi":153},{"say":"The internal forward-hop: when a request lands on a pod that does not\n           hold the target cell, look up the holder in the placement map and\n           HTTP-forward there instead of returning `421`. How the placement map\n           becomes live cross-fleet routing.","defn":"forward-or-nil","ns":"graphden.fleet.router","n":7,"file":"src/graphden/fleet/router.clj","lang":"clj","line":57,"code":"(defn forward-or-nil\n  \"If `(org, entry-fn-id)` is placed on a DIFFERENT executor than `self-id`,\n   forward `request` there and return the response. Returns nil when there is\n   no placement, or the cell is placed HERE (`self-id`) — the caller then\n   serves it (if held) or `421`s (the backstop). `self-id` nil (unset fleet\n   identity) ⇒ never forward.\"\n  [storage self-id port org entry-fn-id request]\n  (when self-id\n    (when-let [holder (placement/executor-for storage org entry-fn-id)]\n      (when (not= holder self-id)\n        (forward-request holder port request)))))","gi":154},{"say":"Folds a cell's structural cost (forward-closure fn-count) and live\n           load (the org's in-flight executions) into the single scalar the\n           packer and rebalancer order by. The load signal that drives every\n           placement decision below.","defn":"cell-weight","ns":"graphden.fleet.metrics","n":8,"file":"src/graphden/fleet/metrics.clj","lang":"clj","line":57,"code":"(defn cell-weight\n  \"Fold structural cost + live load into the single scalar the packer orders by.\n\n   `load` is per-ORG (all of an org's cells share it), so Phase 1 attributes the\n   whole org load to each cell. That is exact for the common single-cell-per-org\n   deployment (an org app is one cell today, docs/FLEET_RFC.md §12) and\n   conservative otherwise — a busier org's cells simply sort heavier. Per-cell\n   load attribution is a Phase 2 refinement, gated on multi-cell orgs proving\n   common.\"\n  ([forward-deps storage org root-fn-id]\n   (cell-weight forward-deps storage org root-fn-id default-weights))\n  ([forward-deps storage org root-fn-id {:keys [w-fn-count w-load]}]\n   (+ (* w-fn-count (cell-fn-count forward-deps root-fn-id))\n      (* w-load (org-pending-load storage org)))))","gi":155},{"say":"The LPT (longest-processing-time-first) greedy packer: sort cells\n           heaviest-first and drop each on the least-loaded executor — the classic\n           makespan 2-approximation. It answers `what SHOULD the placement be` for\n           a from-scratch layout.","defn":"pack","ns":"graphden.fleet.packer","n":9,"file":"src/graphden/fleet/packer.clj","lang":"clj","line":69,"code":"(defn pack\n  \"Assign every cell in `cells` to one of `executors`, LPT-greedy.\n\n   `cells`     — seq of `{:org :entry-fn-id :weight}` (weight from\n                 `fleet.metrics/cell-weight`).\n   `executors` — seq of executor-id strings.\n   `opts`      — optional `{:cell-fns {[org entry] #{fn-ids}} :w-overlap n}`.\n                 When `:w-overlap` > 0 and a cell's closure is in `:cell-fns`,\n                 placement prefers the pod that already holds more of it (co-\n                 locating cells that share code). Omitted / 0 ⇒ pure LPT.\n\n   Returns `{:placement {[org entry-fn-id] executor-id} :loads {executor-id\n   total-weight}}`, or nil when there are no executors to place onto. Heaviest\n   cell first, each onto the best target; equal-weight cells are ordered by\n   entry-fn-id so the output is stable.\"\n  ([cells executors] (pack cells executors {}))\n  ([cells executors {:keys [cell-fns w-overlap] :or {w-overlap 0.0}}]\n   (when (seq executors)\n     (let [execs (vec executors)\n           ordered (sort-by (juxt (comp - double :weight) :entry-fn-id) cells)]\n       (loop [remaining ordered\n              loads (zipmap execs (repeat 0.0))\n              pod-fns (zipmap execs (repeat #{}))\n              placement {}]\n         (if-let [cell (first remaining)]\n           (let [ck [(:org cell) (:entry-fn-id cell)]\n                 cfns (get cell-fns ck)\n                 target (best-target loads execs {:pod-fns pod-fns :cell-fns cfns\n                                                  :w-overlap w-overlap})]\n             (recur (next remaining)\n                    (update loads target + (double (:weight cell)))\n                    (if cfns (update pod-fns target into cfns) pod-fns)\n                    (assoc placement ck target)))\n           {:placement placement :loads loads}))))))","gi":156},{"say":"The churn-minimising planner: rather than diff against a fresh pack,\n           do steepest-descent (move one cell busiest → lightest while it strictly\n           reduces spread) with a `:min-improvement` hysteresis floor, emitting\n           the FEWEST moves. How a running fleet is nudged toward balance without\n           thrashing.","defn":"rebalance","ns":"graphden.fleet.rebalance","n":10,"file":"src/graphden/fleet/rebalance.clj","lang":"clj","line":81,"code":"(defn rebalance\n  \"Plan the moves that rebalance `cells` over `executors`, given `current`\n   placement (`{[org entry] executor-id}`).\n\n   `opts` — `{:min-improvement <double> :max-moves <int> :w-overlap <double>}`.\n   `:min-improvement` (default 0.0) is the hysteresis floor: the plan is dropped\n   unless it improves imbalance by more than this. `:max-moves` caps the plan\n   size. `:w-overlap` (default 0.0) makes an imbalance-reducing move prefer a\n   destination that already holds the cell's code (needs cells carrying a\n   `:closure`); 0 keeps the pure churn-minimising descent.\n\n   Returns\n     `{:moves [{:org :entry-fn-id :from :to} ...]  ; churn-minimising, applied in order\n       :unplaced [[org entry-fn-id] ...]           ; cells needing an initial placement\n       :current-imbalance <double>\n       :planned-imbalance <double>\n       :improvement <double>}`.\n   `:moves` is empty when the fleet is already balanced within the floor.\"\n  [cells current executors {:keys [min-improvement max-moves w-overlap]\n                            :or {min-improvement 0.0 max-moves Integer/MAX_VALUE\n                                 w-overlap 0.0}}]\n  (let [exec-set (set executors)\n        placed? #(contains? exec-set (get current (cell-key %)))\n        placed (filter placed? cells)\n        unplaced (into [] (comp (remove placed?) (map cell-key)) cells)\n        weight-of (into {} (map (juxt cell-key (comp double :weight))) placed)\n        closure-of (into {} (keep (fn [c] (when-let [cl (:closure c)] [(cell-key c) cl]))) placed)\n        ;; Seed each pod's held-fn set from the cells currently on it, so overlap\n        ;; is scored against real contents. A moved cell's fns are ADDED to the\n        ;; destination as the descent proceeds (not removed from the source — an\n        ;; over-estimate that only affects the secondary tiebreak, never the exact\n        ;; imbalance descent).\n        init-pod-fns (reduce (fn [m c]\n                               (let [k (cell-key c) e (get current k)]\n                                 (if (and e (:closure c) (contains? m e))\n                                   (update m e into (:closure c))\n                                   m)))\n                             (zipmap executors (repeat #{}))\n                             placed)\n        init-loads (packer/loads-of placed current executors)\n        init-imb (imbalance init-loads)\n        result (loop [loads init-loads\n                      holder (select-keys current (map cell-key placed))\n                      pod-fns init-pod-fns\n                      moves []]\n                 (let [[lightest busiest] (extremes loads executors)]\n                   (if (or (= lightest busiest)\n                           (>= (count moves) max-moves)\n                           (nil? busiest))\n                     {:loads loads :moves moves}\n                     (if-let [{:keys [key]} (best-move loads holder weight-of closure-of\n                                                       pod-fns busiest lightest w-overlap)]\n                       (let [w (weight-of key)\n                             cl (get closure-of key)]\n                         (recur (-> loads (update busiest - w) (update lightest + w))\n                                (assoc holder key lightest)\n                                (cond-> pod-fns cl (update lightest into cl))\n                                (conj moves {:org (first key) :entry-fn-id (second key)\n                                             :from busiest :to lightest})))\n                       {:loads loads :moves moves}))))\n        final-imb (imbalance (:loads result))\n        improvement (- init-imb final-imb)\n        keep? (> improvement min-improvement)]\n    {:moves (if keep? (:moves result) [])\n     :unplaced unplaced\n     :current-imbalance init-imb\n     :planned-imbalance (if keep? final-imb init-imb)\n     :improvement improvement}))","gi":157},{"say":"The pure brain of one control pass: always emit initial placements for\n           unheld cells, but gate rebalance moves behind `:sustain-ticks` so\n           imbalance must PERSIST (not just spike) before cells move. Composes the\n           packer + rebalancer into the actual control policy.","defn":"plan-tick","ns":"graphden.fleet.control-loop","n":11,"file":"src/graphden/fleet/control_loop.clj","lang":"clj","line":62,"code":"(defn plan-tick\n  \"Decide one control pass, PURE. Inputs:\n\n     inputs — `{:cells [{:org :entry-fn-id :weight}] :current {[org entry] exec}\n               :executors [id ...]}` — the live reading.\n     state  — the prior tick's state (`{:over-count n}`, `{}` on the first tick).\n     opts   — `{:min-improvement <double> :sustain-ticks <int> :max-moves <int>\n               :w-overlap <double>}` — `:w-overlap` > 0 makes initial placement\n               co-locate cells that share code (default 0 = pure load balance).\n\n   Returns\n     `{:initial-placements [{:org :entry-fn-id :to} ...]  ; apply every tick\n       :moves [{:org :entry-fn-id :from :to} ...]         ; apply only when sustained\n       :current-imbalance <double>\n       :state {:over-count n}}`.\n\n   Rebalance moves are held until the imbalance (already past the rebalancer's\n   magnitude floor) has recurred for `:sustain-ticks` consecutive ticks; the\n   counter resets when it fires or when a tick finds nothing worth moving.\n   Initial placements are NOT gated — new load lands at once.\"\n  [{:keys [cells current executors]} state {:keys [min-improvement sustain-ticks max-moves w-overlap]\n                                            :or {min-improvement 0.0 sustain-ticks 1\n                                                 max-moves Integer/MAX_VALUE w-overlap 0.0}}]\n  (let [{:keys [moves unplaced current-imbalance]}\n        (rebalance/rebalance cells current executors\n                             {:min-improvement min-improvement :max-moves max-moves\n                              :w-overlap w-overlap})\n        would-move? (boolean (seq moves))\n        over-count (if would-move? (inc (:over-count state 0)) 0)\n        fire? (and would-move? (>= over-count sustain-ticks))]\n    {:initial-placements (plan-initial-placements unplaced cells current executors\n                                                  {:w-overlap w-overlap})\n     :moves (if fire? moves [])\n     :current-imbalance current-imbalance\n     :state {:over-count (if fire? 0 over-count)}}))","gi":158},{"say":"The side-effecting driver the leader-locked component runs each tick:\n           read live cells + current placement, call `plan-tick`, then realise\n           each initial placement and sustained move through the `move-fn` seam.\n           The loop that ties the whole fleet together.","defn":"run-tick!","ns":"graphden.fleet.control-loop","n":12,"file":"src/graphden/fleet/control_loop.clj","lang":"clj","line":151,"code":"(defn run-tick!\n  \"One control pass with side effects behind the `move-fn` seam. Reads the live\n   cells + current placement, decides via `plan-tick`, then realises the decision\n   by calling `move-fn` with `{:org :entry-fn-id :to-executor}` for each initial\n   placement and then each (sustained) move — `move-fn` owns the `move-cell!` +\n   directed transport. Returns the `plan-tick` decision (so the caller carries\n   `:state` to the next tick).\n\n   `env` — `{:storage :forward-deps :executors :move-fn}`. With `:w-overlap` > 0\n   in `opts`, cells are discovered WITH their closures so placement can co-locate\n   code-sharing cells.\"\n  [{:keys [storage forward-deps executors move-fn]} state opts]\n  (let [cells (discover-cells storage forward-deps\n                              {:with-closure? (pos? (double (:w-overlap opts 0.0)))})\n        current (current-placement storage)\n        decision (plan-tick {:cells cells :current current :executors executors} state opts)]\n    (doseq [{:keys [org entry-fn-id to]} (:initial-placements decision)]\n      (move-fn {:org org :entry-fn-id entry-fn-id :to-executor to}))\n    (doseq [{:keys [org entry-fn-id to]} (:moves decision)]\n      (move-fn {:org org :entry-fn-id entry-fn-id :to-executor to}))\n    decision))","gi":159},{"say":"Executes a single relocation as `run-tick!`'s `move-fn`: the load →\n           flip-epoch → evict dance that keeps the cell continuously served\n           (target compiles first, placement epoch bumps to reroute, source evicts\n           last). How an abstract `move` decision safely becomes a live cell\n           migration across pods.","defn":"move-cell!","ns":"graphden.fleet.controller","n":13,"file":"src/graphden/fleet/controller.clj","lang":"clj","line":67,"code":"(defn move-cell!\n  \"Relocate `(org, entry-fn-id)`'s cell to `to-executor`, keeping it served\n   throughout (see ns docstring). Reads the current placement for the source +\n   epoch, so it also performs an INITIAL placement (no current holder ⇒ load +\n   assign, no evict).\n\n   `cmd` keys: `:org` `:entry-fn-id` `:to-executor` `:load-on` `:evict-on`.\n\n   Returns:\n     {:ok true  :from <id-or-nil> :to <id> :epoch <n>}          — moved.\n     {:ok true  :from <id> :to <id> :epoch <n> :noop true}      — already there.\n     {:ok false :reason :no-target}                             — nil target.\n     {:ok false :reason :target-load-failed :from <id> :to <id>} — aborted pre-flip.\"\n  [storage {:keys [org entry-fn-id to-executor load-on evict-on]}]\n  (locking move-monitor\n    (let [current (placement/placement-for storage org entry-fn-id)\n          from (:executor-id current)\n          epoch (:epoch current)]\n      (cond\n        (nil? to-executor)\n        {:ok false :reason :no-target}\n\n        (= from to-executor)\n        ;; Already placed here — idempotent success, no load/flip/evict churn.\n        {:ok true :from from :to to-executor :epoch epoch :noop true}\n\n        :else\n        (let [loaded? (try\n                        (boolean (load-on to-executor entry-fn-id))\n                        (catch Exception e\n                          (log/warn e \"move-cell! target load threw — aborting move (no flip)\"\n                                    {:org org :entry-fn-id entry-fn-id :to to-executor})\n                          false))]\n          (if-not loaded?\n            {:ok false :reason :target-load-failed :from from :to to-executor}\n            (let [new-epoch (inc (or epoch 0))]\n              ;; Flip the routing map: new requests forward to the target now; the\n              ;; source keeps serving whatever it already admitted.\n              (placement/assign! storage {:org org\n                                          :entry-fn-id entry-fn-id\n                                          :executor-id to-executor\n                                          :epoch new-epoch})\n              ;; Source drops the cell. Post-flip, so a failure only leaks the\n              ;; source's closure (reclaimed later) — the move already succeeded.\n              (when from\n                (try\n                  (evict-on from entry-fn-id)\n                  (catch Exception e\n                    (log/warn e \"move-cell! source evict threw — cell relocated, source closure leaked until reclaim\"\n                              {:org org :entry-fn-id entry-fn-id :from from}))))\n              {:ok true :from from :to to-executor :epoch new-epoch})))))))","gi":160}]},{"id":":platform","title":"Platform seams & hardening","status":"toured","summary":"The seams the multi-tenant addon plugs into (docs/TENANCY_SEAM.md)\n             and the hardening layers the core itself carries — effect gate,\n             SSRF egress guard, alerting, BYO executor.","paths":["src/graphden/tenancy/","src/graphden/auth/","src/graphden/clients/","src/graphden/monitoring/","src/graphden/byo.clj","src/graphden/system/sse.clj"],"after":[":services"],"steps":[{"say":"The one tenancy namespace that lives in core: `*current-org*` is the\n           per-request thread-local the private addon binds, and this predicate\n           is how core code asks `am I the platform, or a tenant?` without\n           depending on the policy. Everything org-scoped downstream keys off\n           this seam.","defn":"platform-tier?","ns":"graphden.tenancy.context","n":1,"file":"src/graphden/tenancy/context.clj","lang":"clj","line":42,"code":"(defn platform-tier?\n  \"Is `org` the shared platform tier (the `public` org, or an unbound/nil\n   org that normalises to it)? Today this ALSO means \\\"trusted / operator\\\":\n   every privileged short-circuit in the tenancy layer keys on it. The two\n   meanings — the read-only shared package tier, and platform-admin\n   authority — are unified here so the whole tree tests the tier through ONE\n   predicate rather than three ad-hoc encodings (`(= org public-org)`, a\n   literal `\\\"public\\\"`, and `\\\"\\\"` at the RLS/SQL layer). When operator power\n   moves to a capability grant (Track A2), the authority meaning peels off\n   this predicate while the tier meaning stays.\"\n  [org]\n  (or (nil? org) (= org public-org)))","gi":161},{"say":"Auth is provider-driven: core ships this single-token default behind\n           the `:auth/provider` Integrant key, and the addon swaps in its\n           session/user provider. Note the constant-time compare — the default\n           is small, but it is still a real credential check.","defn":"single-token-provider","ns":"graphden.auth.provider","n":2,"file":"src/graphden/auth/provider.clj","lang":"clj","line":63,"code":"(defn single-token-provider\n  \"The default `AuthProvider` — validates `Bearer <token>` against the one\n   configured `token` (AUTH_TOKEN). The token is captured at construction,\n   so per-request auth performs no env read (an improvement over the old\n   graph path that re-read `AUTH_TOKEN` on every request).\"\n  [token]\n  (->SingleTokenAuthProvider token))","gi":162},{"say":"The effect gate's registry of what a sandboxed graph must NOT do —\n           env / io / network / process / raw-sql — with the docstring\n           explaining why `:raw-sql` exists separately from `:db`. The gate\n           mechanism (`record-effect!` throwing outside `*allowed-effects*`)\n           lives in core; the addon only chooses the policy sets.","defn":"cloud-forbidden-effects","ns":"graphden.executor.compile-runtime","n":3,"file":"src/graphden/executor/compile_runtime.clj","lang":"clj","line":1090,"code":"(def cloud-forbidden-effects\n  \"The security-sensitive effect categories a cloud sandbox must forbid\n   (docs/TENANCY_SEAM.md § Effect gate). A cloud org context should set its\n   `:allowed-effects` to the full effect vocabulary MINUS this set.\n\n   Verified by the effect-gate coverage audit: every base-fn that\n   performs one of these calls `record-effect!`, so excluding them from\n   `:allowed-effects` actually blocks the operation (no silent bypass).\n\n   - `:env`     — environment variables / system properties\n   - `:io`      — file / classpath reads\n   - `:network` — outbound HTTP / sockets\n   - `:process` — thread / server / execution lifecycle control\n   - `:raw-sql` — arbitrary SQL / HoneySQL against a datasource,\n                  BYPASSING the org-scoped + RLS-checked storage\n                  protocol. The org-scoped path (`:query-entities` and\n                  friends) records only `:db` and stays allowed; the\n                  raw escape hatches (`:pg-query` / `:pg-execute` /\n                  `:pg-tx` on the platform pool, `:sql-query` /\n                  `:sql-exec` on an arbitrary datasource) additionally\n                  record `:raw-sql` so a cloud/tenant graph can't read\n                  or mutate the platform DB (incl. RLS-less token /\n                  user / grant tables) or an out-of-band datasource.\n   - `:cross-org` — running a fn under ANOTHER org's `*current-org*`\n                  scope (the cloud domain-router's `:execute-in-org`\n                  primitive). The trusted platform router runs\n                  unrestricted (nil `*allowed-effects*`) so it passes;\n                  forbidding it here keeps it out of every tenant set,\n                  so a tenant graph referencing `:execute-in-org` is\n                  403'd before it can cross into a foreign org. Exactly\n                  the `:raw-sql`/`:pg-query` gate, one level up (org\n                  boundary instead of storage boundary).\n\n   The safe remainder — `:db`, `:time`, `:state`, `:random` — stays\n   allowed (internal infrastructure depends on it). New base-fns must\n   keep this contract: any security-sensitive primitive MUST\n   `record-effect!`, or it becomes a sandbox hole.\"\n  #{:env :io :network :process :raw-sql :cross-org})","gi":163},{"say":"The SSRF egress guard a tenant's outbound call passes before dialing:\n           fail-closed resolution of the hostname, rejecting loopback / RFC1918 /\n           link-local / cloud-metadata targets. Pair it with `validating-dns`\n           below in the same file — the connect-time re-check that closes the\n           DNS-rebind TOCTOU.","defn":"check-target!","ns":"graphden.clients.egress","n":4,"file":"src/graphden/clients/egress.clj","lang":"clj","line":86,"code":"(defn check-target!\n  \"Gate an outbound `url` before dialing: parse its host and run\n   `resolve-public-ips`. Throws `:egress/blocked` for a non-public / rebinding\n   / unparseable target; returns nil when the target is safe.\"\n  [url]\n  (let [host (try (URI/.getHost (URI. (str url)))\n                  (catch Exception _ nil))]\n    (when (str/blank? host)\n      (throw (ex-info (str \"egress blocked: no host in url \" url)\n                      {:type :egress/blocked :url url :reason :no-host})))\n    (resolve-public-ips host)\n    nil))","gi":164},{"say":"An allowlist walk over an EDN hiccup tree — permitted tags,\n           permitted attrs, a depth cap and a node budget, returning nil for\n           'no representable output'. This is the gate on every path where\n           GRAPH-authored markup reaches the editor's own DOM: typed value\n           representations, component previews, server partials rendering\n           user content. Anything not on the list collapses to escaped text\n           rather than being rejected loudly — the sanitizer's job is to make\n           the surface safe, not to argue with the author.","defn":"sanitize-hiccup","ns":"graphden.web.hiccup-sanitize","n":5,"file":"src/graphden/web/hiccup_sanitize.clj","lang":"clj","line":116,"code":"(defn sanitize-hiccup\n  \"Sanitize `node` (an EDN hiccup tree — string or keyword tags) under\n   the ns policy. Returns the sanitized tree, or nil when the node is\n   disallowed / the bounds are exceeded. Top-level callers should treat\n   nil as \\\"no representable output\\\".\"\n  ([node]\n   (let [budget (volatile! max-nodes)\n         walk   (fn walk\n                  [n depth]\n                  (when (and (<= depth max-depth) (pos? @budget))\n                    (vswap! budget dec)\n                    (cond\n                      (nil? n) nil\n                      (or (string? n) (number? n) (boolean? n)) n\n                      (keyword? n) (name n)\n\n                      (vector? n)\n                      (when-let [t (tag-name (first n))]\n                        (when (contains? allowed-tags t)\n                          (let [attrs    (when (map? (second n)) (second n))\n                                children (if attrs (nnext n) (next n))\n                                kids     (into []\n                                               (keep #(walk % (inc depth)))\n                                               children)]\n                            (into [t (sanitize-attrs (or attrs {}))] kids))))\n\n                      ;; A non-vector sequence is a child seq, not an element.\n                      (sequential? n)\n                      (into [] (keep #(walk % (inc depth))) n)\n\n                      ;; Anything else (RawString, objects) — collapse to a\n                      ;; plain string; hiccup2 escapes it on render.\n                      :else (str n))))]\n     (walk node 0))))","gi":165,"see":[{"gi":82,"label":"render-repr"}]},{"say":"Observability starts smaller than you expect: a process-global,\n           monotonic `{event → long}` atom. Everything in docs/MONITORING.md —\n           the usage rollups, the Prometheus scrape, the alerter's window\n           below — is a diff of two `snapshot`s of this map. Monotonic on\n           purpose: readers diff rather than reset, so two of them can never\n           invalidate each other's window.","defn":"count!","ns":"graphden.util.counters","n":6,"file":"src/graphden/util/counters.clj","lang":"clj","line":59,"code":"(defn count!\n  \"Record `n` (default 1) occurrences of `event`. Thread-safe; returns nil so\n   it can never be mistaken for a value-producing call in a threading form.\"\n  ([event] (count! event 1))\n  ([event n]\n   (swap! counters update event (fnil + 0) n)\n   nil))","gi":166},{"say":"The built-in alerter's pure policy: given the last window's counters\n           and the previous state, decide fire / resolve / stay quiet. All the\n           side effects (scheduler, webhook POST) live elsewhere — this is the\n           testable core of docs/MONITORING.md's second alerting path.","defn":"decide","ns":"graphden.monitoring.alerts","n":7,"file":"src/graphden/monitoring/alerts.clj","lang":"clj","line":35,"code":"(defn decide\n  \"Pure alert policy. Returns `{:fire [alert…] :state new-state}`.\n\n   `inputs`  — `{:org-totals [{:org :runs :failed}…] :server-error-delta n}`.\n   `state`   — `{key → last-fired-ms}` (opaque; thread the returned :state back).\n   `cfg`     — merged over `default-config`.\n   `now-ms`  — injected clock.\n\n   An alert is `{:kind :error-spike|:server-errors :org? :runs? :failed?\n   :ratio? :count? :message}`. Cooldown-suppressed keys are simply absent from\n   `:fire`; their prior timestamp carries forward in `:state`.\"\n  [{:keys [org-totals server-error-delta]} state cfg now-ms]\n  (let [{:keys [error-ratio min-runs server-error-min cooldown-ms]}\n        (merge default-config cfg)\n        state (or state {})\n        candidates\n        (cond-> (for [{:keys [org runs failed]} org-totals\n                      :when (and (>= runs min-runs)\n                                 (>= (/ (double failed) (double runs)) error-ratio))]\n                  {:kind :error-spike :org org :runs runs :failed failed\n                   :ratio (/ (double failed) (double runs))\n                   :message (format \"org %s: %d/%d runs failed (%.0f%%) in the last window\"\n                                    org failed runs\n                                    (* 100.0 (/ (double failed) (double runs))))})\n          (and server-error-delta (>= server-error-delta server-error-min))\n          (conj {:kind :server-errors :count server-error-delta\n                 :message (format \"%d server errors (5xx) since the last check\"\n

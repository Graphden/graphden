def)      (assoc :source-line\n                                                     (:source-line fn-def))\n                   ;; `:tags` — set of declarative capability / shape markers\n                   ;; on the fn-def. Policy callers (e.g. the admin-only-vault\n                   ;; capability gate in `crud.secret-shape`) query by tag\n                   ;; rather than hardcoding fn-name sets, so adding a new\n                   ;; tagged base-fn is a one-line `fns.edn` annotation.\n                   (seq (:tags fn-def))       (assoc :tags\n                                                     (set (:tags fn-def)))\n                   ;; `:branch-local?` — effective (monotonic OR) over\n                   ;; own + every parent's stored effective. Topo-sort\n                   ;; in sync means parents have been recorded before\n                   ;; us, so we can read from the registry directly.\n                   ;; ONLY stashed when true — false is the default\n                   ;; everywhere else (resolve-version-from-cache,\n                   ;; type-checker), so keeping the absent-key\n                   ;; convention matches existing patterns and\n                   ;; preserves identity assertions in tests.\n                   (or (:branch-local? fn-def)\n                       (some (fn [p]\n                               (let [v (rich-types-view)]\n                                 (get-in v [:by-id (get-in v [:by-name p])\n                                            :branch-local?])))\n                             (or (seq (:parents fn-def))\n                                 (when (:parent fn-def)\n                                   [(:parent fn-def)])\n                                 [])))\n                   (assoc :branch-local? true)))]\n     ;; `:effects` race resolution: the type-checker computes a fn's\n     ;; full effect set (parent inheritance + own-declared) and writes\n     ;; it via `record-rich-types-raw!`. Earlier in the same sync we\n     ;; wrote a raw `record-rich-types!` entry with only the fn-def's\n     ;; OWN-declared effects (often empty for composed fns that inherit\n     ;; `:process` from `:future`). If a parallel bootstrap re-runs\n     ;; `record-rich-types!` AFTER the type-check has populated\n     ;; computed effects, this second raw write would erase them — any\n     ;; service-eligibility assertion downstream then sees an empty\n     ;; set. Preserve existing non-empty effects when the fn-def\n     ;; declares none.\n     (swap! (target-rich-types-atom)\n            (fn [reg]\n              (let [existing (get-in reg [:by-id fn-id])\n                    final-effects (if (and (empty? raw-effects)\n                                           (seq (:effects existing)))\n                                    (:effects existing)\n                                    raw-effects)]\n                (reduce (fn [r k] (assoc-in r [:by-name k] fn-id))\n                        (assoc-in reg [:by-id fn-id]\n                                  (cond-> (assoc (build final-effects)\n                                                 :fn-id fn-id :name fn-name)\n                                    (:namespace fn-def)\n                                    (assoc :namespace (:namespace fn-def))))\n                        (index-keys-for fn-name (:namespace fn-def)))))))))","gi":66,"see":[{"gi":9,"label":"compile-all"},{"gi":129,"label":"api-rich-types"}]},{"say":"…and how it is READ — by fn **id**, not name. Names are\n           per-namespace labels and may repeat; ids cannot\n           (docs/adr/ADR-identity-model.md, enforced in CI by\n           `id_resolution_guard_test`). The `:by-name` index survives only for\n           base-fns and legacy call sites. Before you key any new registry or\n           dispatch by name, read the ADR — this is the mistake it exists to\n           stop.","defn":"rich-type-of-id","ns":"graphden.executor.registry.core","n":17,"file":"src/graphden/executor/registry/core.clj","lang":"clj","line":590,"code":"(defn rich-type-of-id\n  \"Registry entry by the fn's IDENTITY — the primary lookup for every\n   caller that holds a row / fn-map entry (executor compile, persist\n   redaction, crud validation). Never ambiguous: per-namespace names may\n   repeat, ids can't. Tenant precedence mirrors `rich-type-of`.\"\n  ([fn-id]\n   (or (when-let [org (current-tenant-org)]\n         (get-in @(target-per-org-rich-atom) [org :by-id fn-id]))\n       (get-in (rich-types-view) [:by-id fn-id])))\n  ([fn-id arg-name]\n   (get-in (rich-type-of-id fn-id) [:args arg-name])))","gi":67}]},{"id":":crud","title":"CRUD & the write path","status":"toured","summary":"Entity/branch/secret writes, request parsing, type-check on write,\n             fn-execution lookup + persist.","paths":["src/graphden/crud/"],"after":[":storage",":types"],"steps":[{"say":"The HTTP boundary where a mutation first becomes structured data:\n           pull `type` / `id` out of a write request, preferring reitit\n           `:path-params` and falling back to raw-URI parsing.","defn":"extract-entity-params","ns":"graphden.crud.request","n":1,"file":"src/graphden/crud/request.clj","lang":"clj","line":128,"code":"(defn extract-entity-params\n  \"Extracts type-str, id-str, entity-type from request. Prefers\n   reitit's `:path-params` when present; falls back to URI parsing\n   (the handler is sometimes reached with the raw http-kit request\n   that hasn't been through reitit's `enrich-request`).\n\n   `known` — the live schema's entity-type set, so an addon's entities\n   resolve too. Omit it and only the core types do.\"\n  ([request] (extract-entity-params request nil))\n  ([request known]\n   (let [pp (:path-params request)\n         rp (when (nil? pp) (parse-uri-segments (:uri request)))\n         type-str (or (:type pp) (:type-str rp))\n         id-str (or (:id pp) (:id-str rp))]\n     {:type-str type-str\n      :id-str id-str\n      :entity-type (entity-type-from-string type-str known)})))","gi":68},{"say":"Normalizes the Ring body (string / InputStream / already-parsed) into\n           a keyword-keyed Clojure map — the payload every entity write is built\n           from.","defn":"read-json-body","ns":"graphden.crud.request","n":2,"file":"src/graphden/crud/request.clj","lang":"clj","line":147,"code":"(defn read-json-body\n  \"Pull the JSON body off a Ring request whether it arrives as a\n   string, an InputStream, or already-parsed Clojure data. Returns\n   a Clojure map with keyword keys, or nil for an empty body. The\n   layout endpoint has the same logic — we duplicate here so the\n   types API doesn't depend on app.layout (cross-package).\"\n  [request]\n  (let [raw (:body request)]\n    ;; A malformed body is UNTRUSTED, unauthenticated-reachable input\n    ;; (every /auth/* handler and every graph JSON endpoint reads here).\n    ;; A bare `JsonParseException` carries no ex-data `:type`, so the\n    ;; error boundary would map it to 500 AND page on `:http/server-error`.\n    ;; Re-raise as a typed `:validation-error/*` → 400, no server-error.\n    (try\n      (cond\n        (nil? raw)                            nil\n        (map? raw)                            raw\n        (instance? java.io.InputStream raw)\n        (json/parse-stream\n          (java.io.InputStreamReader. ^java.io.InputStream raw \"UTF-8\") true)\n        (and (string? raw) (not (str/blank? raw)))\n        (json/parse-string raw true)\n        :else                                 nil)\n      (catch com.fasterxml.jackson.core.JsonProcessingException _\n        (throw (ex-info \"Malformed JSON in request body.\"\n                        {:type :validation-error/malformed-json}))))))","gi":69},{"say":"Resolves the target branch (by UUID or name) so a write lands on the\n           right versioned storage. The branch dimension enters here, before any\n           row is touched.","defn":"resolve-branch-ref","ns":"graphden.crud.branches","n":3,"file":"src/graphden/crud/branches.clj","lang":"clj","line":32,"code":"(defn resolve-branch-ref\n  \"Branch lookup that accepts either a stringified UUID or a branch\n   name. Returns the row, or nil when not found. Public so the\n   `:resolve-branch-ref` base-fn in `app/branches` can delegate\n   directly.\"\n  [storage branch-ref]\n  (or (some->> (request/parse-uuid-or-clear branch-ref)\n               (sp/read-entity storage :branch))\n      (when (and (string? branch-ref) (not (str/blank? branch-ref)))\n        (first (sp/query-entities storage :branch {:name branch-ref})))))","gi":70,"see":[{"gi":32,"label":"wrap-with-versioning"}]},{"say":"The generic single-row write entry point, and the best first stop for\n           the whole write path: it sequences every stage — capability gate,\n           `write-rej` validation, `sp/create-entity`, then invalidate + notify.","defn":"create-entity","ns":"graphden.crud.entities","n":4,"file":"src/graphden/crud/entities.clj","lang":"clj","line":157,"code":"(defn create-entity\n  [entity-type data ctx]\n  (if-let [f *create-entity-override*]\n    (f entity-type data ctx)\n    (create-entity-impl entity-type data ctx)))","gi":71},{"say":"The pre-write rejection gate that `create-entity` / `update-entity`\n           consult. It centralizes the cycle / MI-collision / terminal /\n           list-closed / secret-path checks that can veto a mutation before it\n           ever persists.","defn":"write-rej","ns":"graphden.crud.validation","n":5,"file":"src/graphden/crud/validation.clj","lang":"clj","line":715,"code":"(defn write-rej\n  \"Run every server-side write-time guard against the proposed row.\n   Returns the first `{:reason :type}` rejection or nil if all pass.\n   Centralised so generic `create-entity` / `update-entity` and the\n   form-driven `process-*` paths share the same checks in the same\n   order.\"\n  [storage entity-type entity-data]\n  (or (some-> (cycle-check-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/dependency-cycle))\n      (some-> (constraint-shape-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/constraint-shape))\n      (some-> (mi-collision-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/mi-collision))\n      (some-> (value-override-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/value-override))\n      (some-> (terminal-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/terminal-seal))\n      (some-> (list-closed-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/list-closed))\n      (some-> (reparent-cross-branch-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/reparent-cross-branch))\n      (some-> (resolver-rej storage entity-type entity-data)\n              (assoc :type :capability/resolver-marker-laundering))\n      (some-> (route-handler-shape-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/route-handler-shape))))","gi":72},{"say":"A multi-row atomic write unit: fn-row + N slot-rows + N fn-slot\n           junctions, appending each success to a shared `journal` atom. Shows\n           how one logical create fans out into many graph rows.","defn":"apply-create-record-type-body","ns":"graphden.crud.entities.record-type","n":6,"file":"src/graphden/crud/entities/record_type.clj","lang":"clj","line":94,"code":"(defn apply-create-record-type-body\n  \"Phases 1-3 of create-record-type's atomic write — fn-row + N\n   slot-rows + N fn-slot junctions + cache-invalidate. Mutates\n   `journal` (shared atom-of-vector) on each successful storage\n   write so the rollback callable can replay in reverse. Throws on\n   any storage / type-resolve failure — caught by the surrounding\n   `:try` graph node. Reached only after `:_create-record-type-\n   validation` passed.\n\n   Body is orchestration; each phase lives in a small private\n   helper so the read flows top-to-bottom by phase name.\"\n  [parsed journal ctx]\n  (let [storage (request/require-storage ctx)\n        {nm :name ns-id :ns-id desc :description fields :fields} parsed\n        own-id (create-record-type-fn-row! storage journal nm ns-id desc)]\n    (create-record-type-fields! storage journal own-id fields)\n    (inval/invalidate! ctx storage :fn {:id own-id})\n    {:ok true :id (str own-id) :name nm}))","gi":73},{"say":"The `:try` on-throw partner: replay the `journal` in reverse,\n           best-effort deleting each row. This is how atomicity is achieved here\n           WITHOUT a DB transaction — the compensating half of the body above.","defn":"apply-create-rollback","ns":"graphden.crud.entities.record-type","n":7,"file":"src/graphden/crud/entities/record_type.clj","lang":"clj","line":114,"code":"(defn apply-create-rollback\n  \"`:try`'s on-throw branch for create-record-type AND create-list-type.\n   Derefs `journal` and replays entries in reverse, deleting each\n   row best-effort (delete failures are logged, not re-thrown — the\n   important contract is that user state stays consistent with what\n   the response says). Returns the `{:ok false :error :data}` shape.\"\n  [journal exception ctx]\n  (let [storage (request/require-storage ctx)]\n    (doseq [[et id] (reverse @journal)]\n      (try (sp/delete-entity storage et id)\n           (catch Exception e\n             (log/warn e \"Rollback delete-entity failed for\"\n                       et id \"— manual cleanup may be required\")))))\n  ;; `Throwable/.getMessage` can return null (Java API contract); wrap\n  ;; both branches in `str` so the `:error` field is always a string.\n  (let [msg (str (Throwable/.getMessage ^Throwable exception))]\n    (cond-> {:ok false :error msg}\n      (instance? clojure.lang.ExceptionInfo exception)\n      (assoc :data (ex-data exception)))))","gi":74},{"say":"The atomic core for generic creates: create-or-humanise-error, a\n           post-create whole-fn type-check, and the rename-slot side-effect.\n           Since error-tolerance Phase 2 an ORDINARY type-check failure no\n           longer rolls the row back — the write is kept and the diagnostics\n           surface as `:type-warnings` on the success envelope. One class is\n           carved out: a SECRET-flow diagnostic still deletes the row and\n           returns the legacy `{:error …}` (the guarantee must not rest on\n           the derived diagnostics store — docs/SECRETS.md).","defn":"apply-create-core","ns":"graphden.crud.entities","n":8,"file":"src/graphden/crud/entities.clj","lang":"clj","line":510,"code":"(defn apply-create-core\n  \"§3.3 atomic core of the create-apply flow: capability gate +\n   `sp/create-entity` (with unique-violation humanisation) + Phase-6c\n   rename-slot side-effect + post-create whole-fn type-check.\n   Returns a uniform shape:\n     `{:created <id>}` on success\n     `{:created <id> :type-warnings [<diagnostic> …]}` when the write\n       landed but the owning fn now fails the aggregate type-check\n       (error-tolerance Phase 2 — the row is KEPT, the failure is\n       recorded in the per-branch diagnostics store and surfaced\n       additively; clients that ignore the key keep working)\n     `{:error <human-msg>}` on a write failure (capability rejection,\n       storage constraint violation, …)\n   so the outer graph can dispatch on the shape and run invalidate /\n   notify / response uniformly. Structural gates (cycles, name\n   collisions, terminal / list-closed, MI) still reject BEFORE this\n   fn runs — only the TYPE check became non-blocking. SECURITY\n   CARVE-OUT: a SECRET-flow type failure (laundering a `[:secret …]`\n   value into a plain slot) keeps the pre-Phase-2 behaviour — the\n   just-created row is deleted and the diagnostic message comes back\n   as `{:error …}` (a 400 on the wire); the guarantee must not rest\n   on the derived diagnostics store (docs/SECRETS.md).\"\n  [{:keys [entity-type type-str form-data entity-data]} ctx]\n  (let [storage (request/require-storage ctx)\n        entity-data (normalize-binding-slot storage entity-type entity-data)\n        pkg-reason (pkg-guard/write-rejection storage entity-type entity-data)\n        create-result (if pkg-reason\n                        {:error pkg-reason :http-status 403}\n                        (try-create-or-error storage entity-type entity-data type-str))]\n    (if (:created create-result)\n      (let [rej (post-write-type-rej storage type-str entity-data nil)]\n        (if (:secret? rej)\n          ;; Hard reject: roll back the just-created row (logged, not\n          ;; swallowed — an orphan surviving the rejection must be\n          ;; visible) and surface the diagnostic message as the error.\n          ;; The rename-slot side-effect deliberately hasn't run yet,\n          ;; so no orphan renamed-view slot is left behind either.\n          (do (try (sp/delete-entity storage entity-type (:created create-result))\n                   (catch Exception e\n                     (log/warn e \"Rollback delete-entity failed after secret-flow type-check rejection\"\n                               {:entity-type entity-type\n                                :id (:created create-result)})))\n              {:error (:reason rej)})\n          (do (when (and (= type-str \"binding\")\n                         (contains? form-data :rename-to))\n                (forward-rename-slot! storage form-data entity-data))\n              (cond-> create-result\n                rej (assoc :type-warnings [(:diagnostic rej)])))))\n      ;; Preserve the error's :http-status (409 collisions, 403\n      ;; capability — the central web.errors mapping) alongside the\n      ;; human message.\n      (cond-> {:error (or (:error create-result)\n                          (str \"Failed to create \" type-str))}\n        (:http-status create-result)\n        (assoc :http-status (:http-status create-result))))))","gi":75},{"say":"Reconstructs the touched fn-def and runs `check-fn-def!` after a\n           mutation, recording failures in (and clearing fixes from) the\n           per-branch diagnostics store. This is the type-check-on-write that\n           `apply-create-core` relies on — an ill-typed fn persists, but never\n           silently: every save re-derives its diagnostics. The\n           `:reject-secret?` option is the security carve-out: a\n           secret-involving failure is flagged `:secret? true` and NOT\n           recorded — the caller rolls the write back and hard-rejects.","defn":"type-check-fn-after-mutation!","ns":"graphden.crud.type-check","n":9,"file":"src/graphden/crud/type_check.clj","lang":"clj","line":371,"code":"(defn type-check-fn-after-mutation!\n  \"Run `check-fn-def!` on the affected fn-id after a CRUD mutation\n   touched its bindings/slots. Returns nil on success or\n   `{:reason … :diagnostic …}` on type-check failure. Since\n   error-tolerance Phase 2 the CRUD callers KEEP the write on failure\n   and surface `:diagnostic` additively as `:type-warnings` on the\n   success envelope — this guard's job is recording, not rejection.\n   `:reason` stays the human-readable message string; `:diagnostic`\n   is the cleaned structured ex-data (`diag/from-ex` — `:expected` /\n   `:actual` / `:arg-name` / …). Composed fns only; type-rows /\n   base-fns short-circuit (no parents → nothing to check).\n\n   Also keeps the per-branch diagnostics store fresh: failure records,\n   success clears, the fn's entry under the storage's current branch\n   (nil branch-id for an unversioned/base storage = default branch).\n\n   SECURITY CARVE-OUT (`:reject-secret?` option): when the failing\n   diagnostic is secret-involving (`secret-diagnostic?`) the result\n   carries `:secret? true`, and with `{:reject-secret? true}` the\n   store is left UNTOUCHED — the caller commits to rolling the write\n   back and returning a hard error, so no diagnostic should describe\n   a row that won't exist (and the fn's prior entry, describing the\n   restored prior state, stays valid). Callers WITHOUT the option\n   (the boot/restart recompute sweep, delete re-derivation, secret\n   rotation) keep recording secret diagnostics — for rows that DO\n   persist, the recorded entry is what the execute-refusal gate\n   reads.\"\n  ([storage fn-id]\n   (type-check-fn-after-mutation! storage fn-id nil))\n  ([storage fn-id {:keys [reject-secret?]}]\n   (with-org-alias-view*\n     (fn []\n       (let [result\n             (try\n               (when-let [fn-def (reconstruct-fn-def storage fn-id)]\n                 (types-check/check-fn-def! fn-def))\n               nil\n               (catch clojure.lang.ExceptionInfo e\n                 ;; `.getMessage` is nullable; `str` keeps the response field a\n                 ;; string instead of a JSON-`null` the client would render as\n                 ;; \"rejected, no reason\".\n                 {:reason (str (Throwable/.getMessage e))\n                  :diagnostic (diag/from-ex e)})\n               (catch Exception e\n                 ;; Defensive: any unexpected error during reconstruction is\n                 ;; surfaced (better than silent broken state, worse than\n                 ;; nothing).\n                 (let [msg (str \"type-check error: \" (Throwable/.getMessage e))]\n                   {:reason msg\n                    :diagnostic {:message msg}})))\n             secret? (boolean (some-> result :diagnostic secret-diagnostic?))\n             result (cond-> result\n                      (and result secret?) (assoc :secret? true))\n             branch-id (vs/current-branch-id storage)]\n         (cond\n           (nil? result)\n           (diag/clear-fn! branch-id fn-id)\n\n           ;; Secret carve-out: the caller rolls the write back, so the\n           ;; store must not gain an entry for a row that won't exist.\n           (and secret? reject-secret?)\n           nil\n\n           :else\n           (diag/record! branch-id fn-id [(:diagnostic result)]))\n         result)))))","gi":76,"see":[{"gi":64,"label":"check-fn-def!"}]},{"say":"The post-persist step: invalidate caches and broadcast a NOTIFY delta\n           so sibling pods rebuild the affected fns. How a committed write becomes\n           visible fleet-wide.","defn":"notify-after-write!","ns":"graphden.crud.entities.invalidation","n":10,"file":"src/graphden/crud/entities/invalidation.clj","lang":"clj","line":219,"code":"(defn notify-after-write!\n  \"Fire NOTIFY events on `graphden_events` so sibling pods react to\n   the mutation:\n\n   - `:service` writes → `service:<op>:<id>` — handled by the\n     reconciler's listener callback in `system/core.clj`.\n   - fn-graph writes (`:fn` / `:slot` / `:fn-slot` / `:binding` /\n     `:binding-list-item`) → one `fn:invalidate:<seed-fn-id>|<branch-id>`\n     event per affected fn-id (delta invalidation), or\n     `fn:invalidate:|<branch-id>` with empty id when the change is\n     cross-cutting (full clear) — handled by `:exec/compiled-registry`'s\n     listener callback.\n\n   The branch-id rides along because the sibling pod has to answer the\n   same question this pod answered locally: which of MY cached branch\n   registries can see this write? Without it a sibling would either\n   over-invalidate (recompiling `main` for a `dev` edit) or, as it did\n   before, invalidate only its base ctx and leave every cached branch\n   serving stale closures.\n\n   Cheap on the write path: one `pg_notify` SQL against the main\n   pool, per emitted event. Becomes a no-op when the ctx has no\n   `:notify-emitter` (tests without PG).\"\n  [ctx storage entity-type op data]\n  (when-let [emit (:notify-emitter ctx)]\n    (cond\n      (and (= entity-type :service) (:id data))\n      (emit {:kind :service :op op :id (str (:id data))})\n\n      (contains? fn-graph-entity-types entity-type)\n      (let [seeds (affected-fn-ids storage entity-type data)\n            branch-id (some-> (vcore/current-branch-id storage) str)\n            ;; The writing org, straight off the written row — OrgScopedStorage\n            ;; stamps `:org-id` on scoped entities, so `data` (the returned\n            ;; row) carries it without this core-layer code depending on\n            ;; tenancy. nil in single-tenant / un-scoped writes → omitted. Used\n            ;; only by the SSE relay to fan an event out to the right org's\n            ;; remote executors (the local invalidate path ignores it).\n            org-id (:org-id data)\n            ;; `cond->`, not a bare assoc: an un-versioned storage has no\n            ;; branch, and a nil-valued key is a different map from an\n            ;; absent one — `parse-payload` omits it on the way back for\n            ;; the same reason.\n            ;; The request's exact epoch bumps ride the event so the\n            ;; receiving pod can mark them covered (4th payload slot).\n            epochs (some-> epoch/*request-bump-log* deref seq vec)\n            event (fn [id]\n                    (cond-> {:kind :fn :op :invalidate :id id}\n                      branch-id (assoc :branch-id branch-id)\n                      org-id (assoc :org-id org-id)\n                      epochs (assoc :epochs epochs)))]\n        ;; The same three-way answer the local path takes, because a pod receives\n        ;; its OWN notify: an empty-id event means \"full clear\" to the listener,\n        ;; so emitting one for a write that changed no closure would undo the\n        ;; local delta and rebuild the whole graph on the next request — which is\n        ;; exactly what a `:slot` write did, from here, even after the local path\n        ;; was fixed.\n        ;;\n        ;; A bare slot that nothing exposes is invisible to every compiled\n        ;; closure, on this pod and on its siblings. The moment an fn DOES expose\n        ;; it, that `:fn-slot` write emits a seeded event, and the sibling's\n        ;; splice reads the slot row in with it.\n        (cond\n          (seq seeds) (doseq [seed seeds]\n                        (emit (event (str seed))))\n          ;; nil ≡ \"unknown shape\" — mirror the local `(invalidate-graph-cache!\n          ;; ctx)` full clear.\n          (nil? seeds) (emit (event \"\"))\n          :else nil)))))","gi":77},{"say":"Translates the `/api/execute` `{:fn-id | :fn-name}` request into the\n           full `:fn` row in one round-trip — the lookup that begins the\n           execution + persist path.","defn":"resolve-fn","ns":"graphden.crud.fn-execution.lookup","n":11,"file":"src/graphden/crud/fn_execution/lookup.clj","lang":"clj","line":82,"code":"(defn resolve-fn\n  \"Like `resolve-fn-id` but returns the full :fn row in a single\n   storage round-trip. Use this when the caller needs both `:id` AND\n   `:name` (or other columns) — saves the extra `read-entity` you'd\n   otherwise chain after `resolve-fn-id`. Returns nil if neither\n   identifier resolves.\"\n  [storage parsed]\n  (cond\n    (:fn-id parsed)   (sp/read-entity storage :fn (:fn-id parsed))\n    (:fn-name parsed) (query-fn-by-name storage (:fn-name parsed))\n    :else nil))","gi":78},{"say":"The `/api/execute` orchestrator: resolve fn + version + free-arg\n           slots, acquire a concurrency slot, submit the future, and dispatch on\n           succeeded / pending / failed. The spine of the execute write path —\n           and where it hands off to the executor from the first block.","defn":"apply-execute","ns":"graphden.crud.fn-execution","n":12,"file":"src/graphden/crud/fn_execution.clj","lang":"clj","line":121,"code":"(defn apply-execute\n  \"Stage 3 — submit the future, deref with timeout. Returns one of:\n     {:status :succeeded :result … :execution-id? :declared-effects …}\n     {:status :pending :execution-id …}\n     {:status :failed :error … :error-data … :execution-id?}\n     {:ok false :status :rejected …} — submit-time refusal (recorded\n       type errors, capacity cap) before any row/future exists.\n\n   Persistence policy:\n   - Pre-create row when we know we need polling capability\n     (timeout > a few hundred ms is enough to justify the write —\n     keeps the polling client able to find the row even if completion\n     races our response).\n   - For pure fast fns with `:persist? false`, finalise without ever\n     writing a row.\"\n  ([ctx parsed]\n   ;; Non-graph callers (tests, BYO) — resolve the row here; the graph\n   ;; path passes the validation stage's already-resolved `:_execute-fn-row`\n   ;; through the 3-arity, so the request does ONE resolve, not two.\n   (apply-execute ctx parsed (lookup/resolve-fn (request/require-storage ctx) parsed)))\n  ([ctx parsed fn-row]\n   (or (type-error-rejection (request/require-storage ctx) fn-row)\n       (apply-execute* ctx parsed fn-row))))","gi":79},{"say":"Atomically writes the `:fn-execution` row plus its per-arg\n           (`:fn-execution-arg` / `-item`) rows — the concrete `an execution\n           becomes persisted graph rows` step.","defn":"create-pending-with-args!","ns":"graphden.crud.fn-execution.persist","n":13,"file":"src/graphden/crud/fn_execution/persist.clj","lang":"clj","line":327,"code":"(defn create-pending-with-args!\n  \"Atomic: create a `:pending` row + write the per-arg rows. Returns\n   the parent row. Used by both `apply-execute` pre-persist and lazy-\n   persist branches; the future registration happens at the callsite\n   because the two paths sequence it differently.\"\n  [storage fn-version-id declared-effects user-id args free-slots]\n  (let [r (create-pending-row! storage fn-version-id declared-effects user-id)]\n    (persist-args! storage (:id r) args free-slots)\n    r))","gi":80},{"say":"Updates the execution row with the future's terminal outcome (result\n           / error / cancelled, with taint redaction). Closes the loop so a\n           polled execution reflects final persisted state.","defn":"write-finished!","ns":"graphden.crud.fn-execution.persist","n":14,"file":"src/graphden/crud/fn_execution/persist.clj","lang":"clj","line":528,"code":"(defn write-finished!\n  \"Update an existing row with the future's outcome.\n   `outcome` is one of:\n     {:status :succeeded :result V [:runtime-effects [\\\"env\\\" …]]}\n     {:status :failed :error E :error-data ED [:runtime-effects …]}\n     {:status :cancelled [:runtime-effects …]}\n\n   When the row's fn-def is tainted, `:result` is persisted as nil\n   and a `:tainted? true` flag rides alongside the row's other\n   metadata. Pass the outcome through `redact-outcome` BEFORE calling\n   this fn.\"\n  [storage execution-id outcome]\n  (let [base {:finished-at (java.time.Instant/now)\n              :status (:status outcome)}\n        body (case (:status outcome)\n               :succeeded (if (:tainted? outcome)\n                            ;; Hidden — :result stays nil on the row.\n                            ;; The error-data sidecar carries the\n                            ;; tainted flag so the GET endpoint can\n                            ;; surface it without re-reading the\n                            ;; rich-types registry on every poll.\n                            (assoc base\n                                   :result nil\n                                   :error-data {:reason :tainted})\n                            (let [[ok? v] (jsonize-result (:result outcome))]\n                              (assoc base\n                                     :result v\n                                     :result-truncated? (not ok?))))\n               :failed (assoc base\n                              :error (truncate-error (:error outcome))\n                              :error-data (jsonize-error-data\n                                            (:error-data outcome)))\n               :cancelled base)\n        body (cond-> body\n               (:runtime-effects outcome)\n               (assoc :runtime-effects (:runtime-effects outcome))\n               (:touched-secret? outcome)\n               (assoc :touched-secret? true)\n               (:path-trace outcome)\n               (assoc :path-trace (:path-trace outcome)))]\n    (sp/update-entity storage :fn-execution execution-id body)))","gi":81},{"say":"Typed value representations (docs/EXECUTION.md § Typed value\n           representations) — the execute-result pane's first dispatch tier\n           and the value-form registry's read-side sibling: resolve a repr fn\n           through the graph-held `:_value-repr-registry` (declared/inferred\n           return type first, literal classification as fallback), execute it\n           as a pure `value → hiccup` fn under the `:allowed-effects #{}`\n           runtime gate, then push the output through the\n           `web.hiccup-sanitize` allowlist before the editor inlines it into\n           its own DOM.","defn":"render-repr","ns":"graphden.crud.value-repr","n":15,"file":"src/graphden/crud/value_repr.clj","lang":"clj","line":77,"code":"(defn render-repr\n  \"Resolve + execute + sanitize the registered representation of\n   `value` as returned by fn `fn-id`. Returns sanitized hiccup, or\n   nil when: value is nil, no registry row accepts the dispatch type,\n   the target attempts ANY effect, the target's output sanitizes to\n   nothing, or anything throws (logged).\n\n   Purity is enforced by the executor's own effect gate — the repr\n   subtree runs under `:allowed-effects #{}`, so the first\n   `record-effect!` of any category throws `:execution/forbidden-effect`\n   (docs/TENANCY_SEAM.md § Effect gate). Enforcing at the runtime\n   layer (not a registry lookup by NAME) keeps this id-correct per\n   ADR-identity-model and fail-closed by construction.\"\n  [ctx value fn-id]\n  (try\n    (when (some? value)\n      (when-let [dt (dispatch-type (declared-return-type fn-id) value)]\n        (when-let [fn-name (value-form/pick-form-fn\n                             (value-form/registry-pairs ctx registry-fn-name)\n                             dt)]\n          (some-> (executor/execute-by-name\n                    (assoc ctx :allowed-effects #{})\n                    fn-name {:value value})\n                  sanitize/sanitize-hiccup))))\n    (catch Exception e\n      (log/warn e \"value-repr render failed — falling back to shape pane\")\n      nil)))","gi":82},{"say":"The «catch next request» debugger entry (docs/EXECUTION.md § Debug):\n           a one-shot, TTL-bounded, org+branch-keyed trap consumed in\n           `branch-router/ring-callable-for-ctx` runs the next matching HTTP\n           request through this wrapper — Debug path-trace bound, sanitized\n           request + response persisted as a standard `:fn-execution` row —\n           so a live handler run replays through the same call-tree UI as a\n           traced `/api/execute`.","defn":"run-captured!","ns":"graphden.crud.debug-capture","n":16,"file":"src/graphden/crud/debug_capture.clj","lang":"clj","line":254,"code":"(defn run-captured!\n  \"Run `thunk` (the branch handler invocation) with the Debug\n   path-trace bound per `trap`, persist the outcome, and return the\n   response (or rethrow the handler's throwable) EXACTLY as the\n   uncaptured path would — capture must never change what the caller\n   observes.\"\n  [trap branch-id branch-ctx handler-fn-id request thunk]\n  (let [t0 (now-ms)\n        trace (ce/new-path-trace (when (:capture-values? trap)\n                                   {:capture-values? true}))\n        effect-trace (atom #{})]\n    (binding [cr/*path-trace* trace\n              cr/*effect-trace* effect-trace\n              ce/*traced-fn-ids* (atom ce/trace-all)]\n      ;; Exception, not Throwable: an Error (OOM, StackOverflow)\n      ;; propagates uncaptured — persisting it matters less than not\n      ;; interfering with the JVM's error path.\n      (let [outcome (try {:status :succeeded :result (thunk)}\n                         (catch Exception t {:status :failed :throwable t}))]\n        (persist-captured! branch-id branch-ctx handler-fn-id request\n                           trace effect-trace outcome t0)\n        (if (= :succeeded (:status outcome))\n          (:result outcome)\n          (throw (:throwable outcome)))))))","gi":83},{"say":"The write path that must not leak (docs/SECRETS.md): one\n           `POST /api/secrets` atomically creates the OpenBao value, its\n           custom-metadata, and the graphden fn-row + path-binding — with a\n           vault-delete rollback if the graph half fails. The secret VALUE\n           never enters the graph; only the path does, on a `:secret-leaf`\n           child the executor auto-derefs through the ctx's vault handle.\n           Note the shape: this public defn is thin orchestration over the\n           same per-stage helpers the `:cond` in `app/secrets/fns.edn`\n           consumes, so the Clojure and the graph path can never diverge.","defn":"create-secret","ns":"graphden.crud.secrets","n":17,"file":"src/graphden/crud/secrets.clj","lang":"clj","line":348,"code":"(defn create-secret\n  \"POST /api/secrets — atomically create the OpenBao value, the\n   OpenBao custom-metadata, and the graphden fn-row + path-binding.\n   On any failure, rolls back partial writes (vault-delete if the\n   graphden side fails).\n\n   Thin orchestration over the per-stage helpers\n   (`parse-create-secret-request` / `create-secret-leaf-id` /\n   `create-secret-name-taken?` / `apply-create-secret`) — the same\n   helpers the C7 graph `:cond` in `app/secrets/fns.edn` consumes.\n   Keeping this public defn lets direct Clojure callers (notably\n   the secrets test suite) keep their `(create-secret ctx body)`\n   call shape, while ensuring the validation and apply logic stay\n   single-sourced between the test path and the graph path.\"\n  [ctx body]\n  (let [parsed (parse-create-secret-request body)\n        leaf-id (create-secret-leaf-id ctx)]\n    (cond\n      (str/blank? (:nm parsed))\n      {:ok false :error \"Required field ':name' is missing\"}\n\n      (str/blank? (:path parsed))\n      {:ok false :error \"Required field ':path' is missing\"}\n\n      (not (string? (:value parsed)))\n      {:ok false :error \"Required field ':value' (string) is missing\"}\n\n      (nil? leaf-id)\n      {:ok false\n       :error \":secret-leaf base-fn missing — package web.vault not loaded\"}\n\n      (create-secret-name-taken? parsed ctx)\n      {:ok false\n       :error (str \"fn already exists with name: \" (:nm parsed))\n       :reason :name-taken}\n\n      :else\n      (apply-create-secret parsed leaf-id ctx))))","gi":84,"see":[{"gi":60,"label":"taint-with-secret-if-tainted"}]},{"say":"The tests subsystem (docs/TESTS.md) rides everything above: a test\n           is a fn in a `tests`-segment namespace, executed through\n           `apply-execute` with `{}` args (pass = no throw), its status the\n           newest execution of its CURRENT version — so an edited test reads\n           `stale` by construction, no bookkeeping.","defn":"run-tests!","ns":"graphden.crud.test-runs","n":18,"file":"src/graphden/crud/test_runs.clj","lang":"clj","line":183,"code":"(defn run-tests!\n  \"Run every test on the current branch (or the `:fn-ids` subset),\n   sequentially, and summarise:\n   `{:total N :passed N :failed N :other N :results [{…} …]}`.\n   Pass = `:succeeded`; fail = `:failed`; everything else (`:pending`\n   timeout-overrun, `:rejected` type-errors/capacity, `:not-runnable`\n   free args) counts under `:other` with its own `:status`.\"\n  [ctx {:keys [fn-ids timeout-ms]}]\n  (let [wanted (coerce-fn-ids fn-ids)\n        rows (cond->> (test-fn-rows ctx)\n               wanted (filter (comp wanted :id)))\n        results (mapv (fn [row]\n                        (merge {:fn-id (str (:id row)) :fn-name (:name row)}\n                               (run-one! ctx row (or timeout-ms default-test-timeout-ms))))\n                      rows)\n        by-status (frequencies (map :status results))]\n    ;; Nudge SSE listeners (the live Tests panel) — best-effort, from\n    ;; EVERY run path (button, API, auto-run). TWICE: once now, once\n    ;; after a settle delay — the terminal execution row lands via the\n    ;; async `record-completion!` tail, so the immediate wake's render\n    ;; can still read the previous status and dedupe away; the delayed\n    ;; wake re-renders after the write has landed (the 30 s keepalive\n    ;; tick remains the backstop for pathological lag).\n    (when (seq results)\n      (when-let [emit (:notify-emitter ctx)]\n        (let [ev {:kind :test :op :updated :id \"\"\n                  :branch-id (some-> (vs/current-branch-id\n                                       (request/require-storage ctx))\n                                     str)}]\n          (try (emit ev) (catch Exception _ nil))\n          (future (Thread/sleep 2000)\n                  (try (emit ev) (catch Exception _ nil))))))\n    {:total (count results)\n     :passed (get by-status :succeeded 0)\n     :failed (get by-status :failed 0)\n     :other (- (count results)\n               (get by-status :succeeded 0)\n               (get by-status :failed 0))\n     :results results}))","gi":85},{"say":"Auto-run on writes: from `invalidate!`'s seeds, walk the\n           compile-deps REVERSE closure (the service-restart blast walk),\n           intersect with the branch's tests, gate on an EMPTY effect closure,\n           and re-run debounced on a conveyed-bindings future with\n           `:allowed-effects #{}` as the runtime backstop.","defn":"schedule-affected!","ns":"graphden.crud.test-autorun","n":19,"file":"src/graphden/crud/test_autorun.clj","lang":"clj","line":153,"code":"(defn schedule-affected!\n  \"The `invalidate!` hook: queue the write's fn-id `seeds` and ensure\n   one debounced background runner per `[org branch]` scope. DELIBERATELY\n   O(1) and SQL-free on the write path — an atom swap plus (at most) one\n   future spawn; the blast selection and discovery reads run inside the\n   runner. The `future` (not a raw thread) conveys the writer's dynamic\n   bindings, org context included. nil/empty seeds (unknown blast) →\n   no-op: auto-running the whole suite on an unclassified write is\n   exactly the surprise this gate exists to prevent. Cold ctx (no\n   compile-deps reverse index) → no-op, same contract as the\n   service-restart blast.\"\n  [ctx seeds branch-id]\n  (when (and *auto-run?* (seq seeds)\n             (some-> (:compile-deps ctx) deref :reverse-deps seq))\n    (let [key [(tc/current-org) branch-id]\n          [old _] (swap-vals! pending\n                              (fn [m]\n                                (-> m\n                                    (update-in [key :seeds] (fnil into #{}) seeds)\n                                    (assoc-in [key :runner?] true))))]\n      (when-not (get-in old [key :runner?])\n        (future (run-pending! ctx key)))\n      (count seeds))))","gi":86}]},{"id":":packages","title":"Packages — the graph's content","status":"toured","summary":"How fns.edn + impls.clj become base-fns and fn-defs; the loader,\n             load order, and the first-party package tree — then the inverse:\n             export, the ref wire form, and the publish/install registry.","paths":["src/graphden/packages/","resources/packages/"],"after":[":executor"],"steps":[{"say":"The newcomer's entry point: it just calls `load-packages [core web\n           app]`, naming the default package set and showing where the whole\n           disk-to-graph pipeline is kicked off at boot.","defn":"load-default-packages","ns":"graphden.packages.loader","n":1,"file":"src/graphden/packages/loader.clj","lang":"clj","line":698,"code":"(defn load-default-packages\n  \"Loads the default package set: core, web, app.\"\n  []\n  (load-packages [\"core\" \"web\" \"app\"]))","gi":87},{"say":"The top-level orchestrator: resolve dependency order, load each\n           package, and fold every module's results into the combined\n           `{:base-fn-defs … :fn-defs … :namespaces …}` map that seeds the graph.\n           The hub the rest of this block drills into.","defn":"load-packages","ns":"graphden.packages.loader","n":2,"file":"src/graphden/packages/loader.clj","lang":"clj","line":566,"code":"(defn load-packages\n  \"Loads multiple packages in dependency order.\n\n   Arguments:\n   - package-names: seq of package names to load (e.g., [\\\"core\\\" \\\"web\\\" \\\"app\\\"])\n\n   Returns:\n   {:base-fn-defs {fn-name -> {:args ... :return-type ... :impl fn}}\n    :fn-defs [{:name :foo :parent :bar :args {...}} ...]\n    :packages [{:name \\\"core\\\" :version \\\"1.0.0\\\" ...} ...]\n    :seeded-services [{:package-name \\\"app\\\"\n                       :service-name :default\n                       :fn-name :web-server\n                       :enabled? true\n                       :restart-policy :always\n                       :cardinality :per-pod\n                       :description \\\"…\\\"} …]}\"\n  [package-names]\n  (let [ordered (resolve-dependencies package-names)\n        _ (log/info \"Loading packages in order:\" ordered)\n        results (mapv load-single-package ordered)\n        ;; Single pass over results to build all aggregations\n        combined (reduce (fn [acc result]\n                           (let [pkg-name (get-in result [:meta :name])\n                                 pkg-services (get-in result [:meta :services])]\n                             (cond-> (-> acc\n                                         (update :base-fn-defs merge (:base-fn-defs result))\n                                         (update :fn-defs into (:fn-defs result))\n                                         (update :base-fn-pairs into (:base-fn-pairs result))\n                                         (update :ns-descriptions merge (:ns-descriptions result))\n                                         (update :packages conj (:meta result)))\n                               (seq pkg-services)\n                               (update :seeded-services into\n                                       (mapv (fn [svc]\n                                               (assoc svc :package-name pkg-name))\n                                             pkg-services)))))\n                         {:base-fn-defs {} :fn-defs [] :base-fn-pairs []\n                          :ns-descriptions {}\n                          :packages [] :seeded-services []}\n                         results)\n        ;; Collect all namespace paths declared in modules.\n        ;; A path like \"core.arithmetic\" also implies \"core\" as a parent ns.\n        all-ns-paths (into #{}\n                           (comp\n                             (mapcat (fn [result]\n                                       (keep (fn [[_fn-name fn-def]]\n                                               (:namespace fn-def))\n                                             (:base-fn-defs result))))\n                             (remove nil?))\n                           results)\n        fn-def-ns    (into #{} (keep :namespace) (:fn-defs combined))\n        ;; Expand parent ns paths: \"core.arithmetic\" → #{\"core\" \"core.arithmetic\"}\n        expand-ns    (fn [ns-path]\n                       (let [segments (str/split ns-path #\"\\.\")\n                             paths (map (fn [n]\n                                          (str/join \".\" (take (inc n) segments)))\n                                        (range (count segments)))]\n                         (set paths)))\n        all-namespaces (reduce into #{} (map expand-ns (into all-ns-paths fn-def-ns)))\n        combined (assoc combined :namespaces all-namespaces)]\n    (log/info \"Loaded\" (count (:base-fn-defs combined)) \"base functions,\"\n              (count (:fn-defs combined)) \"fn-defs\")\n    combined))","gi":88},{"say":"A DFS topological sort over each `package.edn`'s `:dependencies`,\n           pulling transitive deps so primitives load before their consumers.\n           This is the dependency-driven load order.","defn":"resolve-dependencies","ns":"graphden.packages.loader","n":3,"file":"src/graphden/packages/loader.clj","lang":"clj","line":528,"code":"(defn- resolve-dependencies\n  \"Returns packages in dependency order (topological sort).\n\n   Pulls TRANSITIVE deps — if `app` declares `:dependencies [\\\"core\\\"\n   \\\"web\\\" \\\"storage\\\"]` and the caller passes just `[\\\"app\\\"]`, all\n   three are loaded ahead of `app`. Silently dropping a transitive dep\n   was a real bug: the missing primitive surfaced as `Unknown parent`\n   at sync time, far from the misconfiguration.\n\n   Validates version constraints (`{\\\"core\\\" \\\">=1.5.0\\\"}` form) against\n   the classpath versions once the graph is resolved — a mismatch throws\n   `:packages/version-conflict` at boot, not `Unknown parent` at sync.\n\n   Simple DFS topological sort, no cycle detection (a cycle in the\n   dep graph would loop here; package.edn dep graphs are tiny and\n   reviewed).\"\n  [package-names]\n  (let [metas (atom {})\n        load-meta! (fn [pkg]\n                     (or (@metas pkg)\n                         (let [m (load-package-meta pkg)]\n                           (swap! metas assoc pkg m)\n                           m)))\n        sorted (atom [])\n        visited (atom #{})\n        visit (fn visit\n                [pkg]\n                (when-not (@visited pkg)\n                  (swap! visited conj pkg)\n                  (doseq [dep (normalize-deps (get (load-meta! pkg) :dependencies []))]\n                    (visit (:name dep)))\n                  (swap! sorted conj pkg)))]\n    (doseq [pkg package-names]\n      (visit pkg))\n    (validate-dep-constraints! @metas)\n    @sorted))","gi":89},{"say":"Runs after ordering to check declared semver constraints against the\n           classpath, failing fast at boot with `:packages/version-conflict`\n           instead of a cryptic `Unknown parent` later. The version machinery\n           guarding load order.","defn":"validate-dep-constraints!","ns":"graphden.packages.loader","n":4,"file":"src/graphden/packages/loader.clj","lang":"clj","line":507,"code":"(defn- validate-dep-constraints!\n  \"Given `{package-name -> package.edn-meta}` for every loaded package,\n   throw `:packages/version-conflict` if a declared version constraint is\n   not satisfied by the version PRESENT on the classpath. Constraint-free\n   deps (legacy bare names) are skipped. Pure over its argument so it is\n   unit-testable without classpath fixtures.\"\n  [metas]\n  (doseq [[pkg meta] metas\n          dep (normalize-deps (:dependencies meta))\n          :when (:constraint dep)\n          :let [present (get-in metas [(:name dep) :version])]]\n    (when-not (semver/satisfies-constraint? present (:constraint dep))\n      (throw (ex-info (format \"Package %s requires %s %s, but version %s is present\"\n                              pkg (:name dep) (:constraint dep) (or present \"?\"))\n                      {:type :packages/version-conflict\n                       :package pkg\n                       :dependency (:name dep)\n                       :required (:constraint dep)\n                       :present present})))))","gi":90},{"say":"For one package: read its `package.edn` metadata and reduce over its\n           `:modules`, merging each module's base-fn-defs and fn-defs. The bridge\n           from `a package` down to `its modules`.","defn":"load-single-package","ns":"graphden.packages.loader","n":5,"file":"src/graphden/packages/loader.clj","lang":"clj","line":446,"code":"(defn- load-single-package\n  \"Loads a single package and returns its functions.\n\n   The package's top-level namespace (the bare package name, e.g. `core`)\n   inherits its description from `package.edn`'s `:description`. Module\n   namespaces (`core.arithmetic`, …) get theirs from each module's\n   `fns.edn` `:description`.\"\n  [package-name]\n  (log/info \"Loading package:\" package-name)\n  (let [pkg-meta (load-package-meta package-name)\n        modules (:modules pkg-meta)\n        seed-ns-descriptions (cond-> {}\n                               (:description pkg-meta)\n                               (assoc package-name (:description pkg-meta)))]\n\n    (reduce\n      (fn [acc module-name]\n        (let [{:keys [base-fn-defs fn-defs base-fn-pairs ns-descriptions]}\n              (process-module package-name module-name)]\n          (-> acc\n              (update :base-fn-defs merge base-fn-defs)\n              (update :fn-defs into fn-defs)\n              (update :base-fn-pairs into base-fn-pairs)\n              (update :ns-descriptions merge ns-descriptions))))\n      {:base-fn-defs {}\n       :fn-defs []\n       :base-fn-pairs []\n       :ns-descriptions seed-ns-descriptions\n       :meta pkg-meta}\n      modules)))","gi":91},{"say":"The heart of one module: load its `fns.edn` and `impls.clj`, then\n           `group-by` splits the entries into base-fns (which need impls) versus\n           fn-defs (compositions / type-rows). Where fns.edn and impls.clj first\n           meet.","defn":"process-module","ns":"graphden.packages.loader","n":6,"file":"src/graphden/packages/loader.clj","lang":"clj","line":387,"code":"(defn- process-module\n  \"Processes a single module, returning base-fn-defs and fn-defs.\n   Each fn-def and base-fn-def receives a :namespace key from the\n   module's fns.edn declaration (nil if no namespace declared).\n\n   Type-rows (`:type` / `:refine` / `:list` / `:union` / `:variant`)\n   ride along in the `fn-defs` slot — `composition/sync-fns-to-storage!`\n   routes them to slot / fn-slot / binding rows by role marker.\"\n  [package-name module-name]\n  (let [{ns-path :ns-path ns-description :ns-description fns :fns}\n        (load-module-fns package-name module-name)\n        impls (load-module-impls package-name module-name)\n\n        ;; Separate base functions from fn-defs\n        {base-fns true fn-defs false} (group-by base-fn? fns)\n\n        ;; Convert base functions to registry format. The `impls`-map\n        ;; value is either a bare impl fn or a `{:impl … :*-rule …}`\n        ;; map; `fn-def->base-fn-def` normalises both. The \"no impl\"\n        ;; check inspects the normalised `:impl` so a rule-only entry\n        ;; (missing `:impl`) is still rejected.\n        base-fn-defs (into {}\n                           (filter some?)\n                           (for [fn-def base-fns\n                                 :let [fn-name (:name fn-def)\n                                       impl-entry (get impls fn-name)\n                                       base-def (when impl-entry\n                                                  (fn-def->base-fn-def fn-def impl-entry))]]\n                             (if (:impl base-def)\n                               [fn-name (assoc base-def :namespace ns-path)]\n                               (do\n                                 (log/warn \"No impl found for base fn:\" fn-name\n                                           \"in\" package-name \"/\" module-name)\n                                 nil))))\n\n        ;; Attach namespace to fn-defs\n        fn-defs-with-ns (mapv #(if ns-path\n                                 (assoc % :namespace ns-path)\n                                 %)\n                              fn-defs)]\n\n    {:base-fn-defs base-fn-defs\n     :fn-defs fn-defs-with-ns\n     ;; UNCOLLAPSED `[namespace name]` pairs for every base-fn DECLARED\n     ;; in this module — including duplicates. `:base-fn-defs` is a map\n     ;; keyed by bare name, so it silently drops a name declared twice;\n     ;; the collision guard (`sync/validate-no-name-collisions!`) needs\n     ;; the pre-collapse list to see a base-fn name reused across\n     ;; namespaces (which would clobber the name-keyed impls registry).\n     :base-fn-pairs (mapv (fn [b] [ns-path (:name b)]) base-fns)\n     :ns-descriptions (if (and ns-path ns-description)\n                        {ns-path ns-description}\n                        {})}))","gi":92},{"say":"The classifier `process-module` groups on: an entry is a base-fn only\n           if it has no `:parent` / `:parents` and is not a type-row. This is the\n           fundamental base-fn versus fn-def distinction a newcomer must\n           internalize.","defn":"base-fn?","ns":"graphden.packages.loader","n":7,"file":"src/graphden/packages/loader.clj","lang":"clj","line":280,"code":"(defn- base-fn?\n  \"Returns true if this is a base function — no role markers and no\n   parent. Type-rows (`:type` / `:refine` / `:list` / `:union` /\n   `:variant`) and composed defs (`:parent` / `:parents`) flow through\n   `:fn-defs` instead.\"\n  [fn-def]\n  (and (not (contains? fn-def :parent))\n       (not (contains? fn-def :parents))\n       (not (type-row? fn-def))))","gi":93},{"say":"Reads a module's `fns.edn` (pure EDN data) via a source-position\n           reader, attaching `:source-file` / `:source-line` to every fn-def so\n           later type errors point at `file:line`. How the on-disk declarations\n           enter memory.","defn":"load-module-fns","ns":"graphden.packages.loader","n":8,"file":"src/graphden/packages/loader.clj","lang":"clj","line":151,"code":"(defn- load-module-fns\n  \"Loads fns.edn for a module. Expected shape:\n\n     {:namespace \\\"core.arithmetic\\\"\n      :description \\\"Arithmetic primitives — add/sub/mul/div/mod\\\"\n      :fns [{:name :add :args {...}} ...]}\n\n   Returns {:ns-path string :ns-description string-or-nil :fns [fn-defs]}.\n\n   Every fn-def carries `:source-file` (the resource path) and\n   `:source-line` (where the fn-def's opening `{` sat in the EDN).\n   Type-check errors and other diagnostics include those so users see\n   `file:line` instead of just `:my-fn`.\"\n  [package-name module-name]\n  (let [path (str \"packages/\" package-name \"/\" module-name \"/fns.edn\")]\n    (if-let [raw (read-resource-edn-with-meta path)]\n      {:ns-path (:namespace raw)\n       :ns-description (:description raw)\n       :fns (attach-source-meta (vec (:fns raw)) path)}\n      (throw (ex-info (str \"Module fns not found: \" package-name \"/\" module-name)\n                      {:type :package-error/module-not-found\n                       :package package-name\n                       :module module-name\n                       :path path})))))","gi":94},{"say":"The counterpart to fns.edn: slurp `impls.clj`, `eval` each form in a\n           fresh namespace, and return that namespace's `impls` var — the\n           `{fn-name → impl-fn}` map. How Clojure code on disk becomes live\n           functions.","defn":"load-impls-via-eval","ns":"graphden.packages.loader","n":9,"file":"src/graphden/packages/loader.clj","lang":"clj","line":195,"code":"(defn- load-impls-via-eval\n  \"Loads implementations by evaluating the impls.clj file as Clojure code.\n   Returns the impls map from the namespace.\"\n  [package-name module-name]\n  (let [path (str \"packages/\" package-name \"/\" module-name \"/impls.clj\")]\n    (when-let [resource (io/resource path)]\n      (let [content (slurp resource)]\n        (locking eval-load-lock\n          ;; Parse the ns form to extract the namespace name\n          (let [forms (read-string (str \"[\" content \"]\"))\n                ns-form (first forms)\n                ns-sym (when (and (seq? ns-form) (= 'ns (first ns-form)))\n                         (second ns-form))]\n            (when ns-sym\n              ;; Create the namespace if it doesn't exist\n              (create-ns ns-sym)\n\n              ;; Evaluate all forms in the namespace context\n              (binding [*ns* (the-ns ns-sym)]\n                (doseq [form forms]\n                  (eval form)))\n\n              ;; Return the impls var value\n              (when-let [impls-var (ns-resolve ns-sym 'impls)]\n                @impls-var))))))))","gi":95},{"say":"The glue: marry an fns.edn entry (args, return-type, effects, tags)\n           with its impl-map value into the registry-shaped\n           `{:args … :return-type … :impl fn …}`. Literally where fns.edn and\n           impls.clj fuse into a base-fn.","defn":"fn-def->base-fn-def","ns":"graphden.packages.loader","n":10,"file":"src/graphden/packages/loader.clj","lang":"clj","line":304,"code":"(defn- fn-def->base-fn-def\n  \"Converts a fns.edn entry + impl entry to registry format.\n\n   Input:  {:name :add :args {:nums :jsonb} :return-type :numeric}\n   Impl:   (defbase add [nums] (apply + nums))\n   Output: {:args {:nums {:type :jsonb :required true}}\n            :return-type :numeric\n            :impl <fn>}\n\n   The `impl-entry` is either a bare impl fn or a map\n   `{:impl … :return-type-rule … :slot-types-rule … :nav-types-rule …}`\n   — the optional `*-rule` fns are the base-fn-specific type-rules\n   declared at the base-fn's own registration site. They flow into the\n   base-fn-def map and `record-rich-types!` threads them into the\n   rich-types-registry so the type-checker can look them up by base-fn\n   identity (no name-dispatch).\n\n   All registered impls are 2-arity `(fn [args ctx] …)` (produced by\n   `defbase`). The executor always calls them with both args, so the\n   loader simply hands impl-fn through.\"\n  [fn-def impl-entry]\n  (let [{:keys [impl return-type-rule slot-types-rule nav-types-rule\n                taint-propagate? lazy-seq-args compile-time-value?]}\n        (impl-entry->parts impl-entry)]\n    (cond-> {:args (normalize-args (:args fn-def))\n             :return-type (:return-type fn-def)\n             :impl impl}\n      (:description fn-def) (assoc :description (:description fn-def))\n      ;; Forward `:effects` (set of category tags). Every effectful\n      ;; base-fn names its specific category\n      ;; (`:db` / `:env` / `:io` / `:network` / `:time` / `:random` /\n      ;; `:process` / `:raw-sql`). `:process` = spawns supervised\n      ;; background work (service-eligibility marker); `:raw-sql` = raw\n      ;; SQL escape hatch, blocked for cloud/tenant graphs.\n      (:effects fn-def)     (assoc :effects (set (:effects fn-def)))\n      ;; Per-base-fn type-rules — only present when the impls.clj\n      ;; declared them on the entry map.\n      return-type-rule      (assoc :return-type-rule return-type-rule)\n      slot-types-rule       (assoc :slot-types-rule slot-types-rule)\n      nav-types-rule        (assoc :nav-types-rule nav-types-rule)\n      ;; `:taint-propagate?` — marker-taint (`:secret` &c.) flows from\n      ;; any tainted input into the return. Applied CENTRALLY by the\n      ;; checker on top of the structural rule/signature result —\n      ;; replaces the per-site `types/wrap-with-taint` wrapping.\n      taint-propagate?      (assoc :taint-propagate? true)\n      ;; `:lazy-seq-args` — seq slots whose ITEMS arrive as delays\n      ;; (consumer steps past unforced items, see :cond).\n      lazy-seq-args         (assoc :lazy-seq-args lazy-seq-args)\n      ;; `:compile-time-value?` — evaluate this base-fn ONCE at compile\n      ;; time and bake `(constantly result)` into the closure (see\n      ;; compile_eager). Used by `:cell` for a registry-persistent atom.\n      compile-time-value?   (assoc :compile-time-value? true)\n      ;; `:tags` — declarative capability / shape markers; consumed by\n      ;; policy callers (e.g. admin-only-vault gate) via\n      ;; `registry/fn-names-with-tag`. See `record-rich-types!`.\n      (seq (:tags fn-def))  (assoc :tags (set (:tags fn-def)))\n      ;; `:branch-local?` — identity-level monotonic flag. Pass\n      ;; through so `records-parser/attach-fn-meta` can stamp it onto\n      ;; the fn-row; the merge-resolution filter in\n      ;; `versioning.storage.resolution` reads it directly.\n      ;; Without this, the seed `:branch-local? true` on base-fns\n      ;; (`:http-server`, `:secret-leaf`, `:schedule`, `:env`) is\n      ;; silently stripped here and downstream sync writes nil.\n      (contains? fn-def :branch-local?)\n      (assoc :branch-local? (boolean (:branch-local? fn-def))))))","gi":96,"see":[{"gi":12,"label":"resolve-impl"}]},{"say":"A concrete `defbase` base-fn impl — `(defbase add [nums] (safe-arith\n           + nums :add))`. This is the value `load-impls-via-eval` collects and\n           `fn-def->base-fn-def` pairs with the `:add` entry in fns.edn. Grounds\n           the abstract loader in a real arithmetic primitive.","defn":"add","ns":"resources/packages/core/arithmetic/impls.clj","n":11,"file":"resources/packages/core/arithmetic/impls.clj","lang":"clj","line":53,"code":"(defbase add [nums]\n  (safe-arith + nums :add))","gi":97,"see":[{"gi":13,"label":"defbase"}]},{"say":"Closes the loop into storage: take the collected namespace paths,\n           build the `core` → `core.arithmetic` parent-child `:ns` entity\n           hierarchy, and return `{ns-path → id}` that the fn-def sync hangs the\n           live fn rows under.","defn":"sync-namespaces!","ns":"graphden.packages.loader","n":12,"file":"src/graphden/packages/loader.clj","lang":"clj","line":635,"code":"(defn sync-namespaces!\n  \"Creates namespace entities in storage for all declared namespace paths.\n   Builds the parent-child hierarchy (e.g. 'core.arithmetic' creates both\n   'core' and 'core.arithmetic' with parent link). Optional\n   `descriptions` map (`{ns-path → string}`) seeds and updates the\n   `:description` field on matching namespace entities; undeclared\n   intermediate parents (`core` when only `core.arithmetic` is in the\n   map) keep `nil`.\n\n   Returns a map {ns-path-string → ns-entity-id} for downstream use.\"\n  ([storage namespace-paths]\n   (sync-namespaces! storage namespace-paths {}))\n  ([storage namespace-paths descriptions]\n   (if (empty? namespace-paths)\n     {}\n     (let [;; Expand each path to all its prefixes so the parent chain\n           ;; is always present — `\"a.b.c\"` ⇒ `#{\"a\" \"a.b\" \"a.b.c\"}`.\n           ;; Honours the docstring's \"creates both core and\n           ;; core.arithmetic\" promise even when the caller passes only\n           ;; leaf paths (e.g. package install). Idempotent for callers\n           ;; that already pre-expand (the package loader).\n           expanded (into #{}\n                          (mapcat (fn [p]\n                                    (let [segs (str/split p #\"\\.\")]\n                                      (map #(str/join \".\" (take (inc %) segs))\n                                           (range (count segs))))))\n                          namespace-paths)\n           sorted (sort-by #(count (str/split % #\"\\.\")) expanded)\n           existing (into {}\n                          (map (fn [ns-entity]\n                                 [(str (:parent-id ns-entity) \":\" (:name ns-entity))\n                                  ns-entity]))\n                          (sp/query-entities storage :ns {}))\n           result (atom {})]\n       (doseq [ns-path sorted]\n         (let [segments (str/split ns-path #\"\\.\")\n               parent-path (when (> (count segments) 1)\n                             (str/join \".\" (butlast segments)))\n               parent-id (when parent-path (get @result parent-path))\n               seg-name (last segments)\n               lookup-key (str parent-id \":\" seg-name)\n               existing-entity (get existing lookup-key)\n               description (get descriptions ns-path)]\n           (if existing-entity\n             (do\n               (when (and description\n                          (not= description (:description existing-entity)))\n                 (sp/update-entity storage :ns (:id existing-entity)\n                                   {:description description}))\n               (swap! result assoc ns-path (:id existing-entity)))\n             (let [new-entity (sp/create-entity storage :ns\n                                                (cond-> {:name seg-name\n                                                         :parent-id parent-id}\n                                                  description (assoc :description description)))]\n               (swap! result assoc ns-path (:id new-entity))))))\n       (log/info \"Synced\" (count @result) \"namespaces:\" (keys @result))\n       @result))))","gi":98,"see":[{"gi":5,"label":"sync-fns-to-storage!"}]},{"say":"The other half of every boot, and the one the loader hands off to:\n           sync composed fn-defs to storage, heal namespace-moved identities,\n           seed each fn-def's rich-type, then run the topological type-check\n           sweep. Read the two long comments — the batch-size binding (a\n           fresh-DB boot writes >10k fn rows past the guard meant for USER\n           writes) and `:skip-type-check?` (~15s of sweep the test bootstrap\n           may opt out of, production never does). This is declarative sync:\n           the packages on disk are the desired state, storage is reconciled\n           toward it.","defn":"sync-fn-entities-from-packages!","ns":"graphden.packages.sync","n":13,"file":"src/graphden/packages/sync.clj","lang":"clj","line":619,"code":"(defn sync-fn-entities-from-packages!\n  \"Pure side-effects: sync composed fn-defs to storage, snapshot their\n   rich-types, run a topological-order type-check sweep. Returns the\n   created fn-rows. `base-fns-info` is the result of\n   `register-base-fns-from-packages!` — its `:ns-id-map` and\n   `:all-name->id` are forwarded to the compose layer so cross-set\n   references (base-fn `:return-type` naming a fn-def-declared type-row)\n   resolve.\n\n   Shared by the production `:exec/fn-entities` integrant init-key and\n   the out-of-band `bootstrap-from-packages!` test helper.\n\n   `:skip-type-check?` — when truthy, runs only the storage-sync +\n   seed-rich-types passes; skips the heavy topological type-check\n   sweep at the end. Tests that don't exercise the type-API\n   endpoints can opt in to save ~15 s of bootstrap per ns. The\n   editor type strips / `/api/types/*` endpoints depend on the\n   sweep, so production NEVER skips.\"\n  ([storage packages base-fns-info]\n   (sync-fn-entities-from-packages! storage packages base-fns-info nil))\n  ([storage packages base-fns-info\n    {:keys [skip-type-check? skip-allowlist-gate?]}]\n   (let [fn-defs (:fn-defs packages)\n         ns-id-map (or (:ns-id-map base-fns-info) {})\n         extra-name->id (or (:all-name->id base-fns-info) {})\n         ;; Hand the base-fn defs into the composed-fn sync so the slot\n         ;; resolver sees their `:args` declarations — without these,\n         ;; bindings on slots owned by base-fns wouldn't resolve.\n         extra-defs (into {}\n                          (keep (fn [[fn-name fn-def]]\n                                  (when fn-name\n                                    [fn-name (assoc fn-def :name fn-name)])))\n                          (:base-fn-defs packages))\n         ;; The bundled-package bulk sync writes every fn/slot/binding row\n         ;; of the whole graph in single batches — 10485 fn rows as of\n         ;; 2026-08-15, past the 10000 `*max-batch-size*` cap, which\n         ;; guards USER-submitted writes, not this trusted bootstrap path\n         ;; (its own docstring says so). Fresh-DB boots (a new deployment,\n         ;; `bb deploy`, the golden test bootstrap) died on\n         ;; :batch-error/batch-too-large; incremental re-syncs never hit\n         ;; it, which is why long-lived deployments kept working. Bind a\n         ;; generous ceiling for exactly this call instead of raising the\n         ;; global cap again (5000→10000 was already this whack-a-mole).\n         ;; NB: bind the CONFIG var — `sp/*max-batch-size*` is a load-time\n         ;; VALUE alias of it, and `validate-batch-size!` reads the config\n         ;; var; rebinding the sp copy would be a silent no-op.\n         fns (binding [sp-config/*max-batch-size*\n                       (max sp-config/*max-batch-size* 100000)]\n               (fn-composition/sync-fns-to-storage! storage fn-defs ns-id-map\n                                                    extra-name->id extra-defs))\n         ;; ROOT FIX (audit-4): heal namespace-moved package\n         ;; identities at the moment of the move — see the fn\n         ;; docstring. Before the seed/sweep so registry + compile\n         ;; only ever see the healed graph.\n         _ (reconcile-moved-identities! storage packages fns)]\n     ;; Snapshot composed fn-defs into the in-memory rich-type registry\n     ;; so the editor's `:effects` strip and arg-type hints can resolve\n     ;; their declared shape. Two passes:\n     ;;\n     ;; 1. Seed each fn-def's declared shape (return + args + declared\n     ;;    `:effects`). Without this, `check-all-defs!` would fail to\n     ;;    resolve refs to peer fn-defs whose entries don't exist yet.\n     ;; 2. Run the full type-checker so `:effects` propagate transitively\n     ;;    through every parent + ref edge — that's what powers the\n     ;;    editor's effects-strip showing the union of every category\n     ;;    a fn-def TRANSITIVELY pulls in. Wrap in try/catch: a single\n     ;;    fn-def's type-mismatch shouldn't block server startup.\n     ;; Refinement aliases are registered earlier in `:exec/base-fns` so\n     ;; base-fn arg types (`:port`, `:user-port`, …) resolve to their\n     ;; structural form during the base-fn rich-type pass.\n     ;; record-rich-types! validates arg `:type` declarations — those\n     ;; only exist on base-fn-style fn-defs (rare here; composed fn-defs\n     ;; use `:args` for parent BINDINGS, not declarations). Try-each so a\n     ;; few mis-shaped entries don't kill the seed pass; check-all-defs!\n     ;; below recovers the proper computed types via type-inference anyway.\n     (doseq [fd fn-defs]\n       (when-let [fn-name (:name fd)]\n         (try (registry-core/record-rich-types! fn-name fd)\n              (catch Exception e\n                ;; Mis-shaped entries are recoverable by the type-check\n                ;; sweep below — don't block startup, but DEBUG-log so\n                ;; the per-fn cause is available when chasing a\n                ;; downstream sweep failure.\n                (log/debug e \"Seed-pass record-rich-types! failed for\"\n                           fn-name)))))\n     ;; Type-check in dependency (topological) order: every fn-def is\n     ;; checked AFTER the parents and refs it reads, so a SINGLE sweep\n     ;; reaches the fixpoint — `check-fn-def!` always sees its\n     ;; dependencies' final rich-types, never a stale seed. This is\n     ;; what eliminates the order-dependent under-convergence a fixed\n     ;; pass count over arbitrary order suffered (a deep chain it\n     ;; couldn't propagate, leaving composed fn-defs absent or\n     ;; mis-typed). A fn-def that throws here is genuinely absent from\n     ;; the rich-type registry — the editor would miss its effect strip\n     ;; / computed return — so the per-failure detail is logged at\n     ;; DEBUG and a single summary WARN runs at the end. Per-fn-def\n     ;; WARNs were too noisy in prod startup logs (~22 baseline\n     ;; entries from `:router-result` / `:merge-in` / friends whose\n     ;; producer-of-callable shape the typchecker can't unify yet —\n     ;; runtime behaviour is correct, the editor just doesn't get a\n     ;; computed return-type for those slots). DEBUG keeps the signal\n     ;; available; the summary count makes regressions visible.\n     ;; Inline `{:parent :X :args …}` anon fn-defs appear in arg-binding\n     ;; position throughout `branches/`, `secrets/`, and `execution/`\n     ;; packages. The parser's storage-sync pass lifts each into a\n     ;; synthetic named `_anon-<hash>` fn-def — so storage / runtime\n     ;; see the expanded form — but the type-check sweep reads the\n     ;; ORIGINAL EDN, which still carries the literal map. Without\n     ;; pre-expansion the sweep classifies each inline anon as a\n     ;; record-type literal and fails 20+ bindings against slots that\n     ;; expect the parent's structural return type (eg. `:ref` against\n     ;; `[:union :null :text]`, `:string` against predicates).\n     ;;\n     ;; Run the same `expand-inline-anons-in-module` pass on the\n     ;; type-check input so the sweep sees the synthetic refs.\n     (let [expanded-fn-defs (records-parse/expand-inline-anons-in-module fn-defs)]\n       ;; Re-seed rich-types so synthetic anons get a registry entry too.\n       (doseq [fd expanded-fn-defs]\n         (when-let [fn-name (:name fd)]\n           (try (registry-core/record-rich-types! fn-name fd)\n                (catch Exception e\n                  (log/debug e \"Re-seed record-rich-types! failed for\" fn-name)))))\n       (when-not skip-type-check?\n         ;; The sweep records its final failure set into the per-branch\n         ;; diagnostics store — key it by the branch this sync ran on\n         ;; (nil for an unversioned/base storage = default branch).\n         (run-type-check-sweep! expanded-fn-defs skip-allowlist-gate?\n                                (vs/current-branch-id storage))\n         ;; Port-collision scan — runs against the expanded fn-def\n         ;; set so synthetic anons that bind `:port` get inspected\n         ;; too. Logs a WARN per colliding port; doesn't fail\n         ;; bootstrap because the OS still tells the truth at\n         ;; reconcile time. Catches admin-misconfig (two web-server\n         ;; fn-defs both bound to :port 8080) BEFORE any service is\n         ;; even created — earlier than `:start-failed-at`.\n         (port-check/warn-on-collisions! expanded-fn-defs)))\n     fns)))","gi":99,"see":[{"gi":65,"label":"check-all-defs!"},{"gi":44,"label":"repoint-refs!"}]},{"say":"The loader's INVERSE: typed graph records back to fns.edn-shaped\n           fn-def maps. Everything distribution-shaped (publish, install,\n           whole-graph download) rides this, and its contract is a fixpoint —\n           `parse(export(parse(x))) == parse(x)` — pinned by the\n           corpus-fixpoint test over the real core/web/app packages. Read it\n           as `process-module` run backwards.","defn":"records->fn-defs","ns":"graphden.packages.export","n":14,"file":"src/graphden/packages/export.clj","lang":"clj","line":564,"code":"(defn records->fn-defs\n  \"Convert a flat record seq back into a vector of fns.edn fn-def maps.\n   Inverse of `records.parse/parse-module` at the records level:\n\n     (= (parse-module (records->fn-defs (parse-module fns)))\n        (parse-module fns))\n\n   Skips primitive rows and anonymous (name-less) rows — the former are\n   boot data, the latter are reconstructed inline at their use sites.\"\n  [records]\n  (let [ctx (index-records records)]\n    (->> (vals (:fns ctx))\n         (remove #(contains? prim-id->kw (:id %)))\n         (filter :name)\n         (mapv #(fn-row->fn-def % ctx)))))","gi":100},{"say":"How a ref serializes: BARE keyword when the name is unique\n           (canonical minimal form), namespace-QUALIFIED when it's duplicated\n           across the export set. Qualification never falls back to bare — a\n           version-materialized `@`-ns qualifies as `(keyword \"lib@1-2-0.sub\"\n           n)` and the root ns as `(keyword \"\" n)`, both legal in-memory\n           values even though no EDN reader could parse their printed form.","defn":"ref-kw","ns":"graphden.packages.export","n":15,"file":"src/graphden/packages/export.clj","lang":"clj","line":108,"code":"(defn- ref-kw\n  \"Reference keyword for the fn with `id` — QUALIFIED when its bare\n   name is duplicated across the export set (`:dup-names`), bare\n   otherwise (canonical minimal form). Qualification never falls back\n   to bare: a version-materialized `@`-ns duplicate qualifies as\n   `(keyword \\\"lib@1-2-0.sub\\\" n)` and a ROOT-ns (nil path) duplicate\n   as `(keyword \\\"\\\" n)` — both are legal in-memory/JSONB values; the\n   EDN TEXT boundary spells them `#graphden/ref` (see\n   `records.wire/encode-unreadable-kws`, ap

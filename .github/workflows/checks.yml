name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'

jobs:
  kondo:
    name: clj-kondo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          clj-kondo: latest

      - name: Run clj-kondo
        run: clj-kondo --lint src test development

  splint:
    name: splint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run splint
        run: bb splint

  cljstyle:
    name: cljstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cljstyle: latest

      - name: Check formatting
        run: cljstyle check src test development

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run tests
        run: bb test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run coverage
        run: |
          bb coverage 2>&1 | tee coverage-output.txt
          # Extract form-coverage from the cloverage summary row.
          # The table is pipe-delimited and uses ANSI colour codes
          # (:colorize? true in tests-coverage.edn), so we strip ANSI
          # first, then split on '|'. Column 3 = form %, column 4 = line %.
          # Previous version used `awk '{print $4}'` on whitespace —
          # that pulled the literal '|' separator, not the number, so
          # the threshold check never actually fired.
          COVERAGE=$(grep "ALL FILES" coverage-output.txt \
                     | sed 's/\x1b\[[0-9;]*m//g' \
                     | awk -F'|' '{print $3}' \
                     | tr -d ' %')
          echo "Form coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "Could not parse coverage"
            exit 1
          fi
          # Threshold matches the current unit-only baseline (~72%) with
          # a couple of points of slack. Bump it after intentional
          # improvements; never silently lower it on regression — that
          # defeats the gate.
          COV_FLOOR=70
          if awk "BEGIN { exit !($COVERAGE < $COV_FLOOR) }"; then
            echo "Form coverage ${COVERAGE}% is below ${COV_FLOOR}% threshold"
            exit 1
          fi

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run security scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Create properties file with API key if provided
          if [ -n "$NVD_API_KEY" ]; then
            echo "nvd.api-key=$NVD_API_KEY" > cljwatson.properties
          fi
          bb security || echo "Security scan completed with warnings"

  outdated:
    name: outdated deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Check outdated dependencies
        run: bb outdated

  biome:
    name: biome (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm devDeps
        run: npm ci

      - name: Run biome
        run: npx biome check resources/packages/app/editor

  stylelint:
    name: stylelint (CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run stylelint
        run: npx stylelint 'resources/packages/app/editor/**/*.css'

  shellcheck:
    name: shellcheck (.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck via Docker
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            koalaman/shellcheck:stable \
            tools/browser-test/run-edit-tests.sh \
            .claude/hooks/check-ui-on-stop.sh \
            .claude/hooks/remind-packages-quality-on-impls-edit.sh

  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0-debian < Dockerfile

      - name: Lint Dockerfile.build
        run: docker run --rm -i hadolint/hadolint:v2.12.0-debian < Dockerfile.build

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit, not just HEAD.
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest \
            detect --no-banner

  typos:
    name: typos (spelling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: crate-ci/typos@v1.31.0

  markdownlint:
    name: markdownlint (.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run markdownlint
        run: npx markdownlint-cli2

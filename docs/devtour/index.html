t enforce the same grants as the base context.\n      (:execute-guard base-ctx) (assoc :execute-guard (:execute-guard base-ctx))\n      ;; Inherit the self-serve deploy seam (§3.4 4b) — the\n      ;; `:invoke-set-org-handler` base-fn runs in the per-branch handler ctx.\n      (:set-org-handler base-ctx) (assoc :set-org-handler (:set-org-handler base-ctx))\n      ;; Inherit the self-serve DNS-verify seam (§3.4 #2) — the\n      ;; `:invoke-verify-domain` base-fn runs in the per-branch handler ctx.\n      (:verify-domain base-ctx) (assoc :verify-domain (:verify-domain base-ctx))\n      ;; Inherit the user-model seam (§4.1) — `:invoke-login` / `:invoke-create-user`\n      ;; run in the per-branch handler ctx.\n      (:user-ops base-ctx) (assoc :user-ops (:user-ops base-ctx)))))","gi":45,"see":[{"gi":2,"label":"create-context"}]},{"say":"The top-level Ring middleware: extract the branch ref (header or\n           query), resolve it to a branch-id, and route the request to that\n           branch's lazily-built handler (400 on an unknown branch). Where a\n           live request finally lands in the correct per-branch context.","defn":"dispatch","ns":"graphden.system.branch-router","n":17,"file":"src/graphden/system/branch_router.clj","line":799,"code":"(defn dispatch\n  \"Top-level Ring middleware. Reads `extract-branch-ref` off the\n   request, resolves the branch, and delegates to the per-branch\n   handler. Unknown branch refs surface a 400 rather than silently\n   misrouting.\"\n  [router request]\n  (let [base-ctx (:base-ctx router)\n        ;; Fleet control-plane seam (docs/FLEET_RFC.md §6.3): the internal\n        ;; cell load/evict command (`POST /internal/fleet/cell/...`). Checked\n        ;; FIRST — it's infra, org-agnostic, internal-token-gated, and never a\n        ;; tenant path. Returns a response for a matching command, nil for\n        ;; anything else (→ falls through). Absent unless this pod is a fleet\n        ;; member (`GRAPHDEN_EXECUTOR_ID` set).\n        fleet-command (:fleet-command base-ctx)\n        fleet-resp (when fleet-command (fleet-command base-ctx request))\n        ;; App-router seam (§3.4 FaaS): a request to a TENANT's subdomain is\n        ;; the tenant's APP — served by that org's handler fn (org-scoped +\n        ;; effect-gated), NOT the editor/API. The app-router returns a\n        ;; response for such requests, or nil for an apex/platform request,\n        ;; which then falls through to the editor/API flow below. Absent\n        ;; (core / single-tenant) → straight to editor/API.\n        app-router (:app-router base-ctx)\n        app-resp (or fleet-resp\n                     (when app-router (app-router base-ctx request)))]\n    (or app-resp\n        ;; Branch resolution runs INSIDE the request-scope (§4): `:branch` is\n        ;; org-scoped, so `*current-org*` must be bound when resolve-branch-id\n        ;; reads it — otherwise a tenant's own branch is invisible at resolution\n        ;; (→ a spurious 400) and the org cache key would be wrong. So the whole\n        ;; resolve → handler chain is the request-scope's thunk. The branch ctx\n        ;; itself stays org-agnostic (Design B) — keyed by branch-id alone.\n        (let [request-scope (:request-scope base-ctx)\n              run (fn []\n                    ;; Route-collection seam (PLATFORM_PLAN §2.1 / §6): consult\n                    ;; every installed fall-through router FIRST, INSIDE the\n                    ;; request-scope so `*current-org*` is bound — the tenancy\n                    ;; org-admin panels (grants/users/…) AND the optional\n                    ;; registry (`/api/packages/installed` reads org/branch-\n                    ;; scoped pins) need the same org binding branch resolution\n                    ;; does. A matched path returns a response; no match (or an\n                    ;; empty collection → no optional package installed) falls\n                    ;; through to the branch-resolution chain. Branch-agnostic\n                    ;; by design: the branch ref is irrelevant to these paths.\n                    (or (rc/dispatch-first request)\n                        (let [branch-ref (extract-branch-ref request)\n                              branch-id (resolve-branch-id router branch-ref)]\n                          (if (and (some? branch-ref) (nil? branch-id))\n                            {:status 400\n                             :headers {\"Content-Type\" \"application/json\"}\n                             ;; JSON-encode — `branch-ref` is user-controlled\n                             ;; (X-Graphden-Branch header / ?branch=), so a raw\n                             ;; string-concat let a `\"` inject arbitrary keys\n                             ;; into the response envelope.\n                             :body (json/generate-string\n                                     {:ok false\n                                      :error (str \"Unknown branch: \" branch-ref)})}\n                            ((handler-for router branch-id) request)))))]\n          (if request-scope\n            (request-scope base-ctx request run)\n            (run))))))","gi":46}]},{"id":":types","title":"Type system","status":"toured","summary":"Subtyping, unification, narrowing, refinements, the sweep-at-zero\n             checker, and the :secret information-flow marker.","paths":["src/graphden/types/"],"after":[":executor"],"steps":[{"say":"Start with the leaf vocabulary. This is the flat enum of primitive\n           value-kinds plus the special `:any` (top) and `:never` (bottom). Every\n           type in the system is built from these, so nothing structural makes\n           sense until you have them.","defn":"primitives","ns":"graphden.types.core.shapes","n":1,"file":"src/graphden/types/core/shapes.clj","line":23,"code":"(def primitives\n  \"The flat enum of value-kind primitives. A superset of\n   `value-kind-values` in schema/graph/schema.clj — every storage\n   value-kind is a primitive here, but a few primitives are\n   type-system-only and never reach the `value_kind` column\n   (`:float`, `:keyword`, `:never`, `:input-stream`, `:decimal`).\n   `:fn` is included as a primitive for backwards compat with\n   declarations that use the bare keyword instead of a structural\n   `[:fn …]`; structurally, it acts like `[:fn {} :any]` (any\n   callable).\n\n   `:never` is the BOTTOM type — the dual of `:any` (top). It is a\n   subtype of every type and the type of a computation that never\n   produces a value (`:throw`). In a union it is absorbed\n   (`[:union :never T]` = `T`), so `(:if c (:throw …) x)` is typed\n   exactly `x`. `:float` and `:keyword` are type-system-only —\n   emitted by `classify-literal` for float / keyword literals — and\n   never reach the storage `value_kind` column.\n\n   `:input-stream` is the type of a transient `java.io.InputStream`\n   (Ring request bodies, file streams) — values are never stored as\n   data, so it's type-system-only too. `type->storage-kind` degrades\n   it to `:any`.\n\n   `:decimal` is arbitrary-precision rational (Clojure's `BigDecimal`\n   / Java `java.math.BigDecimal`). Subtype of `:numeric` alongside\n   `:int` and `:float`.\"\n  #{:null :uuid :text :int :bool :numeric :timestamptz :jsonb :bytes\n    :any :fn :float :keyword :sequence :never :input-stream :decimal})","gi":47},{"say":"The type grammar in one function: every compound arm — record maps,\n           `[:list]`, `[:map]`, `[:tuple]`, `[:refine]`, `[:secret]`, `[:union]`,\n           `[:fn]` — and how each recurses. This doubles as the map of how\n           records / unions / variants / fn-types are represented.","defn":"child-types","ns":"graphden.types.core.shapes","n":2,"file":"src/graphden/types/core/shapes.clj","line":403,"code":"(defn child-types\n  \"The immediate constituent types of a compound type — the arms every\n   structural fold must recurse through. Primitives / type-vars / any\n   non-compound have none. THE single enumeration of a type's sub-types:\n   `type-any?` (and any future structural fold) rides on it, so a new\n   type-kind is covered everywhere by adding ONE arm here rather than in\n   each hand-written recursion.\"\n  [t]\n  (cond\n    (fn-type? t)     (conj (vec (vals (fn-args t))) (fn-ret t))\n    (list-type? t)   [(list-elem t)]\n    (map-type? t)    [(map-key t) (map-val t)]\n    (tuple-type? t)  (vec (tuple-elems t))\n    (refine-type? t) [(refine-base t)]\n    (marker-type? t) [(marker-inner t)]\n    (union-type? t)  (vec (union-members t))\n    (record-type? t) (vec (vals t))\n    :else            []))","gi":48},{"say":"The syntactic validity guard at the boundary between user input\n           (fns.edn / the API) and the rest of the module. Reading it cements the\n           exact shape of each type kind: fn args-map, effects set, refine base,\n           secret inner.","defn":"well-formed?","ns":"graphden.types.core","n":3,"file":"src/graphden/types/core.clj","line":139,"code":"(defn well-formed?\n  \"True iff `t` is a syntactically valid type. Use this as a guard at\n   the boundary between user input (fns.edn parsing, API form data)\n   and the rest of the type module.\n\n   A non-primitive keyword is well-formed iff it names a registered\n   alias — this lets compound types reference other named types\n   (`[:fn {:request :ring-request} :ring-response]`) without first\n   substituting them, as long as the inner names are known.\"\n  [t]\n  (cond\n    (or (primitive? t) (type-var? t)) true\n    (keyword? t)     (boolean (get (aliases-snapshot) t))\n    (record-type? t) (every? well-formed? (vals t))\n    (fn-type? t)     (and (map? (fn-args t))\n                          (every? keyword? (keys (fn-args t)))\n                          (every? well-formed? (vals (fn-args t)))\n                          (well-formed? (fn-ret t))\n                          (let [eff (fn-effects t)]\n                            (or (nil? eff)\n                                (= eff :any)\n                                (and (set? eff)\n                                     (every? keyword? eff)))))\n    (list-type? t)   (well-formed? (list-elem t))\n    (map-type? t)    (and (well-formed? (map-key t)) (well-formed? (map-val t)))\n    (tuple-type? t)  (every? well-formed? (tuple-elems t))\n    (refine-type? t) (well-formed? (refine-base t))\n    (marker-type? t) (well-formed? (marker-inner t))\n    (union-type? t)  (every? well-formed? (union-members t))\n    :else            false))","gi":49},{"say":"The smart constructor for `[:union …]`: flatten, dedupe, absorb\n           `:never`, and drop any member subsumed by another. This canonical\n           union shape is what the rest of the system relies on — and your\n           introduction to sum types.","defn":"make-union","ns":"graphden.types.core","n":4,"file":"src/graphden/types/core.clj","line":209,"code":"(defn make-union\n  \"Smart constructor for `[:union …]`. Flattens nested unions, drops\n   duplicates, and collapses singletons (a 1-member union IS that\n   member). Result: either a non-union type or a `[:union T1 T2 …]`\n   with ≥2 distinct flattened members.\n\n   Use this instead of building `[:union …]` literals directly so\n   the rest of the system can rely on the canonical shape.\"\n  [members]\n  (let [flat (mapcat (fn [m] (if (union-type? m) (union-members m) [m]))\n                     members)\n        ;; `:never` (bottom) drops out of a union — `[:union :never T]`\n        ;; = `T` — dual to `:any` (top) absorbing. A union of nothing\n        ;; but `:never` members collapses back to `:never`.\n        non-never (remove #{:never} flat)\n        flat (if (seq non-never) non-never flat)\n        ;; `:empty-map` gets absorbed by any sibling map-shape\n        ;; (`:jsonb` / `[:map K V]` / record-type) the same way\n        ;; `:never` gets absorbed by everything. Without this the\n        ;; union of an `:if`'s branches surfaces\n        ;; `[:union :empty-map record]` upstream — each downstream\n        ;; check then has to special-case the sentinel. Members\n        ;; ` ⊆ :empty-map`-test is performed via `subtype?` (already\n        ;; loaded above), so `:empty-map` itself is preserved when\n        ;; it's the ONLY sibling and the union collapses to it.\n        has-map-shape? (some (fn [m]\n                               (or (= m :jsonb)\n                                   (map-type? m)\n                                   (record-type? m)))\n                             flat)\n        flat (if has-map-shape? (remove #{:empty-map} flat) flat)\n        ;; Stable order to keep the canonical form deterministic for\n        ;; equality. `pr-str` sorts heterogeneous keywords/vectors\n        ;; without confusing comparators.\n        unique (vec (sort-by pr-str (distinct flat)))\n        ;; Subtype absorption: `T ⊆ S` ⟹ T is redundant in\n        ;; `[:union T S]` because every value of T is already a\n        ;; value of S. Drop any non-typevar member that's a STRICT\n        ;; subtype of some other non-typevar sibling. Type-vars\n        ;; are KEPT (they're polymorphic — `'a` may bind to\n        ;; anything, so we can't reason about subtype here) but\n        ;; can't absorb others either. Without this the checker\n        ;; surfaces redundant unions like\n        ;; `[:union :int :positive-int]` (where `:positive-int ⊆\n        ;; :int` makes the wider `:int` cover everything) — UI\n        ;; chips and `:if`/`:cond` rule outputs end up noisier than\n        ;; the semantics warrants.\n        absorbed (vec\n                   (keep-indexed\n                     (fn [i m]\n                       (if (type-var? m)\n                         m\n                         (when-not (some (fn [[j other]]\n                                           (and (not= i j)\n                                                (not (type-var? other))\n                                                (not= m other)\n                                                (subtype? m other)\n                                                ;; If two members are\n                                                ;; mutually-subtype\n                                                ;; (alias equality\n                                                ;; through normalise),\n                                                ;; keep the lower-\n                                                ;; indexed one.\n                                                (or (not (subtype? other m))\n                                                    (< j i))))\n                                         (map-indexed vector unique))\n                           m)))\n                     unique))\n        unique (if (seq absorbed) absorbed unique)]\n    (cond\n      (= 1 (count unique)) (first unique)\n      (some #{:any} unique) :any        ; :any absorbs everything\n      :else (into [:union] unique))))","gi":50},{"say":"Rewrites `[:variant tag T …]` into a structural union of tag-pinned\n           records. Shows how the higher-level variant sugar reduces to the union\n           + refinement machinery you just met — no new runtime concept needed.","defn":"desugar-variant","ns":"graphden.types.core","n":5,"file":"src/graphden/types/core.clj","line":307,"code":"(defn desugar-variant\n  \"Desugar `[:variant tag1 T1 tag2 T2 …]` to its structural union form\n   per docs/TYPES.md § Tagged Variants:\n\n     [:union {:tag [:refine :keyword [:= :tag1]] :value T1}\n             {:tag [:refine :keyword [:= :tag2]] :value T2}\n             …]\n\n   Each branch is a record pinned by an equality refinement on the\n   `:tag` slot, making the variant discriminable at runtime via\n   `(:variant-is? v :tag …)`. Accepts the alternate input shape\n   `[tag1 T1 tag2 T2 …]` (without the leading `:variant` marker) so\n   callers don't have to strip it.\n\n   Returns nil if the payload is malformed (odd count, non-keyword\n   tags, empty list) so the caller can surface it as an alias-body\n   well-formedness failure.\"\n  [t]\n  (let [pairs-raw (cond\n                    (and (vector? t) (= :variant (first t))) (vec (rest t))\n                    (sequential? t)                          (vec t)\n                    :else                                    nil)]\n    (when (and pairs-raw\n               (seq pairs-raw)\n               (even? (count pairs-raw))\n               (every? keyword? (take-nth 2 pairs-raw)))\n      (let [pairs (partition 2 pairs-raw)\n            branches (mapv (fn [[tag-kw branch-t]]\n                             {:tag [:refine :keyword [:= tag-kw]]\n                              :value branch-t})\n                           pairs)]\n        (make-union branches)))))","gi":51},{"say":"The heart of assignability: reflexive / transitive subtyping across\n           primitives, `:jsonb` sinks, records, lists, maps, tuples, refinements,\n           unions, secrets, and fn-types. Every checker decision — is `actual`\n           a subtype of `expected`? — bottoms out here.","defn":"subtype?","ns":"graphden.types.core","n":6,"file":"src/graphden/types/core.clj","line":1112,"code":"(defn subtype?\n  \"Is `sub` a subtype of `sup`? Reflexive, transitive, anti-symmetric.\n   Type variables compare by identity for now — unification handles\n   the substitution case before subtype check is meaningful.\n\n   Refinement rules (Phase 4):\n   - `[:refine B c] ⊆ B`            (refinement is a subtype of base)\n   - `B ⊄ [:refine B c]`             (no implicit narrowing — caller\n                                       must insert `:validate-refinement`)\n   - `[:refine B c1] ⊆ [:refine B c2]` iff `c1 = c2` (no constraint\n                                       reasoning — equality only;\n                                       SMT-style logic is out of scope\n                                       per TYPES.md).\n\n   Union rules:\n   - `[:union T1 T2 …] ⊆ S` iff every Tᵢ ⊆ S          (disjunction)\n   - `T ⊆ [:union T1 T2 …]` iff T ⊆ Tᵢ for some i      (membership)\"\n  [sub sup]\n  (check-type-compare-depth! \"subtype?\" sub sup)\n  (binding [*type-compare-depth* (inc (long *type-compare-depth*))]\n    (let [sub (normalise sub)\n          sup (normalise sup)]\n      (cond\n        (or (= sub sup) (= sup :any))            true\n        (= sub :any)                             false\n\n        ;; Universal yes-arms:\n        ;; - `typevar SUB ⊆ :jsonb` — at any binding site the var\n        ;;   resolves to SOME type, and most concrete types subtype\n        ;;   `:jsonb`. Without it, every fn-ref whose computed return\n        ;;   is polymorphic (`[:union 'a <record>]` etc.) rejects\n        ;;   against a `:jsonb`-typed slot.\n        ;; - `:never ⊆ T` — `:never` is the bottom type, a subtype of\n        ;;   every type; nothing but itself is a subtype of it.\n        (or (and (type-var? sub) (= sup :jsonb))\n            (= sub :never))                      true\n        (= sup :never)                           false\n\n        ;; `:empty-map` — sentinel from `classify-literal` for `{}`.\n        ;; Vacuous-truth subtype of every map-shaped target: it carries\n        ;; no entries to violate any structural constraint. Without it\n        ;; an `:_storage-where-map`-typed slot bound to `{:value {}}`\n        ;; fails the `:jsonb ⊄ [:map :keyword :any]` rule below.\n        ;;\n        ;; Unions: an `:empty-map` is a subtype of `[:union :null [:map K V]]`\n        ;; because it's a subtype of the map-shape member. Descend so the\n        ;; nullable-map shapes (common boundary type for read-or-nil sites\n        ;; like `:resolve-branch-ref`) accept empty-map literals too.\n        (= sub :empty-map)\n        (boolean (or (= sup :empty-map) (= sup :jsonb)\n                     (map-type? sup) (record-type? sup)\n                     (and (union-type? sup)\n                          (some #(subtype? :empty-map %) (union-members sup)))))\n        (= sup :empty-map)                       false\n\n        ;; Union LHS: every member must subtype.\n        (union-type? sub)\n        (every? #(subtype? % sup) (union-members sub))\n\n        ;; Union RHS: at least one member accepts.\n        (union-type? sup)\n        (boolean (some #(subtype? sub %) (union-members sup)))\n\n        (or (and (primitive? sub) (primitive? sup)\n                 (primitive-subtype? sub sup))\n            (and (= sup :jsonb)\n                 ;; A compound carrying ANY nested marker must NOT flow\n                 ;; into a jsonb content sink — that would strip the\n                 ;; information-flow label. The top-level `[<tag> T]`\n                 ;; case is already refused by the marker arm below; this\n                 ;; makes the type core self-defend against the nested\n                 ;; case (a record/list/tuple field) instead of relying on\n                 ;; every propagator keeping markers top-level-typed.\n                 (not (contains-marker? sub))\n                 (or (primitive? sub)\n                     (record-type? sub)\n                     (list-type? sub)\n                     (map-type? sub)\n                     (tuple-type? sub)\n                     (refine-type? sub)))) true\n        (= sub :jsonb)                           false\n\n        ;; Refinement: SUB carries a refinement, SUP is its base or any —\n        ;; pass; SUP carries a refinement → constraint inclusion.\n        ;;\n        ;; Constraint inclusion (`constraint-implies?`) covers the\n        ;; common numeric-comparison shapes plus `:and` / `:or`\n        ;; combinators, so e.g. `:positive-int ⊆ :non-negative-int`\n        ;; (`[:> 0] ⊆ [:>= 0]`) and `:user-port ⊆ :port` (one nested\n        ;; `:and` inside another) hold. Falls back to structural\n        ;; equality for shapes outside the supported set, preserving\n        ;; the prior behaviour for refinements with custom constraints.\n        (refine-type? sub)\n        (cond\n          (refine-type? sup)\n          (and (constraint-implies? (refine-constraint sub)\n                                    (refine-constraint sup))\n               (subtype? (refine-base sub) (refine-base sup)))\n          :else\n          (subtype? (refine-base sub) sup))\n\n        (refine-type? sup)\n        ;; SUB is not a refinement, SUP is — must NOT widen.\n        false\n\n        ;; Markers: registry-driven information-flow labels — asymmetric\n        ;; subtyping, generic over every registered tag (`:secret` is the\n        ;; seeded instance; SECRETS.md):\n        ;;\n        ;; `[<m> T] ⊆ [<m> T']`  iff `T ⊆ T'` (covariant inside, SAME tag —\n        ;;                                     `[:pii T] ⊄ [:secret T']`)\n        ;; `[<m> T] ⊆ T'`        NEVER        (can't STRIP the label)\n        ;; `T ⊆ [<m> T']`        iff `T ⊆ T'` (auto-PROMOTE on entry —\n        ;;                                     monotone direction; plain\n        ;;                                     values become labelled when\n        ;;                                     they flow into marked slots)\n        ;;\n        ;; Same shape rationale as `refine` above — the marker is opaque\n        ;; to the base type, but unlike `refine` the asymmetry is on\n        ;; LEAVING the marker: refine narrows (sub ⊆ base; strip allowed),\n        ;; a marker labels (sub ⊄ base; strip forbidden). That's why we\n        ;; don't reuse `refine` — the subtype direction is the whole point\n        ;; of the abstraction.\n        (marker-type? sub)\n        (cond\n          (and (marker-type? sup)\n               (= (marker-tag sub) (marker-tag sup)))\n          (subtype? (marker-inner sub) (marker-inner sup))\n          ;; nested-label case: `[:pii [:secret T]] ⊆ [:secret T']` —\n          ;; peeling the OUTER pii label to satisfy a secret slot would\n          ;; strip it; refuse (the caller wraps the slot type instead).\n          :else false)\n\n        (marker-type? sup)\n        ;; Promotion: a plain value into a marked slot is fine; the value\n        ;; gets labelled on entry. This is what lets ordinary string fns\n        ;; declare `[:secret :text]` slots and still accept both kinds of\n        ;; input.\n        (subtype? sub (marker-inner sup))\n\n        (and (record-type? sub) (record-type? sup))\n        (record-subtype? sub sup)\n        (and (list-type? sub) (list-type? sup))  (list-subtype? sub sup)\n        (and (map-type? sub) (map-type? sup))    (map-subtype? sub sup)\n        (and (tuple-type? sub) (tuple-type? sup)) (tuple-subtype? sub sup)\n        ;; A concrete keyword-keyed record IS a valid homogeneous-map\n        ;; value when the map's key type admits keywords and every field\n        ;; value fits the map's value type — lets a literal map (which\n        ;; classifies as a record) bind into a `[:map …]`-typed slot.\n        ;;\n        ;; Typevar slots in `(map-key sup)` / `(map-val sup)` accept\n        ;; unconditionally: a fresh typevar at a parametric slot like\n        ;; `:merge`'s `:maps [:list [:map a :any]]` represents\n        ;; \"anything the call-site picks for `a`\"; the record's\n        ;; concrete `:keyword` key (or each concrete field type) is a\n        ;; satisfying assignment. Without this, every record-bound-to-\n        ;; HOF-typed-map-slot site rejected during the sweep — e.g.\n        ;; `_value-form-root-attrs`'s `{:data-binding-id :text}`\n        ;; against `:merge :maps` declared `[:list [:map a :any]]`.\n        (and (record-type? sub) (map-type? sup))\n        (let [k-ok? (or (type-var? (map-key sup))\n                        (subtype? :keyword (map-key sup)))\n              v-ok? (or (type-var? (map-val sup))\n                        (every? #(subtype? % (map-val sup)) (vals sub)))]\n          (and k-ok? v-ok?))\n        (and (fn-type? sub) (fn-type? sup))      (fn-subtype? sub sup)\n        :else                                    false))))","gi":52},{"say":"Decides when one refinement constraint entails another (numeric\n           bounds, `:in` / `:=` / `:not=`, `:and` / `:or`). This is exactly how\n           `subtype?` compares refinement types like `:positive-int` ⊆\n           `:non-negative-int`, so read it right after.","defn":"constraint-implies?","ns":"graphden.types.core","n":7,"file":"src/graphden/types/core.clj","line":1048,"code":"(defn constraint-implies?\n  \"True iff every value satisfying refinement constraint `a` also\n   satisfies `b`. Drives subtype reasoning across refinement types\n   (`:positive-int ⊆ :non-negative-int`, `:user-port ⊆ :port`,\n   `:probability ⊆ :percent`).\n\n   Recurses through `[:and …]` (intersection — narrower than any\n   branch) and `[:or …]` (union — wider than every branch). Falls\n   back to structural equality for unknown shapes so legacy\n   refinements with custom constraints behave as before.\"\n  [a b]\n  (cond\n    ;; Trivial identity / open universal.\n    (or (= a b) (= b [:any])) true\n    (or (nil? a) (nil? b))    false\n\n    ;; AND on RHS: a must imply EVERY component of b.\n    (and (vector? b) (= :and (first b)))\n    (every? #(constraint-implies? a %) (rest b))\n\n    ;; OR on LHS: every branch of a must imply b (worst-case widens\n    ;; LHS to its widest member).\n    (and (vector? a) (= :or (first a)))\n    (every? #(constraint-implies? % b) (rest a))\n\n    ;; AND on LHS: any single component implying b is enough — the\n    ;; intersection is at least as narrow as that component.\n    (and (vector? a) (= :and (first a)))\n    (boolean (some #(constraint-implies? % b) (rest a)))\n\n    ;; OR on RHS: a must imply at least one branch.\n    (and (vector? b) (= :or (first b)))\n    (boolean (some #(constraint-implies? a %) (rest b)))\n\n    :else\n    (or (atom-implies? a b)\n        ;; Unknown leaf shape — fall back to structural equality.\n        false)))","gi":53,"see":[{"gi":52,"label":"subtype?"}]},{"say":"Robinson unification with occurs-check and subtype-aware leniency,\n           plus a union fallback. This is how polymorphic type variables get\n           bound during checking — the two-way complement to the one-way\n           `subtype?` test.","defn":"unify","ns":"graphden.types.core","n":8,"file":"src/graphden/types/core.clj","line":1474,"code":"(defn unify\n  \"Unify two types. Returns an updated substitution, or `::fail` if\n   they cannot be made equal. Substitution is a `{type-var type}` map.\n   3-arg form takes a starting substitution; 2-arg form starts empty.\n\n   Subtype-aware leniency: when EITHER side resolves to `:any`, the\n   unification succeeds without further constraint. Pure HM unify\n   would reject `:any` ↔ `:int` even though `:int ⊆ :any` makes them\n   compatible in the subtyping sense; rejecting would force every\n   polymorphic slot to pick one concrete type and stick to it across\n   all uses, which is too strict when the user has deliberately\n   declared a slot as `:any` (the doc's escape hatch).\"\n  ([t1 t2] (unify t1 t2 {}))\n  ([t1 t2 subst]\n   (check-type-compare-depth! \"unify\" t1 t2)\n   (binding [*type-compare-depth* (inc (long *type-compare-depth*))]\n     (let [a (normalise (resolve subst t1))\n           b (normalise (resolve subst t2))]\n       (cond\n         ;; Equality OR universal `:any` accept on the OTHER side when\n         ;; neither is a type-var. With a type-var on the other side we\n         ;; deliberately fall through to the typevar arms below so the\n         ;; var BINDS to `:any` rather than silently passing without a\n         ;; binding. Without the binding the var leaks downstream\n         ;; (e.g. `:try`'s declared `[:union a b]` retains free `a`/`b`\n         ;; when the body returns the type-checker's `:any` fallback,\n         ;; which then fails every consumer expecting a concrete\n         ;; member shape).\n         (or (= a b)\n             (and (or (= a :any) (= b :any))\n                  (not (or (type-var? a) (type-var? b))))) subst\n         ;; A type variable binds to whatever the other side is — a\n         ;; primitive, a union, a fn-type, anything (subject to the\n         ;; occurs-check in `bind-var`). This MUST precede the union\n         ;; branch below: `unify('a, [:union …])` would otherwise be\n         ;; captured by the union case, which only runs a subtype probe\n         ;; — and a free type-var is a subtype of nothing — so it would\n         ;; fail instead of binding the var to the union.\n         (type-var? a)        (bind-var a b subst)\n         (type-var? b)        (bind-var b a subst)\n         ;; `:never` (bottom) unifies with anything — it is a subtype of\n         ;; every type, so a divergent `:throw` branch fits any context.\n         ;; Placed AFTER the type-var arms so a var still BINDS to\n         ;; `:never` (letting `make-union` later absorb it) rather than\n         ;; merely succeeding without a binding.\n         (or (= a :never) (= b :never)) subst\n         ;; Unions: HM unifier doesn't naturally pick a branch (multiple\n         ;; valid choices), so `try-unify-unions` runs the documented\n         ;; fallback chain (subtype-direction success, common-member\n         ;; strip, single-typevar arm-pick, single-typevar absorption).\n         ;; Reduces this `cond` arm to the dispatch only — the chain\n         ;; itself reads as a small list of helpers.\n         (or (union-type? a) (union-type? b))\n         (try-unify-unions a b subst)\n         ;; Subtype-aware unification — succeeds without further binding\n         ;; when one of the relations holds:\n         ;;\n         ;; - Primitive subtype within the numeric hierarchy\n         ;;   (`:int ↔ :numeric` is fine because `:int ⊆ :numeric`).\n         ;; - Records / lists / refinements ↔ `:jsonb`. They ARE\n         ;;   jsonb-shaped on the wire (matches the subtype rule\n         ;;   `record ⊆ :jsonb`). A slot whose declared type narrowed\n         ;;   from a type-var to `:jsonb` (because earlier in the chain\n         ;;   it bound to a jsonb-typed value) needs to unify against\n         ;;   a more-precisely-typed record at a later call site.\n         ;;\n         ;; The pinned type-var keeps its first binding; subsequent\n         ;; compatible refinements flow through unchanged.\n         (or (and (primitive? a) (primitive? b)\n                  (or (primitive-subtype? a b) (primitive-subtype? b a)))\n             (and (= a :jsonb)\n                  (or (record-type? b) (list-type? b) (map-type? b)\n                      (tuple-type? b) (refine-type? b)))\n             (and (= b :jsonb)\n                  (or (record-type? a) (list-type? a) (map-type? a)\n                      (tuple-type? a) (refine-type? a)))\n             ;; Refinement ↔ (primitive OR refinement) — defer to\n             ;; `subtype?`, which already understands\n             ;; `[:refine B c] ⊆ B` and constraint-implies between\n             ;; refinement constraints. Without this, unifying a\n             ;; record field declared `:int` against a record field\n             ;; computed as `:non-negative-int` (or vice-versa) falls\n             ;; into the `::fail` arm, even though the relation holds.\n             (and (or (refine-type? a) (refine-type? b))\n                  (or (subtype? a b) (subtype? b a)))\n             ;; `:empty-map` is the bottom of map shapes — vacuous-truth\n             ;; subtype of every map-shaped target (the same rule\n             ;; `subtype?` already grants). Without this branch a\n             ;; `{:value {}}` binding to `:coalesce :default a` after\n             ;; `:value` resolved `a := :jsonb` falls into the `:else\n             ;; ::fail` arm — the subtype-aware leniency for `:jsonb`\n             ;; above only fires for record/list/map/tuple/refine\n             ;; literal classifications, not the `:empty-map` sentinel.\n             (and (= a :empty-map) (or (= b :jsonb) (map-type? b) (record-type? b)))\n             (and (= b :empty-map) (or (= a :jsonb) (map-type? a) (record-type? a))))\n         subst\n         (and (fn-type? a) (fn-type? b))         (unify-fn a b subst)\n         (and (list-type? a) (list-type? b))     (unify (list-elem a) (list-elem b) subst)\n         (and (map-type? a) (map-type? b))\n         (let [s (unify (map-key a) (map-key b) subst)]\n           (if (= s ::fail) ::fail (unify (map-val a) (map-val b) s)))\n         (and (tuple-type? a) (tuple-type? b))\n         (let [ea (tuple-elems a) eb (tuple-elems b)]\n           (if (= (count ea) (count eb))\n             (reduce (fn [s [x y]]\n                       (if (= s ::fail) ::fail (unify x y s)))\n                     subst (map vector ea eb))\n             ::fail))\n         (and (record-type? a) (record-type? b)) (unify-record a b subst)\n         ;; A keyword-keyed record unifies with `[:map K V]` — same\n         ;; relation `subtype?` already grants (`record ⊆ [:map …]`).\n         (and (map-type? a) (record-type? b))    (unify-map-record a b subst)\n         (and (record-type? a) (map-type? b))    (unify-map-record b a subst)\n         :else                ::fail)))))","gi":54},{"say":"The single source of truth for nullability narrowing: remove `:null`\n           from a top-level union (bare `:null` → `:never`) while NEVER stripping\n           a `:secret`. The canonical example of type narrowing, shared by\n           control-flow refinement and the `:coalesce` rule.","defn":"strip-null","ns":"graphden.types.core","n":9,"file":"src/graphden/types/core.clj","line":284,"code":"(defn strip-null\n  \"Remove `:null` members from a top-level union; the bare `:null` type\n   becomes `:never` (bottom). A non-union, non-`:null` input passes\n   through unchanged. Conservative on `[:secret …]`: a secret-wrapped\n   nullable carries `:null` INSIDE the wrapped union, not at top level,\n   so this leaves the taint marker intact — it never strips a secret.\n\n   The narrowing helper (`:some?`/`:nil?` control-flow refinement in\n   `types.check.narrowing`) and the `:coalesce` return-rule\n   (`core/logic/impls.clj`) both remove nullability the same way; this\n   is their single source of truth.\"\n  [t]\n  (cond\n    (union-type? t)\n    (let [members (vec (remove #{:null} (union-members t)))]\n      (cond\n        (empty? members) :never\n        (= 1 (count members)) (first members)\n        :else (make-union members)))\n    (= t :null) :never\n    :else t))","gi":55},{"say":"The `:return-type-rule` propagator that wraps a fn's return in\n           `[:secret …]` when any argument carries a secret anywhere. This is how\n           the information-flow marker flows through composition — the payoff of\n           the secret arm you saw in `subtype?`.","defn":"taint-with-secret-if-tainted","ns":"graphden.types.core.shapes","n":10,"file":"src/graphden/types/core/shapes.clj","line":471,"code":"(defn taint-with-secret-if-tainted\n  \"Pluggable `:return-type-rule` propagator — if ANY arg in\n   `bindings-info` carries a `[:secret …]` anywhere in its type,\n   wrap the static return in `[:secret …]`. Otherwise return the\n   static return verbatim.\n\n   `bindings-info` is the shape `compute-return-type` passes to a\n   rule: `{slot-name {:type T :value V? :ref R? …}}`. We look at\n   `:type` only.\n\n   Base-fns with no other return-type-rule opt into propagation by\n   registering this fn directly. Base-fns that ALREADY have a\n   structural return-type-rule (`:first`, `:get`, etc.) wrap their\n   rule via `wrap-with-taint` so the structural computation runs\n   first AND the taint propagates if applicable.\"\n  [bindings-info default-ret]\n  (let [tags (reduce (fn [acc [_slot info]]\n                       (into acc (marker-tags-in (:type info))))\n                     #{}\n                     bindings-info)]\n    (if (seq tags)\n      ;; Carry EVERY marker present on any input — a fn that read a\n      ;; `[:pii …]` and a `[:secret …]` returns a value labelled with\n      ;; both. Deterministic wrap order (sorted) so computed types are\n      ;; stable across runs.\n      (reduce (fn [t tag] (make-marker-type tag t))\n              default-ret\n              (sort tags))\n      default-ret)))","gi":56,"see":[{"gi":52,"label":"subtype?"}]},{"say":"Infers a structural type from a literal Clojure value (records,\n           header maps, `[:list T]`, primitives). This is where concrete argument\n           values enter the checker as types — the input side of every binding\n           check.","defn":"classify-literal","ns":"graphden.types.check.literals","n":11,"file":"src/graphden/types/check/literals.clj","line":40,"code":"(defn classify-literal\n  \"Infer the type of a literal Clojure value. Recursively walks maps\n   and vectors so a literal classifies into its STRUCTURAL type, not\n   the flat `:jsonb` catch-all — that lets a literal map type-check\n   against a declared record-type (`:security-headers-shape`, etc.)\n   instead of silently failing `:jsonb ⊄ <record>`.\n\n   - keyword-keyed non-empty map → record-type `{k (classify v) …}`\n   - string-keyed map with homogeneous value type → `[:map :text V]`\n     (e.g. `{\\\"Content-Type\\\" \\\"text/html\\\"}` → `[:map :text :text]`).\n     Lets header-map literals type-check against `:ring-response`'s\n     `[:map :text :text]` slot.\n   - mixed-keyed map, or empty map → `:jsonb` (a genuine generic\n     JSON object — neither shape carries enough evidence)\n   - vector → `[:list T]` where T is the least-upper-bound of the\n     items' types (`:any` when items disagree or the vector is empty)\n\n   Returns nil if the shape isn't a recognised literal (callers fall\n   back to `:any` or skip type-checking the binding).\"\n  [v]\n  (cond\n    (nil? v)         :null\n    (boolean? v)     :bool\n    (integer? v)     :int\n    (float? v)       :float\n    (string? v)      :text\n    (keyword? v)     :keyword\n    (uuid? v)        :uuid\n    (map? v)         (cond\n                       (empty? v) :empty-map\n                       (every? keyword? (keys v))\n                       (into {}\n                             (map (fn [[k fv]]\n                                    [k (or (classify-literal fv) :any)]))\n                             v)\n                       (every? string? (keys v))\n                       (let [val-types (into #{} (map #(or (classify-literal %) :any))\n                                             (vals v))]\n                         (if (= 1 (count val-types))\n                           [:map :text (first val-types)]\n                           :jsonb))\n                       :else :jsonb)\n    (vector? v)      (let [elems (into #{} (map #(or (classify-literal %) :any)) v)]\n                       [:list (if (= 1 (count elems)) (first elems) :any)])\n    :else            nil))","gi":57},{"say":"Verifies one binding's `actual` ⊆ `expected`, running `unify` when\n           type-vars are present and handling the `:any` / `:never` /\n           refinement-on-literal escape hatches. The atomic unit of\n           type-checking, tying together `subtype?`, `unify`, and\n           `classify-literal`.","defn":"check-binding!","ns":"graphden.types.check","n":12,"file":"src/graphden/types/check.clj","line":429,"code":"(defn- check-binding!\n  \"For a single binding, verify `actual ⊆ expected`. When `expected`\n   carries type variables, unify instead so the variables get bound.\n\n   Throws `:types/check-failed` with a multi-line, fn-def-named\n   message on mismatch. ex-info `:data` includes the structured\n   pieces (`:fn-name`, `:parent`, `:arg`, `:binding`, `:expected`,\n   `:actual`) so callers can format their own diagnostics if\n   needed.\"\n  [parent-name arg-name expected actual subst fn-name b-form]\n  (cond\n    ;; Type-var on EITHER side + `:any`-shaped actual — bind the var\n    ;; via unify FIRST. Without this, `:if`'s `:then a` slot bound to\n    ;; an actual `[:map :any :any]` would fall into the silent-pass\n    ;; below, leaving `a` unbound; `:if`'s declared `[:union a b]`\n    ;; return then surfaces a literal `\"a\"` typevar string in the\n    ;; registry, polluting downstream consumers (the structural-any\n    ;; from the binding IS information — that's the bind path, not\n    ;; a no-op).\n    (and (or (has-type-var? expected) (has-type-var? actual))\n         (any-shape? actual))\n    (let [next-subst (types/unify expected actual subst)]\n      (if (types/fail? next-subst) subst next-subst))\n\n    ;; `:any` (or structural-`:any` like `[:map :any :any]` /\n    ;; `[:list :any]`) — the doc's static escape hatch. Carries no\n    ;; static information either way, so silent-pass. (`:null` used\n    ;; to pass too, as a blanket runtime escape hatch. Now that\n    ;; nil-producing base-fns are typed `[:union :null T]`, a bare\n    ;; `:null` actual is checked normally: it satisfies a nullable /\n    ;; `:any` / type-var slot via subtype? / unify, and is correctly\n    ;; REJECTED by a concrete non-null slot.)\n    (any-shape? actual)\n    subst\n\n    ;; `:never` (bottom) actual — a divergent `:throw` branch. It fits\n    ;; any expected type, but we unify rather than pass silently so a\n    ;; type-var expected (e.g. `:if`'s `:then` slot) BINDS to `:never`.\n    ;; Without the binding the branch union keeps a free var instead\n    ;; of letting `make-union` absorb the bottom. `unify` with a\n    ;; `:never` operand always succeeds, so the result is never a fail.\n    (= actual :never)\n    (let [s (types/unify expected actual subst)]\n      (if (types/fail? s) subst s))\n\n    ;; Refinement on a LITERAL value: if we know the literal AND\n    ;; can evaluate the constraint, accept-or-reject inline.\n    (and (types/refine-type? expected)\n         (some? b-form)\n         (literal-binding? b-form))\n    (check-refinement-on-literal parent-name arg-name expected actual\n                                 subst fn-name b-form\n                                 (literal-binding-value b-form))\n\n    ;; Subtype FIRST — it handles container-into-jsonb (`[:list 'b] ⊆\n    ;; :jsonb`) regardless of inner type-vars, since the outer `list-\n    ;; type?` arm of the :jsonb sink rule doesn't recurse into the\n    ;; element type. Trying unify first would reject these\n    ;; (`unify [:list 'b] :jsonb = ::fail`).\n    ;;\n    ;; When typevars ARE present, also run unify after a successful\n    ;; subtype to extract bindings. subtype? is lenient on typevar-sup\n    ;; (`map-subtype?` / `list-subtype?` / `fn-subtype?`'s sup-side\n    ;; typevar arms) so the structural check passes WITHOUT carrying\n    ;; the binding forward. Without this follow-up, e.g. `:try`'s\n    ;; `:body [:fn {} a]` slot bound to a fn returning `[:map :keyword\n    ;; :any]` passes subtype but leaves `a` free; downstream consumers\n    ;; of `:try`'s declared `[:union a b]` see typevars instead of the\n    ;; resolved `[:map :keyword :any]`.\n    (types/subtype? actual expected)\n    (if (or (has-type-var? expected) (has-type-var? actual))\n      (let [s (types/unify expected actual subst)]\n        (if (types/fail? s) subst s))\n      subst)\n\n    ;; Subtype rejected — but if EITHER side carries a type-var,\n    ;; the rejection may be because `subtype?` doesn't reason about\n    ;; type-vars (they only equal themselves). Fall back to `unify`\n    ;; so e.g. `'a ⊆ :jsonb` succeeds by binding `'a := :jsonb`.\n    (or (has-type-var? expected) (has-type-var? actual))\n    (let [next-subst (types/unify expected actual subst)]\n      (if (types/fail? next-subst)\n        (throw-mismatch! (mismatch-context parent-name fn-name arg-name\n                                           b-form expected actual))\n        next-subst))\n\n    :else\n    (throw-mismatch! (mismatch-context parent-name fn-name arg-name\n                                       b-form expected actual))))","gi":58},{"say":"The declared-signature engine: when a root base-fn has no hand\n           `:return-type-rule`, the polymorphic declaration itself computes\n           the return — unify each var-carrying declared arg against the\n           actual type at the site, resolve the declared return through the\n           substitution. `:coll [:list a] → [:union :null a]` IS the rule;\n           the hand-written rules that survive are only those reading\n           literal values, union fan-out, or the registry.","defn":"signature-return","ns":"graphden.types.check","n":13,"file":"src/graphden/types/check.clj","line":1922,"code":"(defn signature-return\n  \"Generic structural fallback for a root base-fn with NO hand-written\n   `:return-type-rule` whose DECLARED signature carries type variables\n   (`:coll [:list a]` → `[:union :null a]`): unify each var-carrying\n   declared arg type against the actual type visible at this site,\n   JOIN the per-arg substitutions (a var bound differently by two args\n   unions — return-position covariance makes the join the sound\n   direction for a result type; on the CHECKED path `check-binding!`'s\n   HM-strict unify has already rejected such a conflict, so the join\n   arm only ever fires on the uncheckable re-fire path in\n   `effective-ref-return-uncached`), then resolve the declared return\n   through the joined substitution.\n\n   Degrades to `static-ret` whenever nothing binds or a var stays\n   free — the fallback must never widen or invent. `:any` actuals are\n   skipped: a free/unknown arg carries no information, and letting the\n   var bind to `:any` would widen the resolved return.\n\n   This is the declared-signature path that makes most hand rules\n   redundant: the signature already IS the rule, written where the\n   author reads it (fns.edn).\"\n  [root-entry bindings-info static-ret]\n  (let [decl-ret (:return root-entry)]\n    (if-not (has-type-var? decl-ret)\n      static-ret\n      (let [substs (into []\n                         (keep (fn [[arg-name expected]]\n                                 (let [actual (get-in bindings-info\n                                                      [arg-name :type])]\n                                   (when (and (has-type-var? expected)\n                                              actual\n                                              (not= :any actual))\n                                     (let [s (types/unify expected actual {})]\n                                       (when-not (types/fail? s) s))))))\n                         (:args root-entry))\n            joined (reduce (fn [acc s]\n                             (reduce-kv\n                               (fn [m v t]\n                                 (let [prev (get m v)]\n                                   (cond\n                                     (nil? prev) (assoc m v t)\n                                     (= prev t)  m\n                                     :else (assoc m v (types/make-union\n                                                        [prev t])))))\n                               acc s))\n                           {} substs)\n            resolved (when (seq joined)\n                       (types/resolve joined decl-ret))]\n        (if (or (nil? resolved) (has-type-var? resolved))\n          static-ret\n          resolved)))))","gi":59},{"say":"Type-checks a single fn-def against its (single or multiple-\n           inheritance) parents: resolve parent slots, run the monotonicity /\n           unknown-slot / effect guards, unify bindings, compute the return via\n           type-rules, propagate effects, and snapshot the rich-type into the\n           registry. The per-node checker the sweep repeats.","defn":"check-fn-def!","ns":"graphden.types.check","n":14,"file":"src/graphden/types/check.clj","line":2198,"code":"(defn check-fn-def!\n  \"Type-check a single fn-def against its parent's signature\n   (whether that parent is a base-fn or a previously-checked\n   composed fn-def). On success, snapshot the fn-def's computed\n   rich-type into the registry so DOWNSTREAM checks can resolve\n   refs to it.\n\n   Throws `:types/check-failed` on mismatch.\n\n   Recognised binding shapes:\n     :other-fn           — fn-ref; actual = ref's return type\n     {:value x}          — literal; actual = classify-literal\n     bare literal        — same as {:value …}\n     {:as :name}         — rename, no value flow → checked at caller\n     [items …]           — sequence chain; each item type-checked\n                           against the slot's element type\n     {:ref :name}        — same as a bare keyword fn-ref\"\n  [{fn-name :name :as fn-def}]\n  (when-let [{:keys [primary-parent parent-info]} (resolve-parent-info fn-def)]\n    (binding [*source-info* (source-info-for fn-def)]\n      ;; Type-row parents (e.g. `:Storage`, `:ResolveVersionedRowsInput`)\n      ;; declare their abstract operations as record FIELDS, not as the\n      ;; rich-type `:args` slot map (which is empty for type-rows).\n      ;; Concrete impls (`:postgres-storage-impl :parent :Storage :args\n      ;; {:query :pg-query …}`) bind those fields. Inject the resolved\n      ;; fields from EVERY parent in the MI list (primary OR secondary)\n      ;; so the per-binding type-check verifies that bindings satisfy\n      ;; the type-row's field contracts. `(:args parent-info)` wins\n      ;; on a key collision — that's the normal slot map.\n      ;;\n      ;; Resolving every parent (not just primary) closes the MI bug\n      ;; surfaced by `:resolve-versioned-rows :parents [:filter\n      ;; :ResolveVersionedRowsInput]`: the type-row is the SECONDARY\n      ;; parent, so a primary-only resolver missed its fields entirely\n      ;; (`:version-id-field` etc. showed up as \"unknown slot\").\n      (let [parent-list (or (seq (:parents fn-def))\n                            (when (:parent fn-def) [(:parent fn-def)]))\n            type-row-fields (reduce\n                              (fn [acc p]\n                                (let [resolved (and (keyword? p)\n                                                    (types/resolve-alias p))]\n                                  (if (types/record-type? resolved)\n                                    (merge acc resolved)\n                                    acc)))\n                              (let [ret (:return parent-info)]\n                                (if (types/record-type? ret) ret {}))\n                              parent-list)\n            parent-args (merge type-row-fields (:args parent-info))]\n        (check-effect-categories! fn-def)\n        (check-unknown-slots! fn-def primary-parent parent-args parent-info)\n        (check-ref-type-overrides! fn-def primary-parent)\n        (check-binding-monotonicity! fn-def primary-parent parent-args)\n        (check-branch-local-monotonicity! fn-def)\n        (let [;; Effective parent-args includes resolved bindings from\n              ;; further up the chain — gives rules a transitive view of\n              ;; slot types AND the ref-name (when bound to a fn-ref) so\n              ;; ref re-firing can pick up call-site narrowing.\n              effective-parent\n              (merge (:resolved-bindings parent-info {})\n                     (into {}\n                           (map (fn [[k t]] [k {:type t :value nil}]))\n                           parent-args))\n              ;; Backward unification: when this fn-def declares a\n              ;; concrete `:return-type` and the parent's return is a\n              ;; bare type-var, bind that var. Any parent slot typed by\n              ;; the SAME var is then checked against (and surfaced as)\n              ;; the narrowed type — e.g. `:default-security-headers`\n              ;; declaring `:return-type :security-headers-shape` over\n              ;; `:const` binds `a`, so the `:value` slot reads as\n              ;; `:security-headers-shape` instead of generic `a`.\n              parent-ret    (:return parent-info)\n              declared-ret  (:return-type fn-def)\n              init-subst    (if (and declared-ret (types/type-var? parent-ret))\n                              {parent-ret declared-ret}\n                              {})\n              subst (type-check-bindings fn-def primary-parent parent-args init-subst)\n              ;; Slots whose type changed once `subst` is applied (backward\n              ;; unification) PLUS rule-derived narrowings (e.g. `:update-in`\n              ;; narrowing `:path` from its `:m` record). Rule narrowings\n              ;; win on a key collision — a rule knows more than generic\n              ;; var-substitution. The editor shows these on type-chips.\n              slot-types (merge\n                           (into {}\n                                 (keep (fn [[arg-name arg-type]]\n                                         (let [resolved (types/resolve subst arg-type)]\n                                           (when (not= resolved arg-type)\n                                             [arg-name resolved]))))\n                                 parent-args)\n                           (compute-rule-slot-types fn-def primary-parent\n                                                    effective-parent))\n              nav-types (compute-rule-nav-types fn-def primary-parent\n                                                effective-parent)\n              free-args (collect-free-args fn-def parent-args subst)\n              static-ret (types/resolve subst (or (:return parent-info) :any))\n              own-bindings (bindings-info-for-rule (:args fn-def))\n              computed-return (compute-return-type fn-def primary-parent\n                                                   effective-parent static-ret)\n              recorded-return (enforce-declared-return! fn-name fn-def computed-return)\n              drift (return-type-drift fn-def computed-return)\n              effects (compute-effects (:args fn-def) parent-info)]\n          (when drift (log-return-type-drift! fn-name fn-def drift))\n          (when-let [declared (some-> fn-def :effects set)]\n            (when (not= declared effects)\n              (log-effects-drift! fn-name fn-def declared effects)))\n          (check-effects-policy! fn-name fn-def effects)\n          (record-result! fn-name fn-def primary-parent parent-info\n                          free-args recorded-return effects own-bindings\n                          slot-types nav-types drift)\n          subst)))))","gi":60},{"say":"The whole-graph sweep entry point: fold `check-fn-def!` over\n           topologically-ordered fn-defs so each def's computed rich-type is\n           registered before its dependents read it. This is how the entire graph\n           is checked end to end.","defn":"check-all-defs!","ns":"graphden.types.check","n":15,"file":"src/graphden/types/check.clj","line":2309,"code":"(defn check-all-defs!\n  \"Run type-check on every fn-def. Stops at the first mismatch.\n   Returns the per-fn substitution map (for diagnostic / future\n   computed-type cache) on success.\n\n   PRECONDITION: `fn-defs` must be topologically ordered,\n   dependencies-first. `check-fn-def!` records each computed rich-type\n   into the shared registry (`record-result!` → `record-rich-types-raw!`),\n   and downstream defs read parents / ref-returns back out via\n   `registry/rich-type-of` (`resolve-parent-info`, `effective-ref-return`).\n   A def checked BEFORE the def it references resolves that ref to `:any`\n   instead of its real type — no error, just a silently looser check.\n   Callers (`sync-fn-entities-from-packages!`) topo-sort before calling;\n   the narrowing passes below have the same ordering dependency.\"\n  [fn-defs]\n  (into {}\n        (map (fn [fn-def]\n               [(:name fn-def) (check-fn-def! fn-def)]))\n        fn-defs))","gi":61}]},{"id":":crud","title":"CRUD & the write path","status":"toured","summary":"Entity/branch/secret writes, request parsing, type-check on write,\n             fn-execution lookup + persist.","paths":["src/graphden/crud/"],"after":[":storage",":types"],"steps":[{"say":"The HTTP boundary where a mutation first becomes structured data:\n           pull `type` / `id` out of a write request, preferring reitit\n           `:path-params` and falling back to raw-URI parsing.","defn":"extract-entity-params","ns":"graphden.crud.request","n":1,"file":"src/graphden/crud/request.clj","line":93,"code":"(defn extract-entity-params\n  \"Extracts type-str, id-str, entity-type from request. Prefers\n   reitit's `:path-params` when present; falls back to URI parsing\n   (the handler is sometimes reached with the raw http-kit request\n   that hasn't been through reitit's `enrich-request`).\"\n  [request]\n  (let [pp (:path-params request)\n        rp (when (nil? pp) (parse-uri-segments (:uri request)))\n        type-str (or (:type pp) (:type-str rp))\n        id-str (or (:id pp) (:id-str rp))]\n    {:type-str type-str\n     :id-str id-str\n     :entity-type (entity-type-from-string type-str)}))","gi":62},{"say":"Normalizes the Ring body (string / InputStream / already-parsed) into\n           a keyword-keyed Clojure map — the payload every entity write is built\n           from.","defn":"read-json-body","ns":"graphden.crud.request","n":2,"file":"src/graphden/crud/request.clj","line":108,"code":"(defn read-json-body\n  \"Pull the JSON body off a Ring request whether it arrives as a\n   string, an InputStream, or already-parsed Clojure data. Returns\n   a Clojure map with keyword keys, or nil for an empty body. The\n   layout endpoint has the same logic — we duplicate here so the\n   types API doesn't depend on app.layout (cross-package).\"\n  [request]\n  (let [raw (:body request)]\n    (cond\n      (nil? raw)                            nil\n      (map? raw)                            raw\n      (instance? java.io.InputStream raw)\n      (json/parse-stream\n        (java.io.InputStreamReader. ^java.io.InputStream raw \"UTF-8\") true)\n      (and (string? raw) (not (str/blank? raw)))\n      (json/parse-string raw true)\n      :else                                 nil)))","gi":63},{"say":"Resolves the target branch (by UUID or name) so a write lands on the\n           right versioned storage. The branch dimension enters here, before any\n           row is touched.","defn":"resolve-branch-ref","ns":"graphden.crud.branches","n":3,"file":"src/graphden/crud/branches.clj","line":32,"code":"(defn resolve-branch-ref\n  \"Branch lookup that accepts either a stringified UUID or a branch\n   name. Returns the row, or nil when not found. Public so the\n   `:resolve-branch-ref` base-fn in `app/branches` can delegate\n   directly.\"\n  [storage branch-ref]\n  (or (some->> (request/parse-uuid-or-clear branch-ref)\n               (sp/read-entity storage :branch))\n      (when (and (string? branch-ref) (not (str/blank? branch-ref)))\n        (first (sp/query-entities storage :branch {:name branch-ref})))))","gi":64,"see":[{"gi":30,"label":"wrap-with-versioning"}]},{"say":"The generic single-row write entry point, and the best first stop for\n           the whole write path: it sequences every stage — capability gate,\n           `write-rej` validation, `sp/create-entity`, then invalidate + notify.","defn":"create-entity","ns":"graphden.crud.entities","n":4,"file":"src/graphden/crud/entities.clj","line":333,"code":"(defn create-entity\n  [entity-type data ctx]\n  ;; Abort-shielded: the whole bump->write->invalidate->note pipeline\n  ;; completes even if the client disconnects mid-request (see\n  ;; util.abort-shield) - un-noted epochs made every abort cost a\n  ;; background recompile via the graph-epoch heal.\n  (shield/run!\n    (fn []\n      (let [storage (request/require-storage ctx)\n            et (keyword entity-type)\n            ;; For :fn create the row may not have an `:id` yet; the\n            ;; cycle check still wants it (parent / FK targets need to\n            ;; know who's \"owner\"). Synthesize one so the check sees a\n            ;; stable owner — `sp/create-entity` honours a pre-supplied\n            ;; `:id` so the synthesized value is what lands in storage.\n            ;; `:binding` :value-present normalisation lives in\n            ;; `storage/protocol/core/standard-crud-normalize-data`\n            ;; (called from every postgres CRUD entry) so direct\n            ;; `sp/create-entity` users (tests, sync) pick it up too.\n            data' (cond-> data\n                    (and (= et :fn) (nil? (:id data))) (assoc :id (random-uuid)))]\n        ;; Capability gate: secret-shaped fn-defs are admin-only — see\n        ;; `secret-leaf-capability-rej` for the rationale. The marker is\n        ;; an in-memory contract between `crud.secrets` and this fn; it\n        ;; never reaches storage.\n        (when (= et :fn)\n          (when-let [rej (secret-leaf-capability-rej storage data')]\n            (throw (ex-info (:reason rej)\n                            {:type (:type rej)\n                             :entity-type et\n                             :data (dissoc data' :_admin-secret-create)}))))\n        (when-let [rej (validation/write-rej storage et data')]\n          (throw (ex-info (:reason rej)\n                          {:type (:type rej)\n                           :entity-type et :data data'})))\n        (let [result (sp/create-entity storage et (dissoc data' :_admin-secret-create))]\n          (invalidate! ctx storage et result)\n          (notify-after-write! ctx storage et :write result)\n          result)))))","gi":65},{"say":"The pre-write rejection gate that `create-entity` / `update-entity`\n           consult. It centralizes the cycle / MI-collision / terminal /\n           list-closed / secret-path checks that can veto a mutation before it\n           ever persists.","defn":"write-rej","ns":"graphden.crud.validation","n":5,"file":"src/graphden/crud/validation.clj","line":621,"code":"(defn write-rej\n  \"Run every server-side write-time guard against the proposed row.\n   Returns the first `{:reason :type}` rejection or nil if all pass.\n   Centralised so generic `create-entity` / `update-entity` and the\n   form-driven `process-*` paths share the same checks in the same\n   order.\"\n  [storage entity-type entity-data]\n  (or (some-> (cycle-check-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/dependency-cycle))\n      (some-> (constraint-shape-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/constraint-shape))\n      (some-> (mi-collision-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/mi-collision))\n      (some-> (value-override-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/value-override))\n      (some-> (terminal-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/terminal-seal))\n      (some-> (list-closed-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/list-closed))\n      (some-> (reparent-cross-branch-rej storage entity-type entity-data)\n              (assoc :type :constraint-violation/reparent-cross-branch))\n      (some-> (resolver-rej storage entity-type entity-data)\n              (assoc :type :capability/resolver-marker-laundering))))","gi":66},{"say":"A multi-row atomic write unit: fn-row + N slot-rows + N fn-slot\n           junctions, appending each success to a shared `journal` atom. Shows\n           how one logical create fans out into many graph rows.","defn":"apply-create-record-type-body","ns":"graphden.crud.entities","n":6,"file":"src/graphden/crud/entities.clj","line":862,"code":"(defn apply-create-record-type-body\n  \"Phases 1-3 of create-record-type's atomic write — fn-row + N\n   slot-rows + N fn-slot junctions + cache-invalidate. Mutates\n   `journal` (shared atom-of-vector) on each successful storage\n   write so the rollback callable can replay in reverse. Throws on\n   any storage / type-resolve failure — caught by the surrounding\n   `:try` graph node. Reached only after `:_create-record-type-\n   validation` passed.\n\n   Body is orchestration; each phase lives in a small private\n   helper so the read flows top-to-bottom by phase name.\"\n  [parsed journal ctx]\n  (let [storage (request/require-storage ctx)\n        {nm :name ns-id :ns-id desc :description fields :fields} parsed\n        own-id (create-record-type-fn-row! storage journal nm ns-id desc)]\n    (create-record-type-fields! storage journal own-id fields)\n    (invalidate! ctx storage :fn {:id own-id})\n    {:ok true :id (str own-id) :name nm}))","gi":67},{"say":"The `:try` on-throw partner: replay the `journal` in reverse,\n           best-effort deleting each row. This is how atomicity is achieved here\n           WITHOUT a DB transaction — the compensating half of the body above.","defn":"apply-create-rollback","ns":"graphden.crud.entities","n":7,"file":"src/graphden/crud/entities.clj","line":882,"code":"(defn apply-create-rollback\n  \"`:try`'s on-throw branch for create-record-type AND create-list-type.\n   Derefs `journal` and replays entries in reverse, deleting each\n   row best-effort (delete failures are logged, not re-thrown — the\n   important contract is that user state stays consistent with what\n   the response says). Returns the `{:ok false :error :data}` shape.\"\n  [journal exception ctx]\n  (let [storage (request/require-storage ctx)]\n    (doseq [[et id] (reverse @journal)]\n      (try (sp/delete-entity storage et id)\n           (catch Exception e\n             (log/warn e \"Rollback delete-entity failed for\"\n                       et id \"— manual cleanup may be required\")))))\n  ;; `Throwable/.getMessage` can return null (Java API contract); wrap\n  ;; both branches in `str` so the `:error` field is always a string.\n  (let [msg (str (Throwable/.getMessage ^Throwable exception))]\n    (cond-> {:ok false :error msg}\n      (instance? clojure.lang.ExceptionInfo exception)\n      (assoc :data (ex-data exception)))))","gi":68},{"say":"The atomic core for generic creates: create-or-humanise-error, a\n           post-create whole-fn type-check, conditional rollback, and the\n           rename-slot side-effect. The invariant-bearing heart of the apply\n           flow.","defn":"apply-create-core","ns":"graphden.crud.entities","n":8,"file":"src/graphden/crud/entities.clj","line":1377,"code":"(defn apply-create-core\n  \"§3.3 atomic core of the create-apply flow: capability gate +\n   `sp/create-entity` (with unique-violation humanisation) + Phase-6c\n   rename-slot side-effect + post-create whole-fn type-check +\n   on-failure rollback. Returns a uniform shape:\n     `{:created <id>}` on success\n     `{:error <human-msg>}` on any failure path\n   so the outer graph can dispatch on the shape and run invalidate /\n   notify / response without re-deriving the rollback semantics.\n\n   The §3.3 invariant — type-check + rollback see the SAME just-\n   created row id — lives entirely inside this fn. Phase 4.4 is the\n   place where a `:atom` + `:try` graph composition expresses the\n   same invariant; here we keep the carve-out because the rollback\n   is conditional on the post-check result, not on an exception.\"\n  [{:keys [entity-type type-str form-data entity-data]} ctx]\n  (let [storage (request/require-storage ctx)\n        create-result (try-create-or-error storage entity-type entity-data type-str)]\n    (if-let [post-rej (verify-post-create-or-rollback!\n                        storage create-result type-str entity-data entity-type)]\n      {:error (:reason post-rej)}\n      (if (:created create-result)\n        (do\n          ;; Rename-slot side-effect runs ONLY after the post-create check\n          ;; passes. Running it earlier meant a binding the aggregate check\n          ;; then REJECTED (and rolled back) still left the renamed-view\n          ;; slot + fn-slot behind — an orphan the fn permanently exposed\n          ;; with no backing binding. The rename is a type-preserving name\n          ;; alias, so the check's outcome is unaffected by ordering.\n          (when (and (= type-str \"binding\")\n                     (contains? form-data :rename-to))\n            (forward-rename-slot! storage form-data entity-data))\n          create-result)\n        ;; Preserve the error's :http-status (409 collisions, 403\n        ;; capability — the central web.errors mapping) alongside the\n        ;; human message.\n        (cond-> {:error (or (:error create-result)\n                            (str \"Failed to create \" type-str))}\n          (:http-status create-result)\n          (assoc :http-status (:http-status create-result)))))))","gi":69},{"say":"Reconstructs the touched fn-def and runs `check-fn-def!` after a\n           mutation, returning a `{:reason …}` that drives reject + rollback.\n           This is the type-check-on-write that `apply-create-core` relies on —\n           the graph is never allowed to persist ill-typed.","defn":"type-check-fn-after-mutation!","ns":"graphden.crud.type-check","n":9,"file":"src/graphden/crud/type_check.clj","line":329,"code":"(defn type-check-fn-after-mutation!\n  \"Run `check-fn-def!` on the affected fn-id after a CRUD mutation\n   touched its bindings/slots. Returns nil on success or\n   `{:reason …}` on type-check failure — caller can use that to\n   reject + rollback. Composed fns only; type-rows / base-fns\n   short-circuit (no parents → nothing to check).\"\n  [storage fn-id]\n  (with-org-alias-view*\n    (fn []\n      (try\n        (when-let [fn-def (reconstruct-fn-def storage fn-id)]\n          (types-check/check-fn-def! fn-def))\n        nil\n        (catch clojure.lang.ExceptionInfo e\n          ;; `.getMessage` is nullable; `str` keeps the response field a\n          ;; string instead of a JSON-`null` the client would render as\n          ;; \"rejected, no reason\".\n          {:reason (str (Throwable/.getMessage e))})\n        (catch Exception e\n          ;; Defensive: any unexpected error during reconstruction is\n          ;; surfaced (better than silent broken state, worse than\n          ;; nothing).\n          {:reason (str \"type-check error: \" (Throwable/.getMessage e))})))))","gi":70,"see":[{"gi":60,"label":"check-fn-def!"}]},{"say":"The post-persist step: invalidate caches and broadcast a NOTIFY delta\n           so sibling pods rebuild the affected fns. How a committed write becomes\n           visible fleet-wide.","defn":"notify-after-write!","ns":"graphden.crud.entities","n":10,"file":"src/graphden/crud/entities.clj","line":203,"code":"(defn notify-after-write!\n  \"Fire NOTIFY events on `graphden_events` so sibling pods react to\n   the mutation:\n\n   - `:service` writes → `service:<op>:<id>` — handled by the\n     reconciler's listener callback in `system/core.clj`.\n   - fn-graph writes (`:fn` / `:slot` / `:fn-slot` / `:binding` /\n     `:binding-list-item`) → one `fn:invalidate:<seed-fn-id>|<branch-id>`\n     event per affected fn-id (delta invalidation), or\n     `fn:invalidate:|<branch-id>` with empty id when the change is\n     cross-cutting (full clear) — handled by `:exec/compiled-registry`'s\n     listener callback.\n\n   The branch-id rides along because the sibling pod has to answer the\n   same question this pod answered locally: which of MY cached branch\n   registries can see this write? Without it a sibling would either\n   over-invalidate (recompiling `main` for a `dev` edit) or, as it did\n   before, invalidate only its base ctx and leave every cached branch\n   serving stale closures.\n\n   Cheap on the write path: one `pg_notify` SQL against the main\n   pool, per emitted event. Becomes a no-op when the ctx has no\n   `:notify-emitter` (tests without PG).\"\n  [ctx storage entity-type op data]\n  (when-let [emit (:notify-emitter ctx)]\n    (cond\n      (and (= entity-type :service) (:id data))\n      (emit {:kind :service :op op :id (str (:id data))})\n\n      (contains? fn-graph-entity-types entity-type)\n      (let [seeds (affected-fn-ids storage entity-type data)\n            branch-id (some-> (vcore/current-branch-id storage) str)\n            ;; The writing org, straight off the written row — OrgScopedStorage\n            ;; stamps `:org-id` on scoped entities, so `data` (the returned\n            ;; row) carries it without this core-layer code depending on\n            ;; tenancy. nil in single-tenant / un-scoped writes → omitted. Used\n            ;; only by the SSE relay to fan an event out to the right org's\n            ;; remote executors (the local invalidate path ignores it).\n            org-id (:org-id data)\n            ;; `cond->`, not a bare assoc: an un-versioned storage has no\n            ;; branch, and a nil-valued key is a different map from an\n            ;; absent one — `parse-payload` omits it on the way back for\n            ;; the same reason.\n            ;; The request's exact epoch bumps ride the event so the\n            ;; receiving pod can mark them covered (4th payload slot).\n            epochs (some-> epoch/*request-bump-log* deref seq vec)\n            event (fn [id]\n                    (cond-> {:kind :fn :op :invalidate :id id}\n                      branch-id (assoc :branch-id branch-id)\n                      org-id (assoc :org-id org-id)\n                      epochs (assoc :epochs epochs)))]\n        ;; The same three-way answer the local path takes, because a pod receives\n        ;; its OWN notify: an empty-id event means \"full clear\" to the listener,\n        ;; so emitting one for a write that changed no closure would undo the\n        ;; local delta and rebuild the whole graph on the next request — which is\n        ;; exactly what a `:slot` write did, from here, even after the local path\n        ;; was fixed.\n        ;;\n        ;; A bare slot that nothing exposes is invisible to every compiled\n        ;; closure, on this pod and on its siblings. The moment an fn DOES expose\n        ;; it, that `:fn-slot` write emits a seeded event, and the sibling's\n        ;; splice reads the slot row in with it.\n        (cond\n          (seq seeds) (doseq [seed seeds]\n                        (emit (event (str seed))))\n          ;; nil ≡ \"unknown shape\" — mirror the local `(invalidate-graph-cache!\n          ;; ctx)` full clear.\n          (nil? seeds) (emit (event \"\"))\n          :else nil)))))","gi":71},{"say":"Translates the `/api/execute` `{:fn-id | :fn-name}` request into the\n           full `:fn` row in one round-trip — the lookup that begins the\n           execution + persist path.","defn":"resolve-fn","ns":"graphden.crud.fn-execution.lookup","n":11,"file":"src/graphden/crud/fn_execution/lookup.clj","line":85,"code":"(defn resolve-fn\n  \"Like `resolve-fn-id` but returns the full :fn row in a single\n   storage round-trip. Use this when the caller needs both `:id` AND\n   `:name` (or other columns) — saves the extra `read-entity` you'd\n   otherwise chain after `resolve-fn-id`. Returns nil if neither\n   identifier resolves.\"\n  [storage parsed]\n  (cond\n    (:fn-id parsed)   (sp/read-entity storage :fn (:fn-id parsed))\n    (:fn-name parsed) (query-fn-by-name storage (:fn-name parsed))\n    :else nil))","gi":72},{"say":"The `/api/execute` orchestrator: resolve fn + version + free-arg\n           slots, acquire a concurrency slot, submit the future, and dispatch on\n           succeeded / pending / failed. The spine of the execute write path —\n           and where it hands off to the executor from the first block.","defn":"apply-execute","ns":"graphden.crud.fn-execution","n":12,"file":"src/graphden/crud/fn_execution.clj","line":85,"code":"(defn apply-execute\n  \"Stage 3 — submit the future, deref with timeout. Returns one of:\n     {:status :succeeded :result … :execution-id? :declared-effects …}\n     {:status :pending :execution-id …}\n     {:status :failed :error … :error-data … :execution-id?}\n\n   Persistence policy:\n   - Pre-create row when we know we need polling capability\n     (timeout > a few hundred ms is enough to justify the write —\n     keeps the polling client able to find the row even if completion\n     races our response).\n   - For pure fast fns with `:persist? false`, finalise without ever\n     writing a row.\"\n  ([ctx parsed]\n   ;; Non-graph callers (tests, BYO) — resolve the row here; the graph\n   ;; path passes the validation stage's already-resolved `:_execute-fn-row`\n   ;; through the 3-arity, so the request does ONE resolve, not two.\n   (apply-execute ctx parsed (lookup/resolve-fn (request/require-storage ctx) parsed)))\n  ([ctx parsed fn-row]\n   (let [storage (request/require-storage ctx)\n         ;; A tenant's SUBMITTED fn is untrusted graph code, so it runs\n         ;; effect-restricted: carry the cloud allow-list on the ctx and the\n         ;; executor gates it via `record-effect!` (compile-runtime honours\n         ;; `:allowed-effects`). Only the user-fn execution (`run-future`) uses\n         ;; this ctx — the platform lookups above and the request handler around\n         ;; us stay UNRESTRICTED, because that trusted machinery reads storage\n         ;; through `:pg-query` (a `:raw-sql`-recording base-fn) which must not\n         ;; be gated. Public org ≡ platform / single-tenant → no restriction.\n         exec-ctx (cond-> ctx\n                    (not= (tc/current-org) tc/public-org)\n                    ;; Per-org effect allow-list resolved from the org's plan\n                    ;; (task #4) — free stays locked, a paid tier widens it\n                    ;; (e.g. +:network). Falls back to the locked default when\n                    ;; no plan resolver is installed.\n                    (assoc :allowed-effects (cr/cloud-allowed-effects-for (tc/current-org))))\n         fn-id (:id fn-row)\n         fn-version-id (lookup/resolve-fn-version-id ctx fn-id)\n         ;; Cached: this call was ~1.3–1.9 s uncached and runs once per\n         ;; request. Safe here because /api/execute runs after CRUD writes\n         ;; (which invalidate), never during

# Persistent local integration cluster for the graphden fleet.
# extraPortMappings exposes the fleet's NodePort (30080) on the host, so a
# reverse proxy (Caddy, example.com:9443 → localhost:30080) can front it with TLS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gfleet
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP

       server-error-delta)}))\n        ;; Drop any candidate still inside its cooldown window.\n        fresh (remove (fn [a]\n                        (when-let [t (get state (alert-key a))]\n                          (< (- now-ms t) cooldown-ms)))\n                      candidates)\n        new-state (reduce (fn [st a] (assoc st (alert-key a) now-ms))\n                          state fresh)]\n    {:fire (vec fresh) :state new-state}))","gi":167},{"say":"The SSE invalidation relay: the hosted side fans branch/org\n           invalidation events out to subscribed external executors so a BYO\n           executor's compiled registry stays fresh without polling. The\n           freshness half of the BYO story.","defn":"start-relay!","ns":"graphden.system.sse","n":8,"file":"src/graphden/system/sse.clj","lang":"clj","line":137,"code":"(defn start-relay!\n  \"Start the SSE relay: an httpkit server on `port` serving `/events/stream`,\n   plus a callback on `notify-listener` that broadcasts each `graphden_events`\n   event to the connected subscribers. Returns a handle for `stop-relay!`.\n\n   Only fn-invalidate + execution events are worth relaying to a remote\n   executor; `:service` events are pod-local reconcile signals. The remote\n   side ignores what it doesn't handle, so we forward everything and let\n   `on-notify` filter — keeping the relay dumb.\"\n  [{:keys [port notify-listener auth-provider]}]\n  (let [subscribers (atom {})\n        handler (fn [request]\n                  (if (= \"/events/stream\" (:uri request))\n                    ((make-handler subscribers auth-provider) request)\n                    {:status 404 :headers {\"Content-Type\" \"text/plain\"} :body \"not found\"}))\n        server (hk/run-server handler {:port port})\n        callback (when notify-listener\n                   (pg-notify/register! notify-listener\n                                        (fn [event] (broadcast! subscribers event))))]\n    (log/info \"SSE invalidation relay started\" {:port port})\n    {:server server :subscribers subscribers\n     :notify-listener notify-listener :callback callback}))","gi":168},{"say":"The read side of BYO: a `StorageCRUD` leaf whose rows are an ATOM\n           of `{entity → [row …]}` fetched from the hub over HTTP, with every\n           write arm throwing `read-only!`. The customer's executor compiles\n           and runs the same graph while the hub stays the only writer —\n           and `refresh!` swaps in a fresh bundle without rebuilding the\n           record, which is what the SSE relay below triggers.","defn":"RemoteStorage","ns":"graphden.storage.remote.core","n":9,"file":"src/graphden/storage/remote/core.clj","lang":"clj","line":112,"code":"(defrecord RemoteStorage\n  [rows hub-url token branch]\n\n  sp/StorageCRUD\n\n  (create-entity [_ _ _] (read-only! \"create-entity\"))\n\n\n  (read-entity [_ entity id] (first (query-rows @rows entity {:id id})))\n\n\n  (update-entity [_ _ _ _] (read-only! \"update-entity\"))\n\n\n  (delete-entity [_ _ _] (read-only! \"delete-entity\"))\n\n\n  (query-entities [_ entity where] (query-rows @rows entity where))\n\n\n  (query-entities\n    [this entity where opts]\n    ;; RemoteStorage holds only the compile-time graph tables, all\n    ;; non-versioned; `:limit` is the only opt the executor uses. Order/offset\n    ;; aren't emitted against these tables, so limit-after-filter is exact.\n    (let [res (sp/query-entities this entity where)]\n      (if-let [lim (:limit opts)] (vec (take lim res)) res)))\n\n\n  (query-latest-per-group\n    [_ entity where group-cols]\n    ;; In-memory grouping (the protocol says the contract is the result, not\n    ;; the mechanism). Latest per group-cols tuple by :created-at. `:created-at`\n    ;; is a `#inst` (java.util.Date), so compare by `inst-ms` — `max-key` over\n    ;; a raw Date-vs-0 mix would throw ClassCastException.\n    (->> (query-rows @rows entity where)\n         (group-by (apply juxt group-cols))\n         (vals)\n         (mapv (fn [group]\n                 (apply max-key #(if-let [c (:created-at %)] (inst-ms c) 0) group)))))\n\n\n  sp/StorageBatchCRUD\n\n  (create-entities [_ _ _] (read-only! \"create-entities\"))\n\n\n  ;; Contract (matches postgres crud/read-entities): return `{id → record}`\n  ;; for found rows, `{}` for none. Callers deref via `(vals …)` — a bare\n  ;; vector here would blow up `vals` in `executor.context`.\n  (read-entities\n    [_ entity ids]\n    (into {} (map (juxt :id identity)) (query-rows @rows entity {:id (vec ids)})))\n\n\n  (update-entities [_ _ _] (read-only! \"update-entities\"))\n\n\n  (upsert-entities [_ _ _] (read-only! \"upsert-entities\"))\n\n\n  (delete-entities [_ _ _] (read-only! \"delete-entities\"))\n\n\n  (query-ref-many-owners [_ _ _ _] (read-only! \"query-ref-many-owners\"))\n\n\n  sp/ExecutionGraph\n\n  ;; Declared to satisfy `executor.context/validate-context-options!`\n  ;; (`satisfies? ExecutionGraph`). The compiled-registry path never calls it\n  ;; — it reads the tables via `query-entities` and does the BFS in-process.\n  (resolve-execution-graph\n    [_ _]\n    (throw (ex-info \"RemoteStorage does not resolve-execution-graph — the compiled executor reads the tables directly\"\n                    {:type :remote-storage/unsupported}))))","gi":169,"see":[{"gi":17,"label":"StorageCRUD"}]},{"say":"The customer-hosted executor assembly: RemoteStorage over HTTP as the\n           read-only graph source, the SSE source for invalidation, and a direct\n           http-server — the same core, assembled for someone else's hardware.\n           Closes the platform block: the seams above are exactly what make this\n           assembly possible.","defn":"start-byo!","ns":"graphden.byo","n":10,"file":"src/graphden/byo.clj","lang":"clj","line":107,"code":"(defn start-byo!\n  \"Assemble + start a BYO executor. Returns a handle for `stop-byo!`.\n\n   Config:\n   - `:hub-url`      the hub's APP base URL (serves `/api/export/graph-rows`),\n                     e.g. \\\"https://hub.example.com\\\"\n   - `:sse-url`      the hub's SSE RELAY base URL (a DIFFERENT port —\n                     `GRAPHDEN_SSE_PORT`), e.g. \\\"https://hub.example.com:8081\\\".\n                     nil ⇒ no live refresh (bootstrap-only).\n   - `:token`        this executor's bearer (mint one on the hub with\n                     `POST /api/tokens`)\n   - `:org`          the org this executor serves (its slug)\n   - `:branch`       branch to pin (nil ⇒ main)\n   - `:handler-fn`   name of the org's app-handler fn to run per request\n   - `:port`         HTTP port to serve on\n   - `:packages`     package set to load impls from (default `default-packages`)\n   - `:extra-base-fns` optional `{fn-name → impl}` merged over the package impls\n\n   The hub-side prep: create the org, mint this token, point the org at its\n   handler, and flip it byo (`POST /api/orgs/execution-mode`).\"\n  [{:keys [hub-url sse-url token org branch handler-fn port packages extra-base-fns]\n    :or {packages default-packages}}]\n  ;; Preflight so a forgotten env var is a clear message, not a confusing\n  ;; \"bootstrap GET failed\" or NPE deeper in.\n  (doseq [[k v] {:hub-url hub-url :token token :org org :handler-fn handler-fn :port port}]\n    (when (or (nil? v) (and (string? v) (str/blank? v)))\n      (throw (ex-info (str \"BYO executor missing required config: \" k)\n                      {:type :byo/missing-config :key k}))))\n  (log/info \"Starting BYO executor\" {:hub hub-url :org org :branch branch :port port})\n  (let [loaded (when (seq packages) (pkg/load-packages packages))\n        base-fns (register-impls-in-memory! loaded extra-base-fns)\n        storage (remote/create-remote-storage hub-url token branch)\n        ;; No `:executor-orgs`: RemoteStorage already holds ONLY this org's +\n        ;; public rows (the hub scoped the bundle server-side), so re-filtering\n        ;; in `read-graph` is redundant — and `#{org}` would wrongly drop any\n        ;; shared row that happened to carry a non-nil org-id ≠ org.\n        ctx (ectx/create-context {:storage storage\n                                  :base-fns base-fns\n                                  :byo-executor? true})\n        _ (cr/rebuild! ctx)\n        handler-fn-id (:id (first (sp/query-entities storage :fn {:name handler-fn})))\n        _ (when-not handler-fn-id\n            (throw (ex-info (str \"BYO handler fn not found in the graph: \" handler-fn)\n                            {:type :byo/handler-not-found :handler-fn handler-fn})))\n        server (hk/run-server (app-handler ctx org handler-fn-id) {:port port})\n        ;; Stay fresh WITHOUT blocking the SSE reader thread. Each fn-invalidate\n        ;; the hub pushes marks the graph dirty and submits a refetch+recompile\n        ;; to a single-thread executor; the reader returns immediately and keeps\n        ;; draining frames. CAS coalescing collapses a burst to ≤2 rebuilds\n        ;; (one in flight + one trailing) — a rebuild already picks up every\n        ;; change since the last refresh, so N rapid edits don't mean N refetches.\n        refresh-exec (java.util.concurrent.Executors/newSingleThreadExecutor)\n        refresh-pending (atom false)\n        submit-refresh! (fn []\n                          (when (compare-and-set! refresh-pending false true)\n                            (java.util.concurrent.ExecutorService/.submit\n                              refresh-exec\n                              ^Runnable (fn []\n                                          (reset! refresh-pending false)\n                                          (try (remote/refresh! storage)\n                                               (cr/rebuild! ctx)\n                                               (catch Exception e\n                                                 (log/warn e \"BYO refresh failed\" {:org org})))))))\n        ;; The relay already fans out only this org's events + public ones. Its\n        ;; URL/port is separate from the hub. nil ⇒ bootstrap-only, no refresh.\n        source (when sse-url\n                 (remote-sse/start-source!\n                   {:hub-url sse-url :token token\n                    :on-event (fn [event]\n                                (when (= :fn (:kind event)) (submit-refresh!)))\n                    ;; Refresh on every (re)connect too (F5): an invalidate\n                    ;; that landed during a disconnect window is lost (no\n                    ;; replay), and BYO has no PG epoch self-heal — SSE is\n                    ;; its only freshness signal. The CAS-coalesced\n                    ;; submit-refresh! makes a redundant resync cheap.\n                    :on-connect submit-refresh!}))]\n    (log/info \"BYO executor serving\" {:org org :handler handler-fn :port port})\n    {:server server :source source :ctx ctx :storage storage :refresh-exec refresh-exec}))","gi":170}]},{"id":":accounts","title":"Accounts — the open identity module","status":"toured","summary":"The opt-in identity layer (docs/ACCOUNTS.md): one account, many\n             sign-in identities (password / Google / GitHub / Telegram),\n             hashed sessions, email verification, TOTP 2FA, and the /auth/*\n             + /login surface — all OFF unless the addon fragment is enabled.","paths":["src/graphden/accounts/"],"after":[],"steps":[{"say":"The heart of account-LINKING: a social sign-in resolves to an\n           existing identity, auto-links onto an account that owns the same\n           VERIFIED email, or creates a fresh account — in that order. One\n           person, many sign-in methods, one stable account-id for authz.","defn":"resolve-social-identity!","ns":"graphden.accounts.core","n":1,"file":"src/graphden/accounts/core.clj","lang":"clj","line":168,"code":"(defn resolve-social-identity!\n  \"Resolve a social sign-in to an account, creating or auto-linking as needed.\n   `info` = `{:provider :subject :email :email-verified? :display-name}`:\n\n   1. an existing `(provider, subject)` identity → its account (returning user);\n   2. else a VERIFIED email that an existing account owns as its primary-email →\n      attach the new identity to THAT account (auto-link across providers);\n   3. else a brand-new account (primary-email set only when the email is\n      verified) plus the identity.\n\n   Returns `{:account :account-id :created? :linked?}`. The caller mints the\n   session — this is storage-only.\"\n  [storage {:keys [provider subject email email-verified? display-name]}]\n  (let [email (normalize-email email)]\n    (if-let [ident (find-identity storage provider subject)]\n      (let [account-id (:account-id ident)]\n        {:account (account-of storage account-id) :account-id account-id\n         :created? false :linked? false})\n      (if-let [acct (and email email-verified? (account-by-email storage email))]\n        (let [account-id (str (:id acct))]\n          (create-identity! storage account-id\n                            {:provider provider :subject subject\n                             :email email :email-verified? true})\n          {:account acct :account-id account-id :created? false :linked? true})\n        (let [acct (create-account! storage {:display-name (or display-name email)\n                                             :primary-email (when email-verified? email)\n                                             :status \"active\"})\n              account-id (str (:id acct))]\n          (create-identity! storage account-id\n                            {:provider provider :subject subject\n                             :email email :email-verified? (boolean email-verified?)})\n          {:account acct :account-id account-id :created? true :linked? false})))))","gi":171},{"say":"Sessions are rows, not JWTs: the raw token exists exactly once (the\n           return value); storage keeps only its SHA-256. `kind` overloads the\n           same row for verify links and pending-2FA steps — kinds outside\n           nil/\"api\" never authenticate, so a verify link can't become a\n           bearer.","defn":"mint-session!","ns":"graphden.accounts.core","n":2,"file":"src/graphden/accounts/core.clj","lang":"clj","line":211,"code":"(defn mint-session!\n  \"Create a `:session` for `account-id`, returning the RAW token (this is the\n   only moment it exists in the clear — only its hash is stored). `opts`:\n   `:ttl-ms` (default 24h; nil ⇒ never expires), `:kind`, `:label`,\n   `:scopes` (space-separated scope names for an API bearer; nil ⇒ unscoped).\"\n  ([storage account-id] (mint-session! storage account-id nil))\n  ([storage account-id opts]\n   (let [ttl-ms (get opts :ttl-ms default-session-ttl-ms)\n         token (crypto/random-token)]\n     (sp/create-entity storage :session\n                       {:token-hash (crypto/sha256-hex token)\n                        :account-id account-id\n                        :expires-at (when ttl-ms (+ (now) ttl-ms))\n                        :kind (:kind opts)\n                        :label (:label opts)\n                        :scopes (:scopes opts)\n                        :created-at (now)})\n     token)))","gi":172},{"say":"The module's AuthProvider: bearer OR the HttpOnly gd_session cookie\n           (an OAuth redirect can't carry a bearer) → an org-AGNOSTIC principal.\n           Org is deliberately absent — the tenancy layer resolves it from\n           membership, which is what keeps this module open-core.","defn":"accounts-provider","ns":"graphden.accounts.provider","n":3,"file":"src/graphden/accounts/provider.clj","lang":"clj","line":64,"code":"(defn accounts-provider\n  \"An `AuthProvider` backed by the `accounts` model over `storage` (the BASE\n   storage — auth runs in the platform context, before any request scope).\"\n  [storage]\n  (->AccountsAuthProvider storage))","gi":173},{"say":"The whole HTTP surface as one route-collection Ring router:\n           password + social + telegram callbacks, verify links, identities\n           list/unlink, TOTP enroll/confirm/login-step, and the /login +\n           /account pages. Installed before the graph router; returns nil to\n           fall through, so an instance without the addon never sees it. The\n           page/email PRESENTATION renders through the injected graph seam\n           (`app.auth-pages` on the platform ctx) with the built-in Clojure\n           shell as the graph-outage fallback — see `graph-page` just above.","defn":"make-router","ns":"graphden.accounts.routes","n":4,"file":"src/graphden/accounts/routes.clj","lang":"clj","line":485,"code":"(defn make-router\n  \"Build the `/auth/*` Ring router. `opts`:\n   `:storage` `:mailer` `:app-origin` (nil ⇒ derive from Host),\n   `:oauth-providers` `{\\\"github\\\" {:client-id :client-secret} …}` (enabled only),\n   `:telegram` `{:bot-token …}` or nil,\n   `:page-renderer` (optional) `(fn [page-kw args] → html-or-nil)` — the graph\n   render seam (`app.auth-pages`); nil / throw ⇒ built-in pages,\n   `:email-renderer` (optional) `(fn [kind base-url token] → {:subject …}-or-nil)`\n   — same seam for the transactional email bodies.\"\n  [{:keys [storage mailer app-origin oauth-providers telegram\n           page-renderer email-renderer]}]\n  (let [provider-keys (set (keys oauth-providers))\n        ;; The graph pages take providers as a {\\\"github\\\" true} map — a\n        ;; JSONB-friendly membership map for the graph `:contains?`.\n        provider-map (into {} (map (fn [p] [p true])) provider-keys)\n        ;; Per-IP fixed-window limiters: login blunts password brute-force\n        ;; (bcrypt slows but doesn't bound attempts), signup blunts\n        ;; mass-account abuse, forgot blunts reset-mail spam. Over-quota →\n        ;; the same shape as failure (401/generic 200) so the limiter's\n        ;; existence isn't probeable.\n        login-limit (crypto/fixed-window-limiter 10 60000)\n        signup-limit (crypto/fixed-window-limiter 20 60000)\n        forgot-limit (crypto/fixed-window-limiter 5 60000)\n        ;; TOTP code verification — a 6-digit code is guessable within a\n        ;; window without a per-IP cap. 10/min blunts brute-force across\n        ;; /auth/totp (login 2nd step), /confirm and /disable.\n        totp-limit (crypto/fixed-window-limiter 10 60000)]\n    (fn [request]\n      (let [uri (str (:uri request))\n            method (:request-method request)]\n        (when (or (str/starts-with? uri \"/auth/\") (= uri \"/login\") (= uri \"/account\") (= uri \"/reset\"))\n          (let [origin (resolve-origin app-origin request)\n                ;; Trusted origin for EMAILED links only — never a\n                ;; poisonable public Host (M5). Blank ⇒ the sender\n                ;; refuses rather than email an attacker's URL.\n                link-orig (link-origin app-origin request)]\n            (cond\n              ;; CSRF: reject a state-changing POST carrying a cross-site\n              ;; Origin before it can act on the victim's session cookie\n              ;; (disable-2FA / unlink / mint-token / logout-all …). GETs\n              ;; and OAuth callbacks are unaffected; absent Origin passes.\n              (and (= method :post) (cross-site-origin? request))\n              (json-resp 403 {:ok false :error \"bad_origin\"})\n\n              (and (= method :get) (= uri \"/login\"))\n              (html-resp (graph-page page-renderer :login\n                                     {:providers provider-map :telegram telegram}\n                                     #(pages/login-page provider-keys telegram)))\n\n              ;; The graph :account page (editor present) redirects into the\n              ;; editor's Settings → Account card and takes no args; the\n              ;; built-in fallback stays the full standalone page (headless).\n              (and (= method :get) (= uri \"/account\"))\n              (html-resp (graph-page page-renderer :account\n                                     {}\n                                     #(pages/account-page provider-keys)))\n\n              (and (= method :get) (= uri \"/reset\"))\n              (html-resp (graph-page page-renderer :reset {}\n                                     #(pages/reset-page)))\n\n              (and (= method :get) (= uri \"/auth/me\"))\n              (handle-me storage request)\n\n              ;; Enabled oauth providers, for clients that render link/sign-in\n              ;; buttons OUTSIDE the served pages (the editor's Account card).\n              ;; Public by design — /login exposes the same set in its HTML.\n              (and (= method :get) (= uri \"/auth/providers\"))\n              (json-resp 200 {:ok true :providers provider-map})\n\n              (and (= method :get) (= uri \"/auth/tfa-state\"))\n              (handle-tfa-state storage request)\n\n              (and (= method :get) (= uri \"/auth/verify\"))\n              (handle-verify storage origin request)\n\n              (and (= method :post) (= uri \"/auth/signup\"))\n              (if (signup-limit (client-ip request))\n                (handle-signup storage mailer email-renderer origin link-orig request)\n                (json-resp 429 {:ok false :error \"rate_limited\"}))\n\n              (and (= method :post) (= uri \"/auth/login\"))\n              (if (login-limit (client-ip request))\n                (handle-login storage origin request)\n                ;; same shape as bad credentials — not probeable\n                (json-resp 401 {:ok false :error \"invalid_credentials\"}))\n\n              (and (= method :post) (= uri \"/auth/forgot\"))\n              (if (forgot-limit (client-ip request))\n                (handle-forgot storage mailer email-renderer link-orig request)\n                (json-resp 200 {:ok true :reset-sent true}))\n\n              (and (= method :post) (= uri \"/auth/reset\"))\n              (handle-reset storage request)\n\n              (and (= method :post) (= uri \"/auth/resend-verification\"))\n              (if (forgot-limit (client-ip request))\n                (handle-resend-verification storage mailer email-renderer link-orig request)\n                (json-resp 200 {:ok true}))\n\n              (and (= method :post) (= uri \"/auth/logout\"))\n              (handle-logout storage origin request)\n\n              (and (= method :post) (= uri \"/auth/logout-all\"))\n              (handle-logout-all storage origin request)\n\n              (and (= method :get) (= uri \"/auth/identities\"))\n              (handle-identities storage request)\n\n              (and (= method :post) (= uri \"/auth/unlink\"))\n              (handle-unlink storage request)\n\n              (and (= method :post) (= uri \"/auth/totp\"))\n              (if (totp-limit (client-ip request))\n                (handle-totp storage origin request)\n                (json-resp 429 {:ok false :error \"rate_limited\"}))\n\n              (and (= method :post) (= uri \"/auth/totp/enroll\"))\n              (handle-totp-enroll storage request)\n\n              (and (= method :post) (= uri \"/auth/totp/confirm\"))\n              (if (totp-limit (client-ip request))\n                (handle-totp-confirm storage request)\n                (json-resp 429 {:ok false :error \"rate_limited\"}))\n\n              (and (= method :post) (= uri \"/auth/totp/disable\"))\n              (if (totp-limit (client-ip request))\n                (handle-totp-disable storage request)\n                (json-resp 429 {:ok false :error \"rate_limited\"}))\n\n              (and (= method :get) (= uri \"/auth/telegram/start\"))\n              (if telegram\n                (handle-telegram-start origin)\n                (json-resp 404 {:ok false :error \"telegram_disabled\"}))\n\n              (and (= method :get) (= uri \"/auth/telegram/callback\"))\n              (handle-telegram storage telegram origin request)\n\n              :else\n              (when-let [[_ pk action] (re-matches #\"/auth/(github|google)/(start|callback)\" uri)]\n                (when (= method :get)\n                  (case action\n                    \"start\" (handle-oauth-start oauth-providers origin pk)\n                    \"callback\" (handle-oauth-callback storage oauth-providers origin pk request)))))))))))","gi":174},{"say":"RFC 6238 in ~100 lines: base32, HOTP, a ±1-step skew window and a\n           constant-time compare, verified against the RFC's reference vectors.\n           The enrollment/confirm flow that uses it lives in accounts.core.","defn":"valid?","ns":"graphden.accounts.totp","n":5,"file":"src/graphden/accounts/totp.clj","lang":"clj","line":102,"code":"(defn valid?\n  \"True iff `code` matches the secret within ±1 step of `time-secs` (clock skew\n   tolerance). Constant-time compare.\"\n  [secret-base32 code time-secs]\n  (boolean\n    (when (and secret-base32 (not (str/blank? code)))\n      (some (fn [delta]\n              (crypto/constant-time-equal? (str code)\n                                           (code-at secret-base32 (+ (long time-secs) (* delta step-secs)))))\n            [-1 0 1]))))","gi":175}]}]}</script>
<script>
const MODEL = JSON.parse(document.getElementById('tour-data').textContent);
// flatten toured steps into a single ordered spine — index === step.gi
const SPINE = [];
MODEL.blocks.forEach(b => (b.steps||[]).forEach(s => SPINE.push({block:b, step:s})));

let cur = 0;            // current global step index into SPINE (or -1 = intro)
const hist = [];        // back-stack of previously-viewed indices

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// tiny markdown: paragraphs, `code`, **bold**, [text](url)
function md(src){
  return (src||'').split(/\n\s*\n/).map(p => {
    let h = esc(p);
    h = h.replace(/`([^`]+)`/g, (_,x)=>'<code class="inl">'+x+'</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, (_,x)=>'<b>'+x+'</b>');
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      (_,t,u)=>'<a href="'+esc(u)+'">'+esc(t)+'</a>');
    return '<p>'+h+'</p>';
  }).join('');
}

// minimal JS tokeniser — strings, comments, keywords. Line-scoped like the
// Clojure one: good enough to read, never claims to parse.
const JS_KW = new RegExp('\\b(async|await|break|case|catch|class|const|continue|'+
  'default|delete|do|else|export|extends|finally|for|function|if|import|in|'+
  'instanceof|let|new|of|return|super|switch|this|throw|try|typeof|var|void|'+
  'while|yield|null|undefined|true|false)\\b','g');

function hlJs(line){
  let out='', i=0;
  while(i<line.length){
    const c=line[i];
    if(c==='/'&&line[i+1]==='/'){ out+='<span class=tok-cmt>'+esc(line.slice(i))+'</span>'; break; }
    if(c==='*'&&/^\s*\*/.test(line)&&i===line.search(/\S/)){
      out+='<span class=tok-cmt>'+esc(line.slice(i))+'</span>'; break; }
    if(c==='"'||c==="'"||c==='`'){ let j=i+1;
      while(j<line.length){ if(line[j]==='\\'){j+=2;continue;} if(line[j]===c){j++;break;} j++; }
      out+='<span class=tok-str>'+esc(line.slice(i,j))+'</span>'; i=j; continue; }
    let j=i+1;
    while(j<line.length && line[j]!=='"' && line[j]!=="'" && line[j]!=='`'
          && !(line[j]==='/'&&line[j+1]==='/')) j++;
    out+=esc(line.slice(i,j)).replace(JS_KW,m=>'<span class=tok-kw>'+m+'</span>');
    i=j;
  }
  return out;
}

// minimal Clojure tokeniser -> highlighted HTML for one line
function hl(line){
  let out='', i=0;
  while(i<line.length){
    const c=line[i];
    if(c===';'){ out+='<span class=tok-cmt>'+esc(line.slice(i))+'</span>'; break; }
    if(c==='"'){ let j=i+1; while(j<line.length){ if(line[j]==='\\'){j+=2;continue;}
      if(line[j]==='"'){j++;break;} j++; }
      out+='<span class=tok-str>'+esc(line.slice(i,j))+'</span>'; i=j; continue; }
    if(c===':'){ let j=i+1; while(j<line.length && /[\w*+!?<>=./-]/.test(line[j])) j++;
      out+='<span class=tok-kw>'+esc(line.slice(i,j))+'</span>'; i=j; continue; }
    let j=i+1; while(j<line.length && line[j]!==';' && line[j]!=='"' && line[j]!==':') j++;
    out+=esc(line.slice(i,j)); i=j;
  }
  return out;
}

function codeBlock(step){
  const lines = step.code.split('\n');
  const paint = step.lang==='js' ? hlJs : hl;
  const rows = lines.map((ln,k)=>{
    const n = step.line + k;
    const head = k===0 ? ' head' : '';
    return '<div class="ln'+head+'"><span class=g>'+n+
      '</span><span class=c>'+paint(ln)+'</span></div>';
  }).join('');
  return '<div class=file>'+esc(step.file)+' — <b>'+esc(step.defn)+
    '</b></div><pre class=code>'+rows+'</pre>';
}

function seeBlock(step){
  if(!step.see||!step.see.length) return '';
  const chips = step.see.map(x=>
    '<a data-gi="'+x.gi+'">'+esc(x.label)+'</a>').join('');
  return '<div class=see><span class=lbl>see also</span>'+chips+'</div>';
}

function renderIntro(){
  cur=-1;
  document.getElementById('crumb').innerHTML='';
  document.getElementById('stage').innerHTML =
    '<div class=intro>'+md(MODEL.intro||'')+
    '<p style="margin-top:18px">Pick a step on the left, or press '+
    '<kbd>→</kbd> to start. <kbd>←</kbd>/<kbd>→</kbd> walk the spine; '+
    '<b>Back</b> returns along the path you actually took.</p></div>';
  paint();
}

function renderStub(b){
  document.getElementById('crumb').innerHTML='<b>'+esc(b.title)+'</b>';
  document.getElementById('stage').innerHTML =
    '<h2>'+esc(b.title)+'</h2><div class=say>'+md(b.summary||'')+'</div>'+
    '<div class=stub-note>Not toured yet — this block is a stub. '+
    'Code lives under:<div class=paths>'+
    (b.paths||[]).map(p=>'<code>'+esc(p)+'</code>').join('')+
    '</div><p style="margin:10px 0 0">Add steps to this block in '+
    '<code class=inl>docs/devtour/tour.edn</code>, then run '+
    '<code class=inl>bb devtour</code>.</p></div>';
  paint();
}

function go(gi, push){
  if(push && cur>=0) hist.push(cur);
  cur = gi;
  const {block, step} = SPINE[gi];
  document.getElementById('crumb').innerHTML =
    '<b>'+esc(block.title)+'</b> › step '+step.n+' / '+(block.steps||[]).length+
    ' — <code class=inl>'+esc(step.defn)+'</code>';
  document.getElementById('stage').innerHTML =
    '<div class=say>'+md(step.say)+'</div>'+seeBlock(step)+codeBlock(step);
  document.getElementById('stage').scrollTop=0;
  paint();
}

function paint(){
  document.querySelectorAll('.steps li').forEach(li=>{
    const on = +li.dataset.gi===cur;
    li.classList.toggle('on', on);
    // The spine is long enough that walking it with Next scrolls the current
    // step out of the map entirely — keep the highlight in view.
    if(on) li.scrollIntoView({block:'nearest'});
  });
  document.getElementById('pos').textContent =
    cur<0 ? '' : ('step '+(cur+1)+' / '+SPINE.length);
  document.getElementById('prev').disabled = cur<=0;
  document.getElementById('next').disabled = cur>=SPINE.length-1;
  document.getElementById('back').disabled = hist.length===0;
}

function buildMap(){
  const map=document.getElementById('map');
  MODEL.blocks.forEach(b=>{
    const wrap=document.createElement('div');
    wrap.className='blk '+(b.status==='toured'?'toured':'stub');
    let html='<div class=blk-h><span class=t>'+esc(b.title)+'</span>'+
      '<span class=s>'+esc(b.summary||'')+'</span></div>';
    if(b.after&&b.after.length)
      html+='<div class=after>after: '+b.after.map(esc).join(', ')+'</div>';
    if(b.status==='toured'){
      html+='<ul class=steps>'+ (b.steps||[]).map(s=>
        '<li data-gi="'+s.gi+'">'+esc(s.defn)+'</li>').join('') +'</ul>';
    }
    wrap.innerHTML=html;
    if(b.status!=='toured')
      wrap.querySelector('.blk-h').onclick=()=>renderStub(b);
    wrap.querySelectorAll('.steps li').forEach(li=>
      li.onclick=()=>go(+li.dataset.gi,true));
    map.appendChild(wrap);
  });
}

document.getElementById('next').onclick=()=>{ if(cur<SPINE.length-1) go(cur+1,true); };
document.getElementById('prev').onclick=()=>{ if(cur>0) go(cur-1,true); };
document.getElementById('back').onclick=()=>{ if(hist.length) go(hist.pop(),false); };
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight' && cur<SPINE.length-1) go(cur<0?0:cur+1,true);
  if(e.key==='ArrowLeft' && cur>0) go(cur-1,true);
});
document.getElementById('stage').addEventListener('click',e=>{
  const a=e.target.closest('a[data-gi]');
  if(a){ e.preventDefault(); go(+a.dataset.gi,true); }
});

buildMap();
renderIntro();
</script>
</body>
</html>

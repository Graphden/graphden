version: 2
updates:
  # GitHub Actions — security-relevant, low volume. Grouped, monthly.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Root npm deps, grouped, monthly. Clojure (deps.edn) -> `bb outdated`.
  # Docker base-image bumps and the dev-only tool dirs are intentionally
  # NOT tracked here (JDK pins are deliberate; those PRs were just noise).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

 surfaces every source version on\n         ;; target) and the conflict-resolution overrides (which beat that\n         ;; surfacing for entities the user resolved as `:target`) must land\n         ;; together. Committing the merge record but losing the resolutions\n         ;; would silently discard the user's decisions — the source value\n         ;; would surface where they chose to keep target. `PostgresStorage`\n         ;; exposes its `:pool` as the Connectable `sp/create-entity` runs on,\n         ;; so binding the storage to a `with-transaction` connection makes\n         ;; both writes share one commit. Non-PG storages (no `:pool`) fall\n         ;; back to the prior sequential behaviour. Single `merge-ts` so the\n         ;; resolution-wins ordering is structural, not clock-dependent.\n         merge-ts (now)\n         write!\n         (fn [storage]\n           ;; L5: serialize concurrent merges into the SAME target (and a\n           ;; racing delete of either endpoint) on per-branch advisory\n           ;; locks taken FIRST, inside this tx. Without them\n           ;; `detect-conflicts` reads a snapshot outside any write lock,\n           ;; so a second merge committing between this merge's read and\n           ;; its commit isn't observed. Locking both endpoints (sorted,\n           ;; deadlock-free) makes the read-then-write below one\n           ;; serialized critical section per branch pair.\n           (lock-branches! storage source-branch-id target-branch-id)\n           ;; Under the lock, re-confirm both endpoints still exist — a\n           ;; delete of source/target that committed just before we won\n           ;; the lock must abort this merge rather than plant a\n           ;; branch-merge dangling at a removed branch.\n           (when-not (sp/read-entity storage :branch source-branch-id)\n             (throw (ex-info \"Merge source branch not found\"\n                             {:type :not-found :branch-id source-branch-id})))\n           (when-not (sp/read-entity storage :branch target-branch-id)\n             (throw (ex-info \"Merge target branch not found\"\n                             {:type :not-found :branch-id target-branch-id})))\n           ;; Conflict detection now reads a lock-stable view (inside the\n           ;; tx, after the lock) instead of the pre-tx snapshot.\n           (let [{:keys [conflicts]} (detect-conflicts storage source-branch-id\n                                                       target-branch-id)]\n             (assert-resolutions-cover-conflicts! conflicts conflict-resolutions)\n             (let [merge-record (create-merge-record! storage source-branch-id\n                                                      target-branch-id merge-ts)]\n               (apply-resolutions! storage conflicts conflict-resolutions\n                                   target-branch-id merge-ts)\n               ;; POST-merge, still inside the tx: reject a merge that\n               ;; would leave two live entities sharing a per-branch\n               ;; unique key (fn name / list-item position) on the\n               ;; target — a collision detect-conflicts can't see\n               ;; (distinct ids). Throwing rolls the whole merge back.\n               (assert-merge-preserves-uniqueness! storage source-branch-id\n                                                   target-branch-id)\n               merge-record)))]\n     (if-let [pool (:pool base-storage)]\n       ;; `:ignore` so a nested `with-transaction` in an inner write\n       ;; can't commit early and release the advisory locks before the\n       ;; check-then-write finishes — same reason as the `.core` create\n       ;; path and `delete-branch!`.\n       (binding [jdbc-tx/*nested-tx* :ignore]\n         (jdbc/with-transaction [tx pool]\n                                (write! (assoc base-storage :pool tx))))\n       (write! base-storage)))))","gi":47},{"say":"The graph EPOCH — freshness as a comparison, not an\n           imperative. Every graph-shaped write bumps this sequence\n           BEFORE writing; the router's fetch-time check\n           (`validate-graph-epoch!`) heals any cached ctx whose eager\n           invalidation was skipped — a client abort mid-request, a\n           write path with no NOTIFY, a lost NOTIFY. The eager delta\n           machinery and NOTIFY remain pure latency optimizations,\n           which is what their docstrings always claimed.","defn":"bump!","ns":"graphden.storage.postgres.graph-epoch","n":17,"file":"src/graphden/storage/postgres/graph_epoch.clj","lang":"clj","line":97,"code":"(defn bump!\n  \"nextval BEFORE a graph-shaped write; remembers the value on the\n   handle. No-op (nil) for non-graph entities, pool-less handles, or a\n   missing sequence.\"\n  [storage entity-name]\n  (when (contains? graph-epoch-entities entity-name)\n    (when-let [pool (:pool storage)]\n      (try\n        ;; single-column row; take the value positionally — next.jdbc\n        ;; qualifies column keys by relation, so keyword access is\n        ;; brittle across the two query shapes here.\n        (let [v (some-> (util/exec-one!\n                          pool [(str \"SELECT nextval('\" sequence-name \"')\")] {})\n                        vals first)]\n          (when (and v (:graph-epoch-local storage))\n            (swap! (:graph-epoch-local storage)\n                   assoc v {:at (System/currentTimeMillis) :noted? false})\n            (when *request-bump-log*\n              (swap! *request-bump-log* conj v)))\n          v)\n        (catch Exception e (warn-once e) nil)))))","gi":48},{"say":"Builds a fresh live `ExecutionContext` whose storage is a\n           `VersionedStorage` rewrapped at the requested branch, with its own\n           compiled-registry and graph-cache atoms. This is how a branch gets\n           its own executor without re-sharding the graph.","defn":"build-branch-ctx","ns":"graphden.system.branch-router","n":18,"file":"src/graphden/system/branch_router.clj","lang":"clj","line":133,"code":"(defn- build-branch-ctx\n  \"Create a fresh ExecutionContext bound to `branch-id`. Each branch\n   gets its own atoms (compiled-registry / graph-cache / compile-deps)\n   so writes invalidate the right slice — `invalidate-graph-cache!`\n   takes a ctx and only touches that ctx's caches.\"\n  [base-ctx branch-id]\n  (let [base-storage (vs/unwrap (:storage base-ctx))\n        branch-storage (vs/->VersionedStorage base-storage branch-id)]\n    (cond-> (ctx/create-context {:storage branch-storage\n                                 :base-fns (:base-fns base-ctx)\n                                 :clock (:clock base-ctx)\n                                 :allowed-effects (:allowed-effects base-ctx)\n                                 ;; Inherit the executor's org shard — a branch\n                                 ;; ctx must compile the same slice of the graph\n                                 ;; as its base, or the pod would pull every\n                                 ;; tenant's fns back in through the side door.\n                                 :executor-orgs (:executor-orgs base-ctx)\n                                 ;; Inherit the pod role so per-branch requests\n                                 ;; apply the same hosted/BYO refusal.\n                                 :byo-executor? (:byo-executor? base-ctx)})\n      ;; Privileged structural-read storage for THIS branch (§4 Design B): the\n      ;; raw PG re-wrapped at branch-id, so `rebuild!` compiles every org's fns\n      ;; in this executor's shard (isolation stays on the org-scoped `:storage`\n      ;; above at runtime). Absent in single-tenant → compile reads fall back to\n      ;; :storage.\n      (:pg-storage base-ctx)\n      (assoc :pg-storage (:pg-storage base-ctx)\n             :compile-storage (vs/->VersionedStorage (:pg-storage base-ctx) branch-id))\n      ;; Inherit the cross-pod NOTIFY emitter. Without it a CRUD write\n      ;; served on a non-default branch tells sibling pods nothing —\n      ;; `crud.entities/notify-after-write!` reads it off the ctx, and\n      ;; only the base ctx used to carry it, so every branch edit was\n      ;; silently pod-local.\n      (:notify-emitter base-ctx) (assoc :notify-emitter (:notify-emitter base-ctx))\n      ;; Inherit the LISTEN side too — an event-driven SSE stream served\n      ;; on a branch registers its wake callback on the same listener.\n      (:notify-listener base-ctx) (assoc :notify-listener (:notify-listener base-ctx))\n      ;; Inherit the off-record auth seam so per-branch execution\n      ;; authenticates through the same provider as the base context.\n      (:auth-provider base-ctx) (assoc :auth-provider (:auth-provider base-ctx))\n      ;; Inherit the per-namespace execute guard (§4.2) — branch execution\n      ;; must enforce the same grants as the base context.\n      (:execute-guard base-ctx) (assoc :execute-guard (:execute-guard base-ctx))\n      ;; Inherit the self-serve DNS-verify seam (§3.4 #2) — the\n      ;; `:invoke-verify-domain` base-fn runs in the per-branch handler ctx.\n      (:verify-domain base-ctx) (assoc :verify-domain (:verify-domain base-ctx))\n      ;; Inherit the user-model seam — `:invoke-login` / `:invoke-create-user`\n      ;; run in the per-branch handler ctx.\n      (:user-ops base-ctx) (assoc :user-ops (:user-ops base-ctx))\n      ;; Inherit the self-serve API-token seam — the\n      ;; `:invoke-{mint,list,revoke}-my-token` base-fns run in the per-branch\n      ;; handler ctx.\n      (:my-tokens base-ctx) (assoc :my-tokens (:my-tokens base-ctx)))))","gi":49,"see":[{"gi":2,"label":"create-context"}]},{"say":"The top-level Ring dispatch: extract the branch ref (header or\n           query), resolve it to a branch-id, and route the request to that\n           branch's lazily-built handler (400 on an unknown branch). Where a\n           live request finally lands in the correct per-branch context. Its\n           public wrapper `dispatch` first short-circuits `/livez` — the one\n           registry-independent liveness path — so a pod busy on a full\n           recompile still answers its probe.","defn":"dispatch*","ns":"graphden.system.branch-router","n":19,"file":"src/graphden/system/branch_router.clj","lang":"clj","line":1188,"code":"(defn- dispatch*\n  [router request]\n  (let [base-ctx (:base-ctx router)\n        ;; Realize a streaming body up front, ONCE for every consumer below —\n        ;; the fleet seam, the FaaS app-router, the tenancy control-plane\n        ;; router AND the editor/API chain all see a String body. The app\n        ;; package's own `:realize-request-body` step stays (idempotent: a\n        ;; String passes through), but it only covered the app chain — a\n        ;; form-POST to a tenancy route (signup / login / org provisioning)\n        ;; reached `parse-form-body` as an unread InputStream and silently\n        ;; parsed to `{}` (live cloud hit this: `POST /api/orgs name=…`\n        ;; created an org named \"\").\n        request (let [b (:body request)]\n                  (if (instance? java.io.InputStream b)\n                    (assoc request :body (slurp (java.io.InputStreamReader. b \"UTF-8\")))\n                    request))\n        ;; Fleet control-plane seam (docs/FLEET_RFC.md §6.3): the internal\n        ;; cell load/evict command (`POST /internal/fleet/cell/...`). Checked\n        ;; FIRST — it's infra, org-agnostic, internal-token-gated, and never a\n        ;; tenant path. Returns a response for a matching command, nil for\n        ;; anything else (→ falls through). Absent unless this pod is a fleet\n        ;; member (`GRAPHDEN_EXECUTOR_ID` set).\n        fleet-command (:fleet-command base-ctx)\n        fleet-resp (when fleet-command (fleet-command base-ctx request))\n        ;; App-router seam (§3.4 FaaS): a request to a TENANT's subdomain is\n        ;; the tenant's APP — served by that org's handler fn (org-scoped +\n        ;; effect-gated), NOT the editor/API. The app-router returns a\n        ;; response for such requests, or nil for an apex/platform request,\n        ;; which then falls through to the editor/API flow below. Absent\n        ;; (core / single-tenant) → straight to editor/API.\n        app-router (:app-router base-ctx)\n        app-resp (or fleet-resp\n                     (when app-router (app-router base-ctx request)))]\n    (or app-resp\n        ;; Branch resolution runs INSIDE the request-scope (§4): `:branch` is\n        ;; org-scoped, so `*current-org*` must be bound when resolve-branch-id\n        ;; reads it — otherwise a tenant's own branch is invisible at resolution\n        ;; (→ a spurious 400) and the org cache key would be wrong. So the whole\n        ;; resolve → handler chain is the request-scope's thunk. The branch ctx\n        ;; itself stays org-agnostic (Design B) — keyed by branch-id alone.\n        (let [request-scope (:request-scope base-ctx)\n              run (fn []\n                    ;; Route-collection seam (docs/TENANCY_SEAM.md\n                    ;; § Route-collection seam): consult\n                    ;; every installed fall-through router FIRST, INSIDE the\n                    ;; request-scope so `*current-org*` is bound — the tenancy\n                    ;; org-admin panels (grants/users/…) AND the optional\n                    ;; registry (`/api/packages/installed` reads org/branch-\n                    ;; scoped pins) need the same org binding branch resolution\n                    ;; does. A matched path returns a response; no match (or an\n                    ;; empty collection → no optional package installed) falls\n                    ;; through to the branch-resolution chain. Branch-agnostic\n                    ;; by design: the branch ref is irrelevant to these paths.\n                    (or (rc/dispatch-first request)\n                        (let [branch-ref (extract-branch-ref request)\n                              branch-id (resolve-branch-id router branch-ref)]\n                          (cond\n                            (or (nil? branch-ref) (some? branch-id))\n                            ((handler-for router branch-id) request)\n\n                            ;; A PAGE load naming a branch that is gone (merged\n                            ;; and deleted elsewhere, or by this user's own tour\n                            ;; cleanup in another tab) used to answer 400 — and\n                            ;; since the 400 replaced the HTML, the editor never\n                            ;; booted: no scripts, no explanation, nothing to\n                            ;; click. Send the navigation to the same URL without\n                            ;; the stale `?branch=` instead; the editor loads on\n                            ;; the default branch and the user is back in\n                            ;; business. API/XHR callers still get the 400 below,\n                            ;; which is what they can act on.\n                            (document-navigation? request)\n                            {:status 302\n                             :headers {\"Location\" (uri-without-branch request)\n                                       \"Cache-Control\" \"no-store\"}\n                             :body \"\"}\n\n                            :else\n                            {:status 400\n                             :headers {\"Content-Type\" \"application/json\"}\n                             ;; JSON-encode — `branch-ref` is user-controlled\n                             ;; (X-Graphden-Branch header / ?branch=), so a raw\n                             ;; string-concat let a `\"` inject arbitrary keys\n                             ;; into the response envelope.\n                             :body (json/generate-string\n                                     {:ok false\n                                      :error (str \"Unknown branch: \" branch-ref)})}))))]\n          (if request-scope\n            (request-scope base-ctx request run)\n            (run))))))","gi":50}]},{"id":":types","title":"Type system","status":"toured","summary":"Subtyping, unification, narrowing, refinements, the sweep-at-zero\n             checker, and the :secret information-flow marker.","paths":["src/graphden/types/"],"after":[":executor"],"steps":[{"say":"Start with the leaf vocabulary. This is the flat enum of primitive\n           value-kinds plus the special `:any` (top) and `:never` (bottom). Every\n           type in the system is built from these, so nothing structural makes\n           sense until you have them.","defn":"primitives","ns":"graphden.types.core.shapes","n":1,"file":"src/graphden/types/core/shapes.clj","lang":"clj","line":23,"code":"(def primitives\n  \"The flat enum of value-kind primitives. A superset of\n   `value-kind-values` in schema/graph/schema.clj — every storage\n   value-kind is a primitive here, but a few primitives are\n   type-system-only and never reach the `value_kind` column\n   (`:float`, `:keyword`, `:never`, `:input-stream`, `:decimal`).\n   `:fn` is included as a primitive for backwards compat with\n   declarations that use the bare keyword instead of a structural\n   `[:fn …]`; structurally, it acts like `[:fn {} :any]` (any\n   callable).\n\n   `:never` is the BOTTOM type — the dual of `:any` (top). It is a\n   subtype of every type and the type of a computation that never\n   produces a value (`:throw`). In a union it is absorbed\n   (`[:union :never T]` = `T`), so `(:if c (:throw …) x)` is typed\n   exactly `x`. `:float` and `:keyword` are type-system-only —\n   emitted by `classify-literal` for float / keyword literals — and\n   never reach the storage `value_kind` column.\n\n   `:input-stream` is the type of a transient `java.io.InputStream`\n   (Ring request bodies, file streams) — values are never stored as\n   data, so it's type-system-only too. `type->storage-kind` degrades\n   it to `:any`.\n\n   `:decimal` is arbitrary-precision rational (Clojure's `BigDecimal`\n   / Java `java.math.BigDecimal`). Subtype of `:numeric` alongside\n   `:int` and `:float`.\"\n  #{:null :uuid :text :int :bool :numeric :timestamptz :jsonb :bytes\n    :any :fn :float :keyword :sequence :never :input-stream :decimal})","gi":51},{"say":"The type grammar in one function: every compound arm — record maps,\n           `[:list]`, `[:map]`, `[:tuple]`, `[:refine]`, `[:secret]`, `[:union]`,\n           `[:fn]` — and how each recurses. This doubles as the map of how\n           records / unions / variants / fn-types are represented.","defn":"child-types","ns":"graphden.types.core.shapes","n":2,"file":"src/graphden/types/core/shapes.clj","lang":"clj","line":405,"code":"(defn child-types\n  \"The immediate constituent types of a compound type — the arms every\n   structural fold must recurse through. Primitives / type-vars / any\n   non-compound have none. THE single enumeration of a type's sub-types:\n   `type-any?` (and any future structural fold) rides on it, so a new\n   type-kind is covered everywhere by adding ONE arm here rather than in\n   each hand-written recursion.\"\n  [t]\n  (cond\n    (fn-type? t)     (conj (vec (vals (fn-args t))) (fn-ret t))\n    (list-type? t)   [(list-elem t)]\n    (map-type? t)    [(map-key t) (map-val t)]\n    (tuple-type? t)  (vec (tuple-elems t))\n    (refine-type? t) [(refine-base t)]\n    (marker-type? t) [(marker-inner t)]\n    (union-type? t)  (vec (union-members t))\n    (record-type? t) (vec (vals t))\n    :else            []))","gi":52},{"say":"The syntactic validity guard at the boundary between user input\n           (fns.edn / the API) and the rest of the module. Reading it cements the\n           exact shape of each type kind: fn args-map, effects set, refine base,\n           secret inner.","defn":"well-formed?","ns":"graphden.types.core","n":3,"file":"src/graphden/types/core.clj","lang":"clj","line":153,"code":"(defn well-formed?\n  \"True iff `t` is a syntactically valid type. Use this as a guard at\n   the boundary between user input (fns.edn parsing, API form data)\n   and the rest of the type module.\n\n   A non-primitive keyword is well-formed iff it names a registered\n   alias — this lets compound types reference other named types\n   (`[:fn {:request :ring-request} :ring-response]`) without first\n   substituting them, as long as the inner names are known.\"\n  [t]\n  (cond\n    ;; Classifier sentinels are valid types alongside primitives and\n    ;; vars: `:empty-map` (the `{}` literal) survives into canonical\n    ;; `make-union` outputs (`[:union :empty-map <record>]` branch\n    ;; returns); `:never` is the bottom type. Neither is in\n    ;; `primitives` nor an alias.\n    (or (primitive? t) (type-var? t)\n        (contains? #{:empty-map :never} t)) true\n    (keyword? t)     (boolean (get (aliases-snapshot) t))\n    (record-type? t) (every? well-formed? (vals t))\n    (fn-type? t)     (and (map? (fn-args t))\n                          (every? keyword? (keys (fn-args t)))\n                          (every? well-formed? (vals (fn-args t)))\n                          (well-formed? (fn-ret t))\n                          (let [eff (fn-effects t)]\n                            (or (nil? eff)\n                                (= eff :any)\n                                (and (set? eff)\n                                     (every? keyword? eff)))))\n    (list-type? t)   (well-formed? (list-elem t))\n    (map-type? t)    (and (well-formed? (map-key t)) (well-formed? (map-val t)))\n    (tuple-type? t)  (every? well-formed? (tuple-elems t))\n    (refine-type? t) (well-formed? (refine-base t))\n    (marker-type? t) (well-formed? (marker-inner t))\n    (union-type? t)  (every? well-formed? (union-members t))\n    :else            false))","gi":53},{"say":"The smart constructor for `[:union …]`: flatten, dedupe, absorb\n           `:never`, and drop any member subsumed by another. This canonical\n           union shape is what the rest of the system relies on — and your\n           introduction to sum types.","defn":"make-union","ns":"graphden.types.core","n":4,"file":"src/graphden/types/core.clj","lang":"clj","line":230,"code":"(defn make-union\n  \"Smart constructor for `[:union …]`. Flattens nested unions, drops\n   duplicates, and collapses singletons (a 1-member union IS that\n   member). Result: either a non-union type or a `[:union T1 T2 …]`\n   with ≥2 distinct flattened members.\n\n   Use this instead of building `[:union …]` literals directly so\n   the rest of the system can rely on the canonical shape.\"\n  [members]\n  (let [flat (mapcat (fn [m] (if (union-type? m) (union-members m) [m]))\n                     members)\n        ;; `:never` (bottom) drops out of a union — `[:union :never T]`\n        ;; = `T` — dual to `:any` (top) absorbing. A union of nothing\n        ;; but `:never` members collapses back to `:never`.\n        non-never (remove #{:never} flat)\n        flat (if (seq non-never) non-never flat)\n        ;; NOTE on `:empty-map`: no special case needed — the generic\n        ;; subtype-absorption pass below drops it next to any sibling\n        ;; it subtypes (`:jsonb` / `[:map K V]`) and keeps it next to\n        ;; records (`:empty-map ⊄ record` — required fields). The\n        ;; typevar guard in that pass skips SYMBOLS only; keywords\n        ;; like the sentinel are evaluated normally.\n        ;; Stable order to keep the canonical form deterministic for\n        ;; equality. `pr-str` sorts heterogeneous keywords/vectors\n        ;; without confusing comparators.\n        unique (vec (sort-by pr-str (distinct flat)))\n        ;; Subtype absorption: `T ⊆ S` ⟹ T is redundant in\n        ;; `[:union T S]` because every value of T is already a\n        ;; value of S. Drop any non-typevar member that's a STRICT\n        ;; subtype of some other non-typevar sibling. Type-vars\n        ;; are KEPT (they're polymorphic — `'a` may bind to\n        ;; anything, so we can't reason about subtype here) but\n        ;; can't absorb others either. Without this the checker\n        ;; surfaces redundant unions like\n        ;; `[:union :int :positive-int]` (where `:positive-int ⊆\n        ;; :int` makes the wider `:int` cover everything) — UI\n        ;; chips and `:if`/`:cond` rule outputs end up noisier than\n        ;; the semantics warrants.\n        absorbed (vec\n                   (keep-indexed\n                     (fn [i m]\n                       (if (type-var? m)\n                         m\n                         (when-not (some (fn [[j other]]\n                                           (and (not= i j)\n                                                (not (type-var? other))\n                                                (not= m other)\n                                                (subtype? m other)\n                                                ;; If two members are\n                                                ;; mutually-subtype\n                                                ;; (alias equality\n                                                ;; through normalise),\n                                                ;; keep the lower-\n                                                ;; indexed one.\n                                                (or (not (subtype? other m))\n                                                    (< j i))))\n                                         (map-indexed vector unique))\n                           m)))\n                     unique))\n        unique (if (seq absorbed) absorbed unique)]\n    (cond\n      ;; Union of NO members is the bottom type — nothing inhabits it.\n      ;; Without this arm, `(make-union [])` produced the malformed\n      ;; literal `[:union]` (not union-type?, rejected by well-formed?),\n      ;; reachable from `check-sequence-items` on an EMPTY literal\n      ;; vector bound to a `[:list a]` slot — the malformed type then\n      ;; bound into the substitution and leaked into recorded registry\n      ;; types. `:never` is the principled answer (dual of the\n      ;; `:never`-absorption above) and downstream `[:list :never]`\n      ;; subtypes any `[:list T]` covariantly.\n      (empty? unique) :never\n      (= 1 (count unique)) (first unique)\n      (some #{:any} unique) :any        ; :any absorbs everything\n      :else (into [:union] unique))))","gi":54},{"say":"Rewrites `[:variant tag T …]` into a structural union of tag-pinned\n           records. Shows how the higher-level variant sugar reduces to the union\n           + refinement machinery you just met — no new runtime concept needed.","defn":"desugar-variant","ns":"graphden.types.core","n":5,"file":"src/graphden/types/core.clj","lang":"clj","line":329,"code":"(defn desugar-variant\n  \"Desugar `[:variant tag1 T1 tag2 T2 …]` to its structural union form\n   per docs/TYPES.md § Tagged Variants:\n\n     [:union {:tag [:refine :keyword [:= :tag1]] :value T1}\n             {:tag [:refine :keyword [:= :tag2]] :value T2}\n             …]\n\n   Each branch is a record pinned by an equality refinement on the\n   `:tag` slot, making the variant discriminable at runtime via\n   `(:variant-is? v :tag …)`. Accepts the alternate input shape\n   `[tag1 T1 tag2 T2 …]` (without the leading `:variant` marker) so\n   callers don't have to strip it.\n\n   Returns nil if the payload is malformed (odd count, non-keyword\n   tags, empty list) so the caller can surface it as an alias-body\n   well-formedness failure.\"\n  [t]\n  (let [pairs-raw (cond\n                    (and (vector? t) (= :variant (first t))) (vec (rest t))\n                    (sequential? t)                          (vec t)\n                    :else                                    nil)]\n    (when (and pairs-raw\n               (seq pairs-raw)\n               (even? (count pairs-raw))\n               (every? keyword? (take-nth 2 pairs-raw)))\n      (let [pairs (partition 2 pairs-raw)\n            branches (mapv (fn [[tag-kw branch-t]]\n                             {:tag [:refine :keyword [:= tag-kw]]\n                              :value branch-t})\n                           pairs)]\n        (make-union branches)))))","gi":55},{"say":"The heart of assignability: reflexive / transitive subtyping across\n           primitives, `:jsonb` sinks, records, lists, maps, tuples, refinements,\n           unions, secrets, and fn-types. Every checker decision — is `actual`\n           a subtype of `expected`? — bottoms out here.","defn":"subtype?","ns":"graphden.types.core","n":6,"file":"src/graphden/types/core.clj","lang":"clj","line":1221,"code":"(defn subtype?\n  \"Is `sub` a subtype of `sup`? Reflexive and transitive; a PREORDER,\n   not a partial order — antisymmetry holds only up to semantic\n   equivalence (e.g. `[:refine B [:and c]]` and `[:refine B c]` are\n   mutual subtypes while structurally distinct), so don't rely on\n   `subtype?`-both-ways implying structural equality. Type variables\n   compare by identity for now — unification handles the substitution\n   case before subtype check is meaningful.\n\n   Refinement rules (Phase 4):\n   - `[:refine B c] ⊆ B`            (refinement is a subtype of base)\n   - `B ⊄ [:refine B c]`             (no implicit narrowing — caller\n                                       must insert `:validate-refinement`)\n   - `[:refine B c1] ⊆ [:refine B c2]` iff `constraint-implies? c1 c2`\n     — real implication reasoning over the numeric-comparison /\n     `:in` / `:matches` atoms and `:and`/`:or` combinators (so\n     `:positive-int ⊆ :non-negative-int`, `:user-port ⊆ :port`).\n     Unknown constraint shapes fall back to structural equality;\n     full SMT-style logic stays out of scope per TYPES.md.\n\n   Union rules:\n   - `[:union T1 T2 …] ⊆ S` iff every Tᵢ ⊆ S          (disjunction)\n   - `T ⊆ [:union T1 T2 …]` iff T ⊆ Tᵢ for some i      (membership)\n\n   Known deliberate hole: `:any` is the top type, so a marker-carrying\n   type may first widen into an `:any`-shaped context\n   (`[:list [:secret :text]] ⊆ [:list :any]`) and from there reach\n   sinks the direct marker guards refuse — label tracking ends where\n   `:any` begins. See SECRETS.md § Limitations.\"\n  [sub sup]\n  (check-type-compare-depth! \"subtype?\" sub sup)\n  (binding [*type-compare-depth* (inc (long *type-compare-depth*))]\n    (let [sub (normalise sub)\n          sup (normalise sup)]\n      (cond\n        (or (= sub sup) (= sup :any))            true\n        (= sub :any)                             false\n\n        ;; Universal yes-arms:\n        ;; - `typevar SUB ⊆ :jsonb` — at any binding site the var\n        ;;   resolves to SOME type, and most concrete types subtype\n        ;;   `:jsonb`. Without it, every fn-ref whose computed return\n        ;;   is polymorphic (`[:union 'a <record>]` etc.) rejects\n        ;;   against a `:jsonb`-typed slot.\n        ;; - `:never ⊆ T` — `:never` is the bottom type, a subtype of\n        ;;   every type; nothing but itself is a subtype of it.\n        (or (and (type-var? sub) (= sup :jsonb))\n            (= sub :never))                      true\n        (= sup :never)                           false\n\n        ;; `:empty-map` — sentinel from `classify-literal` for `{}`.\n        ;; Vacuous-truth subtype of every HOMOGENEOUS map-shaped target\n        ;; (`:jsonb` / `[:map K V]`): it carries no entries to violate\n        ;; a per-entry constraint. Without it an `:_storage-where-map`-\n        ;; typed slot bound to `{:value {}}` fails the\n        ;; `:jsonb ⊄ [:map :keyword :any]` rule below.\n        ;;\n        ;; NOT a subtype of a record type: a record's fields are\n        ;; REQUIRED (record-subtype? demands every sup field present),\n        ;; and `{}` has none — `{} ⊆ {:name :text}` would promise a\n        ;; `:text` at `(:name {})` = nil. The vacuous truth only holds\n        ;; where there is no required structure.\n        ;;\n        ;; Unions: an `:empty-map` is a subtype of `[:union :null [:map K V]]`\n        ;; because it's a subtype of the map-shape member. Descend so the\n        ;; nullable-map shapes (common boundary type for read-or-nil sites\n        ;; like `:resolve-branch-ref`) accept empty-map literals too.\n        ;; Marker sups descend into the inner type (auto-promote on\n        ;; entry, same as the general marker rule below) so e.g.\n        ;; `:empty-map ⊆ [:secret :jsonb]` — restores transitivity\n        ;; through `record ⊆ [:secret :jsonb]` chains.\n        (= sub :empty-map)\n        (boolean (or (= sup :empty-map) (= sup :jsonb)\n                     (map-type? sup)\n                     (and (marker-type? sup)\n                          (subtype? :empty-map (marker-inner sup)))\n                     (and (union-type? sup)\n                          (some #(subtype? :empty-map %) (union-members sup)))))\n        (= sup :empty-map)                       false\n\n        ;; Union LHS: every member must subtype.\n        (union-type? sub)\n        (every? #(subtype? % sup) (union-members sub))\n\n        ;; Union RHS: at least one member accepts.\n        (union-type? sup)\n        (boolean (some #(subtype? sub %) (union-members sup)))\n\n        (or (and (primitive? sub) (primitive? sup)\n                 (primitive-subtype? sub sup))\n            (and (= sup :jsonb)\n                 ;; A compound carrying ANY nested marker must NOT flow\n                 ;; into a jsonb content sink — that would strip the\n                 ;; information-flow label. The top-level `[<tag> T]`\n                 ;; case is already refused by the marker arm below; this\n                 ;; makes the type core self-defend against the nested\n                 ;; case (a record/list/tuple field) instead of relying on\n                 ;; every propagator keeping markers top-level-typed.\n                 (not (contains-marker? sub))\n                 (or (primitive? sub)\n                     (record-type? sub)\n                     (list-type? sub)\n                     (map-type? sub)\n                     (tuple-type? sub)\n                     (refine-type? sub)))) true\n        (= sub :jsonb)                           false\n\n        ;; Refinement: SUB carries a refinement, SUP is its base or any —\n        ;; pass; SUP carries a refinement → constraint inclusion.\n        ;;\n        ;; Constraint inclusion (`constraint-implies?`) covers the\n        ;; common numeric-comparison shapes plus `:and` / `:or`\n        ;; combinators, so e.g. `:positive-int ⊆ :non-negative-int`\n        ;; (`[:> 0] ⊆ [:>= 0]`) and `:user-port ⊆ :port` (one nested\n        ;; `:and` inside another) hold. Falls back to structural\n        ;; equality for shapes outside the supported set, preserving\n        ;; the prior behaviour for refinements with custom constraints.\n        (refine-type? sub)\n        (cond\n          (refine-type? sup)\n          (and (constraint-implies? (refine-constraint sub)\n                                    (refine-constraint sup))\n               (subtype? (refine-base sub) (refine-base sup)))\n          :else\n          (subtype? (refine-base sub) sup))\n\n        (refine-type? sup)\n        ;; SUB is not a refinement, SUP is — must NOT widen.\n        false\n\n        ;; Markers: registry-driven information-flow labels — asymmetric\n        ;; subtyping, generic over every registered tag (`:secret` is the\n        ;; seeded instance; SECRETS.md):\n        ;;\n        ;; `[<m> T] ⊆ [<m> T']`  iff `T ⊆ T'` (covariant inside, SAME tag —\n        ;;                                     `[:pii T] ⊄ [:secret T']`)\n        ;; `[<m> T] ⊆ T'`        NEVER        (can't STRIP the label)\n        ;; `T ⊆ [<m> T']`        iff `T ⊆ T'` (auto-PROMOTE on entry —\n        ;;                                     monotone direction; plain\n        ;;                                     values become labelled when\n        ;;                                     they flow into marked slots)\n        ;;\n        ;; Same shape rationale as `refine` above — the marker is opaque\n        ;; to the base type, but unlike `refine` the asymmetry is on\n        ;; LEAVING the marker: refine narrows (sub ⊆ base; strip allowed),\n        ;; a marker labels (sub ⊄ base; strip forbidden). That's why we\n        ;; don't reuse `refine` — the subtype direction is the whole point\n        ;; of the abstraction.\n        (marker-type? sub)\n        (cond\n          (and (marker-type? sup)\n               (= (marker-tag sub) (marker-tag sup)))\n          (subtype? (marker-inner sub) (marker-inner sup))\n          ;; nested-label case: `[:pii [:secret T]] ⊆ [:secret T']` —\n          ;; peeling the OUTER pii label to satisfy a secret slot would\n          ;; strip it; refuse (the caller wraps the slot type instead).\n          :else false)\n\n        (marker-type? sup)\n        ;; Promotion: a plain value into a marked slot is fine; the value\n        ;; gets labelled on entry. This is what lets ordinary string fns\n        ;; declare `[:secret :text]` slots and still accept both kinds of\n        ;; input.\n        (subtype? sub (marker-inner sup))\n\n        (and (record-type? sub) (record-type? sup))\n        (record-subtype? sub sup)\n        (and (list-type? sub) (list-type? sup))  (list-subtype? sub sup)\n        (and (map-type? sub) (map-type? sup))    (map-subtype? sub sup)\n        (and (tuple-type? sub) (tuple-type? sup)) (tuple-subtype? sub sup)\n        ;; A fixed-length tuple IS a list at runtime (both are\n        ;; `:sequence`-shaped on the wire) — `[:tuple :int :int]` is a\n        ;; valid `[:list :int]` value when every position fits the\n        ;; element type. Typevar on the sup elem accepts (passive\n        ;; recursion context, same rationale as `list-subtype?`). The\n        ;; reverse direction stays false: a list has no length\n        ;; guarantee to offer a tuple.\n        (and (tuple-type? sub) (list-type? sup))\n        (or (type-var? (list-elem sup))\n            (every? #(subtype? % (list-elem sup)) (tuple-elems sub)))\n        ;; A concrete keyword-keyed record IS a valid homogeneous-map\n        ;; value when the map's key type admits keywords and every field\n        ;; value fits the map's value type — lets a literal map (which\n        ;; classifies as a record) bind into a `[:map …]`-typed slot.\n        ;;\n        ;; Typevar slots in `(map-key sup)` / `(map-val sup)` accept\n        ;; unconditionally: a fresh typevar at a parametric slot like\n        ;; `:merge`'s `:maps [:list [:map a :any]]` represents\n        ;; \"anything the call-site picks for `a`\"; the record's\n        ;; concrete `:keyword` key (or each concrete field type) is a\n        ;; satisfying assignment. Without this, every record-bound-to-\n        ;; HOF-typed-map-slot site rejected during the sweep — e.g.\n        ;; `_value-form-root-attrs`'s `{:data-binding-id :text}`\n        ;; against `:merge :maps` declared `[:list [:map a :any]]`.\n        (and (record-type? sub) (map-type? sup))\n        (let [k-ok? (or (type-var? (map-key sup))\n                        (subtype? :keyword (map-key sup)))\n              v-ok? (or (type-var? (map-val sup))\n                        (every? #(subtype? % (map-val sup)) (vals sub)))]\n          (and k-ok? v-ok?))\n        (and (fn-type? sub) (fn-type? sup))      (fn-subtype? sub sup)\n        :else                                    false))))","gi":56},{"say":"Decides when one refinement constraint entails another (numeric\n           bounds, `:in` / `:=` / `:not=`, `:and` / `:or`). This is exactly how\n           `subtype?` compares refinement types like `:positive-int` ⊆\n           `:non-negative-int`, so read it right after.","defn":"constraint-implies?","ns":"graphden.types.core","n":7,"file":"src/graphden/types/core.clj","lang":"clj","line":1157,"code":"(defn constraint-implies?\n  \"True iff every value satisfying refinement constraint `a` also\n   satisfies `b`. Drives subtype reasoning across refinement types\n   (`:positive-int ⊆ :non-negative-int`, `:user-port ⊆ :port`,\n   `:probability ⊆ :percent`).\n\n   Recurses through `[:and …]` (intersection — narrower than any\n   branch) and `[:or …]` (union — wider than every branch). Falls\n   back to structural equality for unknown shapes so legacy\n   refinements with custom constraints behave as before.\"\n  [a b]\n  (cond\n    ;; Trivial identity / open universal.\n    (or (= a b) (= b [:any])) true\n    (or (nil? a) (nil? b))    false\n\n    ;; AND on RHS: a must imply EVERY component of b.\n    (and (vector? b) (= :and (first b)))\n    (every? #(constraint-implies? a %) (rest b))\n\n    ;; OR on LHS: every branch of a must imply b (worst-case widens\n    ;; LHS to its widest member).\n    (and (vector? a) (= :or (first a)))\n    (every? #(constraint-implies? % b) (rest a))\n\n    ;; AND on LHS: any single component implying b is enough — the\n    ;; intersection is at least as narrow as that component.\n    (and (vector? a) (= :and (first a)))\n    (boolean (some #(constraint-implies? % b) (rest a)))\n\n    ;; OR on RHS: a must imply at least one branch.\n    (and (vector? b) (= :or (first b)))\n    (boolean (some #(constraint-implies? a %) (rest b)))\n\n    :else\n    (or (atom-implies? a b)\n        ;; Unknown leaf shape — fall back to structural equality.\n        false)))","gi":57,"see":[{"gi":56,"label":"subtype?"}]},{"say":"Robinson unification with occurs-check and subtype-aware leniency,\n           plus a union fallback. This is how polymorphic type variables get\n           bound during checking — the two-way complement to the one-way\n           `subtype?` test.","defn":"unify","ns":"graphden.types.core","n":8,"file":"src/graphden/types/core.clj","lang":"clj","line":1649,"code":"(defn unify\n  \"Unify two types. Returns an updated substitution, or `::fail` if\n   they cannot be made equal. Substitution is a `{type-var type}` map.\n   3-arg form takes a starting substitution; 2-arg form starts empty.\n\n   Subtype-aware leniency: when EITHER side resolves to `:any`, the\n   unification succeeds without further constraint. Pure HM unify\n   would reject `:any` ↔ `:int` even though `:int ⊆ :any` makes them\n   compatible in the subtyping sense; rejecting would force every\n   polymorphic slot to pick one concrete type and stick to it across\n   all uses, which is too strict when the user has deliberately\n   declared a slot as `:any` (the doc's escape hatch).\"\n  ([t1 t2] (unify t1 t2 {}))\n  ([t1 t2 subst]\n   (check-type-compare-depth! \"unify\" t1 t2)\n   (binding [*type-compare-depth* (inc (long *type-compare-depth*))]\n     (let [a (normalise (resolve subst t1))\n           b (normalise (resolve subst t2))]\n       (cond\n         ;; Equality OR universal `:any` accept on the OTHER side when\n         ;; neither is a type-var. With a type-var on the other side we\n         ;; deliberately fall through to the typevar arms below so the\n         ;; var BINDS to `:any` rather than silently passing without a\n         ;; binding. Without the binding the var leaks downstream\n         ;; (e.g. `:try`'s declared `[:union a b]` retains free `a`/`b`\n         ;; when the body returns the type-checker's `:any` fallback,\n         ;; which then fails every consumer expecting a concrete\n         ;; member shape).\n         (or (= a b)\n             (and (or (= a :any) (= b :any))\n                  (not (or (type-var? a) (type-var? b))))) subst\n         ;; A type variable binds to whatever the other side is — a\n         ;; primitive, a union, a fn-type, anything (subject to the\n         ;; occurs-check in `bind-var`). This MUST precede the union\n         ;; branch below: `unify('a, [:union …])` would otherwise be\n         ;; captured by the union case, which only runs a subtype probe\n         ;; — and a free type-var is a subtype of nothing — so it would\n         ;; fail instead of binding the var to the union.\n         (type-var? a)        (bind-var a b subst)\n         (type-var? b)        (bind-var b a subst)\n         ;; `:never` (bottom) unifies with anything — it is a subtype of\n         ;; every type, so a divergent `:throw` branch fits any context.\n         ;; Placed AFTER the type-var arms so a var still BINDS to\n         ;; `:never` (letting `make-union` later absorb it) rather than\n         ;; merely succeeding without a binding.\n         (or (= a :never) (= b :never)) subst\n         ;; Unions: HM unifier doesn't naturally pick a branch (multiple\n         ;; valid choices), so `try-unify-unions` runs the documented\n         ;; fallback chain (subtype-direction success, common-member\n         ;; strip, single-typevar arm-pick, single-typevar absorption).\n         ;; Reduces this `cond` arm to the dispatch only — the chain\n         ;; itself reads as a small list of helpers.\n         (or (union-type? a) (union-type? b))\n         (try-unify-unions a b subst)\n         ;; Subtype-aware unification — succeeds without further binding\n         ;; when one of the relations holds:\n         ;;\n         ;; - Primitive subtype within the numeric hierarchy\n         ;;   (`:int ↔ :numeric` is fine because `:int ⊆ :numeric`).\n         ;; - Records / lists / refinements ↔ `:jsonb`. They ARE\n         ;;   jsonb-shaped on the wire (matches the subtype rule\n         ;;   `record ⊆ :jsonb`). A slot whose declared type narrowed\n         ;;   from a type-var to `:jsonb` (because earlier in the chain\n         ;;   it bound to a jsonb-typed value) needs to unify against\n         ;;   a more-precisely-typed record at a later call site.\n         ;;\n         ;; The pinned type-var keeps its first binding; subsequent\n         ;; compatible refinements flow through unchanged.\n         (or (and (primitive? a) (primitive? b)\n                  (or (primitive-subtype? a b) (primitive-subtype? b a)))\n             ;; Marker guard mirrors `subtype?`'s jsonb arm: a compound\n             ;; carrying a nested information-flow label must not be\n             ;; declared jsonb-compatible here either. Without it,\n             ;; `unify(:jsonb, [:list [:secret :text]])` succeeded\n             ;; where `subtype?` deliberately refuses both directions —\n             ;; drift between the two relations.\n             (and (= a :jsonb)\n                  (not (contains-marker? b))\n                  (or (record-type? b) (list-type? b) (map-type? b)\n                      (tuple-type? b) (refine-type? b)))\n             (and (= b :jsonb)\n                  (not (contains-marker? a))\n                  (or (record-type? a) (list-type? a) (map-type? a)\n                      (tuple-type? a) (refine-type? a)))\n             ;; Refinement ↔ (primitive OR refinement) — defer to\n             ;; `subtype?`, which already understands\n             ;; `[:refine B c] ⊆ B` and constraint-implies between\n             ;; refinement constraints. Without this, unifying a\n             ;; record field declared `:int` against a record field\n             ;; computed as `:non-negative-int` (or vice-versa) falls\n             ;; into the `::fail` arm, even though the relation holds.\n             (and (or (refine-type? a) (refine-type? b))\n                  (or (subtype? a b) (subtype? b a)))\n             ;; `:empty-map` is the bottom of HOMOGENEOUS map shapes —\n             ;; vacuous-truth subtype of `:jsonb` / `[:map K V]` (the\n             ;; same rule `subtype?` grants). Without this branch a\n             ;; `{:value {}}` binding to `:coalesce :default a` after\n             ;; `:value` resolved `a := :jsonb` falls into the `:else\n             ;; ::fail` arm — the subtype-aware leniency for `:jsonb`\n             ;; above only fires for record/list/map/tuple/refine\n             ;; literal classifications, not the `:empty-map` sentinel.\n             ;; NOT compatible with record types — their fields are\n             ;; required and `{}` supplies none (mirrors `subtype?`).\n             (and (= a :empty-map) (or (= b :jsonb) (map-type? b)))\n             (and (= b :empty-map) (or (= a :jsonb) (map-type? a))))\n         subst\n         (and (fn-type? a) (fn-type? b))         (unify-fn a b subst)\n         (and (list-type? a) (list-type? b))     (unify (list-elem a) (list-elem b) subst)\n         ;; List-expected × tuple-actual ONLY — mirrors the subtype\n         ;; rule `[:tuple …] ⊆ [:list E]`: every tuple position\n         ;; unifies against the list elem, so a `[:list a]` slot\n         ;; bound to a tuple-returning ref BINDS `a` instead of\n         ;; silently keeping it free. The REVERSE direction (tuple\n         ;; expected, list actual) is deliberately absent: a list\n         ;; carries no length guarantee, `subtype?` refuses it, and a\n         ;; unify arm here would fire exactly on check-binding!'s\n         ;; after-subtype-FAILED fallback — admitting `[:list :int]`\n         ;; into a `[:tuple a a]` slot with no length check.\n         (and (list-type? a) (tuple-type? b))\n         (reduce (fn [s x]\n                   (if (= s ::fail) (reduced ::fail)\n                       (unify (list-elem a) x s)))\n                 subst (tuple-elems b))\n         (and (map-type? a) (map-type? b))\n         (let [s (unify (map-key a) (map-key b) subst)]\n           (if (= s ::fail) ::fail (unify (map-val a) (map-val b) s)))\n         (and (tuple-type? a) (tuple-type? b))\n         (let [ea (tuple-elems a) eb (tuple-elems b)]\n           (if (= (count ea) (count eb))\n             (reduce (fn [s [x y]]\n                       (if (= s ::fail) ::fail (unify x y s)))\n                     subst (map vector ea eb))\n             ::fail))\n         (and (record-type? a) (record-type? b)) (unify-record a b subst)\n         ;; A keyword-keyed record unifies with `[:map K V]` — same\n         ;; relation `subtype?` already grants (`record ⊆ [:map …]`).\n         (and (map-type? a) (record-type? b))    (unify-map-record a b subst)\n         (and (record-type? a) (map-type? b))    (unify-record-map a b subst)\n         :else                ::fail)))))","gi":58},{"say":"The single source of truth for nullability narrowing: remove `:null`\n           from a top-level union (bare `:null` → `:never`) while NEVER stripping\n           a `:secret`. The canonical example of type narrowing, shared by\n           control-flow refinement and the `:coalesce` rule.","defn":"strip-null","ns":"graphden.types.core","n":9,"file":"src/graphden/types/core.clj","lang":"clj","line":306,"code":"(defn strip-null\n  \"Remove `:null` members from a top-level union; the bare `:null` type\n   becomes `:never` (bottom). A non-union, non-`:null` input passes\n   through unchanged. Conservative on `[:secret …]`: a secret-wrapped\n   nullable carries `:null` INSIDE the wrapped union, not at top level,\n   so this leaves the taint marker intact — it never strips a secret.\n\n   The narrowing helper (`:some?`/`:nil?` control-flow refinement in\n   `types.check.narrowing`) and the `:coalesce` return-rule\n   (`core/logic/impls.clj`) both remove nullability the same way; this\n   is their single source of truth.\"\n  [t]\n  (cond\n    (union-type? t)\n    (let [members (vec (remove #{:null} (union-members t)))]\n      (cond\n        (empty? members) :never\n        (= 1 (count members)) (first members)\n        :else (make-union members)))\n    (= t :null) :never\n    :else t))","gi":59},{"say":"The `:return-type-rule` propagator that wraps a fn's return in\n           `[:secret …]` when any argument carries a secret anywhere. This is how\n           the information-flow marker flows through composition — the payoff of\n           the secret arm you saw in `subtype?`.","defn":"taint-with-secret-if-tainted","ns":"graphden.types.core.shapes","n":10,"file":"src/graphden/types/core/shapes.clj","lang":"clj","line":473,"code":"(defn taint-with-secret-if-tainted\n  \"Pluggable `:return-type-rule` propagator — if ANY arg in\n   `bindings-info` carries a `[:secret …]` anywhere in its type,\n   wrap the static return in `[:secret …]`. Otherwise return the\n   static return verbatim.\n\n   `bindings-info` is the shape `compute-return-type` passes to a\n   rule: `{slot-name {:type T :value V? :ref R? :elem-types [T …]?}}`.\n   We scan BOTH `:type` AND `:elem-types`. `:elem-types` is\n   load-bearing: a list binding's `:type` is `[:list (coarse-lub …)]`\n   and the coarse lub of a heterogeneous list widens to `:any` — so a\n   `[\\\"Bearer \\\" secret-ref]` list argument would drop its `[:secret …]`\n   marker if we looked at `:type` alone. A content-passing base-fn\n   (`:str` concat, `:add`, …) that consumes such a list DOES fold the\n   secret element into its result, so the per-element types must be\n   scanned or the taint leaks (pre-2026-08-17 bug: mixed-list secret\n   silently declassified).\n\n   Base-fns with no other return-type-rule opt into propagation by\n   registering this fn directly. Base-fns that ALREADY have a\n   structural return-type-rule (`:first`, `:get`, etc.) wrap their\n   rule via `wrap-with-taint` so the structural computation runs\n   first AND the taint propagates if applicable.\"\n  [bindings-info default-ret]\n  (let [tags (reduce (fn [acc [_slot info]]\n                       (as-> acc a\n                             (into a (marker-tags-in (:type info)))\n                             (reduce (fn [a2 et] (into a2 (marker-tags-in et)))\n                                     a\n                                     (:elem-types info))))\n                     #{}\n                     bindings-info)]\n    (if (seq tags)\n      ;; Carry EVERY marker present on any input — a fn that read a\n      ;; `[:pii …]` and a `[:secret …]` returns a value labelled with\n      ;; both. Deterministic wrap order (sorted) so computed types are\n      ;; stable across runs.\n      (reduce (fn [t tag] (make-marker-type tag t))\n              default-ret\n              (sort tags))\n      default-ret)))","gi":60,"see":[{"gi":56,"label":"subtype?"}]},{"say":"Infers a structural type from a literal Clojure value (records,\n           header maps, `[:list T]`, primitives). This is where concrete argument\n           values enter the checker as types — the input side of every binding\n           check.","defn":"classify-literal","ns":"graphden.types.check.literals","n":11,"file":"src/graphden/types/check/literals.clj","lang":"clj","line":39,"code":"(defn classify-literal\n  \"Infer the type of a literal Clojure value. Recursively walks maps\n   and vectors so a literal classifies into its STRUCTURAL type, not\n   the flat `:jsonb` catch-all — that lets a literal map type-check\n   against a declared record-type (`:security-headers-shape`, etc.)\n   instead of silently failing `:jsonb ⊄ <record>`.\n\n   - keyword-keyed non-empty map → record-type `{k (classify v) …}`\n   - string-keyed map with homogeneous value type → `[:map :text V]`\n     (e.g. `{\\\"Content-Type\\\" \\\"text/html\\\"}` → `[:map :text :text]`).\n     Lets header-map literals type-check against `:ring-response`'s\n     `[:map :text :text]` slot.\n   - mixed-keyed map, or empty map → `:jsonb` (a genuine generic\n     JSON object — neither shape carries enough evidence)\n   - vector → `[:list T]` where T is the least-upper-bound of the\n     items' types (`:any` when items disagree or the vector is empty)\n\n   Returns nil if the shape isn't a recognised literal (callers fall\n   back to `:any` or skip type-checking the binding).\"\n  [v]\n  (cond\n    (nil? v)         :null\n    (boolean? v)     :bool\n    (integer? v)     :int\n    (float? v)       :float\n    (string? v)      :text\n    (keyword? v)     :keyword\n    (uuid? v)        :uuid\n    (map? v)         (cond\n                       (empty? v) :empty-map\n                       (every? keyword? (keys v))\n                       (into {}\n                             (map (fn [[k fv]]\n                                    [k (or (classify-literal fv) :any)]))\n                             v)\n                       (every? string? (keys v))\n                       (let [val-types (into #{} (map #(or (classify-literal %) :any))\n                                             (vals v))]\n                         (if (= 1 (count val-types))\n                           [:map :text (first val-types)]\n                           :jsonb))\n                       :else :jsonb)\n    (vector? v)      (let [elems (into #{} (map #(or (classify-literal %) :any)) v)]\n                       [:list (if (= 1 (count elems)) (first elems) :any)])\n    :else            nil))","gi":61},{"say":"Verifies one binding's `actual` ⊆ `expected`, running `unify` when\n           type-vars are present and handling the `:any` / `:never` /\n           refinement-on-literal escape hatches. The atomic unit of\n           type-checking, tying together `subtype?`, `unify`, and\n           `classify-literal`.","defn":"check-binding!","ns":"graphden.types.check","n":12,"file":"src/graphden/types/check.clj","lang":"clj","line":490,"code":"(defn- check-binding!\n  \"For a single binding, verify `actual ⊆ expected`. When `expected`\n   carries type variables, unify instead so the variables get bound.\n\n   Throws `:types/check-failed` with a multi-line, fn-def-named\n   message on mismatch. ex-info `:data` includes the structured\n   pieces (`:fn-name`, `:parent`, `:arg`, `:binding`, `:expected`,\n   `:actual`) so callers can format their own diagnostics if\n   needed.\"\n  [parent-name arg-name expected actual subst fn-name b-form]\n  (cond\n    ;; Type-var on EITHER side + `:any`-shaped actual — bind the var\n    ;; via unify FIRST. Without this, `:if`'s `:then a` slot bound to\n    ;; an actual `[:map :any :any]` would fall into the silent-pass\n    ;; below, leaving `a` unbound; `:if`'s declared `[:union a b]`\n    ;; return then surfaces a literal `\"a\"` typevar string in the\n    ;; registry, polluting downstream consumers (the structural-any\n    ;; from the binding IS information — that's the bind path, not\n    ;; a no-op).\n    (and (or (has-type-var? expected) (has-type-var? actual))\n         (any-shape? actual))\n    (let [next-subst (types/unify expected actual subst)]\n      (if (types/fail? next-subst) subst next-subst))\n\n    ;; `:any` (or structural-`:any` like `[:map :any :any]` /\n    ;; `[:list :any]`) — the doc's static escape hatch. Carries no\n    ;; static information either way, so silent-pass. (`:null` used\n    ;; to pass too, as a blanket runtime escape hatch. Now that\n    ;; nil-producing base-fns are typed `[:union :null T]`, a bare\n    ;; `:null` actual is checked normally: it satisfies a nullable /\n    ;; `:any` / type-var slot via subtype? / unify, and is correctly\n    ;; REJECTED by a concrete non-null slot.)\n    (any-shape? actual)\n    subst\n\n    ;; `:never` (bottom) actual — a divergent `:throw` branch. It fits\n    ;; any expected type, but we unify rather than pass silently so a\n    ;; type-var expected (e.g. `:if`'s `:then` slot) BINDS to `:never`.\n    ;; Without the binding the branch union keeps a free var instead\n    ;; of letting `make-union` absorb the bottom. `unify` with a\n    ;; `:never` operand always succeeds, so the result is never a fail.\n    (= actual :never)\n    (let [s (types/unify expected actual subst)]\n      (if (types/fail? s) subst s))\n\n    ;; Refinement on a LITERAL value: if we know the literal AND\n    ;; can evaluate the constraint, accept-or-reject inline.\n    (and (types/refine-type? expected)\n         (some? b-form)\n         (literal-binding? b-form))\n    (check-refinement-on-literal parent-name arg-name expected actual\n                                 subst fn-name b-form\n                                 (literal-binding-value b-form))\n\n    ;; Subtype FIRST — it handles container-into-jsonb (`[:list 'b] ⊆\n    ;; :jsonb`) regardless of inner type-vars, since the outer `list-\n    ;; type?` arm of the :jsonb sink rule doesn't recurse into the\n    ;; element type. Trying unify first would reject these\n    ;; (`unify [:list 'b] :jsonb = ::fail`).\n    ;;\n    ;; When typevars ARE present, also run unify after a successful\n    ;; subtype to extract bindings. subtype? is lenient on typevar-sup\n    ;; (`map-subtype?` / `list-subtype?` / `fn-subtype?`'s sup-side\n    ;; typevar arms) so the structural check passes WITHOUT carrying\n    ;; the binding forward. Without this follow-up, e.g. `:try`'s\n    ;; `:body [:fn {} a]` slot bound to a fn returning `[:map :keyword\n    ;; :any]` passes subtype but leaves `a` free; downstream consumers\n    ;; of `:try`'s declared `[:union a b]` see typevars instead of the\n    ;; resolved `[:map :keyword :any]`.\n    (types/subtype? actual expected)\n    (if (or (has-type-var? expected) (has-type-var? actual))\n      (let [s (types/unify expected actual subst)]\n        (if (types/fail? s) subst s))\n      subst)\n\n    ;; Subtype rejected — but if EITHER side carries a type-var,\n    ;; the rejection may be because `subtype?` doesn't reason about\n    ;; type-vars (they only equal themselves). Fall back to `unify`\n    ;; so e.g. `'a ⊆ :jsonb` succeeds by binding `'a := :jsonb`.\n    (or (has-type-var? expected) (has-type-var? actual))\n    (let [next-subst (types/unify expected actual subst)]\n      (if (types/fail? next-subst)\n        (throw-mismatch! (mismatch-context parent-name fn-name arg-name\n                                           b-form expected actual))\n        next-subst))\n\n    :else\n    (throw-mismatch! (mismatch-context parent-name fn-name arg-name\n                                       b-form expected actual))))","gi":62},{"say":"The declared-signature engine: when a root base-fn has no hand\n           `:return-type-rule`, the polymorphic declaration itself computes\n           the return — unify each var-carrying declared arg against the\n           actual type at the site, resolve the declared return through the\n           substitution. `:coll [:list a] → [:union :null a]` IS the rule;\n           the hand-written rules that survive are only those reading\n           literal values, union fan-out, or the registry.","defn":"signature-return","ns":"graphden.types.check","n":13,"file":"src/graphden/types/check.clj","lang":"clj","line":2036,"code":"(defn signature-return\n  \"Generic structural fallback for a root base-fn with NO hand-written\n   `:return-type-rule` whose DECLARED signature carries type variables\n   (`:coll [:list a]` → `[:union :null a]`): unify each var-carrying\n   declared arg type against the actual type visible at this site,\n   JOIN the per-arg substitutions (a var bound differently by two args\n   unions — return-position covariance makes the join the sound\n   direction for a result type; on the CHECKED path `check-binding!`'s\n   HM-strict unify has already rejected such a conflict, so the join\n   arm only ever fires on the uncheckable re-fire path in\n   `effective-ref-return*`), then resolve the declared return\n   through the joined substitution.\n\n   Degrades to `static-ret` whenever nothing binds or a var stays\n   free — the fallback must never widen or invent. `:any` actuals are\n   skipped: a free/unknown arg carries no information, and letting the\n   var bind to `:any` would widen the resolved return.\n\n   This is the declared-signature path that makes most hand rules\n   redundant: the signature already IS the rule, written where the\n   author reads it (fns.edn).\"\n  [root-entry bindings-info static-ret]\n  (let [decl-ret (:return root-entry)]\n    (if-not (has-type-var? decl-ret)\n      static-ret\n      (let [substs (into []\n                         (keep (fn [[arg-name expected]]\n                                 (let [actual (get-in bindings-info\n                                                      [arg-name :type])]\n                                   (when (and (has-type-var? expected)\n                                              actual\n                                              (not= :any actual))\n                                     (let [s (types/unify expected actual {})]\n                                       (when-not (types/fail? s) s))))))\n                         (:args root-entry))\n            joined (reduce (fn [acc s]\n                             (reduce-kv\n                               (fn [m v t]\n                                 (let [prev (get m v)]\n                                   (cond\n                                     (nil? prev) (assoc m v t)\n                                     (= prev t)  m\n                                     :else (assoc m v (types/make-union\n                                                        [prev t])))))\n                               acc s))\n                           {} substs)\n            resolved (when (seq joined)\n                       (types/resolve joined decl-ret))]\n        (if (or (nil? resolved) (has-type-var? resolved))\n          static-ret\n          resolved)))))","gi":63},{"say":"Type-checks a single fn-def against its (single or multiple-\n           inheritance) parents: resolve parent slots, run the monotonicity /\n           unknown-slot / effect guards, unify bindings, compute the return via\n           type-rules, propagate effects, and snapshot the rich-type into the\n           registry. The per-node checker the sweep repeats.","defn":"check-fn-def!","ns":"graphden.types.check","n":14,"file":"src/graphden/types/check.clj","lang":"clj","line":2313,"code":"(defn check-fn-def!\n  \"Type-check a single fn-def against its parent's signature\n   (whether that parent is a base-fn or a previously-checked\n   composed fn-def). On success, snapshot the fn-def's computed\n   rich-type into the registry so DOWNSTREAM checks can resolve\n   refs to it.\n\n   Throws `:types/check-failed` on mismatch.\n\n   Recognised binding shapes:\n     :other-fn           — fn-ref; actual = ref's return type\n     {:value x}          — literal; actual = classify-literal\n     bare literal        — same as {:value …}\n     {:as :name}         — rename, no value flow → checked at caller\n     [items …]           — sequence chain; each item type-checked\n                           against the slot's element type\n     {:ref :name}        — same as a bare keyword fn-ref\"\n  [{fn-name :name :as fn-def}]\n  (when-let [{:keys [primary-parent parent-info]} (resolve-parent-info fn-def)]\n    (binding [*source-info* (source-info-for fn-def)]\n      ;; Type-row parents (e.g. `:Storage`, `:ResolveVersionedRowsInput`)\n      ;; declare their abstract operations as record FIELDS, not as the\n      ;; rich-type `:args` slot map (which is empty for type-rows).\n      ;; Concrete impls (`:postgres-storage-impl :parent :Storage :args\n      ;; {:query :pg-query …}`) bind those fields. Inject the resolved\n      ;; fields from EVERY parent in the MI list (primary OR secondary)\n      ;; so the per-binding type-check verifies that bindings satisfy\n      ;; the type-row's field contracts. `(:args parent-info)` wins\n      ;; on a key collision — that's the normal slot map.\n      ;;\n      ;; Resolving every parent (not just primary) closes the MI bug\n      ;; surfaced by `:resolve-versioned-rows :parents [:filter\n      ;; :ResolveVersionedRowsInput]`: the type-row is the SECONDARY\n      ;; parent, so a primary-only resolver missed its fields entirely\n      ;; (`:version-id-field` etc. showed up as \"unknown slot\").\n      (let [parent-list (or (seq (:parents fn-def))\n                            (when (:parent fn-def) [(:parent fn-def)]))\n            type-row-fields (reduce\n                              (fn [acc p]\n                                (let [resolved (and (keyword? p)\n                                                    (types/resolve-alias p))]\n                                  (if (types/record-type? resolved)\n                                    (merge acc resolved)\n                                    acc)))\n                              (let [ret (:return parent-info)]\n                                (if (types/record-type? ret) ret {}))\n                              parent-list)\n            parent-args (merge type-row-fields (:args parent-info))]\n        (check-effect-categories! fn-def)\n        (check-unknown-slots! fn-def primary-parent parent-args parent-info)\n        (check-ref-type-overrides! fn-def primary-parent)\n        (check-binding-monotonicity! fn-def primary-parent parent-args)\n        (check-branch-local-monotonicity! fn-def)\n        (let [;; Effective parent-args includes resolved bindings from\n              ;; further up the chain — gives rules a transitive view of\n              ;; slot types AND the ref-name (when bound to a fn-ref) so\n              ;; ref re-firing can pick up call-site narrowing.\n              effective-parent\n              (merge (:resolved-bindings parent-info {})\n                     (into {}\n                           (map (fn [[k t]] [k {:type t :value nil}]))\n                           parent-args))\n              ;; Backward unification: when this fn-def declares a\n              ;; concrete `:return-type` and the parent's return is a\n              ;; bare type-var, bind that var. Any parent slot typed by\n              ;; the SAME var is then checked against (and surfaced as)\n              ;; the narrowed type — e.g. `:default-security-headers`\n              ;; declaring `:return-type :security-headers-shape` over\n              ;; `:const` binds `a`, so the `:value` slot reads as\n              ;; `:security-headers-shape` instead of generic `a`.\n              parent-ret    (:return parent-info)\n              declared-ret  (:return-type fn-def)\n              init-subst    (if (and declared-ret (types/type-var? parent-ret))\n                              {parent-ret declared-ret}\n                              {})\n              subst (type-check-bindings fn-def primary-parent parent-args init-subst)\n              ;; Slots whose type changed once `subst` is applied (backward\n              ;; unification) PLUS rule-derived narrowings (e.g. `:update-in`\n              ;; narrowing `:path` from its `:m` record). Rule narrowings\n              ;; win on a key collision — a rule knows more than generic\n              ;; var-substitution. The editor shows these on type-chips.\n              slot-types (merge\n                           (into {}\n                                 (keep (fn [[arg-name arg-type]]\n                                         (let [resolved (types/resolve subst arg-type)]\n                                           (when (not= resolved arg-type)\n                                             [arg-name resolved]))))\n                                 parent-args)\n                           (compute-rule-slot-types fn-def primary-parent\n                                                    effective-parent))\n              nav-types (compute-rule-nav-types fn-def primary-parent\n                                                effective-parent)\n              free-args (collect-free-args fn-def parent-args subst)\n              static-ret (types/resolve subst (or (:return parent-info) :any))\n              own-bindings (bindings-info-for-rule (:args fn-def))\n              computed-return (compute-return-type fn-def primary-parent\n                                                   effective-parent static-ret)\n              recorded-return (enforce-declared-return! fn-name fn-def computed-return)\n              drift (return-type-drift fn-def computed-return)\n              effects (compute-effects (:args fn-def) parent-info)]\n          (when drift (log-return-type-drift! fn-name fn-def drift))\n          (when-let [declared (some-> fn-def :effects set)]\n            (when (not= declared effects)\n              (log-effects-drift! fn-name fn-def declared effects)))\n          (check-effects-policy! fn-name fn-def effects)\n          (record-result! fn-name fn-def primary-parent parent-info\n                          free-args recorded-return effects own-bindings\n                          slot-types nav-types drift)\n          subst)))))","gi":64},{"say":"The whole-graph sweep entry point: fold `check-fn-def!` over\n           topologically-ordered fn-defs so each def's computed rich-type is\n           registered before its dependents read it. This is how the entire graph\n           is checked end to end.","defn":"check-all-defs!","ns":"graphden.types.check","n":15,"file":"src/graphden/types/check.clj","lang":"clj","line":2424,"code":"(defn check-all-defs!\n  \"Run type-check on every fn-def. Stops at the first mismatch.\n   Returns the per-fn substitution map (for diagnostic / future\n   computed-type cache) on success.\n\n   PRECONDITION: `fn-defs` must be topologically ordered,\n   dependencies-first. `check-fn-def!` records each computed rich-type\n   into the shared registry (`record-result!` → `record-rich-types-raw!`),\n   and downstream defs read parents / ref-returns back out via\n   `registry/rich-type-of` (`resolve-parent-info`, `effective-ref-return`).\n   A def checked BEFORE the def it references resolves that ref to `:any`\n   instead of its real type — no error, just a silently looser check.\n   NOTE: production (`packages/sync`) rolls its own fault-tolerant\n   per-fn-def loop instead of calling this — this fn is the plain\n   all-or-nothing variant kept for tests/REPL sweeps. Both topo-sort\n   first; the narrowing passes have the same ordering dependency.\"\n  [fn-defs]\n  (binding [*ref-return-memo* (atom {})]\n    (into {}\n          (map (fn [fn-def]\n                 [(:name fn-def) (check-fn-def! fn-def)]))\n          fn-defs)))","gi":65},{"say":"Where the sweep's answers are KEPT. The rich-types registry is the\n           in-memory `{fn → {:return :args :effects …}}` snapshot every\n           downstream consumer reads: the compiler's HOF-wrap decision, the\n           executor's effect gate, secret redaction on persist, the editor's\n           type chips. Aliases resolve to their structural body here, so\n           everyone downstream sees one canonical shape.","defn":"record-rich-types!","ns":"graphden.executor.registry.core","n":16,"file":"src/graphden/executor/registry/core.clj","lang":"clj","line":383,"code":"(defn record-rich-types!\n  \"Snapshot the structured types for one fn-def into the in-memory\n   registry. Idempotent — re-syncing overwrites. Aliases are resolved\n   to their structural body so downstream type-check sees the canonical\n   shape.\n\n   `:effects` is recorded straight from the fn-def as a set of keyword\n   tags (`:db` / `:env` / `:io` / `:network` / `:time` / `:random` /\n   `:process` / `:raw-sql`). `:process` is the service-eligibility marker —\n   declares 'spawns supervised background work'; required by the\n   `:_create-service-no-process-rej` graph guard when admins make a\n   fn into a `:service`.\n   Every base-fn that produces side effects names a specific category.\n   `:description` is propagated so the editor's inline-expand panel can\n   surface a human-readable hint without a separate API call.\n\n   `:return-type-rule` / `:slot-types-rule` / `:nav-types-rule` —\n   per-base-fn type-rules declared at the base-fn's `impls.clj`\n   registration site. When present they ride into the registry entry\n   so the type-checker looks them up by base-fn identity instead of\n   dispatching a multimethod on the fn name.\n\n   Arities: the 2-arity derives the fn-id — reusing the name index's\n   existing id when the name is already registered (test-stub overwrite\n   + editor-fn re-record land on the row's id), else the deterministic\n   `records/fn-id(namespace, name)` the sync path's storage rows use.\n   Editor-created fns have RANDOM row ids — their write path threads\n   the id explicitly via the 3-arity.\"\n  ([fn-name fn-def]\n   (record-rich-types! (fn-def-registry-id fn-name fn-def) fn-name fn-def))\n  ([fn-id fn-name fn-def]\n   (let [args (:args fn-def)\n         ret  (some-> (:return-type fn-def) types/resolve-alias)\n         per-arg (into {}\n                       (map (fn [[arg-name arg-spec]]\n                              [arg-name (or (arg-spec->rich-type arg-name arg-spec) :any)]))\n                       args)\n         raw-effects (set (:effects fn-def))\n         desc (:description fn-def)\n         build (fn [final-effects]\n                 (cond-> {:return (or ret :any)\n                          :args   per-arg\n                          ;; Always store the computed set, even when empty.\n                          ;; compute-effects is total — every fn has a known\n                          ;; set, possibly #{} (pure). Gating on (seq effects)\n                          ;; collapsed \"computed pure\" and \"no info recorded\"\n                          ;; into one absent-key state, which forced every\n                          ;; consumer downstream to write (or (:effects info)\n                          ;; #{}) to recover the pure case. Storing #{}\n                          ;; explicitly drops the asymmetry.\n                          :effects final-effects}\n                   (and desc (seq desc))      (assoc :description desc)\n                   (:return-type-rule fn-def) (assoc :return-type-rule\n                                                     (:return-type-rule fn-def))\n                   (:slot-types-rule fn-def)  (assoc :slot-types-rule\n                                                     (:slot-types-rule fn-def))\n                   (:nav-types-rule fn-def)   (assoc :nav-types-rule\n                                                     (:nav-types-rule fn-def))\n                   ;; `:taint-propagate?` — checker applies marker-taint\n                   ;; propagation centrally on this base-fn's results.\n                   (:taint-propagate? fn-def)  (assoc :taint-propagate? true)\n                   ;; `:lazy-seq-args` — slot names where each ITEM in the\n                   ;; seq slot's list arrives as a `delay`, so a consumer\n                   ;; like `:cond` can step past an unforced item.\n                   ;;\n                   ;; Scalar lazy slots DON'T need a marker — every `:ref`\n                   ;; binding compiles to a delay by default; Clojure's\n                   ;; native `if`/`and`/`or` short-circuit on un-read args.\n                   (:lazy-seq-args fn-def)    (assoc :lazy-seq-args\n                                                     (:lazy-seq-args fn-def))\n                   ;; `:lambda-params` — the fn-def's EXPLICIT ordered\n                   ;; call-site parameter list for HOF use. Overrides the\n                   ;; wrap-arity inference in\n                   ;; `compile.renames/hof-lambda-params`; `[]` means\n                   ;; \"everything captured\" (a handler chain that takes\n                   ;; no per-call value).\n                   (contains? fn-def :lambda-params)\n                   (assoc :lambda-params (vec (:lambda-params fn-def)))\n                   ;; `:compile-time-value?` — base-fn is evaluated ONCE at\n                   ;; compile time and its result baked as `(constantly …)`\n                   ;; into the closure (compile_eager reads this via the\n                   ;; root base-fn's rich-type). Backs `:cell`'s persistent\n                   ;; atom.\n                   (:compile-time-value? fn-def) (assoc :compile-time-value? true)\n                   ;; `:source-file` / `:source-line` — origin of the EDN entry\n                   ;; (tools.reader meta). Stored alongside the rich-type so\n                   ;; type-error messages can point at the fn that introduced\n                   ;; the offending constraint.\n                   (:source-file fn-def)      (assoc :source-file\n                                                     (:source-file fn-def))\n                   (:source-line fn-

# Bake a CRaC checkpoint + restore image in CI.
#
# WHY manual (workflow_dispatch), not part of the main CI:
#   A CRIU checkpoint needs CAP_SYS_ADMIN / CAP_CHECKPOINT_RESTORE (we run the
#   checkpoint in a --privileged container). GitHub-hosted `ubuntu-latest` DOES
#   allow `docker run --privileged`, but whether CRIU's checkpoint/restore
#   succeeds depends on the runner kernel — it is not guaranteed on hosted VMs.
#   So this is opt-in and OFF the PR path: a CRIU hiccup must not red the build.
#   A self-hosted privileged runner is the guaranteed substrate — point the
#   `runner` input at its label.
#
# The recipe mirrors development/crac/build-checkpoint-in-container.sh +
# Dockerfile.crac: checkpoint IN the same azul CRaC base the restore image uses,
# so every mmap'd path (JDK, jar, checkpoint dir, native) matches on restore.
name: CRaC bake

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (ubuntu-latest, or a self-hosted privileged label)'
        default: 'ubuntu-latest'
        required: false
      push_image:
        description: 'Push the restore image to GHCR'
        type: boolean
        default: false

env:
  JAVA_VERSION: '21'

jobs:
  bake:
    name: checkpoint + restore image
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: graphden
          POSTGRES_USER: graphden
          POSTGRES_PASSWORD: graphden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Build uberjar
        run: clojure -T:build uber

      - name: Checkpoint in the azul CRaC base (path-aligned)
        env:
          JDBC_URL: jdbc:postgresql://localhost:5432/graphden
          DB_USERNAME: graphden
          DB_PASSWORD: graphden
        run: ./development/crac/build-checkpoint-in-container.sh

      - name: Build restore image
        run: docker build -f Dockerfile.crac -t graphden-crac:${{ github.sha }} .

      - name: Smoke-test the restore image (restore → /health 200)
        env:
          JDBC_URL: jdbc:postgresql://localhost:5432/graphden
          DB_USERNAME: graphden
          DB_PASSWORD: graphden
        run: |
          docker run -d --name crac --privileged --network host \
            --security-opt seccomp=unconfined \
            -e JDBC_URL -e DB_USERNAME -e DB_PASSWORD \
            graphden-crac:${{ github.sha }}
          for _ in $(seq 1 300); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:8080/health || true)
            [ "$code" = "200" ] && { echo "restore serving in $(( _ * 100 ))ms window"; exit 0; }
            sleep 0.1
          done
          echo "restore image never served /health 200"; docker logs crac | tail -30; exit 1

      - name: Log in to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push restore image
        if: ${{ inputs.push_image }}
        run: |
          IMG=ghcr.io/${{ github.repository }}/graphden-crac
          docker tag graphden-crac:${{ github.sha }} "$IMG:${{ github.sha }}"
          docker push "$IMG:${{ github.sha }}"

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphden — developer tour</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--edge:#2a323d;--fg:#e6edf3;--dim:#8b949e;
--accent:#58a6ff;--hi:#213048;--kw:#79c0ff;--str:#a5d6a2;--cmt:#6e7681;--stub:#484f58}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);
font:14px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:10px 18px;border-bottom:1px solid var(--edge);display:flex;
align-items:baseline;gap:16px;flex:0 0 auto}
header h1{font-size:15px;margin:0;font-weight:600}
#crumb{color:var(--dim);font-size:12px}
#crumb b{color:var(--fg);font-weight:600}
#shell{flex:1 1 auto;display:flex;min-height:0}
#map{width:290px;flex:0 0 auto;overflow:auto;border-right:1px solid var(--edge);
padding:12px 8px;background:var(--panel)}
#stage{flex:1 1 auto;overflow:auto;padding:22px 28px;max-width:980px}
footer{flex:0 0 auto;display:flex;gap:10px;align-items:center;
padding:9px 18px;border-top:1px solid var(--edge);background:var(--panel)}
footer button{background:#21262d;color:var(--fg);border:1px solid var(--edge);
border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
footer button:hover:not(:disabled){border-color:var(--accent)}
footer button:disabled{opacity:.4;cursor:default}
#pos{color:var(--dim);font-size:12px;margin:0 6px}
.blk{margin-bottom:6px}
.blk-h{padding:6px 8px;border-radius:6px;cursor:default}
.blk-h .t{font-weight:600}
.blk-h .s{color:var(--dim);font-size:11.5px;display:block;margin-top:2px}
.blk.stub .blk-h{opacity:.62}
.blk.stub .t::after{content:' ⏳';font-size:11px}
.blk .after{color:var(--stub);font-size:10.5px;margin:1px 0 0 8px}
.steps{list-style:none;margin:4px 0 0;padding:0 0 0 8px}
.steps li{padding:3px 8px;border-radius:5px;cursor:pointer;color:var(--dim);
font-size:12.5px;border-left:2px solid transparent}
.steps li:hover{color:var(--fg);background:#1c2330}
.steps li.on{color:var(--fg);background:var(--hi);border-left-color:var(--accent)}
.paths{margin:6px 0 0 8px}
.paths code{color:var(--dim);font-size:11px;display:block}
.say{margin:0 0 16px}
.say p{margin:0 0 10px}
.say code,code.inl{background:#1c2330;border-radius:4px;padding:.5px 5px;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.say a{color:var(--accent)}
.file{color:var(--dim);font-size:12px;margin:0 0 6px;
font-family:ui-monospace,monospace}
.file b{color:var(--fg)}
pre.code{background:var(--panel);border:1px solid var(--edge);border-radius:8px;
padding:12px 0;overflow:auto;margin:0 0 18px;font-size:12.5px;line-height:1.5}
pre.code .ln{display:flex}
pre.code .g{color:var(--cmt);text-align:right;padding:0 14px 0 12px;
user-select:none;min-width:52px;flex:0 0 auto}
pre.code .c{padding-right:16px;white-space:pre;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
pre.code .head .c{background:var(--hi)}
.tok-kw{color:var(--kw)}.tok-str{color:var(--str)}.tok-cmt{color:var(--cmt)}
.see{margin:0 0 18px}
.see .lbl{color:var(--dim);font-size:11.5px;margin-right:6px}
.see a{display:inline-block;background:#1c2330;border:1px solid var(--edge);
border-radius:12px;padding:2px 10px;font-size:12px;color:var(--accent);
cursor:pointer;margin:0 6px 6px 0}
.stub-note{color:var(--dim);border:1px dashed var(--edge);border-radius:8px;
padding:16px;margin-top:12px}
.intro{color:var(--dim);max-width:760px}
kbd{background:#21262d;border:1px solid var(--edge);border-bottom-width:2px;
border-radius:4px;padding:0 5px;font-size:11px}
</style>
</head>

<script id="tour-data" type="application/json">{"title":"Graphden — developer tour","intro":"Welcome. This is a guided read of the graphden codebase for someone who\n  just joined and needs to find their feet in the whole system — not the\n  user tutorial (that lives in `docs/tutorial/` and is about *using* the\n  editor), but the host code that makes it run.\n\n  The system splits into a handful of relatively independent **blocks**\n  (left). Read them roughly top-to-bottom: each block's `after:` line names\n  what it assumes you have already seen. Only the **Executor** block is fully\n  toured today — it is the spine everything else hangs off, so start there.\n  The rest are stubs that name where their code lives; they get toured one at\n  a time, the same way the user tutorial grows lesson by lesson.\n\n  Every step shows you the **actual source** of one function, pulled straight\n  from the file it lives in. When a step points you at code in another block,\n  use the *see also* chips — **Back** always returns you along the path you\n  actually walked.","blocks":[{"id":":executor","title":"Executor — how a fn runs","status":"toured","summary":"The spine: turn a graph 'description of a computation' into a value.","paths":["src/graphden/executor/"],"after":[],"steps":[{"code":"(defn execute\n  \"Executes a function by id using the compiled registry.\n\n   Arguments:\n   - context: Execution context (created with create-context)\n   - fn-id: UUID of the function to execute\n   - args: Free args map, keyed by external arg name, or nil/{}.\n\n   Throws:\n   - :execution-error/fn-not-found if `fn-id` has no compiled closure\n   - :execution-error/invalid-args if `args` is non-nil and not a map\"\n  [context fn-id args]\n  (when (and (some? args) (not (map? args)))\n    (throw (ex-info \"args must be nil or a map\"\n                    {:type :execution-error/invalid-args\n                     :args args\n                     :args-type (type args)})))\n  (cr/execute context fn-id (or args {})))","line":85,"file":"src/graphden/executor/interface.clj","ns":"graphden.executor.interface","defn":"execute","say":"**Start here.** `execute` is the public front door of the whole\n           system. A caller hands it an execution *context*, a `fn-id` — the id\n           of a row in the graph that *describes* a computation — and a map of\n           free args. This ns is a thin, validating façade: it checks the args\n           shape and delegates to the real machinery in `compile-runtime`.\n           Everything below is how that graph *description* becomes a value.","see":[[":executor","create-context"]]},{"code":"(defn execute\n  \"Invoke `fn-id` via the compiled registry. `named-args` is a `{arg-name\n   value}` map using the outermost external arg names (rename-aware).\n\n   HOF impls that deref a `:fn`-type arg end up with a callable (from\n   `rt/hof-callable`) rather than a UUID and hand it back in through\n   this same entry point. For single-entry args the value is unwrapped\n   from the map; for empty or multi-entry args the whole map is passed\n   through.\n\n   Cancellation: when `*cancel-check*` is bound (by the fn-execution\n   harness), it's called at the top of each invocation — if the\n   per-execution flag flipped, an `InterruptedException` propagates\n   up through the call stack and is caught by the fn-execution\n   reaper which writes `:status :cancelled`.\"\n  [ctx fn-id named-args]\n  (check-cancel!)\n  ;; Per-namespace execute gate (§4.2): consult the ctx's `:execute-guard`\n  ;; ONCE per top-level execute (the recursion flag keeps it off the hot\n  ;; sub-fn path), then re-enter. The guard throws `:authz/forbidden` on a\n  ;; denied tenant execute; absent (core / system / admin) → no-op.\n  (if (and (not *execute-authorized*) (:execute-guard ctx))\n    (binding [*execute-authorized* true]\n      ((:execute-guard ctx) ctx fn-id)\n      (execute ctx fn-id named-args))\n    ;; Effect sandbox: when the ctx restricts effects, bind\n    ;; `*allowed-effects*` so `record-effect!` can gate. `identical?`\n    ;; skips re-binding on recursive `execute` calls within the same ctx;\n    ;; an unrestricted ctx (the common case) pays zero binding overhead.\n    (let [allowed (:allowed-effects ctx)]\n      (if (and allowed (not (identical? allowed *allowed-effects*)))\n        (binding [*allowed-effects* allowed]\n          (execute ctx fn-id named-args))\n        (if (fn? fn-id)\n          (let [args (or named-args {})]\n            (if (= 1 (count args))\n              (fn-id (first (vals args)))\n              (fn-id args)))\n          (let [reg (registry ctx)\n                closure (or (get reg fn-id) (throw-fn-not-found! fn-id))\n                ;; Translate caller's name-keyed args into the dual-key\n                ;; shape (slot-id + name). Phase 4 readers prefer slot-id;\n                ;; the name half covers env-binding / lambda-arg / rename-\n                ;; alias paths that still flow under name keys today.\n                translated (translate-named-args fn-id (or named-args {})\n                                                 (lookups-for-ctx ctx))]\n            ;; compile-eager closure signature: `(fn [free-args ctx])`.\n            ;; Child callables are captured at compile time — `reg`\n            ;; is no longer needed by the runtime.\n            (closure translated ctx)))))))","line":929,"file":"src/graphden/executor/compile_runtime.clj","ns":"graphden.executor.compile-runtime","defn":"execute","say":"The dispatch heart of the hot path. It checks the cancellation /\n           effect / execute-guard gates, pulls the **compiled registry** out of\n           the context, looks up the closure for this `fn-id` (or throws\n           fn-not-found), translates the caller's name-keyed args into the dual\n           slot-id+name shape the compiled code expects, and finally calls\n           `(closure translated ctx)`. This is the moment *execute a fn* becomes\n           *call a precompiled closure*.","see":[[":executor","registry"]]},{"code":"(defn create-context\n  \"Creates an execution context.\n\n   Options:\n   - :storage   Storage instance (required).\n   - :base-fns  Map of fn-name → impl-fn (optional; defaults to the\n                global registry snapshot).\n   - :clock     Zero-arg fn returning current time in ms (default\n                `System/currentTimeMillis`). Inject in tests for\n                deterministic time.\n   - :allowed-effects  Optional set of effect categories this context\n                permits (e.g. `#{:db :time}`). When set, `record-effect!`\n                throws `:execution/forbidden-effect` for any effect\n                outside it — the cloud sandbox boundary (PLATFORM_PLAN\n                §5). `nil`/absent (the default) = unrestricted\n                (self-hosted / mixed).\n   - :auth-provider  Optional `graphden.auth.provider/AuthProvider` — the\n                authentication seam (§3.0). Read by the\n                `:authenticate-request` base-fn. Absent → that base-fn\n                fails closed (`{:authenticated? false}`).\n   - :request-scope  Optional request-scope seam (§3.0 B4) — a fn\n                `(fn [ctx request thunk] …)` the branch-router's `dispatch`\n                wraps each handler call with. The tenancy addon uses it to\n                authenticate + bind `*current-org*`. Absent → `dispatch`\n                calls the handler directly (single-tenant).\n   - :execute-guard  Optional per-namespace execute guard (§4.2) — a fn\n                `(fn [ctx fn-id] …)` `compile-runtime/execute` consults once\n                per top-level execute; throws `:authz/forbidden` on a denied\n                tenant execute. Absent → no execute authorization.\n   - :executor-orgs  Optional membership predicate over org-ids — usually a\n                set, or a fn for a hash-sharded fleet that doesn't enumerate\n                its tenants. The compiled registry then holds only those\n                orgs' fns plus the un-owned platform rows, instead of every\n                tenant's. nil (the default, and the only value single-tenant\n                ever uses) compiles the whole graph. Admit the public org\n                explicitly — core doesn't know its name.\n   - :byo-executor?  When true, this pod is a customer's OWN executor — it may\n                serve the `:byo` orgs in its shard. A HOSTED pod (default,\n                false) refuses any `:byo` org with a 421. See\n                `tenancy.context/byo-org?`.\"\n  [{:keys [storage base-fns clock allowed-effects auth-provider request-scope\n           execute-guard app-router set-org-handler verify-domain user-ops\n           executor-orgs byo-executor? fleet-forward fleet-command]}]\n  (validate-context-options! storage)\n  (-> (->ExecutionContext storage\n                          (or base-fns (registry/get-default-registry))\n                          (or clock #(System/currentTimeMillis))\n                          (atom nil)\n                          (atom nil)\n                          (atom nil))\n      ;; Per-context lock for serializing the read-graph → compute →\n      ;; prime-multi-atom sequence in `invalidate-graph-cache!` /\n      ;; `compile-runtime/rebuild!`. Without it, concurrent CRUD\n      ;; requests can prime `:graph-cache` / `:compile-deps` from\n      ;; out-of-order storage snapshots and leave the caches\n      ;; reflecting an older view than what storage already holds.\n      ;; A ReentrantLock (not `locking`/`synchronized`): the body under\n      ;; it recompiles for seconds, and a virtual thread blocked on a\n      ;; monitor pins its carrier (JDK 21) — see\n      ;; `compile-runtime/call-with-invalidation-lock`.\n      (assoc :invalidation-lock (java.util.concurrent.locks.ReentrantLock.))\n      ;; Fleet placement bookkeeping (docs/FLEET_RFC.md §6.2): the set of cell\n      ;; ROOTS this executor has loaded via `compile-runtime/load-cell!`. Lets\n      ;; `evict-cell!` reference-count shared fns. Empty + unused on a\n      ;; non-fleet ctx (which loads its whole shard via `rebuild!`).\n      (assoc :loaded-roots (atom #{}))\n      ;; Effect sandbox — nil = unrestricted. Read on the hot path by\n      ;; `compile-runtime/execute`, which binds `*allowed-effects*` for\n      ;; the execution so `record-effect!` can gate.\n      (cond-> allowed-effects (assoc :allowed-effects (set allowed-effects)))\n      ;; Auth seam (§3.0) — read by the `:authenticate-request` base-fn.\n      (cond-> auth-provider (assoc :auth-provider auth-provider))\n      ;; Request-scope seam (§3.0 B4) — wrapped around each handler call by\n      ;; the branch-router's `dispatch`.\n      (cond-> request-scope (assoc :request-scope request-scope))\n      ;; Per-namespace execute guard (§4.2) — consulted by `execute`.\n      (cond-> execute-guard (assoc :execute-guard execute-guard))\n      ;; App-router seam (§3.4 FaaS) — consulted by the branch-router's\n      ;; `dispatch` BEFORE the editor/API flow: a request to a tenant's\n      ;; subdomain is served by that org's handler fn (org-scoped + effect-\n      ;; gated), never the editor.\n      (cond-> app-router (assoc :app-router app-router))\n      ;; Self-serve deploy seam (§3.4 4b) — `(fn [ctx fn-id] …)` the\n      ;; `:invoke-set-org-handler` base-fn calls so a tenant can point its\n      ;; own org at its own handler fn. Addon-only.\n      (cond-> set-org-handler (assoc :set-org-handler set-org-handler))\n      ;; Self-serve DNS-verify seam (§3.4 #2) — `(fn [ctx hostname] …)` the\n      ;; `:invoke-verify-domain` base-fn calls so a tenant can prove ownership\n      ;; of its own custom domain (DNS-TXT) and flip it verified. Addon-only.\n      (cond-> verify-domain (assoc :verify-domain verify-domain))\n      ;; User-model seam (§4.1) — `{:create-user … :login …}` the\n      ;; `:invoke-create-user` / `:invoke-login` base-fns call. Login mints a\n      ;; session `:token`; the storage-token-provider resolves it. Addon-only.\n      (cond-> user-ops (assoc :user-ops user-ops))\n      ;; Executor shard — which orgs' fns this pod compiles. Read by\n      ;; `compile-runtime/read-graph`. nil ⇒ the whole graph. A collection\n      ;; becomes a set (which is itself the membership predicate); a fn is\n      ;; taken as the predicate directly.\n      (cond-> executor-orgs\n        (assoc :executor-orgs (if (fn? executor-orgs)\n                                executor-orgs\n                                (set executor-orgs))))\n      ;; Pod role — a BYO executor may serve the `:byo` orgs in its shard;\n      ;; a hosted pod (default) 421s them.\n      (cond-> byo-executor? (assoc :byo-executor? true))\n      ;; Fleet forward-hop seam (docs/FLEET_RFC.md §6.1, T2.6): a\n      ;; `(fn [request org entry-fn-id] → response-or-nil)` the app-router\n      ;; consults BEFORE 421'ing — forwards to the executor that holds the cell\n      ;; (per `:placement`). Absent (single-tenant / no fleet identity) → 421 as\n      ;; before.\n      (cond-> fleet-forward (assoc :fleet-forward fleet-forward))\n      ;; Fleet control-plane command seam (docs/FLEET_RFC.md §6.3) — the\n      ;; `branch-router/dispatch` consults it for `POST /internal/fleet/cell/…`.\n      ;; Absent (single-tenant / no fleet identity) → no internal endpoint.\n      (cond-> fleet-command (assoc :fleet-command fleet-command))))","line":276,"file":"src/graphden/executor/context.clj","ns":"graphden.executor.context","defn":"create-context","say":"Builds the `ExecutionContext` the previous step reads from. It\n           carries the storage handle, the `:base-fns` impl registry\n           (snapshotted from the global default), a lazily-filled\n           `:compiled-registry` holder, the graph/deps caches, and the\n           authz/effect seams. Because scoping (e.g. which branch) lives here,\n           the *same* `fn-id` run in two contexts can resolve to different\n           code — this is where that happens."},{"code":"(defn registry\n  \"Return the current compiled registry from `ctx`, rebuilding on-demand\n   when missing. Tests that skip the `:exec/compiled-registry` init-key\n   still get a working executor via this fallback — the cost is a single\n   compile pass on first execution.\n\n   Double-checked under the invalidation lock: a full `rebuild!` takes\n   seconds, and without coalescing every concurrent reader that hit an\n   empty holder fired its OWN rebuild (observed: 20+ full recompiles\n   stacked on one editor mutation). Re-checking `@holder` after taking\n   the lock means the first arrival rebuilds and everyone else reuses\n   its result. Reentrant lock, so the inner `rebuild!` re-acquires\n   cheaply.\"\n  [ctx]\n  (when-let [holder (:compiled-registry ctx)]\n    (or @holder\n        (call-with-invalidation-lock ctx (fn [] (or @holder (rebuild! ctx)))))))","line":616,"file":"src/graphden/executor/compile_runtime.clj","ns":"graphden.executor.compile-runtime","defn":"registry","say":"Returns the `{fn-id -> closure}` map from the context holder. On a\n           cold holder it rebuilds on demand under an invalidation lock, with a\n           double-checked read so concurrent callers coalesce onto one rebuild\n           instead of stampeding. This is the lazy **compile-once, reuse-forever**\n           registry the executor actually runs against.","see":[[":executor","rebuild!"]]},{"code":"(defn rebuild!\n  \"Rebuild the compiled registry in `ctx` from whatever the slot/\n   binding tables currently hold. Also primes `:graph-cache` and\n   `:compile-deps` so read-heavy consumers stay in sync. Call at\n   startup and on full invalidation.\n\n   Runs under the context's `:invalidation-lock` so the\n   read-graph → compute → prime-multi-atom sequence stays atomic\n   relative to concurrent `invalidate-graph-cache!` callers.\"\n  [ctx]\n  (call-with-invalidation-lock\n    ctx\n    (fn []\n      (let [storage (compile-storage ctx)\n            graph (read-graph storage (:executor-orgs ctx))\n            _ (register-type-aliases-from-db! graph)\n            base-fns (:base-fns ctx)\n            lookups (assoc (l/cached-build-lookups graph)\n                           :base-fns base-fns)\n            _ (prime-always-fresh! (:fns graph))\n            compiled (ce/compile-all lookups)]\n        (reset! (:compiled-registry ctx) compiled)\n        (prime-graph-cache! ctx graph)\n        (prime-compile-deps! ctx graph)\n        compiled))))","line":382,"file":"src/graphden/executor/compile_runtime.clj","ns":"graphden.executor.compile-runtime","defn":"rebuild!","say":"The compile-at-startup pipeline in one form: `read-graph` from\n           storage, then `build-lookups`, then `compile-all`; finally it primes\n           the graph/deps caches and resets the registry holder. This is the\n           seam where **code = graph in DB** turns into runnable Clojure\n           closures. The next few steps open up each stage it calls.","see":[[":executor","build-lookups"],[":executor","compile-all"]]},{"code":"(defn sync-fns-to-storage!\n  \"Top-level sync for a list of fn-defs. See arity-5 for full\n   signature; convenience arities auto-discover `extra-name->id` from\n   the existing `:fn` table.\n\n   `extra-defs-by-name` (5-arity) carries fn-def shapes from a prior\n   sync (base-fns, type-rows declared inline) so the records-parser's\n   slot resolver can find their slots. Without it, a composed fn\n   binding `:m` on a slot owned by a base-fn synced earlier won't\n   resolve.\"\n  ([storage fn-defs]\n   (let [{:keys [name->id defs-by-name]} (discover-existing-state storage)]\n     (sync-fns-to-storage! storage fn-defs {} name->id defs-by-name)))\n  ([storage fn-defs ns-id-map]\n   (let [{:keys [name->id defs-by-name]} (discover-existing-state storage)]\n     (sync-fns-to-storage! storage fn-defs ns-id-map name->id defs-by-name)))\n  ([storage fn-defs ns-id-map extra-name->id]\n   (sync-fns-to-storage! storage fn-defs ns-id-map extra-name->id\n                         (existing-defs-by-name storage)))\n  ([storage fn-defs ns-id-map extra-name->id extra-defs-by-name]\n   (validation/validate-all-defs! fn-defs)\n   (let [sorted (deps/topological-sort fn-defs)\n         records (records/parse-module sorted extra-name->id extra-defs-by-name)]\n     (write-records! storage records ns-id-map))))","line":259,"file":"src/graphden/executor/composition/core.clj","ns":"graphden.executor.composition.core","defn":"sync-fns-to-storage!","say":"The opposite direction — and the reason there is a graph to read at\n           all. Authored fn-defs (from packages) are reconciled into fn / slot /\n           binding rows in storage here. So the graph that `rebuild!` reads was\n           itself *written* by this composition layer from source fn-defs. Read\n           it to see how declarations become persisted graph entities."},{"code":"(defn build-lookups\n  \"Index entities for fast lookup during compile. Inputs:\n     fns                 — vector of fn rows\n     slots               — vector of slot rows\n     fn-slots            — vector of fn-slot junction rows\n     bindings            — vector of binding rows\n     list-items          — vector of binding-list-item rows\n\n   Output keys:\n     :fn-map               {fn-id → fn-row}\n     :slot-map             {slot-id → slot-row}\n     :fn-slots-by-fn       {fn-id → [fn-slot-row …]}, ordered by :position\n     :slot-by-fn-name      {[fn-id slot-name-keyword] → slot-row}\n     :slot-by-fn-source-slot\n                            {[fn-id source-slot-id] → slot-row} —\n                            renamed-view lookup. A composed fn that\n                            exposes ancestor slot S under a new name\n                            owns a slot row whose `:source-slot-id`\n                            points back at S; this index lets renamers\n                            be located in O(1) without walking\n                            fn-slots-by-fn.\n     :bindings-by-fn       {fn-id → [binding-row …]}\n     :binding-by-fn-slot   {[fn-id slot-id] → binding-row}\n     :items-by-binding     {binding-id → [item-row …]}, ordered by :position\n     :chain-cache          atom {fn-id → chain-vector} — lazy cache for\n                            `inheritance-chain*`. Multiple compile-time\n                            helpers (`effective-required?`, `effective-binding`,\n                            `fn-typed-slot?`, `list-items-for`,\n                            `closest-binding-for-slot`, `rename-for-slot`)\n                            walk the same chain for the same fn-id many\n                            times during one classification pass; this atom\n                            collapses that to a single BFS per fn-id.\"\n  [{:keys [fns slots fn-slots bindings list-items]}]\n  (let [fn-map (into {} (map (juxt :id identity)) fns)\n        slot-map (into {} (map (juxt :id identity)) slots)\n        fn-slots-by-fn (->> fn-slots\n                            (sort-by (juxt :fn-id :position))\n                            (reduce (fn [acc fs]\n                                      (update acc (:fn-id fs) (fnil conj []) fs))\n                                    {}))\n        slot-by-fn-name (into {}\n                              (mapcat (fn [[fid junctions]]\n                                        (keep (fn [fs]\n                                                (when-let [s (get slot-map (:slot-id fs))]\n                                                  [[fid (keyword (:name s))] s]))\n                                              junctions)))\n                              fn-slots-by-fn)\n        slot-by-fn-source-slot (into {}\n                                     (mapcat (fn [[fid junctions]]\n                                               (keep (fn [fs]\n                                                       (when-let [s (get slot-map (:slot-id fs))]\n                                                         (when-let [src (:source-slot-id s)]\n                                                           [[fid src] s])))\n                                                     junctions)))\n                                     fn-slots-by-fn)\n        bindings-by-fn (reduce (fn [acc b]\n                                 (update acc (:fn-id b) (fnil conj []) b))\n                               {}\n                               bindings)\n        binding-by-fn-slot (into {}\n                                 (map (juxt (juxt :fn-id :slot-id) identity))\n                                 bindings)\n        items-by-binding (->> list-items\n                              (sort-by (juxt :binding-id :position))\n                              (reduce (fn [acc i]\n                                        (update acc (:binding-id i) (fnil conj []) i))\n                                      {}))]\n    {:fn-map             fn-map\n     :slot-map           slot-map\n     :fn-slots-by-fn     fn-slots-by-fn\n     :slot-by-fn-name    slot-by-fn-name\n     :slot-by-fn-source-slot slot-by-fn-source-slot\n     :bindings-by-fn     bindings-by-fn\n     :binding-by-fn-slot binding-by-fn-slot\n     :items-by-binding   items-by-binding\n     :chain-cache        (atom {})\n     ;; Hot per-(fn-id) caches used by the compile pipeline. Same\n     ;; lifetime as `:chain-cache` — populated lazily by the\n     ;; compile fns and shared across the compile-all pass so a\n     ;; deep walk runs once per fn-id instead of once per ref-\n     ;; binding pointing at it.\n     :deep-frees-cache   (atom {})\n     :deep-free-ext-entries-cache (atom {})\n     :cache-projection-frees-cache (atom {})\n     :bindings-cache     (atom {})\n     :global-env-cache   (atom nil)}))","line":14,"file":"src/graphden/executor/compile/lookups.clj","ns":"graphden.executor.compile.lookups","defn":"build-lookups","say":"Indexes the raw graph rows — fns, slots, fn-slots, bindings,\n           list-items — into the O(1) maps every compile helper consumes\n           (`:fn-map`, `:slot-map`, `:bindings-by-fn`, the inheritance-chain\n           cache, …). This is the in-memory materialization of the DB graph that\n           the whole compile pass walks over."},{"code":"(defn root-fn\n  \"Walk the inheritance chain of `fn-id` and return the first ancestor\n   with empty `:parent-ids` — the root that owns the slots. In the new\n   model the root is a base-fn (return-type-fn-id set) OR a type-row (record /\n   refinement / list / primitive); both have synthesised impls registered\n   under their fn-name. Two-arity form takes raw `fn-map` (used when\n   the caller has no lookups in hand); three-arity form takes the\n   full lookups map and benefits from chain caching.\"\n  ([fn-id fn-map]\n   (let [chain (inheritance-chain fn-id fn-map)]\n     (some (fn [fid]\n             (let [f (get fn-map fid)]\n               (when (empty? (:parent-ids f))\n                 f)))\n           chain)))\n  ([fn-id fn-map lookups]\n   (let [chain (inheritance-chain* fn-id (assoc lookups :fn-map fn-map))]\n     (some (fn [fid]\n             (let [f (get fn-map fid)]\n               (when (empty? (:parent-ids f))\n                 f)))\n           chain))))","line":191,"file":"src/graphden/executor/compile/lookups.clj","ns":"graphden.executor.compile.lookups","defn":"root-fn","say":"Walks a composed fn's `parent-ids` inheritance chain up to the\n           parentless **root** that owns the slots and carries a registered\n           impl. This is the base-fn resolution step: how an arbitrary composed\n           `fn-id` maps to the primitive whose Clojure impl will actually run."},{"code":"(defn collect-bindings\n  \"For F, classify every root slot. Returns a vector of binding entries\n   in fn-slot position order. Memoised on `lookups`'s\n   `:bindings-cache` — compile-eager + `build-ref-renames` between\n   them hit this once per (fn-id, ref-binding) which can be hundreds\n   of calls on the same fn-id during a single compile-all pass.\"\n  [fn-id {:keys [bindings-cache] :as lookups}]\n  (if-let [cache bindings-cache]\n    (or (get @cache fn-id)\n        (let [r (collect-bindings* fn-id lookups)]\n          (swap! cache assoc fn-id r)\n          r))\n    (collect-bindings* fn-id lookups)))","line":278,"file":"src/graphden/executor/compile/bindings.clj","ns":"graphden.executor.compile.bindings","defn":"collect-bindings","say":"Classifies each of a fn's root slots (via `classify-slot`) into a\n           `:value` / `:free` / `:ref` / `:seq` / `:secret-value` entry,\n           memoised on the lookups. This classification is the pivot the code\n           generator switches on next — the *shape* of every argument is decided\n           here, once, at compile time rather than per execution.","see":[[":executor","arg-builder"]]},{"code":"(defn compile-all\n  \"Compile every fn-row whose ref-DAG bottoms out at base-fn impls.\n   Returns `{fn-id → (fn [free-args ctx])}`. Cycle in ref-DAG →\n   throws (second line of defence over the storage constraint).\n\n   `lookups` MUST already carry `:base-fns` (the impl registry).\n\n   Cached on a process-wide bounded LRU keyed by graph-shape +\n   base-fn name set — sister callers (test ns's that bootstrap the\n   same package set, sibling branches with identical graph views)\n   skip the compile pass entirely and just retrieve the\n   ctx-independent closure map.\"\n  [lookups]\n  (let [k (compile-all-cache-key lookups)\n        hit (some (fn [[ck cv]] (when (= ck k) cv)) @compile-all-cache)]\n    (or hit\n        (let [r (compile-all* lookups)]\n          (swap! compile-all-cache\n                 (fn [v]\n                   (let [pruned (filterv (fn [[ck _]] (not= ck k)) v)\n                         capped (vec (take-last (dec compile-all-cache-max-size)\n                                                pruned))]\n                     (conj capped [k r]))))\n          r))))","line":749,"file":"src/graphden/executor/compile_eager.clj","ns":"graphden.executor.compile-eager","defn":"compile-all","say":"Topologically orders every impl-backed fn and compiles each in\n           dependency order into `{fn-id -> (fn [fa ctx])}`, cached process-wide\n           by (graph-shape × base-fn set). Dependency order matters: by the time\n           a parent compiles, its children's callables already exist to be\n           wired in.","see":[[":executor","compile-fn"]]},{"code":"(defn compile-fn\n  \"Return `(fn [free-args ctx])` for `fn-id`. `child-callables` is\n   `{fn-id → callable}` for ref-targets, populated in topological\n   order by `compile-all`.\n\n   Env-bindings (bindings on slots that AREN'T root slots — used to\n   propagate values like `:base-handler` through the ref-tree to\n   inner consumers) participate in a shared `fa-ref` volatile.\n   They evaluate to `delay`s whose closures read the volatile at\n   FORCE time, so an env-binding `A` that needs another env-binding\n   `B`'s value (forwards-reference, the order they're declared in\n   doesn't constrain dependencies) sees the final `fa'` map — same\n   semantics as the legacy compile's `augment-env`. Without this,\n   `:types-compatible`'s `:_rejected?` closure (which needs\n   `:validation` from the same env layer) sees an empty `:validation`\n   slot and reports every well-formed request as rejected, even\n   though the API path is correct.\"\n  ([fn-id lookups]\n   (compile-fn fn-id lookups {}))\n  ([fn-id lookups child-callables]\n   (let [impl (resolve-impl fn-id lookups)\n         enriched (mapv (fn [bnd]\n                          (if (and (= :ref (:kind bnd))\n                                   (not (:is-fn bnd)))\n                            (assoc bnd :ref-renames\n                                   (r/build-ref-renames (:ref-id bnd)\n                                                        fn-id\n                                                        lookups))\n                            bnd))\n                        (b/collect-bindings fn-id lookups))\n         builders (mapv #(arg-builder fn-id % child-callables lookups) enriched)\n         keys-vec (mapv :base-name enriched)\n         n (count builders)\n         env-bnds (b/collect-env-bindings fn-id lookups)\n         env-builders (mapv #(env-arg-builder fn-id % child-callables lookups)\n                            env-bnds)\n         env-names (mapv :env-name env-bnds)\n         env-n (count env-bnds)\n         ;; Compile-time-derived runtime aliasing for this fn's own\n         ;; rename slots. When a rename like `{:as :item}` surfaces\n         ;; a deep slot (`:branch-row` from the ref-tree) under a\n         ;; renamed outer name, downstream refs still read by the\n         ;; deep name — `apply-rename-aliases` copies the\n         ;; caller-supplied rename value back to the deep name so\n         ;; the lookup succeeds. Empty aliases (fns without own\n         ;; rename slots — the common case) short-circuit at apply.\n         rename-aliases (r/compute-rename-aliases fn-id lookups)]\n     ;; Top-level entry: install a fresh per-execute call-cache in\n     ;; ctx if none is in scope yet. Nested closure calls inherit\n     ;; the outer cache through ctx, so all siblings memoise on\n     ;; `(ref-id × fa)`. `HashMap` (not `clojure.lang.PersistentMap`)\n     ;; — one-cache-per-call, single-threaded read/write inside one\n     ;; top-level closure.\n     (fn [fa ctx]\n       (let [ctx (if (::call-cache ctx)\n                   ctx\n                   (assoc ctx ::call-cache (java.util.HashMap.)))\n             fa (r/apply-rename-aliases fa rename-aliases)\n             ;; The `fa-ref` volatile ONLY exists so env-binding delays can\n             ;; read the post-merge map at force time (forward references\n             ;; between env-bindings). Fns with no env-bindings — the common\n             ;; case — never read it, so skip the per-call allocation entirely.\n             fa' (if (zero? env-n)\n                   fa\n                   (let [fa-ref (volatile! fa)\n                         merged (loop [m fa, i 0]\n                                  (if (< i env-n)\n                                    (recur (assoc m (nth env-names i)\n                                                  ((nth env-builders i) fa-ref ctx))\n                                           (inc i))\n                                    m))]\n                     (vreset! fa-ref merged)\n                     merged))]\n         (impl (persistent!\n                 (loop [acc (transient {}), i 0]\n                   (if (< i n)\n                     (recur (assoc! acc\n                                    (nth keys-vec i)\n                                    ((nth builders i) fa' ctx))\n                            (inc i))\n                     acc)))\n               ctx))))))","line":549,"file":"src/graphden/executor/compile_eager.clj","ns":"graphden.executor.compile-eager","defn":"compile-fn","say":"Produces one fn's runtime closure `(fn [fa ctx])`. It turns each\n           classified binding into a *builder*, wires env-bindings and\n           rename-aliases, and at call time assembles the args map and invokes\n           `(impl args ctx)`. This is the concrete anatomy of a single compiled\n           graph node.","see":[[":executor","arg-builder"],[":executor","resolve-impl"]]},{"code":"(defn- arg-builder\n  \"Return `(fn [free-args ctx])` producing the value for one\n   classified binding.\n\n   Lazy semantics are built into the model the way Clojure does\n   them — `:ref` bindings ALWAYS produce a `delay`, and the impl\n   reads the arg through `rt/resolve-arg` which auto-derefs\n   `IDeref`. Inside the impl, `(if test then else)` short-circuits\n   because Clojure's native `if` only evaluates the picked form,\n   so only its `resolve-arg` call runs, and only its delay forces.\n   The un-taken branch's `delay` stays unforced — its side-effects\n   never fire. No `:lazy?` flag, no `:lazy-args` registration:\n   ordinary Clojure evaluation does it.\n\n   `:seq` materialises as an unchunked lazy-seq of values\n   (Clojure-native short-circuit through `every?` / `some`).\n   `lazy-seq?` slots wrap each item in `delay` for consumers like\n   `cond-fn` that step past unforced items via `nnext`.\"\n  [fn-id\n   {:keys [kind ext-name value ref-id is-fn produces-callable? ref-renames\n           items lazy-seq? slot-id path binder-fn-id]\n    :as bnd}\n   child-callables\n   lookups]\n  (case kind\n    :value (constantly value)\n    ;; Phase 4 — slot-id reader with name fallback.\n    ;;\n    ;; The rename-aware reader id (`l/effective-reader-slot-id`) is\n    ;; the PRIMARY key: two inline-anons of the same base-fn with\n    ;; their own `{:as :X}` renames have the SAME chain-leaf but\n    ;; DIFFERENT rename-slot ids, so each anon's reader finds its\n    ;; own caller value via slot-id without name collision.\n    ;;\n    ;; Name fallback covers paths that still write `fa` by name:\n    ;;   - env-builder writes `fa[env-name]` (per-fn synthetic\n    ;;     shared computations like `:_request-parsed`)\n    ;;   - hof-wrap's `make-shape-callable` merges `lambda-args`\n    ;;     under lambda-param names (per-call values)\n    ;;   - `build-ref-renames` slow path copies caller→callee names\n    ;; These name keys flow through the same `fa` and the reader's\n    ;; fallback finds them when there's no slot-id key. The fa is\n    ;; thus hybrid: slot-id keys distinguish structural ambiguity at\n    ;; the boundary translator, name keys cover dynamic flows. This\n    ;; is the architecture, not a transitional kludge — the two key\n    ;; spaces serve different needs.\n    :free  (let [sid (l/effective-reader-slot-id fn-id slot-id lookups)\n                 k ext-name]\n             (fn [fa _ctx]\n               (let [v (get fa sid ::miss)]\n                 (if (identical? v ::miss) (get fa k) v))))\n    :secret-value\n    (let [p path]\n      (fn [_fa ctx]\n        (rt/thunk\n          (fn []\n            (let [vault-client (or (:vault ctx)\n                                   (some-> @vault-active-client deref deref)\n                                   (throw (ex-info \"Vault client not configured — set VAULT_ADDR / VAULT_TOKEN\"\n                                                   {:type :vault/not-configured})))]\n              (@vault-get-secret vault-client p))))))\n    :ref\n    (let [child (or (get child-callables ref-id)\n                    (throw (ex-info \"compile-eager: ref-target not yet compiled\"\n                                    {:type :compile/missing-child\n                                     :binding bnd :ref-id ref-id\n                                     :fn-id fn-id})))\n          ref-frees (set (r/cache-projection-frees ref-id lookups))]\n      (cond\n        ;; HOF binding where the slot's structural shape is\n        ;; `[:fn {…} …]` and the target is NOT itself a callable-\n        ;; producer: build the Clojure closure the consumer will\n        ;; call positionally. Value-shape, not delay-shape — the\n        ;; impl invokes it directly.\n        (and is-fn (not produces-callable?))\n        (let [lambda-params (r/hof-lambda-params ref-id slot-id bnd fn-id lookups)\n              translation (r/build-hof-translation ref-id lambda-params lookups)]\n          (hof-wrap child lambda-params translation))\n\n        ;; Two collapse into one — both want \"invoke child with the\n        ;; caller's env, wrap in a thunk for short-circuit\":\n        ;; - `:produces-callable?`: target's fn-graph evaluates to a\n        ;;   Clojure callable (`:_router` → ring-handler). Wrapping\n        ;;   means the router builds only when the impl actually\n        ;;   reads the arg.\n        ;; - non-renamed plain ref: the common case — no caller→\n        ;;   callee free-arg translation needed.\n        ;;\n        ;; `rt/thunk` (a fn with `::thunk` meta) rather than `delay`\n        ;; here: `resolve-arg` auto-calls it for impls that read args\n        ;; via the `defbase` macro AND impls that read raw\n        ;; (`((:body args))` — the closure-capture acceptance test)\n        ;; can still invoke the value as a 0-arg fn.\n        (or produces-callable? (empty? ref-renames))\n        (fn [fa ctx]\n          (rt/thunk (fn [] (call-with-cache ref-id ref-frees child fa ctx))))\n\n        :else\n        (fn [fa ctx]\n          (rt/thunk (fn []\n                      (call-with-cache\n                        ref-id ref-frees child\n                        (reduce-kv (fn [acc callee-name caller-name]\n                                     (assoc acc callee-name (get fa caller-name)))\n                                   fa ref-renames)\n                        ctx))))))\n    :seq\n    (let [item-builders (mapv #(seq-item-builder % child-callables lookups\n                                                 (or binder-fn-id fn-id))\n                              items)]\n      (if lazy-seq?\n        (fn [fa ctx]\n          (map (fn [b] (delay (b fa ctx))) item-builders))\n        (fn [fa ctx]\n          (lazy-seq-of-values item-builders fa ctx))))\n    (throw (ex-info (str \"compile-eager: unsupported binding kind \" kind)\n                    {:type :compile/unsupported-kind :binding bnd}))))","line":369,"file":"src/graphden/executor/compile_eager.clj","ns":"graphden.executor.compile-eager","defn":"arg-builder","say":"Emits the per-binding `(fn [fa ctx])`: `:value` becomes a constant,\n           `:free` reads the slot-id (with a name fallback), `:ref` becomes a\n           `thunk`/delay that **defers** the child call, `:seq` becomes a lazy\n           seq. This is the origin of graphden's laziness — refs are *wrapped,\n           not evaluated*, so native Clojure `if`/`and`/`or` short-circuit for\n           free without the executor knowing their names.","see":[[":executor","resolve-arg"]]},{"code":"(defn- resolve-impl\n  [fn-id {:keys [fn-map base-fns] :as lookups}]\n  (let [root-name (some-> (l/root-fn fn-id fn-map lookups) :name keyword)]\n    (or (get base-fns root-name)\n        (throw (ex-info (str \"No impl for base-fn \" (pr-str root-name))\n                        {:type :compile/missing-impl\n                         :fn-id fn-id :base-fn-name root-name})))))","line":177,"file":"src/graphden/executor/compile_eager.clj","ns":"graphden.executor.compile-eager","defn":"resolve-impl","say":"Looks the base-fn's Clojure impl out of `lookups[:base-fns]` by the\n           root fn's name, throwing `:compile/missing-impl` on a gap. This is the\n           concrete join between a graph node and the actual code that computes\n           it — the point where the graph description meets a real function.","see":[[":executor","defbase"]]},{"code":"(defmacro defbase\n  \"Declare a base-fn implementation.\n\n   Syntax: `(defbase fn-name docstring? [arg-syms] & body)`\n\n   The arg-syms vector names the args referenced in the body; their types\n   live in the package's `fns.edn`. The body refers to args as bare symbols\n   and to `ctx` for the execution context. Everything else works like\n   normal Clojure — `if`/`and`/`or` short-circuit naturally.\"\n  {:arglists '([fn-name docstring? [arg-syms] & body])}\n  [fn-name & macro-args]\n  (let [[docstring args-vec & body] (if (string? (first macro-args))\n                                      macro-args\n                                      (cons nil macro-args))\n        _ (when-not (vector? args-vec)\n            (throw (ex-info \"defbase arg list must be a vector of symbols\"\n                            {:fn-name fn-name :args args-vec})))\n        _ (when-not (every? simple-symbol? args-vec)\n            (throw (ex-info \"defbase arg list must contain only simple symbols\"\n                            {:fn-name fn-name :args args-vec})))\n        reserved #{'__args 'ctx}\n        clash (some reserved args-vec)\n        _ (when clash\n            (throw (ex-info (str \"defbase arg name clashes with reserved symbol: \" clash)\n                            {:fn-name fn-name :reserved reserved})))\n        arg-sym->key (into {} (map (fn [s] [s (keyword s)])) args-vec)\n        transformed (transform-body body arg-sym->key)\n        body-form `(do ~@transformed)]\n    `(defn ~fn-name\n       ~@(when docstring [docstring])\n       [~'__args ~'ctx] ~body-form)))","line":142,"file":"src/graphden/executor/defbase.clj","ns":"graphden.executor.defbase","defn":"defbase","say":"The macro base-fn authors use. It rewrites a body that names its args\n           as bare symbols into `(defn name [__args ctx] …)`, where each symbol\n           reads through `resolve-arg`. This explains why the impls that\n           `resolve-impl` finds look like ordinary Clojure even though their\n           arguments arrive as a compiled map.","see":[[":executor","resolve-arg"]]},{"code":"(defn resolve-arg\n  \"Return the resolved value for `arg-key` in `args`.\n\n   Handles three cases:\n   - `thunk?` — call it (compile-produced ref wrapping).\n   - `IDeref` — `@` it (test code often passes `(delay …)` literals).\n   - otherwise — return as-is.\"\n  [args arg-key]\n  (let [v (get args arg-key)]\n    (cond\n      (thunk? v) (v)\n      (instance? clojure.lang.IDeref v) @v\n      :else v)))","line":39,"file":"src/graphden/executor/runtime.clj","ns":"graphden.executor.runtime","defn":"resolve-arg","say":"The read-side of laziness. Inside an impl this forces a `thunk`\n           (calling it once), derefs an `IDeref`/`delay`, or returns a plain\n           value untouched. This is where a deferred `:ref` argument actually\n           gets evaluated — at the moment, and only if, the impl reads it. Pair\n           it with `arg-builder`, which created the thunk.","see":[[":executor","arg-builder"]]},{"code":"(defn- call-with-cache\n  \"Invoke `(child fa ctx)` through the per-execute memo. Cache key is\n   `[ref-id projected-fa]` where projected-fa is `fa` restricted to\n   the ref-target's declared free args. Cache miss / absent cache /\n   always-fresh fn-id all fall through to a fresh call. `::nil`\n   sentinel distinguishes a cached `nil` from miss.\n\n   The cache clears itself when it reaches `call-cache-max-size` —\n   prevents pathological per-request growth (see the size constant's\n   doc for the empirical motivation).\"\n  [ref-id ref-frees child fa ctx]\n  (let [^java.util.HashMap cache (::call-cache ctx)]\n    (if (or (nil? cache) (contains? @*always-fresh-fn-ids* ref-id))\n      (child fa ctx)\n      (let [k [ref-id (fa-key-for-cache ref-frees fa)]\n            cached (java.util.HashMap/.get cache k)]\n        (if (some? cached)\n          (when-not (identical? cached ::nil) cached)\n          (let [v (child fa ctx)]\n            (when (>= (java.util.HashMap/.size cache) call-cache-max-size)\n              (java.util.HashMap/.clear cache))\n            (java.util.HashMap/.put cache k (if (nil? v) ::nil v))\n            v))))))","line":108,"file":"src/graphden/executor/compile_eager.clj","ns":"graphden.executor.compile-eager","defn":"call-with-cache","say":"Closes the loop. Child-callable invocations are memoised for the\n           duration of one top-level `execute`, keyed by `[ref-id\n           projected-free-args]` in a per-call map (with a `::nil` sentinel and a\n           size cap). This is how the lazy graph avoids recomputing the same\n           sub-result and delivers a single cached value back up to the caller —\n           the DRY principle, enforced at runtime."}]},{"id":":storage","title":"Storage & the graph","status":"stub","summary":"How the graph is stored and traversed — Postgres, recursive CTEs,\n             the StorageCRUD / ExecutionGraph protocols.","paths":["src/graphden/storage/","src/graphden/schema/"],"after":[":executor"]},{"id":":versioning","title":"Branches & versioning","status":"stub","summary":"The VersionedStorage decorator, per-branch resolution, diff/merge\n             and branch-local? propagation.","paths":["src/graphden/versioning/","src/graphden/system/branch_router.clj"],"after":[":storage"]},{"id":":types","title":"Type system","status":"stub","summary":"Subtyping, unification, narrowing, refinements, the sweep-at-zero\n             checker, and the :secret information-flow marker.","paths":["src/graphden/types/"],"after":[":executor"]},{"id":":crud","title":"CRUD & the write path","status":"stub","summary":"Entity/branch/secret writes, request parsing, type-check on write,\n             fn-execution lookup + persist.","paths":["src/graphden/crud/"],"after":[":storage",":types"]},{"id":":packages","title":"Packages — the graph's content","status":"stub","summary":"How fns.edn + impls.clj become base-fns and fn-defs; the loader,\n             load order, and the first-party package tree.","paths":["src/graphden/packages/","resources/packages/"],"after":[":executor"]},{"id":":web","title":"Web & the editor","status":"stub","summary":"HTTP routing, the graph-native page/partial runtime, and the\n             editor frontend.","paths":["resources/packages/web/","resources/packages/app/editor/"],"after":[":packages"]},{"id":":services","title":"Services & the fleet","status":"stub","summary":"Desired-state service registry, the reconciler/supervisor, and the\n             dynamic multi-executor fleet controller.","paths":["src/graphden/services/","src/graphden/fleet/"],"after":[":executor"]},{"id":":tenancy","title":"Multi-tenancy","status":"stub","summary":"Orgs, RLS, grants, the two-layer effect gate, and per-request\n             tenant routing.","paths":["src/graphden/tenancy/","src/graphden/auth/"],"after":[":crud"]}]}</script>
<script>
const MODEL = JSON.parse(document.getElementById('tour-data').textContent);
// flatten toured steps into a single ordered spine
const SPINE = [];
MODEL.blocks.forEach(b => (b.steps||[]).forEach((s,i) =>
  SPINE.push({block:b, step:s, sidx:i})));
const keyOf = (bid, defn) => bid+'\u0000'+defn;
const INDEX = new Map();
SPINE.forEach((e,gi) => INDEX.set(keyOf(e.block.id, e.step.defn), gi));

let cur = 0;            // current global step index into SPINE (or -1 = intro)
const hist = [];        // back-stack of previously-viewed indices

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// tiny markdown: paragraphs, `code`, **bold**, [text](url)
function md(src){
  return (src||'').split(/\n\s*\n/).map(p => {
    let h = esc(p);
    h = h.replace(/`([^`]+)`/g, (_,x)=>'<code class="inl">'+x+'</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, (_,x)=>'<b>'+x+'</b>');
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      (_,t,u)=>'<a href="'+esc(u)+'">'+esc(t)+'</a>');
    return '<p>'+h+'</p>';
  }).join('');
}

// minimal Clojure tokeniser -> highlighted HTML for one line
function hl(line){
  let out='', i=0;
  while(i<line.length){
    const c=line[i];
    if(c===';'){ out+='<span class=tok-cmt>'+esc(line.slice(i))+'</span>'; break; }
    if(c==='"'){ let j=i+1; while(j<line.length){ if(line[j]==='\\'){j+=2;continue;}
      if(line[j]==='"'){j++;break;} j++; }
      out+='<span class=tok-str>'+esc(line.slice(i,j))+'</span>'; i=j; continue; }
    if(c===':'){ let j=i+1; while(j<line.length && /[\w*+!?<>=./-]/.test(line[j])) j++;
      out+='<span class=tok-kw>'+esc(line.slice(i,j))+'</span>'; i=j; continue; }
    let j=i+1; while(j<line.length && line[j]!==';' && line[j]!=='"' && line[j]!==':') j++;
    out+=esc(line.slice(i,j)); i=j;
  }
  return out;
}

function codeBlock(step){
  const lines = step.code.split('\n');
  const rows = lines.map((ln,k)=>{
    const n = step.line + k;
    const head = k===0 ? ' head' : '';
    return '<div class="ln'+head+'"><span class=g>'+n+
      '</span><span class=c>'+hl(ln)+'</span></div>';
  }).join('');
  return '<div class=file>'+esc(step.file)+' — <b>'+esc(step.defn)+
    '</b></div><pre class=code>'+rows+'</pre>';
}

function seeBlock(step){
  if(!step.see||!step.see.length) return '';
  const chips = step.see.map(([bid,defn])=>{
    const gi = INDEX.get(keyOf(bid,defn));
    return gi==null ? '' :
      '<a data-gi="'+gi+'">'+esc(defn)+'</a>';
  }).join('');
  return '<div class=see><span class=lbl>see also</span>'+chips+'</div>';
}

function renderIntro(){
  cur=-1;
  document.getElementById('crumb').innerHTML='';
  document.getElementById('stage').innerHTML =
    '<div class=intro>'+md(MODEL.intro||'')+
    '<p style="margin-top:18px">Pick a step on the left, or press '+
    '<kbd>→</kbd> to start. <kbd>←</kbd>/<kbd>→</kbd> walk the spine; '+
    '<b>Back</b> returns along the path you actually took.</p></div>';
  paint();
}

function renderStub(b){
  document.getElementById('crumb').innerHTML='<b>'+esc(b.title)+'</b>';
  document.getElementById('stage').innerHTML =
    '<h2>'+esc(b.title)+'</h2><div class=say>'+md(b.summary||'')+'</div>'+
    '<div class=stub-note>Not toured yet — this block is a stub. '+
    'Code lives under:<div class=paths>'+
    (b.paths||[]).map(p=>'<code>'+esc(p)+'</code>').join('')+
    '</div><p style="margin:10px 0 0">Add steps to this block in '+
    '<code class=inl>docs/devtour/tour.edn</code>, then run '+
    '<code class=inl>bb devtour</code>.</p></div>';
  paint();
}

function go(gi, push){
  if(push && cur>=0) hist.push(cur);
  cur = gi;
  const {block, step} = SPINE[gi];
  document.getElementById('crumb').innerHTML =
    '<b>'+esc(block.title)+'</b> › step '+(SPINE.filter(e=>e.block===block)
      .indexOf(SPINE[gi])+1)+' — <code class=inl>'+esc(step.defn)+'</code>';
  document.getElementById('stage').innerHTML =
    '<div class=say>'+md(step.say)+'</div>'+seeBlock(step)+codeBlock(step);
  document.getElementById('stage').scrollTop=0;
  paint();
}

function paint(){
  document.querySelectorAll('.steps li').forEach(li=>
    li.classList.toggle('on', +li.dataset.gi===cur));
  document.getElementById('pos').textContent =
    cur<0 ? '' : ('step '+(cur+1)+' / '+SPINE.length);
  document.getElementById('prev').disabled = cur<=0;
  document.getElementById('next').disabled = cur>=SPINE.length-1;
  document.getElementById('back').disabled = hist.length===0;
}

function buildMap(){
  const map=document.getElementById('map');
  MODEL.blocks.forEach(b=>{
    const wrap=document.createElement('div');
    wrap.className='blk '+(b.status==='toured'?'toured':'stub');
    let html='<div class=blk-h><span class=t>'+esc(b.title)+'</span>'+
      '<span class=s>'+esc(b.summary||'')+'</span></div>';
    if(b.after&&b.after.length)
      html+='<div class=after>after: '+b.after.map(esc).join(', ')+'</div>';
    if(b.status==='toured'){
      html+='<ul class=steps>'+ (b.steps||[]).map(s=>{
        const gi=INDEX.get(keyOf(b.id,s.defn));
        return '<li data-gi="'+gi+'">'+esc(s.defn)+'</li>';
      }).join('') +'</ul>';
    }
    wrap.innerHTML=html;
    if(b.status!=='toured')
      wrap.querySelector('.blk-h').onclick=()=>renderStub(b);
    wrap.querySelectorAll('.steps li').forEach(li=>
      li.onclick=()=>go(+li.dataset.gi,true));
    map.appendChild(wrap);
  });
}

document.getElementById('next').onclick=()=>{ if(cur<SPINE.length-1) go(cur+1,true); };
document.getElementById('prev').onclick=()=>{ if(cur>0) go(cur-1,true); };
document.getElementById('back').onclick=()=>{ if(hist.length) go(hist.pop(),false); };
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight' && cur<SPINE.length-1) go(cur<0?0:cur+1,true);
  if(e.key==='ArrowLeft' && cur>0) go(cur-1,true);
});
document.getElementById('stage').addEventListener('click',e=>{
  const a=e.target.closest('a[data-gi]');
  if(a){ e.preventDefault(); go(+a.dataset.gi,true); }
});

buildMap();
renderIntro();
</script>
</body>
</html>

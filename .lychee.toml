# lychee — link checker for the repo's markdown corpus.
# https://lychee.cli.rs/usage/config/
#
# Default mode for `bb lychee` is OFFLINE — file:// links + inline-anchor
# checks only. External HTTP/HTTPS links are validated by the optional
# `bb lychee-online` task (slow, network-dependent) and the periodic
# GitHub Action — keeps the day-to-day `bb check` deterministic.

# Files to crawl. `**/*.md` walks the tree; `exclude_path` below
# carves out vendored / generated trees.
include = []

# Don't follow into vendored / generated trees — their README links
# are not our prose to maintain.
exclude_path = [
  "node_modules",
  "target",
  ".playwright-mcp",
  ".tools",
  "tools/visual-tests/tests/editor.spec.js-snapshots",
  ".git",
]

# Skip URL patterns that the offline check would still try to resolve
# (rare with --offline but kept for the online run too).
exclude = [
  # PRIVATE repos: the online run is anonymous, so GitHub answers 404 for
  # them exactly as it would for a stranger. That is the correct answer to
  # the wrong question — the check would only pass by handing CI a token,
  # i.e. by making a link-checker an authenticated client of our own repos.
  '^https://github\.com/graphden/graphden-(mathx|examples|cloud)',
  # The repo's OWN CI badge in README (self-referential, always valid). lychee
  # hits github.com's actions/badge endpoint over HTTP/2, which github
  # intermittently rejects ("HTTP/2 protocol error. Server may not support
  # HTTP/2 properly") — a runner/github flake, not a broken link. Checking our
  # own ever-present badge is self-referential noise; skip it.
  '^https://github\.com/Graphden/graphden/actions/',
  # A personal host used as a deploy EXAMPLE in deploy/kind/README.md. Its
  # uptime is not a property of this repository.
  '^https?://izpa\.xyz',

  # Localhost references in docs — not real URLs to validate.
  '^https?://localhost(:\d+)?($|/)',
  '^https?://127\.0\.0\.1',
  '^https?://0\.0\.0\.0',
  # Example / placeholder hosts.
  '^https?://example\.com',
  '^https?://prod\.example\.com',
  '^https?://your\.domain',
]

# Treat `[…]: (mailto:…)` and `[…]: (#anchor)` as fine even in offline mode.
include_mail = false
include_fragments = "full"   # lychee >= 0.24 takes a mode, not a bool

# Network politeness for the eventual online run.
max_concurrency = 16
timeout = 20
retry_wait_time = 2
max_retries = 2

# Accept 429 (rate limit) as ok — typical when the same host appears
# many times across docs. Codes 200-299 + 301/302/308 also ok.
accept = ["200..=299", "301", "302", "308", "429"]

# Caching is DELIBERATELY off. lychee writes `.lycheecache` into the working
# directory, which here is a docker bind-mount — the container's user cannot
# create it, so the run finishes its checks and THEN exits non-zero on
# "Permission denied", i.e. a green link report reported as a red check.
# (It only surfaced once the tasks started reading this config at all;
# before that the flags they passed silently left caching off.) The offline
# run is 60 ms; the online one is ~1 s. There is nothing here worth caching.
cache = false

# Graphden executor-fleet Helm values. See docs/FLEET_DEPLOY.md.

image:
  repository: graphden/executor-server
  tag: "" # defaults to .Chart.appVersion when empty
  pullPolicy: IfNotPresent

# Fixed fleet size. Ignored for scaling decisions when autoscaling.enabled
# (HPA owns the replica count then) but still the initial count.
replicaCount: 3

# The container port the executor listens on (Dockerfile fixes it at 8080).
port: 8080

# Org shard for THIS release (docs/SCALING.md § Sharding, docs/FLEET_DEPLOY.md
# § Dedicated tenant shard). Comma-separated org slugs: a pod compiles + serves
# ONLY these orgs (plus the always-present NULL-org platform packages) and 421s
# anything off-shard. Empty (default) = compile the whole graph — the
# self-hosted / shared-fleet behaviour. Set to "public,<org>" to make this
# release a DEDICATED shard for one paying tenant (task #6 / FLEET_RFC §7.1);
# pair it with tight `resources.limits` (cpu AND memory) so that tenant's
# persistent services are cgroup-bounded on their own pod — the effect gate
# limits WHAT they do, the cgroup limits HOW MUCH.
executorOrgs: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# LB / ingress entry point for tenant traffic — fronts the whole fleet; the
# per-pod forward-hop routes a request to the cell's holder internally.
service:
  type: ClusterIP
  port: 80
  # nodePort: 30080   # set with type: NodePort to expose on a fixed node port
  #                     (e.g. a kind extraPortMapping → host port → reverse proxy)

# SSE invalidation relay for external / BYO executors (docs/SCALING.md § SSE
# invalidation, docs/BYO_RUNBOOK.md). Off by default. Enabling sets
# GRAPHDEN_SSE_PORT (each pod starts the relay's own httpkit server) and adds
# a dedicated Service in front of it. The relay speaks plain HTTP — terminate
# TLS at your ingress / LB and route the SSE hostname to this Service. Note
# BYO subscribers hold LONG-LIVED streams: raise any LB idle-timeout in front
# of it, and keep session affinity off (any pod's relay sees every event).
sse:
  enabled: false
  port: 8081
  service:
    type: ClusterIP
    port: 8081

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    # CPU limit included by default: a shard exists to BOUND a tenant's
    # compute, and without a cpu limit the cgroup gives no CPU ceiling at
    # all (docs/FLEET_DEPLOY.md § Dedicated tenant shard).
    cpu: 2000m
    memory: 1536Mi

# HorizontalPodAutoscaler over the StatefulSet. The SRV membership (headless
# Service) tracks the pods HPA adds/removes; the placement controller
# load/evicts cells to match (docs/FLEET_RFC.md §6.2, §7).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# External Postgres (a managed DB — the fleet does NOT run its own). The
# password comes from the Secret (secrets.dbPassword / existingSecret).
database:
  jdbcUrl: "jdbc:postgresql://postgres:5432/graphden"
  username: graphden
  poolSize: 10

# Secrets. Either let the chart create one from the values below, or point at a
# pre-existing Secret with keys: auth-token, internal-token, db-password
# (and vault-token when vault.enabled).
secrets:
  create: true
  existingSecret: ""
  authToken: ""      # platform AUTH_TOKEN
  internalToken: ""  # GRAPHDEN_INTERNAL_TOKEN — control-plane cell-command gate
  dbPassword: graphden

vault:
  enabled: false
  address: ""

# Placement-controller tuning (docs/FLEET_RFC.md §6.3). Read by the leader pod.
fleet:
  # Off = this release runs NO controller (env GRAPHDEN_FLEET_CONTROLLER=off).
  # In a mixed fleet exactly ONE picture must hold per release: either every
  # release runs its own controller over its own scope (the default — lock
  # keys derive from the release's SRV name, cell scope from executorOrgs /
  # excludeOrgs), or a dedicated release disables its controller entirely.
  controllerEnabled: true
  # Shared-release scope guard for mixed fleets: comma-separated orgs that
  # DEDICATED releases own — this release's controller will not manage their
  # cells (GRAPHDEN_FLEET_EXCLUDE_ORGS; docs/FLEET_DEPLOY.md § Dedicated
  # tenant shard). Dedicated releases need nothing here: their scope IS
  # executorOrgs.
  excludeOrgs: ""
  controllerPeriodMs: 30000
  sustainTicks: 3
  minImprovement: "0.0"
  maxMoves: "" # empty ⇒ unbounded

# Boot is slow (package load + type-check sweep + eager compile, ~35-110s), so
# the startup probe grants a generous budget before liveness starts counting.
probes:
  startupPeriodSeconds: 10
  startupFailureThreshold: 30 # 30 * 10s = 5 min boot budget
  livenessPeriodSeconds: 30
  readinessPeriodSeconds: 10

# Extra env (name/value) appended to every pod.
extraEnv: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

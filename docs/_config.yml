# GitHub Pages build of docs/ (.github/workflows/pages.yml). Only the site
# metadata and the theme live here; the auto plugins (readme-index,
# relative-links, optional-front-matter, default-layout) come with the
# GitHub Pages Jekyll build itself.
title: Graphden documentation
description: Programs stored as a typed graph in a database — the docs.
url: https://docs.graphden.dev
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: true
readme_index:
  enabled: true
exclude:
  - _config.yml
  - devtour/tour.edn
  - devtour/large-forms.edn

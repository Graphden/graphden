-get resolver form (stage 1 writers + stage 2a\n      ;; boot migration converted every row before this drop). The\n      ;; :override-kind ENUM declaration stays until a retire-enum\n      ;; mechanism exists — an unused pg enum type is inert.\n      (ds/retire-field :binding :override-kind binding-override-kind-field-uuid)))","gi":21},{"say":"The runtime link between a field-spec's declared type and an\n           actual value: one predicate per abstract type, permissive on\n           unknown types. `storage/protocol/crud_validation` runs this on\n           every write — the live value-validation path (the old parallel\n           malli validate-entity pipeline was dead code and is gone).","defn":"valid-type?","ns":"graphden.schema.fields.types","n":7,"file":"src/graphden/schema/fields/types.clj","lang":"clj","line":160,"code":"(defn valid-type?\n  \"Returns true if value matches the expected type.\n   Returns true for unknown types (forward compatibility).\"\n  [type-kw value]\n  (if-let [validator (get type-validators type-kw)]\n    (validator value)\n    true))","gi":22},{"say":"The record every resolver returns: the entity collections plus\n           by-fn / by-binding indexes. Know this shape first and the two\n           resolvers below read easily — they all just fill it in.","defn":"ExecutionGraphResult","ns":"graphden.storage.protocol.graph","n":8,"file":"src/graphden/storage/protocol/graph.clj","lang":"clj","line":159,"code":"(defrecord ExecutionGraphResult\n  [fns slots fn-slots bindings list-items\n   fn-slots-by-fn bindings-by-fn items-by-binding])","gi":23},{"say":"Builds that record and its O(1) convenience indexes — the shared\n           `assemble the result` step both backends funnel into.","defn":"->execution-graph","ns":"graphden.storage.protocol.graph","n":9,"file":"src/graphden/storage/protocol/graph.clj","lang":"clj","line":169,"code":"(defn ->execution-graph\n  \"Creates an ExecutionGraphResult record from a map carrying the\n   slot/fn-slot/binding entities. Builds convenience indexes.\"\n  [{:keys [fns slots fn-slots bindings list-items]\n    :or {slots [] fn-slots [] bindings [] list-items []}}]\n  (when-not (map? fns)\n    (throw (ex-info \"ExecutionGraphResult requires :fns map\"\n                    {:type :invalid-data :received (type fns)})))\n  (when (empty? fns)\n    (throw (ex-info \"ExecutionGraphResult :fns must contain at least the target fn\"\n                    {:type :invalid-data :hint \"Check that fn-id exists in storage\"})))\n  (->ExecutionGraphResult\n    fns\n    (vec slots)\n    (vec fn-slots)\n    (vec bindings)\n    (vec list-items)\n    (index-by-key :fn-id fn-slots)\n    (index-by-key :fn-id bindings)\n    (index-by-key :binding-id list-items)))","gi":24},{"say":"Expands one fn during traversal, extracting its outgoing edges:\n           parent-ids, base / element / return-type, and binding + list-item\n           `ref-fn-id`s. This function IS the authoritative definition of what\n           counts as a graph edge.","defn":"process-fn-node","ns":"graphden.storage.protocol.graph","n":10,"file":"src/graphden/storage/protocol/graph.clj","lang":"clj","line":267,"code":"(defn process-fn-node\n  \"Process one fn during BFS. Loaders return: fn record, fn-slot\n   junctions, bindings, and per-binding items. Returns\n   {:fns :fn-slots :bindings :list-items :new-fn-refs}.\"\n  [{:keys [load-fn-record load-fn-slots-for-fn\n           load-bindings-for-fn load-items-for-binding]}\n   current-fn-id state]\n  (let [{:keys [fns fn-slots bindings list-items]} state]\n    (if-let [fn-rec (load-fn-record current-fn-id)]\n      (let [fs   (load-fn-slots-for-fn current-fn-id)\n            bs   (load-bindings-for-fn current-fn-id)\n            items (mapcat (fn [b] (load-items-for-binding (:id b))) bs)\n            ref-from-bs (extract-fn-refs-from-bindings bs)\n            ref-from-items (extract-fn-refs-from-items items)\n            parent-refs (into #{} (remove nil?) (:parent-ids fn-rec))\n            type-refs (into #{}\n                            (keep #(get fn-rec %))\n                            [:base-fn-id :element-fn-id :return-type-fn-id])]\n        {:fns        (assoc fns current-fn-id fn-rec)\n         :fn-slots   (into fn-slots fs)\n         :bindings   (into bindings bs)\n         :list-items (into list-items items)\n         :new-fn-refs (reduce into #{}\n                              [ref-from-bs ref-from-items parent-refs type-refs])})\n      (assoc state :new-fn-refs #{}))))","gi":25},{"say":"The backend-agnostic BFS driver: keep calling `process-fn-node`\n           until the reachable closure is exhausted. This is the reference\n           algorithm the Postgres recursive CTE mirrors.","defn":"resolve-execution-graph-bfs","ns":"graphden.storage.protocol.graph","n":11,"file":"src/graphden/storage/protocol/graph.clj","lang":"clj","line":294,"code":"(defn resolve-execution-graph-bfs\n  \"Shared BFS resolution for the slot/fn-slot/binding model. Loaders:\n     :load-fn-record         (fn [fn-id] → fn-row)\n     :load-fn-slots-for-fn   (fn [fn-id] → [fn-slot-row …])\n     :load-bindings-for-fn   (fn [fn-id] → [binding-row …])\n     :load-items-for-binding (fn [binding-id] → [item-row …])\n     :load-all-slots         (fn [] → [slot-row …])\n\n   Slots are pulled in bulk (no per-fn lookup) since they're a small\n   immutable set that's shared across fns via fn-slot junctions.\"\n  [{:keys [load-all-slots] :as loaders} fn-id]\n  (loop [to-visit #{fn-id}\n         visited #{fn-id}\n         state {:fns {} :fn-slots [] :bindings [] :list-items []}\n         iter-count 0]\n    (check-graph-iteration-limit! iter-count fn-id)\n    (if (empty? to-visit)\n      (->execution-graph (assoc state :slots (load-all-slots)))\n      (let [current-id (first to-visit)\n            rest-to-visit (disj to-visit current-id)\n            {:keys [new-fn-refs] :as state'}\n            (process-fn-node loaders current-id state)\n            new-to-visit (set/difference new-fn-refs visited)\n            new-visited (set/union visited new-to-visit)]\n        (recur (set/union rest-to-visit new-to-visit)\n               new-visited\n               (dissoc state' :new-fn-refs)\n               (inc iter-count))))))","gi":26},{"say":"The default `ExecutionGraph` implementation — it wires the\n           `StorageCRUD` loaders into the BFS. Correct on any backend, but it\n           costs ~4N round-trips, which is exactly what motivates the Postgres\n           specialization next.","defn":"resolve-execution-graph","ns":"graphden.storage.protocol.generic-graph","n":12,"file":"src/graphden/storage/protocol/generic_graph.clj","lang":"clj","line":36,"code":"(defn resolve-execution-graph\n  \"Resolve the complete graph reachable from `fn-id` via parent-ids,\n   ref-fn-id (binding & list-item), and type-fn-id traversal.\"\n  [storage fn-id]\n  (when-not (sp/read-entity storage :fn fn-id)\n    (throw (ex-info \"Function not found\"\n                    {:type :not-found\n                     :fn-id fn-id})))\n  (graph/resolve-execution-graph-bfs\n    {:load-fn-record         (partial load-fn-record storage)\n     :load-fn-slots-for-fn   (partial load-fn-slots-for-fn storage)\n     :load-bindings-for-fn   (partial load-bindings-for-fn storage)\n     :load-items-for-binding (partial load-items-for-binding storage)\n     :load-all-slots         #(load-all-slots storage)}\n    fn-id))","gi":27,"see":[{"gi":17,"label":"StorageCRUD"}]},{"say":"The concrete Postgres backend. Its `ExecutionGraph` extension\n           delegates to the Postgres resolver instead of the generic BFS —\n           showing how a backend overrides the default path when it can do\n           better.","defn":"PostgresStorage","ns":"graphden.storage.postgres.core","n":13,"file":"src/graphden/storage/postgres/core.clj","lang":"clj","line":134,"code":"(defrecord PostgresStorage\n  [pool metadata-cache ^ReentrantReadWriteLock rw-lock slot-row-cache]\n\n  sp/Storage\n\n  (initialize\n    [_this schema]\n    (sp/with-write-lock rw-lock\n                        (fn []\n                          ;; Invalidate cache BEFORE migration to prevent stale reads.\n                          ;;\n                          ;; Why invalidate before, not after?\n                          ;; - If we invalidate after and migration partially fails (DDL succeeds\n                          ;;   but metadata update fails), concurrent readers during recovery\n                          ;;   would still see old cached metadata while DB has new schema.\n                          ;; - By invalidating before, any read during/after migration will\n                          ;;   fetch fresh state from DB, ensuring consistency.\n                          ;; - The write lock prevents concurrent reads during the critical section,\n                          ;;   so this is safe even with eager invalidation.\n                          ;;\n                          ;; If migration throws, cache stays nil - next read refreshes from DB.\n                          ;; This is correct: DB state is authoritative, cache is just optimization.\n                          (reset! metadata-cache nil)\n                          ;; Schema (re)init is the one lifecycle point where\n                          ;; previously-read slot rows can stop being true\n                          ;; (test fixtures DROP SCHEMA CASCADE, deploy\n                          ;; truncates) — drop the immutable-row cache with it.\n                          (reset! slot-row-cache {})\n                          (migration/do-initialize pool schema))))\n\n\n  (close\n    [_this]\n    (sp/with-write-lock rw-lock\n                        (fn []\n                          ;; Clear cache first to prevent memory leak from stale references\n                          (reset! metadata-cache nil)\n                          (pool/close-pool pool)))\n    nil)\n\n\n  sp/StorageIntrospection\n\n  (current-entities\n    [_this]\n    (into #{} (map util/snake->kw) (introspection/current-tables pool)))\n\n\n  (current-fields\n    [_this entity-name]\n    ;; O(1) lookup via pre-built :fields-by-entity index\n    ;; Index already contains {field-name {:type t :nullable? n}} format\n    ;; get returns nil if entity doesn't exist - no redundant check needed\n    (when-let [cached-metadata (get-cached-metadata pool metadata-cache rw-lock)]\n      (get (:fields-by-entity cached-metadata) entity-name)))\n\n\n  (current-enums\n    [_this]\n    (into #{} (map util/snake->kw) (introspection/current-pg-enums pool)))\n\n\n  (current-enum-values\n    [_this enum-name]\n    (let [enum-vals (introspection/current-enum-values-pg pool (util/kw->snake-case enum-name))]\n      (when (seq enum-vals) enum-vals)))\n\n\n  (schema-metadata\n    [_this]\n    (get-cached-metadata pool metadata-cache rw-lock))\n\n\n  sp/StorageCRUD\n\n  (create-entity\n    [_this entity-name data]\n    (crud/create-entity pool entity-name data\n                        (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (read-entity\n    [_this entity-name id]\n    ;; :slot identity rows are immutable post-create and never deleted\n    ;; (no update/delete call site repo-wide), yet they are read one-at-\n    ;; a-time on every value-form / binding type-check / provenance /\n    ;; cross-org-ref guard — 163k single-row lookups on a 1.6k-row table\n    ;; in one demo window. Cache the RAW row per storage instance (below\n    ;; the org-scoping wrapper, whose own? gate still runs on every\n    ;; read). nil results are NOT cached — a slot created later by\n    ;; another instance must stay readable.\n    (if (= :slot entity-name)\n      (or (get @slot-row-cache id)\n          (when-some [row (crud/read-entity pool entity-name id\n                                            (get-entity-fields pool metadata-cache rw-lock entity-name))]\n            (swap! slot-row-cache assoc id row)\n            row))\n      (crud/read-entity pool entity-name id\n                        (get-entity-fields pool metadata-cache rw-lock entity-name))))\n\n\n  (update-entity\n    [_this entity-name id data]\n    ;; No live code path mutates :slot; the eviction is insurance so a\n    ;; future mutation path cannot silently serve a stale cached row.\n    (when (= :slot entity-name) (swap! slot-row-cache dissoc id))\n    (crud/update-entity pool entity-name id data\n                        (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (delete-entity\n    [_this entity-name id]\n    (when (= :slot entity-name) (swap! slot-row-cache dissoc id))\n    (crud/delete-entity pool entity-name id))\n\n\n  (query-entities\n    [_this entity-name where]\n    (crud/query-entities pool entity-name where\n                         (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (query-entities\n    [_this entity-name where opts]\n    (crud/query-entities pool entity-name where\n                         (get-entity-fields pool metadata-cache rw-lock entity-name)\n                         opts))\n\n\n  (query-latest-per-group\n    [_this entity-name where group-cols]\n    (crud/query-latest-per-group pool entity-name where group-cols\n                                 (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  sp/StorageBatchCRUD\n\n  (create-entities\n    [_this entity-name data-seq]\n    (crud/create-entities pool entity-name data-seq\n                          (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (read-entities\n    [_this entity-name ids]\n    (crud/read-entities pool entity-name ids\n                        (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (update-entities\n    [_this entity-name data-seq]\n    (crud/update-entities pool entity-name data-seq\n                          (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (upsert-entities\n    [_this entity-name data-seq]\n    (crud/upsert-entities pool entity-name data-seq\n                          (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (delete-entities\n    [_this entity-name ids]\n    (crud/delete-entities pool entity-name ids))\n\n\n  (query-ref-many-owners\n    [_this entity-name field-name target-id]\n    (junction/read-junction-owners pool entity-name field-name target-id))\n\n\n  sp/GraphConstraints\n\n  (validate-no-dependency-cycle!\n    [this owner-fn-id ref-fn-id]\n    (gc/validate-no-dependency-cycle! this owner-fn-id ref-fn-id))\n\n\n  sp/ExecutionGraph\n\n  (resolve-execution-graph\n    [this fn-id]\n    (graph/resolve-execution-graph pool this fn-id))\n\n\n  sp/StorageErrorClassifier\n\n  (classify-error\n    [_this exception]\n    (sp/classify-error (util/create-error-classifier) exception))\n\n\n  (wrap-error\n    [_this exception operation context]\n    (sp/wrap-error (util/create-error-classifier) exception operation context)))","gi":28},{"say":"Nobody hand-writes DDL here: the schema of the previous steps is\n           DATA, and this diffs it against the metadata table to emit exactly\n           the changes needed — first-init or migration, all in one\n           transaction. Read the docstring for the fleet property that makes\n           it safe: a transaction-scoped advisory lock taken BEFORE the state\n           read, so N pods booting against one database serialize, and the\n           second one computes a no-op instead of re-planning against\n           pre-DDL state. This is why a graphden upgrade needs no DB reset\n           (docs/OPERATIONS.md).","defn":"do-initialize","ns":"graphden.storage.postgres.migration","n":14,"file":"src/graphden/storage/postgres/migration.clj","lang":"clj","line":286,"code":"(defn do-initialize\n  \"Performs schema initialization/migration.\n\n   The whole read → plan → DDL section is serialized ACROSS A FLEET by a\n   transaction-scoped advisory lock. Without it, N pods booting against one DB\n   each run schema DDL concurrently (ACCESS EXCLUSIVE contention / deadlock)\n   AND compute their migration plan against stale pre-DDL state. A pod blocks\n   on `pg_advisory_xact_lock` until it holds the lock, THEN reads the (possibly\n   just-migrated) schema and computes a no-op if a sibling already ran; the\n   lock auto-releases on commit/rollback — no leak on crash, and no extra\n   connection so no pool-size deadlock. Uncontended (single pod) it is ~free.\n\n   All DDL + metadata run in the one transaction — atomic, either all changes\n   succeed or none do. Logs a summary of changes at info level.\"\n  [ds schema]\n  ;; Pure pre-checks (no DB) — cheap, keep outside the transaction/lock.\n  (util/check-snake-case-collisions! {:context \"entities\"} (ds/entities schema))\n  (run! #(check-entity-field-collisions! schema %) (ds/entities schema))\n  (util/check-snake-case-collisions! {:context \"enums\"} (keys (ds/enums schema)))\n\n  (let [{:keys [changes first-init?]}\n        (jdbc/with-transaction [tx ds]\n                               ;; Block until this pod holds the fleet migration lock, THEN read\n                               ;; state — so a sibling that migrated first is seen and this pod\n                               ;; computes a no-op instead of re-running first-init against a stale\n                               ;; empty-DB plan.\n                               (util/exec! tx [\"SELECT pg_advisory_xact_lock(?)\" migration-advisory-lock-key] {})\n                               (metadata/ensure-metadata-table! tx)\n                               (graph-epoch/ensure-sequence! tx)\n                               (let [old-metadata (metadata/parse-metadata (metadata/read-metadata-rows tx))\n                                     first-init? (nil? old-metadata)]\n                                 {:first-init? first-init?\n                                  :changes (if first-init?\n                                             (do-first-init! tx schema)\n                                             (do-migration! tx schema old-metadata))}))]\n    (log-migration-summary changes first-init?)\n    changes))","gi":29},{"say":"The `WITH RECURSIVE` CTE that walks every outgoing edge from the\n           seed fn in one statement and returns the reachable `fn.id` set. This\n           is the heart of the recursive-CTE traversal, mirroring in SQL exactly\n           the edge list that `process-fn-node` computes in Clojure.","defn":"reachable-fns-sql","ns":"graphden.storage.postgres.graph","n":15,"file":"src/graphden/storage/postgres/graph.clj","lang":"clj","line":44,"code":"(def ^:private reachable-fns-sql\n  \"Recursive CTE that, given a seed fn-id, returns every fn-id\n   reachable through the execution-graph edges. The recursive term\n   uses a `LATERAL` subquery so each iteration of the recursion\n   evaluates ALL outgoing-edge sources for the row it expanded —\n   the alternative (one UNION arm per source, each rejoining\n   `reachable`) is harder to read and Postgres plans it the same.\n\n   `?::uuid` is the seed parameter. `DISTINCT` at the end collapses\n   the multi-source duplicates the recursion produces (e.g. the\n   same fn reached via parent and via a ref binding).\"\n  (str\n    \"WITH RECURSIVE reachable(fn_id) AS (\"\n    \"  SELECT ?::uuid\"\n    \"  UNION\"\n    \"  SELECT child.fn_id\"\n    \"  FROM reachable r\"\n    \"  CROSS JOIN LATERAL (\"\n    ;;     parent-ids junction\n    \"    SELECT j.target_id AS fn_id\"\n    \"      FROM fn_parent_ids j WHERE j.owner_id = r.fn_id\"\n    \"    UNION ALL\"\n    ;;     fn-row scalar FKs\n    \"    SELECT f.base_fn_id\"\n    \"      FROM fn f WHERE f.id = r.fn_id AND f.base_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    \"    SELECT f.element_fn_id\"\n    \"      FROM fn f WHERE f.id = r.fn_id AND f.element_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    \"    SELECT f.return_type_fn_id\"\n    \"      FROM fn f WHERE f.id = r.fn_id AND f.return_type_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    ;;     binding outgoing refs (ref + type-override)\n    \"    SELECT b.ref_fn_id\"\n    \"      FROM binding b\"\n    \"      WHERE b.fn_id = r.fn_id AND b.ref_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    \"    SELECT b.type_override_fn_id\"\n    \"      FROM binding b\"\n    \"      WHERE b.fn_id = r.fn_id AND b.type_override_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    ;;     binding-list-item refs (sequence elements)\n    \"    SELECT bli.ref_fn_id\"\n    \"      FROM binding_list_item bli\"\n    \"      JOIN binding b ON bli.binding_id = b.id\"\n    \"      WHERE b.fn_id = r.fn_id AND bli.ref_fn_id IS NOT NULL\"\n    \"  ) child\"\n    \"  WHERE child.fn_id IS NOT NULL\"\n    \")\"\n    \" SELECT DISTINCT fn_id FROM reachable\"))","gi":30,"see":[{"gi":25,"label":"process-fn-node"}]},{"say":"The optimized resolver: run the CTE to get reachable ids, enforce\n           the graph-size cap, bulk-load fn / slot / binding rows with five\n           `IN`-clause queries, and hand off to `->execution-graph`. O(1)\n           round-trips versus the generic O(N) — the payoff of the whole\n           protocol split.","defn":"resolve-execution-graph","ns":"graphden.storage.postgres.graph","n":16,"file":"src/graphden/storage/postgres/graph.clj","lang":"clj","line":109,"code":"(defn resolve-execution-graph\n  \"PostgreSQL-optimised resolver. Two phases:\n\n     1. CTE walk → set of reachable fn-ids.\n     2. Bulk-load fn / fn-slot / binding / binding-list-item via\n        `sp/query-entities` with `{:id [...]}` (or `{:fn-id [...]}` /\n        `{:binding-id [...]}`) IN-clauses. Slot rows are loaded in\n        bulk too — matches the generic resolver's behaviour. Codec /\n        junction / field-spec handling all flow through the standard\n        CRUD path so the returned `ExecutionGraphResult` is\n        bit-identical to the generic version.\"\n  [ds storage fn-id]\n  (when-not (sp/read-entity storage :fn fn-id)\n    (throw (ex-info \"Function not found\"\n                    {:type :not-found\n                     :fn-id fn-id})))\n  (let [fn-ids (reachable-fn-ids ds fn-id)]\n    ;; Same guard the generic BFS enforces (`check-graph-iteration-limit!`)\n    ;; — bound the closure size so a runaway / data-corruption graph throws\n    ;; a clean `:execution-error/graph-too-large` instead of silently\n    ;; bulk-loading an unbounded set into memory. The CTE dedups via UNION\n    ;; so a cycle can't spin forever, but a pathologically wide closure can\n    ;; still be huge; cap it at `*max-graph-iterations*` reachable fns.\n    (when (> (count fn-ids) sp/*max-graph-iterations*)\n      (throw (ex-info \"Execution graph resolution exceeded maximum iterations\"\n                      {:type :execution-error/graph-too-large\n                       :fn-id fn-id\n                       :max-iterations sp/*max-graph-iterations*\n                       :iteration-count (count fn-ids)})))\n    (if (empty? fn-ids)\n      ;; Defensive — the CTE always emits at least the seed; an\n      ;; empty result implies the seed row vanished between the\n      ;; existence check above and the CTE run. Fall through to the\n      ;; generic resolver so the user sees the same not-found error\n      ;; shape rather than an empty graph.\n      (generic/resolve-execution-graph storage fn-id)\n      (let [fns          (sp/query-entities storage :fn        {:id fn-ids})\n            fn-slots     (sp/query-entities storage :fn-slot   {:fn-id fn-ids})\n            bindings     (sp/query-entities storage :binding   {:fn-id fn-ids})\n            binding-ids  (into #{} (map :id) bindings)\n            list-items   (if (seq binding-ids)\n                           (sp/query-entities storage :binding-list-item\n                                              {:binding-id binding-ids})\n                           [])\n            ;; Slot rows the closure can REACH = those named by the\n            ;; loaded fn-slots' :slot-id. Every downstream consumer\n            ;; (lookups/build-lookups, executor/composition) looks\n            ;; slots up only via `(get slot-map (:slot-id fs))` —\n            ;; nothing reaches a slot outside the fn-slot junction\n            ;; set, so the narrower query is sufficient. Pre-fix this\n            ;; loaded EVERY slot on every recursive-CTE resolve.\n            slot-ids     (into #{} (keep :slot-id) fn-slots)\n            slots        (if (seq slot-ids)\n                           (sp/query-entities storage :slot {:id (vec slot-ids)})\n                           [])\n            fns-map      (into {} (map (juxt :id identity)) fns)]\n        (graph/->execution-graph\n          {:fns fns-map\n           :slots slots\n           :fn-slots fn-slots\n           :bindings bindings\n           :list-items list-items})))))","gi":31,"see":[{"gi":24,"label":"->execution-graph"}]}]},{"id":":versioning","title":"Branches & versioning","status":"toured","summary":"The VersionedStorage decorator, per-branch resolution, diff/merge\n             and branch-local? propagation.","paths":["src/graphden/versioning/","src/graphden/system/branch_router.clj"],"after":[":storage"],"steps":[{"say":"The entry point: take any base storage, ensure a `main` branch\n           exists, and return a `VersionedStorage` bound to it. Start here to\n           see how the entire versioning layer is bolted onto the plain storage\n           from the previous block.","defn":"wrap-with-versioning","ns":"graphden.versioning.storage.core","n":1,"file":"src/graphden/versioning/storage/core.clj","lang":"clj","line":1062,"code":"(defn wrap-with-versioning\n  \"Wraps a storage with versioning support.\n\n   Creates a 'main' branch if it doesn't exist.\n   Returns a VersionedStorage on the main branch.\n\n   Arguments:\n   - base-storage: Any storage implementing Storage protocols, initialized with\n     versioned-data-schema (or compatible schema that includes version entities)\n\n   Example:\n   (def schema (vds/build-schema (mds/create-builder)))\n   (def base (-> (pg/create-storage config) (sp/initialize-with-cleanup! schema)))\n   (def storage (wrap-with-versioning base))\"\n  ([base-storage]\n   (wrap-with-versioning base-storage \"main\"))\n  ([base-storage branch-name]\n   (let [branch-id (if (= branch-name \"main\")\n                     (ensure-main-branch! base-storage)\n                     (let [existing (sp/query-entities base-storage :branch\n                                                       {:name branch-name})]\n                       (if (seq existing)\n                         (:id (first existing))\n                         (throw (ex-info \"Branch not found\"\n                                         {:type :not-found\n                                          :branch-name branch-name})))))]\n     (->VersionedStorage base-storage branch-id))))","gi":32},{"say":"The decorator record itself. It implements every storage protocol,\n           delegating non-versioned entities straight to the base storage and\n           intercepting versioned ones — reads resolve to a branch view, writes\n           append version rows. Every method is a two-line dispatch: read this\n           for the SHAPE, then follow the versioned arm into its own function.\n           Grasp this structure before anything else here.","defn":"VersionedStorage","ns":"graphden.versioning.storage.core","n":2,"file":"src/graphden/versioning/storage/core.clj","lang":"clj","line":823,"code":"(defrecord VersionedStorage\n  [base-storage branch-id]\n\n  sp/Storage\n\n  (initialize\n    [_ schema]\n    (sp/initialize base-storage schema))\n\n\n  (close\n    [_]\n    (sp/close base-storage))\n\n\n  sp/StorageIntrospection\n\n  (current-entities\n    [_]\n    (sp/current-entities base-storage))\n\n\n  (current-fields\n    [_ entity-name]\n    (sp/current-fields base-storage entity-name))\n\n\n  (current-enums\n    [_]\n    (sp/current-enums base-storage))\n\n\n  (current-enum-values\n    [_ enum-name]\n    (sp/current-enum-values base-storage enum-name))\n\n\n  (schema-metadata\n    [_]\n    (sp/schema-metadata base-storage))\n\n\n  sp/StorageCRUD\n\n  (create-entity\n    [_ entity-name data]\n    (epoch/bump! base-storage entity-name)\n    (if-not (res/versioned-entity? entity-name)\n      (sp/create-entity base-storage entity-name data)\n      (create-entity-versioned! base-storage branch-id entity-name data)))\n\n\n  (read-entity\n    [_ entity-name id]\n    (if-not (res/versioned-entity? entity-name)\n      (sp/read-entity base-storage entity-name id)\n      (res/resolve-entity base-storage entity-name id branch-id)))\n\n\n  (update-entity\n    [_ entity-name id data]\n    (epoch/bump! base-storage entity-name)\n    (if-not (res/versioned-entity? entity-name)\n      (sp/update-entity base-storage entity-name id data)\n      (update-entity-versioned! base-storage branch-id entity-name id data)))\n\n\n  (delete-entity\n    [_ entity-name id]\n    (epoch/bump! base-storage entity-name)\n    (cond\n      (not (res/versioned-entity? entity-name))\n      (sp/delete-entity base-storage entity-name id)\n\n      ;; User-facing delete: tombstone so an inherited entity is hidden too.\n      *tombstone-delete?*\n      (tombstone-version! base-storage entity-name id branch-id)\n\n      ;; Hard delete (sync / rollback): drop this branch's own version\n      ;; rows, and — when no other branch retains a version — the\n      ;; identity row too, so no versionless ghost survives to swallow\n      ;; a later re-mint of the same deterministic id.\n      :else\n      (hard-delete-entity! base-storage branch-id entity-name id)))\n\n\n  (query-entities\n    [_ entity-name where]\n    (if-not (res/versioned-entity? entity-name)\n      (sp/query-entities base-storage entity-name where)\n      ;; Branch chain cache is process-wide (`global-chain-cache`)\n      ;; — no per-call binding needed.\n      (res/resolve-all-entities base-storage entity-name branch-id where)))\n\n\n  (query-entities\n    [this entity-name where opts]\n    (cond\n      (or (nil? opts) (empty? opts))\n      (sp/query-entities this entity-name where)\n\n      (res/versioned-entity? entity-name)\n      ;; Versioned reads run a deduplicate-by-id resolver that\n      ;; collapses N version rows into ≤ N base rows. Applying\n      ;; ORDER BY / LIMIT at the SQL layer would happen BEFORE that\n      ;; dedup and silently return the wrong page. Refuse rather\n      ;; than mislead — callers that need pagination over a\n      ;; versioned table should fetch + page in memory.\n      (throw (ex-info (str \"query-entities :opts not supported on versioned entity \"\n                           entity-name \" — pagination must run after version resolution\")\n                      {:type :storage-error/unsupported-opts\n                       :entity-name entity-name :opts opts}))\n\n      :else\n      (sp/query-entities base-storage entity-name where opts)))\n\n\n  (query-latest-per-group\n    [_ entity-name where group-cols]\n    ;; Pure pass-through to the base storage. The resolver layer\n    ;; (resolution/load-merge-aware-cache) drives this method\n    ;; against version-entity tables directly; it is NOT meant to be\n    ;; invoked on identity tables through VersionedStorage's\n    ;; resolution wrap. If a future caller asks for dedup on a\n    ;; versioned IDENTITY entity, we'd need a parallel resolution\n    ;; path — defer until that materialises.\n    (sp/query-latest-per-group base-storage entity-name where group-cols))\n\n\n  sp/StorageBatchCRUD\n\n  (create-entities\n    [_ entity-name data-seq]\n    (epoch/bump! base-storage entity-name)\n    (if-not (res/versioned-entity? entity-name)\n      (sp/create-entities base-storage entity-name data-seq)\n      (create-entities-versioned! base-storage branch-id entity-name data-seq)))\n\n\n  (read-entities\n    [_ entity-name ids]\n    (if-not (res/versioned-entity? entity-name)\n      (sp/read-entities base-storage entity-name ids)\n      ;; Batch resolve: load identity records, then batch resolve versions\n      (let [identity-records (vals (sp/read-entities base-storage entity-name ids))]\n        (res/resolve-entities-batch base-storage entity-name identity-records branch-id))))\n\n\n  (update-entities\n    [_ entity-name data-seq]\n    (epoch/bump! base-storage entity-name)\n    (if-not (res/versioned-entity? entity-name)\n      (sp/update-entities base-storage entity-name data-seq)\n      (update-entities-versioned! base-storage branch-id entity-name data-seq)))\n\n\n  (upsert-entities\n    [this entity-name data-seq]\n    (if-not (res/versioned-entity? entity-name)\n      (sp/upsert-entities base-storage entity-name data-seq)\n      ;; For versioned: batch check existence in BASE storage (no version\n      ;; resolution), then create/update accordingly. The identity probe is\n      ;; deliberately the cheap one — boot syncs thousands of fn-defs through\n      ;; here, and resolving every id's version chain up front turned the\n      ;; O(n) read into O(n × versions) and stalled startup.\n      (let [ids (keep :id data-seq)\n            existing-ids (if (seq ids)\n                           (set (keys (sp/read-entities base-storage entity-name (vec ids))))\n                           #{})\n            {to-update true to-create false}\n            (group-by #(contains? existing-ids (:id %)) data-seq)]\n        ;; Batch create new records\n        (when (seq to-create)\n          (sp/create-entities this entity-name to-create))\n        ;; Batch update existing records\n        (when (seq to-update)\n          (revive-or-update! this entity-name to-update))\n        ;; Return all records\n        (vec data-seq))))\n\n\n  (delete-entities\n    [_ entity-name ids]\n    (epoch/bump! base-storage entity-name)\n    (cond\n      (not (res/versioned-entity? entity-name))\n      (sp/delete-entities base-storage entity-name ids)\n\n      *tombstone-delete?*\n      (count (filterv #(tombstone-version! base-storage entity-name % branch-id) ids))\n\n      :else\n      (hard-delete-entities! base-storage branch-id entity-name ids)))\n\n\n  (query-ref-many-owners\n    [_ entity-name field-name target-id]\n    (live-ref-many-owners base-storage branch-id entity-name field-name target-id))\n\n\n  sp/GraphConstraints\n\n  (validate-no-dependency-cycle!\n    [this owner-fn-id value-fn-id]\n    (gc/validate-no-dependency-cycle! this owner-fn-id value-fn-id))\n\n\n  sp/ExecutionGraph\n\n  (resolve-execution-graph\n    [_ fn-id]\n    ;; Batch resolution loads all data in 4 queries + BFS in memory\n    ;; (avoiding the N+1 ~400-query path). Chain hierarchy lookups\n    ;; consult the process-wide `global-chain-cache` directly.\n    (let [result (res/resolve-execution-graph-batch base-storage fn-id branch-id)]\n      (when (empty? (:fns result))\n        (throw (ex-info \"Function not found\"\n                        {:type :not-found\n                         :fn-id fn-id})))\n      (graph/->execution-graph result))))","gi":33},{"say":"The versioned arm of a single create, and the write path worth\n           reading in full: identity row + version row, the identity-field diff\n           for when the deterministic id already exists, and the advisory-lock\n           branch that serialises the writes whose uniqueness is a per-branch\n           RESOLVED-VIEW property (fn names, list-item positions) rather than a\n           table constraint. `update-entity-versioned!` next to it tells the\n           same story for the append case.","defn":"create-entity-versioned!","ns":"graphden.versioning.storage.core","n":3,"file":"src/graphden/versioning/storage/core.clj","lang":"clj","line":366,"code":"(defn- create-entity-versioned!\n  \"Create one versioned entity: identity row + version row.\"\n  [base-storage branch-id entity-name data]\n  ;; Versioned: create full record in base table + version record.\n  ;; When the identity row already exists (deterministic UUID re-sync),\n  ;; resolve the current version directly from `existing` instead of\n  ;; calling `resolve-entity` (which would re-fetch identity).\n  ;;\n  ;; `normalized` runs the same per-entity write-side rules the base\n  ;; `sp/create-entity` applies internally (notably `:binding`'s\n  ;; `:value-present true` when `:value` is present but the flag\n  ;; isn't). Without this, the BASE row gets `:value-present true`\n  ;; via the base-storage's own normalizer call, but the VERSION\n  ;; row was built off the un-normalized `data` map — every binding\n  ;; created here through CRUD landed in the version table with\n  ;; `:value-present nil`, and versioned reads (which overlay\n  ;; version-data over identity via `merge identity version`) then\n  ;; overwrote the base's `true` back to `nil`. Result: every freshly-\n  ;; created literal-bound arg disappeared from arg-overlays in the\n  ;; editor (the layout walker classifies `value-present=nil` as\n  ;; `:free`, no value-node).\n  (let [id (or (:id data) (random-uuid))\n        normalized (sp/standard-crud-normalize-data entity-name\n                                                    (assoc data :id id))\n        do-create!\n        (fn [st]\n          (uniq/check-list-item-position-collision! st branch-id entity-name normalized)\n          (uniq/check-fn-name-collision! st branch-id entity-name normalized)\n          (uniq/check-resource-override-path-collision! st branch-id entity-name normalized)\n          (let [existing (sp/read-entity st entity-name id)\n                base-row (strip-version-framework-cols entity-name normalized)]\n            (if existing\n              (apply-identity-field-diff!\n                st entity-name id base-row existing\n                (:version-data-fields (get res/entity-config entity-name)))\n              (sp/create-entity st entity-name base-row))\n            (let [{:keys [version-id-field version-data-fields]}\n                  (get res/entity-config entity-name)\n                  current-version (when existing\n                                    (res/resolve-version st entity-name id branch-id))\n                  current-data (when current-version\n                                 (select-keys (merge existing\n                                                     (dissoc current-version\n                                                             :id :branch-id :created-at\n                                                             version-id-field))\n                                              version-data-fields))\n                  new-data (select-keys normalized version-data-fields)]\n              (when (or (nil? current-version) (not= current-data new-data))\n                (create-version-record! st entity-name id branch-id normalized))))\n          normalized)\n        ;; A `:binding-list-item` append's collision check + version insert\n        ;; must be atomic w.r.t. concurrent appends to the SAME binding —\n        ;; otherwise two appends read the same used-positions, compute the\n        ;; same next position, and both insert there, corrupting the\n        ;; per-branch sequence order. (The `(binding,position)` UNIQUE index\n        ;; was dropped because uniqueness is a per-branch RESOLVED-VIEW\n        ;; property, not a base-table one.) Serialize on a per-binding\n        ;; `pg_advisory_xact_lock` (auto-released at commit/rollback): the\n        ;; loser then sees the committed position and its collision check\n        ;; fires loudly instead of silently double-inserting. Named-:fn\n        ;; creates ride the same mechanism keyed on (branch, ns, name) —\n        ;; their retired UNIQUE moved to check-fn-name-collision! too.\n        lock-key (or (when (and (= entity-name :binding-list-item)\n                                (:binding-id normalized))\n                       (str (:binding-id normalized)))\n                     (uniq/fn-name-lock-key branch-id entity-name normalized)\n                     (uniq/resource-override-path-lock-key branch-id entity-name normalized))]\n    (cond\n      (and lock-key (:pool base-storage))\n      ;; `:ignore` so any nested `with-transaction` in the create path\n      ;; (`crud/create-entity` opens one to write `:ref-many` junction rows —\n      ;; e.g. a `:fn`'s `:parent-ids`) runs INLINE on this connection instead\n      ;; of committing early. A nested commit would end THIS transaction and\n      ;; release the `pg_advisory_xact_lock` before the collision check +\n      ;; version insert finished, letting a racing same-name create slip\n      ;; through — the (branch, ns, name) serialization would silently break.\n      (binding [jdbc-tx/*nested-tx* :ignore]\n        (jdbc/with-transaction [tx (:pool base-storage)]\n                               (jdbc/execute! tx [\"SELECT pg_advisory_xact_lock(hashtext(?)::bigint)\"\n                                                  lock-key])\n                               (do-create! (assoc base-storage :pool tx))))\n\n      ;; No lock key, but a pooled backend: still wrap the base-row +\n      ;; version-row pair in ONE transaction. Off the lock path the two\n      ;; inserts otherwise run on autocommit as separate statements, so a\n      ;; crash between them leaves a versionless GHOST identity — invisible\n      ;; to resolved reads, only healed later by the `ids-without-chain-\n      ;; version` force-a-version backstop. A plain `:binding` / `:fn-slot`\n      ;; create needs the same crash-atomicity the lock path already gives\n      ;; named-`:fn` / list-item writes, just without the advisory lock.\n      ;; `:ignore` for the same nested-`with-transaction` reason as above.\n      (:pool base-storage)\n      (binding [jdbc-tx/*nested-tx* :ignore]\n        (jdbc/with-transaction [tx (:pool base-storage)]\n                               (do-create! (assoc base-storage :pool tx))))\n\n      :else\n      (do-create! base-storage))))","gi":34},{"say":"The authoritative map of WHICH entities are versioned (fn / fn-slot\n           / binding / binding-list-item) and how each splits across two tables:\n           `version-data-fields` live in the version table, identity fields stay\n           on the base row. Everything downstream keys off this config.","defn":"entity-config","ns":"graphden.versioning.storage.resolution","n":4,"file":"src/graphden/versioning/storage/resolution.clj","lang":"clj","line":93,"code":"(def entity-config\n  \"Configuration for versioned entities. Maps base entity name to\n   version table metadata.\n\n   `:version-data-fields` is DERIVED (`vts/version-data-fields`) from the\n   same base field map the `-version` mirror entity derives from — one\n   source, so the decorator's select-keys can never silently disagree\n   with the mirror's columns (the old hand-kept-triple footgun).\n   `:candidate-bound-keys` stays hand-curated: it is a read-bounding\n   OPTIMIZATION choice (which version-row columns are useful to bound a\n   candidate query on), not derivable from the schema.\n\n   Notes:\n   - `:parent-ids` is NOT in fn version-data-fields — it's a :ref-many\n     stored in a junction table, not versioned (declared identity-level\n     in `vts/mirror-config`).\n   - `:slot` is intentionally absent: slots are immutable post-create\n     (changing the (name, type-fn-id) pair = creating a new slot).\"\n  {:fn {:version-entity :fn-version\n        :version-id-field :fn-id\n        :version-data-fields (vts/version-data-fields :fn)\n        :candidate-bound-keys #{:name :anonymous-hash :base-fn-id\n                                :element-fn-id :return-type-fn-id}}\n\n   :fn-slot {:version-entity :fn-slot-version\n             :version-id-field :fn-slot-id\n             :version-data-fields (vts/version-data-fields :fn-slot)\n             :candidate-bound-keys #{:fn-id :slot-id}}\n\n   :binding {:version-entity :binding-version\n             :version-id-field :binding-id\n             :version-data-fields (vts/version-data-fields :binding)\n             :candidate-bound-keys #{:fn-id :slot-id :ref-fn-id\n                                     :type-override-fn-id}}\n\n   :binding-list-item {:version-entity :binding-list-item-version\n                       :version-id-field :item-id\n                       :version-data-fields (vts/version-data-fields :binding-list-item)\n                       :candidate-bound-keys #{:binding-id :ref-fn-id}}\n\n   :resource-override {:version-entity :resource-override-version\n                       :version-id-field :override-id\n                       :version-data-fields (vts/version-data-fields :resource-override)\n                       :candidate-bound-keys #{:path}}})","gi":35},{"say":"Where the `-version` mirror entities come from: derived from the\n           base entity's field map (refs demote to bare uuids, framework\n           columns spliced in), never hand-copied. A new base column without a\n           pinned mirror uuid or an identity-level declaration fails the build\n           loudly — the old failure mode was the decorator silently dropping\n           that column's writes. `version-data-fields` above derives from the\n           same source, so the two can never disagree.","defn":"derive-version-fields","ns":"graphden.schema.versioned.schema","n":5,"file":"src/graphden/schema/versioned/schema.clj","lang":"clj","line":406,"code":"(defn derive-version-fields\n  \"Derive a `-version` mirror entity's field map from the BASE entity's\n   field map.\n\n   `framework` — the four version-framework columns\n   (`{<id-field> {...ref base} :branch-id {...} :created-at :deleted-at}`),\n   spliced in verbatim.\n   `identity-fields` — base fields that live on the IDENTITY row and never\n   version (structural identity, tenant owner). `:ref-many` fields are\n   junction tables and skip automatically.\n   `uuids` — `{field-name → pinned mirror-column uuid}`. A versioned base\n   field with NO pinned uuid throws at build time: that is the point —\n   the old failure mode was the decorator silently dropping the writes.\n   `tweaks` — `{field-name → spec-merge}` for mirror-only flags\n   (e.g. the explicit `:indexed?` on ref-fn-id — the base column is a\n   real FK and gets its index from the constraint; the mirror's is a\n   bare uuid).\"\n  [entity base-fields {:keys [identity-fields uuids tweaks]} framework]\n  (let [data-fields\n        (into {}\n              (keep (fn [[fname spec]]\n                      (when-not (or (contains? identity-fields fname)\n                                    (= :ref-many (:type spec)))\n                        (let [u (get uuids fname)]\n                          (when-not u\n                            (throw (ex-info\n                                     (str \"No version-mirror column uuid for \"\n                                          entity \"/\" fname\n                                          \" — a new base field must either be \"\n                                          \"declared identity-level or given a \"\n                                          \"pinned mirror uuid here. (Without \"\n                                          \"this check the versioned decorator \"\n                                          \"silently dropped its writes.)\")\n                                     {:entity entity :field fname})))\n                          [fname (-> (mirror-field-spec spec)\n                                     (assoc :uuid u)\n                                     (merge (get tweaks fname)))]))))\n              base-fields)\n        ;; The reverse direction must fail loudly too: a pinned uuid\n        ;; whose base field no longer exists is a leftover from a\n        ;; field removal — silently ignoring it would let the pin map\n        ;; rot indefinitely.\n        orphan-pins (remove #(contains? data-fields %) (keys uuids))]\n    (when (seq orphan-pins)\n      (throw (ex-info (str \"Orphan version-mirror uuid pin(s) for \" entity\n                           \": \" (pr-str (vec orphan-pins))\n                           \" — the base field(s) no longer exist (or went \"\n                           \"identity-level); drop the stale pins.\")\n                      {:entity entity :orphans (vec orphan-pins)})))\n    (merge framework data-fields)))","gi":36},{"say":"The public per-branch read: for one entity, load its version chain,\n           merge in a single batched pass, and return the winning version (nil\n           on a tombstone). This is how a plain read becomes branch-aware.","defn":"resolve-version","ns":"graphden.versioning.storage.resolution","n":6,"file":"src/graphden/versioning/storage/resolution.clj","lang":"clj","line":230,"code":"(defn resolve-version\n  \"Resolves the current version of an entity on a branch.\n\n   Loads the branch chain + every relevant `branch-merge` for the whole\n   chain in ONE batched pass (`load-merge-aware-cache`), then resolves\n   through `resolve-version-from-cache` — the SAME code the batch / graph\n   path already uses. This used to recurse level-by-level, re-querying\n   `:branch-merge` and the parent link at each step (~3 queries × chain\n   depth for a single-entity read on a feature branch); the batched load\n   is a fixed handful of queries regardless of depth, and it collapses\n   the two parallel resolution algorithms (this recursion vs\n   `resolve-version-from-cache`) into one tested implementation.\n\n   Returns the version record or nil.\"\n  [base-storage entity-name entity-id branch-id]\n  (let [{:keys [version-entity version-id-field]} (get entity-config entity-name)\n        {:keys [versions-by-id merges-by-target branch-chain]}\n        (load-merge-aware-cache base-storage version-entity version-id-field\n                                [entity-id] branch-id)\n        version (resolve-version-from-cache base-storage entity-name\n                                            versions-by-id merges-by-target\n                                            entity-id branch-chain)]\n    ;; A tombstone-winner means the entity is deleted on this branch — the\n    ;; public API treats it as absent (nil), same as no version at all.\n    (when-not (tombstone? version) version)))","gi":37},{"say":"The branch-chain walk: `[branch → parent → … → root]` via\n           `:base-branch-id`, memoised process-wide. This inheritance backbone\n           is what every resolve and cache-invalidation consults to know which\n           branches a read can see.","defn":"collect-branch-chain","ns":"graphden.versioning.storage.resolution","n":7,"file":"src/graphden/versioning/storage/resolution.clj","lang":"clj","line":412,"code":"(defn collect-branch-chain\n  \"Returns vector of branch-ids from current to root (for inheritance\n   lookup). When `*branch-chain-cache*` is bound it wins (test\n   isolation); otherwise consults the process-wide\n   `global-chain-cache`, populating on miss.\n\n   Checks `*collect-branch-chain-override*` first (test seam — see its\n   docstring).\n\n   Public because cache invalidation needs the same reachability\n   question the resolver asks: a write on branch W is visible from\n   branch C exactly when W ∈ (collect-branch-chain … C). See\n   `system.branch-router/invalidate-affected-ctxs!`.\"\n  [base-storage branch-id]\n  (if-let [f *collect-branch-chain-override*]\n    (f base-storage branch-id)\n    (let [cache (or *branch-chain-cache* global-chain-cache)]\n      (if-let [cached (get @cache branch-id)]\n        cached\n        (let [chain (collect-branch-chain-impl base-storage branch-id)]\n          (swap! cache assoc branch-id chain)\n          chain)))))","gi":38},{"say":"The in-memory chain walk the resolver actually runs: at each branch\n           level combine own-latest with merge candidates, pick the greatest\n           `effective-ts`, and recurse to the parent. One tested algorithm shared\n           by both single-entity and whole-graph reads.","defn":"resolve-version-from-cache","ns":"graphden.versioning.storage.resolution","n":8,"file":"src/graphden/versioning/storage/resolution.clj","lang":"clj","line":525,"code":"(defn- resolve-version-from-cache\n  \"Resolves version for an entity using pre-loaded `versions-by-id`\n   + `merges-by-target` (built by `load-merge-aware-cache`). Mirrors\n   `resolve-version`'s recursion: at each chain level, combine\n   own-latest with merge-candidates and pick the latest by\n   effective-ts; recurse to parent if nothing matched.\n\n   The old simplified algorithm (chain priority only, no merge\n   support) silently dropped merge-record visibility on the batch\n   path — `/api/graph/entities` and the executor's compiled graph\n   load both went through here, so a `POST /api/branches/X/merge`\n   created the branch-merge row but never affected reads (#52).\n\n   `entity-name` + `base-storage` are threaded down to\n   `merge-candidates-from-cache` so the `:fn` branch-local filter can\n   call `bl/effective-branch-local?`. Non-fn entities skip the check.\"\n  [base-storage entity-name versions-by-id merges-by-target entity-id branch-chain]\n  (when-let [versions (get versions-by-id entity-id)]\n    (let [by-branch (group-by :branch-id versions)]\n      (loop [chain branch-chain]\n        (when-let [bid (first chain)]\n          (let [own-latest (latest-by-created-at (get by-branch bid))\n                merges (get merges-by-target bid)\n                merge-cands (merge-candidates-from-cache base-storage entity-name\n                                                         entity-id by-branch\n                                                         own-latest merges)\n                all-candidates (cond-> []\n                                 own-latest\n                                 (conj {:version own-latest\n                                        :effective-ts (:created-at own-latest)})\n                                 (seq merge-cands)\n                                 (into merge-cands))]\n            (or (pick-latest-candidate all-candidates)\n                (recur (rest chain)))))))))","gi":39},{"say":"Monotonic-OR over the `:parent-ids` closure: a fn (or ANY ancestor)\n           marked `:branch-local? true` is local forever. The resolver's merge\n           filter calls this so runtime-config fns — web-server port, vault\n           path, cron schedule — never leak across branches on merge.","defn":"effective-branch-local?","ns":"graphden.versioning.branch-local","n":9,"file":"src/graphden/versioning/branch_local.clj","lang":"clj","line":109,"code":"(defn effective-branch-local?\n  \"True iff `fn-id` (an identity-side `:fn` row id) or any ancestor\n   in its `:parent-ids` closure has `:branch-local? true`.\n\n   Memoized per storage. Callers in resolution.clj batch this against\n   the same storage handle repeatedly, so the cache keeps the walk\n   O(1) after the first hit. `nil` fn-id returns false (defensive —\n   resolve-entity may pass nil for missing rows).\"\n  [base-storage fn-id]\n  (if (nil? fn-id)\n    false\n    (let [cache (cache-for-storage base-storage)]\n      (if (contains? @cache fn-id)\n        (get @cache fn-id)\n        (let [result (compute-effective base-storage fn-id)]\n          (swap! cache assoc fn-id result)\n          result)))))","gi":40},{"say":"The list-item position-collision guard, now in a shared\n           `uniqueness` namespace so BOTH the write path (`core`) and the\n           merge path (`merge`) enforce it without a require cycle. A\n           cross-branch base index on `(binding-id, position)` would wrongly\n           block divergence, so per-branch uniqueness is enforced here in the\n           resolved view instead — a subtle invariant the write path defends\n           with an advisory lock. Fn names follow the same doctrine:\n           `check-fn-name-collision!` just below replaced the raw\n           `UNIQUE (namespace_id, name)`, whose soft-deleted identities blocked\n           their names forever.","defn":"check-list-item-position-collisions!","ns":"graphden.versioning.storage.uniqueness","n":10,"file":"src/graphden/versioning/storage/uniqueness.clj","lang":"clj","line":25,"code":"(defn check-list-item-position-collisions!\n  \"Per-branch resolved-view check for a WHOLE batch: throw if any item in\n   `check-seq` resolves to a `(binding-id, position)` already taken by\n   ANOTHER item on this branch. Enforces the per-branch resolved-view\n   `UNIQUE (binding-id, position)` invariant — uniqueness is a per-branch\n   resolved-view property, not a cross-branch one (a cross-branch\n   base-table index would wrongly block divergence).\n\n   Skips when `entity-name` isn't `:binding-list-item`. One version query\n   for ALL touched bindings + one resolve pass, regardless of batch size —\n   the singular `check-list-item-position-collision!` delegates here with a\n   one-element seq.\"\n  [base-storage branch-id entity-name check-seq]\n  (when (= :binding-list-item entity-name)\n    (let [candidates (filter #(and (:binding-id %) (some? (:position %))) check-seq)]\n      (when (seq candidates)\n        (let [chain (#'res/collect-branch-chain base-storage branch-id)\n              ;; Merge-aware: a collision can be introduced by a MERGE too —\n              ;; a source-branch item that resolves onto this branch at a\n              ;; position an existing item already holds. Those items live\n              ;; only on the merge SOURCE branch (never on the ancestor\n              ;; chain), so a chain-only scan never enumerates them and the\n              ;; collision slips past. Widen the scan to every branch whose\n              ;; rows can surface on the chain — the ancestor chain PLUS the\n              ;; source of every merge landing on it — mirroring the\n              ;; resolver's own reachability. `resolved-map` below already\n              ;; resolves merge-aware, so once an id is enumerated its\n              ;; winning (chain-or-merged) position is compared correctly.\n              merge-source-bids (into []\n                                      (comp (keep :source-branch-id) (distinct))\n                                      (sp/query-entities base-storage :branch-merge\n                                                         {:target-branch-id (vec chain)}))\n              scan-bids (into (vec chain) merge-source-bids)\n              ;; Every item-version on the touched bindings' reachable\n              ;; branches. The SQL WHERE narrows to those bindings so we\n              ;; don't scan the whole version table.\n              versions (sp/query-entities base-storage :binding-list-item-version\n                                          {:binding-id (vec (distinct (map :binding-id candidates)))\n                                           :branch-id scan-bids})\n              versions-by-binding (group-by :binding-id versions)\n              ;; Resolve every touched item ONCE — the collision rule\n              ;; applies to the LIVE branch view, not raw version rows.\n              ;; Items WITHOUT a version on the chain resolve to nil / a bare\n              ;; off-branch row and can't collide; only touched item-ids\n              ;; (those carrying a chain version) are considered.\n              all-touched-ids (into #{} (map :item-id) versions)\n              resolved-map (if (seq all-touched-ids)\n                             (into {} (res/resolve-entities-batch\n                                        base-storage :binding-list-item\n                                        (vals (sp/read-entities base-storage :binding-list-item\n                                                                (vec all-touched-ids)))\n                                        branch-id))\n                             {})\n              ;; The batch's OWN writes overlay the resolved view: an\n              ;; item this same batch moves elsewhere no longer holds\n              ;; its old position, so a batched permutation (declarative\n              ;; re-sync of reordered items, merge surfacing a reorder)\n              ;; checks against the POST-batch view. Without this, any\n              ;; position swap between two syncs deadlocked the sync\n              ;; forever — each item's new position \"collided\" with a\n              ;; sibling that was itself moving away in the same batch.\n              pending (into {} (map (juxt :id :position)) candidates)]\n          (doseq [{:keys [binding-id position id]} candidates]\n            (let [touched-ids (distinct\n                                (map :item-id (get versions-by-binding binding-id)))\n                  collisions (for [eid touched-ids\n                                   :let [row (get resolved-map eid)\n                                         eff-pos (if (contains? pending eid)\n                                                   (get pending eid)\n                                                   (:position row))]\n                                   :when (and (some? row)\n                                              (not= eid id)\n                                              (= position eff-pos))]\n                               eid)]\n              (when (seq collisions)\n                ;; Message is USER-facing: no internal branch uuid;\n                ;; carry :reason so response renderers surface the\n                ;; same text (audit-7 error honesty).\n                (let [human (str \"Position \" position \" is already taken \"\n                                 \"in this binding on the current branch\")]\n                  (throw (ex-info human\n                                  {:type :constraint-violation/position-collision\n                                   :reason human\n                                   :entity-name :binding-list-item\n                                   :binding-id binding-id\n                                   :position position\n                                   :branch-id branch-id\n                                   :colliding-item-ids (vec collisions)})))))))))))","gi":41},{"say":"The same resolved-view doctrine applied to the newest versioned\n           entity: `:resource-override` (UI Step 1) shadows a shipped frontend\n           asset — path → content, per branch — so the editor's own JS/CSS is\n           editable from inside the editor (Operate → Assets). One override\n           per path per branch view, guarded here; serving goes through\n           `:read-resource-overridable` in the app package, and every save\n           rolls the effective `?v=` asset hash so browsers re-fetch.","defn":"check-resource-override-path-collision!","ns":"graphden.versioning.storage.uniqueness","n":11,"file":"src/graphden/versioning/storage/uniqueness.clj","lang":"clj","line":169,"code":"(defn check-resource-override-path-collision!\n  \"Per-branch resolved-view uniqueness for a live :resource-override's\n   `:path` — the fn-name check's shape applied to asset overrides: an\n   override whose path is already live on this branch would make\n   `:read-resource-overridable` nondeterministic (whichever row a query\n   returns first wins). Candidates come from one indexed version query\n   on `:path`; off-branch / tombstoned rows resolve to nil and can't\n   collide.\"\n  [base-storage branch-id entity-name merged]\n  (when (and (= :resource-override entity-name) (:path merged))\n    (let [path (:path merged)\n          self-id (:id merged)\n          version-matches (sp/query-entities base-storage :resource-override-version\n                                             {:path path})\n          cand-ids (-> #{}\n                       (into (map :override-id) version-matches)\n                       (disj self-id))\n          colliding (into []\n                          (comp (map #(res/resolve-entity base-storage :resource-override % branch-id))\n                                (filter #(and (some? %) (= path (:path %))))\n                                (map :id))\n                          cand-ids)]\n      (when (seq colliding)\n        (let [human (str \"an override for \" (pr-str path)\n                         \" already exists on this branch — edit it instead\")]\n          (throw (ex-info human\n                          {:type :constraint-violation/resource-override-path-collision\n                           :entity-name :resource-override\n                           :path path\n                           :branch-id branch-id\n                           :colliding-ids colliding\n                           :reason human})))))))","gi":42},{"say":"Delete has TWO modes, and this guard is the heart of the hard one.\n           User-facing deletes tombstone (a version row with `:deleted-at`, so\n           descendants hide the entity too); sync + rollback hard-delete. A\n           hard delete used to drop only the branch's version rows — the\n           surviving versionless identity became a GHOST that a later re-mint\n           of the same deterministic id revived through the update path,\n           content-equal, invisible on every list read (the 2026-07-20\n           route-vanish incident). Now the identity row goes too, but ONLY when\n           no other branch retains a version and no child identity still\n           references it — per-branch isolation stays intact.","defn":"purgeable-identity-ids","ns":"graphden.versioning.storage.core","n":12,"file":"src/graphden/versioning/storage/core.clj","lang":"clj","line":181,"code":"(defn- purgeable-identity-ids\n  \"GHOST-IDENTITY prevention (the 2026-07-20 shrink-regrow class): the\n   subset of hard-deleted `ids` whose identity rows can be removed\n   outright — no OTHER branch retains a version row (per-branch\n   isolation: a diverged branch's view must survive this branch's\n   delete), and no child identity row still references them. Removing\n   the identity makes a later re-mint of the same deterministic id\n   flow through `create-entities` — which always writes a version — so\n   the row can never get stuck invisible-on-every-list-read the way a\n   surviving versionless identity does.\n\n   Known out-of-scope corner: a NON-descendant branch that merged this\n   branch reads its rows by reference (`merges-by-target`), which no\n   version row on that branch records. A hard delete here already\n   stripped such a row from that merge view before the purge existed\n   (own versions deleted), so the purge only changes the corner's\n   failure shape, not its reachability. Merge-target visibility stays\n   the merge endpoint's concern.\"\n  [base-storage entity-name ids branch-id all-versions version-id-field]\n  (let [other-branch (into #{}\n                           (comp (remove #(= branch-id (:branch-id %)))\n                                 (map version-id-field))\n                           all-versions)\n        candidates (into [] (remove other-branch) ids)\n        retained (when (seq candidates)\n                   (into #{}\n                         (mapcat (fn [[child-entity fk-field]]\n                                   (map fk-field\n                                        (sp/query-entities base-storage child-entity\n                                                           {fk-field candidates}))))\n                         (identity-child-refs entity-name)))\n        ;; `:fn.parent-ids` is a ref-many junction — per-candidate owner\n        ;; probe (hard-delete batches are small: sync stale rows,\n        ;; rollback singles). A fn still referenced as somebody's parent\n        ;; keeps its identity.\n        retained (if (and (= :fn entity-name) (seq candidates))\n                   (into (or retained #{})\n                         (filter (fn [id]\n                                   (seq (sp/query-ref-many-owners\n                                          base-storage :fn :parent-ids id))))\n                         candidates)\n                   retained)]\n    (into [] (remove (or retained #{})) candidates)))","gi":43},{"say":"The identity-plane repair primitives for the OTHER ghost source: a\n           package fn's id is `uuid-v5(ns-path, name)`, so a namespace move\n           mints a new id and abandons the old row with every ref still aimed\n           at it. `repoint-refs!` fills refs in place across BOTH planes\n           (identity and every branch's version rows); `purge-fn-subgraph!`\n           below then removes the abandoned subgraph. The sync-time\n           reconciler (`packages.sync/reconcile-moved-identities!`) runs them\n           after every package sync, and the operator tool\n           `graphden.dev.integrity` delegates to the same two.","defn":"repoint-refs!","ns":"graphden.versioning.identity-repair","n":13,"file":"src/graphden/versioning/identity_repair.clj","lang":"clj","line":47,"code":"(defn repoint-refs!\n  \"Fill every ref targeting a key of `old->new` with its replacement,\n   in place, across identity AND version planes; `:fn.parent-ids` and\n   the fn type-FKs included. Returns the number of rows touched.\n   `plan!` (optional) is called with `{:op :repoint …}` per change —\n   pass a collector for dry-run planning; when `dry-run?` is true no\n   write happens.\"\n  ([storage old->new] (repoint-refs! storage old->new nil false))\n  ([storage old->new plan! dry-run?]\n   (let [base (base-of storage)\n         n (volatile! 0)\n         fill! (fn [entity row field]\n                 (when-let [target (old->new (get row field))]\n                   (when plan!\n                     (plan! {:op :repoint :entity entity :id (:id row)\n                             :field field :from (get row field)\n                             :to target}))\n                   (vswap! n inc)\n                   (when-not dry-run?\n                     (sp/update-entity base entity (:id row)\n                                       {field target}))))]\n     (doseq [[entity fields] ref-fields\n             row (sp/query-entities base entity {})\n             field fields]\n       (fill! entity row field))\n     (doseq [f (sp/query-entities base :fn {})]\n       (doseq [field [:base-fn-id :element-fn-id :return-type-fn-id]]\n         (fill! :fn f field))\n       (let [pids (:parent-ids f)]\n         (when (some old->new pids)\n           (let [pids' (mapv #(get old->new % %) pids)]\n             (when plan!\n               (plan! {:op :repoint :entity :fn :id (:id f)\n                       :field :parent-ids :from pids :to pids'}))\n             (vswap! n inc)\n             (when-not dry-run?\n               (sp/update-entity base :fn (:id f)\n                                 {:parent-ids pids'}))))))\n     @n)))","gi":44},{"say":"The branch-symmetric resolved-view diff: gather every entity touched\n           on either side's visibility set, resolve both, and report\n           added/modified. The simplest read-only comparison — it precedes the\n           conflict-oriented framing below.","defn":"diff-branches","ns":"graphden.versioning.storage.merge","n":14,"file":"src/graphden/versioning/storage/merge.clj","lang":"clj","line":373,"code":"(defn diff-branches\n  \"Resolved-view diff between `source-branch-id` and `target-branch-id`.\n\n   For every versioned entity-type, finds every entity-id that has at\n   least one version record on EITHER branch's ancestor chain, then\n   resolves each on both branches. An entry is included only when the\n   resolved views actually differ.\n\n   `resolve-entities-batch` returns the bare identity row when an\n   entity has no version on the chain (used by the executor for\n   base-fns); we treat that as `nil` here so a fn that exists only on\n   one branch reports `:added-in-source` / `:added-in-target` rather\n   than `:modified`.\n\n   Returns:\n     {:source-branch-id <uuid>\n      :target-branch-id <uuid>\n      :diffs [{:entity-name :fn\n               :entity-id   <uuid>\n               :source-version <resolved map or nil>\n               :target-version <resolved map or nil>\n               :change      :added-in-source | :added-in-target | :modified}\n              …]}\n\n   Branch-symmetric: doesn't privilege the source as the side bringing\n   in changes (use `detect-conflicts` for the merge-oriented framing).\n\n   `branch-merge` records contribute to visibility — each branch's\n   visibility set is its ancestor chain PLUS the source-branch of\n   every merge that landed on any ancestor. Mirrors the resolver's\n   two-hop algorithm exactly.\"\n  [base-storage source-branch-id target-branch-id]\n  (let [source-vis (branch-visibility-ids base-storage source-branch-id)\n        target-vis (branch-visibility-ids base-storage target-branch-id)\n        touched (touched-entities-by-side base-storage source-vis target-vis)\n        touched-source (reduce-kv (fn [m k v] (assoc m k (:source v))) {} touched)\n        touched-target (reduce-kv (fn [m k v] (assoc m k (:target v))) {} touched)\n        all-touched (merge-with set/union touched-source touched-target)\n        source-resolved (batch-resolve base-storage all-touched source-branch-id)\n        target-resolved (batch-resolve base-storage all-touched target-branch-id)\n        in-chain? (fn [touched ename eid]\n                    (contains? (get touched ename #{}) eid))\n        diffs (for [[entity-name ids] all-touched\n                    eid ids\n                    :let [sv (when (in-chain? touched-source entity-name eid)\n                               (get source-resolved [entity-name eid]))\n                          tv (when (in-chain? touched-target entity-name eid)\n                               (get target-resolved [entity-name eid]))\n                          ;; created-at differs on every version row; comparing\n                          ;; data-only avoids spurious entries.\n                          sv-data (some-> sv (dissoc :created-at))\n                          tv-data (some-> tv (dissoc :created-at))]\n                    :when (not= sv-data tv-data)]\n                {:entity-name entity-name\n                 :entity-id eid\n                 :source-version sv\n                 :target-version tv\n                 :change (cond\n                           (and (nil? tv) (some? sv)) :added-in-source\n                           (and (nil? sv) (some? tv)) :added-in-target\n                           :else :modified)})]\n    {:source-branch-id source-branch-id\n     :target-branch-id target-branch-id\n     :diffs (vec diffs)}))","gi":45},{"say":"Finds entities modified on BOTH branches after the computed fork\n           point (skipping branch-local fns). This introduces fork-point\n           reasoning and defines exactly what a merge must resolve before it can\n           proceed.","defn":"detect-conflicts","ns":"graphden.versioning.storage.merge","n":15,"file":"src/graphden/versioning/storage/merge.clj","lang":"clj","line":161,"code":"(defn detect-conflicts\n  \"Finds entities modified in both source and target branches after fork point.\n\n   Returns a map:\n   {:conflicts [{:entity-name :fn\n                 :entity-id uuid\n                 :source-version <resolved version data>\n                 :target-version <resolved version data>}]\n    :fork-point <Instant>}\"\n  [base-storage source-branch-id target-branch-id]\n  (let [fp (fork-point base-storage source-branch-id target-branch-id)\n        source-modified (modified-entities-after base-storage source-branch-id fp)\n        target-modified (modified-entities-after base-storage target-branch-id fp)\n        ;; Conflicting entity-ids per type — modified on BOTH branches.\n        conflict-ids (reduce-kv\n                       (fn [acc entity-name source-ids]\n                         (let [target-ids (get target-modified entity-name #{})\n                               common (set/intersection source-ids target-ids)]\n                           (cond-> acc\n                             (seq common) (assoc entity-name common))))\n                       {}\n                       source-modified)\n        ;; Two branch resolutions, batched per entity type.\n        source-resolved (batch-resolve base-storage conflict-ids source-branch-id)\n        target-resolved (batch-resolve base-storage conflict-ids target-branch-id)\n        conflicts (for [[entity-name ids] conflict-ids\n                        entity-id ids\n                        :let [src-v (get source-resolved [entity-name entity-id])\n                              owner (conflict-owning-fn-id base-storage entity-name\n                                                           entity-id src-v)]\n                        ;; A branch-local fn's config is intentionally\n                        ;; per-branch — it must NEVER surface as a merge\n                        ;; conflict. The resolver already drops its\n                        ;; cross-branch version rows on read; without\n                        ;; this the user is forced to resolve a phantom\n                        ;; conflict and, by picking `:source`, would\n                        ;; leak the source branch's value onto the\n                        ;; target (exactly what branch-local forbids).\n                        :when (not (and owner\n                                        (bl/effective-branch-local? base-storage owner)))]\n                    {:entity-name entity-name\n                     :entity-id entity-id\n                     :source-version src-v\n                     :target-version (get target-resolved [entity-name entity-id])})]\n    {:conflicts (vec conflicts)\n     :fork-point fp}))","gi":46},{"say":"The merge itself: assert conflicts are resolved, then atomically\n           write ONE `branch-merge` record — which makes the source's versions\n           visible through resolution, copying no rows — plus any resolution\n           overrides. The payoff step tying resolution and conflict detection\n           together.","defn":"merge-branch!","ns":"graphden.versioning.storage.merge","n":16,"file":"src/graphden/versioning/storage/merge.clj","lang":"clj","line":546,"code":"(defn merge-branch!\n  \"Merges source branch into the current (target) branch.\n\n   Creates a branch-merge record that makes source versions visible on target\n   via the resolution algorithm. No version records are copied.\n\n   If conflicts exist (entities modified on both branches after fork point),\n   throws unless conflict-resolutions are provided.\n\n   Arguments:\n   - versioned-storage: VersionedStorage instance (target branch)\n   - source-branch-id: Branch to merge from\n   - opts: Optional map with :conflict-resolutions\n\n   conflict-resolutions is a map of {[entity-name entity-id] :source | :target}\n   - :source — keep source branch version (create version record on target)\n   - :target — keep target branch version (no action needed, target already has it)\n\n   Returns the branch-merge record.\"\n  ([versioned-storage source-branch-id]\n   (merge-branch! versioned-storage source-branch-id {}))\n  ([versioned-storage source-branch-id {:keys [conflict-resolutions]}]\n   (let [base-storage (:base-storage versioned-storage)\n         target-branch-id (:branch-id versioned-storage)\n         ;; A branch cannot be merged into itself. `fork-point` degenerates\n         ;; on source == target (neither side diverges from the other, so\n         ;; every own-branch edit reads back as \"modified on both sides\"),\n         ;; producing phantom self-conflicts; committing the merge record\n         ;; would then plant a self-referential `branch-merge` the resolver\n         ;; has to walk on every read. Reject it up front rather than let it\n         ;; corrupt the merge graph.\n         _ (when (= source-branch-id target-branch-id)\n             (throw (ex-info \"Cannot merge a branch into itself\"\n                             {:type :constraint-violation/self-merge\n                              :branch-id source-branch-id})))\n         ;; ATOMIC: the merge record (which

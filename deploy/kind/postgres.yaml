# In-cluster Postgres for the integration fleet (NOT for prod — a managed DB
# there). Ephemeral (no PVC): fine for an integration env that reseeds on boot.
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, labels: {app: postgres}}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: graphden}
            - {name: POSTGRES_PASSWORD, value: graphden}
            - {name: POSTGRES_DB, value: graphden}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "graphden"]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]

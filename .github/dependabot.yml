version: 2
updates:
  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfiles at the repo root.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  # npm tooling. Clojure deps (deps.edn) are covered by `bb outdated`,
  # not Dependabot, which has no Clojure ecosystem.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/tools/browser-test"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/tools/visual-tests"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

{{- if .Values.secrets.create }}
{{/*
Chart-managed Secret. Skip (secrets.create=false) and set secrets.existingSecret
to bring your own — it must carry the same keys: auth-token, internal-token,
db-password (+ vault-token when vault.enabled).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graphden.fullname" . }}
  labels:
    {{- include "graphden.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-token: {{ .Values.secrets.authToken | quote }}
  internal-token: {{ .Values.secrets.internalToken | quote }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  {{- if .Values.vault.enabled }}
  vault-token: {{ .Values.secrets.vaultToken | default "" | quote }}
  {{- end }}
{{- end }}

x\n    ;; Index already contains {field-name {:type t :nullable? n}} format\n    ;; get returns nil if entity doesn't exist - no redundant check needed\n    (when-let [cached-metadata (get-cached-metadata pool metadata-cache rw-lock)]\n      (get (:fields-by-entity cached-metadata) entity-name)))\n\n\n  (current-enums\n    [_this]\n    (into #{} (map util/snake->kw) (introspection/current-pg-enums pool)))\n\n\n  (current-enum-values\n    [_this enum-name]\n    (let [enum-vals (introspection/current-enum-values-pg pool (util/kw->snake-case enum-name))]\n      (when (seq enum-vals) enum-vals)))\n\n\n  (schema-metadata\n    [_this]\n    (get-cached-metadata pool metadata-cache rw-lock))\n\n\n  sp/StorageCRUD\n\n  (create-entity\n    [_this entity-name data]\n    (crud/create-entity pool entity-name data\n                        (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (read-entity\n    [_this entity-name id]\n    ;; :slot identity rows are immutable post-create and never deleted\n    ;; (no update/delete call site repo-wide), yet they are read one-at-\n    ;; a-time on every value-form / binding type-check / provenance /\n    ;; cross-org-ref guard — 163k single-row lookups on a 1.6k-row table\n    ;; in one demo window. Cache the RAW row per storage instance (below\n    ;; the org-scoping wrapper, whose own? gate still runs on every\n    ;; read). nil results are NOT cached — a slot created later by\n    ;; another instance must stay readable.\n    (if (= :slot entity-name)\n      (or (get @slot-row-cache id)\n          (when-some [row (crud/read-entity pool entity-name id\n                                            (get-entity-fields pool metadata-cache rw-lock entity-name))]\n            (swap! slot-row-cache assoc id row)\n            row))\n      (crud/read-entity pool entity-name id\n                        (get-entity-fields pool metadata-cache rw-lock entity-name))))\n\n\n  (update-entity\n    [_this entity-name id data]\n    ;; No live code path mutates :slot; the eviction is insurance so a\n    ;; future mutation path cannot silently serve a stale cached row.\n    (when (= :slot entity-name) (swap! slot-row-cache dissoc id))\n    (crud/update-entity pool entity-name id data\n                        (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (delete-entity\n    [_this entity-name id]\n    (when (= :slot entity-name) (swap! slot-row-cache dissoc id))\n    (crud/delete-entity pool entity-name id))\n\n\n  (query-entities\n    [_this entity-name where]\n    (crud/query-entities pool entity-name where\n                         (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (query-entities\n    [_this entity-name where opts]\n    (crud/query-entities pool entity-name where\n                         (get-entity-fields pool metadata-cache rw-lock entity-name)\n                         opts))\n\n\n  (query-latest-per-group\n    [_this entity-name where group-cols]\n    (crud/query-latest-per-group pool entity-name where group-cols\n                                 (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  sp/StorageBatchCRUD\n\n  (create-entities\n    [_this entity-name data-seq]\n    (crud/create-entities pool entity-name data-seq\n                          (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (read-entities\n    [_this entity-name ids]\n    (crud/read-entities pool entity-name ids\n                        (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (update-entities\n    [_this entity-name data-seq]\n    (crud/update-entities pool entity-name data-seq\n                          (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (upsert-entities\n    [_this entity-name data-seq]\n    (crud/upsert-entities pool entity-name data-seq\n                          (get-entity-fields pool metadata-cache rw-lock entity-name)))\n\n\n  (delete-entities\n    [_this entity-name ids]\n    (crud/delete-entities pool entity-name ids))\n\n\n  (query-ref-many-owners\n    [_this entity-name field-name target-id]\n    (junction/read-junction-owners pool entity-name field-name target-id))\n\n\n  sp/GraphConstraints\n\n  (validate-no-dependency-cycle!\n    [this owner-fn-id ref-fn-id]\n    (gc/validate-no-dependency-cycle! this owner-fn-id ref-fn-id))\n\n\n  sp/ExecutionGraph\n\n  (resolve-execution-graph\n    [this fn-id]\n    (graph/resolve-execution-graph pool this fn-id))\n\n\n  sp/StorageErrorClassifier\n\n  (classify-error\n    [_this exception]\n    (sp/classify-error (util/create-error-classifier) exception))\n\n\n  (wrap-error\n    [_this exception operation context]\n    (sp/wrap-error (util/create-error-classifier) exception operation context)))","gi":27},{"say":"The `WITH RECURSIVE` CTE that walks every outgoing edge from the\n           seed fn in one statement and returns the reachable `fn.id` set. This\n           is the heart of the recursive-CTE traversal, mirroring in SQL exactly\n           the edge list that `process-fn-node` computes in Clojure.","defn":"reachable-fns-sql","ns":"graphden.storage.postgres.graph","n":13,"file":"src/graphden/storage/postgres/graph.clj","line":45,"code":"(def ^:private reachable-fns-sql\n  \"Recursive CTE that, given a seed fn-id, returns every fn-id\n   reachable through the execution-graph edges. The recursive term\n   uses a `LATERAL` subquery so each iteration of the recursion\n   evaluates ALL outgoing-edge sources for the row it expanded —\n   the alternative (one UNION arm per source, each rejoining\n   `reachable`) is harder to read and Postgres plans it the same.\n\n   `?::uuid` is the seed parameter. `DISTINCT` at the end collapses\n   the multi-source duplicates the recursion produces (e.g. the\n   same fn reached via parent and via a ref binding).\"\n  (str\n    \"WITH RECURSIVE reachable(fn_id) AS (\"\n    \"  SELECT ?::uuid\"\n    \"  UNION\"\n    \"  SELECT child.fn_id\"\n    \"  FROM reachable r\"\n    \"  CROSS JOIN LATERAL (\"\n    ;;     parent-ids junction\n    \"    SELECT j.target_id AS fn_id\"\n    \"      FROM fn_parent_ids j WHERE j.owner_id = r.fn_id\"\n    \"    UNION ALL\"\n    ;;     fn-row scalar FKs\n    \"    SELECT f.base_fn_id\"\n    \"      FROM fn f WHERE f.id = r.fn_id AND f.base_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    \"    SELECT f.element_fn_id\"\n    \"      FROM fn f WHERE f.id = r.fn_id AND f.element_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    \"    SELECT f.return_type_fn_id\"\n    \"      FROM fn f WHERE f.id = r.fn_id AND f.return_type_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    ;;     binding outgoing refs (ref + type-override)\n    \"    SELECT b.ref_fn_id\"\n    \"      FROM binding b\"\n    \"      WHERE b.fn_id = r.fn_id AND b.ref_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    \"    SELECT b.type_override_fn_id\"\n    \"      FROM binding b\"\n    \"      WHERE b.fn_id = r.fn_id AND b.type_override_fn_id IS NOT NULL\"\n    \"    UNION ALL\"\n    ;;     binding-list-item refs (sequence elements)\n    \"    SELECT bli.ref_fn_id\"\n    \"      FROM binding_list_item bli\"\n    \"      JOIN binding b ON bli.binding_id = b.id\"\n    \"      WHERE b.fn_id = r.fn_id AND bli.ref_fn_id IS NOT NULL\"\n    \"  ) child\"\n    \"  WHERE child.fn_id IS NOT NULL\"\n    \")\"\n    \" SELECT DISTINCT fn_id FROM reachable\"))","gi":28,"see":[{"gi":24,"label":"process-fn-node"}]},{"say":"The optimized resolver: run the CTE to get reachable ids, enforce\n           the graph-size cap, bulk-load fn / slot / binding rows with five\n           `IN`-clause queries, and hand off to `->execution-graph`. O(1)\n           round-trips versus the generic O(N) — the payoff of the whole\n           protocol split.","defn":"resolve-execution-graph","ns":"graphden.storage.postgres.graph","n":14,"file":"src/graphden/storage/postgres/graph.clj","line":111,"code":"(defn resolve-execution-graph\n  \"PostgreSQL-optimised resolver. Two phases:\n\n     1. CTE walk → set of reachable fn-ids.\n     2. Bulk-load fn / fn-slot / binding / binding-list-item via\n        `sp/query-entities` with `{:id [...]}` (or `{:fn-id [...]}` /\n        `{:binding-id [...]}`) IN-clauses. Slot rows are loaded in\n        bulk too — matches the generic resolver's behaviour. Codec /\n        junction / field-spec handling all flow through the standard\n        CRUD path so the returned `ExecutionGraphResult` is\n        bit-identical to the generic version.\"\n  [ds storage fn-id]\n  (when-not (sp/read-entity storage :fn fn-id)\n    (throw (ex-info \"Function not found\"\n                    {:type :not-found\n                     :fn-id fn-id})))\n  (let [fn-ids (reachable-fn-ids ds fn-id)]\n    ;; Same guard the generic BFS enforces (`check-graph-iteration-limit!`)\n    ;; — bound the closure size so a runaway / data-corruption graph throws\n    ;; a clean `:execution-error/graph-too-large` instead of silently\n    ;; bulk-loading an unbounded set into memory. The CTE dedups via UNION\n    ;; so a cycle can't spin forever, but a pathologically wide closure can\n    ;; still be huge; cap it at `*max-graph-iterations*` reachable fns.\n    (when (> (count fn-ids) sp/*max-graph-iterations*)\n      (throw (ex-info \"Execution graph resolution exceeded maximum iterations\"\n                      {:type :execution-error/graph-too-large\n                       :fn-id fn-id\n                       :max-iterations sp/*max-graph-iterations*\n                       :iteration-count (count fn-ids)})))\n    (if (empty? fn-ids)\n      ;; Defensive — the CTE always emits at least the seed; an\n      ;; empty result implies the seed row vanished between the\n      ;; existence check above and the CTE run. Fall through to the\n      ;; generic resolver so the user sees the same not-found error\n      ;; shape rather than an empty graph.\n      (generic/resolve-execution-graph storage fn-id)\n      (let [fns          (sp/query-entities storage :fn        {:id fn-ids})\n            fn-slots     (sp/query-entities storage :fn-slot   {:fn-id fn-ids})\n            bindings     (sp/query-entities storage :binding   {:fn-id fn-ids})\n            binding-ids  (into #{} (map :id) bindings)\n            list-items   (if (seq binding-ids)\n                           (sp/query-entities storage :binding-list-item\n                                              {:binding-id binding-ids})\n                           [])\n            ;; Slot rows the closure can REACH = those named by the\n            ;; loaded fn-slots' :slot-id. Every downstream consumer\n            ;; (lookups/build-lookups, executor/composition) looks\n            ;; slots up only via `(get slot-map (:slot-id fs))` —\n            ;; nothing reaches a slot outside the fn-slot junction\n            ;; set, so the narrower query is sufficient. Pre-fix this\n            ;; loaded EVERY slot on every recursive-CTE resolve.\n            slot-ids     (into #{} (keep :slot-id) fn-slots)\n            slots        (if (seq slot-ids)\n                           (sp/query-entities storage :slot {:id (vec slot-ids)})\n                           [])\n            fns-map      (into {} (map (juxt :id identity)) fns)]\n        (graph/->execution-graph\n          {:fns fns-map\n           :slots slots\n           :fn-slots fn-slots\n           :bindings bindings\n           :list-items list-items})))))","gi":29,"see":[{"gi":23,"label":"->execution-graph"}]}]},{"id":":versioning","title":"Branches & versioning","status":"toured","summary":"The VersionedStorage decorator, per-branch resolution, diff/merge\n             and branch-local? propagation.","paths":["src/graphden/versioning/","src/graphden/system/branch_router.clj"],"after":[":storage"],"steps":[{"say":"The entry point: take any base storage, ensure a `main` branch\n           exists, and return a `VersionedStorage` bound to it. Start here to\n           see how the entire versioning layer is bolted onto the plain storage\n           from the previous block.","defn":"wrap-with-versioning","ns":"graphden.versioning.storage.core","n":1,"file":"src/graphden/versioning/storage/core.clj","line":920,"code":"(defn wrap-with-versioning\n  \"Wraps a storage with versioning support.\n\n   Creates a 'main' branch if it doesn't exist.\n   Returns a VersionedStorage on the main branch.\n\n   Arguments:\n   - base-storage: Any storage implementing Storage protocols, initialized with\n     versioned-data-schema (or compatible schema that includes version entities)\n\n   Example:\n   (def schema (vds/build-schema (mds/create-builder)))\n   (def base (-> (pg/create-storage config) (sp/initialize-with-cleanup! schema)))\n   (def storage (wrap-with-versioning base))\"\n  ([base-storage]\n   (wrap-with-versioning base-storage \"main\"))\n  ([base-storage branch-name]\n   (let [branch-id (if (= branch-name \"main\")\n                     (ensure-main-branch! base-storage)\n                     (let [existing (sp/query-entities base-storage :branch\n                                                       {:name branch-name})]\n                       (if (seq existing)\n                         (:id (first existing))\n                         (throw (ex-info \"Branch not found\"\n                                         {:type :not-found\n                                          :branch-name branch-name})))))]\n     (->VersionedStorage base-storage branch-id))))","gi":30},{"say":"The decorator record itself. It implements every storage protocol,\n           delegating non-versioned entities straight to the base storage and\n           intercepting versioned ones — reads resolve to a branch view, writes\n           append version rows. Grasp this structure before anything else here.","defn":"VersionedStorage","ns":"graphden.versioning.storage.core","n":2,"file":"src/graphden/versioning/storage/core.clj","line":350,"code":"(defrecord VersionedStorage\n  [base-storage branch-id]\n\n  sp/Storage\n\n  (initialize\n    [_ schema]\n    (sp/initialize base-storage schema))\n\n\n  (close\n    [_]\n    (sp/close base-storage))\n\n\n  sp/StorageIntrospection\n\n  (current-entities\n    [_]\n    (sp/current-entities base-storage))\n\n\n  (current-fields\n    [_ entity-name]\n    (sp/current-fields base-storage entity-name))\n\n\n  (current-enums\n    [_]\n    (sp/current-enums base-storage))\n\n\n  (current-enum-values\n    [_ enum-name]\n    (sp/current-enum-values base-storage enum-name))\n\n\n  (schema-metadata\n    [_]\n    (sp/schema-metadata base-storage))\n\n\n  sp/StorageCRUD\n\n  (create-entity\n    [_ entity-name data]\n    (epoch/bump! base-storage entity-name)\n    (if-not (res/versioned-entity? entity-name)\n      (sp/create-entity base-storage entity-name data)\n      ;; Versioned: create full record in base table + version record.\n      ;; When the identity row already exists (deterministic UUID re-sync),\n      ;; resolve the current version directly from `existing` instead of\n      ;; calling `resolve-entity` (which would re-fetch identity).\n      ;;\n      ;; `normalized` runs the same per-entity write-side rules the base\n      ;; `sp/create-entity` applies internally (notably `:binding`'s\n      ;; `:value-present true` when `:value` is present but the flag\n      ;; isn't). Without this, the BASE row gets `:value-present true`\n      ;; via the base-storage's own normalizer call, but the VERSION\n      ;; row was built off the un-normalized `data` map — every binding\n      ;; created here through CRUD landed in the version table with\n      ;; `:value-present nil`, and versioned reads (which overlay\n      ;; version-data over identity via `merge identity version`) then\n      ;; overwrote the base's `true` back to `nil`. Result: every freshly-\n      ;; created literal-bound arg disappeared from arg-overlays in the\n      ;; editor (the layout walker classifies `value-present=nil` as\n      ;; `:free`, no value-node).\n      (let [id (or (:id data) (random-uuid))\n            normalized (sp/standard-crud-normalize-data entity-name\n                                                        (assoc data :id id))\n            do-create!\n            (fn [st]\n              (check-list-item-position-collision! st branch-id entity-name normalized)\n              (check-fn-name-collision! st branch-id entity-name normalized)\n              (let [existing (sp/read-entity st entity-name id)\n                    base-row (strip-version-framework-cols entity-name normalized)]\n                (if existing\n                  (apply-identity-field-diff!\n                    st entity-name id base-row existing\n                    (:version-data-fields (get res/entity-config entity-name)))\n                  (sp/create-entity st entity-name base-row))\n                (let [{:keys [version-id-field version-data-fields]}\n                      (get res/entity-config entity-name)\n                      current-version (when existing\n                                        (res/resolve-version st entity-name id branch-id))\n                      current-data (when current-version\n                                     (select-keys (merge existing\n                                                         (dissoc current-version\n                                                                 :id :branch-id :created-at\n                                                                 version-id-field))\n                                                  version-data-fields))\n                      new-data (select-keys normalized version-data-fields)]\n                  (when (or (nil? current-version) (not= current-data new-data))\n                    (create-version-record! st entity-name id branch-id normalized))))\n              normalized)\n            ;; A `:binding-list-item` append's collision check + version insert\n            ;; must be atomic w.r.t. concurrent appends to the SAME binding —\n            ;; otherwise two appends read the same used-positions, compute the\n            ;; same next position, and both insert there, corrupting the\n            ;; per-branch sequence order. (The `(binding,position)` UNIQUE index\n            ;; was dropped because uniqueness is a per-branch RESOLVED-VIEW\n            ;; property, not a base-table one.) Serialize on a per-binding\n            ;; `pg_advisory_xact_lock` (auto-released at commit/rollback): the\n            ;; loser then sees the committed position and its collision check\n            ;; fires loudly instead of silently double-inserting. Named-:fn\n            ;; creates ride the same mechanism keyed on (branch, ns, name) —\n            ;; their retired UNIQUE moved to check-fn-name-collision! too.\n            lock-key (or (when (and (= entity-name :binding-list-item)\n                                    (:binding-id normalized))\n                           (str (:binding-id normalized)))\n                         (fn-name-lock-key branch-id entity-name normalized))]\n        (if (and lock-key (:pool base-storage))\n          (jdbc/with-transaction [tx (:pool base-storage)]\n                                 (jdbc/execute! tx [\"SELECT pg_advisory_xact_lock(hashtext(?)::bigint)\"\n                                                    lock-key])\n                                 (do-create! (assoc base-storage :pool tx)))\n          (do-create! base-storage)))))\n\n\n  (read-entity\n    [_ entity-name id]\n    (if-not (res/versioned-entity? entity-name)\n      (sp/read-entity base-storage entity-name id)\n      (res/resolve-entity base-storage entity-name id branch-id)))\n\n\n  (update-entity\n    [_ entity-name id data]\n    (epoch/bump! base-storage entity-name)\n    (if-not (res/versioned-entity? entity-name)\n      (sp/update-entity base-storage entity-name id data)\n      ;; Versioned: append new version with merged data (if changed)\n      (let [current (res/resolve-entity base-storage entity-name id branch-id)]\n        (when-not current\n          (throw (ex-info \"Entity not found\"\n                          {:type :not-found\n                           :entity-name entity-name\n                           :id id})))\n        (let [merged (merge current data)\n              _ (check-list-item-position-collision! base-storage branch-id\n                                                     entity-name\n                                                     (assoc merged :id id))\n              ;; Only compare version-controlled fields, not :id\n              {:keys [version-data-fields]} (get res/entity-config entity-name)\n              current-data (select-keys current version-data-fields)\n              merged-data (select-keys merged version-data-fields)\n              ;; Non-versioned fields (e.g. :ref-many junction fields like\n              ;; :parent-ids) live on the identity row / junction tables,\n              ;; not in the version table. Updates to those have to be\n              ;; flowed through to base storage explicitly — without this,\n              ;; PUTs that change ONLY non-versioned fields are silent\n              ;; no-ops because version-data-fields-only diffing returns\n              ;; equal and create-version-record! is skipped.\n              non-versioned-data (apply dissoc data version-data-fields)\n              ;; A rename / namespace-move can land on an occupied\n              ;; (ns, name) — same live-view rule as create. Only those two\n              ;; keys can introduce a collision, so other updates (the\n              ;; common case: description, effects, …) skip the check and\n              ;; its lock entirely.\n              name-write? (and (= :fn entity-name)\n                               (:name merged)\n                               (or (contains? data :name)\n                                   (contains? data :namespace-id)))\n              do-update!\n              (fn [st]\n                (when name-write?\n                  (check-fn-name-collision! st branch-id entity-name\n                                            (assoc merged :id id)))\n                ;; Skip creating new version if data unchanged. (A\n                ;; versionless identity can't reach here at all — the\n                ;; `resolve-entity` above is version-gated and already threw\n                ;; not-found. The batch path, which the package sync uses,\n                ;; resolves identity-as-is and therefore needs the explicit\n                ;; versionless guard it carries.)\n                (when (not= current-data merged-data)\n                  (create-version-record! st entity-name id branch-id merged))\n                ;; Apply non-versioned fields directly. base-storage's\n                ;; update-entity handles columnar identity columns AND\n                ;; ref-many junction replacement.\n                (when (seq non-versioned-data)\n                  (sp/update-entity st entity-name id non-versioned-data))\n                merged)\n              lock-key (when name-write?\n                         (fn-name-lock-key branch-id entity-name merged))]\n          (if (and lock-key (:pool base-storage))\n            (jdbc/with-transaction [tx (:pool base-storage)]\n                                   (jdbc/execute! tx [\"SELECT pg_advisory_xact_lock(hashtext(?)::bigint)\"\n                                                      lock-key])\n                                   (do-update! (assoc base-storage :pool tx)))\n            (do-update! base-storage))))))\n\n\n  (delete-entity\n    [_ entity-name id]\n    (epoch/bump! base-storage entity-name)\n    (cond\n      (not (res/versioned-entity? entity-name))\n      (sp/delete-entity base-storage entity-name id)\n\n      ;; User-facing delete: tombstone so an inherited entity is hidden too.\n      *tombstone-delete?*\n      (tombstone-version! base-storage entity-name id branch-id)\n\n      ;; Hard delete (sync / rollback): drop this branch's own version\n      ;; rows, and — when no other branch retains a version — the\n      ;; identity row too, so no versionless ghost survives to swallow\n      ;; a later re-mint of the same deterministic id.\n      :else\n      (let [{:keys [version-entity version-id-field]} (get res/entity-config entity-name)\n            all-versions (sp/query-entities base-storage version-entity\n                                            {version-id-field id})\n            own-versions (filterv #(= branch-id (:branch-id %)) all-versions)\n            purgeable (purgeable-identity-ids base-storage entity-name [id]\n                                              branch-id all-versions version-id-field)]\n        (when (seq own-versions)\n          (sp/delete-entities base-storage version-entity (mapv :id own-versions)))\n        (when (seq purgeable)\n          (sp/delete-entity base-storage entity-name id))\n        (pos? (count own-versions)))))\n\n\n  (query-entities\n    [_ entity-name where]\n    (if-not (res/versioned-entity? entity-name)\n      (sp/query-entities base-storage entity-name where)\n      ;; Branch chain cache is process-wide (`global-chain-cache`)\n      ;; — no per-call binding needed.\n      (res/resolve-all-entities base-storage entity-name branch-id where)))\n\n\n  (query-entities\n    [this entity-name where opts]\n    (cond\n      (or (nil? opts) (empty? opts))\n      (sp/query-entities this entity-name where)\n\n      (res/versioned-entity? entity-name)\n      ;; Versioned reads run a deduplicate-by-id resolver that\n      ;; collapses N version rows into ≤ N base rows. Applying\n      ;; ORDER BY / LIMIT at the SQL layer would happen BEFORE that\n      ;; dedup and silently return the wrong page. Refuse rather\n      ;; than mislead — callers that need pagination over a\n      ;; versioned table should fetch + page in memory.\n      (throw (ex-info (str \"query-entities :opts not supported on versioned entity \"\n                           entity-name \" — pagination must run after version resolution\")\n                      {:type :storage-error/unsupported-opts\n                       :entity-name entity-name :opts opts}))\n\n      :else\n      (sp/query-entities base-storage entity-name where opts)))\n\n\n  (query-latest-per-group\n    [_ entity-name where group-cols]\n    ;; Pure pass-through to the base storage. The resolver layer\n    ;; (resolution/load-merge-aware-cache) drives this method\n    ;; against version-entity tables directly; it is NOT meant to be\n    ;; invoked on identity tables through VersionedStorage's\n    ;; resolution wrap. If a future caller asks for dedup on a\n    ;; versioned IDENTITY entity, we'd need a parallel resolution\n    ;; path — defer until that materialises.\n    (sp/query-latest-per-group base-storage entity-name where group-cols))\n\n\n  sp/StorageBatchCRUD\n\n  (create-entities\n    [_ entity-name data-seq]\n    (epoch/bump! base-storage entity-name)\n    (if-not (res/versioned-entity? entity-name)\n      (sp/create-entities base-storage entity-name data-seq)\n      ;; Versioned: batch create base records + batch create version records\n      (let [data-with-ids (mapv (fn [data]\n                                  (if (:id data) data (assoc data :id (random-uuid))))\n                                data-seq)\n            ;; Position-collision check against storage, mirroring the\n            ;; singular create-entity. INTRA-batch duplicates (two items in\n            ;; the same batch sharing `(binding-id, position)`) both pass\n            ;; this against-storage check — neither is committed yet — so\n            ;; the duplicate-position-within-data-seq check below rejects\n            ;; them upfront, keeping batch import from a broken landing.\n            _ (check-list-item-position-collisions! base-storage branch-id\n                                                    entity-name data-with-ids)\n            _ (when (= :binding-list-item entity-name)\n                (let [by-key (group-by (juxt :binding-id :position) data-with-ids)\n                      dupe (some (fn [[k items]]\n                                   (when (and (some? (first k))\n                                              (some? (second k))\n                                              (> (count items) 1))\n                                     [k items]))\n                                 by-key)]\n                  (when dupe\n                    (throw (ex-info \"Batch contains items with duplicate (binding-id, position)\"\n                                    {:type :constraint-violation/position-collision\n                                     :entity-name :binding-list-item\n                                     :binding-id (ffirst dupe)\n                                     :position (second (first dupe))\n                                     :colliding-item-ids (mapv :id (second dupe))})))))\n            ids (mapv :id data-with-ids)\n            ;; Find which base records don't exist yet\n            existing-by-id (sp/read-entities base-storage entity-name ids)\n            existing-ids (set (keys existing-by-id))\n            {existing-records true new-base-records false}\n            (group-by #(contains? existing-ids (:id %)) data-with-ids)\n            ;; Batch create base records. Identity-plane INSERT: strip\n            ;; version-plane bookkeeping a caller may echo from a\n            ;; version-row read (the crud rollback replay re-creates\n            ;; captured pre-state rows) — the identity table has no\n            ;; such column. Rows whose identity already exists flow\n            ;; their identity-field diffs through update (guarded\n            ;; no-op when unchanged) instead of being silently\n            ;; write-once.\n            config (get res/entity-config entity-name)\n            _ (when (seq new-base-records)\n                (sp/create-entities base-storage entity-name\n                                    (mapv #(strip-version-framework-cols entity-name %)\n                                          new-base-records)))\n            _ (doseq [row existing-records]\n                (apply-identity-field-diff!\n                  base-storage entity-name (:id row)\n                  (strip-version-framework-cols entity-name row)\n                  (get existing-by-id (:id row))\n                  (:version-data-fields config)))\n            ;; Prepare and batch create version records\n            timestamp (now)\n            version-records (mapv #(prepare-version-record config (:id %) branch-id\n                                                           timestamp %)\n                                  data-with-ids)]\n        (sp/create-entities base-storage (:version-entity config) version-records)\n        data-with-ids)))\n\n\n  (read-entities\n    [_ entity-name ids]\n    (if-not (res/versioned-entity? entity-name)\n      (sp/read-entities base-storage entity-name ids)\n      ;; Batch resolve: load identity records, then batch resolve versions\n      (let [identity-records (vals (sp/read-entities base-storage entity-name ids))]\n        (res/resolve-entities-batch base-storage entity-name identity-records branch-id))))\n\n\n  (update-entities\n    [_ entity-name data-seq]\n    (epoch/bump! base-storage entity-name)\n    (if-not (res/versioned-entity? entity-name)\n      (sp/update-entities base-storage entity-name data-seq)\n      ;; Batch update: resolve all current versions, compute diffs, batch create versions\n      (let [ids (mapv :id data-seq)\n            ;; Batch resolve current versions using efficient batch resolution\n            identity-records (vals (sp/read-entities base-storage entity-name ids))\n            current-versions (res/resolve-entities-batch base-storage entity-name\n                                                         identity-records branch-id)\n            current-by-id (into {} (map (fn [e] [(:id e) e])) (vals current-versions))\n            ;; Check all entities exist\n            missing-ids (remove #(contains? current-by-id %) ids)]\n        (when (seq missing-ids)\n          (throw (ex-info \"Entities not found\"\n                          {:type :not-found\n                           :entity-name entity-name\n                           :missing-ids (vec missing-ids)})))\n        ;; Position-collision check against storage, mirroring the singular\n        ;; update-entity. Uses the merged shape (current + incoming partial\n        ;; update) so a position-only update is checked against the rest of\n        ;; the binding's items on the chain.\n        (check-list-item-position-collisions!\n          base-storage branch-id entity-name\n          (vec (keep (fn [data]\n                       (let [id (:id data)\n                             current (get current-by-id id)]\n                         (when current (assoc (merge current data) :id id))))\n                     data-seq)))\n        ;; Compute merged versions and filter to only changed ones\n        (let [{:keys [version-entity version-data-fields] :as config}\n              (get res/entity-config entity-name)\n              timestamp (now)\n              ;; An identity row with NO version on the chain resolves to\n              ;; ITSELF (resolution/resolve-entities-batch's identity-as-is\n              ;; fallback), so a content-equal update diffs to nothing — and\n              ;; without a version row the READ path (`resolve-all-entities`,\n              ;; which lists only entities that have one) never returns it.\n              ;; Such remnants are real: item-ids are deterministic per\n              ;; (binding, position), so an older, longer list leaves identity\n              ;; rows that a later sync re-touches. Growing a package list\n              ;; through one silently dropped a route from the live demo's\n              ;; router (2026-07-20) while a fresh-DB run stayed green.\n              ;; So: force a version for any id that has none, whatever the\n              ;; diff. The hard-delete path now purges a sole-branch identity\n              ;; outright (see `delete-entities` :else), so this is the\n              ;; BACKSTOP for identities another branch still pins — and the\n              ;; probe is chain-scoped + merge-aware for exactly that case: a\n              ;; version living only on an unrelated branch must not satisfy\n              ;; THIS branch's visibility.\n              versionless-ids (res/ids-without-chain-version\n                                base-storage entity-name ids branch-id)\n              ;; Build version records for changed entities + versionless ones\n              version-records\n              (into []\n                    (keep (fn [data]\n                            (let [id (:id data)\n                                  current (get current-by-id id)\n                                  merged (merge current data)\n                                  current-data (select-keys current version-data-fields)\n                                  merged-data (select-keys merged version-data-fields)]\n                              (when (or (not= current-data merged-data)\n                                        (contains? versionless-ids id))\n                                (prepare-version-record config id branch-id\n                                                        timestamp merged)))))\n                    data-seq)]\n          ;; Batch create all version records\n          (when (seq version-records)\n            (sp/create-entities base-storage version-entity version-records))\n          ;; Ref-many junctions (notably fn `:parent-ids`) and other\n          ;; non-versioned columns live on the base identity row, not in\n          ;; a version record — the diff above only covers\n          ;; `version-data-fields`. Flow every non-versioned change\n          ;; through to base storage, whose singular `update-entity`\n          ;; merges with the existing row (filling NOT-NULL columns) and\n          ;; reconciles ref-many junctions. Without this a base-fn →\n          ;; composed-fn parent change is silently dropped. Mirrors the\n          ;; singular `update-entity` above; guarded so an unchanged\n          ;; re-sync stays a no-op.\n          (doseq [data data-seq\n                  :let [id (:id data)\n                        non-versioned (apply dissoc data :id version-data-fields)\n                        current (get current-by-id id)]\n                  :when (and (seq non-versioned)\n                             (not= non-versioned\n                                   (select-keys current (keys non-versioned))))]\n            (sp/update-entity base-storage entity-name id non-versioned))\n          ;; Return merged data for all records (including unchanged)\n          (mapv (fn [data]\n                  (merge (get current-by-id (:id data)) data))\n                data-seq)))))\n\n\n  (upsert-entities\n    [this entity-name data-seq]\n    (if-not (res/versioned-entity? entity-name)\n      (sp/upsert-entities base-storage entity-name data-seq)\n      ;; For versioned: batch check existence in BASE storage (no version resolution),\n      ;; then create/update accordingly\n      (let [ids (keep :id data-seq)\n            ;; Check existence in base-storage directly - O(n) not O(n × versions)\n            ;; We only need to know if identity record exists, not resolve versions\n            existing-ids (if (seq ids)\n                           (set (keys (sp/read-entities base-storage entity-name (vec ids))))\n                           #{})\n            {to-update true to-create false}\n            (group-by #(contains? existing-ids (:id %)) data-seq)]\n        ;; Batch create new records\n        (when (seq to-create)\n          (sp/create-entities this entity-name to-create))\n        ;; Batch update existing records\n        (when (seq to-update)\n          (sp/update-entities this entity-name to-update))\n        ;; Return all records\n        (vec data-seq))))\n\n\n  (delete-entities\n    [_ entity-name ids]\n    (epoch/bump! base-storage entity-name)\n    (cond\n      (not (res/versioned-entity? entity-name))\n      (sp/delete-entities base-storage entity-name ids)\n\n      *tombstone-delete?*\n      (count (filterv #(tombstone-version! base-storage entity-name % branch-id) ids))\n\n      :else\n      ;; Batch hard delete: drop this branch's version rows, and — for\n      ;; ids no other branch retains a version of — the identity rows\n      ;; too (see `purgeable-identity-ids`; the singular `delete-entity`\n      ;; mirrors this).\n      (let [{:keys [version-entity version-id-field]} (get res/entity-config entity-name)\n            ;; Single WHERE IN query for ALL branches' versions — the\n            ;; current branch's are deleted, the others gate the\n            ;; identity purge.\n            all-versions (sp/query-entities base-storage version-entity\n                                            {version-id-field (vec ids)})\n            own-versions (filterv #(= branch-id (:branch-id %)) all-versions)\n            ;; Count unique entity-ids that had versions on this branch\n            ;; (return-value contract, unchanged)\n            deleted-entity-ids (into #{} (map version-id-field) own-versions)\n            purgeable (purgeable-identity-ids base-storage entity-name (vec ids)\n                                              branch-id all-versions version-id-field)]\n        (when (seq own-versions)\n          (sp/delete-entities base-storage version-entity (mapv :id own-versions)))\n        (when (seq purgeable)\n          (sp/delete-entities base-storage entity-name purgeable))\n        (count deleted-entity-ids))))\n\n\n  (query-ref-many-owners\n    [_ entity-name field-name target-id]\n    ;; Junction tables are NOT versioned (the model versions :parent-ids only via\n    ;; fn re-creation, not a separate junction-version table), so the base query\n    ;; has to answer from the junction rows — and those name every owner that\n    ;; EVER pointed here, including owners this branch has since deleted.\n    ;;\n    ;; Deletion is a TOMBSTONE, not a row removal. Passing the base answer\n    ;; through therefore reported dead children as live dependents, and the\n    ;; delete guard built on this (\"Graph is a parent of N other graph(s) —\n    ;; remove the dependents first\") refused forever:\n    ;;\n    ;;     DELETE child  -> 200\n    ;;     DELETE parent -> 409   \"is a parent of 1 other graph\"\n    ;;\n    ;; A fn that ever had a child could not be deleted again, by anyone — the\n    ;; user in the editor, or a test cleaning up after itself. The e2e suite hit\n    ;; it every run: the leaked parents stayed in the graph and the NEXT test\n    ;; file failed on them, which is where the \"flaky e2e\" investigations all\n    ;; went, and why they never found anything.\n    ;;\n    ;; The junction is the right place to ask WHO pointed here. It is not the\n    ;; place to ask WHO STILL EXISTS. Resolve the owners against this branch and\n    ;; keep the living.\n    (let [owner-ids (sp/query-ref-many-owners base-storage entity-name\n                                              field-name target-id)]\n      (if (or (empty? owner-ids) (not (res/versioned-entity? entity-name)))\n        owner-ids\n        (let [identity-records (vals (sp/read-entities base-storage entity-name\n                                                       (vec owner-ids)))\n              alive (into #{}\n                          (map :id)\n                          (vals (res/resolve-entities-batch\n                                  base-storage entity-name\n                                  identity-records branch-id)))]\n          (filterv alive owner-ids)))))\n\n\n  sp/GraphConstraints\n\n  (validate-no-dependency-cycle!\n    [this owner-fn-id value-fn-id]\n    (gc/validate-no-dependency-cycle! this owner-fn-id value-fn-id))\n\n\n  sp/ExecutionGraph\n\n  (resolve-execution-graph\n    [_ fn-id]\n    ;; Batch resolution loads all data in 4 queries + BFS in memory\n    ;; (avoiding the N+1 ~400-query path). Chain hierarchy lookups\n    ;; consult the process-wide `global-chain-cache` directly.\n    (let [result (res/resolve-execution-graph-batch base-storage fn-id branch-id)]\n      (when (empty? (:fns result))\n        (throw (ex-info \"Function not found\"\n                        {:type :not-found\n                         :fn-id fn-id})))\n      (graph/->execution-graph result))))","gi":31},{"say":"The authoritative map of WHICH entities are versioned (fn / fn-slot\n           / binding / binding-list-item) and how each splits across two tables:\n           `version-data-fields` live in the version table, identity fields stay\n           on the base row. Everything downstream keys off this config.","defn":"entity-config","ns":"graphden.versioning.storage.resolution","n":3,"file":"src/graphden/versioning/storage/resolution.clj","line":93,"code":"(def entity-config\n  \"Configuration for versioned entities. Maps base entity name to\n   version table metadata.\n\n   `:version-data-fields` is DERIVED (`vts/version-data-fields`) from the\n   same base field map the `-version` mirror entity derives from — one\n   source, so the decorator's select-keys can never silently disagree\n   with the mirror's columns (the old hand-kept-triple footgun).\n   `:candidate-bound-keys` stays hand-curated: it is a read-bounding\n   OPTIMIZATION choice (which version-row columns are useful to bound a\n   candidate query on), not derivable from the schema.\n\n   Notes:\n   - `:parent-ids` is NOT in fn version-data-fields — it's a :ref-many\n     stored in a junction table, not versioned (declared identity-level\n     in `vts/mirror-config`).\n   - `:slot` is intentionally absent: slots are immutable post-create\n     (changing the (name, type-fn-id) pair = creating a new slot).\"\n  {:fn {:version-entity :fn-version\n        :version-id-field :fn-id\n        :version-data-fields (vts/version-data-fields :fn)\n        :candidate-bound-keys #{:name :anonymous-hash :base-fn-id\n                                :element-fn-id :return-type-fn-id}}\n\n   :fn-slot {:version-entity :fn-slot-version\n             :version-id-field :fn-slot-id\n             :version-data-fields (vts/version-data-fields :fn-slot)\n             :candidate-bound-keys #{:fn-id :slot-id}}\n\n   :binding {:version-entity :binding-version\n             :version-id-field :binding-id\n             :version-data-fields (vts/version-data-fields :binding)\n             :candidate-bound-keys #{:fn-id :slot-id :ref-fn-id\n                                     :type-override-fn-id}}\n\n   :binding-list-item {:version-entity :binding-list-item-version\n                       :version-id-field :item-id\n                       :version-data-fields (vts/version-data-fields :binding-list-item)\n                       :candidate-bound-keys #{:binding-id :ref-fn-id}}})","gi":32},{"say":"Where the `-version` mirror entities come from: derived from the\n           base entity's field map (refs demote to bare uuids, framework\n           columns spliced in), never hand-copied. A new base column without a\n           pinned mirror uuid or an identity-level declaration fails the build\n           loudly — the old failure mode was the decorator silently dropping\n           that column's writes. `version-data-fields` above derives from the\n           same source, so the two can never disagree.","defn":"derive-version-fields","ns":"graphden.schema.versioned.schema","n":4,"file":"src/graphden/schema/versioned/schema.clj","line":349,"code":"(defn derive-version-fields\n  \"Derive a `-version` mirror entity's field map from the BASE entity's\n   field map.\n\n   `framework` — the four version-framework columns\n   (`{<id-field> {...ref base} :branch-id {...} :created-at :deleted-at}`),\n   spliced in verbatim.\n   `identity-fields` — base fields that live on the IDENTITY row and never\n   version (structural identity, tenant owner). `:ref-many` fields are\n   junction tables and skip automatically.\n   `uuids` — `{field-name → pinned mirror-column uuid}`. A versioned base\n   field with NO pinned uuid throws at build time: that is the point —\n   the old failure mode was the decorator silently dropping the writes.\n   `tweaks` — `{field-name → spec-merge}` for mirror-only flags\n   (e.g. the explicit `:indexed?` on ref-fn-id — the base column is a\n   real FK and gets its index from the constraint; the mirror's is a\n   bare uuid).\"\n  [entity base-fields {:keys [identity-fields uuids tweaks]} framework]\n  (let [data-fields\n        (into {}\n              (keep (fn [[fname spec]]\n                      (when-not (or (contains? identity-fields fname)\n                                    (= :ref-many (:type spec)))\n                        (let [u (get uuids fname)]\n                          (when-not u\n                            (throw (ex-info\n                                     (str \"No version-mirror column uuid for \"\n                                          entity \"/\" fname\n                                          \" — a new base field must either be \"\n                                          \"declared identity-level or given a \"\n                                          \"pinned mirror uuid here. (Without \"\n                                          \"this check the versioned decorator \"\n                                          \"silently dropped its writes.)\")\n                                     {:entity entity :field fname})))\n                          [fname (-> (mirror-field-spec spec)\n                                     (assoc :uuid u)\n                                     (merge (get tweaks fname)))]))))\n              base-fields)]\n    (merge framework data-fields)))","gi":33},{"say":"The public per-branch read: for one entity, load its version chain,\n           merge in a single batched pass, and return the winning version (nil\n           on a tombstone). This is how a plain read becomes branch-aware.","defn":"resolve-version","ns":"graphden.versioning.storage.resolution","n":5,"file":"src/graphden/versioning/storage/resolution.clj","line":225,"code":"(defn resolve-version\n  \"Resolves the current version of an entity on a branch.\n\n   Loads the branch chain + every relevant `branch-merge` for the whole\n   chain in ONE batched pass (`load-merge-aware-cache`), then resolves\n   through `resolve-version-from-cache` — the SAME code the batch / graph\n   path already uses. This used to recurse level-by-level, re-querying\n   `:branch-merge` and the parent link at each step (~3 queries × chain\n   depth for a single-entity read on a feature branch); the batched load\n   is a fixed handful of queries regardless of depth, and it collapses\n   the two parallel resolution algorithms (this recursion vs\n   `resolve-version-from-cache`) into one tested implementation.\n\n   Returns the version record or nil.\"\n  [base-storage entity-name entity-id branch-id]\n  (let [{:keys [version-entity version-id-field]} (get entity-config entity-name)\n        {:keys [versions-by-id merges-by-target branch-chain]}\n        (load-merge-aware-cache base-storage version-entity version-id-field\n                                [entity-id] branch-id)\n        version (resolve-version-from-cache base-storage entity-name\n                                            versions-by-id merges-by-target\n                                            entity-id branch-chain)]\n    ;; A tombstone-winner means the entity is deleted on this branch — the\n    ;; public API treats it as absent (nil), same as no version at all.\n    (when-not (tombstone? version) version)))","gi":34},{"say":"The branch-chain walk: `[branch → parent → … → root]` via\n           `:base-branch-id`, memoised process-wide. This inheritance backbone\n           is what every resolve and cache-invalidation consults to know which\n           branches a read can see.","defn":"collect-branch-chain","ns":"graphden.versioning.storage.resolution","n":6,"file":"src/graphden/versioning/storage/resolution.clj","line":390,"code":"(defn collect-branch-chain\n  \"Returns vector of branch-ids from current to root (for inheritance\n   lookup). When `*branch-chain-cache*` is bound it wins (test\n   isolation); otherwise consults the process-wide\n   `global-chain-cache`, populating on miss.\n\n   Public because cache invalidation needs the same reachability\n   question the resolver asks: a write on branch W is visible from\n   branch C exactly when W ∈ (collect-branch-chain … C). See\n   `system.branch-router/invalidate-affected-ctxs!`.\"\n  [base-storage branch-id]\n  (let [cache (or *branch-chain-cache* global-chain-cache)]\n    (if-let [cached (get @cache branch-id)]\n      cached\n      (let [chain (collect-branch-chain-impl base-storage branch-id)]\n        (swap! cache assoc branch-id chain)\n        chain))))","gi":35},{"say":"The in-memory chain walk the resolver actually runs: at each branch\n           level combine own-latest with merge candidates, pick the greatest\n           `effective-ts`, and recurse to the parent. One tested algorithm shared\n           by both single-entity and whole-graph reads.","defn":"resolve-version-from-cache","ns":"graphden.versioning.storage.resolution","n":7,"file":"src/graphden/versioning/storage/resolution.clj","line":498,"code":"(defn- resolve-version-from-cache\n  \"Resolves version for an entity using pre-loaded `versions-by-id`\n   + `merges-by-target` (built by `load-merge-aware-cache`). Mirrors\n   `resolve-version`'s recursion: at each chain level, combine\n   own-latest with merge-candidates and pick the latest by\n   effective-ts; recurse to parent if nothing matched.\n\n   The old simplified algorithm (chain priority only, no merge\n   support) silently dropped merge-record visibility on the batch\n   path — `/api/graph/entities` and the executor's compiled graph\n   load both went through here, so a `POST /api/branches/X/merge`\n   created the branch-merge row but never affected reads (#52).\n\n   `entity-name` + `base-storage` are threaded down to\n   `merge-candidates-from-cache` so the `:fn` branch-local filter can\n   call `bl/effective-branch-local?`. Non-fn entities skip the check.\"\n  [base-storage entity-name versions-by-id merges-by-target entity-id branch-chain]\n  (when-let [versions (get versions-by-id entity-id)]\n    (let [by-branch (group-by :branch-id versions)]\n      (loop [chain branch-chain]\n        (when-let [bid (first chain)]\n          (let [own-latest (latest-by-created-at (get by-branch bid))\n                merges (get merges-by-target bid)\n                merge-cands (merge-candidates-from-cache base-storage entity-name\n                                                         entity-id by-branch\n                                                         own-latest merges)\n                all-candidates (cond-> []\n                                 own-latest\n                                 (conj {:version own-latest\n                                        :effective-ts (:created-at own-latest)})\n                                 (seq merge-cands)\n                                 (into merge-cands))]\n            (or (pick-latest-candidate all-candidates)\n                (recur (rest chain)))))))))","gi":36},{"say":"Monotonic-OR over the `:parent-ids` closure: a fn (or ANY ancestor)\n           marked `:branch-local? true` is local forever. The resolver's merge\n           filter calls this so runtime-config fns — web-server port, vault\n           path, cron schedule — never leak across branches on merge.","defn":"effective-branch-local?","ns":"graphden.versioning.branch-local","n":8,"file":"src/graphden/versioning/branch_local.clj","line":82,"code":"(defn effective-branch-local?\n  \"True iff `fn-id` (an identity-side `:fn` row id) or any ancestor\n   in its `:parent-ids` closure has `:branch-local? true`.\n\n   Memoized per storage. Callers in resolution.clj batch this against\n   the same storage handle repeatedly, so the cache keeps the walk\n   O(1) after the first hit. `nil` fn-id returns false (defensive —\n   resolve-entity may pass nil for missing rows).\"\n  [base-storage fn-id]\n  (if (nil? fn-id)\n    false\n    (let [cache (cache-for-storage base-storage)]\n      (if (contains? @cache fn-id)\n        (get @cache fn-id)\n        (let [result (compute-effective base-storage fn-id)]\n          (swap! cache assoc fn-id result)\n          result)))))","gi":37},{"say":"The list-item position-collision guard. A cross-branch base index on\n           `(binding-id, position)` would wrongly block divergence, so per-branch\n           uniqueness is enforced here in the resolved view instead — a subtle\n           invariant the write path defends with an advisory lock. Fn names\n           follow the same doctrine: `check-fn-name-collision!` just below\n           replaced the raw `UNIQUE (namespace_id, name)`, whose soft-deleted\n           identities blocked their names forever.","defn":"check-list-item-position-collisions!","ns":"graphden.versioning.storage.core","n":9,"file":"src/graphden/versioning/storage/core.clj","line":223,"code":"(defn- check-list-item-position-collisions!\n  \"Per-branch resolved-view check for a WHOLE batch: throw if any item in\n   `check-seq` resolves to a `(binding-id, position)` already taken by\n   ANOTHER item on this branch. Enforces the per-branch resolved-view\n   `UNIQUE (binding-id, position)` invariant — uniqueness is a per-branch\n   resolved-view property, not a cross-branch one (a cross-branch\n   base-table index would wrongly block divergence).\n\n   Skips when `entity-name` isn't `:binding-list-item`. One version query\n   for ALL touched bindings + one resolve pass, regardless of batch size —\n   the singular `check-list-item-position-collision!` delegates here with a\n   one-element seq.\"\n  [base-storage branch-id entity-name check-seq]\n  (when (= :binding-list-item entity-name)\n    (let [candidates (filter #(and (:binding-id %) (some? (:position %))) check-seq)]\n      (when (seq candidates)\n        (let [chain (#'res/collect-branch-chain base-storage branch-id)\n              ;; Every item-version on the touched bindings' chains. The SQL\n              ;; WHERE narrows to those bindings so we don't scan the whole\n              ;; version table.\n              versions (sp/query-entities base-storage :binding-list-item-version\n                                          {:binding-id (vec (distinct (map :binding-id candidates)))\n                                           :branch-id (vec chain)})\n              versions-by-binding (group-by :binding-id versions)\n              ;; Resolve every touched item ONCE — the collision rule\n              ;; applies to the LIVE branch view, not raw version rows.\n              ;; Items WITHOUT a version on the chain resolve to nil / a bare\n              ;; off-branch row and can't collide; only touched item-ids\n              ;; (those carrying a chain version) are considered.\n              all-touched-ids (into #{} (map :item-id) versions)\n              resolved-map (if (seq all-touched-ids)\n                             (into {} (res/resolve-entities-batch\n                                        base-storage :binding-list-item\n                                        (vals (sp/read-entities base-storage :binding-list-item\n                                                                (vec all-touched-ids)))\n                                        branch-id))\n                             {})]\n          (doseq [{:keys [binding-id position id]} candidates]\n            (let [touched-ids (map :item-id (get versions-by-binding binding-id))\n                  collisions (for [eid touched-ids\n                                   :let [row (get resolved-map eid)]\n                                   :when (and (some? row)\n                                              (not= eid id)\n                                              (= position (:position row)))]\n                               eid)]\n              (when (seq collisions)\n                ;; Message is USER-facing: no internal branch uuid;\n                ;; carry :reason so response renderers surface the\n                ;; same text (audit-7 error honesty).\n                (let [human (str \"Position \" position \" is already taken \"\n                                 \"in this binding on the current branch\")]\n                  (throw (ex-info human\n                                  {:type :constraint-violation/position-collision\n                                   :reason human\n                                   :entity-name :binding-list-item\n                                   :binding-id binding-id\n                                   :position position\n                                   :branch-id branch-id\n                                   :colliding-item-ids (vec collisions)})))))))))))","gi":38},{"say":"Delete has TWO modes, and this guard is the heart of the hard one.\n           User-facing deletes tombstone (a version row with `:deleted-at`, so\n           descendants hide the entity too); sync + rollback hard-delete. A\n           hard delete used to drop only the branch's version rows — the\n           surviving versionless identity became a GHOST that a later re-mint\n           of the same deterministic id revived through the update path,\n           content-equal, invisible on every list read (the 2026-07-20\n           route-vanish incident). Now the identity row goes too, but ONLY when\n           no other branch retains a version and no child identity still\n           references it — per-branch isolation stays intact.","defn":"purgeable-identity-ids","ns":"graphden.versioning.storage.core","n":10,"file":"src/graphden/versioning/storage/core.clj","line":178,"code":"(defn- purgeable-identity-ids\n  \"GHOST-IDENTITY prevention (the 2026-07-20 shrink-regrow class): the\n   subset of hard-deleted `ids` whose identity rows can be removed\n   outright — no OTHER branch retains a version row (per-branch\n   isolation: a diverged branch's view must survive this branch's\n   delete), and no child identity row still references them. Removing\n   the identity makes a later re-mint of the same deterministic id\n   flow through `create-entities` — which always writes a version — so\n   the row can never get stuck invisible-on-every-list-read the way a\n   surviving versionless identity does.\n\n   Known out-of-scope corner: a NON-descendant branch that merged this\n   branch reads its rows by reference (`merges-by-target`), which no\n   version row on that branch records. A hard delete here already\n   stripped such a row from that merge view before the purge existed\n   (own versions deleted), so the purge only changes the corner's\n   failure shape, not its reachability. Merge-target visibility stays\n   the merge endpoint's concern.\"\n  [base-storage entity-name ids branch-id all-versions version-id-field]\n  (let [other-branch (into #{}\n                           (comp (remove #(= branch-id (:branch-id %)))\n                                 (map version-id-field))\n                           all-versions)\n        candidates (into [] (remove other-branch) ids)\n        retained (when (seq candidates)\n                   (into #{}\n                         (mapcat (fn [[child-entity fk-field]]\n                                   (map fk-field\n                                        (sp/query-entities base-storage child-entity\n                                                           {fk-field candidates}))))\n                         (identity-child-refs entity-name)))\n        ;; `:fn.parent-ids` is a ref-many junction — per-candidate owner\n        ;; probe (hard-delete batches are small: sync stale rows,\n        ;; rollback singles). A fn still referenced as somebody's parent\n        ;; keeps its identity.\n        retained (if (and (= :fn entity-name) (seq candidates))\n                   (into (or retained #{})\n                         (filter (fn [id]\n                                   (seq (sp/query-ref-many-owners\n                                          base-storage :fn :parent-ids id))))\n                         candidates)\n                   retained)]\n    (into [] (remove (or retained #{})) candidates)))","gi":39},{"say":"The identity-plane repair primitives for the OTHER ghost source: a\n           package fn's id is `uuid-v5(ns-path, name)`, so a namespace move\n           mints a new id and abandons the old row with every ref still aimed\n           at it. `repoint-refs!` fills refs in place across BOTH planes\n           (identity and every branch's version rows); `purge-fn-subgraph!`\n           below then removes the abandoned subgraph. The sync-time\n           reconciler (`packages.sync/reconcile-moved-identities!`) runs them\n           after every package sync, and the operator tool\n           `graphden.dev.integrity` delegates to the same two.","defn":"repoint-refs!","ns":"graphden.versioning.identity-repair","n":11,"file":"src/graphden/versioning/identity_repair.clj","line":47,"code":"(defn repoint-refs!\n  \"Fill every ref targeting a key of `old->new` with its replacement,\n   in place, across identity AND version planes; `:fn.parent-ids` and\n   the fn type-FKs included. Returns the number of rows touched.\n   `plan!` (optional) is called with `{:op :repoint …}` per change —\n   pass a collector for dry-run planning; when `dry-run?` is true no\n   write happens.\"\n  ([storage old->new] (repoint-refs! storage old->new nil false))\n  ([storage old->new plan! dry-run?]\n   (let [base (base-of storage)\n         n (volatile! 0)\n         fill! (fn [entity row field]\n                 (when-let [target (old->new (get row field))]\n                   (when plan!\n                     (plan! {:op :repoint :entity entity :id (:id row)\n                             :field field :from (get row field)\n                             :to target}))\n                   (vswap! n inc)\n                   (when-not dry-run?\n                     (sp/update-entity base entity (:id row)\n                                       {field target}))))]\n     (doseq [[entity fields] ref-fields\n             row (sp/query-entities base entity {})\n             field fields]\n       (fill! entity row field))\n     (doseq [f (sp/query-entities base :fn {})]\n       (doseq [field [:base-fn-id :element-fn-id :return-type-fn-id]]\n         (fill! :fn f field))\n       (let [pids (:parent-ids f)]\n         (when (some old->new pids)\n           (let [pids' (mapv #(get old->new % %) pids)]\n             (when plan!\n               (plan! {:op :repoint :entity :fn :id (:id f)\n                       :field :parent-ids :from pids :to pids'}))\n             (vswap! n inc)\n             (when-not dry-run?\n               (sp/update-entity base :fn (:id f)\n                                 {:parent-ids pids'}))))))\n     @n)))","gi":40},{"say":"The branch-symmetric resolved-view diff: gather every entity touched\n           on either side's visibility set, resolve both, and report\n           added/modified. The simplest read-only comparison — it precedes the\n           conflict-oriented framing below.","defn":"diff-branches","ns":"graphden.versioning.storage.merge","n":12,"file":"src/graphden/versioning/storage/merge.clj","line":342,"code":"(defn diff-branches\n  \"Resolved-view diff between `source-branch-id` and `target-branch-id`.\n\n   For every versioned entity-type, finds every entity-id that has at\n   least one version record on EITHER branch's ancestor chain, then\n   resolves each on both branches. An entry is included only when the\n   resolved views actually differ.\n\n   `resolve-entities-batch` returns the bare identity row when an\n   entity has no version on the chain (used by the executor for\n   base-fns); we treat that as `nil` here so a fn that exists only on\n   one branch reports `:added-in-source` / `:added-in-target` rather\n   than `:modified`.\n\n   Returns:\n     {:source-branch-id <uuid>\n      :target-branch-id <uuid>\n      :diffs [{:entity-name :fn\n               :entity-id   <uuid>\n               :source-version <resolved map or nil>\n               :target-version <resolved map or nil>\n               :change      :added-in-source | :added-in-target | :modified}\n              …]}\n\n   Branch-symmetric: doesn't privilege the source as the side bringing\n   in changes (use `detect-conflicts` for the merge-oriented framing).\n\n   `branch-merge` records contribute to visibility — each branch's\n   visibility set is its ancestor chain PLUS the source-branch of\n   every merge that landed on any ancestor. Mirrors the resolver's\n   two-hop algorithm exactly.\"\n  [base-storage source-branch-id target-branch-id]\n  (let [source-vis (branch-visibility-ids base-storage source-branch-id)\n        target-vis (branch-visibility-ids base-storage target-branch-id)\n        touched (touched-entities-by-side base-storage source-vis target-vis)\n        touched-source (reduce-kv (fn [m k v] (assoc m k (:source v))) {} touched)\n        touched-target (reduce-kv (fn [m k v] (assoc m k (:target v))) {} touched)\n        all-touched (merge-with set/union touched-source touched-target)\n        source-resolved (batch-resolve base-storage all-touched source-branch-id)\n        target-resolved (batch-resolve base-storage all-touched target-branch-id)\n        in-chain? (fn [touched ename eid]\n                    (contains? (get touched ename #{}) eid))\n        diffs (for [[entity-name ids] all-touched\n                    eid ids\n                    :let [sv (when (in-chain? touched-source entity-name eid)\n                               (get source-resolved [entity-name eid]))\n                          tv (when (in-chain? touched-target entity-name eid)\n                               (get target-resolved [entity-name eid]))\n                          ;; created-at differs on every version row; comparing\n                          ;; data-only avoids spurious entries.\n                          sv-data (some-> sv (dissoc :created-at))\n                          tv-data (some-> tv (dissoc :created-at))]\n                    :when (not= sv-data tv-data)]\n                {:entity-name entity-name\n                 :entity-id eid\n                 :source-version sv\n                 :target-version tv\n                 :change (cond\n                           (and (nil? tv) (some? sv)) :added-in-source\n                           (and (nil? sv) (some? tv)) :added-in-target\n                           :else :modified)})]\n    {:source-branch-id source-branch-id\n     :target-branch-id target-branch-id\n     :diffs (vec diffs)}))","gi":41},{"say":"Finds entities modified on BOTH branches after the computed fork\n           point (skipping branch-local fns). This introduces fork-point\n           reasoning and defines exactly what a merge must resolve before it can\n           proceed.","defn":"detect-conflicts","ns":"graphden.versioning.storage.merge","n":13,"file":"src/graphden/versioning/storage/merge.clj","line":158,"code":"(defn detect-conflicts\n  \"Finds entities modified in both source and target branches after fork point.\n\n   Returns a map:\n   {:conflicts [{:entity-name :fn\n                 :entity-id uuid\n                 :source-version <resolved version data>\n                 :target-version <resolved version data>}]\n    :fork-point <Instant>}\"\n  [base-storage source-branch-id target-branch-id]\n  (let [fp (fork-point base-storage source-branch-id target-branch-id)\n        source-modified (modified-entities-after base-storage source-branch-id fp)\n        target-modified (modified-entities-after base-storage target-branch-id fp)\n        ;; Conflicting entity-ids per type — modified on BOTH branches.\n        conflict-ids (reduce-kv\n                       (fn [acc entity-name source-ids]\n                         (let [target-ids (get target-modified entity-name #{})\n                               common (set/intersection source-ids target-ids)]\n                           (cond-> acc\n                             (seq common) (assoc entity-name common))))\n                       {}\n                       source-modified)\n        ;; Two branch resolutions, batched per entity type.\n        source-resolved (batch-resolve base-storage conflict-ids source-branch-id)\n        target-resolved (batch-resolve base-storage conflict-ids target-branch-id)\n        conflicts (for [[entity-name ids] conflict-ids\n                        entity-id ids\n                        :let [src-v (get source-resolved [entity-name entity-id])\n                              owner (conflict-owning-fn-id base-storage entity-name\n                                                           entity-id src-v)]\n                        ;; A branch-local fn's config is intentionally\n                        ;; per-branch — it must NEVER surface as a merge\n                        ;; conflict. The resolver already drops its\n                        ;; cross-branch version rows on read; without\n                        ;; this the user is forced to resolve a phantom\n                        ;; conflict and, by picking `:source`, would\n                        ;; leak the source branch's value onto the\n                        ;; target (exactly what branch-local forbids).\n                        :when (not (and owner\n                                        (bl/effective-branch-local? base-storage owner)))]\n                    {:entity-name entity-name\n                     :entity-id entity-id\n                     :source-version src-v\n                     :target-version (get target-resolved [entity-name entity-id])})]\n    {:conflicts (vec conflicts)\n     :fork-point fp}))","gi":42},{"say":"The merge itself: assert conflicts are resolved, then atomically\n           write ONE `branch-merge` record — which makes the source's versions\n           visible through resolution, copying no rows — plus any resolution\n           overrides. The payoff step tying resolution and conflict detection\n           together.","defn":"merge-branch!","ns":"graphden.versioning.storage.merge","n":14,"file":"src/graphden/versioning/storage/merge.clj","line":444,"code":"(defn merge-branch!\n  \"Merges source branch into the current (target) branch.\n\n   Creates a branch-merge record that makes source versions visible on target\n   via the resolution algorithm. No version records are copied.\n\n   If conflicts exist (entities modified on both branches after fork point),\n   throws unless conflict-resolutions are provided.\n\n   Arguments:\n   - versioned-storage: VersionedStorage instance (target branch)\n   - source-branch-id: Branch to merge from\n   - opts: Optional map with :conflict-resolutions\n\n   conflict-resolutions is a map of {[entity-name entity-id] :source | :target}\n   - :source — keep source branch version (create version record on target)\n   - :target — keep target branch version (no action needed, target already has it)\n\n   Returns the branch-merge record.\"\n  ([versioned-storage source-branch-id]\n   (merge-branch! versioned-storage source-branch-id {}))\n  ([versioned-storage source-branch-id {:keys [conflict-resolutions]}]\n   (let [base-storage (:base-storage versioned-storage)\n         target-branch-id (:branch-id versioned-storage)\n         {:keys [conflicts]} (detect-conflicts base-storage source-branch-id\n                                               target-branch-id)]\n     (assert-resolutions-cover-conflicts! conflicts conflict-resolutions)\n     ;; ATOMIC: the merge record (which surfaces every source version on\n     ;; target) and the conflict-resolution overrides (which beat that\n     ;; surfacing for entities the user resolved as `:target`) must land\n     ;; together. Committing the merge record but losing the resolutions\n     ;; would silently discard the user's decisions — the source value\n     ;; would surface where they chose to keep target. `PostgresStorage`\n     ;; exposes its `:pool` as the Connectable `sp/create-entity` runs on,\n     ;; so binding the storage to a `with-transaction` connection makes\n     ;; both writes share one commit. Non-PG storages (no `:pool`) fall\n     ;; back to the prior sequential behaviour. Single `merge-ts` so the\n     ;; resolution-wins ordering is structural, not clock-dependent.\n     (let [merge-ts (now)\n           write! (fn [storage]\n                    (let [merge-record (create-merge-record! storage source-branch-id\n                                                             target-branch-id merge-ts)]\n                      (apply-resolutions! storage conflicts conflict-resolutions\n                                          target-branch-id merge-ts)\n                      merge-record))]\n       (if-let [pool (:pool base-storage)]\n         (jdbc/with-transaction [tx pool]\n                                (write! (assoc base-storage :pool tx)))\n         (write! base-storage))))))","gi":43},{"say":"The graph EPOCH — freshness as a comparison, not an\n           imperative. Every graph-shaped write bumps this sequence\n           BEFORE writing; the router's fetch-time check\n           (`validate-graph-epoch!`) heals any cached ctx whose eager\n           invalidation was skipped — a client abort mid-request, a\n           write path with no NOTIFY, a lost NOTIFY. The eager delta\n           machinery and NOTIFY remain pure latency optimizations,\n           which is what their docstrings always claimed.","defn":"bump!","ns":"graphden.storage.postgres.graph-epoch","n":15,"file":"src/graphden/storage/postgres/graph_epoch.clj","line":97,"code":"(defn bump!\n  \"nextval BEFORE a graph-shaped write; remembers the value on the\n   handle. No-op (nil) for non-graph entities, pool-less handles, or a\n   missing sequence.\"\n  [storage entity-name]\n  (when (contains? graph-epoch-entities entity-name)\n    (when-let [pool (:pool storage)]\n      (try\n        ;; single-column row; take the value positionally — next.jdbc\n        ;; qualifies column keys by relation, so keyword access is\n        ;; brittle across the two query shapes here.\n        (let [v (some-> (jdbc/execute-one!\n                          pool [(str \"SELECT nextval('\" sequence-name \"')\")])\n                        vals first)]\n          (when (and v (:graph-epoch-local storage))\n            (swap! (:graph-epoch-local storage)\n                   assoc v {:at (System/currentTimeMillis) :noted? false})\n            (when *request-bump-log*\n              (swap! *request-bump-log* conj v)))\n          v)\n        (catch Exception e (warn-once e) nil)))))","gi":44},{"say":"Builds a fresh live `ExecutionContext` whose storage is a\n           `VersionedStorage` rewrapped at the requested branch, with its own\n           compiled-registry and graph-cache atoms. This is how a branch gets\n           its own executor without re-sharding the graph.","defn":"build-branch-ctx","ns":"graphden.system.branch-router","n":16,"file":"src/graphden/system/branch_router.clj","line":98,"code":"(defn- build-branch-ctx\n  \"Create a fresh ExecutionContext bound to `branch-id`. Each branch\n   gets its own atoms (compiled-registry / graph-cache / compile-deps)\n   so writes invalidate the right slice — `invalidate-graph-cache!`\n   takes a ctx and only touches that ctx's caches.\"\n  [base-ctx branch-id]\n  (let [base-storage (vs/unwrap (:storage base-ctx))\n        branch-storage (vs/->VersionedStorage base-storage branch-id)]\n    (cond-> (ctx/create-context {:storage branch-storage\n                                 :base-fns (:base-fns base-ctx)\n                                 :clock (:clock base-ctx)\n                                 :allowed-effects (:allowed-effects base-ctx)\n                                 ;; Inherit the executor's org shard — a branch\n                                 ;; ctx must compile the same slice of the graph\n                                 ;; as its base, or the pod would pull every\n                                 ;; tenant's fns back in through the side door.\n                                 :executor-orgs (:executor-orgs base-ctx)\n                                 ;; Inherit the pod role so per-branch requests\n                                 ;; apply the same hosted/BYO refusal.\n                                 :byo-executor? (:byo-executor? base-ctx)})\n      ;; Privileged structural-read storage for THIS branch (§4 Design B): the\n      ;; raw PG re-wrapped at branch-id, so `rebuild!` compiles every org's fns\n      ;; in this executor's shard (isolation stays on the org-scoped `:storage`\n      ;; above at runtime). Absent in single-tenant → compile reads fall back to\n      ;; :storage.\n      (:pg-storage base-ctx)\n      (assoc :pg-storage (:pg-storage base-ctx)\n             :compile-storage (vs/->VersionedStorage (:pg-storage base-ctx) branch-id))\n      ;; Inherit the cross-pod NOTIFY emitter. Without it a CRUD write\n      ;; served on a non-default branch tells sibling pods nothing —\n      ;; `crud.entities/notify-after-write!` reads it off the ctx, and\n      ;; only the base ctx used to carry it, so every branch edit was\n      ;; silently pod-local.\n      (:notify-emitter base-ctx) (assoc :notify-emitter (:notify-emitter base-ctx))\n      ;; Inherit the off-record auth seam so per-branch execution\n      ;; authenticates through the same provider as the base context.\n      (:auth-provider base-ctx) (assoc :auth-provider (:auth-provider base-ctx))\n      ;; Inherit the per-namespace execute guard (§4.2) — branch execution\n      ;; mus

# gitleaks configuration for graphden.
#
# `[extend] useDefault` keeps every rule from gitleaks' built-in config; the
# rules below are the ones we learned we needed.

[extend]
useDefault = true

# Guards the `||` fallback of a credential env lookup in browser tests. The
# built-in rules don't fire on a short opaque token (no vendor prefix, no
# entropy signature, no `key =` shape), so this rule does.
#
# The convention is that the fallback is a documented placeholder (see
# `tools/browser-test/edit-test-helpers.js`, which uses `test123`). Anything
# else in that position is a real credential until proven otherwise.
[[rules]]
id = "graphden-env-token-literal-fallback"
description = "Literal fallback for a credential env var — use the documented placeholder, not a live token"
regex = '''\b(?:process\.env\.)?(?:AUTH_TOKEN|API_KEY|API_TOKEN|ACCESS_TOKEN|SECRET_KEY|VAULT_TOKEN)\b\s*\|\|\s*['"][^'"\n]{4,}['"]'''
tags = ["graphden", "credential", "fallback"]

  [rules.allowlist]
  description = "Documented placeholders that are not credentials."
  regexTarget = "match"
  regexes = [
    '''\|\|\s*['"](?:test123|changeme|placeholder|dummy|example|localhost)['"]''',
  ]


# ---------------------------------------------------------------------------
# History allowlist — content-based, so it survives a history rewrite (the
# previous commit-SHA entries were invalidated when LAUNCH_PLAN/DISTRIBUTION and
# a dead demo token were purged from history). The dead AUTH_TOKEN is gone from
# history (replaced with the `test123` placeholder), so it no longer needs an
# entry — the rule above allowlists `test123` on its own.
# ---------------------------------------------------------------------------
[allowlist]
description = "Known non-credential matches."
regexes = [
  # `generic-api-key` fires on a fn ROUTE UUID in two throwaway probe scripts
  # (tools/browser-test/test_expand_both_routes.js, test_two_routes_direct.js).
  # A graph entity id, not a credential. The scripts are DELETED from the
  # tree, but the commit that added them (3cc4a88d) is in history, and both
  # the GitHub job and `bb gitleaks`' second pass scan history — so the
  # entry stays as long as that commit does. (Dropped once on 2026-09-02 on
  # the strength of a working-tree-only local scan; GitHub caught it.)
  '''21164217-585a-4335-8ade-da58f255c6ce''',
]
paths = [
  # The developer's LOCAL stack env file: git-ignored (can never be
  # committed), but the working-tree scan runs `--no-git` and therefore
  # sees ignored files too. GitHub CI checkouts have no `.env`, so this
  # only fires on a local full `bb ci`. Real secrets legitimately live
  # here — that is the file's job; skipping it is not a coverage loss.
  '''^\.env$''',
]

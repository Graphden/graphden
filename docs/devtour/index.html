 one. See lookup ns.\n         free-slots (lookup/free-arg-slot-map-cached ctx fn-id)\n         declared-eff (persist/declared-effects-of fn-id)\n         need-persist? (or (:persist? parsed) (seq declared-eff))\n         executor-args (into {}\n                             (keep (fn [[k v]]\n                                     (when (contains? free-slots (keyword k))\n                                       [(keyword k)\n                                        (if (persist/ref-arg? v)\n                                          (persist/parse-ref-fn-id v)\n                                          v)])))\n                             (:args parsed))\n         cancel-flag (atom false)\n         ;; A tenant's per-org cap is enforced FLEET-WIDE (counting pending\n         ;; rows in shared storage); the public/platform org keeps the per-pod\n         ;; atom. `storage` is the org-scoped request storage, so the fleet\n         ;; count sees only this org's own rows.\n         org (tc/current-org)\n         release (persist/acquire-execution-slot! storage org (not= org tc/public-org))]\n     (if (nil? release)\n       ;; Global or per-org concurrency cap hit — reject WITHOUT creating a\n       ;; row or a future, so a client can't pile unbounded compute onto the\n       ;; shared JVM. Reuses the standard rejection envelope.\n       {:ok false :status :rejected\n        :error \"Execution capacity exceeded — retry shortly\"\n        :http-status 429\n        :error-data {:reason :over-capacity}}\n       (let [pre-persisted? need-persist?\n             ;; Between `acquire-execution-slot!` and `run-future` (whose\n             ;; future's `finally` takes ownership of `release`), the pending-\n             ;; row write can throw (DB blip / unique / RLS reject). Release\n             ;; the slot on any such throw or the permit leaks permanently —\n             ;; the org (then the JVM) would eventually hit the cap and reject\n             ;; every execution with `:over-capacity` while nothing runs.\n             ;; `release` is idempotent, so the future's finally re-calling it\n             ;; is a no-op.\n             [row fut trace]\n             (try\n               (let [row (when pre-persisted?\n                           (persist/create-pending-with-args!\n                             storage fn-version-id declared-eff\n                             (:user-id parsed) (:args parsed) free-slots))\n                     [fut trace] (persist/run-future exec-ctx fn-id executor-args cancel-flag release)]\n                 [row fut trace])\n               (catch Exception t\n                 (release)\n                 (throw t)))\n             _   (when row (persist/register-future! (:id row) fut cancel-flag))\n             result (try (deref fut (:timeout-ms parsed) ::pending)\n                         (catch java.util.concurrent.ExecutionException ee\n                           {::ex (java.util.concurrent.ExecutionException/.getCause ee)}))\n             ;; Closure (not eager) — only the inline-success/failure\n             ;; branches snapshot the trace; timeout branches hand the atom\n             ;; off to `record-completion!` which snapshots when the future\n             ;; resolves.\n             runtime-eff (fn [] (persist/snapshot-runtime-effects trace))]\n         (cond\n           ;; Timeout AND we haven't pre-persisted — persist lazily so the\n           ;; client gets an id to poll. record-completion! tails the future\n           ;; to update the row when it finally resolves.\n           (and (= ::pending result) (not pre-persisted?))\n           (let [r (persist/create-pending-with-args!\n                     storage fn-version-id declared-eff\n                     (:user-id parsed) (:args parsed) free-slots)]\n             (persist/register-future! (:id r) fut cancel-flag)\n             (persist/record-completion! storage (:id r) fn-id fut trace declared-eff)\n             {:status :pending :execution-id (str (:id r))})\n\n           ;; Timeout AND we pre-persisted — record-completion's tail-future\n           ;; fills in :result; client polls our row.\n           (= ::pending result)\n           (do (persist/record-completion! storage (:id row) fn-id fut trace declared-eff)\n               {:status :pending :execution-id (str (:id row))})\n\n           ;; Inline failure — write outcome to the row synchronously (if\n           ;; persisted) so the polling-by-id case is consistent. Redaction\n           ;; lifts a tainted fn-def's :error/:error-data into a generic\n           ;; hidden form so the secret doesn't leak via the exception\n           ;; message (a string that may have wrapped the value).\n           (and (map? result) (::ex result))\n           (let [cause (::ex result)]\n             (finalize-inline-outcome\n               {:status :failed\n                :error (or (ex-message cause) (str cause))\n                :error-data (ex-data cause)}\n               {:storage storage :row row :fn-id fn-id\n                :declared-effects declared-eff :runtime-effects (runtime-eff)}))\n\n           ;; Inline success — same: write synchronously so the GET endpoint\n           ;; immediately returns :succeeded, no race window. Redaction\n           ;; lifts a tainted fn-def's :result into nil + `:tainted? true`\n           ;; so the JSON response carries metadata only.\n           :else\n           (-> (finalize-inline-outcome\n                 {:status :succeeded :result result}\n                 {:storage storage :row row :fn-id fn-id\n                  :declared-effects declared-eff :runtime-effects (runtime-eff)})\n               (assoc :declared-effects declared-eff))))))))","gi":73},{"say":"Atomically writes the `:fn-execution` row plus its per-arg\n           (`:fn-execution-arg` / `-item`) rows — the concrete `an execution\n           becomes persisted graph rows` step.","defn":"create-pending-with-args!","ns":"graphden.crud.fn-execution.persist","n":13,"file":"src/graphden/crud/fn_execution/persist.clj","line":283,"code":"(defn create-pending-with-args!\n  \"Atomic: create a `:pending` row + write the per-arg rows. Returns\n   the parent row. Used by both `apply-execute` pre-persist and lazy-\n   persist branches; the future registration happens at the callsite\n   because the two paths sequence it differently.\"\n  [storage fn-version-id declared-effects user-id args free-slots]\n  (let [r (create-pending-row! storage fn-version-id declared-effects user-id)]\n    (persist-args! storage (:id r) args free-slots)\n    r))","gi":74},{"say":"Updates the execution row with the future's terminal outcome (result\n           / error / cancelled, with taint redaction). Closes the loop so a\n           polled execution reflects final persisted state.","defn":"write-finished!","ns":"graphden.crud.fn-execution.persist","n":14,"file":"src/graphden/crud/fn_execution/persist.clj","line":407,"code":"(defn write-finished!\n  \"Update an existing row with the future's outcome.\n   `outcome` is one of:\n     {:status :succeeded :result V [:runtime-effects [\\\"env\\\" …]]}\n     {:status :failed :error E :error-data ED [:runtime-effects …]}\n     {:status :cancelled [:runtime-effects …]}\n\n   When the row's fn-def is tainted, `:result` is persisted as nil\n   and a `:tainted? true` flag rides alongside the row's other\n   metadata. Pass the outcome through `redact-outcome` BEFORE calling\n   this fn.\"\n  [storage execution-id outcome]\n  (let [base {:finished-at (java.time.Instant/now)\n              :status (:status outcome)}\n        body (case (:status outcome)\n               :succeeded (if (:tainted? outcome)\n                            ;; Hidden — :result stays nil on the row.\n                            ;; The error-data sidecar carries the\n                            ;; tainted flag so the GET endpoint can\n                            ;; surface it without re-reading the\n                            ;; rich-types registry on every poll.\n                            (assoc base\n                                   :result nil\n                                   :error-data {:reason :tainted})\n                            (let [[ok? v] (jsonize-result (:result outcome))]\n                              (assoc base\n                                     :result v\n                                     :result-truncated? (not ok?))))\n               :failed (assoc base\n                              :error (truncate-error (:error outcome))\n                              :error-data (jsonize-error-data\n                                            (:error-data outcome)))\n               :cancelled base)\n        body (cond-> body\n               (:runtime-effects outcome)\n               (assoc :runtime-effects (:runtime-effects outcome))\n               (:touched-secret? outcome)\n               (assoc :touched-secret? true))]\n    (sp/update-entity storage :fn-execution execution-id body)))","gi":75}]},{"id":":packages","title":"Packages — the graph's content","status":"toured","summary":"How fns.edn + impls.clj become base-fns and fn-defs; the loader,\n             load order, and the first-party package tree — then the inverse:\n             export, the ref wire form, and the publish/install registry.","paths":["src/graphden/packages/","resources/packages/"],"after":[":executor"],"steps":[{"say":"The newcomer's entry point: it just calls `load-packages [core web\n           app]`, naming the default package set and showing where the whole\n           disk-to-graph pipeline is kicked off at boot.","defn":"load-default-packages","ns":"graphden.packages.loader","n":1,"file":"src/graphden/packages/loader.clj","line":629,"code":"(defn load-default-packages\n  \"Loads the default package set: core, web, app.\"\n  []\n  (load-packages [\"core\" \"web\" \"app\"]))","gi":76},{"say":"The top-level orchestrator: resolve dependency order, load each\n           package, and fold every module's results into the combined\n           `{:base-fn-defs … :fn-defs … :namespaces …}` map that seeds the graph.\n           The hub the rest of this block drills into.","defn":"load-packages","ns":"graphden.packages.loader","n":2,"file":"src/graphden/packages/loader.clj","line":499,"code":"(defn load-packages\n  \"Loads multiple packages in dependency order.\n\n   Arguments:\n   - package-names: seq of package names to load (e.g., [\\\"core\\\" \\\"web\\\" \\\"app\\\"])\n\n   Returns:\n   {:base-fn-defs {fn-name -> {:args ... :return-type ... :impl fn}}\n    :fn-defs [{:name :foo :parent :bar :args {...}} ...]\n    :packages [{:name \\\"core\\\" :version \\\"1.0.0\\\" ...} ...]\n    :seeded-services [{:package-name \\\"app\\\"\n                       :service-name :default\n                       :fn-name :web-server\n                       :enabled? true\n                       :restart-policy :always\n                       :cardinality :per-pod\n                       :description \\\"…\\\"} …]}\"\n  [package-names]\n  (let [ordered (resolve-dependencies package-names)\n        _ (log/info \"Loading packages in order:\" ordered)\n        results (mapv load-single-package ordered)\n        ;; Single pass over results to build all aggregations\n        combined (reduce (fn [acc result]\n                           (let [pkg-name (get-in result [:meta :name])\n                                 pkg-services (get-in result [:meta :services])]\n                             (cond-> (-> acc\n                                         (update :base-fn-defs merge (:base-fn-defs result))\n                                         (update :fn-defs into (:fn-defs result))\n                                         (update :ns-descriptions merge (:ns-descriptions result))\n                                         (update :packages conj (:meta result)))\n                               (seq pkg-services)\n                               (update :seeded-services into\n                                       (mapv (fn [svc]\n                                               (assoc svc :package-name pkg-name))\n                                             pkg-services)))))\n                         {:base-fn-defs {} :fn-defs [] :ns-descriptions {}\n                          :packages [] :seeded-services []}\n                         results)\n        ;; Collect all namespace paths declared in modules.\n        ;; A path like \"core.arithmetic\" also implies \"core\" as a parent ns.\n        all-ns-paths (into #{}\n                           (comp\n                             (mapcat (fn [result]\n                                       (keep (fn [[_fn-name fn-def]]\n                                               (:namespace fn-def))\n                                             (:base-fn-defs result))))\n                             (remove nil?))\n                           results)\n        fn-def-ns    (into #{} (keep :namespace) (:fn-defs combined))\n        ;; Expand parent ns paths: \"core.arithmetic\" → #{\"core\" \"core.arithmetic\"}\n        expand-ns    (fn [ns-path]\n                       (let [segments (str/split ns-path #\"\\.\")\n                             paths (map (fn [n]\n                                          (str/join \".\" (take (inc n) segments)))\n                                        (range (count segments)))]\n                         (set paths)))\n        all-namespaces (reduce into #{} (map expand-ns (into all-ns-paths fn-def-ns)))\n        combined (assoc combined :namespaces all-namespaces)]\n    (log/info \"Loaded\" (count (:base-fn-defs combined)) \"base functions,\"\n              (count (:fn-defs combined)) \"fn-defs\")\n    combined))","gi":77},{"say":"A DFS topological sort over each `package.edn`'s `:dependencies`,\n           pulling transitive deps so primitives load before their consumers.\n           This is the dependency-driven load order.","defn":"resolve-dependencies","ns":"graphden.packages.loader","n":3,"file":"src/graphden/packages/loader.clj","line":461,"code":"(defn- resolve-dependencies\n  \"Returns packages in dependency order (topological sort).\n\n   Pulls TRANSITIVE deps — if `app` declares `:dependencies [\\\"core\\\"\n   \\\"web\\\" \\\"storage\\\"]` and the caller passes just `[\\\"app\\\"]`, all\n   three are loaded ahead of `app`. Silently dropping a transitive dep\n   was a real bug: the missing primitive surfaced as `Unknown parent`\n   at sync time, far from the misconfiguration.\n\n   Validates version constraints (`{\\\"core\\\" \\\">=1.5.0\\\"}` form) against\n   the classpath versions once the graph is resolved — a mismatch throws\n   `:packages/version-conflict` at boot, not `Unknown parent` at sync.\n\n   Simple DFS topological sort, no cycle detection (a cycle in the\n   dep graph would loop here; package.edn dep graphs are tiny and\n   reviewed).\"\n  [package-names]\n  (let [metas (atom {})\n        load-meta! (fn [pkg]\n                     (or (@metas pkg)\n                         (let [m (load-package-meta pkg)]\n                           (swap! metas assoc pkg m)\n                           m)))\n        sorted (atom [])\n        visited (atom #{})\n        visit (fn visit\n                [pkg]\n                (when-not (@visited pkg)\n                  (swap! visited conj pkg)\n                  (doseq [dep (normalize-deps (get (load-meta! pkg) :dependencies []))]\n                    (visit (:name dep)))\n                  (swap! sorted conj pkg)))]\n    (doseq [pkg package-names]\n      (visit pkg))\n    (validate-dep-constraints! @metas)\n    @sorted))","gi":78},{"say":"Runs after ordering to check declared semver constraints against the\n           classpath, failing fast at boot with `:packages/version-conflict`\n           instead of a cryptic `Unknown parent` later. The version machinery\n           guarding load order.","defn":"validate-dep-constraints!","ns":"graphden.packages.loader","n":4,"file":"src/graphden/packages/loader.clj","line":440,"code":"(defn- validate-dep-constraints!\n  \"Given `{package-name -> package.edn-meta}` for every loaded package,\n   throw `:packages/version-conflict` if a declared version constraint is\n   not satisfied by the version PRESENT on the classpath. Constraint-free\n   deps (legacy bare names) are skipped. Pure over its argument so it is\n   unit-testable without classpath fixtures.\"\n  [metas]\n  (doseq [[pkg meta] metas\n          dep (normalize-deps (:dependencies meta))\n          :when (:constraint dep)\n          :let [present (get-in metas [(:name dep) :version])]]\n    (when-not (semver/satisfies-constraint? present (:constraint dep))\n      (throw (ex-info (format \"Package %s requires %s %s, but version %s is present\"\n                              pkg (:name dep) (:constraint dep) (or present \"?\"))\n                      {:type :packages/version-conflict\n                       :package pkg\n                       :dependency (:name dep)\n                       :required (:constraint dep)\n                       :present present})))))","gi":79},{"say":"For one package: read its `package.edn` metadata and reduce over its\n           `:modules`, merging each module's base-fn-defs and fn-defs. The bridge\n           from `a package` down to `its modules`.","defn":"load-single-package","ns":"graphden.packages.loader","n":5,"file":"src/graphden/packages/loader.clj","line":381,"code":"(defn- load-single-package\n  \"Loads a single package and returns its functions.\n\n   The package's top-level namespace (the bare package name, e.g. `core`)\n   inherits its description from `package.edn`'s `:description`. Module\n   namespaces (`core.arithmetic`, …) get theirs from each module's\n   `fns.edn` `:description`.\"\n  [package-name]\n  (log/info \"Loading package:\" package-name)\n  (let [pkg-meta (load-package-meta package-name)\n        modules (:modules pkg-meta)\n        seed-ns-descriptions (cond-> {}\n                               (:description pkg-meta)\n                               (assoc package-name (:description pkg-meta)))]\n\n    (reduce\n      (fn [acc module-name]\n        (let [{:keys [base-fn-defs fn-defs ns-descriptions]}\n              (process-module package-name module-name)]\n          (-> acc\n              (update :base-fn-defs merge base-fn-defs)\n              (update :fn-defs into fn-defs)\n              (update :ns-descriptions merge ns-descriptions))))\n      {:base-fn-defs {}\n       :fn-defs []\n       :ns-descriptions seed-ns-descriptions\n       :meta pkg-meta}\n      modules)))","gi":80},{"say":"The heart of one module: load its `fns.edn` and `impls.clj`, then\n           `group-by` splits the entries into base-fns (which need impls) versus\n           fn-defs (compositions / type-rows). Where fns.edn and impls.clj first\n           meet.","defn":"process-module","ns":"graphden.packages.loader","n":6,"file":"src/graphden/packages/loader.clj","line":329,"code":"(defn- process-module\n  \"Processes a single module, returning base-fn-defs and fn-defs.\n   Each fn-def and base-fn-def receives a :namespace key from the\n   module's fns.edn declaration (nil if no namespace declared).\n\n   Type-rows (`:type` / `:refine` / `:list` / `:union` / `:variant`)\n   ride along in the `fn-defs` slot — `composition/sync-fns-to-storage!`\n   routes them to slot / fn-slot / binding rows by role marker.\"\n  [package-name module-name]\n  (let [{ns-path :ns-path ns-description :ns-description fns :fns}\n        (load-module-fns package-name module-name)\n        impls (load-module-impls package-name module-name)\n\n        ;; Separate base functions from fn-defs\n        {base-fns true fn-defs false} (group-by base-fn? fns)\n\n        ;; Convert base functions to registry format. The `impls`-map\n        ;; value is either a bare impl fn or a `{:impl … :*-rule …}`\n        ;; map; `fn-def->base-fn-def` normalises both. The \"no impl\"\n        ;; check inspects the normalised `:impl` so a rule-only entry\n        ;; (missing `:impl`) is still rejected.\n        base-fn-defs (into {}\n                           (filter some?)\n                           (for [fn-def base-fns\n                                 :let [fn-name (:name fn-def)\n                                       impl-entry (get impls fn-name)\n                                       base-def (when impl-entry\n                                                  (fn-def->base-fn-def fn-def impl-entry))]]\n                             (if (:impl base-def)\n                               [fn-name (assoc base-def :namespace ns-path)]\n                               (do\n                                 (log/warn \"No impl found for base fn:\" fn-name\n                                           \"in\" package-name \"/\" module-name)\n                                 nil))))\n\n        ;; Attach namespace to fn-defs\n        fn-defs-with-ns (mapv #(if ns-path\n                                 (assoc % :namespace ns-path)\n                                 %)\n                              fn-defs)]\n\n    {:base-fn-defs base-fn-defs\n     :fn-defs fn-defs-with-ns\n     :ns-descriptions (if (and ns-path ns-description)\n                        {ns-path ns-description}\n                        {})}))","gi":81},{"say":"The classifier `process-module` groups on: an entry is a base-fn only\n           if it has no `:parent` / `:parents` and is not a type-row. This is the\n           fundamental base-fn versus fn-def distinction a newcomer must\n           internalize.","defn":"base-fn?","ns":"graphden.packages.loader","n":7,"file":"src/graphden/packages/loader.clj","line":222,"code":"(defn- base-fn?\n  \"Returns true if this is a base function — no role markers and no\n   parent. Type-rows (`:type` / `:refine` / `:list` / `:union` /\n   `:variant`) and composed defs (`:parent` / `:parents`) flow through\n   `:fn-defs` instead.\"\n  [fn-def]\n  (and (not (contains? fn-def :parent))\n       (not (contains? fn-def :parents))\n       (not (type-row? fn-def))))","gi":82},{"say":"Reads a module's `fns.edn` (pure EDN data) via a source-position\n           reader, attaching `:source-file` / `:source-line` to every fn-def so\n           later type errors point at `file:line`. How the on-disk declarations\n           enter memory.","defn":"load-module-fns","ns":"graphden.packages.loader","n":8,"file":"src/graphden/packages/loader.clj","line":116,"code":"(defn- load-module-fns\n  \"Loads fns.edn for a module. Expected shape:\n\n     {:namespace \\\"core.arithmetic\\\"\n      :description \\\"Arithmetic primitives — add/sub/mul/div/mod\\\"\n      :fns [{:name :add :args {...}} ...]}\n\n   Returns {:ns-path string :ns-description string-or-nil :fns [fn-defs]}.\n\n   Every fn-def carries `:source-file` (the resource path) and\n   `:source-line` (where the fn-def's opening `{` sat in the EDN).\n   Type-check errors and other diagnostics include those so users see\n   `file:line` instead of just `:my-fn`.\"\n  [package-name module-name]\n  (let [path (str \"packages/\" package-name \"/\" module-name \"/fns.edn\")]\n    (if-let [raw (read-resource-edn-with-meta path)]\n      {:ns-path (:namespace raw)\n       :ns-description (:description raw)\n       :fns (attach-source-meta (vec (:fns raw)) path)}\n      (throw (ex-info (str \"Module fns not found: \" package-name \"/\" module-name)\n                      {:type :package-error/module-not-found\n                       :package package-name\n                       :module module-name\n                       :path path})))))","gi":83},{"say":"The counterpart to fns.edn: slurp `impls.clj`, `eval` each form in a\n           fresh namespace, and return that namespace's `impls` var — the\n           `{fn-name → impl-fn}` map. How Clojure code on disk becomes live\n           functions.","defn":"load-impls-via-eval","ns":"graphden.packages.loader","n":9,"file":"src/graphden/packages/loader.clj","line":146,"code":"(defn- load-impls-via-eval\n  \"Loads implementations by evaluating the impls.clj file as Clojure code.\n   Returns the impls map from the namespace.\"\n  [package-name module-name]\n  (let [path (str \"packages/\" package-name \"/\" module-name \"/impls.clj\")]\n    (when-let [resource (io/resource path)]\n      (let [content (slurp resource)\n            ;; Parse the ns form to extract the namespace name\n            forms (read-string (str \"[\" content \"]\"))\n            ns-form (first forms)\n            ns-sym (when (and (seq? ns-form) (= 'ns (first ns-form)))\n                     (second ns-form))]\n        (when ns-sym\n          ;; Create the namespace if it doesn't exist\n          (create-ns ns-sym)\n\n          ;; Evaluate all forms in the namespace context\n          (binding [*ns* (the-ns ns-sym)]\n            (doseq [form forms]\n              (eval form)))\n\n          ;; Return the impls var value\n          (when-let [impls-var (ns-resolve ns-sym 'impls)]\n            @impls-var))))))","gi":84},{"say":"The glue: marry an fns.edn entry (args, return-type, effects, tags)\n           with its impl-map value into the registry-shaped\n           `{:args … :return-type … :impl fn …}`. Literally where fns.edn and\n           impls.clj fuse into a base-fn.","defn":"fn-def->base-fn-def","ns":"graphden.packages.loader","n":10,"file":"src/graphden/packages/loader.clj","line":246,"code":"(defn- fn-def->base-fn-def\n  \"Converts a fns.edn entry + impl entry to registry format.\n\n   Input:  {:name :add :args {:nums :jsonb} :return-type :numeric}\n   Impl:   (defbase add [nums] (apply + nums))\n   Output: {:args {:nums {:type :jsonb :required true}}\n            :return-type :numeric\n            :impl <fn>}\n\n   The `impl-entry` is either a bare impl fn or a map\n   `{:impl … :return-type-rule … :slot-types-rule … :nav-types-rule …}`\n   — the optional `*-rule` fns are the base-fn-specific type-rules\n   declared at the base-fn's own registration site. They flow into the\n   base-fn-def map and `record-rich-types!` threads them into the\n   rich-types-registry so the type-checker can look them up by base-fn\n   identity (no name-dispatch).\n\n   All registered impls are 2-arity `(fn [args ctx] …)` (produced by\n   `defbase`). The executor always calls them with both args, so the\n   loader simply hands impl-fn through.\"\n  [fn-def impl-entry]\n  (let [{:keys [impl return-type-rule slot-types-rule nav-types-rule\n                taint-propagate? lazy-seq-args compile-time-value?]}\n        (impl-entry->parts impl-entry)]\n    (cond-> {:args (normalize-args (:args fn-def))\n             :return-type (:return-type fn-def)\n             :impl impl}\n      (:description fn-def) (assoc :description (:description fn-def))\n      ;; Forward `:effects` (set of category tags). Every effectful\n      ;; base-fn names its specific category\n      ;; (`:db` / `:env` / `:io` / `:network` / `:time` / `:random` /\n      ;; `:process` / `:raw-sql`). `:process` = spawns supervised\n      ;; background work (service-eligibility marker); `:raw-sql` = raw\n      ;; SQL escape hatch, blocked for cloud/tenant graphs.\n      (:effects fn-def)     (assoc :effects (set (:effects fn-def)))\n      ;; Per-base-fn type-rules — only present when the impls.clj\n      ;; declared them on the entry map.\n      return-type-rule      (assoc :return-type-rule return-type-rule)\n      slot-types-rule       (assoc :slot-types-rule slot-types-rule)\n      nav-types-rule        (assoc :nav-types-rule nav-types-rule)\n      ;; `:taint-propagate?` — marker-taint (`:secret` &c.) flows from\n      ;; any tainted input into the return. Applied CENTRALLY by the\n      ;; checker on top of the structural rule/signature result —\n      ;; replaces the per-site `types/wrap-with-taint` wrapping.\n      taint-propagate?      (assoc :taint-propagate? true)\n      ;; `:lazy-seq-args` — seq slots whose ITEMS arrive as delays\n      ;; (consumer steps past unforced items, see :cond).\n      lazy-seq-args         (assoc :lazy-seq-args lazy-seq-args)\n      ;; `:compile-time-value?` — evaluate this base-fn ONCE at compile\n      ;; time and bake `(constantly result)` into the closure (see\n      ;; compile_eager). Used by `:cell` for a registry-persistent atom.\n      compile-time-value?   (assoc :compile-time-value? true)\n      ;; `:tags` — declarative capability / shape markers; consumed by\n      ;; policy callers (e.g. admin-only-vault gate) via\n      ;; `registry/fn-names-with-tag`. See `record-rich-types!`.\n      (seq (:tags fn-def))  (assoc :tags (set (:tags fn-def)))\n      ;; `:branch-local?` — identity-level monotonic flag. Pass\n      ;; through so `records-parser/attach-fn-meta` can stamp it onto\n      ;; the fn-row; the merge-resolution filter in\n      ;; `versioning.storage.resolution` reads it directly.\n      ;; Without this, the seed `:branch-local? true` on base-fns\n      ;; (`:http-server`, `:secret-leaf`, `:schedule`, `:env`) is\n      ;; silently stripped here and downstream sync writes nil.\n      (contains? fn-def :branch-local?)\n      (assoc :branch-local? (boolean (:branch-local? fn-def))))))","gi":85,"see":[{"gi":12,"label":"resolve-impl"}]},{"say":"A concrete `defbase` base-fn impl — `(defbase add [nums] (safe-arith\n           + nums :add))`. This is the value `load-impls-via-eval` collects and\n           `fn-def->base-fn-def` pairs with the `:add` entry in fns.edn. Grounds\n           the abstract loader in a real arithmetic primitive.","defn":"add","ns":"resources/packages/core/arithmetic/impls.clj","n":11,"file":"resources/packages/core/arithmetic/impls.clj","line":53,"code":"(defbase add [nums]\n  (safe-arith + nums :add))","gi":86,"see":[{"gi":13,"label":"defbase"}]},{"say":"Closes the loop into storage: take the collected namespace paths,\n           build the `core` → `core.arithmetic` parent-child `:ns` entity\n           hierarchy, and return `{ns-path → id}` that the fn-def sync hangs the\n           live fn rows under.","defn":"sync-namespaces!","ns":"graphden.packages.loader","n":12,"file":"src/graphden/packages/loader.clj","line":566,"code":"(defn sync-namespaces!\n  \"Creates namespace entities in storage for all declared namespace paths.\n   Builds the parent-child hierarchy (e.g. 'core.arithmetic' creates both\n   'core' and 'core.arithmetic' with parent link). Optional\n   `descriptions` map (`{ns-path → string}`) seeds and updates the\n   `:description` field on matching namespace entities; undeclared\n   intermediate parents (`core` when only `core.arithmetic` is in the\n   map) keep `nil`.\n\n   Returns a map {ns-path-string → ns-entity-id} for downstream use.\"\n  ([storage namespace-paths]\n   (sync-namespaces! storage namespace-paths {}))\n  ([storage namespace-paths descriptions]\n   (if (empty? namespace-paths)\n     {}\n     (let [;; Expand each path to all its prefixes so the parent chain\n           ;; is always present — `\"a.b.c\"` ⇒ `#{\"a\" \"a.b\" \"a.b.c\"}`.\n           ;; Honours the docstring's \"creates both core and\n           ;; core.arithmetic\" promise even when the caller passes only\n           ;; leaf paths (e.g. package install). Idempotent for callers\n           ;; that already pre-expand (the package loader).\n           expanded (into #{}\n                          (mapcat (fn [p]\n                                    (let [segs (str/split p #\"\\.\")]\n                                      (map #(str/join \".\" (take (inc %) segs))\n                                           (range (count segs))))))\n                          namespace-paths)\n           sorted (sort-by #(count (str/split % #\"\\.\")) expanded)\n           existing (into {}\n                          (map (fn [ns-entity]\n                                 [(str (:parent-id ns-entity) \":\" (:name ns-entity))\n                                  ns-entity]))\n                          (sp/query-entities storage :ns {}))\n           result (atom {})]\n       (doseq [ns-path sorted]\n         (let [segments (str/split ns-path #\"\\.\")\n               parent-path (when (> (count segments) 1)\n                             (str/join \".\" (butlast segments)))\n               parent-id (when parent-path (get @result parent-path))\n               seg-name (last segments)\n               lookup-key (str parent-id \":\" seg-name)\n               existing-entity (get existing lookup-key)\n               description (get descriptions ns-path)]\n           (if existing-entity\n             (do\n               (when (and description\n                          (not= description (:description existing-entity)))\n                 (sp/update-entity storage :ns (:id existing-entity)\n                                   {:description description}))\n               (swap! result assoc ns-path (:id existing-entity)))\n             (let [new-entity (sp/create-entity storage :ns\n                                                (cond-> {:name seg-name\n                                                         :parent-id parent-id}\n                                                  description (assoc :description description)))]\n               (swap! result assoc ns-path (:id new-entity))))))\n       (log/info \"Synced\" (count @result) \"namespaces:\" (keys @result))\n       @result))))","gi":87,"see":[{"gi":5,"label":"sync-fns-to-storage!"}]},{"say":"The loader's INVERSE: typed graph records back to fns.edn-shaped\n           fn-def maps. Everything distribution-shaped (publish, install,\n           whole-graph download) rides this, and its contract is a fixpoint —\n           `parse(export(parse(x))) == parse(x)` — pinned by the\n           corpus-fixpoint test over the real core/web/app packages. Read it\n           as `process-module` run backwards.","defn":"records->fn-defs","ns":"graphden.packages.export","n":13,"file":"src/graphden/packages/export.clj","line":535,"code":"(defn records->fn-defs\n  \"Convert a flat record seq back into a vector of fns.edn fn-def maps.\n   Inverse of `records.parse/parse-module` at the records level:\n\n     (= (parse-module (records->fn-defs (parse-module fns)))\n        (parse-module fns))\n\n   Skips primitive rows and anonymous (name-less) rows — the former are\n   boot data, the latter are reconstructed inline at their use sites.\"\n  [records]\n  (let [ctx (index-records records)]\n    (->> (vals (:fns ctx))\n         (remove #(contains? prim-id->kw (:id %)))\n         (filter :name)\n         (mapv #(fn-row->fn-def % ctx)))))","gi":88},{"say":"How a ref serializes: BARE keyword when the name is unique\n           (canonical minimal form), namespace-QUALIFIED when it's duplicated\n           across the export set. Qualification never falls back to bare — a\n           version-materialized `@`-ns qualifies as `(keyword \"lib@1-2-0.sub\"\n           n)` and the root ns as `(keyword \"\" n)`, both legal in-memory\n           values even though no EDN reader could parse their printed form.","defn":"ref-kw","ns":"graphden.packages.export","n":14,"file":"src/graphden/packages/export.clj","line":109,"code":"(defn- ref-kw\n  \"Reference keyword for the fn with `id` — QUALIFIED when its bare\n   name is duplicated across the export set (`:dup-names`), bare\n   otherwise (canonical minimal form). Qualification never falls back\n   to bare: a version-materialized `@`-ns duplicate qualifies as\n   `(keyword \\\"lib@1-2-0.sub\\\" n)` and a ROOT-ns (nil path) duplicate\n   as `(keyword \\\"\\\" n)` — both are legal in-memory/JSONB values; the\n   EDN TEXT boundary spells them `#graphden/ref` (see\n   `records.wire/encode-unreadable-kws`, applied by\n   `export-graph-bundle`). The old bare fallback silently emitted an\n   ambiguous ref that re-import either rejected\n   (`:packages/ambiguous-ref`) or mis-resolved to a same-named\n   neighbour in the referencing module's own namespace.\"\n  [id ctx]\n  (let [f (get-in ctx [:fns id])\n        n (:name f)]\n    (when n\n      (if (contains? (:dup-names ctx) n)\n        (keyword (or (:namespace-id f) \"\") n)\n        (keyword n)))))","gi":89},{"say":"The EDN-TEXT boundary is the one place those unspellable keywords\n           break, so exactly there they become `#graphden/ref \"lib@…/n\"`\n           tagged literals before `pr-str`; `wire-readers` decodes them back\n           at the package loader and the remote bundle reader. In-memory and\n           JSONB paths keep raw keywords — the storage codec round-trips\n           them.","defn":"encode-unreadable-kws","ns":"graphden.packages.records.wire","n":15,"file":"src/graphden/packages/records/wire.clj","line":70,"code":"(defn encode-unreadable-kws\n  \"Walk `form` and replace every unreadable qualified keyword with its\n   `#graphden/ref` tagged literal, leaving everything else untouched.\n   Applied to the whole-graph bundle right before `pr-str`; the JSONB\n   publish path keeps raw keywords (its codec round-trips them).\"\n  [form]\n  (walk/postwalk\n    (fn [x]\n      (if (unreadable-kw? x)\n        (tagged-literal 'graphden/ref (subs (str x) 1))\n        x))\n    form))","gi":90},{"say":"Scoped export: a namespace SUBTREE as a publishable bundle — fns\n           under the root are the package's content, refs pointing OUT of the\n           subtree become its declared `:dependencies` (what install must\n           already have). This is the unit the in-graph registry versions.","defn":"export-namespace","ns":"graphden.packages.export","n":16,"file":"src/graphden/packages/export.clj","line":788,"code":"(defn export-namespace\n  \"Serialise the namespace subtree rooted at `root` (a dotted path) into\n   a publishable bundle:\n\n     {:namespace    root\n      :namespaces   [every sub-namespace included]\n      :fns          [fn-def …]   ; the subtree's own fns\n      :dependencies [fn-name …]} ; external fns the subtree references\n\n   `:dependencies` is the set of fn NAMES referenced from inside the\n   subtree but DEFINED outside it (excluding primitives) — what an\n   installer must already have present. This is the core of\n   `POST /api/packages/publish` (cloud) and `extract` (self-hosted);\n   registry persistence + versioning wrap this.\n\n   Vault paths are STRIPPED by default (publishing is sharing — see\n   § Secret-path policy above); `:secrets` manifests what the installer\n   must define. Pass `{:include-secret-paths? true}` only for an\n   org-internal bundle.\"\n  ([storage root] (export-namespace storage root {}))\n  ([storage root {:keys [include-secret-paths?]}]\n   (let [records (graph->records storage)\n         ctx (index-records records)\n         all-defs (records->fn-defs records)\n         owned-defs (filterv #(under-ns? (:namespace %) root) all-defs)\n         secrets (secret-path-args owned-defs)\n         owned-defs (if include-secret-paths?\n                      owned-defs\n                      (strip-secret-paths owned-defs))\n         owned-fn-ids (into #{}\n                            (comp (filter #(under-ns? (:namespace-id %) root))\n                                  (map :id))\n                            (vals (:fns ctx)))\n         ;; name index for resolving constraint type-name keywords → ns.\n         name->ns (into {}\n                        (keep (fn [f]\n                                (when (:name f)\n                                  [(keyword (:name f)) (:namespace-id f)])))\n                        (vals (:fns ctx)))\n         ;; External structural fn-id refs reachable from every owned fn —\n         ;; named, defined OUTSIDE the subtree, not a primitive. Collected once\n         ;; so we can derive both the fn-NAME deps and the package deps.\n         external-ref-fn-ids (into #{}\n                                   (comp (mapcat #(fn-ref-fn-ids % ctx))\n                                         (filter (fn [id]\n                                                   (let [f (get-in ctx [:fns id])]\n                                                     (and (:name f)\n                                                          (not (under-ns? (:namespace-id f) root))\n                                                          (not (contains? prim-id->kw id)))))))\n                                   owned-fn-ids)\n         ref-deps (into #{}\n                        (map #(keyword (:name (get-in ctx [:fns %]))))\n                        external-ref-fn-ids)\n         ;; The namespaces those external fns live in — the versioned ones\n         ;; (`X@V`) reverse-map to the packages this bundle depends on.\n         dep-namespaces (into #{}\n                              (keep #(:namespace-id (get-in ctx [:fns %])))\n                              external-ref-fn-ids)\n         ;; constraint type-name keywords (union / variant / map / tuple /\n         ;; fn-type) on owned fn rows whose target is defined outside.\n         constraint-deps (into #{}\n                               (comp (map #(get-in ctx [:fns %]))\n                                     (mapcat #(constraint-type-names (:constraint %)))\n                                     (filter (fn [nm]\n                                               (when-let [ns (name->ns nm)]\n                                                 (not (under-ns? ns root))))))\n                               owned-fn-ids)]\n     {:namespace root\n      :namespaces (vec (sort (distinct (map :namespace owned-defs))))\n      :fns owned-defs\n      :dependencies (vec (sort (into ref-deps constraint-deps)))\n      :package-dependencies (package-deps-from-namespaces storage dep-namespaces)\n      :secrets secrets\n      :secret-paths-included? (boolean include-secret-paths?)})))","gi":91},{"say":"The share-safety policy: vault paths are STRIPPED from bundles by\n           default (the slot stays a free `[:secret :text]` arg) and the\n           `:secrets` manifest lists what was affected — the publisher sees\n           the warning, the installer gets a `:needs-definition` todo. A\n           bundle is deliberately not a full copy of your secrets.","defn":"strip-secret-paths","ns":"graphden.packages.export","n":17,"file":"src/graphden/packages/export.clj","line":654,"code":"(defn strip-secret-paths\n  \"Remove vault paths from exported fn-defs. A `{:secret-path …}`\n   arg-value loses its `:secret-path` key; when nothing else remains the\n   arg entry is dropped entirely, so the slot reverts to a FREE arg of\n   its (secret-typed) slot — the type system then surfaces 'needs a\n   secret defined' at the importer's side instead of silently carrying\n   the exporter's vault topology.\"\n  [fn-defs]\n  (mapv (fn [fd]\n          (if-let [args (:args fd)]\n            (let [args' (into {}\n                              (keep (fn [[k v]]\n                                      (if (and (map? v) (contains? v :secret-path))\n                                        (when-let [rest-v (not-empty (dissoc v :secret-path))]\n                                          [k rest-v])\n                                        [k v])))\n                              args)]\n              (if (seq args') (assoc fd :args args') (dissoc fd :args)))\n            fd))\n        fn-defs))","gi":92},{"say":"Publish lands the bundle IN the graph: an immutable, content-hashed\n           `:package-version` row (name + semver + fns + declared deps).\n           Install is its mirror — `materialize-package-fns` syncs the pinned\n           version's fns into a version-qualified `@`-namespace and writes a\n           `:package-install` pin; update/rollback rewrites refs between\n           versions; fork copies copy-on-write with no pin.","defn":"publish-package-apply","ns":"resources/packages/registry/registry/impls.clj","n":18,"file":"resources/packages/registry/registry/impls.clj","line":51,"code":"(defbase publish-package-apply\n  [pkg-name pkg-version bundle]\n  (cr/record-effect! :db)\n  (cr/record-effect! :time)\n  (let [storage (request/require-storage ctx)\n        fns (:fns bundle)]\n    (if (seq (sp/query-entities storage :package-version\n                                {:name pkg-name :version pkg-version}))\n      {:ok false :reason \"version-exists\" :name pkg-name :version pkg-version}\n      (let [content-hash (ids/digest-hex \"SHA-256\" (json/generate-string fns))\n            row (sp/create-entity storage :package-version\n                                  {:name pkg-name\n                                   :version pkg-version\n                                   :ns-root (:namespace bundle)\n                                   :fns fns\n                                   :dependencies (:dependencies bundle)\n                                   :package-dependencies (:package-dependencies bundle)\n                                   :secrets (vec (:secrets bundle))\n                                   :content-hash content-hash\n                                   :published-at (java.time.Instant/now)})]\n        {:ok true\n         :id (str (:id row))\n         :name pkg-name\n         :version pkg-version\n         :content-hash content-hash\n         :fn-count (count fns)\n         :dependencies (:dependencies bundle)\n         ;; What the bundle's export STRIPPED (vault paths) — the\n         ;; publisher's \"nothing left silently\" warning, and the seed\n         ;; of the installer's :needs-definition.\n         :secrets (vec (:secrets bundle))}))))","gi":93}]},{"id":":web","title":"Web & the editor","status":"toured","summary":"HTTP routing, the graph-native page/partial runtime, and the\n             editor frontend.","paths":["resources/packages/web/","resources/packages/app/editor/"],"after":[":packages"],"steps":[{"say":"The http-kit wrapper base-fn: `run-server` spins the listener thread\n           and binds the composed Ring handler to a port, recording `:network` /\n           `:process` effects. Where a request first enters the web layer, so the\n           natural first stop. Note it is a tiny primitive — everything else is\n           composed from small base-fns in `web/http/fns.edn`.","defn":"http-server","ns":"resources/packages/web/http/impls.clj","n":1,"file":"resources/packages/web/http/impls.clj","line":216,"code":"(defbase http-server\n  [handler port]\n  (cr/record-effect! :network)\n  ;; :process — http-kit spawns a listener thread that lives past\n  ;; this call. The returned stopper kills it; service registry's\n  ;; validate-create requires :process for service-eligibility.\n  (cr/record-effect! :process)\n  ;; Request-scoped graph-epoch bump log (library-adapter boundary\n  ;; plumbing, not composition): every write inside this request logs\n  ;; its bump; the eager-invalidation tail drains + notes it. An\n  ;; aborted request unwinds the binding, its bumps age un-noted, and\n  ;; the router's grace-expiry heal covers them — a reused pool thread\n  ;; can never note a dead request's bumps.\n  (http-kit/run-server\n    (fn [req]\n      (binding [epoch/*request-bump-log* (atom [])]\n        (handler req)))\n    {:port port}))","gi":94},{"say":"Fully realizes the incoming request body so downstream graph handlers\n           see plain data instead of a one-shot stream — the very next thing that\n           happens to a raw request after it lands.","defn":"realize-request-body","ns":"resources/packages/web/http/impls.clj","n":2,"file":"resources/packages/web/http/impls.clj","line":136,"code":"(defbase realize-request-body\n  [request]\n  (realize-body request))","gi":95},{"say":"Composes the compiled reitit router with the default handler into the\n           single Ring callable http-kit actually invokes per request. The seam\n           between the server socket and routing.","defn":"ring-handler-fn","ns":"resources/packages/web/reitit/impls.clj","n":3,"file":"resources/packages/web/reitit/impls.clj","line":46,"code":"(defbase ring-handler-fn\n  \"Compose a compiled reitit router and a default handler into the\n   final Ring-handler callable that http-kit invokes per request.\"\n  [router default-handler]\n  (ring/ring-handler router default-handler))","gi":96},{"say":"Builds the bare `reitit.ring/router` from route data — which is itself\n           graph-composed vectors and keywords. This is the routing table the\n           handler consults to match a path to a handler.","defn":"ring-router-fn","ns":"resources/packages/web/reitit/impls.clj","n":4,"file":"resources/packages/web/reitit/impls.clj","line":22,"code":"(defbase ring-router-fn\n  \"Bare `(reitit.ring/router routes)`. The caller is expected to hand\n   in reitit-shaped data (vectors + keyword keys). Graph-side coercion\n   (vec'ing lazy `:seq` bindings, keywordizing string map-keys) is now\n   a separate fn-def `:_router-coerced-routes` in fns.edn — sites that\n   compose routes via graph primitives route their data through that\n   coercer before binding it here.\"\n  [routes]\n  (ring/router routes))","gi":97},{"say":"Constructs the fallback handler reitit uses when nothing matches,\n           wrapping the graph-composed 404 / 405 / 406 response maps. The `no\n           route` branch.","defn":"ring-create-default-handler-fn","ns":"resources/packages/web/reitit/impls.clj","n":5,"file":"resources/packages/web/reitit/impls.clj","line":33,"code":"(defbase ring-create-default-handler-fn\n  \"Build a Ring handler that reitit falls back to when no route matches.\n   Takes the three slot-specific Ring RESPONSE maps directly — wraps\n   each in `constantly` to satisfy reitit's `(handler request)`\n   contract here at the adapter, so the fn-graph composes responses\n   (pure data) without having to thread `:make-handler` per slot.\"\n  [not-found-response method-not-allowed-response not-acceptable-response]\n  (ring/create-default-handler\n    {:not-found          (constantly not-found-response)\n     :method-not-allowed (constantly method-not-allowed-response)\n     :not-acceptable     (constantly not-acceptable-response)}))","gi":98},{"say":"The middleware factory: turn a graph `body` (with `:request` and\n           `:next-handler` free args) into a reitit `{:name :wrap}` spec folded\n           around each route handler. How cross-cutting logic — like the\n           branch-routing wrap next — is expressed as a graph fn.","defn":"middleware","ns":"resources/packages/web/reitit/impls.clj","n":6,"file":"resources/packages/web/reitit/impls.clj","line":64,"code":"(defbase middleware\n  \"Produces a reitit-compatible middleware spec. `body` is a fn-graph\n   with TWO leftover free args (`:request` and `:next-handler`) — the\n   compiler builds a map-callable for it. We populate both keys per\n   request: `:request` is reitit's request, `:next-handler` is the\n   next link in the chain. `body` is responsible for routing them via\n   `:proceed` (a fn-def, not an impl).\"\n  [name body]\n  {:name name\n   :wrap (fn [handler]\n           (fn [request]\n             (body {:request request, :next-handler handler})))})","gi":99},{"say":"Reads the currently-installed per-branch router from a global atom\n           (nil before boot installs it). The branch-routing wrap needs this\n           router first.","defn":"current-branch-router","ns":"resources/packages/web/branch-router/impls.clj","n":7,"file":"resources/packages/web/branch-router/impls.clj","line":10,"code":"(defbase current-branch-router\n  \"Read the currently-installed branch router (nil when no router has\n   been installed yet — test paths, or the brief window before\n   `:exec/branch-router` fires). Single global-atom deref.\"\n  []\n  (br/current-router))","gi":100},{"say":"The branch-routing wrap: delegate the Ring request to the correct\n           per-branch handler resolved from the router above. This is how ONE\n           server multiplexes requests across branch-scoped graphs — the package\n           side of the versioning block's `dispatch`.","defn":"dispatch-to-branch","ns":"resources/packages/web/branch-router/impls.clj","n":8,"file":"resources/packages/web/branch-router/impls.clj","line":18,"code":"(defbase dispatch-to-branch\n  \"Delegate a Ring request to the appropriate per-branch handler\n   resolved by the supplied router. Single library call.\"\n  [router request]\n  ;; Tagged `:network` in fns.edn — the dispatched handler runs HTTP\n  ;; processing. Record explicitly so the audit-trail at this layer\n  ;; doesn't depend on what the downstream handler happens to record\n  ;; (effect-sets are idempotent over union, so double-recording is\n  ;; harmless if the handler also tags :network).\n  (cr/record-effect! :network)\n  (br/dispatch router request))","gi":101,"see":[{"gi":46,"label":"dispatch"}]},{"say":"The auth gate applied to a request inside the handler chain before a\n           page or action runs. Sits between routing/dispatch and the handler\n           body that will build a response.","defn":"authenticate-request","ns":"resources/packages/web/ring-adapter/impls.clj","n":9,"file":"resources/packages/web/ring-adapter/impls.clj","line":12,"code":"(defbase authenticate-request\n  [request]\n  ;; Delegate to the injected provider. Defensive: a context with no\n  ;; provider wired authenticates NOTHING (secure default) rather than\n  ;; throwing — so any half-configured ctx fails closed.\n  (if-let [provider (:auth-provider ctx)]\n    (auth/authenticate provider request)\n    {:authenticated? false}))","gi":102},{"say":"The generic `[tag attrs children]` constructor behind the graph-native\n           page runtime. User-composed pages are fn-defs (`:html-page`,\n           components) that emit hiccup through this primitive — including the\n           `data-action` attrs that the editor's JavaScript runtime\n           (`resources/packages/app/editor/*.js`) binds on click — alongside the `hx-*`\n           attrs whose server-rendered `/partials/*` fragments now carry\n           logic that once lived in that JS. Where a user's\n           page becomes a concrete hiccup tree.","defn":"hiccup-element","ns":"resources/packages/web/html/impls.clj","n":10,"file":"resources/packages/web/html/impls.clj","line":26,"code":"(defbase hiccup-element\n  [tag attrs children]\n  (let [tag-kw (if (keyword? tag) tag (keyword tag))]\n    (into (if attrs [tag-kw attrs] [tag-kw]) children)))","gi":103},{"say":"Wraps a string in a hiccup `RawString` so inline script / style bodies\n           (like the editor's bundled JS / CSS) render verbatim instead of being\n           HTML-escaped. The escape hatch that lets a composed page embed the JS\n           frontend without mangling it.","defn":"h-raw","ns":"resources/packages/web/html/impls.clj","n":11,"file":"resources/packages/web/html/impls.clj","line":18,"code":"(defbase h-raw\n  \"Wrap `:string` in a hiccup `RawString` so `:render-hiccup` emits it\n   verbatim — no HTML entity escaping. Used inside `<script>` / `<style>`\n   bodies where escaping would mangle the content. Single library call.\"\n  [string]\n  (h/raw string))","gi":104},{"say":"Serializes the assembled hiccup tree into an HTML string, with a\n           taint-propagation rule so rendered secrets stay redacted. The point\n           where a graph-composed page turns into the response body.","defn":"render-hiccup","ns":"resources/packages/web/html/impls.clj","n":12,"file":"resources/packages/web/html/impls.clj","line":13,"code":"(defbase render-hiccup\n  [hiccup]\n  (str (h/html hiccup)))","gi":105},{"say":"The outbound finalizer is a graph composition now — `:process-response`\n           in web/http/fns.edn stringifies headers, applies the `Connection: close`\n           policy, and encodes the body, all as fn-defs over single-call\n           primitives. This RFC 7231 Accept-Encoding negotiation is the one\n           self-contained parse the pipeline keeps in Clojure; the DECISION to\n           encode (thresholds, compressible pattern) lives in the graph. The last\n           stop as the rendered page leaves the web layer back through http-kit.","defn":"pick-encoding-fn","ns":"resources/packages/web/http/impls.clj","n":13,"file":"resources/packages/web/http/impls.clj","line":158,"code":"(defbase pick-encoding-fn\n  \"Content negotiation over `Accept-Encoding` (RFC 7231 §5.3) —\n   returns \\\"br\\\" when brotli is acceptable, else \\\"gzip\\\" when gzip\n   is, else \\\"identity\\\". q=0 forbids a coding; tokens are\n   case-insensitive. Single self-contained parse — the DECISION to\n   encode (and with what thresholds) lives in the graph.\"\n  [headers]\n  (let [h (header-ci headers \"Accept-Encoding\")]\n    (cond\n      (encoding-acceptable? h \"br\")   \"br\"\n      (encoding-acceptable? h \"gzip\") \"gzip\"\n      :else                           \"identity\")))","gi":106},{"say":"The server-side type-picker sweep behind\n           `/partials/compatible-type-options`. It filters the\n           `type-name-kinds` roster to the names that can legally narrow\n           `expected` in ONE alias-aware `subtype?` pass — replacing the\n           editor's former per-name fan-out of ~50 parallel\n           `POST /api/types/compatible` requests per picker open. The\n           graph-first migration's clearest case: a client loop collapses\n           into one server render.","defn":"compatible-type-names","ns":"graphden.crud.types-api","n":14,"file":"src/graphden/crud/types_api.clj","line":97,"code":"(defn compatible-type-names\n  \"`type-name-kinds` rows filtered to the names that can legally\n   narrow `expected` — `(subtype? (keyword name) expected)`, the same\n   alias-aware predicate `/api/types/compatible` answers per pair.\n   One call replaces the editor's former per-name fan-out (~50\n   parallel POSTs per type-picker open).\"\n  [ctx expected]\n  (filterv #(types/subtype? (keyword (:name %)) expected)\n           (type-name-kinds ctx)))","gi":107},{"say":"The `/api/types` wire-shaping layer the editor loads at boot and\n           after every mutation: the augmented rich-type snapshot with\n           `bulk-omitted-fields` stripped from each entry. The old\n           `?fn=<name>` per-fn full-entry backfill is gone with its only\n           client consumer — the return-type-rule popover is a server\n           partial now, and the layout strip facts read the raw registry\n           directly. How the type-checker's registry reaches the browser as\n           a lean payload.","defn":"api-rich-types","ns":"graphden.crud.types-api","n":15,"file":"src/graphden/crud/types_api.clj","line":642,"code":"(defn api-rich-types\n  \"Body of the `api-rich-types` base-fn — the wire-shaping layer over\n   the augmented snapshot: the lean BULK payload the editor loads at\n   boot + after each mutation, with `bulk-omitted-fields` stripped\n   from every entry. The former `?fn=<name>` per-fn FULL-entry branch\n   is gone with its one consumer (the deleted `ensureRichTypeFullEntry`\n   backfill — the return-type-rule popover is a server partial now).\"\n  [ctx]\n  (update-vals (rich-types-with-type-rows ctx)\n               #(apply dissoc % bulk-omitted-fields)))","gi":108}]},{"id":":layout","title":"Layout — the editor's graph view","status":"toured","summary":"Turn raw fn/slot/binding rows into the placed cards, edges and\n             server-computed facts the editor renders.","paths":["src/graphden/layout/"],"after":[":web"],"steps":[{"say":"Stage 1's data pull — every fn / slot / fn-slot / binding /\n           list-item row in one branch-cached batch (versioned) or five\n           vanilla queries. The whole pipeline is a pure transform over this\n           snapshot; a per-context graph cache keeps hover-frequency layout\n           requests from re-reading storage.","defn":"load-graph-entities-uncached","ns":"graphden.layout.data","n":1,"file":"src/graphden/layout/data.clj","line":320,"code":"(defn load-graph-entities-uncached\n  \"Pure storage read — fetch every fn/slot/fn-slot/binding/list-item\n   row and attach the derived `:args` slot views. Takes a plain\n   storage; the `ctx`-aware cache wrapper lives in the defbase shim.\"\n  [storage]\n  (let [graph (if (instance? VersionedStorage storage)\n                (vs/query-all-graph-entities storage)\n                {:fns        (vec (sp/query-entities storage :fn {}))\n                 :slots      (vec (sp/query-entities storage :slot {}))\n                 :fn-slots   (vec (sp/query-entities storage :fn-slot {}))\n                 :bindings   (vec (sp/query-entities storage :binding {}))\n                 :list-items (vec (sp/query-entities storage :binding-list-item {}))})]\n    (assoc graph :args (derive-fn-slot-views graph))))","gi":109},{"say":"Synthesizes the per-fn 'arg view' rows the walkers consume: for\n           each fn, its inherited slot surface with bindings overlaid\n           closer-fn-wins, plus the `:source-id` chains that let an edge\n           attribute an inherited slot to the ancestor that declared it.\n           The slot/binding model's read-side counterpart.","defn":"derive-fn-slot-views","ns":"graphden.layout.data","n":2,"file":"src/graphden/layout/data.clj","line":265,"code":"(defn derive-fn-slot-views\n  \"Flatten {fns slots fn-slots bindings list-items} into the row shape\n   layout's helpers walk. Each `(fn, slot)` pair contributes one anchor\n   row; each binding-list-item contributes one item row.\n\n   Anchor row keys: :id :fn-id :slot-id :binding-id :name :type\n                    :required :source-id :value :ref-id\n   Item row keys add: :item-id :prev-arg-id :next-arg-id\n\n   `:source-id` on an anchor row points at the same slot's anchor one\n   parent hop up the chain (nil for the slot's defining fn), so the\n   pipeline's source-chain walks model inheritance the same way the\n   legacy primary/inherited arg pair did. `:source-id` on an item row\n   points at the binding's anchor — items never inherit beyond their\n   own binding.\n\n   Top-level assembler: builds the indexes once, then delegates per-fn\n   anchor construction to `anchor-rows-for-fn` and per-binding item\n   construction to `item-rows-for-binding`.\"\n  [{:keys [fns slots fn-slots bindings list-items]}]\n  (let [fn-by-id (into {} (map (juxt :id identity)) fns)\n        slot-by-id (into {} (map (juxt :id identity)) slots)\n        ;; Single pass over fn-slots populates both indexes via\n        ;; transients — the previous code walked the vector twice\n        ;; (group-by + into-map).\n        [own-fn-slots slot-owner-by-id]\n        (let [own (volatile! (transient {}))\n              owners (volatile! (transient {}))]\n          (run! (fn [fs]\n                  (let [fid (:fn-id fs)\n                        sid (:slot-id fs)]\n                    (vswap! own (fn [m]\n                                  (assoc! m fid\n                                          (conj (or (get m fid) []) fs))))\n                    (vswap! owners assoc! sid fid)))\n                fn-slots)\n          [(persistent! @own) (persistent! @owners)])\n        binding-by (into {} (map (juxt (juxt :fn-id :slot-id) identity)) bindings)\n        items-by-binding (->> list-items\n                              (sort-by :position)\n                              (reduce (fn [acc i]\n                                        (update acc (:binding-id i) (fnil conj []) i))\n                                      {}))\n        binding-extra-by-fn (substitution-context-bindings-by-fn\n                              fn-by-id slot-owner-by-id bindings)\n        anchor-ctx {:fn-by-id fn-by-id :slot-by-id slot-by-id\n                    :binding-by binding-by :items-by-binding items-by-binding}\n        anchor-rows (vec (mapcat #(anchor-rows-for-fn (:id %) anchor-ctx\n                                                      own-fn-slots binding-extra-by-fn)\n                                 fns))\n        item-rows (vec (mapcat #(item-rows-for-binding % items-by-binding)\n                               bindings))]\n    (into anchor-rows item-rows)))","gi":110},{"say":"Stage 2's orchestrator — dispatches the cycle-guarded `process-*`\n           walkers over the expansion spec, then pipes the accumulated state\n           through the post-processing transforms (optional/HOF badges,\n           captured-edge migration, overlay dedup, strip facts). Produces\n           the node/edge element lists the client draws verbatim.","defn":"build-graph-elements","ns":"graphden.layout.graph","n":3,"file":"src/graphden/layout/graph.clj","line":803,"code":"(defn build-graph-elements\n  \"Build graph elements (nodes, edges) from selected function.\n   Returns {:nodes [...] :edges [...]}\"\n  [root-fn-id expansions lookups]\n  (let [{:keys [fn-map arg-map args-by-fn fn-slots-by-fn]} lookups\n        ;; Mutable state collected during traversal lives in ONE atom keyed\n        ;; by purpose. Helpers receive `state` via lexical closure and use\n        ;; `(swap! state update :nodes conj …)` / `(:nodes @state)` to read.\n        ;;\n        ;; Keys:\n        ;;   :nodes / :edges                  — accumulated cytoscape elements\n        ;;   :added-node-ids                  — set of emitted node-ids (dedup)\n        ;;   :processed-arg-targets           — arg-target keys already wired\n        ;;   :processed-fn-nodes              — fn-process keys already done\n        ;;                                       (cycle guard for shared-fn graphs)\n        ;;   :in-progress-expansions          — expansion keys currently active\n        ;;                                       (cycle guard for self-referential refs)\n        ;;   :optional-unsets-by-node         — node-id → [arg-name …] for the\n        ;;                                       compact `+default, +else` badge\n        ;;   :hof-captured-by-node            — node-id → [arg-name …] for the\n        ;;                                       λname HOF capture badge\n        ;;   :captured-edge-migrations        — caller arg-id → inside consumer\n        ;;                                       node-id, post-process rewrite of\n        ;;                                       cross-HOF edges\n        state (atom {:nodes []\n                     :edges []\n                     :added-node-ids #{}\n                     :processed-arg-targets #{}\n                     :processed-fn-nodes #{}\n                     :in-progress-expansions #{}\n                     :optional-unsets-by-node {}\n                     :hof-captured-by-node {}\n                     :captured-edge-migrations {}})\n\n        inverse-source-map (bh/build-inverse-source-map arg-map)\n        parent-bound-terminals (bh/make-parent-bound-terminals lookups)]\n\n    ;; Track bindings for EACH expanded function\n    ;; Key: expanded-fn-id, Value: {:refs #{ref-ids}, :values #{arg-ids}}\n    ;; When processing refs from ancestors of an expanded fn, skip bindings that\n    ;; were already shown at the expanded fn itself\n    (let [expansion-bindings (atom {})\n          ;; The four `process-*` walkers (process-fn / process-expanded-fn /\n          ;; process-expanded-fn-impl / process-any-fn) live as top-level\n          ;; defns above this fn. All four take `ctx` as first arg and\n          ;; recurse through each other.\n          ctx {:state state\n               :lookups lookups\n               :fn-map fn-map\n               :arg-map arg-map\n               :args-by-fn args-by-fn\n               :fn-slots-by-fn fn-slots-by-fn\n               :inverse-source-map inverse-source-map\n               :parent-bound-terminals parent-bound-terminals\n               :expansion-bindings expansion-bindings\n               :expansions expansions}]\n\n      ;; Start processing from root - no expansion-root initially, not HOF.\n      (process-any-fn ctx root-fn-id nil nil true nil nil nil #{} false)\n\n      ;; Type-row roots (refinement / list / union / variant) have no\n      ;; slots and no parents, so the standard pipeline produces only\n      ;; an empty card. Surface their referenced types as synthetic\n      ;; outgoing edges so the user sees the type's composition in\n      ;; the canvas instead of buried inside a chip's title.\n      (bh/emit-type-row-internals! state lookups root-fn-id (str \"fn-\" root-fn-id)))\n\n    ;; Post-process: annotate optional/HOF metadata, migrate captured\n    ;; HOF edges to their inside-consumer source, dedup duplicate\n    ;; value-overlays. Each transform is a top-level defn — see the\n    ;; section header above for the role split.\n    (let [final-nodes (annotate-optionals (:nodes @state) state)\n          final-edges (migrate-captured-edges\n                        (:edges @state)\n                        (:captured-edge-migrations @state))]\n      (dedup-overlays final-nodes final-edges (:arg-map lookups)))))","gi":111},{"say":"Stages 3+ — grid placement: roots at column zero, dependents\n           right of their sources, rows packed to avoid overlap, plus the\n           validation summary. Pixel geometry stays client-side (measured\n           reflow off the real DOM); the server owns the grid topology.","defn":"compute-layout-matrix","ns":"graphden.layout.core","n":4,"file":"src/graphden/layout/core.clj","line":254,"code":"(defn compute-layout-matrix\n  \"Compute grid-based layout from elements (for testing).\n   Input: {:elements {:nodes [...], :edges [...]}}\n   Output: {:grid-pos {node-id {:row r :col c}}, :validation {...}}\"\n  [{:keys [elements]}]\n  (let [nodes (mapv (fn [n] {:data n}) (or (:nodes elements) []))\n        edges (mapv (fn [e] {:data e}) (or (:edges elements) []))]\n    (if (empty? nodes)\n      {:grid-pos {}\n       :validation {:valid true :issues []}}\n      (let [graph-info (build-graph-info nodes edges)\n            root (find-root-node nodes edges)]\n        (if-not root\n          {:grid-pos {}\n           :validation {:valid false\n                        :issues [{:type \"no_root\" :message \"No root node found\"}]}}\n          (let [matrix (layout-graph (get-in root [:data :id]) graph-info)\n                validation (validate-layout matrix)]\n            {:grid-pos (:positions matrix)\n             :validation validation}))))))","gi":112},{"say":"The editor-facing tail: attach server-computed FACTS to each\n           fn-node — the inherited return-type alias, the rule-owning\n           base-fn (`registry/rule-owner-of`), and the transitive\n           branch-local seed (`branch-local/branch-local-seed`). These\n           replaced three hand-written client mirrors of the same walks;\n           the client renders facts, it doesn't re-derive them.","defn":"annotate","ns":"graphden.layout.strip-facts","n":5,"file":"src/graphden/layout/strip_facts.clj","line":60,"code":"(defn annotate\n  \"Attach strip facts to every fn-node's `:data` in a built\n   `{:nodes :edges}` element map. `graph` is the layout entity\n   snapshot (`:fns` et al). Non-fn nodes and unknown ids pass\n   through untouched.\"\n  [elements graph]\n  (let [fns-by-id (into {} (map (juxt :id identity)) (:fns graph))]\n    (update elements :nodes\n            (fn [nodes]\n              (mapv (fn [n]\n                      (let [fn-id (some-> (get-in n [:data :originalFnId])\n                                          parse-uuid)\n                            row (get fns-by-id fn-id)]\n                        (if-not row\n                          n\n                          (let [owner (registry/rule-owner-of (:name row))\n                                alias (inherited-return-type-alias fns-by-id fn-id)\n                                seed (branch-local/branch-local-seed fns-by-id fn-id)]\n                            (cond-> n\n                              alias (assoc-in [:data :returnTypeAlias] alias)\n                              owner (assoc-in [:data :ruleOwner] owner)\n                              seed (assoc-in [:data :branchLocal]\n                                             {:own (= (:id seed) fn-id)\n                                              :seed (:name seed)}))))))\n                    nodes)))))","gi":113,"see":[{"gi":37,"label":"effective-branch-local?"}]}]},{"id":":services","title":"Services & the fleet","status":"toured","summary":"Desired-state service registry, the reconciler/supervisor, and the\n             dynamic multi-executor fleet controller.","paths":["src/graphden/services/","src/graphden/fleet/"],"after":[":executor"],"steps":[{"say":"Start with what a service ROW is: this registers the `:service`\n           entity plus the `:restart-policy` / `:cardinality` enums. A service is\n           a desired-state `keep this fn-id running` declaration — not versioned,\n           no args table — the thing everything downstream reconciles toward.","defn":"extend-builder","ns":"graphden.schema.services.schema","n":1,"file":"src/graphden/schema/services/schema.clj","line":247,"code":"(defn extend-builder\n  \"Extend a schema builder with the :service entity + the\n   :restart-policy / :cardinality enums. Chain after\n   `versioned.schema/extend-builder` (refs `:fn` which the graph schema\n   registers; non-versioned so the versioned-storage decorator passes\n   writes straight through to the base storage, same as\n   `:fn-execution`).\"\n  [builder]\n  (-> builder\n      (ds/add-enum :restart-policy\n                   restart-policy-enum-uuid\n                   (restart-policy-enum-values))\n\n      (ds/add-enum :cardinality\n                   cardinality-enum-uuid\n                   (cardinality-enum-values))\n\n      (ds/add-entity :service service-entity-uuid\n                     {:fn-id {:uuid service-fn-id-field-uuid\n                              :type :ref\n                              :ref-entity :fn}\n                      :enabled? {:uuid service-enabled-field-uuid\n                                 :type :bool}\n                      :restart-policy {:uuid service-restart-policy-field-uuid\n                                       :type :enum\n                                       :enum-name :restart-policy}\n                      :cardinality {:uuid service-cardinality-field-uuid\n                                    :type :enum\n                                    :enum-name :cardinality\n                                    :nullable? true}\n                      :pool-size {:uuid service-pool-size-field-uuid\n                                  :type :int\n                                  :nullable? true}\n                      :branch-id {:uuid service-branch-id-field-uuid\n                                  :type :ref\n                                  :ref-entity :branch\n                                  :nullable? true}\n                      ;; Tenant owner; NULL ≡ platform. Stamped by the tenant\n                      ;; service-create endpoint (task #6), NOT OrgScopedStorage\n                      ;; — `:service` is tenant-forbidden (Option B, see the\n                      ;; field-uuid comment above).\n                      :org-id {:uuid service-org-id-field-uuid\n                               :type :text\n                               :nullable? true}})))","gi":114},{"say":"Resolves a row's cardinality into an advisory-lock slot count:\n           `:per-pod` → no lock, `:singleton` → 1, `:pool` → N. You need this\n           singleton-vs-per-pod-vs-pool model before the reconciler's lock gating\n           makes sense.","defn":"effective-pool-size","ns":"graphden.schema.services.schema","n":2,"file":"src/graphden/schema/services/schema.clj","line":153,"code":"(defn effective-pool-size\n  \"How many pods may run this service at once — the advisory-lock SLOT\n   count. `:per-pod` → nil (unbounded, no lock). `:singleton` → 1.\n   `:pool` → its `:pool-size`, degrading a nil / non-positive size to 1\n   (safe: behaves as a singleton rather than fanning out). This is the\n   ONE place that resolves the cardinality → slot count, so the reconciler\n   never re-derives it.\"\n  [svc]\n  (case (service-cardinality svc)\n    :per-pod nil\n    :singleton 1\n    :pool (let [n (:pool-size svc)]\n            (if (and (integer? n) (pos? n)) n 1))\n    ;; unknown cardinality — treat conservatively as a singleton\n    1))","gi":115},{"say":"The pure policy core: given the enabled DB rows (desired) and the\n           in-process `running` set (actual), return `{:to-start :to-stop}`. It\n           isolates the reconcile DECISION from side effects — the cleanest first\n           look at the loop.","defn":"diff-desired","ns":"graphden.services.reconciler","n":3,"file":"src/graphden/services/reconciler.clj","line":75,"code":"(defn diff-desired\n  \"Pure: return `{:to-start [service-id …] :to-stop [service-id …]}`\n   given the set of enabled service IDs (from DB) and the set of\n   currently-running service IDs (from the in-process atom).\n\n   `to-start` = enabled ∖ running (rows that exist + enabled but\n   we haven't started yet).\n   `to-stop` = running ∖ enabled (rows we're running that have been\n   disabled, deleted, or never existed). Disabled rows are stopped\n   alongside deletions — uniform shutdown path.\"\n  [enabled-ids running-ids]\n  (let [enabled-set (set enabled-ids)\n        running-set (set running-ids)]\n    {:to-start (vec (clojure.set/difference enabled-set running-set))\n     :to-stop  (vec (clojure.set/difference running-set enabled-set))}))","gi":116},{"say":"One reconcile pass: read enabled rows, apply `diff-desired`, detect\n           config drift, and race advisory-lock slots. This is BOTH the\n           edge-triggered handler (fired by `:service` CRUD / NOTIFY) and the\n           level-triggered periodic tick — the placeholder it recomputes each\n           pass is exactly what heals a crashed lock-owner on the next tick.","defn":"reconcile-once!","ns":"graphden.services.reconciler","n":4,"file":"src/graphden/services/reconciler.clj","line":393,"code":"(defn reconcile-once!\n  \"One pass: read enabled `:service` rows, compute diff vs\n   `running-atom`'s contents, start missing + stop removed. Mutates\n   `running-atom` in place.\n\n   A lock-gated service's start is gated on `pg_try_advisory_lock`\n   on the pod's dedicated lock connection (via `:service-locks-holder`\n   on ctx): a `:singleton` races for slot 0, a `:pool` races for the\n   first free of its N slots. When every slot is held by siblings we\n   record a `::not-our-lock` placeholder. That placeholder is TRANSIENT\n   — the top of each pass drops it, so the service is re-attempted every\n   reconcile; a sibling whose owner crashed (auto-releasing the slot,\n   with no NOTIFY) re-acquires it on the next periodic tick. A `:per-pod`\n   service skips the lock and always starts here.\n\n   Before the diff, `pg-lock/ensure-live!` heals a dropped lock\n   connection. A drop released every advisory lock the pod held, so a\n   reconnect triggers `reassert-lock-ownership!` — each `:singleton`\n   we were running re-takes its lock, and any a sibling stole during the\n   outage stops locally. Without this a `:per-pod`-vs-`:singleton` pair\n   could double-run one service until a `:service` edit happened by.\n\n   `start-opts` (optional) is passed straight to `start-service!`,\n   e.g. `{:max-retries 0 :backoff-ms 0}` keeps tests responsive when\n   they intentionally cause start failures.\n\n   Per-branch services: each row carries `:branch-id`. The service\n   is started against THAT branch's ExecutionContext (looked up via\n   `branch-router/ctx-for`), so the same fn-id can run with branch-\n   specific bindings (dev port, prod port). Nil `:branch-id` falls\n   back to the reconciler's base ctx — matches pre-Phase-2 rows.\n\n   Returns `{:started [service-id …] :stopped [service-id …]\n              :not-our-lock [service-id …]}` for logging / tests.\"\n  ([ctx running-atom]\n   (reconcile-once! ctx running-atom {}))\n  ([ctx running-atom start-opts]\n   (locking reconcile-monitor\n     ;; First, heal the lock connection if it dropped. A dead connection\n     ;; released every advisory lock this pod held, so on reconnect we must\n     ;; re-assert ownership BEFORE t

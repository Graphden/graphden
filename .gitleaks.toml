# gitleaks configuration for graphden.
#
# `[extend] useDefault` keeps every rule from gitleaks' built-in config; the
# rules below are the ones we learned we needed.

[extend]
useDefault = true

# A real AUTH_TOKEN for the dev instance was committed as the `||` fallback of
# an env lookup in five browser tests, and shipped in git history. The built-in
# rules don't fire on it: the value is a short opaque word with no vendor
# prefix, no entropy signature, no `key =` shape.
#
# The convention is that the fallback is a documented placeholder (see
# `tools/browser-test/edit-test-helpers.js`, which uses `test123`). Anything
# else in that position is a real credential until proven otherwise.
[[rules]]
id = "graphden-env-token-literal-fallback"
description = "Literal fallback for a credential env var — use the documented placeholder, not a live token"
regex = '''\b(?:process\.env\.)?(?:AUTH_TOKEN|API_KEY|API_TOKEN|ACCESS_TOKEN|SECRET_KEY|VAULT_TOKEN)\b\s*\|\|\s*['"][^'"\n]{4,}['"]'''
tags = ["graphden", "credential", "fallback"]

  [rules.allowlist]
  description = "Documented placeholders that are not credentials."
  regexTarget = "match"
  regexes = [
    '''\|\|\s*['"](?:test123|changeme|placeholder|dummy|example|localhost)['"]''',
  ]


# ---------------------------------------------------------------------------
# History allowlist.
#
# The working tree is clean; these are commits that already shipped. gitleaks
# in CI scans HISTORY (the `bb gitleaks` task scans the working tree with
# --no-git), which is why they were invisible locally until the workflow was
# revived on develop.
# ---------------------------------------------------------------------------
[allowlist]
description = "Findings in already-shipped commits, each triaged below."
commits = [
  # 2026-06-20 — the dev-instance AUTH_TOKEN as a literal `||` fallback in five
  # browser tests (the very leak the rule above was written for; the tree was
  # cleaned then, the history kept it). The credential was ROTATED on
  # 2026-07-20 and verified dead (old token → 401, new token → 200), so what
  # history holds is a revoked 8-char string for a demo instance. History is
  # NOT rewritten: 1747 commits of SHAs are referenced from docs and ADRs, and
  # rewriting them to bury a dead credential trades real traceability for
  # cosmetics. If a LIVE credential ever lands, rotate first — then decide.
  "9a36f0fe1cd10cd36d4dd5d7614c847668c7f4e0",
  # 2026-04-07 — `generic-api-key` firing on a fn ROUTE UUID
  # (21164217-585a-4335-8ade-da58f255c6ce) in two throwaway probe scripts.
  # A graph entity id, not a credential.
  "ec38978b6d50f64fcc99385a479ce4dbd3ed8c51",
]

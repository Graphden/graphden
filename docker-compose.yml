# Every externally-visible name here is parameterised by GD_INSTANCE so the
# same file can raise SEVERAL independent stacks on one host: the canonical
# `graphden` one (the demo on :9002) and one per agent worktree (`bb wt up`).
#
# With no GD_* set, every default below reproduces the historical single-stack
# layout exactly — the main checkout notices nothing.
#
# GD_IMAGE is the one that matters most: without an explicit `image:` the tag
# compose builds is derived from the DIRECTORY name, so `bb rebuild` in a
# worktree produced `<worktree>-executor:latest` while the e2e stack booted the
# hardcoded `graphden-executor:latest` — the suite silently tested somebody
# else's binary. Naming the tag here makes the built artefact explicit.
services:
  # PostgreSQL database
  # Uses plain PostgreSQL with recursive CTE for graph resolution
  postgres:
    image: postgres:16-alpine
    container_name: ${GD_INSTANCE:-graphden}-postgres
    # Survive host/daemon restarts — the executor (unless-stopped) crash-
    # loops on `UnknownHostException: postgres` if this stays down.
    restart: unless-stopped
    environment:
      POSTGRES_DB: graphden
      POSTGRES_USER: graphden
      POSTGRES_PASSWORD: graphden
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${GD_PORT_PG:-5435}:5432"  # Exposed for the postgres MCP server / host-side dev tooling
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphden -d graphden"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # "User-side" Postgres — simulates a tenant DB the graphden user
  # owns. Their fn-graph reaches it through :sql-exec / :sql-query
  # with credentials pulled from openbao, NOT from any env they read
  # directly. Lives on a SEPARATE container so the tutorial graph
  # can't accidentally touch graphden's own schema.
  user-postgres:
    image: postgres:16-alpine
    container_name: ${GD_INSTANCE:-graphden}-user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: userapp
      POSTGRES_PASSWORD: userpass
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    ports:
      - "${GD_PORT_USERPG:-5436}:5432"  # Exposed for host-side inspection (psql -h localhost -p 5436 -U userapp userdb)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userapp -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # OpenBao (OSS fork of HashiCorp Vault, Linux Foundation) in dev
  # mode — in-memory KV v2 store, single root token, restarts to a
  # blank slate. Used as the user-facing secrets API: their fn-graph
  # calls :vault-get on a path; graphden's :vault/client integrant
  # key holds the (infra-only) root token. No user-visible :env reads.
  openbao:
    image: quay.io/openbao/openbao:latest
    container_name: ${GD_INSTANCE:-graphden}-openbao
    # Comes back after a host restart so the executor can reconnect. NOTE:
    # dev-mode is in-memory, so it returns BLANK — secrets need a re-seed
    # (the one-shot `openbao-seed` only runs on `docker compose up`).
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    ports:
      - "${GD_PORT_BAO:-8200}:8200"
    healthcheck:
      # /v1/sys/health returns 200 only when unsealed AND initialised.
      # Dev mode satisfies both immediately on listener bind.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot seeder for the tutorial secrets. Idempotent — Vault KV
  # v2 writes overwrite, so re-running `docker compose up` is safe.
  # Pinning to a known curl image (curlimages/curl) keeps this off
  # the openbao image's surface area.
  openbao-seed:
    image: curlimages/curl:8.11.1
    container_name: ${GD_INSTANCE:-graphden}-openbao-seed
    depends_on:
      openbao:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        AUTH='X-Vault-Token: root'
        CT='Content-Type: application/json'
        BASE='http://openbao:8200/v1/secret/data'
        put () {
          path="$$1"; value="$$2"
          curl -fsS -X POST -H "$$AUTH" -H "$$CT" \
               -d "{\"data\": {\"value\": \"$$value\"}}" \
               "$$BASE/$$path" > /dev/null
          echo "seeded secret/$$path"
        }
        put user-db/url      "jdbc:postgresql://user-postgres:5432/userdb"
        put user-db/user     "userapp"
        put user-db/password "userpass"
        put api/token        "fake-token-abc123"
        put history-port     "8081"

  executor:
    build: .
    image: ${GD_IMAGE:-graphden-executor:latest}
    container_name: ${GD_INSTANCE:-graphden}-executor
    depends_on:
      postgres:
        condition: service_healthy
      user-postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      openbao-seed:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      STORAGE_TYPE: postgres
      JDBC_URL: jdbc:postgresql://postgres:5432/graphden
      DB_USERNAME: graphden
      DB_PASSWORD: graphden
      DB_POOL_SIZE: 10
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      # Opt-in seed of demo branches for the versioning UI. Default
      # disabled in real prod (compose unset → empty → init-key
      # short-circuits). Local docker workflow sets this in `.env`
      # so demos appear out of the box.
      GRAPHDEN_DEMO_BRANCHES_ENABLED: ${GRAPHDEN_DEMO_BRANCHES_ENABLED:-}
      # OpenBao credentials — INFRASTRUCTURE-level, the user's
      # fn-graph never reads these. The :vault/client integrant key
      # consumes them once at startup; everything user-facing goes
      # through the :vault-get base-fn.
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: root
      # Opt-in nREPL into the live executor. Unset → `-main` skips
      # the start-server call entirely. Set in `.env` for dev debug.
      GRAPHDEN_NREPL_PORT: ${GRAPHDEN_NREPL_PORT:-}
    ports:
      - "${GD_PORT_HTTP:-9002}:8080"
      - "${GD_PORT_HISTORY:-9081}:8081"  # Tutorial: user-built history endpoint runs here
      - "${GD_PORT_NREPL:-9099}:7888"  # Opt-in nREPL — only listens when GRAPHDEN_NREPL_PORT=7888
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${GD_INSTANCE:-graphden}-postgres-data
  user_postgres_data:
    name: ${GD_INSTANCE:-graphden}-user-postgres-data

<!doctype html>
<html lang="en" data-theme="dark">
<head>

<title>Graphden — developer tour</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--edge:#2a323d;--fg:#e6edf3;--dim:#8b949e;
--accent:#58a6ff;--hi:#213048;--kw:#79c0ff;--str:#a5d6a2;--cmt:#6e7681;--stub:#484f58}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);
font:14px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:10px 18px;border-bottom:1px solid var(--edge);display:flex;
align-items:baseline;gap:16px;flex:0 0 auto}
header h1{font-size:15px;margin:0;font-weight:600}
#crumb{color:var(--dim);font-size:12px}
#crumb b{color:var(--fg);font-weight:600}
#shell{flex:1 1 auto;display:flex;min-height:0}
#map{width:290px;flex:0 0 auto;overflow:auto;border-right:1px solid var(--edge);
padding:12px 8px;background:var(--panel)}
#stage{flex:1 1 auto;overflow:auto;padding:22px 28px;max-width:980px}
footer{flex:0 0 auto;display:flex;gap:10px;align-items:center;
padding:9px 18px;border-top:1px solid var(--edge);background:var(--panel)}
footer button{background:#21262d;color:var(--fg);border:1px solid var(--edge);
border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
footer button:hover:not(:disabled){border-color:var(--accent)}
footer button:disabled{opacity:.4;cursor:default}
#pos{color:var(--dim);font-size:12px;margin:0 6px}
.blk{margin-bottom:6px}
.blk-h{padding:6px 8px;border-radius:6px;cursor:default}
.blk-h .t{font-weight:600}
.blk-h .s{color:var(--dim);font-size:11.5px;display:block;margin-top:2px}
.blk.stub .blk-h{opacity:.62}
.blk.stub .t::after{content:' ⏳';font-size:11px}
.blk .after{color:var(--stub);font-size:10.5px;margin:1px 0 0 8px}
.steps{list-style:none;margin:4px 0 0;padding:0 0 0 8px}
.steps li{padding:3px 8px;border-radius:5px;cursor:pointer;color:var(--dim);
font-size:12.5px;border-left:2px solid transparent}
.steps li:hover{color:var(--fg);background:#1c2330}
.steps li.on{color:var(--fg);background:var(--hi);border-left-color:var(--accent)}
.paths{margin:6px 0 0 8px}
.paths code{color:var(--dim);font-size:11px;display:block}
.say{margin:0 0 16px}
.say p{margin:0 0 10px}
.say code,code.inl{background:#1c2330;border-radius:4px;padding:.5px 5px;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.say a{color:var(--accent)}
.file{color:var(--dim);font-size:12px;margin:0 0 6px;
font-family:ui-monospace,monospace}
.file b{color:var(--fg)}
pre.code{background:var(--panel);border:1px solid var(--edge);border-radius:8px;
padding:12px 0;overflow:auto;margin:0 0 18px;font-size:12.5px;line-height:1.5}
pre.code .ln{display:flex}
pre.code .g{color:var(--cmt);text-align:right;padding:0 14px 0 12px;
user-select:none;min-width:52px;flex:0 0 auto}
pre.code .c{padding-right:16px;white-space:pre;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
pre.code .head .c{background:var(--hi)}
.tok-kw{color:var(--kw)}.tok-str{color:var(--str)}.tok-cmt{color:var(--cmt)}
.see{margin:0 0 18px}
.see .lbl{color:var(--dim);font-size:11.5px;margin-right:6px}
.see a{display:inline-block;background:#1c2330;border:1px solid var(--edge);
border-radius:12px;padding:2px 10px;font-size:12px;color:var(--accent);
cursor:pointer;margin:0 6px 6px 0}
.stub-note{color:var(--dim);border:1px dashed var(--edge);border-radius:8px;
padding:16px;margin-top:12px}
.intro{color:var(--dim);max-width:760px}
kbd{background:#21262d;border:1px solid var(--edge);border-bottom-width:2px;
border-radius:4px;padding:0 5px;font-size:11px}
</style>
</head>

<script id="tour-data" type="application/json">{"title":"Graphden — developer tour","intro":"Welcome. This is a guided read of the graphden codebase for someone who\n  just joined and needs to find their feet in the whole system — not the\n  user tutorial (that lives in `docs/tutorial/` and is about *using* the\n  editor), but the host code that makes it run.\n\n  The system splits into a handful of relatively independent **blocks**\n  (left). Read them roughly top-to-bottom: each block's `after:` line names\n  what it assumes you have already seen. Start with the **Executor** — it is\n  the spine everything else hangs off — then follow the dependency order:\n  Storage, then Branches, Types, CRUD, Packages, Boot, Web, Layout, the\n  Editor frontend, Services, Platform seams, Accounts. (The Platform block\n  tours the in-repo seams and hardening; the multi-tenant / cloud POLICY\n  layer itself is in the private graphden-tenancy repo — the open-core\n  split — plugging into the `graphden.tenancy.context` seam kept here.)\n\n  Two blocks are worth knowing about before you need them. **Boot** answers\n  'what actually happens when the process starts', which is the fastest way\n  to see how the other blocks are wired together — read it early if you are\n  more comfortable starting from a running system than from a hot path. The\n  **Editor frontend** block tours JavaScript rather than Clojure; it is baked\n  and drift-checked exactly like the rest.\n\n  Every step shows you the **actual source** of one function, pulled straight\n  from the file it lives in. When a step points you at code in another block,\n  use the *see also* chips — **Back** always returns you along the path you\n  actually walked.\n\n  This tour is about the code, not the workflow. For how to BUILD and test it\n  — `bb ci`, the linters, the isolated worktrees and the serialized merge\n  queue — read [CLAUDE.md](../../CLAUDE.md) and\n  [dev/wtq/AGENT.md](../../dev/wtq/AGENT.md).","blocks":[{"id":":executor","title":"Executor — how a fn runs","status":"toured","summary":"The spine: turn a graph 'description of a computation' into a value.","paths":["src/graphden/executor/"],"after":[],"steps":[{"say":"**Start here.** `execute` is the public front door of the whole\n           system. A caller hands it an execution *context*, a `fn-id` — the id\n           of a row in the graph that *describes* a computation — and a map of\n           free args. This ns is a thin, validating façade: it checks the args\n           shape and delegates to the real machinery in `compile-runtime`.\n           Everything below is how that graph *description* becomes a value.","defn":"execute","ns":"graphden.executor.interface","n":1,"file":"src/graphden/executor/interface.clj","lang":"clj","line":85,"code":"(defn execute\n  \"Executes a function by id using the compiled registry.\n\n   Arguments:\n   - context: Execution context (created with create-context)\n   - fn-id: UUID of the function to execute\n   - args: Free args map, keyed by external arg name, or nil/{}.\n\n   Throws:\n   - :execution-error/fn-not-found if `fn-id` has no compiled closure\n   - :execution-error/invalid-args if `args` is non-nil and not a map\"\n  [context fn-id args]\n  (when (and (some? args) (not (map? args)))\n    (throw (ex-info \"args must be nil or a map\"\n                    {:type :execution-error/invalid-args\n                     :args args\n                     :args-type (type args)})))\n  (cr/execute context fn-id (or args {})))","gi":0,"see":[{"gi":2,"label":"create-context"}]},{"say":"The dispatch heart of the hot path. It checks the cancellation /\n           effect / execute-guard gates, pulls the **compiled registry** out of\n           the context, looks up the closure for this `fn-id` (or throws\n           fn-not-found), translates the caller's name-keyed args into the dual\n           slot-id+name shape the compiled code expects, and finally calls\n           `(closure translated ctx)`. This is the moment *execute a fn* becomes\n           *call a precompiled closure*.","defn":"execute","ns":"graphden.executor.compile-runtime","n":2,"file":"src/graphden/executor/compile_runtime.clj","lang":"clj","line":1333,"code":"(defn execute\n  \"Invoke `fn-id` via the compiled registry. `named-args` is a `{arg-name\n   value}` map using the outermost external arg names (rename-aware).\n\n   HOF impls that deref a `:fn`-type arg end up with a callable (from\n   `rt/hof-callable`) rather than a UUID and hand it back in through\n   this same entry point. For single-entry args the value is unwrapped\n   from the map; for empty or multi-entry args the whole map is passed\n   through.\n\n   Cancellation: when `*cancel-check*` is bound (by the fn-execution\n   harness), it's called at the top of each invocation — if the\n   per-execution flag flipped, an `InterruptedException` propagates\n   up through the call stack and is caught by the fn-execution\n   reaper which writes `:status :cancelled`.\"\n  [ctx fn-id named-args]\n  (check-cancel!)\n  ;; Per-namespace execute gate (docs/TENANCY_SEAM.md § Execute guard):\n  ;; consult the ctx's `:execute-guard`\n  ;; ONCE per top-level execute (the recursion flag keeps it off the hot\n  ;; sub-fn path), then re-enter. The guard throws `:authz/forbidden` on a\n  ;; denied tenant execute; absent (core / system / admin) → no-op.\n  (if (and (not *execute-authorized*) (:execute-guard ctx))\n    (binding [*execute-authorized* true]\n      ((:execute-guard ctx) ctx fn-id)\n      (execute ctx fn-id named-args))\n    ;; Effect sandbox: when the ctx restricts effects, bind\n    ;; `*allowed-effects*` so `record-effect!` can gate. `identical?`\n    ;; skips re-binding on recursive `execute` calls within the same ctx;\n    ;; an unrestricted ctx (the common case) pays zero binding overhead.\n    (let [allowed (:allowed-effects ctx)]\n      (if (and allowed (not (identical? allowed *allowed-effects*)))\n        (binding [*allowed-effects* allowed]\n          (execute ctx fn-id named-args))\n        (if (fn? fn-id)\n          (let [args (or named-args {})]\n            (if (= 1 (count args))\n              (fn-id (first (vals args)))\n              (fn-id args)))\n          (let [reg (registry ctx)\n                closure (or (get reg fn-id) (throw-fn-not-found! fn-id))\n                ;; Translate caller's name-keyed args into the dual-key\n                ;; shape (slot-id + name). Phase 4 readers prefer slot-id;\n                ;; the name half covers env-binding / lambda-arg / rename-\n                ;; alias paths that still flow under name keys today.\n                translated (translate-named-args fn-id (or named-args {})\n                                                 (lookups-for-ctx ctx))]\n            ;; compile-eager closure signature: `(fn [free-args ctx])`.\n            ;; Child callables are captured at compile time — `reg`\n            ;; is no longer needed by the runtime.\n            (closure translated ctx)))))))","gi":1,"see":[{"gi":3,"label":"registry"}]},{"say":"Builds the `ExecutionContext` the previous step reads from. It\n           carries the storage handle, the `:base-fns` impl registry\n           (snapshotted from the global default), a lazily-filled\n           `:compiled-registry` holder, the graph/deps caches, and the\n           authz/effect seams. Because scoping (e.g. which branch) lives here,\n           the *same* `fn-id` run in two contexts can resolve to different\n           code — this is where that happens.","defn":"create-context","ns":"graphden.executor.context","n":3,"file":"src/graphden/executor/context.clj","lang":"clj","line":328,"code":"(defn create-context\n  \"Creates an execution context.\n\n   Options:\n   - :storage   Storage instance (required).\n   - :base-fns  Map of fn-name → impl-fn (optional; defaults to the\n                global registry snapshot).\n   - :clock     Zero-arg fn returning current time in ms (default\n                `System/currentTimeMillis`). Inject in tests for\n                deterministic time.\n   - :allowed-effects  Optional set of effect categories this context\n                permits (e.g. `#{:db :time}`). When set, `record-effect!`\n                throws `:execution/forbidden-effect` for any effect\n                outside it — the cloud sandbox boundary\n                (docs/TENANCY_SEAM.md § Effect gate). `nil`/absent (the\n                default) = unrestricted (self-hosted / mixed).\n   - :auth-provider  Optional `graphden.auth.provider/AuthProvider` — the\n                authentication seam (docs/TENANCY_SEAM.md § Auth seam).\n                Read by the\n                `:authenticate-request` base-fn. Absent → that base-fn\n                fails closed (`{:authenticated? false}`).\n   - :request-scope  Optional request-scope seam (docs/TENANCY_SEAM.md\n                § Context) — a fn\n                `(fn [ctx request thunk] …)` the branch-router's `dispatch`\n                wraps each handler call with. The tenancy addon uses it to\n                authenticate + bind `*current-org*`. Absent → `dispatch`\n                calls the handler directly (single-tenant).\n   - :execute-guard  Optional per-namespace execute guard (§4.2) — a fn\n                `(fn [ctx fn-id] …)` `compile-runtime/execute` consults once\n                per top-level execute; throws `:authz/forbidden` on a denied\n                tenant execute. Absent → no execute authorization.\n   - :executor-orgs  Optional membership predicate over org-ids — usually a\n                set, or a fn for a hash-sharded fleet that doesn't enumerate\n                its tenants. The compiled registry then holds only those\n                orgs' fns plus the un-owned platform rows, instead of every\n                tenant's. nil (the default, and the only value single-tenant\n                ever uses) compiles the whole graph. Admit the public org\n                explicitly — core doesn't know its name.\n   - :byo-executor?  When true, this pod is a customer's OWN executor — it may\n                serve the `:byo` orgs in its shard. A HOSTED pod (default,\n                false) refuses any `:byo` org with a 421. See\n                `tenancy.context/byo-org?`.\"\n  [{:keys [storage base-fns clock allowed-effects auth-provider request-scope\n           execute-guard app-router verify-domain user-ops\n           my-tokens executor-orgs byo-executor? fleet-forward fleet-command]}]\n  (validate-context-options! storage)\n  (-> (->ExecutionContext storage\n                          (or base-fns (registry/get-default-registry))\n                          (or clock #(System/currentTimeMillis))\n                          (atom nil)\n                          (atom nil)\n                          (atom nil))\n      ;; Per-context lock for serializing the read-graph → compute →\n      ;; prime-multi-atom sequence in `invalidate-graph-cache!` /\n      ;; `compile-runtime/rebuild!`. Without it, concurrent CRUD\n      ;; requests can prime `:graph-cache` / `:compile-deps` from\n      ;; out-of-order storage snapshots and leave the caches\n      ;; reflecting an older view than what storage already holds.\n      ;; A ReentrantLock (not `locking`/`synchronized`): the body under\n      ;; it recompiles for seconds, and a virtual thread blocked on a\n      ;; monitor pins its carrier (JDK 21) — see\n      ;; `compile-runtime/call-with-invalidation-lock`.\n      (assoc :invalidation-lock (java.util.concurrent.locks.ReentrantLock.))\n      ;; Fleet placement bookkeeping (docs/FLEET_RFC.md §6.2): the set of cell\n      ;; ROOTS this executor has loaded via `compile-runtime/load-cell!`. Lets\n      ;; `evict-cell!` reference-count shared fns. Empty + unused on a\n      ;; non-fleet ctx (which loads its whole shard via `rebuild!`).\n      (assoc :loaded-roots (atom #{}))\n      ;; Availability: stale-while-revalidate for the request-path full clear.\n      ;; A full clear (nil-seed write, migration) used to nil `:compiled-registry`,\n      ;; so the next request ran the ~50s cold `rebuild!` UNDER the invalidation\n      ;; lock and every concurrent request on this ctx blocked behind it (the\n      ;; pod-wide hang). Instead we KEEP the (now stale) registry, flip\n      ;; `:registry-stale?`, and let the gate serve stale while a background\n      ;; `rebuild-optimistic!` revalidates — the same pattern the epoch heal uses.\n      ;;   `:invalidation-count` — monotonic, bumped on EVERY invalidation\n      ;;     (delta + full). It is the `unchanged?` token: a background full\n      ;;     rebuild swaps only if no newer invalidation landed mid-compile, so\n      ;;     it can't clobber a delta that patched the live registry meanwhile.\n      ;;   `:registry-rebuild-inflight` — CAS guard so one background revalidate\n      ;;     runs per ctx, however many requests observe the stale flag.\n      (assoc :invalidation-count (atom 0)\n             :full-clear-count (atom 0)\n             :registry-stale? (atom false)\n             :registry-rebuild-inflight (atom false))\n      ;; Effect sandbox — nil = unrestricted. Read on the hot path by\n      ;; `compile-runtime/execute`, which binds `*allowed-effects*` for\n      ;; the execution so `record-effect!` can gate.\n      (cond-> allowed-effects (assoc :allowed-effects (set allowed-effects)))\n      ;; Auth seam (§3.0) — read by the `:authenticate-request` base-fn.\n      (cond-> auth-provider (assoc :auth-provider auth-provider))\n      ;; Request-scope seam (§3.0 B4) — wrapped around each handler call by\n      ;; the branch-router's `dispatch`.\n      (cond-> request-scope (assoc :request-scope request-scope))\n      ;; Per-namespace execute guard (§4.2) — consulted by `execute`.\n      (cond-> execute-guard (assoc :execute-guard execute-guard))\n      ;; App-router seam (§3.4 FaaS) — consulted by the branch-router's\n      ;; `dispatch` BEFORE the editor/API flow: a request to a tenant's\n      ;; subdomain is served by that org's handler fn (org-scoped + effect-\n      ;; gated), never the editor.\n      (cond-> app-router (assoc :app-router app-router))\n      ;; Self-serve DNS-verify seam (§3.4 #2) — `(fn [ctx hostname] …)` the\n      ;; `:invoke-verify-domain` base-fn calls so a tenant can prove ownership\n      ;; of its own custom domain (DNS-TXT) and flip it verified. Addon-only.\n      (cond-> verify-domain (assoc :verify-domain verify-domain))\n      ;; User-model seam — `{:create-user … :login …}` the\n      ;; `:invoke-create-user` / `:invoke-login` base-fns call. Login mints a\n      ;; session `:token`; the storage-token-provider resolves it. Addon-only.\n      (cond-> user-ops (assoc :user-ops user-ops))\n      ;; Self-serve API-token seam — `{:mint … :list … :revoke …}` the\n      ;; tenancy-admin `:invoke-{mint,list,revoke}-my-token` base-fns call so\n      ;; a tenant can manage long-lived bearers for its OWN org (MCP / API\n      ;; clients) without the operator. Addon-only.\n      (cond-> my-tokens (assoc :my-tokens my-tokens))\n      ;; Executor shard — which orgs' fns this pod compiles. Read by\n      ;; `compile-runtime/read-graph`. nil ⇒ the whole graph. A collection\n      ;; becomes a set (which is itself the membership predicate); a fn is\n      ;; taken as the predicate directly.\n      (cond-> executor-orgs\n        (assoc :executor-orgs (if (fn? executor-orgs)\n                                executor-orgs\n                                (set executor-orgs))))\n      ;; Pod role — a BYO executor may serve the `:byo` orgs in its shard;\n      ;; a hosted pod (default) 421s them.\n      (cond-> byo-executor? (assoc :byo-executor? true))\n      ;; Fleet forward-hop seam (docs/FLEET_RFC.md §6.1, T2.6): a\n      ;; `(fn [request org entry-fn-id] → response-or-nil)` the app-router\n      ;; consults BEFORE 421'ing — forwards to the executor that holds the cell\n      ;; (per `:placement`). Absent (single-tenant / no fleet identity) → 421 as\n      ;; before.\n      (cond-> fleet-forward (assoc :fleet-forward fleet-forward))\n      ;; Fleet control-plane command seam (docs/FLEET_RFC.md §6.3) — the\n      ;; `branch-router/dispatch` consults it for `POST /internal/fleet/cell/…`.\n      ;; Absent (single-tenant / no fleet identity) → no internal endpoint.\n      (cond-> fleet-command (assoc :fleet-command fleet-command))))","gi":2},{"say":"Returns the `{fn-id -> closure}` map from the context holder. A warm\n           holder is served straight back; if a full clear flagged it stale it\n           is still served immediately while a background `rebuild-optimistic!`\n           refreshes it (stale-while-revalidate — no reader ever blocks behind a\n           ~50s cold compile). Only a genuinely COLD holder (boot, a divergent\n           cold branch) compiles on demand under the invalidation lock, double-\n           checked so concurrent callers coalesce onto one rebuild. This is the\n           lazy **compile-once, reuse-forever** registry the executor runs against.","defn":"registry","ns":"graphden.executor.compile-runtime","n":4,"file":"src/graphden/executor/compile_runtime.clj","lang":"clj","line":831,"code":"(defn registry\n  \"Return the current compiled registry from `ctx`, rebuilding on-demand\n   when missing. Tests that skip the `:exec/compiled-registry` init-key\n   still get a working executor via this fallback — the cost is a single\n   compile pass on first execution.\n\n   Double-checked under the invalidation lock: a full `rebuild!` takes\n   seconds, and without coalescing every concurrent reader that hit an\n   empty holder fired its OWN rebuild (observed: 20+ full recompiles\n   stacked on one editor mutation). Re-checking `@holder` after taking\n   the lock means the first arrival rebuilds and everyone else reuses\n   its result. Reentrant lock, so the inner `rebuild!` re-acquires\n   cheaply.\"\n  [ctx]\n  (when-let [holder (:compiled-registry ctx)]\n    (let [cur @holder]\n      (if (some? cur)\n        (do\n          ;; Serve the current registry immediately. If a full clear flagged\n          ;; it stale, revalidate in the BACKGROUND — a reader never blocks\n          ;; behind the ~50s cold compile. Coalesced (a no-op once one is in\n          ;; flight), so this is cheap on the hot path.\n          (when (some-> (:registry-stale? ctx) deref)\n            (maybe-schedule-revalidate! ctx))\n          cur)\n        ;; Cold: never compiled (boot, or a divergent cold branch's first\n        ;; access) — nothing to serve stale, so compile once under the lock,\n        ;; double-checked so concurrent readers coalesce onto the first\n        ;; arrival's result. This blocks only THIS ctx's readers until its\n        ;; first compile; the pod-wide hang came from full-clearing a WARM\n        ;; ctx to nil, which no longer happens (see `context/invalidate-graph-\n        ;; cache!` stale-while-revalidate).\n        (call-with-invalidation-lock ctx (fn [] (or @holder (rebuild! ctx))))))))","gi":3,"see":[{"gi":4,"label":"rebuild!"}]},{"say":"The compile-at-startup pipeline in one form: `read-graph` from\n           storage, then `build-lookups`, then `compile-all`; finally it primes\n           the graph/deps caches and resets the registry holder. This is the\n           seam where **code = graph in DB** turns into runnable Clojure\n           closures. The next few steps open up each stage it calls.","defn":"rebuild!","ns":"graphden.executor.compile-runtime","n":5,"file":"src/graphden/executor/compile_runtime.clj","lang":"clj","line":529,"code":"(defn rebuild!\n  \"Rebuild the compiled registry in `ctx` from whatever the slot/\n   binding tables currently hold. Also primes `:graph-cache` and\n   `:compile-deps` so read-heavy consumers stay in sync. Call at\n   startup and on full invalidation.\n\n   Runs under the context's `:invalidation-lock` so the\n   read-graph → compute → prime-multi-atom sequence stays atomic\n   relative to concurrent `invalidate-graph-cache!` callers.\"\n  [ctx]\n  (if-let [f (impl :rebuild!)]\n    (f ctx)\n    (do\n      ;; The expensive outcome, counted where it actually happens rather than at\n      ;; the call site — a caller can ask for a delta and still land here (see\n      ;; `delta-recompile!`'s fallback). Measured at 4137 fns: 49.8 s.\n      (counters/count! :registry/rebuild)\n      (call-with-invalidation-lock\n        ctx\n        (fn []\n          ;; Permit INSIDE the ctx lock: safe because permit holders never\n          ;; wait on locks (`call-with-compile-permit`'s contract), so a\n          ;; lock-holding waiter here can't deadlock — and the reentrant\n          ;; `invalidate-graph-cache! → rebuild!` path keeps working.\n          (let [{:keys [graph compiled]}\n                (call-with-compile-permit\n                  (fn []\n                    (let [{:keys [graph lookups]}\n                          (prep-compile-inputs\n                            ctx (read-graph (compile-storage ctx)\n                                            (:executor-orgs ctx)))]\n                      {:graph graph :compiled (ce/compile-all lookups)})))]\n            (reset! (:compiled-registry ctx) compiled)\n            (prime-graph-cache! ctx graph)\n            (prime-compile-deps! ctx graph)\n            compiled))))))","gi":4,"see":[{"gi":6,"label":"build-lookups"},{"gi":9,"label":"compile-all"}]},{"say":"The opposite direction — and the reason there is a graph to read at\n           all. Authored fn-defs (from packages) are reconciled into fn / slot /\n           binding rows in storage here. So the graph that `rebuild!` reads was\n           itself *written* by this composition layer from source fn-defs. Read\n           it to see how declarations become persisted graph entities.","defn":"sync-fns-to-storage!","ns":"graphden.executor.composition.core","n":6,"file":"src/graphden/executor/composition/core.clj","lang":"clj","line":290,"code":"(defn sync-fns-to-storage!\n  \"Top-level sync for a list of fn-defs. See arity-5 for full\n   signature; convenience arities auto-discover `extra-name->id` from\n   the existing `:fn` table.\n\n   `extra-defs-by-name` (5-arity) carries fn-def shapes from a prior\n   sync (base-fns, type-rows declared inline) so the records-parser's\n   slot resolver can find their slots. Without it, a composed fn\n   binding `:m` on a slot owned by a base-fn synced earlier won't\n   resolve.\"\n  ([storage fn-defs]\n   (let [{:keys [name->id defs-by-name]} (discover-existing-state storage)]\n     (sync-fns-to-storage! storage fn-defs {} name->id defs-by-name)))\n  ([storage fn-defs ns-id-map]\n   (let [{:keys [name->id defs-by-name]} (discover-existing-state storage)]\n     (sync-fns-to-storage! storage fn-defs ns-id-map name->id defs-by-name)))\n  ([storage fn-defs ns-id-map extra-name->id]\n   (sync-fns-to-storage! storage fn-defs ns-id-map extra-name->id\n                         (existing-defs-by-name storage)))\n  ([storage fn-defs ns-id-map extra-name->id extra-defs-by-name]\n   (validation/validate-all-defs! fn-defs)\n   (let [sorted (deps/topological-sort fn-defs)\n         records (records/parse-module sorted extra-name->id extra-defs-by-name)]\n     (write-records! storage records ns-id-map))))","gi":5},{"say":"Indexes the raw graph rows — fns, slots, fn-slots, bindings,\n           list-items — into the O(1) maps every compile helper consumes\n           (`:fn-map`, `:slot-map`, `:bindings-by-fn`, the inheritance-chain\n           cache, …). This is the in-memory materialization of the DB graph that\n           the whole compile pass walks over.","defn":"build-lookups","ns":"graphden.executor.compile.lookups","n":7,"file":"src/graphden/executor/compile/lookups.clj","lang":"clj","line":53,"code":"(defn build-lookups\n  \"Index entities for fast lookup during compile. Inputs:\n     fns                 — vector of fn rows\n     slots               — vector of slot rows\n     fn-slots            — vector of fn-slot junction rows\n     bindings            — vector of binding rows\n     list-items          — vector of binding-list-item rows\n\n   Output keys:\n     :fn-map               {fn-id → fn-row}\n     :slot-map             {slot-id → slot-row}\n     :fn-slots-by-fn       {fn-id → [fn-slot-row …]}, ordered by :position\n     :slot-by-fn-name      {[fn-id slot-name-keyword] → slot-row}\n     :slot-by-fn-source-slot\n                            {[fn-id source-slot-id] → slot-row} —\n                            renamed-view lookup. A composed fn that\n                            exposes ancestor slot S under a new name\n                            owns a slot row whose `:source-slot-id`\n                            points back at S; this index lets renamers\n                            be located in O(1) without walking\n                            fn-slots-by-fn.\n     :bindings-by-fn       {fn-id → [binding-row …]}\n     :binding-by-fn-slot   {[fn-id slot-id] → binding-row}\n     :items-by-binding     {binding-id → [item-row …]}, ordered by :position\n     :chain-cache          atom {fn-id → chain-vector} — lazy cache for\n                            `inheritance-chain*`. Multiple compile-time\n                            helpers (`effective-required?`, `effective-binding`,\n                            `fn-typed-slot?`, `list-items-for`,\n                            `closest-binding-for-slot`, `rename-for-slot`)\n                            walk the same chain for the same fn-id many\n                            times during one classification pass; this atom\n                            collapses that to a single BFS per fn-id.\"\n  [{:keys [fns slots fn-slots bindings list-items]}]\n  (let [fn-map (into {} (map (juxt :id identity)) fns)\n        slot-map (into {} (map (juxt :id identity)) slots)\n        fn-slots-by-fn (->> fn-slots\n                            (sort-by (juxt :fn-id :position))\n                            (reduce (fn [acc fs]\n                                      (update acc (:fn-id fs) (fnil conj []) fs))\n                                    {}))\n        slot-by-fn-name (into {}\n                              (mapcat (fn [[fid junctions]]\n                                        (keep (fn [fs]\n                                                (when-let [s (get slot-map (:slot-id fs))]\n                                                  [[fid (keyword (:name s))] s]))\n                                              junctions)))\n                              fn-slots-by-fn)\n        slot-by-fn-source-slot (into {}\n                                     (mapcat (fn [[fid junctions]]\n                                               (keep (fn [fs]\n                                                       (when-let [s (get slot-map (:slot-id fs))]\n                                                         (when-let [src (:source-slot-id s)]\n                                                           [[fid src] s])))\n                                                     junctions)))\n                                     fn-slots-by-fn)\n        bindings-by-fn (reduce (fn [acc b]\n                                 (update acc (:fn-id b) (fnil conj []) b))\n                               {}\n                               bindings)\n        binding-by-fn-slot (into {}\n                                 (map (juxt (juxt :fn-id :slot-id) identity))\n                                 bindings)\n        items-by-binding (->> list-items\n                              (sort-by (juxt :binding-id :position))\n                              (reduce (fn [acc i]\n                                        (update acc (:binding-id i) (fnil conj []) i))\n                                      {}))]\n    {:fn-map             fn-map\n     :slot-map           slot-map\n     :fn-slots-by-fn     fn-slots-by-fn\n     :slot-by-fn-name    slot-by-fn-name\n     :slot-by-fn-source-slot slot-by-fn-source-slot\n     :bindings-by-fn     bindings-by-fn\n     :binding-by-fn-slot binding-by-fn-slot\n     :items-by-binding   items-by-binding\n     :chain-cache        (atom {})\n     ;; Graph-global HOF-marker set — a pure function of `fn-map`, so\n     ;; computed ONCE here instead of rescanned per-fn in\n     ;; `collect-bindings*` / `collect-env-bindings`. The free-arg\n     ;; walkers call `collect-env-bindings` per visited node, which\n     ;; made this an O(n²) hotspot (~190M fn-row visits on the\n     ;; [core web app] graph). `bindings.clj` reads this key with an\n     ;; on-the-fly recompute fallback for hand-built lookups.\n     :fn-typed-fn-ids    (compute-fn-typed-fn-ids {:fn-map fn-map})\n     ;; Hot per-(fn-id) caches used by the compile pipeline. Same\n     ;; lifetime as `:chain-cache` — populated lazily by the\n     ;; compile fns and shared across the compile-all pass so a\n     ;; deep walk runs once per fn-id instead of once per ref-\n     ;; binding pointing at it.\n     :deep-frees-cache   (atom {})\n     :deep-free-ext-entries-cache (atom {})\n     :cache-projection-frees-cache (atom {})\n     :bindings-cache     (atom {})\n     :env-bindings-cache (atom {})}))","gi":6},{"say":"Walks a composed fn's `parent-ids` inheritance chain up to the\n           parentless **root** that owns the slots and carries a registered\n           impl. This is the base-fn resolution step: how an arbitrary composed\n           `fn-id` maps to the primitive whose Clojure impl will actually run.","defn":"root-fn","ns":"graphden.executor.compile.lookups","n":8,"file":"src/graphden/executor/compile/lookups.clj","lang":"clj","line":238,"code":"(defn root-fn\n  \"Walk the inheritance chain of `fn-id` and return the first ancestor\n   with empty `:parent-ids` — the root that owns the slots. In the new\n   model the root is a base-fn (return-type-fn-id set) OR a type-row (record /\n   refinement / list / primitive); both have synthesised impls registered\n   under their fn-name. Two-arity form takes raw `fn-map` (used when\n   the caller has no lookups in hand); three-arity form takes the\n   full lookups map and benefits from chain caching.\"\n  ([fn-id fn-map]\n   (let [chain (inheritance-chain fn-id fn-map)]\n     (some (fn [fid]\n             (let [f (get fn-map fid)]\n               (when (empty? (:parent-ids f))\n                 f)))\n           chain)))\n  ([fn-id fn-map lookups]\n   (let [chain (inheritance-chain* fn-id (assoc lookups :fn-map fn-map))]\n     (some (fn [fid]\n             (let [f (get fn-map fid)]\n               (when (empty? (:parent-ids f))\n                 f)))\n           chain))))","gi":7},{"say":"Classifies each of a fn's root slots (via `classify-slot`) into a\n           `:value` / `:free` / `:ref` / `:seq` / `:secret-value` entry,\n           memoised on the lookups. This classification is the pivot the code\n           generator switches on next — the *shape* of every argument is decided\n           here, once, at compile time rather than per execution.","defn":"collect-bindings","ns":"graphden.executor.compile.bindings","n":9,"file":"src/graphden/executor/compile/bindings.clj","lang":"clj","line":277,"code":"(defn collect-bindings\n  \"For F, classify every root slot. Returns a vector of binding entries\n   in fn-slot position order. Memoised on `lookups`'s\n   `:bindings-cache` — compile-eager + `build-ref-renames` between\n   them hit this once per (fn-id, ref-binding) which can be hundreds\n   of calls on the same fn-id during a single compile-all pass.\"\n  [fn-id {:keys [bindings-cache] :as lookups}]\n  (if-let [cache bindings-cache]\n    (or (get @cache fn-id)\n        (let [r (collect-bindings* fn-id lookups)]\n          (swap! cache assoc fn-id r)\n          r))\n    (collect-bindings* fn-id lookups)))","gi":8,"see":[{"gi":11,"label":"arg-builder"}]},{"say":"Topologically orders every impl-backed fn and compiles each in\n           dependency order into `{fn-id -> (fn [fa ctx])}`, cached process-wide\n           by (graph-shape × base-fn set × ambient rich-types) — the rich-types\n           component is load-bearing: `produces-callable?` HOF-wrap decisions\n           depend on the swept `:return-type` entries, so callers under\n           different types must not share a compile. Dependency order matters:\n           by the time a parent compiles, its children's callables already\n           exist to be wired in.","defn":"compile-all","ns":"graphden.executor.compile-eager","n":10,"file":"src/graphden/executor/compile_eager.clj","lang":"clj","line":1502,"code":"(defn compile-all\n  \"Compile every fn-row whose ref-DAG bottoms out at base-fn impls.\n   Returns `{fn-id → (fn [free-args ctx])}`. Cycle in ref-DAG →\n   throws (second line of defence over the storage constraint).\n\n   `lookups` MUST already carry `:base-fns` (the impl registry).\n\n   Cached on a process-wide bounded LRU keyed by graph-shape +\n   base-fn name set — sister callers (test ns's that bootstrap the\n   same package set, sibling branches with identical graph views)\n   skip the compile pass entirely and just retrieve the\n   ctx-independent closure map.\n\n   The cache holds DELAYS, not values, and that is what makes the\n   cache work for CONCURRENT sister callers rather than only\n   sequential ones. It used to read the atom, miss, compile, then\n   write — check-then-act. Three namespaces released together from\n   `ensure-golden!`'s lock therefore all missed the same cold key and\n   all compiled the same ~2600-fn graph at once. Measured fingerprint:\n   79.1 s / 77.7 s / 75.7 s of fixture, three different workloads\n   agreeing to within 4% because they were not different workloads at\n   all — they were one compile, run three times, contending.\n\n   With a delay, the `swap!` decides the winner: a loser's swap\n   function re-runs against the winner's value, finds the key present,\n   and returns the vector untouched, so its own unrun delay is\n   discarded. Everyone then derefs the SAME delay — one compile, the\n   rest blocked on it. A global lock would also fix the dogpile but\n   would serialise compiles of genuinely DIFFERENT graphs, which is\n   the case this cache exists to make fast.\"\n  [lookups]\n  (let [k (compile-all-cache-key lookups)\n        installed? (volatile! false)\n        cache (swap! compile-all-cache\n                     (fn [v]\n                       (if (some (fn [[ck _]] (= ck k)) v)\n                         (do (vreset! installed? false) v)\n                         (do (vreset! installed? true)\n                             (conj (vec (take-last (dec compile-all-cache-max-size) v))\n                                   [k (delay (compile-all* lookups))])))))\n        d (some (fn [[ck cv]] (when (= ck k) cv)) cache)]\n    ;; Counted here, not at `rebuild!`, because `rebuild!` is the ASK and this is\n    ;; the WORK. Three namespaces each calling `rebuild!` is three asks and — if\n    ;; this cache is doing its job — one compile. A counter on the ask cannot\n    ;; tell those apart, which is exactly how the dogpile went unseen: the\n    ;; suite's 107 rebuilds looked identical before and after it was fixed.\n    ;;\n    ;; The `volatile!` reads oddly next to a `swap!` whose function must be pure.\n    ;; It is: `swap!` may retry and re-run the fn, and each run overwrites the\n    ;; flag, so the LAST run — the one whose value was actually installed — is\n    ;; the one that decides. That is precisely the answer we want.\n    (counters/count! (if @installed? :compile/all-miss :compile/all-hit))\n    (try\n      @d\n      (catch Exception t\n        ;; A delay memoises its exception, so a transient failure would be\n        ;; served to every later caller of this key forever. Evict, and let the\n        ;; next one compile again — the old code could not cache a failure at\n        ;; all (it wrote only after a successful compile), and that property is\n        ;; worth keeping. `Exception`, not `Throwable`: an Error here means the\n        ;; JVM is already going down, and a poisoned cache entry is not the\n        ;; problem worth solving on the way.\n        (swap! compile-all-cache (fn [v] (filterv (fn [[ck _]] (not= ck k)) v)))\n        (throw t)))))","gi":9,"see":[{"gi":10,"label":"compile-fn"}]},{"say":"Produces one fn's runtime closure `(fn [fa ctx])`. It turns each\n           classified binding into a *builder*, wires env-bindings and\n           rename-aliases, and at call time assembles the args map and invokes\n           `(impl args ctx)`. This is the concrete anatomy of a single compiled\n           graph node.","defn":"compile-fn","ns":"graphden.executor.compile-eager","n":11,"file":"src/graphden/executor/compile_eager.clj","lang":"clj","line":1201,"code":"(defn compile-fn\n  \"Return `(fn [free-args ctx])` for `fn-id`. `child-callables` is\n   `{fn-id → callable}` for ref-targets, populated in topological\n   order by `compile-all`.\n\n   Env-bindings (bindings on slots that AREN'T root slots — used to\n   propagate values like `:base-handler` through the ref-tree to\n   inner consumers) participate in a shared `fa-ref` volatile.\n   They evaluate to `delay`s whose closures read the volatile at\n   FORCE time, so an env-binding `A` that needs another env-binding\n   `B`'s value (forwards-reference, the order they're declared in\n   doesn't constrain dependencies) sees the final `fa'` map — same\n   semantics as the legacy compile's `augment-env`. Without this,\n   `:types-compatible`'s `:_rejected?` closure (which needs\n   `:validation` from the same env layer) sees an empty `:validation`\n   slot and reports every well-formed request as rejected, even\n   though the API path is correct.\"\n  ([fn-id lookups]\n   (compile-fn fn-id lookups {}))\n  ([fn-id lookups child-callables]\n   (let [impl (resolve-impl fn-id lookups)\n         enriched (mapv (fn [bnd]\n                          (if (and (= :ref (:kind bnd))\n                                   (not (:is-fn bnd)))\n                            (assoc bnd :ref-renames\n                                   (r/build-ref-renames (:ref-id bnd)\n                                                        fn-id\n                                                        lookups))\n                            bnd))\n                        (b/collect-bindings fn-id lookups))\n         builders (mapv #(arg-builder fn-id % child-callables lookups) enriched)\n         keys-vec (mapv :base-name enriched)\n         n (count builders)\n         env-bnds (b/collect-env-bindings fn-id lookups)\n         env-builders (mapv #(env-arg-builder fn-id % child-callables lookups)\n                            env-bnds)\n         env-names (mapv :env-name env-bnds)\n         env-n (count env-bnds)\n         ;; Compile-time-derived runtime aliasing for this fn's own\n         ;; rename slots. When a rename like `{:as :item}` surfaces\n         ;; a deep slot (`:branch-row` from the ref-tree) under a\n         ;; renamed outer name, downstream refs still read by the\n         ;; deep name — `apply-rename-aliases` copies the\n         ;; caller-supplied rename value back to the deep name so\n         ;; the lookup succeeds. Empty aliases (fns without own\n         ;; rename slots — the common case) short-circuit at apply.\n         rename-aliases (r/compute-rename-aliases fn-id lookups)\n         ;; Top-level entry: install a fresh per-execute call-cache in\n         ;; ctx if none is in scope yet. Nested closure calls inherit\n         ;; the outer cache through ctx, so all siblings memoise on\n         ;; `(ref-id × fa)`. `HashMap` (not `clojure.lang.PersistentMap`)\n         ;; — one-cache-per-call, single-threaded read/write inside one\n         ;; top-level closure.\n         run\n         (fn [fa ctx]\n           (let [;; Prime a fresh per-call cache for sibling `:ref`\n                 ;; memoisation, UNLESS:\n                 ;;  - one is already in scope (inherited from an enclosing\n                 ;;    execute) — reuse it; or\n                 ;;  - this is a router-BUILD execute flagged by\n                 ;;    `defer-handler-call-cache` — prime NO shared cache and\n                 ;;    KEEP the flag, so every nested run down to where the\n                 ;;    `:fn` route handlers are `hof-wrap`ped stays cache-less\n                 ;;    too (consuming the flag here would let those nested runs\n                 ;;    re-prime a cache the handlers then capture). The flag\n                 ;;    rides along on the captured ctx, so each later REQUEST\n                 ;;    through such a handler also runs cache-less (every `:ref`\n                 ;;    a fresh call) — correct + per-principal, trading away\n                 ;;    within-request memo for these low-traffic admin routes.\n                 ctx (let [rc *request-call-cache*]\n                       (cond\n                         ;; Per-scope override active (an `:http-server`\n                         ;; request or `:future` worker bound a fresh cache):\n                         ;; install ITS map, overriding any build-time cache\n                         ;; this ctx captured — that captured map is shared by\n                         ;; every invocation of a build-time handler and races\n                         ;; a CME under concurrency. Idempotent for nested runs\n                         ;; (ctx already carries `rc` → the next clause returns\n                         ;; it unchanged).\n                         (and rc (not (identical? (::call-cache ctx) rc)))\n                         (assoc ctx ::call-cache rc)\n\n                         (or (::call-cache ctx) (skip-cache-priming-key ctx))\n                         ctx\n\n                         :else\n                         (assoc ctx ::call-cache (java.util.HashMap.))))\n                 fa (r/apply-rename-aliases fa rename-aliases)\n                 ;; The `fa-ref` volatile ONLY exists so env-binding delays can\n                 ;; read the post-merge map at force time (forward references\n                 ;; between env-bindings). Fns with no env-bindings — the common\n                 ;; case — never read it, so skip the per-call allocation entirely.\n                 fa' (if (zero? env-n)\n                       fa\n                       (let [fa-ref (volatile! fa)\n                             merged (loop [m fa, i 0]\n                                      (if (< i env-n)\n                                        (recur (assoc m (nth env-names i)\n                                                      ((nth env-builders i) fa-ref ctx))\n                                               (inc i))\n                                        m))]\n                         (vreset! fa-ref merged)\n                         merged))]\n             (impl (persistent!\n                     (loop [acc (transient {}), i 0]\n                       (if (< i n)\n                         (recur (assoc! acc\n                                        (nth keys-vec i)\n                                        ((nth builders i) fa' ctx))\n                                (inc i))\n                         acc)))\n                   ctx)))]\n     ;; `:cell` (and any `:compile-time-value?` base-fn): evaluate once\n     ;; here and bake `(constantly result)`, so the atom persists across\n     ;; every `execute` this compiled registry serves.\n     (if (compile-time-value-root? fn-id lookups)\n       (compile-time-value-closure fn-id enriched run)\n       run))))","gi":10,"see":[{"gi":11,"label":"arg-builder"},{"gi":12,"label":"resolve-impl"}]},{"say":"Emits the per-binding `(fn [fa ctx])`: `:value` becomes a constant,\n           `:free` reads the slot-id (with a name fallback), `:ref` becomes a\n           `thunk`/delay that **defers** the child call, `:seq` becomes a lazy\n           seq. This is the origin of graphden's laziness — refs are *wrapped,\n           not evaluated*, so native Clojure `if`/`and`/`or` short-circuit for\n           free without the executor knowing their names.","defn":"arg-builder","ns":"graphden.executor.compile-eager","n":12,"file":"src/graphden/executor/compile_eager.clj","lang":"clj","line":1018,"code":"(defn- arg-builder\n  \"Return `(fn [free-args ctx])` producing the value for one\n   classified binding.\n\n   Lazy semantics are built into the model the way Clojure does\n   them — `:ref` bindings ALWAYS produce a `delay`, and the impl\n   reads the arg through `rt/resolve-arg` which auto-derefs\n   `IDeref`. Inside the impl, `(if test then else)` short-circuits\n   because Clojure's native `if` only evaluates the picked form,\n   so only its `resolve-arg` call runs, and only its delay forces.\n   The un-taken branch's `delay` stays unforced — its side-effects\n   never fire. No `:lazy?` flag, no `:lazy-args` registration:\n   ordinary Clojure evaluation does it.\n\n   `:seq` materialises as an unchunked lazy-seq of values\n   (Clojure-native short-circuit through `every?` / `some`).\n   `lazy-seq?` slots wrap each item in `delay` for consumers like\n   `cond-fn` that step past unforced items via `nnext`.\"\n  [fn-id\n   {:keys [kind ext-name value ref-id is-fn produces-callable? ref-renames\n           items lazy-seq? slot-id binder-fn-id resolver-id stored]\n    :as bnd}\n   child-callables\n   lookups]\n  (case kind\n    :value (constantly value)\n    ;; Phase 4 — slot-id reader with name fallback.\n    ;;\n    ;; The rename-aware reader id (`l/effective-reader-slot-id`) is\n    ;; the PRIMARY key: two inline-anons of the same base-fn with\n    ;; their own `{:as :X}` renames have the SAME chain-leaf but\n    ;; DIFFERENT rename-slot ids, so each anon's reader finds its\n    ;; own caller value via slot-id without name collision.\n    ;;\n    ;; Name fallback covers paths that still write `fa` by name:\n    ;;   - env-builder writes `fa[env-name]` (per-fn synthetic\n    ;;     shared computations like `:_request-parsed`)\n    ;;   - hof-wrap's `make-shape-callable` merges `lambda-args`\n    ;;     under lambda-param names (per-call values)\n    ;;   - `build-ref-renames` slow path copies caller→callee names\n    ;; These name keys flow through the same `fa` and the reader's\n    ;; fallback finds them when there's no slot-id key. The fa is\n    ;; thus hybrid: slot-id keys distinguish structural ambiguity at\n    ;; the boundary translator, name keys cover dynamic flows. This\n    ;; is the architecture, not a transitional kludge — the two key\n    ;; spaces serve different needs.\n    :free  (let [sid (l/effective-reader-slot-id fn-id slot-id lookups)\n                 k ext-name]\n             (fn [fa _ctx]\n               (let [v (get fa sid ::miss)]\n                 (if (identical? v ::miss) (get fa k) v))))\n    ;; Generic resolver: evaluate the resolver graph fn with the stored\n    ;; value as its single argument, lazily at first read. Reuses the\n    ;; 1-arg callable machinery — a resolver is just a fn usable as a\n    ;; single-arg callable (`:str-upper`, `:vault-get`, anything).\n    :resolved-value\n    (let [rid resolver-id sv stored]\n      (fn [_fa ctx]\n        (rt/thunk\n          (fn []\n            ((@make-single-arg-callable-fn ctx rid) sv)))))\n\n    :ref\n    (let [child (or (get child-callables ref-id)\n                    (throw (ex-info \"compile-eager: ref-target not yet compiled\"\n                                    {:type :compile/missing-child\n                                     :binding bnd :ref-id ref-id\n                                     :fn-id fn-id})))\n          ref-frees (set (r/cache-projection-frees ref-id lookups))\n          ref-name (get-in lookups [:fn-map ref-id :name])]\n      (cond\n        ;; HOF binding where the slot's structural shape is\n        ;; `[:fn {…} …]` and the target is NOT itself a callable-\n        ;; producer: build the Clojure closure the consumer will\n        ;; call positionally. Value-shape, not delay-shape — the\n        ;; impl invokes it directly.\n        (and is-fn (not produces-callable?))\n        (let [lambda-params (r/hof-lambda-params ref-id slot-id bnd fn-id lookups)\n              translation (r/build-hof-translation ref-id lambda-params lookups)]\n          (hof-wrap child lambda-params translation))\n\n        ;; Two collapse into one — both want \"invoke child with the\n        ;; caller's env, wrap in a thunk for short-circuit\":\n        ;; - `:produces-callable?`: target's fn-graph evaluates to a\n        ;;   Clojure callable (`:_router` → ring-handler). Wrapping\n        ;;   means the router builds only when the impl actually\n        ;;   reads the arg.\n        ;; - non-renamed plain ref: the common case — no caller→\n        ;;   callee free-arg translation needed.\n        ;;\n        ;; `rt/thunk` (a fn with `::thunk` meta) rather than `delay`\n        ;; here: `resolve-arg` auto-calls it for impls that read args\n        ;; via the `defbase` macro AND impls that read raw\n        ;; (`((:body args))` — the closure-capture acceptance test)\n        ;; can still invoke the value as a 0-arg fn.\n        (or produces-callable? (empty? ref-renames))\n        (fn [fa ctx]\n          (rt/thunk (fn [] (call-with-cache ref-id ref-frees ref-name child fa ctx))))\n\n        :else\n        (fn [fa ctx]\n          (rt/thunk (fn []\n                      (call-with-cache\n                        ref-id ref-frees ref-name child\n                        (reduce-kv (fn [acc callee-name caller-name]\n                                     (assoc acc callee-name (get fa caller-name)))\n                                   fa ref-renames)\n                        ctx))))))\n    :seq\n    (let [item-builders (mapv #(seq-item-builder % child-callables lookups\n                                                 (or binder-fn-id fn-id))\n                              items)]\n      (if lazy-seq?\n        (fn [fa ctx]\n          (map (fn [b] (delay (b fa ctx))) item-builders))\n        (fn [fa ctx]\n          (lazy-seq-of-values item-builders fa ctx))))\n    (throw (ex-info (str \"compile-eager: unsupported binding kind \" kind)\n                    {:type :compile/unsupported-kind :binding bnd}))))","gi":11,"see":[{"gi":14,"label":"resolve-arg"}]},{"say":"Looks the base-fn's Clojure impl out of `lookups[:base-fns]` by the\n           root fn's name, throwing `:compile/missing-impl` on a gap. This is the\n           concrete join between a graph node and the actual code that computes\n           it — the point where the graph description meets a real function.","defn":"resolve-impl","ns":"graphden.executor.compile-eager","n":13,"file":"src/graphden/executor/compile_eager.clj","lang":"clj","line":791,"code":"(defn- resolve-impl\n  [fn-id {:keys [fn-map base-fns] :as lookups}]\n  (let [root-name (some-> (l/root-fn fn-id fn-map lookups) :name keyword)]\n    (or (get base-fns root-name)\n        (throw (ex-info (str \"No impl for base-fn \" (pr-str root-name))\n                        {:type :compile/missing-impl\n                         :fn-id fn-id :base-fn-name root-name})))))","gi":12,"see":[{"gi":13,"label":"defbase"}]},{"say":"The macro base-fn authors use. It rewrites a body that names its args\n           as bare symbols into `(defn name [__args ctx] …)`, where each symbol\n           reads through `resolve-arg`. This explains why the impls that\n           `resolve-impl` finds look like ordinary Clojure even though their\n           arguments arrive as a compiled map.","defn":"defbase","ns":"graphden.executor.defbase","n":14,"file":"src/graphden/executor/defbase.clj","lang":"clj","line":142,"code":"(defmacro defbase\n  \"Declare a base-fn implementation.\n\n   Syntax: `(defbase fn-name docstring? [arg-syms] & body)`\n\n   The arg-syms vector names the args referenced in the body; their types\n   live in the package's `fns.edn`. The body refers to args as bare symbols\n   and to `ctx` for the execution context. Everything else works like\n   normal Clojure — `if`/`and`/`or` short-circuit naturally.\"\n  {:arglists '([fn-name docstring? [arg-syms] & body])}\n  [fn-name & macro-args]\n  (let [[docstring args-vec & body] (if (string? (first macro-args))\n                                      macro-args\n                                      (cons nil macro-args))\n        _ (when-not (vector? args-vec)\n            (throw (ex-info \"defbase arg list must be a vector of symbols\"\n                            {:fn-name fn-name :args args-vec})))\n        _ (when-not (every? simple-symbol? args-vec)\n            (throw (ex-info \"defbase arg list must contain only simple symbols\"\n                            {:fn-name fn-name :args args-vec})))\n        reserved #{'__args 'ctx}\n        clash (some reserved args-vec)\n        _ (when clash\n            (throw (ex-info (str \"defbase arg name clashes with reserved symbol: \" clash)\n                            {:fn-name fn-name :reserved reserved})))\n        arg-sym->key (into {} (map (fn [s] [s (keyword s)])) args-vec)\n        transformed (transform-body body arg-sym->key)\n        body-form `(do ~@transformed)]\n    `(defn ~fn-name\n       ~@(when docstring [docstring])\n       [~'__args ~'ctx] ~body-form)))","gi":13,"see":[{"gi":14,"label":"resolve-arg"}]},{"say":"The read-side of laziness. Inside an impl this forces a `thunk`\n           (calling it once), derefs an `IDeref`/`delay`, or returns a plain\n           value untouched. This is where a deferred `:ref` argument actually\n           gets evaluated — at the moment, and only if, the impl reads it. Pair\n           it with `arg-builder`, which created the thunk.","defn":"resolve-arg","ns":"graphden.executor.runtime","n":15,"file":"src/graphden/executor/runtime.clj","lang":"clj","line":39,"code":"(defn resolve-arg\n  \"Return the resolved value for `arg-key` in `args`.\n\n   Handles three cases:\n   - `thunk?` — call it (compile-produced ref wrapping).\n   - `IDeref` — `@` it (test code often passes `(delay …)` literals).\n   - otherwise — return as-is.\"\n  [args arg-key]\n  (let [v (get args arg-key)]\n    (cond\n      (thunk? v) (v)\n      (instance? clojure.lang.IDeref v) @v\n      :else v)))","gi":14,"see":[{"gi":11,"label":"arg-builder"}]},{"say":"Closes the loop. Child-callable invocations are memoised for the\n           duration of one top-level `execute`, keyed by `[ref-id\n           projected-free-args]` in a per-call map (with a `::nil` sentinel and a\n           size cap). This is how the lazy graph avoids recomputing the same\n           sub-result and delivers a single cached value back up to the caller —\n           the DRY principle, enforced at runtime.","defn":"call-with-cache","ns":"graphden.executor.compile-eager","n":16,"file":"src/graphden/executor/compile_eager.clj","lang":"clj","line":704,"code":"(defn- call-with-cache\n  \"Invoke `(child fa ctx)` through the per-execute memo. Cache key is\n   `[ref-id projected-fa]` where projected-fa is `fa` restricted to\n   the ref-target's declared free args. Cache miss / absent cache /\n   always-fresh fn-id all fall through to a fresh call. `::nil`\n   sentinel distinguishes a cached `nil` from miss.\n\n   On reaching `call-cache-max-size` the cache evicts its PURE entries\n   but keeps single-fire effectful ones (`evict-preserving-effectful!`)\n   — bounding pathological per-request growth without re-firing a\n   side-effecting ref pulled twice in one execute (see the size\n   constant's doc).\n\n   `ref-name` (the ref's authored row name, a compile-time constant)\n   is threaded to the path-trace seam so its stale-id secret rescue\n   works. The 5-arity form (no name) delegates with `nil` — used by\n   focused tests and any caller without a name in hand.\n\n   Debug P1: every arm passes the path-trace seam (`fresh-call` /\n   `record-path-hit!`) — zero work beyond one nil-check unless the\n   execution bound `*path-trace*` AND `ref-id` is in `*traced-fn-ids*`.\n   Entries land in COMPLETION order (a callee's entry precedes its\n   caller's).\"\n  ([ref-id ref-frees child fa ctx]\n   (call-with-cache ref-id ref-frees nil child fa ctx))\n  ([ref-id ref-frees ref-name child fa ctx]\n   (let [^java.util.HashMap cache (::call-cache ctx)]\n     (if (or (nil? cache) (contains? @*always-fresh-fn-ids* ref-id))\n       (fresh-call ref-id ref-name child fa ctx)\n       (let [k [ref-id (fa-key-for-cache ref-frees fa)]\n             cached (java.util.HashMap/.get cache k)]\n         (if (some? cached)\n           (do (when-some [trace (active-path-trace ref-id)]\n                 (record-path-hit! trace ref-id ref-name))\n               (when-not (identical? cached ::nil) cached))\n           (let [v (fresh-call ref-id ref-name child fa ctx)]\n             (when (>= (java.util.HashMap/.size cache) call-cache-max-size)\n               (evict-preserving-effectful! cache effectful-ref?))\n             (java.util.HashMap/.put cache k (if (nil? v) ::nil v))\n             v)))))))","gi":15}]},{"id":":storage","title":"Storage & the graph","status":"toured","summary":"How the graph is stored and traversed — Postgres, recursive CTEs,\n             the StorageCRUD / ExecutionGraph protocols.","paths":["src/graphden/storage/","src/graphden/schema/"],"after":[":executor"],"steps":[{"say":"The storage layer starts with three protocols; this is the first.\n           `Storage` is the lifecycle contract (`initialize` / `close`) every\n           backend implements, binding a concrete store to a `DataSchema`\n           before any graph can be read or written.","defn":"Storage","ns":"graphden.storage.protocol.core","n":1,"file":"src/graphden/storage/protocol/core.clj","lang":"clj","line":81,"code":"(defprotocol Storage\n  \"Protocol for data storage backends.\"\n\n  (initialize\n    [this schema]\n    \"Initializes/migrates storage to match the given DataSchema.\")\n\n  (close\n    [this]\n    \"Releases storage resources.\"))","gi":16},{"say":"The row-level contract: `read-entity`, `query-entities`,\n           `create-entity`, and friends. Every graph read the executor does\n           bottoms out in these calls — learn this shape and you know how the\n           whole system touches the database.","defn":"StorageCRUD","ns":"graphden.storage.protocol.core","n":2,"file":"src/graphden/storage/protocol/core.clj","lang":"clj","line":117,"code":"(defprotocol StorageCRUD\n  \"Protocol for CRUD operations on stored entities.\"\n\n  (create-entity\n    [this entity-name data]\n    \"Creates a new entity record.\")\n\n  (read-entity\n    [this entity-name id]\n    \"Reads an entity record by ID.\")\n\n  (update-entity\n    [this entity-name id data]\n    \"Updates an existing entity record.\")\n\n  (delete-entity\n    [this entity-name id]\n    \"Deletes an entity record by ID.\")\n\n  (query-entities\n    [this entity-name where]\n    [this entity-name where opts]\n    \"Queries entities matching the given criteria.\n\n     Three-arg form is the original predicate-only query.\n\n     Four-arg form additionally accepts `opts`:\n       {:order-by [[:column :asc|:desc] ...]   ; nil → unordered\n        :limit    n                            ; nil → unbounded\n        :offset   n}                           ; nil → 0\n     `opts` may be nil or empty. Backends that wrap a base storage\n     (e.g. VersionedStorage) MAY refuse `opts` on entities whose\n     semantics require post-query resolution (currently versioned\n     entities) by throwing `:storage-error/unsupported-opts`.\")\n\n  (query-latest-per-group\n    [this entity-name where group-cols]\n    \"Returns ONE row per distinct `group-cols` tuple — the row with\n     the latest `:created-at`. Same `where`-semantics as\n     `query-entities`. `group-cols` is a non-empty vector of keyword\n     column names (e.g. `[:fn-id :branch-id]`).\n\n     Why this lives at the protocol level: versioned reads only ever\n     need the latest version per (entity-id, branch-id). Without a\n     dedup-at-source path, `query-entities` returns ALL historical\n     versions and the resolution layer drops most of them on the\n     floor — fine in tests, OOM in long-running executors.\n\n     Backends that can't push the dedup to the storage engine (e.g.\n     a hypothetical pure-in-memory backend) MAY implement this as\n     `query-entities` + in-memory grouping. The contract is the\n     result, not the mechanism.\"))","gi":17},{"say":"One method: `resolve-execution-graph` — given a root fn-id, return\n           its entire reachable subgraph in a single shot. This is the seam the\n           executor's `rebuild!` reads through, and it is implemented twice\n           below: a backend-agnostic version and a Postgres-optimized one.","defn":"ExecutionGraph","ns":"graphden.storage.protocol.core","n":3,"file":"src/graphden/storage/protocol/core.clj","lang":"clj","line":258,"code":"(defprotocol ExecutionGraph\n  \"Protocol for retrieving complete execution graph for a function.\"\n\n  (resolve-execution-graph\n    [this fn-id]\n    \"Resolves the complete execution graph for a function.\"))","gi":18,"see":[{"gi":4,"label":"rebuild!"}]},{"say":"What a schema exposes: the entities, their fields, and the field\n           types (`:ref`, `:enum`, `:union`). Rows are shaped by this vocabulary\n           before storage ever sees them — so read it before the row-storage\n           code below.","defn":"DataSchema","ns":"graphden.schema.protocol.protocol","n":4,"file":"src/graphden/schema/protocol/protocol.clj","lang":"clj","line":28,"code":"(defprotocol DataSchema\n  \"Protocol for working with data schema definitions.\"\n\n  (entities\n    [this]\n    \"Returns a sequence of entity names defined in this schema.\")\n\n  (entity-uuid\n    [this entity-name]\n    \"Returns the UUID of the given entity, or nil if entity not found.\")\n\n  (entity-fields\n    [this entity-name]\n    \"Returns a map of field definitions for the given entity.\n     Returns nil if entity is not found.\n\n     Each field is a map with :uuid (required), :type (required), and\n     type-specific attributes. Allowed attributes per field type:\n\n     Base types (:uuid, :text, :int, :bool, :numeric, :timestamptz,\n     :jsonb, :bytes, :sequence, :keyword — plus the permissive :any\n     and :fn, a fn-reference stored as UUID):\n       - :uuid (required, stable identifier)\n       - :type (required)\n       - :nullable? (optional, default false)\n       - :indexed? (optional — ask the backend for a plain index)\n\n     :ref (reference to another entity, always points to :id):\n       - :uuid (required, stable identifier)\n       - :type (required, must be :ref)\n       - :ref-entity (required, keyword naming the referenced entity)\n       - :nullable? (optional, default false)\n\n     :ref-many (many-to-many; junction table in PG, public API reads\n     a vector of UUIDs — e.g. :fn/:parent-ids):\n       - :uuid (required, stable identifier)\n       - :type (required, must be :ref-many)\n       - :ref-entity (required)\n\n     :enum (enumeration with predefined keyword values):\n       - :uuid (required, stable identifier)\n       - :type (required, must be :enum)\n       - :enum-name (required, keyword naming the enum)\n       - :nullable? (optional, default false)\n\n     :union (value can be one of several types):\n       - :uuid (required, stable identifier)\n       - :type (required, must be :union)\n       - :variants (required, vector of field specs without :nullable? or :uuid)\n       - :nullable? (optional, default false)\n\n     Example: {:name {:uuid #uuid \\\"...\\\" :type :text}\n               :bio {:uuid #uuid \\\"...\\\" :type :text :nullable? true}\n               :role {:uuid #uuid \\\"...\\\" :type :enum :enum-name :user-role}\n               :manager-id {:uuid #uuid \\\"...\\\" :type :ref :ref-entity :user}\n               :value {:uuid #uuid \\\"...\\\"\n                       :type :union\n                       :variants [{:type :ref :ref-entity :fn}\n                                  {:type :int}\n                                  {:type :text}]}}\")\n\n  (enums\n    [this]\n    \"Returns a map of enum definitions.\n     Each enum is a map with:\n       - :uuid - stable identifier for the enum\n       - :values - map of value keyword to value UUID\n\n     Example: {:user-role {:uuid #uuid \\\"...\\\"\n                           :values {:admin #uuid \\\"...\\\"\n                                    :user #uuid \\\"...\\\"\n                                    :guest #uuid \\\"...\\\"}}}\")\n\n  (enum-uuid\n    [this enum-name]\n    \"Returns the UUID of the given enum, or nil if enum not found.\")\n\n  (entity-constraints\n    [this entity-name]\n    \"Returns a vector of constraints for the given entity.\n     Returns empty vector [] if entity has no constraints or is unknown.\n\n     Each constraint is a map with :type and :fields.\n     Currently supported constraint types: :unique\n\n     Example: [{:type :unique :fields [:email]}\n               {:type :unique :fields [:tenant-id :name]}]\")\n\n  (retired-fields\n    [this]\n    \"Returns a map of `{entity-name {field-name field-uuid}}` for fields\n     marked via `retire-field` on the builder. The migration framework\n     treats these as intentional removals — the field's UUID is excluded\n     from the destructive-change rejection set and `:on-delete-field!`\n     is invoked instead.\n\n     Returns `{}` if no fields are retired.\"))","gi":19},{"say":"…and its ONE implementation. The record is an immutable bag of maps\n           (`entities-map`, `enums-map`, `entity-uuids-map`,\n           `retired-fields-map`) with every protocol method a lookup into\n           them — which is the point: a schema is data a builder assembled,\n           not code. `create-builder` at the bottom of the file is what the\n           `:db/schema` component calls, and the `extend-builder` fns below\n           are how each subsystem contributes its entities to it.","defn":"MalliDataSchema","ns":"graphden.schema.malli.core","n":5,"file":"src/graphden/schema/malli/core.clj","lang":"clj","line":12,"code":"(defrecord MalliDataSchema\n  [enums-map entities-map entity-uuids-map constraints-map retired-fields-map]\n\n  ds/DataSchema\n\n  (entities\n    [_this]\n    (keys entities-map))\n\n\n  (entity-uuid\n    [_this entity-name]\n    (get entity-uuids-map entity-name))\n\n\n  (entity-fields\n    [_this entity-name]\n    (get entities-map entity-name))\n\n\n  (enums\n    [_this]\n    enums-map)\n\n\n  (enum-uuid\n    [_this enum-name]\n    (get-in enums-map [enum-name :uuid]))\n\n\n  (entity-constraints\n    [_this entity-name]\n    (get constraints-map entity-name []))\n\n\n  (retired-fields\n    [_this]\n    (or retired-fields-map {})))","gi":20,"see":[{"gi":110,"label":"postgres"}]},{"say":"Where the graph model is actually declared: the `ns` / `fn` / `slot`\n           / `binding` / `binding-list-item` entities and the `:ref` edges\n           between them. This is the concrete table + foreign-key layout that\n           every traversal walks.","defn":"extend-builder","ns":"graphden.schema.graph.schema","n":6,"file":"src/graphden/schema/graph/schema.clj","lang":"clj","line":651,"code":"(defn extend-builder\n  \"Extends a builder with graph schema entities.\"\n  [builder]\n  (-> builder\n      ;; Enums\n      ;; :value-kind — the PG enum TYPE is currently referenced by no\n      ;; column (the columns that once used it are retired); the\n      ;; declaration stays until a retire-enum mechanism exists — an\n      ;; unused pg enum type is inert (same status as :override-kind\n      ;; below). The `value-kind-values` MAP itself is load-bearing:\n      ;; codec heuristic + /api/value-kinds.\n      (ds/add-enum :value-kind value-kind-enum-uuid (value-kind-enum-values))\n      (ds/add-enum :override-kind override-kind-enum-uuid (override-kind-enum-values))\n\n      ;; -----------------------------------------------------------------\n      ;; ns: namespace entity\n      ;; -----------------------------------------------------------------\n      (ds/add-entity :ns ns-entity-uuid\n                     {:name {:uuid ns-name-field-uuid\n                             :type :text}\n                      :parent-id {:uuid ns-parent-id-field-uuid\n                                  :type :ref\n                                  :ref-entity :ns\n                                  :nullable? true}\n                      :description {:uuid ns-description-field-uuid\n                                    :type :text\n                                    :nullable? true}\n                      ;; Tenant owner (§3.0 B2). NULL ≡ public — core /\n                      ;; package namespaces are shared; a tenant's namespaces\n                      ;; are stamped with their org and isolated (read-filter\n                      ;; + own?-write-guard + RLS), same model as :fn.\n                      :org-id {:uuid ns-org-id-field-uuid\n                               :type :text\n                               :nullable? true}})\n      (ds/add-constraint :ns {:type :unique :fields [:parent-id :name]})\n\n      ;; -----------------------------------------------------------------\n      ;; fn: function entity (also represents types — see ns-doc).\n      ;; -----------------------------------------------------------------\n      (ds/add-entity :fn fn-entity-uuid fn-fields)\n      ;; NOTE — the `UNIQUE (namespace-id, name)` constraint was retired.\n      ;; Like `binding-list-item (binding-id, position)` before it, name\n      ;; uniqueness is a per-branch RESOLVED-VIEW property, not a base-table\n      ;; one: soft-deleted identity rows persist by design and kept the\n      ;; `(ns, name)` key occupied forever (delete a fn inside a namespace →\n      ;; every future create/move of a same-named fn there bounced with a\n      ;; unique-violation), while NULL `namespace-id` (root fns) was never\n      ;; covered by the btree at all. VersionedStorage now enforces it\n      ;; against the live branch view (`check-fn-name-collision!`), advisory-\n      ;; lock-serialized; the raw index is dropped via `retired-indexes` in\n      ;; storage/postgres/migration.clj.\n      (ds/add-constraint :fn {:type :unique :fields [:anonymous-hash]})\n\n      ;; -----------------------------------------------------------------\n      ;; slot: an atomic (name, type) pair.\n      ;; Immutable — changing the type = creating a new slot.\n      ;; -----------------------------------------------------------------\n      (ds/add-entity :slot slot-entity-uuid\n                     {:name {:uuid slot-name-field-uuid\n                             :type :text}\n                      :type-fn-id {:uuid slot-type-fn-id-field-uuid\n                                   :type :ref\n                                   :ref-entity :fn}\n                      :required {:uuid slot-required-field-uuid\n                                 :type :bool\n                                 :nullable? true}\n                      :description {:uuid slot-description-field-uuid\n                                    :type :text\n                                    :nullable? true}\n                      ;; Renamed-view marker — when set, this slot is a\n                      ;; new identity for `source-slot-id` exposed under\n                      ;; a different `:name`. Composed fn-defs use this\n                      ;; to surface inherited slots under their own\n                      ;; vocabulary; descendants then bind by the new\n                      ;; name and the binding lands on this slot's id\n                      ;; via the deterministic UUIDv5 scheme.\n                      :source-slot-id {:uuid slot-source-slot-id-field-uuid\n                                       :type :ref\n                                       :ref-entity :slot\n                                       :nullable? true}\n                      ;; Tenant owner (§3.0 B2). NULL ≡ public.\n                      :org-id {:uuid slot-org-id-field-uuid\n                               :type :text\n                               :nullable? true}})\n\n      ;; -----------------------------------------------------------------\n      ;; fn-slot: many-to-many junction. fn ⊃ slots, with order.\n      ;; Describes 'the parameters / fields of this fn'.\n      ;; -----------------------------------------------------------------\n      (ds/add-entity :fn-slot fn-slot-entity-uuid fn-slot-fields)\n      (ds/add-constraint :fn-slot {:type :unique :fields [:fn-id :slot-id]})\n\n      ;; -----------------------------------------------------------------\n      ;; binding: per-fn customization of a specific slot.\n      ;; Mutually-exclusive groups:\n      ;;   value/ref-binding (value xor ref-fn-id) + override-kind\n      ;;   rename (rename-to)\n      ;;   type-override (type-override-fn-id)\n      ;;   per-level metadata (description, terminal)\n      ;;   list-specific markers (list-append, list-closed)\n      ;; Application-side constraint enforces \"at most one\n      ;; non-nil from {value, ref-fn-id}\".\n      ;; -----------------------------------------------------------------\n      (ds/add-entity :binding binding-entity-uuid binding-fields)\n      (ds/add-constraint :binding {:type :unique :fields [:fn-id :slot-id]})\n\n      ;; -----------------------------------------------------------------\n      ;; binding-list-item: ordered items for list-typed slot bindings.\n      ;; -----------------------------------------------------------------\n      (ds/add-entity :binding-list-item binding-list-item-entity-uuid\n                     binding-list-item-fields)\n      ;; NOTE — `(binding-id, position)` UNIQUE was retired in favour of\n      ;; a per-branch resolved-view check in `VersionedStorage`. The base\n      ;; identity row represents cross-branch identity; multiple branches\n      ;; can legitimately hold different items at the same `(binding-id,\n      ;; position)` (the resolver disambiguates by branch). Within a\n      ;; single branch, position uniqueness is enforced in\n      ;; `versioning.storage.core/check-list-item-position-collision!`.\n      ;; Existing DBs get the legacy index dropped by\n      ;; `storage.postgres.migration/drop-retired-indexes!`.\n\n      ;; -----------------------------------------------------------------\n      ;; resource-override: an in-DB override of a classpath frontend\n      ;; asset (UI Step 1 — edit the editor's own JS/CSS from inside the\n      ;; running editor). `path` uniqueness is a per-branch RESOLVED-VIEW\n      ;; property (like fn names) enforced in VersionedStorage\n      ;; (`check-resource-override-path-collision!`), not a base index.\n      ;; -----------------------------------------------------------------\n      (ds/add-entity :resource-override resource-override-entity-uuid\n                     resource-override-fields)\n\n      ;; -----------------------------------------------------------------\n      ;; Retired fields (Phase 6e — drop binding.rename-to)\n      ;; -----------------------------------------------------------------\n      ;; The `slot.source-slot-id` FK is the canonical home for renames\n      ;; now. The legacy text column has had no readers since Phase 6c\n      ;; and no writers since Phase 6d; mark it retired so the migration\n      ;; framework issues DROP COLUMN on next deploy.\n      (ds/retire-field :binding :rename-to binding-rename-to-field-uuid)\n      ;; `fn.impl-hash` retired — the base-fn discriminator is now the\n      ;; presence of `return-type-fn-id` (a type-row never has one). The\n      ;; column was always NULL in storage; mark it retired so the\n      ;; migration framework issues DROP COLUMN on next deploy.\n      (ds/retire-field :fn :impl-hash fn-impl-hash-field-uuid)\n      ;; `binding.override-kind` retired (audit-2 stage 2b): :fixed was\n      ;; superseded by :terminal, :default was write-only, :secret-path\n      ;; became the :vault

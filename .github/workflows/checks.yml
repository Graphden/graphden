name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # On demand, on any branch. Added with the integration job below: that job
  # is scoped to PRs and main, so without this there is no way to exercise it
  # from a feature branch before landing — and a CI job whose first execution
  # is on main is a job nobody has tested.
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  kondo:
    name: clj-kondo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # clj-kondo is PINNED to the same version deps.edn's :kondo alias
      # uses — `latest` here meant a fresh upstream release turned CI red
      # while every local/gate run (the pinned alias) stayed green
      # (2026-07-24: new :constant-condition linter did exactly that).
      # Bump BOTH together.
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          clj-kondo: '2026.08.04'
          bb: latest

      # Delegate: the path set lives ONCE, in bb.edn's `all-paths`. When this
      # job spelled its own `src test development`, CI linted a set `bb ci`
      # never saw — local-green/CI-red was structural, and `development/` sat
      # on two real errors nobody local could hit.
      - name: Run clj-kondo
        run: bb kondo

  splint:
    name: splint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run splint
        run: bb splint

  cljstyle:
    name: cljstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Check formatting
        run: bb cljstyle

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      # Unit suite here; the integration suite is its own job below. e2e is
      # the one that genuinely CANNOT run on a hosted runner — it boots
      # `graphden-executor:latest`, which this runner has no way to build
      # cheaply — and stays with the landing gate.
      - name: Run unit tests
        run: bb test-unit

  integration:
    name: integration (testcontainers)
    # The 2026-08-22 test audit found ~24% of the suite — 71 namespaces,
    # including EVERY HTTP-level accounts test (login, logout, OAuth,
    # Telegram, password reset, CSRF) — had exactly one execution point: the
    # local landing gate. A release that went around the gate ran none of
    # them, and that has happened (see the release-train notes).
    #
    # It runs here because it can: `:integration` needs testcontainers
    # (postgres, plus openbao for the vault client) and NOT the graphden
    # image, and ubuntu-latest ships a working Docker daemon. The comment
    # this replaces claimed otherwise for both suites; only e2e was true.
    #
    # Scoped to PRs and main rather than every push, on the same reasoning
    # as `coverage`: develop landings already go through the gate, which
    # runs this suite on the MERGED result. What this job adds is a second
    # execution point for the paths that reach main another way — plus
    # `workflow_dispatch`, so it can be run against any branch on demand.
    if: >-
      github.ref == 'refs/heads/main'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Measured ~6 min on the dev box; a hosted runner is slower and pulls
    # two container images cold. Generous, but bounded — a hang must not
    # burn the default 6 h.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      # Pull the images the fixtures ask for BEFORE the suite starts. A cold
      # pull inside a testcontainers `Wait/forHttp` eats the ready-check
      # window and surfaces as a boot timeout rather than as "the network was
      # slow" — the same failure mode tests.edn documents for the dev box at
      # parallelism 8.
      - name: Pre-pull testcontainers images
        run: |
          set -euo pipefail
          # Keep in sync with the fixtures: postgres:16.11-alpine is pinned in
          # test-infra/shared-container + storage.postgres/test-setup, and
          # vault-test asks for openbao. Ryuk is testcontainers' own reaper and
          # picks its tag from the library version, so let IT pull that one —
          # naming a tag here would rot the moment deps.edn bumps.
          docker pull -q postgres:16.11-alpine
          docker pull -q quay.io/openbao/openbao:latest

      - name: Run integration tests
        run: bb test-integration

  helm-lint:
    name: helm lint (deploy/helm/graphden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5.0.1

      # Lint + render BOTH fleet shapes, so a template error on either the
      # shared path or the dedicated-shard path (executorOrgs + sse +
      # controller kill-switch — docs/FLEET_DEPLOY.md) fails here instead of
      # at deploy time. The chart had zero CI validation before 2026-08-23.
      - name: Lint and render the chart
        run: |
          set -euo pipefail
          helm lint deploy/helm/graphden
          helm template gd deploy/helm/graphden >/dev/null
          helm template gd-acme deploy/helm/graphden \
            --set-string executorOrgs=acme \
            --set fleet.controllerEnabled=false \
            --set sse.enabled=true >/dev/null

  fleet-e2e:
    name: fleet e2e (two real containers)
    # `bb test-fleet-e2e` boots the executor image TWICE over a shared
    # Postgres and drives the token-gated /internal/fleet/* control plane —
    # the one suite that proves the fleet over real HTTP. Until 2026-08-22
    # nothing ran it; the landing gate now does (diff-scoped), and this job
    # is the second execution point for paths that reach main another way.
    # Scoped like `integration`: PRs + main + manual dispatch.
    if: >-
      github.ref == 'refs/heads/main'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Build the executor image the suite boots
        run: |
          set -euo pipefail
          clojure -T:build uber
          docker build -t graphden-executor:latest .
          docker pull -q postgres:16.11-alpine

      - name: Run the two-container fleet e2e
        run: bb test-fleet-e2e

  coverage:
    name: coverage
    # Instrumented run ~doubles the unit suite — main-only by design;
    # develop landings are gated by the local wtq gate's plain suite.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run coverage
        run: |
          # pipefail, or `tee` reports success over a failing suite —
          # this job IS the unit gate on GitHub CI, and exactly that
          # masked a stable 39-problem cloverage run for days.
          set -o pipefail
          bb coverage 2>&1 | tee coverage-output.txt
          # Extract form-coverage from the cloverage summary row.
          # The table is pipe-delimited and uses ANSI colour codes
          # (:colorize? true in tests-coverage.edn), so we strip ANSI
          # first, then split on '|'. Column 3 = form %, column 4 = line %.
          # Previous version used `awk '{print $4}'` on whitespace —
          # that pulled the literal '|' separator, not the number, so
          # the threshold check never actually fired.
          COVERAGE=$(grep "ALL FILES" coverage-output.txt \
                     | sed 's/\x1b\[[0-9;]*m//g' \
                     | awk -F'|' '{print $3}' \
                     | tr -d ' %')
          echo "Form coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "Could not parse coverage"
            exit 1
          fi
          # Threshold matches the current unit-only baseline with a
          # couple of points of slack. Bump it after intentional
          # improvements; never silently lower it on regression — that
          # defeats the gate.
          #
          # Baseline 2026-06-23: 71.50% form (unit-only) after a
          # reclassification + new-unit-tests pass: 4 test files
          # had ^:integration NS markers but contained pure-function
          # deftests that didn't need a testcontainer (branch-router-
          # test, branch-local-test, notify-test, type/refinements-
          # test partly); switched to per-deftest tagging. Also added
          # new pure-helper unit tests for versioning.storage.resolution
          # + extended system.core-test / branch-local-test. Together
          # pushed ALL FILES from 69.06 → 71.50 form (+2.44pp).
          #
          # Why 70 and not the older 72.8: integration suite is
          # deliberately OUT of the cloverage pass (its per-NS
          # attribution was misleading — see `bb coverage` docstring
          # + `[[feedback_coverage_measurement]]`). Integration code
          # paths run via `bb test` un-instrumented and are verified
          # by the integration tests' own pass/fail signal.
          COV_FLOOR=70
          if awk "BEGIN { exit !($COVERAGE < $COV_FLOOR) }"; then
            echo "Form coverage ${COVERAGE}% is below ${COV_FLOOR}% threshold"
            exit 1
          fi

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run security scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Create properties file with API key if provided
          if [ -n "$NVD_API_KEY" ]; then
            echo "nvd.api-key=$NVD_API_KEY" > cljwatson.properties
            bb security
          else
            # Without the key cljwatson runs the rate-limited path, which
            # fails on NVD throttling rather than on a real CVE — a red that
            # says nothing. Report, don't gate, until NVD_API_KEY is set as a
            # repo secret (then this branch stops being taken).
            echo "::warning::NVD_API_KEY not set — CVE scan runs unauthenticated and is advisory only"
            bb security || echo "::warning::CVE scan did not complete (no NVD key)"
          fi

  # Advisory, exactly like its `:info` group in scripts/checks.edn: antq exits
  # non-zero merely because an upgrade EXISTS, which is news, not a defect.
  outdated:
    name: outdated deps
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Check outdated dependencies
        run: bb outdated

  biome:
    name: biome (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm devDeps
        run: npm ci

      - name: Run biome
        run: npx biome check resources/packages/app/editor

  stylelint:
    name: stylelint (CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run stylelint
        run: npx stylelint 'resources/packages/app/editor/**/*.css'

  # Structural performance budgets — see perf/budgets.edn.
  #
  # This gate reads COUNTS, never durations: SQL round trips per operation,
  # fixture bootstraps per run, deltas that silently became full rebuilds. That
  # is what makes it safe to run unattended on a shared runner — a count is the
  # same number on a busy box as on an idle one, so this job cannot flake on its
  # neighbours the way a wall-clock assertion would.
  #
  # It re-runs the unit suite rather than reusing the `test` job's: budgets are
  # scoped to the suite that produced their report, and `test` runs `bb test`
  # (unit AND integration in one invocation), whose counters are a different
  # population. Jobs run in parallel, so this costs compute minutes, not wall
  # time.
  perf:
    name: perf (structural budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6
        with:
          path: ~/.m2
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Unit suite → perf/runs/unit.edn
        run: bb test-unit

      - name: Perf scenarios → perf/runs/perf.edn
        run: bb test-perf

      - name: Compare against perf/budgets.edn
        run: bb perf

  # The JS tests that need no graphden stack, run under node's `vm`: the shared
  # client runtime, the editor's type helpers, and the resolution-section
  # renderer over tools/runtime-test/mini-dom.js. No browser, no server — so no
  # chromium install here.
  tests-js:
    name: tests-js (no-stack JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: Run no-stack JS tests
        run: bb test-js

  shellcheck:
    name: shellcheck (.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck via Docker (globbed — same set as bb shellcheck)
        run: |
          # shellcheck disable=SC2046
          docker run --rm -v "$PWD:/src" -w /src \
            koalaman/shellcheck:v0.11.0 \
            dev/wtq/wt $(git ls-files '*.sh')

  registry-selftest:
    name: ci-selftest + devtour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - name: CI selector self-test (scripts/ci_select.clj + checks.edn)
        run: bb ci-test

      - name: Developer-tour drift guard
        run: bb devtour-check

  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0-debian < Dockerfile

      - name: Lint Dockerfile.build
        run: docker run --rm -i hadolint/hadolint:v2.12.0-debian < Dockerfile.build

      - name: Lint Dockerfile.crac
        run: docker run --rm -i hadolint/hadolint:v2.12.0-debian < Dockerfile.crac

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit, not just HEAD.
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --no-banner

  typos:
    name: typos (spelling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: crate-ci/typos@v1.48.0

  markdownlint:
    name: markdownlint (.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run markdownlint
        run: npx markdownlint-cli2

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint via Docker
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  lychee:
    name: lychee (link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Run lychee (online — verifies external HTTP links too)
        uses: lycheeverse/lychee-action@v2
        with:
          # Pin the SAME release `bb lychee` runs (bb.edn's docker tag).
          # Unpinned, CI drifted to a lychee whose config schema had moved
          # (`include_fragments` bool → mode) and died on the shared config.
          lycheeVersion: v0.24.2
          # Share ONE exclusion list with `bb lychee` (.lychee.toml) — without
          # it the online run dials the docs' localhost:9002 examples and
          # fails on connection-refused.
          args: |
            --config .lychee.toml
            --no-progress
            '**/*.md'
          fail: true

  trivy:
    name: trivy (CVE + misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run trivy fs (vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Same trivy release bb.edn runs locally (aquasec/trivy:0.70.0)
          # — the action otherwise bundles its own, so CI and local could
          # report different findings. The CVE DB itself stays fresh per
          # run (deliberate: new HIGH/CRITICAL on a pinned dep SHOULD
          # red CI even with no diff).
          version: v0.70.0
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: node_modules,target,.tools,.playwright-mcp,.git,.lsp

      - name: Run trivy config (Dockerfile misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,target,.tools
          # Path-scoped, documented misconfig exceptions for the dev/demo kind
          # manifests (CRIU caps + stock-postgres writable fs). The prod Helm
          # chart under deploy/helm is fully hardened + not exempted.
          trivyignores: .trivyignore.yaml

  license-check:
    name: license-check (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest

      - run: npm ci
      # npm ci — the committed lockfiles ARE the pin; a fresh resolve of
      # `^`-ranged deps could pull a transitive with a non-allowlisted
      # license and red this job with no diff.
      - run: (cd tools/browser-test && npm ci)
      - run: (cd tools/visual-tests && npm ci)

      - name: Run license-check across npm trees
        run: bb license-check

  commitlint:
    name: commitlint (PR commits)
    runs-on: ubuntu-latest
    # Only meaningful for PRs — `push` events don't have a base ref
    # to lint against without manual range selection.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch full history so we can lint every commit in the PR
          # range, not just HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run commitlint over the PR's commit range
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}

services:
  # PostgreSQL database
  # Uses plain PostgreSQL with recursive CTE for graph resolution
  postgres:
    image: postgres:16-alpine
    container_name: graphden-postgres
    environment:
      POSTGRES_DB: graphden
      POSTGRES_USER: graphden
      POSTGRES_PASSWORD: graphden
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # Uncomment for external access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphden -d graphden"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  executor:
    build: .
    container_name: graphden-executor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      STORAGE_TYPE: postgres
      JDBC_URL: jdbc:postgresql://postgres:5432/graphden
      DB_USERNAME: graphden
      DB_PASSWORD: graphden
      DB_POOL_SIZE: 10
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    ports:
      - "9002:8080"
    restart: unless-stopped

volumes:
  postgres_data:
    name: graphden-postgres-data

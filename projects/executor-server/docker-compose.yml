services:
  # Apache AGE - PostgreSQL with graph database extension
  # Provides O(1) graph resolution via Cypher queries
  age:
    image: apache/age:latest
    container_name: graphden-age
    environment:
      POSTGRES_DB: graphden
      POSTGRES_USER: graphden
      POSTGRES_PASSWORD: graphden
    volumes:
      - age_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # Uncomment for external access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphden -d graphden"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  executor:
    build: .
    container_name: graphden-executor
    depends_on:
      age:
        condition: service_healthy
    environment:
      PORT: 8080
      STORAGE_TYPE: age
      JDBC_URL: jdbc:postgresql://age:5432/graphden
      DB_USERNAME: graphden
      DB_PASSWORD: graphden
      DB_POOL_SIZE: 10
    ports:
      - "9002:8080"
    restart: unless-stopped

volumes:
  age_data:
    name: graphden-age-data

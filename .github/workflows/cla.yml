# CLA gate — every external pull request must carry a signed CLA before it
# can be merged. The PR-template checkbox is a reminder; THIS is the record.
#
# Why a CLA (assignment) and not a DCO: CLA.md assigns copyright to the
# project owner, which is what keeps dual licensing and the open-core split
# possible. A DCO only certifies origin and transfers nothing.
#
# Mechanics: contributor-assistant comments on the PR asking the author to
# reply with the exact sentence below; signatures are stored on the
# `cla-signatures` branch of this repository (never on develop/main) and
# the check goes green for every later PR by the same account.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/Graphden/graphden/blob/develop/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'Izpa,dependabot[bot],dependabot,bot*'
          custom-notsigned-prcomment: >-
            Thank you for the contribution. Before it can be merged, Graphden
            needs your agreement to the
            [Contributor License Agreement](https://github.com/Graphden/graphden/blob/develop/CLA.md).
            Reply to this pull request with the exact sentence below to sign it
            (once per account):
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false

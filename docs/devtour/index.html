he diff below trusts `:locked?` entries.\n     (when-let [holder (:service-locks-holder ctx)]\n       (when (pg-lock/ensure-live! holder)\n         (reassert-lock-ownership! (pg-lock/holder-conn holder) running-atom)))\n     ;; Drop stale ::not-our-lock placeholders so every lock-gated service\n     ;; we don't currently own is RE-ATTEMPTED this pass. This is what makes\n     ;; the periodic reconcile tick heal a crashed owner: the crash released\n     ;; its advisory slot (no NOTIFY), and here a sibling re-acquires it. A\n     ;; service still fully held by siblings is simply re-marked ::not-our-lock\n     ;; below, so the placeholder is transient, recomputed each pass.\n     (swap! running-atom (fn [m] (into {} (remove (fn [[_ v]] (= ::not-our-lock v))) m)))\n     (let [storage (:storage ctx)\n           lock-conn (lock-conn-from-ctx ctx)\n           ;; Shard filter (task #6): drop tenant services whose org this pod\n           ;; doesn't serve, so a dedicated tenant's services run only on its\n           ;; own cgroup-limited pod, never on a shared compile-all pod.\n           enabled-services (filterv #(service-in-shard? (:executor-orgs ctx) %)\n                                     (sp/query-entities storage :service {:enabled? true}))\n           enabled-by-id    (into {} (map (juxt :id identity)) enabled-services)\n           running          @running-atom\n           {:keys [to-start to-stop]} (diff-desired (keys enabled-by-id)\n                                                    (keys running))\n           ;; Config drift: a service that is enabled AND already running\n           ;; but whose running entry no longer matches the desired row —\n           ;; its :fn-id / :branch-id / :restart-policy was edited via a\n           ;; `:service` PUT. The membership diff misses these (the id is in\n           ;; both sets), so the edit was silently ignored until a pod\n           ;; restart. Stop+restart them to pick it up. `map?` skips the\n           ;; ::not-our-lock placeholder.\n           drifted (filterv (fn [sid]\n                              (let [entry (get running sid)\n                                    svc (get enabled-by-id sid)]\n                                (and (map? entry)\n                                     (or (not= (:fn-id entry) (:fn-id svc))\n                                         (not= (:branch-id entry)\n                                               (effective-branch-id svc))\n                                         (not= (:restart-policy entry)\n                                               (:restart-policy svc))\n                                         (not= (:cardinality entry)\n                                               (svc-schema/service-cardinality svc))\n                                         ;; pool-size edit (e.g. 3→2): the pod on\n                                         ;; the now-out-of-range slot restarts and\n                                         ;; fails to re-acquire, shrinking the pool.\n                                         (not= (:pool-size entry)\n                                               (svc-schema/effective-pool-size svc))))))\n                            (keys enabled-by-id))\n           to-stop  (vec (concat to-stop drifted))\n           to-start (vec (concat to-start drifted))\n           not-our-lock (atom [])]\n       (doseq [sid to-stop]\n         (stop-and-forget! lock-conn running-atom sid))\n       (doseq [sid to-start]\n         (let [svc (get enabled-by-id sid)\n               svc-ctx (ctx-for-service ctx svc)\n               branch-ctx-failed? (= ::branch-ctx-failed svc-ctx)\n               ;; `:per-pod` services (listeners behind a load balancer) skip\n               ;; the lock entirely — every pod runs its own (pool-size nil).\n               ;; `:singleton` races for slot 0 (pool-size 1); `:pool` races for\n               ;; the first free of its N slots. `slot` = the acquired slot, or\n               ;; nil when a sibling holds every slot (or no lock connection).\n               pool-size (svc-schema/effective-pool-size svc)\n               lock-gated? (some? pool-size)\n               slot (when (and lock-gated? (some? lock-conn))\n                      (acquire-pool-slot! lock-conn sid pool-size))\n               acquired? (or (not lock-gated?) (some? slot) (nil? lock-conn))]\n           (cond\n             ;; Branch ctx unavailable — error already logged; leave\n             ;; the row un-started so the periodic tick retries. Any\n             ;; acquired slot is NOT held for a start we didn't make.\n             branch-ctx-failed?\n             (do (swap! not-our-lock conj sid)\n                 (when (some? slot)\n                   (try (pg-lock/release-slot! lock-conn sid slot)\n                        (catch Exception e\n                          (log/warn e \"advisory lock release failed — continuing\"\n                                    {:service-id sid :slot slot})))))\n\n             acquired?\n             (let [entry (start-service! svc-ctx svc start-opts)\n                   ;; Record the EFFECTIVE :branch-id (row's, or the router's\n                   ;; default for legacy nil-branch rows) so stop time and\n                   ;; `restart-services-on-branch!` can tell which branch this\n                   ;; run belonged to. :cardinality mirrors the row so drift\n                   ;; detection sees an admin flipping it. :locked? = THIS pod\n                   ;; holds a slot; :pool-slot = which one (for release +\n                   ;; reassert).\n                   eff-branch (effective-branch-id svc)\n                   entry' (cond-> (assoc entry\n                                         :cardinality (svc-schema/service-cardinality svc)\n                                         :pool-size pool-size\n                                         :locked? (some? slot)\n                                         :pool-slot slot)\n                            eff-branch (assoc :branch-id eff-branch))]\n               (swap! running-atom assoc sid entry'))\n\n             :else\n             (do (swap! not-our-lock conj sid)\n                 (swap! running-atom assoc sid ::not-our-lock)))))\n       {:started (vec (remove (set @not-our-lock) to-start))\n        :stopped to-stop\n        :not-our-lock @not-our-lock}))))","gi":117},{"say":"The supervisor that actually keeps a fn running: invoke the target fn\n           via the executor and, on a startup failure, sleep + retry up to N\n           times per the row's `:restart-policy`, stamping `:start-failed-at` when\n           exhausted so reconcile will not busy-loop. The `how a service stays up`\n           answer that closes out the services half.","defn":"start-service!","ns":"graphden.services.reconciler","n":5,"file":"src/graphden/services/reconciler.clj","line":158,"code":"(defn start-service!\n  \"Run the service's fn through the supervisor: try `start-service-once!`,\n   on nil-stopper (start failure) sleep + retry up to N times per the\n   row's `:restart-policy`. Returns the `running`-atom entry shape:\n   `{:fn-id :restart-policy :stopper :started-at :start-attempts}`.\n\n   `:start-attempts` records how many tries it took (1 = success on\n   first attempt). When all retries are exhausted, `:stopper` is nil\n   and `:start-failed-at` is set — reconcile keeps the entry so we\n   don't busy-loop trying to start again on every reconcile pass.\n\n   The fn is invoked with an empty args map — services require the\n   target fn to have no free args (enforced at service-create time).\"\n  ([ctx svc] (start-service! ctx svc {}))\n  ([ctx svc {:keys [max-retries backoff-ms]\n             :or {max-retries default-max-retries\n                  backoff-ms default-backoff-ms}}]\n   (let [fn-id (:fn-id svc)\n         args {}\n         policy (:restart-policy svc)\n         max-attempts (if (should-retry? policy) (inc max-retries) 1)]\n     (loop [attempt 1]\n       (let [stopper (start-service-once! ctx svc args)]\n         (cond\n           ;; Success — the fn ran without throwing. Its return is the stopper,\n           ;; which may legitimately be nil (fire-and-forget); `stop-service!`\n           ;; tolerates a nil stopper, so only a THROWN start (the sentinel)\n           ;; counts as failure.\n           (not= stopper start-error)\n           {:fn-id fn-id\n            :restart-policy policy\n            :stopper stopper\n            :started-at (java.time.Instant/now)\n            :start-attempts attempt}\n\n           ;; Exhausted retries — give up, record the give-up time so\n           ;; admin can tell from the running map that we're stuck.\n           (>= attempt max-attempts)\n           (do (when (> attempt 1)\n                 (log/error \"service start exhausted retries\"\n                            {:service-id (:id svc) :attempts attempt}))\n               {:fn-id fn-id\n                :restart-policy policy\n                :stopper nil\n                :started-at (java.time.Instant/now)\n                :start-attempts attempt\n                :start-failed-at (java.time.Instant/now)})\n\n           ;; Retry — exponential backoff (1s, 2s, 4s, …).\n           :else\n           (let [delay-ms (* (long backoff-ms) (long (clojure.math/pow 2 (dec attempt))))]\n             (log/warn \"service start failed, retrying\"\n                       {:service-id (:id svc)\n                        :attempt attempt\n                        :next-delay-ms delay-ms\n                        :policy policy})\n             (Thread/sleep delay-ms)\n             (recur (inc attempt)))))))))","gi":118},{"say":"Opens the fleet half with its shared source of truth: the\n           `:placement` row mapping `(org, entry-fn-id)` → the executor holding\n           that cell, highest-epoch wins. Every fleet component reads or writes\n           this map, so it is the right foundation before routing and packing.","defn":"placement-for","ns":"graphden.fleet.placement","n":6,"file":"src/graphden/fleet/placement.clj","line":11,"code":"(defn placement-for\n  \"The current `:placement` row for `(org, entry-fn-id)`, or nil if unplaced.\n   Highest `:epoch` wins — defensive against a stale duplicate a partial move\n   might leave behind.\"\n  [storage org entry-fn-id]\n  (->> (sp/query-entities storage :placement {:org org :entry-fn-id entry-fn-id})\n       (sort-by :epoch >)\n       first))","gi":119},{"say":"The internal forward-hop: when a request lands on a pod that does not\n           hold the target cell, look up the holder in the placement map and\n           HTTP-forward there instead of returning `421`. How the placement map\n           becomes live cross-fleet routing.","defn":"forward-or-nil","ns":"graphden.fleet.router","n":7,"file":"src/graphden/fleet/router.clj","line":57,"code":"(defn forward-or-nil\n  \"If `(org, entry-fn-id)` is placed on a DIFFERENT executor than `self-id`,\n   forward `request` there and return the response. Returns nil when there is\n   no placement, or the cell is placed HERE (`self-id`) — the caller then\n   serves it (if held) or `421`s (the backstop). `self-id` nil (unset fleet\n   identity) ⇒ never forward.\"\n  [storage self-id port org entry-fn-id request]\n  (when self-id\n    (when-let [holder (placement/executor-for storage org entry-fn-id)]\n      (when (not= holder self-id)\n        (forward-request holder port request)))))","gi":120},{"say":"Folds a cell's structural cost (forward-closure fn-count) and live\n           load (the org's in-flight executions) into the single scalar the\n           packer and rebalancer order by. The load signal that drives every\n           placement decision below.","defn":"cell-weight","ns":"graphden.fleet.metrics","n":8,"file":"src/graphden/fleet/metrics.clj","line":57,"code":"(defn cell-weight\n  \"Fold structural cost + live load into the single scalar the packer orders by.\n\n   `load` is per-ORG (all of an org's cells share it), so Phase 1 attributes the\n   whole org load to each cell. That is exact for the common single-cell-per-org\n   deployment (an org app is one cell today, docs/FLEET_RFC.md §12) and\n   conservative otherwise — a busier org's cells simply sort heavier. Per-cell\n   load attribution is a Phase 2 refinement, gated on multi-cell orgs proving\n   common.\"\n  ([forward-deps storage org root-fn-id]\n   (cell-weight forward-deps storage org root-fn-id default-weights))\n  ([forward-deps storage org root-fn-id {:keys [w-fn-count w-load]}]\n   (+ (* w-fn-count (cell-fn-count forward-deps root-fn-id))\n      (* w-load (org-pending-load storage org)))))","gi":121},{"say":"The LPT (longest-processing-time-first) greedy packer: sort cells\n           heaviest-first and drop each on the least-loaded executor — the classic\n           makespan 2-approximation. It answers `what SHOULD the placement be` for\n           a from-scratch layout.","defn":"pack","ns":"graphden.fleet.packer","n":9,"file":"src/graphden/fleet/packer.clj","line":69,"code":"(defn pack\n  \"Assign every cell in `cells` to one of `executors`, LPT-greedy.\n\n   `cells`     — seq of `{:org :entry-fn-id :weight}` (weight from\n                 `fleet.metrics/cell-weight`).\n   `executors` — seq of executor-id strings.\n   `opts`      — optional `{:cell-fns {[org entry] #{fn-ids}} :w-overlap n}`.\n                 When `:w-overlap` > 0 and a cell's closure is in `:cell-fns`,\n                 placement prefers the pod that already holds more of it (co-\n                 locating cells that share code). Omitted / 0 ⇒ pure LPT.\n\n   Returns `{:placement {[org entry-fn-id] executor-id} :loads {executor-id\n   total-weight}}`, or nil when there are no executors to place onto. Heaviest\n   cell first, each onto the best target; equal-weight cells are ordered by\n   entry-fn-id so the output is stable.\"\n  ([cells executors] (pack cells executors {}))\n  ([cells executors {:keys [cell-fns w-overlap] :or {w-overlap 0.0}}]\n   (when (seq executors)\n     (let [execs (vec executors)\n           ordered (sort-by (juxt (comp - double :weight) :entry-fn-id) cells)]\n       (loop [remaining ordered\n              loads (zipmap execs (repeat 0.0))\n              pod-fns (zipmap execs (repeat #{}))\n              placement {}]\n         (if-let [cell (first remaining)]\n           (let [ck [(:org cell) (:entry-fn-id cell)]\n                 cfns (get cell-fns ck)\n                 target (best-target loads execs {:pod-fns pod-fns :cell-fns cfns\n                                                  :w-overlap w-overlap})]\n             (recur (next remaining)\n                    (update loads target + (double (:weight cell)))\n                    (if cfns (update pod-fns target into cfns) pod-fns)\n                    (assoc placement ck target)))\n           {:placement placement :loads loads}))))))","gi":122},{"say":"The churn-minimising planner: rather than diff against a fresh pack,\n           do steepest-descent (move one cell busiest → lightest while it strictly\n           reduces spread) with a `:min-improvement` hysteresis floor, emitting\n           the FEWEST moves. How a running fleet is nudged toward balance without\n           thrashing.","defn":"rebalance","ns":"graphden.fleet.rebalance","n":10,"file":"src/graphden/fleet/rebalance.clj","line":81,"code":"(defn rebalance\n  \"Plan the moves that rebalance `cells` over `executors`, given `current`\n   placement (`{[org entry] executor-id}`).\n\n   `opts` — `{:min-improvement <double> :max-moves <int> :w-overlap <double>}`.\n   `:min-improvement` (default 0.0) is the hysteresis floor: the plan is dropped\n   unless it improves imbalance by more than this. `:max-moves` caps the plan\n   size. `:w-overlap` (default 0.0) makes an imbalance-reducing move prefer a\n   destination that already holds the cell's code (needs cells carrying a\n   `:closure`); 0 keeps the pure churn-minimising descent.\n\n   Returns\n     `{:moves [{:org :entry-fn-id :from :to} ...]  ; churn-minimising, applied in order\n       :unplaced [[org entry-fn-id] ...]           ; cells needing an initial placement\n       :current-imbalance <double>\n       :planned-imbalance <double>\n       :improvement <double>}`.\n   `:moves` is empty when the fleet is already balanced within the floor.\"\n  [cells current executors {:keys [min-improvement max-moves w-overlap]\n                            :or {min-improvement 0.0 max-moves Integer/MAX_VALUE\n                                 w-overlap 0.0}}]\n  (let [exec-set (set executors)\n        placed? #(contains? exec-set (get current (cell-key %)))\n        placed (filter placed? cells)\n        unplaced (into [] (comp (remove placed?) (map cell-key)) cells)\n        weight-of (into {} (map (juxt cell-key (comp double :weight))) placed)\n        closure-of (into {} (keep (fn [c] (when-let [cl (:closure c)] [(cell-key c) cl]))) placed)\n        ;; Seed each pod's held-fn set from the cells currently on it, so overlap\n        ;; is scored against real contents. A moved cell's fns are ADDED to the\n        ;; destination as the descent proceeds (not removed from the source — an\n        ;; over-estimate that only affects the secondary tiebreak, never the exact\n        ;; imbalance descent).\n        init-pod-fns (reduce (fn [m c]\n                               (let [k (cell-key c) e (get current k)]\n                                 (if (and e (:closure c) (contains? m e))\n                                   (update m e into (:closure c))\n                                   m)))\n                             (zipmap executors (repeat #{}))\n                             placed)\n        init-loads (packer/loads-of placed current executors)\n        init-imb (imbalance init-loads)\n        result (loop [loads init-loads\n                      holder (select-keys current (map cell-key placed))\n                      pod-fns init-pod-fns\n                      moves []]\n                 (let [[lightest busiest] (extremes loads executors)]\n                   (if (or (= lightest busiest)\n                           (>= (count moves) max-moves)\n                           (nil? busiest))\n                     {:loads loads :moves moves}\n                     (if-let [{:keys [key]} (best-move loads holder weight-of closure-of\n                                                       pod-fns busiest lightest w-overlap)]\n                       (let [w (weight-of key)\n                             cl (get closure-of key)]\n                         (recur (-> loads (update busiest - w) (update lightest + w))\n                                (assoc holder key lightest)\n                                (cond-> pod-fns cl (update lightest into cl))\n                                (conj moves {:org (first key) :entry-fn-id (second key)\n                                             :from busiest :to lightest})))\n                       {:loads loads :moves moves}))))\n        final-imb (imbalance (:loads result))\n        improvement (- init-imb final-imb)\n        keep? (> improvement min-improvement)]\n    {:moves (if keep? (:moves result) [])\n     :unplaced unplaced\n     :current-imbalance init-imb\n     :planned-imbalance (if keep? final-imb init-imb)\n     :improvement improvement}))","gi":123},{"say":"The pure brain of one control pass: always emit initial placements for\n           unheld cells, but gate rebalance moves behind `:sustain-ticks` so\n           imbalance must PERSIST (not just spike) before cells move. Composes the\n           packer + rebalancer into the actual control policy.","defn":"plan-tick","ns":"graphden.fleet.control-loop","n":11,"file":"src/graphden/fleet/control_loop.clj","line":62,"code":"(defn plan-tick\n  \"Decide one control pass, PURE. Inputs:\n\n     inputs — `{:cells [{:org :entry-fn-id :weight}] :current {[org entry] exec}\n               :executors [id ...]}` — the live reading.\n     state  — the prior tick's state (`{:over-count n}`, `{}` on the first tick).\n     opts   — `{:min-improvement <double> :sustain-ticks <int> :max-moves <int>\n               :w-overlap <double>}` — `:w-overlap` > 0 makes initial placement\n               co-locate cells that share code (default 0 = pure load balance).\n\n   Returns\n     `{:initial-placements [{:org :entry-fn-id :to} ...]  ; apply every tick\n       :moves [{:org :entry-fn-id :from :to} ...]         ; apply only when sustained\n       :current-imbalance <double>\n       :state {:over-count n}}`.\n\n   Rebalance moves are held until the imbalance (already past the rebalancer's\n   magnitude floor) has recurred for `:sustain-ticks` consecutive ticks; the\n   counter resets when it fires or when a tick finds nothing worth moving.\n   Initial placements are NOT gated — new load lands at once.\"\n  [{:keys [cells current executors]} state {:keys [min-improvement sustain-ticks max-moves w-overlap]\n                                            :or {min-improvement 0.0 sustain-ticks 1\n                                                 max-moves Integer/MAX_VALUE w-overlap 0.0}}]\n  (let [{:keys [moves unplaced current-imbalance]}\n        (rebalance/rebalance cells current executors\n                             {:min-improvement min-improvement :max-moves max-moves\n                              :w-overlap w-overlap})\n        would-move? (boolean (seq moves))\n        over-count (if would-move? (inc (:over-count state 0)) 0)\n        fire? (and would-move? (>= over-count sustain-ticks))]\n    {:initial-placements (plan-initial-placements unplaced cells current executors\n                                                  {:w-overlap w-overlap})\n     :moves (if fire? moves [])\n     :current-imbalance current-imbalance\n     :state {:over-count (if fire? 0 over-count)}}))","gi":124},{"say":"The side-effecting driver the leader-locked component runs each tick:\n           read live cells + current placement, call `plan-tick`, then realise\n           each initial placement and sustained move through the `move-fn` seam.\n           The loop that ties the whole fleet together.","defn":"run-tick!","ns":"graphden.fleet.control-loop","n":12,"file":"src/graphden/fleet/control_loop.clj","line":150,"code":"(defn run-tick!\n  \"One control pass with side effects behind the `move-fn` seam. Reads the live\n   cells + current placement, decides via `plan-tick`, then realises the decision\n   by calling `move-fn` with `{:org :entry-fn-id :to-executor}` for each initial\n   placement and then each (sustained) move — `move-fn` owns the `move-cell!` +\n   directed transport. Returns the `plan-tick` decision (so the caller carries\n   `:state` to the next tick).\n\n   `env` — `{:storage :forward-deps :executors :move-fn}`. With `:w-overlap` > 0\n   in `opts`, cells are discovered WITH their closures so placement can co-locate\n   code-sharing cells.\"\n  [{:keys [storage forward-deps executors move-fn]} state opts]\n  (let [cells (discover-cells storage forward-deps\n                              {:with-closure? (pos? (double (:w-overlap opts 0.0)))})\n        current (current-placement storage)\n        decision (plan-tick {:cells cells :current current :executors executors} state opts)]\n    (doseq [{:keys [org entry-fn-id to]} (:initial-placements decision)]\n      (move-fn {:org org :entry-fn-id entry-fn-id :to-executor to}))\n    (doseq [{:keys [org entry-fn-id to]} (:moves decision)]\n      (move-fn {:org org :entry-fn-id entry-fn-id :to-executor to}))\n    decision))","gi":125},{"say":"Executes a single relocation as `run-tick!`'s `move-fn`: the load →\n           flip-epoch → evict dance that keeps the cell continuously served\n           (target compiles first, placement epoch bumps to reroute, source evicts\n           last). How an abstract `move` decision safely becomes a live cell\n           migration across pods.","defn":"move-cell!","ns":"graphden.fleet.controller","n":13,"file":"src/graphden/fleet/controller.clj","line":67,"code":"(defn move-cell!\n  \"Relocate `(org, entry-fn-id)`'s cell to `to-executor`, keeping it served\n   throughout (see ns docstring). Reads the current placement for the source +\n   epoch, so it also performs an INITIAL placement (no current holder ⇒ load +\n   assign, no evict).\n\n   `cmd` keys: `:org` `:entry-fn-id` `:to-executor` `:load-on` `:evict-on`.\n\n   Returns:\n     {:ok true  :from <id-or-nil> :to <id> :epoch <n>}          — moved.\n     {:ok true  :from <id> :to <id> :epoch <n> :noop true}      — already there.\n     {:ok false :reason :no-target}                             — nil target.\n     {:ok false :reason :target-load-failed :from <id> :to <id>} — aborted pre-flip.\"\n  [storage {:keys [org entry-fn-id to-executor load-on evict-on]}]\n  (locking move-monitor\n    (let [current (placement/placement-for storage org entry-fn-id)\n          from (:executor-id current)\n          epoch (:epoch current)]\n      (cond\n        (nil? to-executor)\n        {:ok false :reason :no-target}\n\n        (= from to-executor)\n        ;; Already placed here — idempotent success, no load/flip/evict churn.\n        {:ok true :from from :to to-executor :epoch epoch :noop true}\n\n        :else\n        (let [loaded? (try\n                        (boolean (load-on to-executor entry-fn-id))\n                        (catch Exception e\n                          (log/warn e \"move-cell! target load threw — aborting move (no flip)\"\n                                    {:org org :entry-fn-id entry-fn-id :to to-executor})\n                          false))]\n          (if-not loaded?\n            {:ok false :reason :target-load-failed :from from :to to-executor}\n            (let [new-epoch (inc (or epoch 0))]\n              ;; Flip the routing map: new requests forward to the target now; the\n              ;; source keeps serving whatever it already admitted.\n              (placement/assign! storage {:org org\n                                          :entry-fn-id entry-fn-id\n                                          :executor-id to-executor\n                                          :epoch new-epoch})\n              ;; Source drops the cell. Post-flip, so a failure only leaks the\n              ;; source's closure (reclaimed later) — the move already succeeded.\n              (when from\n                (try\n                  (evict-on from entry-fn-id)\n                  (catch Exception e\n                    (log/warn e \"move-cell! source evict threw — cell relocated, source closure leaked until reclaim\"\n                              {:org org :entry-fn-id entry-fn-id :from from}))))\n              {:ok true :from from :to to-executor :epoch new-epoch})))))))","gi":126}]},{"id":":tenancy","title":"Multi-tenancy","status":"toured","summary":"Orgs, RLS, grants, the two-layer effect gate, and per-request\n             tenant routing.","paths":["src/graphden/tenancy/","src/graphden/auth/"],"after":[":crud"],"steps":[{"say":"The opening stop — literally where a tenant request arrives. This\n           builds the `:app-router` seam the branch-router consults first:\n           resolve the tenant org from the request Host, look up that org's\n           handler fn, and run it org-scoped, sandboxed, and time-bounded.","defn":"make-app-router","ns":"graphden.tenancy.app-router","n":1,"file":"src/graphden/tenancy/app_router.clj","line":80,"code":"(defn make-app-router\n  \"Build the `:app-router` seam — `(fn [ctx request] ring-response-or-nil)`.\n   `org-resolver` + `base-domain` (subdomain) and `host-resolver` (custom\n   domain) feed `app-handler-target`; `timeout-ms` bounds the handler.\"\n  ([org-resolver base-domain host-resolver]\n   (make-app-router org-resolver base-domain host-resolver default-app-timeout-ms))\n  ([org-resolver base-domain host-resolver timeout-ms]\n   (fn [ctx request]\n     (when-let [org (resolve-app-org request org-resolver base-domain host-resolver)]\n       ;; Read the handler fresh per request — a single indexed unique-name\n       ;; `:org` lookup, negligible next to the graph-handler `execute` below,\n       ;; and always current (a `set-org-handler!` deploy takes effect at once).\n       (let [handler-fn-id (read-handler-fn-id (:storage ctx) org)]\n         (cond\n           ;; Wrong executor → 421, for either reason (checked BEFORE the\n           ;; handler verdict so it never reads as \"not deployed\"):\n           ;;   - the org isn't in this pod's shard (nothing of theirs is\n           ;;     compiled here);\n           ;;   - it's a `:byo` org on a hosted pod — the graph is stored here\n           ;;     but running it is the customer's executor's job. A BYO\n           ;;     executor pod (`:byo-executor?`) serves it. `:org` is read in\n           ;;     the platform context, same as `read-handler-fn-id` above.\n           (or (not (cr/org-in-shard? (:executor-orgs ctx) org))\n               (and (not (:byo-executor? ctx)) (tc/byo-org? (:storage ctx) org)))\n           ;; Fleet forward-hop (T2.6): before 421'ing, ask the `:fleet-forward`\n           ;; seam whether this org's cell is placed on another executor and, if\n           ;; so, proxy the request there. nil (no placement, byo, or no seam) →\n           ;; the 421 backstop. `handler-fn-id` is the cell's entry.\n           (or (when-let [fwd (:fleet-forward ctx)]\n                 (fwd request org handler-fn-id))\n               app-misdirected)\n\n           (not handler-fn-id)\n           app-not-configured\n\n           :else\n           (let [result\n                 (cr/run-with-timeout\n                   timeout-ms\n                   (fn []\n                     ;; Cooperative cancellation: each `execute` step calls\n                     ;; `check-cancel!`, so on `future-cancel` (interrupt) a graph\n                     ;; handler aborts instead of leaking a thread.\n                     (binding [cr/*cancel-check*\n                               #(when (Thread/.isInterrupted (Thread/currentThread))\n                                  (throw (InterruptedException. \"app handler cancelled\")))]\n                       ;; Run INSIDE the sandbox (binding lands on the future's\n                       ;; thread, where the thunk runs): `:allowed-effects` forbids\n                       ;; env/io/network/process; `:execute-guard` nil — the app is\n                       ;; the org's PUBLIC face, not a user-gated `/api/execute`;\n                       ;; `*current-org*` bound so OrgScoped confines reads.\n                       (tc/with-org org\n                                    (cr/execute (assoc ctx\n                                                       :allowed-effects cr/default-cloud-allowed-effects\n                                                       :execute-guard nil)\n                                                handler-fn-id\n                                                {:request request})))))]\n             (cond\n               ;; run-with-timeout returns ITS namespace's sentinels\n               ;; (`::compile-runtime/{timeout,error}`) — must be matched\n               ;; qualified (`::cr/…`), NOT bare `::timeout`/`::error`\n               ;; (which would resolve to THIS ns and silently never\n               ;; match → an errored handler returns the raw sentinel\n               ;; keyword instead of a 500). byo.clj does this correctly.\n               (identical? result ::cr/timeout) app-timeout\n               (identical? result ::cr/error) app-error\n               :else result))))))))","gi":127},{"say":"The pluggable identification protocol: Ring request → principal map\n           (`:authenticated?`, plus `:user` / `:org`). This injectable seam is how\n           core's single-token check is swapped for a tenant-aware one.","defn":"AuthProvider","ns":"graphden.auth.provider","n":2,"file":"src/graphden/auth/provider.clj","line":18,"code":"(defprotocol AuthProvider\n\n  (authenticate\n    [this request]\n    \"Given a Ring request, return a principal map. The only REQUIRED key\n     is `:authenticated?` (bool). A real (addon) provider also returns\n     `:user` / `:org` for tenant scoping. MUST NOT throw — an\n     unauthenticated request returns `{:authenticated? false}`.\"))","gi":128},{"say":"The addon's `AuthProvider` that resolves a bearer token to\n           `{:user :org}` (hash-matched). The piece that adds the `:org`, turning\n           the addon from a safe no-op into real multi-tenancy.","defn":"token-map-provider","ns":"graphden.tenancy.auth","n":3,"file":"src/graphden/tenancy/auth.clj","line":43,"code":"(defn token-map-provider\n  \"An `AuthProvider` over a static `{token → {:user … :org …}}` map. Tokens\n   are hashed at construction; a request's bearer is matched by hash.\"\n  [token->principal]\n  (let [by-hash (into {} (map (fn [[t p]] [(sha256-hex t) p])) token->principal)]\n    (->TokenAuthProvider\n      (fn [token]\n        (when-not (str/blank? token)\n          (get by-hash (sha256-hex token)))))))","gi":129},{"say":"Extracts the org id from the authenticated principal and feeds the\n           `*current-org*` thread-local that all scoping reads. Exactly how `who\n           you are` becomes `which org's data you see`.","defn":"org-from-principal","ns":"graphden.tenancy.context","n":4,"file":"src/graphden/tenancy/context.clj","line":49,"code":"(defn org-from-principal\n  \"The org id carried by an auth principal — the addon's provider sets\n   `:org` (see `auth/AuthProvider`). Falls back to the shared public org\n   when absent (single-token mode never sets `:org`).\"\n  [principal]\n  (or (:org principal) public-org))","gi":130},{"say":"The central orchestrator wiring every other piece together:\n           authenticate, bind the org, reject cross-org / wrong-pod, gate effects,\n           enforce grants, then run the handler. The heart of the tour — read the\n           steps below as expansions of what this one calls.","defn":"request-scope","ns":"graphden.tenancy.addon","n":5,"file":"src/graphden/tenancy/addon.clj","line":491,"code":"(defmethod ig/init-key :tenancy/request-scope [_ {:keys [grant-store org-resolver base-domain host-resolver\n                                                         org-rate-max-per-min org-rate-window-ms]}]\n  ;; (fn [ctx request thunk] …) — authenticate, bind the org, restrict\n  ;; effects, enforce grants, then run the handler. A request the provider\n  ;; can't authenticate (or one with no `:org`) is public → unrestricted,\n  ;; exactly as a single-tenant deployment behaves. Grant enforcement is\n  ;; OPT-IN: only when a `:grant-store` is wired (else writes pass, subject\n  ;; only to OrgScopedStorage + the effect gate). Every non-403 response\n  ;; carries `X-Graphden-Capabilities` so the editor can gate affordances.\n  ;; Per-ORG fixed-window limiter over ALL tenant API requests (auth\n  ;; endpoints have their own per-IP limiters in :tenancy/user-ops). The\n  ;; default is generous — the editor legitimately bursts (layout + types +\n  ;; partials per interaction) — and it exists to blunt runaway loops and\n  ;; scripted abuse, not to meter honest use. 0 disables. Keyed by org, not\n  ;; IP: one org hammering from many IPs is throttled; many orgs behind one\n  ;; NAT are not collectively punished. Platform/public is never limited.\n  (let [org-rate-max (or org-rate-max-per-min 600)\n        org-limiter (when (pos? org-rate-max)\n                      (users/make-rate-limiter org-rate-max\n                                               (or org-rate-window-ms 60000)))]\n    (fn [ctx request thunk]\n      (let [principal (when-let [p (:auth-provider ctx)]\n                        (auth/authenticate p request))\n            ;; Org AUTHORITY is the authenticated principal (single-membership:\n            ;; the token carries the user's org). The `Host` subdomain (§3.2) is\n            ;; a routing GUARD, never a widener — it must NOT be able to set the\n            ;; org context to one the principal doesn't belong to, or any caller\n            ;; could read another org's data by spoofing the Host. So: the\n            ;; subdomain only ever DENIES (a tenant on a foreign subdomain →\n            ;; cross-org → 403); it never grants. Anonymous (no principal) → the\n            ;; subdomain is ignored → public.\n            org (tc/org-from-principal principal)\n            ;; The org the Host points at: a `<org>.<base-domain>` subdomain\n            ;; (§3.2) or a verified custom domain (R10). Same guard semantics\n            ;; either way — it can only deny, never widen.\n            host-org (or (subdomain/org-from-request org-resolver request base-domain)\n                         (domain/org-from-request host-resolver request))\n            cross-org? (and host-org\n                            (not= org tc/public-org)\n                            (not= host-org org))\n            ;; BYO refusal: a `:byo` org runs on the customer's own executor, so\n            ;; a HOSTED pod must not serve it. Read `:org` HERE (public context,\n            ;; before `with-org` binds the tenant org — `:org` is tenant-hidden\n            ;; once scoped). A BYO executor pod (`:byo-executor?`) skips the\n            ;; refusal for the orgs in its shard.\n            byo-refused? (and (not (:byo-executor? ctx))\n                              (tc/byo-org? (:storage ctx) org))\n            ;; Per-request memo over the singleton grant-store, shared by every\n            ;; `grants-for` consumer this request: the coarse gate, the header\n            ;; builders (capabilities runs `can?` per action cap + workspace\n            ;; once), and the storage write guard (fires per row on a batch\n            ;; write). Without it each is a fresh `:grant` query. Bound onto\n            ;; `*request-grant-store*` below so the init-time guard closure picks\n            ;; it up. Fresh atom per request, read-only window (no grant mutation\n            ;; between), so it can't serve stale grants.\n            header-grant-store (when grant-store (grant/memoizing-grant-store grant-store))\n            ;; Run the handler, attach the capability header, and map a\n            ;; per-namespace `:authz/forbidden` thrown at the storage layer to\n            ;; a clean 403 (the storage guard is where the target namespace is\n            ;; known — see tenancy.authz).\n            run (fn []\n                  (try\n                    (with-tenancy-headers\n                      (thunk)\n                      (request-capabilities header-grant-store principal org)\n                      (request-workspace header-grant-store principal org))\n                    (catch clojure.lang.ExceptionInfo e\n                      (let [t (:type (ex-data e))]\n                        (cond\n                          (= :authz/forbidden t) forbidden-response\n                          (domain-error-status t) (domain-error-response t (domain-error-status t))\n                          :else (throw e))))))]\n        ;; `*current-principal*` is read by the storage-layer per-namespace\n        ;; guard; `*current-org*` scopes storage + RLS;\n        ;; `*request-grant-store*` shares the per-request grant memo with the\n        ;; storage guard (which fires per row on a batch write) + the coarse\n        ;; gate below, collapsing all of them to ONE `:grant` query per subject.\n        (binding [tc/*current-principal* principal\n                  grant/*request-grant-store* header-grant-store]\n          (tc/with-org org\n                       (cond\n                         ;; Cross-org (§3.2): an authenticated tenant whose org\n                         ;; doesn't match the Host subdomain → wrong workspace →\n                         ;; 403. Guards against Host-spoofing to reach another\n                         ;; org; the subdomain can only deny, never widen.\n                         cross-org?\n                         forbidden-response\n                         ;; Wrong pod: this executor's shard doesn't include the\n                         ;; request's org, so its fns were never compiled here.\n                         ;; Runs AFTER the cross-org check so a Host-spoofing\n                         ;; attempt still gets 403 rather than a routing hint,\n                         ;; and BEFORE the public-org short-circuit so a\n                         ;; misconfigured shard (one that omits the public org,\n                         ;; where the platform packages live) fails loudly at the\n                         ;; first request instead of 404'ing every fn.\n                         ;; Wrong executor → 421, for either reason: the org\n                         ;; isn't in this pod's shard, OR it's a `:byo` org on a\n                         ;; hosted pod (its graph lives here but running it is\n                         ;; the customer's executor's job — `byo-refused?`).\n                         (or (not (cr/org-in-shard? (:executor-orgs ctx) org))\n                             byo-refused?)\n                         misdirected-response\n                         ;; Platform / admin — no restriction.\n                         (= org tc/public-org)\n                         (run)\n                         ;; Tenant over its org-wide request-rate window → 429\n                         ;; before any work runs. After the public short-circuit\n                         ;; (platform is never limited), before the grant gate\n                         ;; (a limited org shouldn't pay the grant query either).\n                         (and org-limiter (not (org-limiter org)))\n                         rate-limited-response\n                         ;; Tenant who isn't a writer/executor at all for this request →\n                         ;; 403 (the precise per-namespace check runs in `run` via the\n                         ;; storage guard).\n                         (and grant-store\n                              (not (grant/request-permitted? header-grant-store principal request org)))\n                         forbidden-response\n                         ;; Tenant — gate the request's effects, run. The\n                         ;; handler-level allow-list blocks the external-world\n                         ;; effects (env / io / network / process) so a tenant\n                         ;; can't drive them through a platform endpoint, but it\n                         ;; ALLOWS `:raw-sql`: the trusted handler reads storage\n                         ;; via `:pg-query` (a `:raw-sql`-recording base-fn) on\n                         ;; the tenant's behalf — gating it here 403'd essentially\n                         ;; every tenant request. The tenant's OWN submitted graph\n                         ;; is gated more strictly (WITHOUT `:raw-sql`) at the\n                         ;; execute boundary (`crud.fn-execution/apply-execute`\n                         ;; sets `:allowed-effects` on the exec ctx).\n                         ;;\n                         ;; A READ request additionally runs under the org-filtered\n                         ;; type-alias view (§4 Risk-2) so editor display paths\n                         ;; (value-form / types) resolve a tenant's `Foo`, never\n                         ;; another org's. Writes are NOT wrapped — registration\n                         ;; (rebuild) must reach the org-agnostic global; their\n                         ;; type-checks are filtered narrowly in crud.type-check.\n                         :else\n                         ;; Same tenant scope also turns on the error envelope:\n                         ;; internal failures (no whitelisted :type) surface as\n                         ;; \"Internal error, ref: <uuid>\" — full detail stays in\n                         ;; the server log under the ref. The binding conveys\n                         ;; into apply-execute's futures, so the async-persisted\n                         ;; row the history panel reads is scrubbed too.\n                         (binding [cr/*allowed-effects* cr/cloud-request-allowed-effects\n                                   cr/*scrub-internal-errors?* true]\n                           (if (= :read (grant/request->capability request))\n                             (typecheck/with-org-alias-view* run)\n                             (run))))))))))","gi":131},{"say":"Isolation layer one: a storage decorator that stamps `:org-id` on\n           writes and filters reads to `{current-org, public}`. The concrete\n           answer to `how is one org's data kept apart`, once the org is bound.","defn":"OrgScopedStorage","ns":"graphden.tenancy.storage","n":6,"file":"src/graphden/tenancy/storage.clj","line":308,"code":"(defrecord OrgScopedStorage\n  [base scoped? authorize-write]\n\n  sp/StorageCRUD\n\n  (create-entity\n    [_ entity-name data]\n    (guard-write! base authorize-write entity-name data nil)\n    (enforce-entity-quota! entity-name)\n    (sp/create-entity base entity-name\n                      (cond-> data (scoped? entity-name) stamp)))\n\n\n  (read-entity\n    [_ entity-name id]\n    (when-not (tenant-hidden? entity-name)\n      (let [row (sp/read-entity base entity-name id)]\n        (when-not (and row (scoped? entity-name) (not (visible? row))) row))))\n\n\n  (update-entity\n    [_ entity-name id data]\n    (guard-write! base authorize-write entity-name data id)\n    (if (scoped? entity-name)\n      ;; Only own rows are writable, and a tenant can never be reassigned.\n      (when (some-> (sp/read-entity base entity-name id) own?)\n        (sp/update-entity base entity-name id (dissoc data :org-id)))\n      (sp/update-entity base entity-name id data)))\n\n\n  (delete-entity\n    [_ entity-name id]\n    ;; Deletes are namespaced writes too (§4.3): an `:append-list` user removing\n    ;; a list-item, a `:write` user deleting a binding. `data` is nil — the guard\n    ;; reads the row by id to resolve its namespace.\n    (guard-write! base authorize-write entity-name nil id)\n    (if (scoped? entity-name)\n      (when (some-> (sp/read-entity base entity-name id) own?)\n        (sp/delete-entity base entity-name id))\n      (sp/delete-entity base entity-name id)))\n\n\n  (query-entities\n    [_ entity-name where]\n    (if (tenant-hidden? entity-name)\n      []\n      (cond-> (sp/query-entities base entity-name where)\n        (scoped? entity-name) (->> (filterv visible?)))))\n\n\n  (query-entities\n    [_ entity-name where opts]\n    (if (tenant-hidden? entity-name)\n      []\n      (cond-> (sp/query-entities base entity-name where opts)\n        (scoped? entity-name) (->> (filterv visible?)))))\n\n\n  (query-latest-per-group\n    [_ entity-name where group-cols]\n    (if (tenant-hidden? entity-name)\n      []\n      (cond-> (sp/query-latest-per-group base entity-name where group-cols)\n        (scoped? entity-name) (->> (filterv visible?)))))\n\n\n  sp/StorageBatchCRUD\n\n  (create-entities\n    [_ entity-name data-seq]\n    (run! #(guard-write! base authorize-write entity-name % nil) data-seq)\n    (sp/create-entities base entity-name\n                        (cond->> data-seq (scoped? entity-name) (mapv stamp))))\n\n\n  (read-entities\n    [_ entity-name ids]\n    (if (tenant-hidden? entity-name)\n      []\n      (cond-> (sp/read-entities base entity-name ids)\n        (scoped? entity-name) (->> (filterv visible?)))))\n\n\n  (update-entities\n    [_ entity-name data-seq]\n    ;; Per-row write guard (mirrors create/upsert): the tenant-forbidden\n    ;; type block has NO RLS backstop — those tables carry no `:org-id` — so\n    ;; a batch update/delete on them must be guarded here, not \"left to RLS\".\n    (run! #(guard-write! base authorize-write entity-name % (:id %)) data-seq)\n    ;; Strip any org reassignment.\n    (sp/update-entities base entity-name\n                        (cond->> data-seq\n                          (scoped? entity-name) (mapv #(dissoc % :org-id)))))\n\n\n  (upsert-entities\n    [_ entity-name data-seq]\n    (run! #(guard-write! base authorize-write entity-name % nil) data-seq)\n    (sp/upsert-entities base entity-name\n                        (cond->> data-seq (scoped? entity-name) (mapv stamp))))\n\n\n  (delete-entities\n    [_ entity-name ids]\n    (run! #(guard-write! base authorize-write entity-name nil %) ids)\n    (sp/delete-entities base entity-name ids))\n\n\n  (query-ref-many-owners\n    [_ entity-name field-name target-id]\n    (if (tenant-hidden? entity-name)\n      []\n      (let [owner-ids (sp/query-ref-many-owners base entity-name field-name target-id)]\n        (if (and (scoped? entity-name) (seq owner-ids))\n          ;; This was the ONLY read delegating to base UNFILTERED, and the\n          ;; junction table it reads (e.g. `fn_parent_ids`) has no RLS\n          ;; backstop — so a tenant could reverse-ref a shared/public row\n          ;; and learn owner-ids (and their count) across EVERY org (e.g. the\n          ;; \"parent of N graphs\" message on deleting a public base-fn).\n          ;; Post-filter owner-ids to rows the current org may SEE (own +\n          ;; public), matching every other read method.\n          (let [id->row (sp/read-entities base entity-name (vec owner-ids))]\n            (into []\n                  (keep (fn [id]\n                          (when-let [row (get id->row id)]\n                            (when (visible? row) id))))\n                  owner-ids))\n          owner-ids))))\n\n\n  sp/Storage\n\n  (initialize [_ schema] (sp/initialize base schema))\n\n\n  (close [_] (sp/close base))\n\n\n  sp/StorageIntrospection\n\n  (current-entities [_] (sp/current-entities base))\n\n\n  (current-fields [_ entity-name] (sp/current-fields base entity-name))\n\n\n  (current-enums [_] (sp/current-enums base))\n\n\n  (current-enum-values [_ enum-name] (sp/current-enum-values base enum-name))\n\n\n  (schema-metadata [_] (sp/schema-metadata base))\n\n\n  sp/GraphConstraints\n\n  (validate-no-dependency-c \n           request. The runtime half of RLS, and why the session variable is\n           reset on each borrow.","defn":"org-aware-datasource","ns":"graphden.tenancy.rls","n":8,"file":"src/graphden/tenancy/rls.clj","line":180,"code":"(defn org-aware-datasource\n  \"Wrap a `DataSource` so every borrowed connection carries\n   `graphden.current_org` set from `*current-org*` — making RLS enforce per\n   request without threading the org through every query. The wrap belongs\n   on the shared `:db/postgres` pool (not just the org-scoped path): every\n   borrow must (re)set the variable, or a stale value from a tenant borrow\n   would leak into a later admin borrow on the same physical connection.\"\n  ^DataSource [^DataSource ds]\n  (reify DataSource\n    (getConnection\n      [_]\n      (doto (DataSource/.getConnection ds) (set-session-org! (tc/current-org))))\n\n    (getConnection\n      [_ user password]\n      (doto (DataSource/.getConnection ds user password) (set-session-org! (tc/current-org))))\n\n    (getLoginTimeout [_] (DataSource/.getLoginTimeout ds))\n\n    (setLoginTimeout [_ seconds] (DataSource/.setLoginTimeout ds seconds))\n\n    (getLogWriter [_] (DataSource/.getLogWriter ds))\n\n    (setLogWriter [_ writer] (DataSource/.setLogWriter ds writer))\n\n    (getParentLogger [_] (DataSource/.getParentLogger ds))\n\n    (unwrap [_ iface] (DataSource/.unwrap ds iface))\n\n    (isWrapperFor [_ iface] (DataSource/.isWrapperFor ds iface))))","gi":134},{"say":"The pure grant decision: does a subject hold a capability in a\n           namespace (subject × capability × namespace, with `:admin` / `:write`\n           subsumption and dot-path coverage). The authorization primitive every\n           gate below calls into.","defn":"can?","ns":"graphden.tenancy.grant","n":9,"file":"src/graphden/tenancy/grant.clj","line":204,"code":"(defn can?\n  \"Does `subj` (`{:id user-id :name username}`) hold `capability` in\n   `ns-path`, per `store`? Default-deny. Stored-grant matching keys on\n   `(:id subj)`; `:name` only feeds the personal-namespace path.\"\n  [store subj capability ns-path]\n  (boolean (some #(grant-allows? % subj capability ns-path)\n                 (grants-for store subj))))","gi":135},{"say":"Builds the per-namespace write guard `OrgScopedStorage` runs: resolve\n           the target `:namespace-id` and deny (403) a write the principal lacks\n           the capability for. Where coarse org-scoping sharpens into per-namespace\n           write enforcement.","defn":"authorize-writer","ns":"graphden.tenancy.authz","n":10,"file":"src/graphden/tenancy/authz.clj","line":147,"code":"(defn authorize-writer\n  \"Build a write guard for OrgScopedStorage closing over the grant `store`\n   and `storage` (to resolve namespaces). Returns `(fn [entity-name data id])`\n   that throws `:authz/forbidden` for a tenant write the principal isn't\n   authorized for. Platform / admin (public org) is unrestricted.\n\n   §4.3 restricted editing — the required capability narrows by the edit:\n   - `:fn` that sets `:namespace-id` → `:write` on it.\n   - `:binding` → `:bind-args` when the delta touches ONLY `:value` (a value\n     tweak); `:write` otherwise (create / restructure / delete).\n   - `:binding-list-item` → `:append-list` (add / remove / reorder a list item).\n   `:write` and `:admin` subsume the narrow caps (`grant/cap-implies?`).\"\n  [store storage]\n  (fn [entity-name data id]\n    (when (not= (tc/current-org) tc/public-org) ; platform / admin: unrestricted\n      ;; Pick up the request-scope memo so a batch write shares ONE `:grant`\n      ;; query across all its rows instead of one per row.\n      (let [store (grant/request-store store)]\n        (case entity-name\n          :fn (cond\n                ;; create / namespace-move → `:write` on the TARGET namespace.\n                (contains? data :namespace-id)\n                (do\n                  (when-not (writable? store storage tc/*current-principal* (:namespace-id data))\n                    (throw (ex-info \"forbidden: no :write grant on the target namespace\"\n                                    {:type :authz/forbidden :namespace-id (:namespace-id data)})))\n                  ;; A MOVE of an EXISTING fn (id present) also needs `:write`\n                  ;; on the fn's CURRENT namespace — otherwise a holder of the\n                  ;; target namespace alone could pull a fn out of a namespace\n                  ;; they were deliberately not granted. A create (id nil) has\n                  ;; no source namespace to check.\n                  (when id\n                    (deny-write! store storage :write id)))\n                ;; delete / structural update (parent-ids, …) of an EXISTING fn —\n                ;; the delta carries no `:namespace-id`, so gate on the fn's OWN\n                ;; namespace (read by id). Without this a `:bind-args` holder,\n                ;; which passes the coarse `can-mutate?` gate, could delete or\n                ;; reparent ANY fn in the org, including namespaces it holds no\n                ;; grant on. (A create with no namespace — id nil — stays\n                ;; ungated: it lands as an org-owned rootless fn.)\n                id\n                (deny-write! store storage :write id))\n          :binding (deny-write! store storage\n                                (if (value-only-binding-delta? data) :bind-args :write)\n                                (binding-owner-fn-id storage data id))\n          :binding-list-item (deny-write! store storage :append-list\n                                          (list-item-owner-fn-id storage data id))\n          nil)))))","gi":136},{"say":"Builds the `:execute-guard` seam the executor consults once per\n           top-level call, throwing `:authz/forbidden` when the principal lacks\n           `:execute` on the fn's namespace. The admission seam for RUNNING a fn —\n           the execute-side mirror of the write guard.","defn":"authorize-executor","ns":"graphden.tenancy.authz","n":11,"file":"src/graphden/tenancy/authz.clj","line":205,"code":"(defn authorize-executor\n  \"Build an execute guard `(fn [ctx fn-id])` for the executor's `:execute-\n   guard` seam: it throws `:authz/forbidden` when the current principal lacks\n   `:execute` on the fn's namespace. Skips platform / admin (public org) and\n   system execution (no principal) — services / cron run unrestricted.\"\n  [store]\n  (fn [ctx fn-id]\n    (when (and (not= (tc/current-org) tc/public-org)\n               tc/*current-principal*)\n      (let [store (grant/request-store store)\n            storage (:storage ctx)\n            ns-id (:namespace-id (sp/read-entity storage :fn fn-id))]\n        (when-not (executable? store storage tc/*current-principal* ns-id)\n          (throw (ex-info \"forbidden: no :execute grant on the fn's namespace\"\n                          {:type :authz/forbidden :fn-id fn-id})))))))","gi":137},{"say":"Effect gate, layer one: the `*allowed-effects*` a tenant HTTP request\n           runs under — blocks env / io / network / process, but keeps `:raw-sql`\n           so the trusted handler can read storage on the tenant's behalf. Bound\n           by `request-scope`.","defn":"cloud-request-allowed-effects","ns":"graphden.executor.compile-runtime","n":12,"file":"src/graphden/executor/compile_runtime.clj","line":940,"code":"(def cloud-request-allowed-effects\n  \"The `*allowed-effects*` a TENANT HTTP REQUEST runs under at the handler\n   level (bound by `tenancy.addon`). Broader than\n   `default-cloud-allowed-effects` by exactly `:raw-sql`: the trusted platform\n   handler reads storage through `:pg-query` (a `:raw-sql`-recording base-fn)\n   ON THE TENANT'S BEHALF, so gating `:raw-sql` here would 403 essentially\n   every tenant request. It STILL blocks the external-world effects\n   `#{:env :io :network :process}`, so a tenant can't drive those through a\n   platform endpoint (defense in depth).\n\n   The tenant's OWN submitted graph is gated more strictly — WITHOUT\n   `:raw-sql` — at the execute boundary, where `crud.fn-execution/apply-execute`\n   puts `default-cloud-allowed-effects` on the exec ctx. So a tenant can't run\n   the raw-SQL escape hatch in their own fn, but the handler serving them can\n   read storage.\"\n  (conj default-cloud-allowed-effects :raw-sql))","gi":138,"see":[{"gi":131,"label":"request-scope"}]},{"say":"Effect gate, layer two: the stricter set (`#{:db :state :time\n           :random}`, no `:raw-sql`) placed on the exec ctx when a tenant's OWN\n           submitted graph runs. Closes the tour — even code a tenant authors\n           cannot reach the raw-SQL escape hatch or the outside world.","defn":"default-cloud-allowed-effects","ns":"graphden.executor.compile-runtime","n":13,"file":"src/graphden/executor/compile_runtime.clj","line":900,"code":"(def default-cloud-allowed-effects\n  \"The `:allowed-effects` value a restricted (cloud / user-graph)\n   ExecutionContext carries — the full vocabulary minus the\n   security-sensitive set, i.e. `#{:db :state :time :random}`.\n\n   The gate is ctx-based, so it's applied per-tenant: a USER-graph\n   execution runs in an org-ctx carrying this set (the tenancy addon\n   binds it — `tenancy.addon` / `tenancy.app-router`), while the PLATFORM\n   ctx stays unrestricted (the platform's own web-server / vault / config\n   NEED :network / :env / :io / :process, so the default ctx can't be\n   globally restricted).\"\n  (set/difference known-effects cloud-forbidden-effects))","gi":139}]}]}</script>
<script>
const MODEL = JSON.parse(document.getElementById('tour-data').textContent);
// flatten toured steps into a single ordered spine — index === step.gi
const SPINE = [];
MODEL.blocks.forEach(b => (b.steps||[]).forEach(s => SPINE.push({block:b, step:s})));

let cur = 0;            // current global step index into SPINE (or -1 = intro)
const hist = [];        // back-stack of previously-viewed indices

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// tiny markdown: paragraphs, `code`, **bold**, [text](url)
function md(src){
  return (src||'').split(/\n\s*\n/).map(p => {
    let h = esc(p);
    h = h.replace(/`([^`]+)`/g, (_,x)=>'<code class="inl">'+x+'</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, (_,x)=>'<b>'+x+'</b>');
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      (_,t,u)=>'<a href="'+esc(u)+'">'+esc(t)+'</a>');
    return '<p>'+h+'</p>';
  }).join('');
}

// minimal Clojure tokeniser -> highlighted HTML for one line
function hl(line){
  let out='', i=0;
  while(i<line.length){
    const c=line[i];
    if(c===';'){ out+='<span class=tok-cmt>'+esc(line.slice(i))+'</span>'; break; }
    if(c==='"'){ let j=i+1; while(j<line.length){ if(line[j]==='\\'){j+=2;continue;}
      if(line[j]==='"'){j++;break;} j++; }
      out+='<span class=tok-str>'+esc(line.slice(i,j))+'</span>'; i=j; continue; }
    if(c===':'){ let j=i+1; while(j<line.length && /[\w*+!?<>=./-]/.test(line[j])) j++;
      out+='<span class=tok-kw>'+esc(line.slice(i,j))+'</span>'; i=j; continue; }
    let j=i+1; while(j<line.length && line[j]!==';' && line[j]!=='"' && line[j]!==':') j++;
    out+=esc(line.slice(i,j)); i=j;
  }
  return out;
}

function codeBlock(step){
  const lines = step.code.split('\n');
  const rows = lines.map((ln,k)=>{
    const n = step.line + k;
    const head = k===0 ? ' head' : '';
    return '<div class="ln'+head+'"><span class=g>'+n+
      '</span><span class=c>'+hl(ln)+'</span></div>';
  }).join('');
  return '<div class=file>'+esc(step.file)+' — <b>'+esc(step.defn)+
    '</b></div><pre class=code>'+rows+'</pre>';
}

function seeBlock(step){
  if(!step.see||!step.see.length) return '';
  const chips = step.see.map(x=>
    '<a data-gi="'+x.gi+'">'+esc(x.label)+'</a>').join('');
  return '<div class=see><span class=lbl>see also</span>'+chips+'</div>';
}

function renderIntro(){
  cur=-1;
  document.getElementById('crumb').innerHTML='';
  document.getElementById('stage').innerHTML =
    '<div class=intro>'+md(MODEL.intro||'')+
    '<p style="margin-top:18px">Pick a step on the left, or press '+
    '<kbd>→</kbd> to start. <kbd>←</kbd>/<kbd>→</kbd> walk the spine; '+
    '<b>Back</b> returns along the path you actually took.</p></div>';
  paint();
}

function renderStub(b){
  document.getElementById('crumb').innerHTML='<b>'+esc(b.title)+'</b>';
  document.getElementById('stage').innerHTML =
    '<h2>'+esc(b.title)+'</h2><div class=say>'+md(b.summary||'')+'</div>'+
    '<div class=stub-note>Not toured yet — this block is a stub. '+
    'Code lives under:<div class=paths>'+
    (b.paths||[]).map(p=>'<code>'+esc(p)+'</code>').join('')+
    '</div><p style="margin:10px 0 0">Add steps to this block in '+
    '<code class=inl>docs/devtour/tour.edn</code>, then run '+
    '<code class=inl>bb devtour</code>.</p></div>';
  paint();
}

function go(gi, push){
  if(push && cur>=0) hist.push(cur);
  cur = gi;
  const {block, step} = SPINE[gi];
  document.getElementById('crumb').innerHTML =
    '<b>'+esc(block.title)+'</b> › step '+step.n+' / '+(block.steps||[]).length+
    ' — <code class=inl>'+esc(step.defn)+'</code>';
  document.getElementById('stage').innerHTML =
    '<div class=say>'+md(step.say)+'</div>'+seeBlock(step)+codeBlock(step);
  document.getElementById('stage').scrollTop=0;
  paint();
}

function paint(){
  document.querySelectorAll('.steps li').forEach(li=>
    li.classList.toggle('on', +li.dataset.gi===cur));
  document.getElementById('pos').textContent =
    cur<0 ? '' : ('step '+(cur+1)+' / '+SPINE.length);
  document.getElementById('prev').disabled = cur<=0;
  document.getElementById('next').disabled = cur>=SPINE.length-1;
  document.getElementById('back').disabled = hist.length===0;
}

function buildMap(){
  const map=document.getElementById('map');
  MODEL.blocks.forEach(b=>{
    const wrap=document.createElement('div');
    wrap.className='blk '+(b.status==='toured'?'toured':'stub');
    let html='<div class=blk-h><span class=t>'+esc(b.title)+'</span>'+
      '<span class=s>'+esc(b.summary||'')+'</span></div>';
    if(b.after&&b.after.length)
      html+='<div class=after>after: '+b.after.map(esc).join(', ')+'</div>';
    if(b.status==='toured'){
      html+='<ul class=steps>'+ (b.steps||[]).map(s=>
        '<li data-gi="'+s.gi+'">'+esc(s.defn)+'</li>').join('') +'</ul>';
    }
    wrap.innerHTML=html;
    if(b.status!=='toured')
      wrap.querySelector('.blk-h').onclick=()=>renderStub(b);
    wrap.querySelectorAll('.steps li').forEach(li=>
      li.onclick=()=>go(+li.dataset.gi,true));
    map.appendChild(wrap);
  });
}

document.getElementById('next').onclick=()=>{ if(cur<SPINE.length-1) go(cur+1,true); };
document.getElementById('prev').onclick=()=>{ if(cur>0) go(cur-1,true); };
document.getElementById('back').onclick=()=>{ if(hist.length) go(hist.pop(),false); };
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight' && cur<SPINE.length-1) go(cur<0?0:cur+1,true);
  if(e.key==='ArrowLeft' && cur>0) go(cur-1,true);
});
document.getElementById('stage').addEventListener('click',e=>{
  const a=e.target.closest('a[data-gi]');
  if(a){ e.preventDefault(); go(+a.dataset.gi,true); }
});

buildMap();
renderIntro();
</script>
</body>
</html>
